name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Type-check + Lint (fastest gate)
  # ─────────────────────────────────────────────
  typecheck-lint:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo typecheck
      - run: pnpm turbo lint
      # UX-005 tranche 1: eslint-plugin-jsx-a11y is registered in
      # apps/web/eslint.config.js at "warn" (so the `turbo lint` step above
      # does not fail on this repo's pre-existing violations) -- this is the
      # actual gate. It fails on any NEW (file:line|rule) pair not already in
      # scripts/ci/jsx-a11y-baseline.json, and on any STALE entry (fixed but
      # left listed), the same ratchet convention as empty-vs-error-guard.mjs
      # and raw-status-leak-guard.mjs. See that script for --report/
      # --write-baseline.
      - name: jsx-a11y ratchet guard (UX-005)
        run: node scripts/ci/jsx-a11y-ratchet-guard.mjs

  # ─────────────────────────────────────────────
  # Security: scan for known dev/test secrets in source
  # Fails the build if any hardcoded dev credential is found outside
  # test/spec/dist/node_modules/infra .env files.
  # ─────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for known dev secrets in source
        run: |
          set -euo pipefail
          PATTERNS=(
            "civitas_svc_secret_dev"
            "civitas_admin_cli_secret_dev"
            "civitasone-dev-secret"
            "civitasone-internal-dev-secret"
            "civitas_kc_dev_pw"
            "keycloak_dev_pw"
            "Civitas@123"
          )
          FOUND=0
          for pat in "${PATTERNS[@]}"; do
            # Search source code only; exclude test fixtures, dist, node_modules, .env files, and this workflow file itself
            if grep -rn "$pat" \
                services/ packages/ apps/web/src apps/mobile/lib \
                --include="*.ts" --include="*.tsx" --include="*.dart" \
                --include="*.json" --include="*.tf" \
                2>/dev/null \
              | grep -v "__tests__\|\.test\.\|\.spec\.\|/dist/\|node_modules\|\.env\|\.env\.example\|keycloak/civitasone-realm\.json"; then
              echo "FAIL: Known dev secret found in source: $pat"
              FOUND=1
            fi
          done
          # Also check keycloak realm for the specific placeholder - it should now use ${VAR} not the literal
          if grep -n '"secret": "civitas_svc_secret_dev"\|"secret": "civitas_admin_cli_secret_dev"' infra/keycloak/civitasone-realm.json 2>/dev/null; then
            echo "FAIL: Hardcoded Keycloak client secret still in realm JSON (should use \${VAR} placeholder)"
            FOUND=1
          fi
          if [ $FOUND -eq 1 ]; then
            echo ""
            echo "❌ Secret scan failed. Replace hardcoded dev secrets with environment variables."
            exit 1
          fi
          echo "✅ Secret scan passed — no hardcoded dev secrets found in source."

  # ─────────────────────────────────────────────
  # Job 2: Unit + integration tests (vitest)
  # Postgres on host port 5435 matches vitest defaults per service.
  # Bootstrap + migrations: scripts/ci/bootstrap-postgres.sh
  # ─────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostGIS-capable image, not plain postgres:16-alpine. Six location-service
        # migrations (0011, 0014, 0015, 0016, 0017, 0019) begin with CREATE EXTENSION
        # postgis and aborted on every run with `extension "postgis" is not
        # available`, which is why location-service carries the largest share of
        # schema drift (103 columns). The extension is installed by the bootstrapping
        # superuser in bootstrap_missing_schemas.sql, because postgis is not a trusted
        # extension and location_svc cannot create it. Verified locally against
        # postgis/postgis:16-3.4: postgis 3.4.3 available.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: civitas
          POSTGRES_PASSWORD: civitas_test
          POSTGRES_DB: civitas_test
        ports: ['5435:5432']
        # MEASURED, not assumed. Polling postgis/postgis:16-3.4 every 5s:
        #     5s  socket=READY  tcp=no      query=no
        #    ...
        #    45s  socket=READY  tcp=no      query=no
        #    50s  socket=READY  tcp=READY   query=1
        # A bare `pg_isready` uses the unix socket, and the postgres entrypoint runs a
        # temporary socket-only server while it executes the initdb scripts. So it
        # reported healthy at 5s — 45s before the container would accept a single TCP
        # connection. GitHub Actions would have marked the service up and started the
        # bootstrap against a server refusing connections.
        # Checking TCP explicitly flips at exactly the moment the first query succeeds.
        # Retries are raised to 20 (+30s start period, up to 230s) because the honest
        # check takes longer to pass than the misleading one did.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U civitas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s
    env:
      REDIS_URL: redis://localhost:6379
      QUEUE_DRIVER: memory
      JWT_SECRET: ci-test-secret-min-32-chars-long
      JWT_ALGORITHM: HS256
      NODE_ENV: test
      PGHOST: localhost
      PGPORT: '5435'
      PGUSER: civitas
      PGPASSWORD: civitas_test
      # Gates court-service's public-lookup.e2e.test.ts describe.skipIf -- every
      # dependency it needs (real Postgres, memory queue, NODE_ENV=test for the
      # devOtp escape hatch) is already provisioned above for other suites; this
      # was simply never turned on, so the ONLY test file covering the anonymous
      # OTP-request and case-status-lookup routes ran in exactly zero CI jobs.
      # These 3 vars are namespaced to court-service and are no-ops for every
      # other package's tests.
      COURT_E2E: '1'
      # Must equal the literal captchaToken public-lookup.e2e.test.ts sends
      # ("test-captcha-ok") -- verifyCaptcha() does a strict === compare with
      # no fallback default, so any other value here 401s that test.
      COURT_CAPTCHA_DEV_TOKEN: test-captcha-ok
      COURT_PII_KEY: ci-test-court-pii-key-32-chars-min
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter='./packages/*'
      - name: Bootstrap Postgres (per-service DBs + migrations)
        run: bash scripts/ci/bootstrap-postgres.sh
      # Coverage thresholds are enforced by the dedicated coverage-gate job
      # (`pnpm turbo coverage`). Passing `--coverage` here forces every package
      # to load `@vitest/coverage-v8` and apply root thresholds, which fails
      # packages that either lack the provider dep or are below the global bar.
      - name: Run all service tests
        # --continue: without it Turbo aborts the whole run at the FIRST failing
        # package, so a red CI reports exactly one broken service out of 71 and
        # each fix costs a full ~18min cycle just to reveal the next one. With
        # it, one run enumerates every failing package and the job still exits
        # non-zero, so the gate is unchanged — only the diagnostics improve.
        run: pnpm turbo test --continue

  # ─────────────────────────────────────────────
  # Job 2b: Integration tests (blocking gate)
  # Depends on the unit-test job. Requires DB access — service containers are
  # copied exactly from the `test` job so the environment is identical.
  # ─────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        # PostGIS-capable image — see the note on the `test` job above.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: civitas
          POSTGRES_PASSWORD: civitas_test
          POSTGRES_DB: civitas_test
        ports: ['5435:5432']
        # MEASURED, not assumed. Polling postgis/postgis:16-3.4 every 5s:
        #     5s  socket=READY  tcp=no      query=no
        #    ...
        #    45s  socket=READY  tcp=no      query=no
        #    50s  socket=READY  tcp=READY   query=1
        # A bare `pg_isready` uses the unix socket, and the postgres entrypoint runs a
        # temporary socket-only server while it executes the initdb scripts. So it
        # reported healthy at 5s — 45s before the container would accept a single TCP
        # connection. GitHub Actions would have marked the service up and started the
        # bootstrap against a server refusing connections.
        # Checking TCP explicitly flips at exactly the moment the first query succeeds.
        # Retries are raised to 20 (+30s start period, up to 230s) because the honest
        # check takes longer to pass than the misleading one did.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U civitas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s
    env:
      REDIS_URL: redis://localhost:6379
      QUEUE_DRIVER: memory
      JWT_SECRET: ci-test-secret-min-32-chars-long
      JWT_ALGORITHM: HS256
      NODE_ENV: test
      PGHOST: localhost
      PGPORT: '5435'
      PGUSER: civitas
      PGPASSWORD: civitas_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter='./packages/*'
      - name: Bootstrap Postgres (per-service DBs + migrations)
        run: bash scripts/ci/bootstrap-postgres.sh
      # Runs HERE and not in arch-guard because it needs a live database: it
      # compares every Drizzle column declaration against information_schema.
      # inspection-service declared findings.verification_evidence with no
      # migration creating it, so GET /api/v1/inspection/findings returned 500.
      # tsc cannot see this (it checks the model against itself) and coverage is
      # blind to it (a file can be 100% covered and still drift).
      # Ratcheted: fails on NEW drift and on baselined entries that were fixed
      # but left listed. Baseline = scripts/ci/schema-drift-baseline.json,
      # measured against a FRESHLY bootstrapped cluster — which is what this job
      # has. Deliberately run WITHOUT --allow-stale: that flag exists only for
      # hand-provisioned developer clusters, and stale detection must be strict
      # somewhere or a fixed-but-still-listed entry is never caught.
      - name: Schema drift guard (declared columns must exist in the DB)
        env:
          POSTGRES_ADMIN_USER: civitas
          POSTGRES_ADMIN_PASSWORD: civitas_test
        run: node scripts/ci/schema-drift-guard.mjs
      # PERF-002: an RLS'd tenant table with no index whose leading column is
      # tenant_id forces a sequential scan under RLS on every tenant-scoped
      # query, regardless of any other WHERE clause. The 2026-09-07 audit
      # found 271 such tables fleet-wide (measured from migration text); this
      # guard measures the LIVE cluster instead, so a new table lands with a
      # tenant_id index from day one instead of joining that backlog. Runs
      # here (not arch-guard) for the same reason as the schema drift guard
      # above: it needs a live, freshly bootstrapped database.
      - name: Tenant index guard (RLS tenant tables must have a leading tenant_id index)
        env:
          POSTGRES_ADMIN_USER: civitas
          POSTGRES_ADMIN_PASSWORD: civitas_test
        run: node scripts/ci/tenant-index-guard.mjs
      # PERF-022: the guard above runs as POSTGRES_ADMIN_USER=civitas, the
      # bootstrapping SUPERUSER — it bypasses bootstrap.generated.sql's
      # REVOKE ALL ON DATABASE ... FROM PUBLIC hardening entirely, so it
      # passes regardless of whether civitas_admin (the role
      # scripts/ci/bootstrap-postgres.sh's EVIDENCE_SUITE_DBS loop and
      # infra/db/bootstrap/grant_admin_readonly.sql actually grant CONNECT
      # to) can reach these databases at all. That is exactly how PERF-020's
      # CONNECT-privilege bug went uncaught by CI in the first place — this
      # step re-runs the SAME guard as civitas_admin itself, in
      # --write-baseline mode purely to reuse its existing "refuse to write
      # when any database is unreachable" check (mirrors
      # scripts/ci/schema-drift-guard.mjs's identical mechanism, and is
      # exactly what PERF-020's own review ran by hand to prove its fix) —
      # a real, live CONNECT-privilege assertion, not a restatement of the
      # ratchet above. The regenerated baseline is reverted immediately
      # since only the exit code (reachability) matters here, not its
      # content — the real ratchet gate already ran as civitas above.
      #
      # Scoped to tenant-index-guard.mjs only: schema-drift-guard.mjs had a
      # separate, pre-existing, PERF-022-unrelated defect (ai-agent-service
      # resolved to the wrong database name — civitas_ai-agent instead of
      # civitas_ai_agent — so it always reported one unrelated skip
      # regardless of role or grants), which would have made an equivalent
      # step for it permanently fail for a reason having nothing to do with
      # civitas_admin's grants. Fixed by PERF-023 (schema-drift-guard.mjs now
      # resolves ai-agent via the same DB_NAME_OVERRIDES mechanism as this
      # guard), so an equivalent civitas_admin-reachability step for it is no
      # longer blocked. Not added here — out of scope for this PR — flagged
      # separately rather than bundled in silently.
      - name: Tenant index guard — civitas_admin reachability (PERF-022)
        env:
          POSTGRES_ADMIN_USER: civitas_admin
          POSTGRES_ADMIN_PASSWORD: civitas_test
        run: |
          node scripts/ci/tenant-index-guard.mjs --write-baseline
          git checkout -- scripts/ci/tenant-index-baseline.json
      - name: Run integration tests
        run: pnpm exec vitest run tests/integration/

  # ─────────────────────────────────────────────
  # Job 3: Architecture guard (no cross-service SQL)
  # ─────────────────────────────────────────────
  arch-guard:
    name: Architecture Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      # REL-039: this job used to run ~24 independent guard checks as one
      # fail-fast `run:` sequence. Whichever guard broke first (in real CI:
      # CI config guard, or the "Reinstall deps" step below it) made GitHub
      # Actions skip every step after it, so guards like empty-vs-error,
      # raw-status-leak, tenant-table-RLS, nested-tx and evidence-suite-DBs
      # could silently stop executing for weeks while the job still showed
      # one red X that looked like it came from whichever guard failed
      # first — none of the guards after it were actually exercised. Every
      # step from here down is now `continue-on-error: true` with an `id`,
      # so a real failure shows as its own ⚠ in the step list instead of
      # skipping what follows, and the "Aggregate architecture guard
      # results" step at the bottom — the only thing that can fail this job
      # now — reads each step's true `outcome` (continue-on-error forces
      # `conclusion` to "success", which is why `outcome` and not
      # `conclusion` is what gets checked) and fails if any guard really
      # failed. The checkout/pnpm/node-setup/install above stay plain
      # fail-fast: with no repo checked out there is nothing for any guard
      # to meaningfully run against, so stopping the job here is correct,
      # not the bug this fixes. Deliberately kept as one job with
      # continue-on-error rather than ~24 parallel jobs: most of these
      # guards are pure text/AST analysis with no live-DB dependency (see
      # the per-guard comments below), so splitting would roughly 10x the
      # checkout+install overhead for no isolation benefit the aggregate
      # step doesn't already give — real money on a queue that is already
      # badly backlogged.
      - name: DB-per-service isolation guard (06-T2)
        id: db-per-service-guard
        continue-on-error: true
        run: node scripts/ci/arch-guard.mjs
      # Package exports guard (below) checks whether each package's declared
      # `main`/`types`/`exports` path resolves ON DISK. That is only a
      # meaningful check against compiled output — packages/* ship `dist/`,
      # not `src/` — so this job must build packages first. Without a build
      # here, every package's dist/ is simply absent and the guard fails
      # every entry point unconditionally, independent of whether the
      # exports map is actually correct.
      - name: Build packages
        id: build-packages
        continue-on-error: true
        run: pnpm turbo build --filter='./packages/*'
      # Catches a package whose `exports`/`main` points at a path that does not
      # exist on disk. render/storage/gov-adapters pointed at ./src/*.js while
      # shipping to dist/, so Node threw ERR_MODULE_NOT_FOUND at first import and
      # payroll/admin/knowledge died before binding a port — for ~20 hours, while
      # pm2 reported them "online" with empty error logs. tsc cannot see this
      # because it resolves via source paths, not the published exports map.
      - name: Package exports guard (entry points must resolve)
        id: package-exports-guard
        continue-on-error: true
        run: node scripts/ci/package-exports-guard.mjs
      # Every service must be declared in ecosystem.config.js (or it can never be
      # started) AND have a gateway route (or no client can reach it). `works` and
      # `metadata` were absent from the ecosystem entirely; `revenue` and
      # `metadata` had no gateway route — revenue carries the fleet's highest
      # line coverage (99.6%) and was completely unreachable.
      - name: Deployment declaration guard (startable + reachable)
        id: deployment-declaration-guard
        continue-on-error: true
        run: node scripts/ci/deployment-declaration-guard.mjs
      # Two config defects that no test can see, both of which shipped:
      #  - infra/db/bootstrap/bootstrap_remaining_services.sql was invoked by
      #    nothing (the file that IS invoked differs only by underscores vs
      #    hyphens and directory), so civitas_metadata/ml/revenue/works did not
      #    exist in CI. An SQL file that never runs cannot error.
      #  - `--health-cmd pg_isready` defaults to the unix socket, which the
      #    postgres entrypoint answers from a temporary server during initdb.
      #    Measured: socket READY at 5s, TCP not until 50s — so jobs started
      #    against a server refusing connections and failed later with
      #    'connection refused'.
      - name: CI config guard (bootstrap files invoked, health checks use TCP)
        id: ci-config-guard
        continue-on-error: true
        run: node scripts/ci/ci-config-guard.mjs
      # A test publishing a HARDCODED messageId against a real database must clear
      # it from _inbox.processed. markProcessed() returns false for a known id and
      # the consumer then RETURNS — no insert, no throw, so no retry and no dead
      # letter. inventory-service's serial-race test therefore passed the first
      # time it ever ran and failed on every run after, with a symptom that looks
      # like a concurrency defect in the code under test. CI is green on a fresh
      # database, so nothing else can see this.
      - name: Test ledger poison guard (hardcoded messageIds must be cleared)
        id: test-ledger-poison-guard
        continue-on-error: true
        run: node scripts/ci/test-ledger-poison-guard.mjs
      # UX-003: clerks were shown raw HTTP status codes and raw server text
      # (`Request failed (${res.status})`) instead of the catalogued
      # toHumanError copy. Fixture tests first (sabotage-checked — see the
      # UX-003 PR description), then the guard against the real tree.
      - name: Raw status-leak guard unit tests
        id: raw-status-leak-guard-tests
        continue-on-error: true
        run: pnpm exec vitest run tests/architecture/raw-status-leak-guard.test.ts
      - name: Raw status-leak guard (no raw status codes / "Request failed" copy, UX-003)
        id: raw-status-leak-guard
        continue-on-error: true
        run: node scripts/ci/raw-status-leak-guard.mjs
      - name: Check no cross-service DB joins
        id: no-cross-service-db-joins
        continue-on-error: true
        run: |
          # L1 rule: no service may import another service's schema
          if grep -r "from.*services/" services/*/src --include="*.ts" | grep -v "node_modules" | grep -v ".test.ts"; then
            echo "❌ Cross-service import detected"
            exit 1
          fi
          echo "✅ No cross-service imports"
      - name: Check no console.log in service src
        id: no-console-log
        continue-on-error: true
        run: |
          if grep -r "console\.log" services/*/src --include="*.ts" | grep -v ".test.ts" | grep -v "node_modules"; then
            echo "❌ console.log found in service source"
            exit 1
          fi
          echo "✅ No console.log in service source"
      - name: Check no exported 'any' type
        id: no-exported-any
        continue-on-error: true
        run: |
          # CLAUDE.md: no `any` typed exports (type/alias/value annotations).
          # Function-parameter `any` (e.g. Fastify handlers) is eslint territory.
          if grep -rnE 'export[[:space:]]+(type|interface)[[:space:]]+\w+[^=]*=[[:space:]]*any\b|export[[:space:]]+(const|let|var)[[:space:]]+\w+[[:space:]]*:[[:space:]]*any\b' \
               services/*/src --include="*.ts" \
               | grep -v ".test.ts" | grep -v "node_modules" | grep -v "eslint-disable"; then
            echo "❌ Exported 'any' type found"
            exit 1
          fi
          echo "✅ No exported any types"
      # This second checkout-time setup (pnpm/setup-node/install) predates
      # this fix and is left in place as-is (untouched dependency graph),
      # but it is exactly as capable of fail-fast-starving the remaining 8
      # guards as any guard above, so it gets the same continue-on-error +
      # id treatment rather than being a second, unfixed instance of REL-039.
      - uses: pnpm/action-setup@v4
        id: reinstall-pnpm-setup
        continue-on-error: true
      - uses: actions/setup-node@v4
        id: reinstall-node-setup
        continue-on-error: true
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - name: Reinstall deps (second half of this job)
        id: reinstall-deps
        continue-on-error: true
        run: pnpm install --frozen-lockfile
      - name: Ops regression locks (ecosystem workers + migrate-all inventory + migration rollback down-files + runbook lint)
        id: ops-regression-locks
        continue-on-error: true
        run: pnpm exec vitest run tests/ops/ecosystem-workers.test.ts tests/ops/migrate-all-inventory.test.ts tests/ops/migrate-rollback-down-files.test.ts tests/architecture/runbook-lint.test.ts

      - name: Tenant router adoption guard (Req 1.7)
        id: tenant-router-guard
        continue-on-error: true
        run: node scripts/ci/tenant-router-guard.mjs

      # PERF-001 fix-up: a live-reproduced review finding (raw session-level
      # SET app.tenant_id in two production migrations, surviving onto the next
      # client through PgBouncer transaction-mode pooling — see
      # infra/pgbouncer/pgbouncer.ini for the repro). Unit tests first (fixture
      # coverage for both the tenant-GUC and advisory-lock checks), then the
      # guard itself against the real tree.
      - name: Raw session GUC guard unit tests
        id: raw-session-guc-guard-tests
        continue-on-error: true
        run: pnpm exec vitest run tests/architecture/raw-session-guc-guard.test.ts
      - name: Raw session GUC guard (PgBouncer transaction-pool leak, PERF-001)
        id: raw-session-guc-guard
        continue-on-error: true
        run: node scripts/ci/raw-session-guc-guard.mjs

      # UX-001: fetchJson() never throws (apiClient.ts) — it resolves
      # { data: empty, source: "error" } on any failure — but the large
      # majority of page.tsx files decided "nothing to show" from
      # data.length === 0 alone, never also checking source, so a real
      # outage rendered identically to a genuinely empty tenant. Unit tests
      # first (fixture coverage for the checkSource() rule itself), then the
      # guard against the real tree (ratchet: fails on NEW violations and on
      # stale baseline entries, see scripts/ci/empty-vs-error-baseline.json).
      - name: Empty-vs-error guard unit tests (UX-001)
        id: empty-vs-error-guard-tests
        continue-on-error: true
        run: pnpm exec vitest run tests/architecture/empty-vs-error-guard.test.ts
      - name: Empty-vs-error guard (fetch failure vs genuinely-empty, UX-001)
        id: empty-vs-error-guard
        continue-on-error: true
        run: node scripts/ci/empty-vs-error-guard.mjs

      # SEC-010: tables created after an RLS isolation sweep (hrms
      # hrms_wfh_requests/hrms_shift_change_requests/hrms_audit_log/
      # integrations/integration_sync_log; admin reconciliation_breaks/
      # results; workflow dmn_tables) never got row-level security at all —
      # not even ENABLE — because this fleet's convention has been "create
      # the table now, RLS it in a later sweep migration." Pure migration-text
      # analysis (no live DB needed, unlike tenant-index-guard above), so it
      # runs here rather than in the Bootstrap Postgres job. Unit tests first
      # (fixture coverage for findTenantTableViolations() itself), then the
      # guard against the real tree (ratchet: fails on NEW violations and on
      # stale baseline entries, see scripts/ci/tenant-table-rls-baseline.json).
      - name: Tenant table RLS guard unit tests (SEC-010)
        id: tenant-table-rls-guard-tests
        continue-on-error: true
        run: pnpm exec vitest run tests/architecture/tenant-table-rls-guard.test.ts
      - name: Tenant table RLS guard (new CREATE TABLE + tenant_id must carry RLS in the same migration, SEC-010)
        id: tenant-table-rls-guard
        continue-on-error: true
        run: node scripts/ci/tenant-table-rls-guard.mjs

      # TX-011: replaces the ad-hoc, not-checked-in scan_nested_tx_v2.py
      # TX-001's sweep used, closing its 3 documented blind spots (arrow-
      # const repo functions, tenantTransaction()/scopedRead() as the OUTER
      # wrapper, and transitive nesting >1 call deep). Pure source-text
      # analysis (no live DB needed), so it runs here like the guards above.
      # Unit tests first (fixture coverage incl. both real fleet cases this
      # gap cites, in pre-fix and post-fix shape), then the guard against
      # the real tree (ratchet: fails on NEW violations and on stale
      # baseline entries, see scripts/ci/nested-tx-baseline.json — 3 genuine
      # pre-existing sites TX-001's own sweep missed, filed as TX-018).
      - name: Nested-transaction guard unit tests (TX-011)
        id: nested-tx-guard-tests
        continue-on-error: true
        run: pnpm exec vitest run tests/architecture/nested-tx-guard.test.ts
      - name: Nested-transaction guard (no db.transaction()/tenantTransaction()/scopedRead() nested inside another, directly or transitively, TX-011)
        id: nested-tx-guard
        continue-on-error: true
        run: node scripts/ci/nested-tx-guard.mjs

      # PERF-022: PERF-020 fixed civitas_admin's CONNECT privilege on 6
      # REVOKE-ALL-hardened databases by adding 6 entries to
      # scripts/ci/bootstrap-postgres.sh's EVIDENCE_SUITE_DBS array, but
      # nothing enforced that list against silently shrinking again — the
      # superuser-run guards in the Integration Tests job never exercise
      # civitas_admin's actual grants at all (a superuser bypasses REVOKE
      # ALL FROM PUBLIC entirely), so CI's gate could not have caught
      # PERF-020's original bug, and could not catch a future regression of
      # the same shape either. Pure text analysis (no live DB needed), so
      # it runs here like the guards above; see integration-tests' "civitas_
      # admin reachability" step for the live, end-to-end half of this fix.
      - name: Evidence-suite DBs guard unit tests (PERF-022)
        id: evidence-suite-dbs-guard-tests
        continue-on-error: true
        run: pnpm exec vitest run tests/architecture/evidence-suite-dbs-guard.test.ts
      - name: Evidence-suite DBs guard (EVIDENCE_SUITE_DBS must not shrink, PERF-022)
        id: evidence-suite-dbs-guard
        continue-on-error: true
        run: node scripts/ci/evidence-suite-dbs-guard.mjs

      # REL-014: the flaky-test policy had no enforcement — 12 hard-skipped
      # tests (.skip/.todo/xdescribe/xit/xtest) and 36 conditionally-skipped
      # tests (.skipIf on an unreachable dependency, plus Playwright's
      # test.skip(condition, msg) runtime form) passed CI silently, with no
      # required reason, no ticket, no expiry and no report anyone would
      # actually see — a skip added to turn a red build green could sit
      # forever with nobody the wiser. Pure text analysis (no live DB
      # needed), so it runs here like the guards above. Unit tests first
      # (fixture coverage for the classifier/comment-parser), then the guard
      # against the real tree (ratchet: fails on a NEW skip not yet added to
      # scripts/ci/flaky-skip-baseline.json via --write-baseline, on a STALE
      # baseline entry, and on any skip whose `// FLAKY-SKIP:` comment is
      # missing, empty, or past its `expires` date — same expiring-allowlist
      # mechanic as scripts/ci/cve-audit-gate.mjs). The inventory is written
      # to $GITHUB_STEP_SUMMARY too, so it shows up on the run page itself
      # instead of only in scrollback.
      #
      # Originally shipped with `if: always()` on both steps below as a
      # standalone opt-out of exactly the REL-039 fail-fast starvation this
      # commit fixes for the whole job (see the blame on this comment for
      # the original reasoning) — now redundant and replaced with the same
      # id + continue-on-error + aggregate pattern as every other guard in
      # this job, so these two are covered by the general fix instead of
      # carrying their own one-off workaround.
      - name: Flaky-skip guard unit tests (REL-014)
        id: flaky-skip-guard-tests
        continue-on-error: true
        run: pnpm exec vitest run tests/architecture/flaky-skip-guard.test.ts
      - name: Flaky-skip guard (every skip/skipIf must be inventoried + carry a reason or expiry, REL-014)
        id: flaky-skip-guard
        continue-on-error: true
        run: node scripts/ci/flaky-skip-guard.mjs

      # SEC-014: the authz-within-tenant scanner, made a durable tool. The
      # fleet's only prior version of this check was a one-time, not-checked-
      # in "Manual 2,110-handler scan" (docs/ENTERPRISE-GAP-REPORT-2026-09-07.md
      # SEC-014) verifying every mutating route handler calls a real
      # role/permission helper before touching the database -- a different
      # axis from tenant ISOLATION (tenant-table-rls-guard/tenant-router-guard
      # above): can any authenticated user of tenant A do anything any other
      # user of tenant A can do (.claude/skills/19-security-beyond-tenancy.md
      # S1). Pure source-text analysis (no live DB needed), so it runs here
      # like the guards above. Unit tests first (fixture coverage for
      # findAuthzViolations() itself), then the guard against the real tree
      # (ratchet: fails on NEW violations and on stale baseline entries, see
      # scripts/ci/authz-tenant-scanner-baseline.json).
      - name: Authz-tenant scanner unit tests (SEC-014)
        id: authz-tenant-scanner-tests
        continue-on-error: true
        run: pnpm exec vitest run tests/architecture/authz-tenant-scanner.test.ts
      - name: Authz-tenant scanner (mutating handlers must call a recognized authz helper, SEC-014)
        id: authz-tenant-scanner
        continue-on-error: true
        run: node scripts/ci/authz-tenant-scanner.mjs

      # PERF-008: queue.publish() call sites must pass an explicit messageId
      # (a retry with no explicit id gets a fresh random one from the bus's
      # own auto-generation, defeating consumer-side idempotent dedup).
      # Fixture tests first, then the guard against the real tree (ratchet:
      # fails on NEW violations and on stale baseline entries, see
      # scripts/ci/queue-publish-messageid-baseline.json).
      - name: Queue publish messageId guard unit tests (PERF-008)
        id: queue-publish-messageid-guard-tests
        continue-on-error: true
        run: pnpm exec vitest run tests/architecture/queue-publish-messageid-guard.test.ts
      - name: Queue publish messageId guard (explicit messageId required, PERF-008)
        id: queue-publish-messageid-guard
        continue-on-error: true
        run: node scripts/ci/queue-publish-messageid-guard.mjs

      # Follow-up to #1472 (sa-dashboard: "stop fabricating uptime/services
      # metrics") -- a CI guard for the same class of defect: a stat-tile-
      # shaped component (StatCard/StatCardGrid) passed a hardcoded
      # numeric/percentage literal for its value prop instead of a real
      # data-bound expression. A DIFFERENT pattern/granularity from the
      # FABRICATED_DATA gate in .github/workflows/ci.yml's screen-contract
      # step (scripts/contract/screen-map.mjs's scanForFabricatedArray,
      # COMP-004): that one flags a page-level hardcoded array/object of
      # multiple record-shaped entries on a page with NO loader at all; this
      # one flags a single scalar literal on one JSX attribute, independent
      # of whether the page has a loader. Pure source-text/AST analysis (no
      # live DB needed), so it runs here like the guards above. Fixture
      # tests first, then the guard against the real tree (ratchet: fails on
      # NEW violations and on stale baseline entries, see
      # scripts/ci/stat-tile-literal-baseline.json).
      - name: Stat-tile literal guard unit tests
        id: stat-tile-literal-guard-tests
        continue-on-error: true
        run: pnpm exec vitest run tests/architecture/stat-tile-literal-guard.test.ts
      - name: Stat-tile literal guard (no hardcoded numeric/percentage literals in stat tiles)
        id: stat-tile-literal-guard
        continue-on-error: true
        run: node scripts/ci/stat-tile-literal-guard.mjs

      # REL-039: this job's actual gate. Every guard above always reports
      # its own real outcome now instead of being skipped, but continue-on-
      # error also forces every one of those steps' `conclusion` to
      # "success" -- which is what stops one guard from skipping the rest --
      # so without this step the job as a whole would always go green no
      # matter how many guards really failed. `if: always()` runs it
      # unconditionally; it reads each guard's true `outcome` (unaffected by
      # continue-on-error) and is the only step that can fail this job.
      - name: Aggregate architecture guard results
        if: always()
        env:
          R_BUILD_PACKAGES: ${{ steps.build-packages.outcome }}
          R_DB_PER_SERVICE: ${{ steps.db-per-service-guard.outcome }}
          R_PACKAGE_EXPORTS: ${{ steps.package-exports-guard.outcome }}
          R_DEPLOYMENT_DECLARATION: ${{ steps.deployment-declaration-guard.outcome }}
          R_CI_CONFIG: ${{ steps.ci-config-guard.outcome }}
          R_TEST_LEDGER_POISON: ${{ steps.test-ledger-poison-guard.outcome }}
          R_RAW_STATUS_LEAK_TESTS: ${{ steps.raw-status-leak-guard-tests.outcome }}
          R_RAW_STATUS_LEAK: ${{ steps.raw-status-leak-guard.outcome }}
          R_NO_CROSS_SERVICE_DB_JOINS: ${{ steps.no-cross-service-db-joins.outcome }}
          R_NO_CONSOLE_LOG: ${{ steps.no-console-log.outcome }}
          R_NO_EXPORTED_ANY: ${{ steps.no-exported-any.outcome }}
          R_REINSTALL_PNPM_SETUP: ${{ steps.reinstall-pnpm-setup.outcome }}
          R_REINSTALL_NODE_SETUP: ${{ steps.reinstall-node-setup.outcome }}
          R_REINSTALL_DEPS: ${{ steps.reinstall-deps.outcome }}
          R_OPS_REGRESSION_LOCKS: ${{ steps.ops-regression-locks.outcome }}
          R_TENANT_ROUTER: ${{ steps.tenant-router-guard.outcome }}
          R_RAW_SESSION_GUC_TESTS: ${{ steps.raw-session-guc-guard-tests.outcome }}
          R_RAW_SESSION_GUC: ${{ steps.raw-session-guc-guard.outcome }}
          R_EMPTY_VS_ERROR_TESTS: ${{ steps.empty-vs-error-guard-tests.outcome }}
          R_EMPTY_VS_ERROR: ${{ steps.empty-vs-error-guard.outcome }}
          R_TENANT_TABLE_RLS_TESTS: ${{ steps.tenant-table-rls-guard-tests.outcome }}
          R_TENANT_TABLE_RLS: ${{ steps.tenant-table-rls-guard.outcome }}
          R_NESTED_TX_TESTS: ${{ steps.nested-tx-guard-tests.outcome }}
          R_NESTED_TX: ${{ steps.nested-tx-guard.outcome }}
          R_EVIDENCE_SUITE_DBS_TESTS: ${{ steps.evidence-suite-dbs-guard-tests.outcome }}
          R_EVIDENCE_SUITE_DBS: ${{ steps.evidence-suite-dbs-guard.outcome }}
          R_FLAKY_SKIP_GUARD_TESTS: ${{ steps.flaky-skip-guard-tests.outcome }}
          R_FLAKY_SKIP_GUARD: ${{ steps.flaky-skip-guard.outcome }}
          R_AUTHZ_TENANT_SCANNER_TESTS: ${{ steps.authz-tenant-scanner-tests.outcome }}
          R_AUTHZ_TENANT_SCANNER: ${{ steps.authz-tenant-scanner.outcome }}
          R_QUEUE_PUBLISH_MESSAGEID_TESTS: ${{ steps.queue-publish-messageid-guard-tests.outcome }}
          R_QUEUE_PUBLISH_MESSAGEID: ${{ steps.queue-publish-messageid-guard.outcome }}
          R_STAT_TILE_LITERAL_TESTS: ${{ steps.stat-tile-literal-guard-tests.outcome }}
          R_STAT_TILE_LITERAL: ${{ steps.stat-tile-literal-guard.outcome }}
        run: |
          fail=0
          check() {
            local label="$1" outcome="$2"
            if [ "$outcome" = "failure" ] || [ "$outcome" = "cancelled" ]; then
              echo "::error::${label} -- ${outcome}"
              fail=1
            else
              echo "ok: ${label} (${outcome})"
            fi
          }
          check "Build packages" "$R_BUILD_PACKAGES"
          check "DB-per-service isolation guard (06-T2)" "$R_DB_PER_SERVICE"
          check "Package exports guard" "$R_PACKAGE_EXPORTS"
          check "Deployment declaration guard" "$R_DEPLOYMENT_DECLARATION"
          check "CI config guard" "$R_CI_CONFIG"
          check "Test ledger poison guard" "$R_TEST_LEDGER_POISON"
          check "Raw status-leak guard unit tests" "$R_RAW_STATUS_LEAK_TESTS"
          check "Raw status-leak guard" "$R_RAW_STATUS_LEAK"
          check "Check no cross-service DB joins" "$R_NO_CROSS_SERVICE_DB_JOINS"
          check "Check no console.log in service src" "$R_NO_CONSOLE_LOG"
          check "Check no exported 'any' type" "$R_NO_EXPORTED_ANY"
          check "Reinstall pnpm setup (2nd half)" "$R_REINSTALL_PNPM_SETUP"
          check "Reinstall node setup (2nd half)" "$R_REINSTALL_NODE_SETUP"
          check "Reinstall deps (2nd half)" "$R_REINSTALL_DEPS"
          check "Ops regression locks" "$R_OPS_REGRESSION_LOCKS"
          check "Tenant router adoption guard" "$R_TENANT_ROUTER"
          check "Raw session GUC guard unit tests" "$R_RAW_SESSION_GUC_TESTS"
          check "Raw session GUC guard" "$R_RAW_SESSION_GUC"
          check "Empty-vs-error guard unit tests" "$R_EMPTY_VS_ERROR_TESTS"
          check "Empty-vs-error guard" "$R_EMPTY_VS_ERROR"
          check "Tenant table RLS guard unit tests" "$R_TENANT_TABLE_RLS_TESTS"
          check "Tenant table RLS guard" "$R_TENANT_TABLE_RLS"
          check "Nested-transaction guard unit tests" "$R_NESTED_TX_TESTS"
          check "Nested-transaction guard" "$R_NESTED_TX"
          check "Evidence-suite DBs guard unit tests" "$R_EVIDENCE_SUITE_DBS_TESTS"
          check "Evidence-suite DBs guard" "$R_EVIDENCE_SUITE_DBS"
          check "Flaky-skip guard unit tests" "$R_FLAKY_SKIP_GUARD_TESTS"
          check "Flaky-skip guard" "$R_FLAKY_SKIP_GUARD"
          check "Authz-tenant scanner unit tests" "$R_AUTHZ_TENANT_SCANNER_TESTS"
          check "Authz-tenant scanner" "$R_AUTHZ_TENANT_SCANNER"
          check "Queue publish messageId guard unit tests" "$R_QUEUE_PUBLISH_MESSAGEID_TESTS"
          check "Queue publish messageId guard" "$R_QUEUE_PUBLISH_MESSAGEID"
          check "Stat-tile literal guard unit tests" "$R_STAT_TILE_LITERAL_TESTS"
          check "Stat-tile literal guard" "$R_STAT_TILE_LITERAL"
          if [ "$fail" = "1" ]; then
            echo "One or more architecture guard steps failed -- see the individual step logs above (each now reports its own real result, never 'skipped')."
            exit 1
          fi
          echo "All architecture guard steps passed."

  # ─────────────────────────────────────────────
  # Job 4: Web build check
  # ─────────────────────────────────────────────
  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Build packages first
        run: pnpm turbo build --filter='./packages/*'
      - name: Build web app
        run: pnpm --filter @civitasone/web build | tee /tmp/web-build.log
        env:
          CIVITASONE_API_BASE_URL: http://localhost:8080
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
          SKIP_ENV_VALIDATION: true
      - name: Report bundle size
        # PERF-009 tranche 2: cheap, always-on visibility into route bundle
        # sizes on every PR. Deeper, per-module attribution is available on
        # demand via `pnpm --filter @civitasone/web run analyze` (wraps
        # @next/bundle-analyzer; opt-in, gated behind ANALYZE=true so it
        # never adds cost to a normal build), which writes
        # apps/web/.next/analyze/{client,nodejs,edge}.html.
        # PERF-009 tranche 3: now also diffs against a committed baseline
        # (scripts/ci/bundle-size-baseline.json, via bundle-size-guard.mjs --
        # same <name>-guard.mjs/<name>-baseline.json convention as
        # tenant-index-guard.mjs et al.) instead of reporting an absolute
        # size with nothing to compare it to. Still deliberately
        # informational, not a hard gate -- see the guard script's own
        # header for why; "budgets set and enforced" (this gap's own DoD)
        # remains real, disclosed future scope, not claimed here.
        # Purely informational -- must never fail the job itself, including
        # when the preceding build step failed (no route table to report).
        if: always()
        run: |
          {
            echo "### Web bundle size (this build)"
            echo '```'
            if grep -q "First Load JS shared by all" /tmp/web-build.log 2>/dev/null; then
              echo "Routes built: $(grep -cE '^(├|└) [○●ƒ] ' /tmp/web-build.log || true)"
              grep -A4 "First Load JS shared by all" /tmp/web-build.log
            else
              echo "(build did not reach the bundle summary -- see the build step's own log)"
            fi
            echo '```'
            echo
            echo "### Bundle size vs. baseline"
            echo '```'
            node scripts/ci/bundle-size-guard.mjs /tmp/web-build.log || echo "(bundle-size-guard.mjs found nothing to compare -- see message above)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

  # ─────────────────────────────────────────────
  # Job 5: Contract tests (gateway routing + screen chain)
  # Uses Vitest — runs both gateway and screen contract tests.
  # ─────────────────────────────────────────────
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: [typecheck-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter='./packages/*' --filter='./services/gateway-service'

      # REL-043: every gate below runs with `id` + `continue-on-error: true`,
      # and the "Require all contract-test gates to pass" step at the very end
      # is the only one that can fail the job.
      #
      # Why: a plain (non-continue-on-error) step stops the whole job at the
      # first failure, so any ONE red gate hides every gate listed after it.
      # That wasn't hypothetical -- it's exactly how this job was found
      # (REL-043): the RTL safety ratchet sat red for 363 commits, and nobody
      # could tell, because CI silently stopped there every run before reaching
      # cross-service-events, screens, render-smoke, or CRM link-integrity.
      # Simply reordering (e.g. moving rtl-check to run last) does not fix
      # this in general -- it only helps if rtl-check is the ONLY broken gate.
      # It isn't: verifying this fix, the cross-service-event and CRM
      # link-integrity gates below turned out to ALSO be independently red the
      # whole time, reproduced on a clean origin/main with none of this PR's
      # changes applied (pre-existing, NOT introduced or fixed by this PR --
      # flagged separately for the gap report, not silently left for the next
      # person to rediscover the same way REL-043 was found). With
      # continue-on-error, every gate always executes and reports its own
      # outcome in the Actions UI regardless of its neighbors, and the final
      # step below still fails the job overall if any gate is red -- one
      # broken gate can no longer hide another, permanently, not just for
      # today's specific red gate.
      - name: Run gateway contract tests (Vitest)
        id: gateway_contract
        continue-on-error: true
        run: pnpm exec vitest run tests/contract/gateway.contract.test.ts

      # Gate #9 (part 1) — design-token contrast. Runs in the unit suite (no
      # browser) so the single most common root cause of a fleet-wide WCAG
      # failure (someone lightening a text token) is caught in seconds.
      - name: Design-token contrast (WCAG 2.2 AA SC 1.4.3)
        id: design_tokens
        continue-on-error: true
        run: pnpm --filter @civitasone/web exec vitest run tests/a11y/design-tokens.test.ts

      # Gate #9 (part 2) — RTL safety ratchet. NOTE: the previous rtl-check.mjs
      # was a no-op (its failure condition `logicalRatio < 0` is impossible) and
      # was not wired into CI at all. It is now a real ratchet.
      - name: RTL safety ratchet
        id: rtl_check
        continue-on-error: true
        run: node scripts/ci/rtl-check.mjs

      # Gate #3 — consumer-driven cross-service event contract.
      # BLOCKING. Fails on any NEW dead subscription, phantom consumption,
      # unemitted event, or orphan event vs tests/contract/known-defects.json.
      # See docs/QA-GATES.md for the tracked-debt inventory and burn-down.
      # NOTE (REL-043): currently red on main independent of this PR -- see the
      # continue-on-error note above. swm-service appears to advertise
      # swm.bulk_generator.updated as unemitted; not investigated or fixed
      # here, flagged for its own ticket.
      - name: Run cross-service event contract tests (Vitest)
        id: cross_service_events
        continue-on-error: true
        run: pnpm exec vitest run tests/contract/cross-service-events.contract.test.ts
        env:
          QUEUE_DRIVER: memory
          JWT_SECRET: ci-test-secret-min-32-chars-long
      - name: Run screen contract tests — static chain analysis (Vitest)
        id: screens_contract
        continue-on-error: true
        run: pnpm exec vitest run tests/contract/screens.contract.test.ts
        env:
          QUEUE_DRIVER: memory

      # COMP-006 (tranche 2) — render-smoke / loader-manifest feature. The
      # static chain analysis above only covers screens with a loader it can
      # see; this actually renders every NO_LOADER screen (jsdom + RTL, no
      # backend needed) so a screen only ever counts as covered because it
      # was proven to render, not assumed. Regression gate (every
      # loader-manifest.json entry must still render cleanly) + informational
      # full sweep (writes render-smoke-report.json, the source for the
      # coverage number the "Screen Verification Gate" job below asserts).
      # Runs under apps/web's own vitest config (jsdom + @testing-library/
      # react) -- same reason the two steps above run --filter @civitasone/web.
      # REL-043: this is the step that motivated the fix -- confirmed GREEN
      # (473/544 NO_LOADER screens render cleanly, 91.1% coverage) once it was
      # actually allowed to run.
      - name: Run render-smoke contract test (Vitest, jsdom)
        id: render_smoke
        continue-on-error: true
        run: pnpm --filter @civitasone/web exec vitest run tests/contract/render-smoke.contract.test.ts

      # R5 — CRM contract / link integrity. BLOCKING. Fails on any /crm link
      # that points at a non-existent Next.js route (dead navigation tile) or
      # any CRM API path the web app calls that crm-service does not register.
      # NOTE (REL-043): currently red on main independent of this PR -- see the
      # continue-on-error note above. GrievanceActions.tsx and RtiActions.tsx
      # each call a /v1/crm/... path crm-service does not register; not
      # investigated or fixed here, flagged for its own ticket.
      - name: Run CRM link-integrity contract test (Vitest)
        id: crm_link_integrity
        continue-on-error: true
        run: pnpm exec vitest run tests/contract/crm-link-integrity.contract.test.ts
        env:
          QUEUE_DRIVER: memory

      # The actual gate for this job. Every step above always runs (regardless
      # of any other step's result) and records its own pass/fail as its
      # `outcome`; this is the one step that turns any non-"success" outcome
      # into a failed job. `if: always()` so it still runs and still enforces
      # the gate even if an earlier, unrelated step in the job were ever
      # cancelled or skipped outright -- continue-on-error alone only covers
      # a step that actually ran and failed.
      - name: Require all contract-test gates to pass
        if: always()
        run: |
          if [ "${{ steps.gateway_contract.outcome }}" != "success" ] || \
             [ "${{ steps.design_tokens.outcome }}" != "success" ] || \
             [ "${{ steps.rtl_check.outcome }}" != "success" ] || \
             [ "${{ steps.cross_service_events.outcome }}" != "success" ] || \
             [ "${{ steps.screens_contract.outcome }}" != "success" ] || \
             [ "${{ steps.render_smoke.outcome }}" != "success" ] || \
             [ "${{ steps.crm_link_integrity.outcome }}" != "success" ]; then
            echo "::error::One or more contract-test gates did not pass -- see the failing step(s) above for detail."
            exit 1
          fi

  # ─────────────────────────────────────────────
  # Job 6: Screen verification gate
  # Static analysis: every screen must be WIRED (gateway + route + migration).
  # Live check: every wired screen returns HTTP 200 against the mock gateway.
  # Fails the build on any MISSING or MISMATCH screen.
  # ─────────────────────────────────────────────
  verify-screens:
    name: Screen Verification Gate
    runs-on: ubuntu-latest
    needs: [typecheck-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter='./packages/*' --filter='./services/gateway-service'
      - name: Generate screen contract map (static analysis)
        run: node scripts/contract/screen-map.mjs
      - name: Gate — fail on MISSING, MISMATCH, or FABRICATED_DATA screens
        run: |
          node -e "
            const fs = require('fs');
            const map = JSON.parse(fs.readFileSync('scripts/contract/screen-map.json', 'utf8'));
            // COMP-006 fix-up: tracked, ID-tagged exceptions (see
            // scripts/contract/known-broken-chains.json) for screens whose
            // loader chain is real but the backend endpoint genuinely
            // doesn't exist yet (follow-up gap COMP-020) -- not a blanket
            // carve-out, and kept in the same file tests/contract/screens.
            // contract.test.ts reads, so both gates agree.
            const known = JSON.parse(fs.readFileSync('scripts/contract/known-broken-chains.json', 'utf8')).entries;
            const knownKeys = new Set(known.map(e => \`\${e.module}::\${e.screen}\`));
            const broken = map.rows.filter(r =>
              (r.status === 'MISSING' || r.status === 'MISMATCH' || r.status === 'FABRICATED_DATA') &&
              !knownKeys.has(\`\${r.module}::\${r.screen}\`)
            );
            if (broken.length > 0) {
              console.error('BROKEN SCREEN CHAINS:');
              broken.forEach(r => console.error(\`  [\${r.status}] \${r.module}\${r.screen}: \${r.detail}\`));
              process.exit(1);
            }
            console.log('All ' + map.counts.wired + ' screens are WIRED (' + knownKeys.size + ' tracked exceptions, see known-broken-chains.json).');
          "

      # COMP-006 (tranche 2) — coverage ratchet. A screen counts as covered
      # once it's WIRED *or* has a loader-manifest.json entry (see
      # apps/web/tests/contract/render-smoke.contract.test.ts, which is what
      # actually renders each entry and regresses the build if one breaks --
      # this step only re-checks the resulting PERCENTAGE, cheaply, without
      # needing jsdom/RTL in this job). FLOOR is a ratchet, same pattern as
      # scripts/ci/rtl-check.mjs: it must only go up. Raise it when a future
      # tranche's real, re-verified coverage clears it with room to spare --
      # never lower it to make a change land.
      - name: "Gate — Screen Verification Gate coverage ratchet (COMP-006 DoD: >=90%)"
        run: |
          node -e "
            const fs = require('fs');
            const FLOOR_PCT = 90;
            const map = JSON.parse(fs.readFileSync('scripts/contract/screen-map.json', 'utf8'));
            const manifest = JSON.parse(fs.readFileSync('scripts/contract/loader-manifest.json', 'utf8'));
            const totalPages = map.counts.totalPages;
            if (!totalPages) {
              console.error('screen-map.json has no counts.totalPages -- regenerate with the current scripts/contract/screen-map.mjs.');
              process.exit(1);
            }
            const noLoaderScreens = new Set(map.rows.filter(r => r.status === 'NO_LOADER').map(r => \`\${r.module}::\${r.screen}\`));
            const staleEntries = manifest.entries.filter(e => !noLoaderScreens.has(\`\${e.module}::\${e.screen}\`));
            if (staleEntries.length > 0) {
              console.error(staleEntries.length + ' loader-manifest.json entry(ies) no longer correspond to a NO_LOADER screen -- remove them (see apps/web/tests/contract/render-smoke.contract.test.ts, which asserts this same check with jsdom rendering, not just this cheap re-check):');
              staleEntries.forEach(e => console.error('  ' + e.module + e.screen));
              process.exit(1);
            }
            const coveredPages = (totalPages - noLoaderScreens.size) + manifest.entries.length;
            const coveragePct = coveredPages / totalPages * 100;
            console.log('Screen Verification Gate coverage: ' + coveragePct.toFixed(1) + '% (' + coveredPages + '/' + totalPages + ' page.tsx -- ' + (totalPages - noLoaderScreens.size) + ' WIRED-or-broken-but-tracked + ' + manifest.entries.length + ' loader-manifest-confirmed). Floor: ' + FLOOR_PCT + '%.');
            if (coveragePct < FLOOR_PCT) {
              console.error('Coverage dropped below the ' + FLOOR_PCT + '% ratchet floor -- a screen left the loader-manifest without a replacement, or totalPages grew faster than manifest entries were added for the new screens.');
              process.exit(1);
            }
          "
      - name: Start mock gateway on port 8080
        run: node scripts/ci/start-mock-gateway.mjs &
      - name: Wait for mock gateway
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/health >/dev/null 2>&1; then
              echo "Mock gateway ready."
              break
            fi
            sleep 1
          done
      - name: Verify all wired screens return HTTP 200
        run: node scripts/contract/verify-screens.mjs --gateway http://localhost:8080
        env:
          JWT_SECRET: ci-test-secret-min-32-chars-long

  # ─────────────────────────────────────────────
  # Job 7: Playwright E2E (mock gateway via global-setup)
  # ─────────────────────────────────────────────
  procurement-e2e:
    name: Procurement E2E Gate
    runs-on: ubuntu-latest
    needs: [web-build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Build packages for web dev server
        run: pnpm turbo build --filter='./packages/*'
      # `next dev` never reaches "Ready" in this CI environment -- it logs a
      # couple of webpack PackFileCacheStrategy warnings about next-intl's
      # dynamic import(t) and then hangs indefinitely (confirmed: raising
      # config.webServer.timeout as high as 400s made no difference, so it is
      # a genuine hang, not a slow cold compile). `next start` against a build
      # made moments earlier has none of this problem (Ready in ~490ms, same
      # as the Accessibility job's own build+start below). Building here, as
      # its own step, keeps that multi-minute cost out of webServer's budget --
      # playwright.config.ts only asks webServer to run the fast `next start`.
      - name: Build web (production build — next dev hangs in this CI env, see above)
        run: pnpm --filter @civitasone/web run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          CIVITASONE_API_BASE_URL: http://127.0.0.1:4001
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4001
      - name: Install Playwright browsers
        run: pnpm --filter @civitasone/web exec playwright install --with-deps chromium
      - name: Run procurement module E2E
        run: pnpm --filter @civitasone/web exec playwright test e2e/procurement.spec.ts --project=chromium
        env:
          CI: true
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: procurement-playwright-report
          path: apps/web/e2e-report/
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [web-build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Build packages for web dev server
        run: pnpm turbo build --filter='./packages/*'
      # See the matching step/comment in the procurement-e2e job above: next dev
      # hangs indefinitely in this CI environment, so CI builds once and runs
      # the fast `next start` from playwright.config.ts instead.
      - name: Build web (production build — next dev hangs in this CI env, see above)
        run: pnpm --filter @civitasone/web run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          CIVITASONE_API_BASE_URL: http://127.0.0.1:4001
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4001
      - name: Install Playwright browsers
        run: pnpm --filter @civitasone/web exec playwright install --with-deps chromium
      - name: Run Playwright E2E suite
        run: pnpm --filter @civitasone/web run e2e --project=chromium
        env:
          CI: true
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/e2e-report/
          retention-days: 7
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Gate #9 — REAL accessibility (WCAG 2.2 AA) via axe-core in a real browser.
  #
  # This replaces scripts/ci/wcag-audit.mjs, which regex-scans page.tsx source
  # and therefore cannot see violations coming from client components, shared DS
  # primitives, or runtime states. That script was also never wired into any
  # workflow, so accessibility was effectively ungated.
  #
  # BLOCKING on NEW critical/serious violations vs apps/web/tests/a11y/a11y-baseline.json.
  # GIGW 3.0 makes WCAG 2.2 AA mandatory for government deployments.
  # ─────────────────────────────────────────────
  accessibility:
    name: Accessibility (WCAG 2.2 AA, axe-core)
    runs-on: ubuntu-latest
    needs: [web-build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm turbo build --filter='./packages/*'
      - name: Build web (production build — dev mode renders differently)
        run: pnpm --filter @civitasone/web run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Install Playwright chromium
        run: pnpm --filter @civitasone/web exec playwright install --with-deps chromium
      # Without a reachable gateway every loader returns source:"error" and each
      # list page renders an empty state — so axe would audit shells with no
      # DataTable, no rows and no controls, and report them clean. The spec now
      # asserts data arrived, so this mock is required for the gate to pass.
      #
      # REL-010: both servers below used to be started as a bare `command &`
      # with a one-time readiness wait and nothing watching them afterwards.
      # CI observed the web server die mid-run (`ERR_CONNECTION_REFUSED` on
      # the request right after the `/stock` test), which then cascaded into
      # a wall of unrelated-looking connection-refused failures instead of one
      # clear diagnostic. scripts/ci/run-with-watchdog.sh keeps the same
      # readiness wait but also supervises the process for the rest of the
      # job: one automatic restart with a loud log message, and a hard,
      # clearly-labelled failure (not a silent retry loop) if it dies again.
      - name: Start mock gateway
        run: |
          chmod +x scripts/ci/run-with-watchdog.sh
          scripts/ci/run-with-watchdog.sh mock-gateway 8080 \
            /tmp/mock-gateway.pid /tmp/mock-gateway.watchdog-status mock-gateway.log \
            -- node scripts/ci/start-mock-gateway.mjs
      - name: Start web
        run: |
          scripts/ci/run-with-watchdog.sh web 3000 \
            /tmp/web-server.pid /tmp/web-server.watchdog-status web-server.log \
            -- pnpm --filter @civitasone/web run start
        env:
          # NOTE: the app reads CIVITASONE_API_BASE_URL / NEXT_PUBLIC_API_BASE_URL.
          # `NEXT_PUBLIC_API_BASE` (used by the web-build job) is read by nothing.
          CIVITASONE_API_BASE_URL: http://localhost:8080
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
          # Gates the /auth/dev route. Read by apps/web/src/lib/auth/env.ts.
          ENABLE_DEV_LOGIN: 'true'
          JWT_SECRET: civitasone-dev-secret
      - name: Run axe-core WCAG 2.2 AA gate
        run: pnpm --filter @civitasone/web run test:a11y
        env:
          CI: true
          JWT_SECRET: civitasone-dev-secret
      # REL-010: runs regardless of the test step's own result, because a
      # restart mid-run can leave the suite passing on a server that still
      # flapped, which is worth knowing about even on green. `crashed_twice`
      # or `restart_failed` fails the job here explicitly with a named cause,
      # rather than letting it stand as an unexplained bundle of
      # connection-refused test failures.
      - name: Check web server health
        if: always()
        run: |
          web_status=$(cat /tmp/web-server.watchdog-status 2>/dev/null || echo "unknown")
          gw_status=$(cat /tmp/mock-gateway.watchdog-status 2>/dev/null || echo "unknown")
          echo "web server watchdog status: $web_status"
          echo "mock gateway watchdog status: $gw_status"
          fail=0
          for label_status in "web:$web_status" "mock-gateway:$gw_status"; do
            label="${label_status%%:*}"; status="${label_status#*:}"
            case "$status" in
              ok) ;;
              restarted)
                echo "::warning::$label crashed once during this run and was restarted by the watchdog — see ${label}.log / ${label}-server.log for why." ;;
              restart_failed)
                echo "::error::$label crashed and the watchdog's restart never became reachable — treating as a hard failure, not a flaky one."
                fail=1 ;;
              crashed_twice)
                echo "::error::$label crashed twice (including after one watchdog restart) — this is a real server-stability problem, not test flakiness."
                fail=1 ;;
              *)
                echo "::warning::$label watchdog status file missing/unreadable ($status) — cannot confirm the server stayed up for this whole run." ;;
            esac
          done
          exit $fail
      - name: Upload a11y traces and server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-diagnostics
          path: |
            apps/web/test-results/
            web-server.log
            mock-gateway.log
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 8: Mobile — Flutter analyze + test
  # Runs flutter analyze and flutter test for apps/mobile.
  # Uses the official Flutter SDK action.
  # ─────────────────────────────────────────────
  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          # Must satisfy the Dart SDK floor of everything in pubspec.lock, not
          # just pubspec.yaml's own `sdk:` range. This was pinned to 3.22.0
          # (Dart 3.4) while the lockfile resolved sqflite_common_ffi 2.3.5,
          # which needs Dart >=3.5.0, so `flutter pub get` failed and every
          # step below it was skipped: this job reported failure without ever
          # running analyze or a single test. Keep this in step with the
          # toolchain the suite is actually validated against.
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Flutter analyze
        working-directory: apps/mobile
        # Gates on analyzer ERRORS. Warnings are reported but not fatal: the
        # tree carries 18 pre-existing ones, and several are load-bearing
        # evidence rather than lint noise (main.dart imports biometric_lock and
        # lock_screen without using them, which is how we know the biometric
        # lock is wired but inert). Deleting them to reach a clean exit would
        # erase the signal, and leaving this step fatal keeps the test step
        # below from ever running. Tighten to --fatal-warnings once those are
        # genuinely resolved rather than suppressed.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Flutter unit + widget tests (excluding goldens)
        working-directory: apps/mobile
        run: flutter test --exclude-tags golden
      - name: Flutter golden tests (generate on first run)
        working-directory: apps/mobile
        run: flutter test --tags golden --update-goldens
      - name: Upload generated goldens as artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-goldens
          path: apps/mobile/test/goldens/goldens/
          retention-days: 14

  # ─────────────────────────────────────────────
  # Job 10: Live stack verification (main branch only)
  # Full migrate → seed → start-stack → verify-screens against real services.
  # ─────────────────────────────────────────────
  live-stack-verify:
    name: Live Stack Verification
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [typecheck-lint]
    services:
      postgres:
        # PostGIS-capable image — see the note on the `test` job above.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: civitas
          POSTGRES_PASSWORD: civitas_test
          POSTGRES_DB: civitas_test
        ports: ['5435:5432']
        # MEASURED, not assumed. Polling postgis/postgis:16-3.4 every 5s:
        #     5s  socket=READY  tcp=no      query=no
        #    ...
        #    45s  socket=READY  tcp=no      query=no
        #    50s  socket=READY  tcp=READY   query=1
        # A bare `pg_isready` uses the unix socket, and the postgres entrypoint runs a
        # temporary socket-only server while it executes the initdb scripts. So it
        # reported healthy at 5s — 45s before the container would accept a single TCP
        # connection. GitHub Actions would have marked the service up and started the
        # bootstrap against a server refusing connections.
        # Checking TCP explicitly flips at exactly the moment the first query succeeds.
        # Retries are raised to 20 (+30s start period, up to 230s) because the honest
        # check takes longer to pass than the misleading one did.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U civitas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
      redis:
        image: redis:7-alpine
        ports: ['6381:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s
    env:
      PGHOST: localhost
      PGPORT: '5435'
      PGUSER: civitas
      PGPASSWORD: civitas_test
      REDIS_URL: redis://localhost:6381
      CACHE_DRIVER: memory
      QUEUE_DRIVER: memory
      JWT_SECRET: civitasone-dev-secret
      JWT_ALGORITHM: HS256
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter='./packages/*' --filter='./services/*' --output-logs=errors-only
      - name: Bootstrap Postgres
        run: bash scripts/ci/bootstrap-postgres.sh
      - name: Migrate and seed live stack
        run: |
          node scripts/dev/migrate-all.mjs
          node scripts/dev/seed-all.mjs
      - name: Start live stack
        run: SKIP_BUILD=1 bash scripts/dev/start-stack.sh
      - name: Verify all screens against live gateway
        run: node scripts/contract/verify-screens.mjs --gateway http://localhost:8080
      - name: Contract score must be 10/10
        run: node scripts/contract/score.mjs
      # Task 17.3 (tenant-platform-hardening, Req 6.1, 6.4): smoke-run the
      # Connection_Proxy compliance verifier against this job's live docker
      # Postgres — the compose-based CI runner here has no pgbouncer sidecar,
      # so every service connects directly. This asserts the *tool itself*
      # still runs end-to-end (queries pg_stat_activity, renders a report,
      # exits non-zero) against a real fleet — the actual compliance
      # assertion (a fully-`pgbouncer`-fronted stack reporting compliant) is
      # exercised by `tests/infra/helm-pgbouncer.test.ts` (task 9.3) and the
      # on-prem/AWS pgbouncer deployments (tasks 9.1, 9.2) directly.
      - name: Smoke-run Connection_Proxy compliance verifier
        env:
          OPS_DSN: postgresql://civitas:civitas_test@localhost:5435/civitas_test
        run: |
          node scripts/ops/verify-pgbouncer-routing.mjs --json > /tmp/pgbouncer-report.json || true
          cat /tmp/pgbouncer-report.json
          node scripts/ci/assert-pgbouncer-report-shape.mjs /tmp/pgbouncer-report.json


  # ─────────────────────────────────────────────
  # Job: Coverage gate — fail if below thresholds
  # Runs after unit tests pass; enforces per-service coverage minimums.
  # ─────────────────────────────────────────────
  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: civitas
          POSTGRES_PASSWORD: civitas_test
          POSTGRES_DB: civitas_test
        ports: ['5435:5432']
        # TCP check rather than the default unix socket — see the note on the
        # `test` job. postgres:16-alpine has the same premature-ready window as the
        # PostGIS image, just a narrower one, because the entrypoint's temporary
        # socket-only server answers `pg_isready` before TCP is accepted.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U civitas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s
    env:
      REDIS_URL: redis://localhost:6379
      QUEUE_DRIVER: memory
      JWT_SECRET: ci-test-secret-min-32-chars-long
      JWT_ALGORITHM: HS256
      NODE_ENV: test
      PGHOST: localhost
      PGPORT: '5435'
      PGUSER: civitas
      PGPASSWORD: civitas_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter='./packages/*'
      - name: Bootstrap Postgres (per-service DBs + migrations)
        run: bash scripts/ci/bootstrap-postgres.sh
      - name: Run coverage with JSON reporter (thresholds enforced by vitest.config.ts)
        run: pnpm turbo coverage
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: '**/coverage/'
          retention-days: 14

  # ─────────────────────────────────────────────
  # Job 11: QA readiness score (informational on PRs)
  # ─────────────────────────────────────────────
  qa-readiness:
    name: QA Readiness
    runs-on: ubuntu-latest
    needs: [typecheck-lint]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: QA readiness score
        run: node scripts/qa-readiness-score.mjs

  # ─────────────────────────────────────────────
  # Quality Program Gates (L1/L2/L3)
  # World-class test lanes: tenant isolation, authz matrix, schema integrity.
  # Requires live services (runs against gateway), so depends on live-stack.
  # For PRs: runs L3 (schema) only (no live gateway needed).
  # ─────────────────────────────────────────────
  quality-gates-schema:
    name: Quality Gates — Schema Integrity (L3)
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: civitas
          POSTGRES_PASSWORD: civitas_test
          POSTGRES_DB: civitas_test
        ports: ['5435:5432']
        # TCP check rather than the default unix socket — see the note on the
        # `test` job. postgres:16-alpine has the same premature-ready window as the
        # PostGIS image, just a narrower one, because the entrypoint's temporary
        # socket-only server answers `pg_isready` before TCP is accepted.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U civitas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5435'
      PGUSER: civitas
      PGPASSWORD: civitas_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter='./packages/*'
      - name: Bootstrap Postgres
        run: bash scripts/ci/bootstrap-postgres.sh
      # Migration idempotency regression guard: re-run the SAME bootstrap
      # against the now-already-migrated service container. An independent
      # review of a different PR's migration-idempotency claim found that a
      # second full run failed on ~61 migrations across ~25 services (bare
      # ADD CONSTRAINT / CREATE POLICY / CREATE INDEX with no guard, RLS
      # blocking a re-applied seed INSERT, a stale ON CONFLICT target, etc.)
      # -- meaning "just re-run bootstrap-postgres.sh on every deploy" would
      # work once and then break on every subsequent deploy. All then-known
      # cases were fixed; this step is what stops it from silently
      # regressing. No new service container or script needed: the script's
      # own ratchet (scripts/ci/migration-failure-allowlist.txt) already
      # treats any non-allow-listed failure as fatal, so simply invoking it
      # again here is a complete idempotency check on its own.
      - name: Bootstrap Postgres again (idempotency regression guard)
        # Ratchets against a SEPARATE allow-list (migration-second-run-
        # allowlist.txt), not the default first-run one above -- 14 of the
        # ~61 originally-found non-idempotent migrations are deliberately
        # deferred tracked debt (see that file's header), and would
        # otherwise permanently fail this step even with no real
        # regression. Anything NOT in that file failing here IS a real
        # regression.
        env:
          BOOTSTRAP_ALLOWLIST_PATH: ${{ github.workspace }}/scripts/ci/migration-second-run-allowlist.txt
        run: bash scripts/ci/bootstrap-postgres.sh
      # REL-004: vitest.config.ts's junit reporter always writes to the same
      # `evidence/quality-program-junit.xml` regardless of which lane subset
      # was run, so a second `vitest run` in this job clobbers the first
      # lane's result. release-gate.mjs also expects one XML file PER LANE,
      # named so the lane id appears in the filename, sitting directly under
      # `evidence/<YYYYMMDD>/` (see findLaneArtifact in release-gate.mjs).
      # So: stamp the date once, then copy the junit output to its
      # lane-specific evidence filename immediately after each run, before
      # the next lane overwrites it.
      - name: Set evidence date stamp
        run: echo "EVIDENCE_DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
      - name: Run L3 Schema Integrity gate
        run: |
          mkdir -p "evidence/${EVIDENCE_DATE}"
          cd tests/quality-program
          npx vitest run L3-data-integrity/ --config vitest.config.ts
          cp ../../evidence/quality-program-junit.xml "../../evidence/${EVIDENCE_DATE}/L3-data-integrity.xml"
      - name: Run L6 Security gate (crypto + audit immutability)
        run: |
          cd tests/quality-program
          npx vitest run L6-security/ --config vitest.config.ts
          cp ../../evidence/quality-program-junit.xml "../../evidence/${EVIDENCE_DATE}/L6-security.xml"
        env:
          PII_ENC_KEY: test_pii_encryption_key_32_chars_min
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-l3-l6-evidence
          path: evidence/
          retention-days: 14

  # ─────────────────────────────────────────────
  # Quality Gates — Domain Correctness (L10) + Canary Validity (L11)
  # Pure-domain lanes: no DB, no gateway. Fast and always runnable on PRs.
  # L10 asserts against golden oracles; L11 proves the gates catch planted defects.
  # ─────────────────────────────────────────────
  quality-gates-domain:
    name: Quality Gates — Domain (L10) & Canary (L11)
    runs-on: ubuntu-latest
    needs: [typecheck-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter='./packages/*'
      # REL-004: see the matching comment in quality-gates-schema — the junit
      # reporter output must be copied to a lane-specific filename under
      # evidence/<date>/ right after each run, before the next lane's run
      # overwrites the shared output file.
      - name: Set evidence date stamp
        run: echo "EVIDENCE_DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
      - name: Run L10 Domain Correctness gate (golden oracles)
        run: |
          mkdir -p "evidence/${EVIDENCE_DATE}"
          cd tests/quality-program
          npx vitest run L10-domain-correctness/ --config vitest.config.ts
          cp ../../evidence/quality-program-junit.xml "../../evidence/${EVIDENCE_DATE}/L10-domain-correctness.xml"
      - name: Run L11 Canary gate (gate-validity proof)
        run: |
          cd tests/quality-program
          npx vitest run L11-mutation-canary/ --config vitest.config.ts
          cp ../../evidence/quality-program-junit.xml "../../evidence/${EVIDENCE_DATE}/L11-mutation-canary.xml"
      - name: Run L8 AI fabrication gate (static, no provider needed)
        run: |
          cd tests/quality-program
          npx vitest run L8-ai-features/no-fabricated-verdicts.test.ts --config vitest.config.ts
          cp ../../evidence/quality-program-junit.xml "../../evidence/${EVIDENCE_DATE}/L8-ai-features.xml"
      # L0 static checks (gateway-route coverage, documented ports) run without a
      # fleet. QUALITY_ALLOW_OFFLINE lets the port-bound check report UNMEASURED
      # instead of failing on a runner that has no services running.
      - name: Run L0 Deployment Readiness (static checks)
        run: |
          cd tests/quality-program
          npx vitest run L0-deployment-readiness/ --config vitest.config.ts
          cp ../../evidence/quality-program-junit.xml "../../evidence/${EVIDENCE_DATE}/L0-deployment-readiness.xml"
        env:
          QUALITY_ALLOW_OFFLINE: '1'
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-l0-l8-l10-l11-evidence
          path: evidence/
          retention-days: 14

  # ─────────────────────────────────────────────
  # Gate #11 — Mutation testing. BLOCKING.
  #
  # Was warn-only (`thresholds.break: null`) over a runner scope that excluded
  # payroll, GL and F&F, so 561 of 1029 mutants reported NoCoverage and the score
  # described the include-list rather than the tests. Scope fixed and the gate is
  # now enforcing at a ratchet of 55 (measured 58.31%). Target remains 70.
  # ─────────────────────────────────────────────
  mutation:
    name: Mutation Testing (Stryker)
    runs-on: ubuntu-latest
    needs: [typecheck-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter='./packages/*'
      - name: Run Stryker (fails below the ratchet)
        run: npx stryker run
      - name: Per-file mutation summary
        if: always()
        run: node scripts/ci/mutation-summary.mjs
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
      # REL-004 cleanup: this job never writes to evidence/ (Stryker and
      # mutation-summary.mjs both write to reports/mutation/ only), so this
      # step previously uploaded an empty/nonexistent evidence/ dir under the
      # name "quality-l10-l11-evidence" — which also collided with the real
      # L10/L11 lane evidence now produced by quality-gates-domain
      # (actions/upload-artifact@v4 errors on a duplicate name within the
      # same run). The Stryker mutation *score* is a separate, currently
      # unwired signal — see the REL-004 note in
      # docs/ENTERPRISE-GAP-REPORT-2026-09-07.md for the follow-up.

  # ─────────────────────────────────────────────
  # Release Gate — audits the evidence pack.
  # Treats a lane with no artifact as UNMEASURED and blocks: "pass without an
  # artifact = fail". Informational on PRs (not every lane can run on a PR
  # runner); authoritative on main where the live-stack lanes also execute.
  #
  # REL-003: this job used to be structurally incapable of failing — both
  # `release-gate.mjs` invocations were `|| true`, so a BLOCKED verdict never
  # surfaced as a red job no matter what the script reported. The PR-runner
  # invocation below is *deliberately* still `|| true` (kept, not an
  # oversight): a PR runner has no live stack, so L1/L2/L4/L7 are legitimately
  # UNMEASURED there and that must not fail every PR. The main-only
  # enforcement invocation is the one REL-003 fixes — it now propagates the
  # script's real exit code, so the job goes red exactly when the script
  # reports BLOCKED.
  # ─────────────────────────────────────────────
  release-gate:
    name: Release Gate (evidence audit)
    runs-on: ubuntu-latest
    needs: [quality-gates-schema, quality-gates-domain]
    # Kept `always()`: this job must still audit whatever evidence exists —
    # and correctly report BLOCKED/FAIL — even when an upstream quality-gate
    # job failed, rather than being silently skipped in exactly the case
    # where the release most needs blocking. It is no longer a way to mask a
    # failure, because the job's own outcome now tracks the script's verdict.
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Download all evidence artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-evidence
          merge-multiple: true
        # Kept: with no upstream artifacts (e.g. every quality-gate job
        # failed before its own `if: always()` upload step), this action
        # errors outright instead of leaving an empty directory. That would
        # be a raw step failure with no report attached. Evidence being
        # absent is exactly the condition release-gate.mjs itself already
        # models as UNMEASURED/BLOCKED further down — so let it through and
        # have the script report it, rather than swallowing it here.
        continue-on-error: true
      - name: Audit evidence pack (informational — every PR and push)
        run: |
          mkdir -p downloaded-evidence
          echo "Artifacts present:"
          find downloaded-evidence -name '*.xml' -print || true
          # Deliberately non-blocking here: the live-stack lanes (L1/L2/L4/L7)
          # cannot run on a PR runner, so a BLOCKED verdict is expected on
          # every PR and must not fail it. Main's real enforcement is the
          # step below.
          node scripts/ci/release-gate.mjs --evidence "$(find downloaded-evidence -type d -name '2*' | head -1 || echo downloaded-evidence)" || true
      - name: Enforce release gate (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          EVIDENCE_DIR="$(find downloaded-evidence -type d -name '2*' | head -1 || echo downloaded-evidence)"
          set +e
          node scripts/ci/release-gate.mjs --evidence "$EVIDENCE_DIR" --json > release-gate.json
          STATUS=$?
          set -e
          cat release-gate.json
          # This is the actual fix: the step (and therefore the job) now
          # fails whenever the script reports BLOCKED, instead of always
          # exiting 0 via a trailing `|| true`.
          exit "$STATUS"
      - name: Upload release gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-report
          path: release-gate.json
          retention-days: 30

  docker-build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [e2e]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - admin-service
          - analytics-service
          - asset-service
          - audit-service
          - billing-service
          - citizen-service
          - contract-service
          - crm-service
          - estab-service
          - finance-service
          - gateway-service
          - grant-service
          - helpdesk-service
          - hrms-service
          - identity-service
          - install-service
          - inventory-service
          - knowledge-service
          - legal-service
          - location-service
          - notification-service
          - payroll-service
          - plugin-service
          - policy-service
          - procurement-service
          - project-service
          - queue-service
          - report-service
          - stock-service
          - telephony-service
          - tenant-service
          - theme-service
          - workflow-service
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
