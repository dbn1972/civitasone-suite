name: DR Restore Drill

# Drill_Scheduler (G10 / Req 12.1, 12.2, 12.4, 13.2, 13.3) — weekly proof that CivitasOne's
# backups are actually restorable within the documented RPO/RTO (docs/operations/SLO-SLI-RUNBOOKS.md
# §1). Runs the full Backup_Job (scripts/ops/backup-databases.sh) against a fresh Postgres, then
# a Restore_Drill (scripts/ops/restore-drill.sh --all-tier01) against every Tier-0/Tier-1 service's
# backup, uploads the resulting Drill_Report as a long-retention workflow artifact, publishes it to
# durable object storage + an Audit_Event (scripts/ops/publish-drill-report.mjs), and pages the
# platform's alert channel on any Tier-0/Tier-1 failure (scripts/ops/notify-alert-channel.mjs).
#
# See docs/runbooks/README.md and docs/operations/SLO-SLI-RUNBOOKS.md for where to retrieve
# Drill_Report history for audit review (task 16.6).

on:
  schedule:
    - cron: '0 3 * * 0' # weekly, Sunday 03:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Dry run (task 17.4, Req 12.1, 13.2): route object-storage publish
          through the CI Postgres/LocalStack sandbox rather than real
          production credentials, so a manual dispatch can be verified
          end-to-end (artifact upload + object-storage publish) before the
          weekly schedule is relied upon. Leave "false" for a real manual
          drill against configured production secrets.
        type: boolean
        default: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  drill:
    name: Backup + Restore Drill
    runs-on: ubuntu-latest
    # Ephemeral Postgres to back up and drill against — mirrors ci.yml's `test` job service
    # container so backup-databases.sh / restore-drill.sh have a live target to operate on.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: civitas
          POSTGRES_PASSWORD: civitas_test
          POSTGRES_DB: civitas_test
        ports: ['5435:5432']
        # TCP check rather than the default unix socket. A bare `pg_isready` talks to
        # the temporary socket-only server the postgres entrypoint runs during initdb,
        # so it reports healthy before the container accepts TCP — measured on
        # postgis/postgis:16-3.4: socket READY at 5s, TCP not until 50s. The plain
        # image has the same window, just narrower. Enforced by
        # scripts/ci/ci-config-guard.mjs, which is what flagged this file.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U civitas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # Task 17.4 (Req 12.1, 13.2): LocalStack backs the object-storage publish
      # step end-to-end on a `dry_run` manual dispatch, so artifact upload +
      # object-storage publish can be verified WITHOUT touching real
      # production AWS_* secrets. Always started (cheap, sidecar-only cost);
      # only actually used when `inputs.dry_run` is true.
      localstack:
        image: localstack/localstack:3
        env:
          SERVICES: s3
        ports: ['4566:4566']
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5435'
      PGUSER: civitas
      PGPASSWORD: civitas_test
      QUEUE_DRIVER: memory
      NODE_ENV: production
      BACKUP_DIR: ${{ github.workspace }}/.dr-drill-backups
      # Object storage (dr-drills/ prefix) — see packages/storage/src/index.ts for the full
      # env-var contract. On a dry_run dispatch, route to the LocalStack sidecar above instead
      # of real production secrets, so publish-drill-report.mjs's object-storage write is
      # exercised end-to-end without any risk to real infrastructure.
      AWS_S3_BUCKET: ${{ inputs.dry_run && 'civitasone-dr-drill-dry-run' || secrets.AWS_S3_BUCKET }}
      AWS_ENDPOINT_URL: ${{ inputs.dry_run && 'http://localhost:4566' || secrets.AWS_ENDPOINT_URL }}
      AWS_DEFAULT_REGION: ${{ inputs.dry_run && 'ap-south-1' || secrets.AWS_DEFAULT_REGION }}
      AWS_ACCESS_KEY_ID: ${{ inputs.dry_run && 'test' || secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ inputs.dry_run && 'test' || secrets.AWS_SECRET_ACCESS_KEY }}
      S3_FORCE_PATH_STYLE: ${{ inputs.dry_run && 'true' || secrets.S3_FORCE_PATH_STYLE }}
      # Alerting channel (scripts/ops/notify-alert-channel.mjs — see
      # infra/observability/alertmanager.yml). First configured one wins.
      # Never fires a real page on a dry_run dispatch — see the "Alert on
      # Tier-0/Tier-1 drill failure" step's condition below.
      ALERTMANAGER_SLACK_WEBHOOK: ${{ secrets.ALERTMANAGER_SLACK_WEBHOOK }}
      ALERTMANAGER_URL: ${{ secrets.ALERTMANAGER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - name: Install Postgres + AWS CLI (dry-run LocalStack verification)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client awscli
      - run: pnpm install --frozen-lockfile
      - name: Build packages (observability/storage/queue, used by drill-report scripts)
        run: pnpm turbo build --filter='./packages/*'
      - name: Bootstrap Postgres (per-service DBs + migrations)
        run: bash scripts/ci/bootstrap-postgres.sh
      - name: Create dry-run LocalStack S3 bucket
        if: ${{ inputs.dry_run }}
        run: |
          AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test aws --endpoint-url=http://localhost:4566 --region ap-south-1 \
            s3api create-bucket --bucket civitasone-dr-drill-dry-run \
            --create-bucket-configuration LocationConstraint=ap-south-1
      - name: Backup all 33 databases
        run: bash scripts/ops/backup-databases.sh "${{ env.BACKUP_DIR }}"
      - name: Restore drill — all Tier-0/Tier-1 services
        run: bash scripts/ops/restore-drill.sh --all-tier01 --report-json drill-report.json
      # Task 39 (Req 7.5, operational gate): inventory-service is not part of
      # the fixed Tier-0/Tier-1 universe (scripts/ops/lib/outcome-aggregation.mjs),
      # so the --all-tier01 run above never exercises it. estab's own
      # files/quarters/spaces schemas ARE already covered by the Tier-1 `estab`
      # entry (one Postgres database shared across those three PG schemas), so
      # only inventory needs this explicit second drill.
      - name: Restore drill — inventory schema (Req 7.5)
        run: bash scripts/ops/restore-drill.sh --service inventory --report-json drill-report-inventory.json
      - name: Upload inventory Drill_Report artifact (Req 13.2 — 400-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-drill-report-inventory-${{ github.run_id }}
          path: drill-report-inventory.json
          retention-days: 400
      - name: Upload Drill_Report artifact (Req 13.2 — 400-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-drill-report-${{ github.run_id }}
          path: drill-report.json
          retention-days: 400
      - name: Publish Drill_Report to object storage + Audit_Event
        if: always()
        run: node scripts/ops/publish-drill-report.mjs drill-report.json
      - name: Verify dry-run object-storage publish landed in LocalStack
        if: ${{ always() && inputs.dry_run }}
        run: |
          set -euo pipefail
          # `Contents[].Key --output text` yields one key per line, or an
          # empty string (never a jmespath error) when the prefix has zero
          # matching objects — safe to count with `grep -c` either way.
          KEYS=$(AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test aws --endpoint-url=http://localhost:4566 --region ap-south-1 \
            s3api list-objects-v2 --bucket civitasone-dr-drill-dry-run --prefix dr-drills/ --query 'Contents[].Key' --output text || true)
          COUNT=$(echo "$KEYS" | grep -c 'dr-drills/' || true)
          echo "dr-drills/ objects found in dry-run LocalStack bucket: $COUNT"
          echo "$KEYS"
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::dry-run verification FAILED — no Drill_Report object found under dr-drills/ in the LocalStack bucket"
            exit 1
          fi
      - name: Alert on Tier-0/Tier-1 drill failure
        if: ${{ failure() && !inputs.dry_run }}
        run: node scripts/ops/notify-alert-channel.mjs "DR drill failed — see run ${{ github.run_id }} (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
