name: Release Gate

on:
  push:
    branches: [main]

jobs:
  release-gate:
    name: Release Readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Verify CI passed on this SHA
        run: |
          SHA="${{ github.sha }}"
          STATUS=$(gh run list --commit "$SHA" --workflow ci.yml --json conclusion --jq '.[0].conclusion' 2>/dev/null || echo "unknown")
          if [ "$STATUS" != "success" ]; then
            echo "CI workflow did not pass for $SHA (status: $STATUS). Blocking release."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: QA readiness score (must be ≥95)
        run: node scripts/qa-readiness-score.mjs --min-score 95
      - name: Production readiness score
        run: node scripts/production-readiness-score.mjs
      - name: Staging gateway health probe
        run: |
          if [ -n "$STAGING_URL" ]; then
            STATUS=$(curl -sf --max-time 10 "$STAGING_URL/health" -o /dev/null -w "%{http_code}" || echo "000")
            if [ "$STATUS" != "200" ]; then
              echo "Staging health probe failed: HTTP $STATUS"
              exit 1
            fi
            echo "Staging gateway healthy: HTTP $STATUS"
          else
            echo "STAGING_URL not set — skipping live probe (set it in repo secrets for staging validation)"
          fi
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: release-gate
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require(./package.json).version")
          gh release create "v${VERSION}" --generate-notes --title "CivitasOne v${VERSION}"
