name: Release Gate

on:
  push:
    branches: [main]

jobs:
  release-gate:
    name: Release Readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: QA readiness score (must be ≥95)
        run: node scripts/qa-readiness-score.mjs --min-score 95
      - name: Production readiness score
        run: node scripts/production-readiness-score.mjs
      - name: Service health check (if services running)
        run: |
          echo "Services must be verified manually on staging before deploy."
          echo "Gateway registry entry count:"
          grep -c "prefix:" services/gateway-service/src/registry.ts || true

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: release-gate
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v${VERSION}" --generate-notes --title "CivitasOne v${VERSION}"
