name: Release Gate

# REL-002: this used to be `on: push: branches: [main]`, which starts this
# workflow AT THE SAME TIME as ci.yml (also push:main-triggered) instead of
# after it. The "Verify CI passed on this SHA" step then asked the GitHub API
# for CI's conclusion on a run that was still in progress, got back
# `status: ""` (not yet concluded), treated that as failure, and exited 1 —
# so every release was blocked structurally, regardless of whether CI
# actually passed. Last 5 runs all failed this way.
#
# Fix: trigger on `workflow_run` for CI's completion instead of racing it.
# `workflow_run` always uses the *default branch's* copy of this workflow
# file and does NOT automatically scope to main — CI itself also runs on
# `develop` pushes and on `pull_request`, so both the branch and the
# triggering event are checked explicitly below before anything runs.
on:
  workflow_run:
    workflows: ["CI"]  # must match ci.yml's `name:` field exactly
    types: [completed]

jobs:
  release-gate:
    name: Release Readiness
    runs-on: ubuntu-latest
    # Only proceed for a CI run that (a) concluded successfully, (b) ran
    # against main, and (c) was itself triggered by a push (not a PR) — a
    # release is cut from main's post-merge state, never from a PR preview.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the exact commit CI validated, not whatever `main`
          # points to right now (they can differ if another push landed
          # while CI was running) and not the default-branch checkout
          # workflow_run would otherwise give us.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: QA readiness score (must be ≥95)
        run: node scripts/qa-readiness-score.mjs --min-score 95
      - name: Production readiness score
        run: node scripts/production-readiness-score.mjs
      - name: Staging gateway health probe
        run: |
          if [ -n "$STAGING_URL" ]; then
            STATUS=$(curl -sf --max-time 10 "$STAGING_URL/health" -o /dev/null -w "%{http_code}" || echo "000")
            if [ "$STATUS" != "200" ]; then
              echo "Staging health probe failed: HTTP $STATUS"
              exit 1
            fi
            echo "Staging gateway healthy: HTTP $STATUS"
          else
            echo "STAGING_URL not set — skipping live probe (set it in repo secrets for staging validation)"
          fi
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: release-gate
    # REL-017: this job used to read a hand-maintained, never-bumped
    # `package.json` version (frozen at the "0.1.0" placeholder) and call
    # `gh release create "v${VERSION}"` directly. That's a one-shot script,
    # not a release pipeline: nothing ever computed a new version, so every
    # run after the first would have tried to recreate the same tag and
    # failed. `.releaserc.json` (semantic-release: commit-analyzer,
    # release-notes-generator, npm plugin with npmPublish:false, github
    # plugin) already described the intended process but no workflow ever
    # invoked it — dormant config. This now runs semantic-release for real:
    # it derives the next version from Conventional Commits since the last
    # tag, generates release notes, creates the git tag, and creates the
    # GitHub Release in one step. See the PR for this change for the
    # dry-run evidence and the version-baseline decision that needs a
    # maintainer call before the first real run.
    permissions:
      # contents:write — semantic-release creates the git tag and the
      # GitHub Release. issues/pull-requests:write — @semantic-release/github
      # defaults to labelling the PRs/issues included in a release; without
      # this it would only fail that one optional step, but grant it so the
      # plugin's default behavior works rather than partially degrading.
      # (Could not confirm this repo's default Actions token permission via
      # the API — GET /actions/permissions/workflow returned 403 for the
      # token available at investigation time — so this is declared
      # explicitly rather than assumed.)
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
