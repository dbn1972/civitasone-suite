name: Security Scan

on:
  schedule:
    - cron: '0 2 * * 1'  # Every Monday 2am UTC
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

jobs:
  dependency-audit:
    name: Dependency Audit (hygiene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      # Supply-chain hygiene only (lockfile presence, "*"/"latest" ranges,
      # workspace: refs, typosquat names) — NOT a vulnerability scan. Real
      # CVE/SCA scanning is the "CVE / SCA Gate" job below (SEC-004).
      - run: node scripts/ci/dependency-audit.mjs

  # ─────────────────────────────────────────────
  # SEC-004 — real, blocking CVE/SCA gate.
  #
  # Runs `pnpm audit --audit-level=high` for real and FAILS the job on any
  # unallow-listed CRITICAL/HIGH advisory. Previously this repo ran no CVE scan
  # at all in CI (the "Dependency Audit" job above only checks hygiene — see its
  # own comment and skill 19 "security-beyond-tenancy" §2). An expiring
  # allow-list (scripts/ci/cve-allowlist.json) covers advisories that need a
  # major-version dependency bump too large to rush into this gate's own PR;
  # see docs/ENTERPRISE-GAP-REPORT-2026-09-07.md SEC-004 / REL-016 / SEC-018.
  # ─────────────────────────────────────────────
  cve-audit-gate:
    name: CVE / SCA Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci/cve-audit-gate.mjs

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # L6 — Container image scanning (Trivy).
  # Blocks on CRITICAL/HIGH with a known fix (ignore-unfixed: true already
  # strips out every CVE with no available fix — whatever `trivy` reports
  # below is by definition fixable).
  #
  # SEC-004 fixup note (2026-09-09, corrects an earlier, wrong re-review of
  # this exact step): a prior pass claimed `exit-code: '0'` was deliberately
  # kept because "flipping it to nonzero today would fail the gate on
  # findings with no remediation path." That was backwards — since
  # ignore-unfixed already removes every unfixed finding, `exit-code: '0'`
  # stacked on top of it meant the gate could never fail even on a fixable
  # finding. Verified with a real `trivy image` scan (matching this exact
  # invocation) against all 3 matrix'd images, built from this exact
  # Dockerfile: the overwhelming majority of what it found were genuinely
  # fixable (e.g. hrms-service: 13 fixable vs 4 unfixed CRITICAL, 167 fixable
  # vs 55 unfixed HIGH, before the fixes below).
  #
  # Two real fixes landed first (see Dockerfile comments), which resolved
  # nearly everything Trivy found without needing an allow-list at all:
  #   - Debian OS-layer CVEs (libgnutls30/libcap2) had already-published
  #     point-release fixes -> added `apt-get upgrade -y`.
  #   - The "prune" stage was not actually stripping devDependencies (a pnpm
  #     quirk), so every runtime image shipped every service's dev/test/build
  #     tooling (stryker, vitest, eslint, ...) -> rebuilt the stage to install
  #     fresh, prod-only, instead of inheriting an already-full install.
  #   - The base image's bundled npm CLI (never invoked at runtime; the
  #     container runs `node <entry>` directly) carried its own bundled
  #     tar/pacote/sigstore/ip-address/minimatch/cross-spawn -> removed it.
  # What's left (`.trivyignore`, repo root) are real, fixable CRITICAL/HIGH
  # CVEs in packages that already have live, reasoned, expiring entries in
  # `scripts/ci/cve-allowlist.json` requiring the same fleet-wide major/minor
  # version bump (fastify/find-my-way/next/drizzle-orm and their own
  # transitive deps) — tracked under follow-up gap SEC-018, same expiry dates
  # as the pnpm-audit gate so the two gates don't drift apart.
  # ─────────────────────────────────────────────
  trivy-container:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Highest-exposure images: the only public ingress, plus the two
        # services holding money and PII.
        service: [gateway-service, finance-service, hrms-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build -f Dockerfile \
            --target runtime \
            --build-arg SERVICE=${{ matrix.service }} \
            -t civitasone/${{ matrix.service }}:scan .
      - name: Trivy scan (fail on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: civitasone/${{ matrix.service }}:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Genuinely blocking now (SEC-004 fixup, see job comment above).
          # `.trivyignore` (repo root, Trivy's native expiring-ignore file,
          # picked up automatically) covers the tracked-debt findings that
          # remain after the real fixes in the Dockerfile.
          exit-code: '1'
      - name: Trivy full report (SARIF, informational)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: civitasone/${{ matrix.service }}:scan
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
      - name: Archive report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.sarif
          retention-days: 30

  # ─────────────────────────────────────────────
  # L6 — DAST against the gateway (OWASP ZAP baseline).
  #
  # Runs against the MOCK gateway, not a live fleet: the point is to exercise the
  # HTTP surface (headers, cookies, error handling, obvious injection responses)
  # deterministically in CI. A full authenticated ZAP scan against a live stack is
  # a separate nightly concern and is NOT claimed here.
  #
  # SEC-004 follow-up note: `continue-on-error: true` on the scan step below
  # looks non-blocking in isolation, but the explicit "Fail if ZAP reported
  # FAIL-NEW alerts" step after it greps the report and exits 1 on any real
  # FAIL-NEW finding — this job DOES already gate on real findings; only the
  # (broken, third-party) artifact-upload path is swallowed. Left as-is.
  # ─────────────────────────────────────────────
  zap-dast:
    name: ZAP DAST (gateway baseline)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Start mock gateway
        run: |
          node scripts/ci/start-mock-gateway.mjs > mock-gateway.log 2>&1 &
          npx --yes wait-on http://localhost:8080/health --timeout 60000
      - name: ZAP baseline scan
        # v0.12 still uses legacy artifact upload that returns a spurious
        # "artifact name is not valid" 400 (zaproxy/action-baseline#134) even
        # when the scan itself succeeds (FAIL-NEW: 0). We archive reports below
        # with upload-artifact@v4, so do not hard-fail the job on that bug.
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true
        with:
          target: 'http://localhost:8080'
          rules_file_name: .zap/rules.tsv
          # Report findings without failing the build on the first run: the mock
          # gateway is not the production surface, so treating its header posture
          # as a release blocker would be misleading. Ratchet via rules.tsv.
          cmd_options: '-a -I'
          allow_issue_writing: false
          artifact_name: zapbaselinescan
          fail_action: false
      - name: Archive ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: |
            report_html.html
            report_json.json
            report_md.md
            mock-gateway.log
          retention-days: 30
      - name: Fail if ZAP reported FAIL-NEW alerts
        if: always()
        run: |
          if [ ! -f report_md.md ]; then
            echo "ZAP report missing — scan step failed before producing output"
            exit 1
          fi
          # Fail only on real FAIL-NEW findings; WARN-NEW and the action's
          # broken artifact uploader must not block the PR.
          if grep -E 'FAIL-NEW: [1-9]' report_md.md; then
            echo "ZAP reported new FAIL alerts"
            exit 1
          fi
          echo "ZAP baseline clean of FAIL-NEW alerts"

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
