  # ═══════════════════════════════════════════════════════════════════════════
  # Workflow Service — Messages & Signals
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/workflow/messages/deliver:
    post:
      operationId: deliverWorkflowMessage
      tags: [Workflow]
      summary: Deliver a correlated message to a waiting instance
      description: |
        Delivers a named message to a workflow instance that holds an active
        message subscription matching the (messageName, correlationKey) pair.
        The matched subscription's waiting task is auto-completed and the
        instance advances along the message catch node's outgoing edge.

        Returns 404 if no active subscription matches (the instance hasn't
        reached the message catch event yet, or it was already delivered).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageName, correlationKey]
              properties:
                messageName:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: "^[a-zA-Z][a-zA-Z0-9._-]*$"
                  description: The message name the subscription is waiting for
                  examples: ["payment.confirmed", "vendor.approved"]
                correlationKey:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: Correlation key to match the specific subscription
                  examples: ["PO-2026-001", "INV-42"]
                payload:
                  type: object
                  additionalProperties: true
                  description: Optional data payload delivered to the instance context
                  default: {}
      responses:
        "202":
          description: Message delivery accepted for async processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error (invalid messageName pattern, missing fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires workflow_user, workflow_admin, super_admin, estab_officer, or estab_admin
        "404":
          description: No active subscription matches the provided message name and correlation key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/workflow/signals/broadcast:
    post:
      operationId: broadcastWorkflowSignal
      tags: [Workflow]
      summary: Broadcast a signal to all active signal subscribers
      description: |
        Broadcasts a named signal to all workflow instances in the tenant that
        hold an active signal subscription for the given signal name. Unlike
        messages (1:1), signals fan out to every matching listener.

        Returns the count of matched subscriptions. A count of 0 is valid
        (no instance is currently waiting for this signal).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signalName]
              properties:
                signalName:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: "^[a-zA-Z][a-zA-Z0-9._-]*$"
                  description: The signal name to broadcast
                  examples: ["fiscal_year.closed", "budget.released"]
                payload:
                  type: object
                  additionalProperties: true
                  description: Optional data payload delivered to each matched instance
                  default: {}
      responses:
        "202":
          description: Signal broadcast accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  matched:
                    type: integer
                    description: Number of subscriptions that matched
                    examples: [3]
                  status:
                    type: string
                    examples: ["accepted"]
                  correlationId:
                    type: string
                    format: uuid
        "400":
          description: Validation error (invalid signalName pattern, missing fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires workflow_admin or super_admin
      security:
        - bearerAuth: []

  /v1/workflow/instances/{instanceId}/subscriptions:
    get:
      operationId: listInstanceSubscriptions
      tags: [Workflow]
      summary: List message and signal subscriptions for an instance
      description: |
        Returns all message and signal subscriptions (both active and matched)
        for a given workflow instance. Used by the UI to show what an instance
        is currently waiting for.
      parameters:
        - name: instanceId
          in: path
          required: true
          description: Workflow instance UUID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Subscriptions for the instance
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      messages:
                        type: array
                        items:
                          $ref: "#/components/schemas/MessageSubscription"
                      signals:
                        type: array
                        items:
                          $ref: "#/components/schemas/SignalSubscription"
        "400":
          description: Invalid instanceId (not a UUID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires workflow_user, workflow_admin, super_admin, estab_officer, or estab_admin
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Payroll Service — F&F (Full & Final Settlement)
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/payroll/fnf/compute:
    post:
      operationId: computeFnfSettlement
      tags: [Payroll]
      summary: Compute F&F settlement
      description: |
        Publishes a Full & Final settlement computation command for async processing.
        Computes gratuity, leave encashment, retrenchment/VRS compensation exemptions
        per Income Tax Act sections 10(10), 10(10AA), 10(10B), 10(10C), and calculates
        TDS on the separation package using old/new regime slab rates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComputeFnfRequest"
      responses:
        "202":
          description: F&F computation queued for async processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: fnf compute queued
                      employeeId:
                        type: string
                        format: uuid
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires payroll_admin, hr_admin, super_admin, or finance_officer
      security:
        - bearerAuth: []

  /v1/payroll/fnf/settlements/{id}:
    get:
      operationId: getFnfSettlement
      tags: [Payroll]
      summary: Get a single F&F settlement
      description: |
        Returns the full computation result for a specific F&F settlement,
        including all exemption breakdowns and TDS computation detail.
        Tenant-scoped — only returns settlements belonging to the caller's tenant.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Settlement detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/FnfSettlement"
        "400":
          description: Invalid UUID parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires payroll_admin, hr_admin, super_admin, or finance_officer
        "404":
          description: Settlement not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/payroll/fnf/settlements:
    get:
      operationId: listFnfSettlements
      tags: [Payroll]
      summary: List F&F settlements
      description: |
        Returns a paginated list of F&F settlements for the current tenant.
        Supports filtering by employeeId.
      parameters:
        - name: employeeId
          in: query
          description: Filter by employee UUID
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Maximum number of items to return (default 50, max 200)
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          description: Number of items to skip for pagination
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated list of settlements
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FnfSettlement"
                  meta:
                    type: object
                    properties:
                      limit:
                        type: integer
                      offset:
                        type: integer
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires payroll_admin, hr_admin, super_admin, or finance_officer
      security:
        - bearerAuth: []

  /v1/payroll/internal/fnf-tax-breakdown:
    get:
      operationId: getFnfTaxBreakdown
      tags: [Payroll]
      summary: Internal — compute F&F tax breakdown on-the-fly
      description: |
        Internal endpoint used by hrms-service to compute a full F&F tax breakdown
        without persisting. Loads exemption ceilings from DB for the given FY and
        returns the complete tax computation result. Not intended for end-user UI.
      parameters:
        - name: employeeId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: separationDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: separationType
          in: query
          required: true
          schema:
            type: string
            enum: [retirement, superannuation, resignation, retrenchment, vrs, death]
        - name: employeeCategory
          in: query
          required: true
          schema:
            type: string
            enum: [govt, non_govt_covered, non_govt_uncovered]
        - name: taxRegime
          in: query
          required: true
          schema:
            type: string
            enum: [old, new]
        - name: lastDrawnWagesMinor
          in: query
          required: true
          schema:
            type: string
            description: Bigint as string (paise)
        - name: completedYears
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
        - name: avgSalaryLast10MonthsMinor
          in: query
          required: true
          schema:
            type: string
            description: Bigint as string (paise)
        - name: leaveBalanceDays
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
        - name: salaryYtdMinor
          in: query
          required: true
          schema:
            type: string
            description: Bigint as string (paise)
        - name: tdsYtdMinor
          in: query
          required: true
          schema:
            type: string
            description: Bigint as string (paise)
        - name: fyStartYear
          in: query
          required: true
          schema:
            type: integer
        - name: noticeBuyoutMinor
          in: query
          schema:
            type: string
            default: "0"
        - name: leaveEncashmentGrossMinor
          in: query
          schema:
            type: string
            default: "0"
        - name: gratuityGrossMinor
          in: query
          schema:
            type: string
            default: "0"
        - name: retrenchmentCompMinor
          in: query
          schema:
            type: string
            default: "0"
        - name: vrsCompMinor
          in: query
          schema:
            type: string
            default: "0"
        - name: arrearsMinor
          in: query
          schema:
            type: string
            default: "0"
        - name: priorLeaveEncashExemptionMinor
          in: query
          schema:
            type: string
            default: "0"
        - name: remainingMonthsToRetirement
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: deductions80cMinor
          in: query
          schema:
            type: string
            default: "0"
        - name: deductions80dMinor
          in: query
          schema:
            type: string
            default: "0"
        - name: otherDeductionsMinor
          in: query
          schema:
            type: string
            default: "0"
      responses:
        "200":
          description: F&F tax breakdown computed on-the-fly
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/FnfTaxBreakdown"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires payroll_admin, hr_admin, super_admin, or finance_officer
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Analytics Service — Query Engine
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/analytics/query:
    post:
      operationId: runAnalyticsQuery
      tags: [Analytics]
      summary: Run an analytics query with joins and calculated fields
      description: |
        Executes an analytics query against whitelisted metrics and dimensions.
        Supports cross-table joins (max 3), calculated fields via a structured
        expression language (max 10 per query), and filter conditions on
        whitelisted fields. All queries are tenant-scoped. No raw SQL is accepted.
        Join queries are capped at 1000 rows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsQueryRequest"
      responses:
        "200":
          description: Query result with aggregated rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsQueryResult"
        "400":
          description: Validation error (unknown metric/dimension, expression too deep, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires analytics_viewer or analytics_admin
      security:
        - bearerAuth: []

  /v1/analytics/drill-through/{reportId}/{cellId}:
    get:
      operationId: drillThroughAnalytics
      tags: [Analytics]
      summary: Drill through an aggregated cell to detail rows
      description: |
        Given a report ID and cell ID from a previously executed analytics query,
        returns the underlying detail rows that compose the aggregated value.
        Capped at 200 rows per request. Tenant-scoped.
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the stored analytics report/query run
        - name: cellId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
          description: Identifier of the aggregated cell to drill into
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
          description: Maximum rows to return (capped at 200)
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Offset for pagination
      responses:
        "200":
          description: Detail rows for the specified cell
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrillThroughResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires analytics_viewer or analytics_admin
        "404":
          description: Report or cell not found
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Visitor Service — Badge Print Module
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/visitor/badges/templates:
    post:
      operationId: createBadgeTemplate
      tags: [Visitor]
      summary: Create a new badge template
      description: |
        Creates a new badge label template for visitor badge printing.
        Templates define the printer language (ZPL or ESC/POS), physical
        dimensions, and body content with placeholder tokens.
        Requires facility_admin, security_admin, tenant_admin, or super_admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, printerLanguage, templateBody]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Template display name
                printerLanguage:
                  type: string
                  enum: [zpl, escpos]
                  description: Printer command language
                templateBody:
                  type: string
                  minLength: 1
                  description: Template body with placeholder tokens (e.g. {{visitor_name}})
                badgeWidthMm:
                  type: integer
                  minimum: 1
                  default: 54
                  description: Badge width in millimeters
                badgeHeightMm:
                  type: integer
                  minimum: 1
                  default: 86
                  description: Badge height in millimeters
                visitorCategory:
                  type: string
                  enum: [default, walk_in, pre_registered, vip, contractor, group]
                  default: default
                  description: Visitor category this template applies to
      responses:
        "202":
          description: Template creation accepted for async processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []
    get:
      operationId: listBadgeTemplates
      tags: [Visitor]
      summary: List badge templates
      description: |
        Returns a paginated list of badge templates for the current tenant.
        Supports filtering by printer language, visitor category, and status.
      parameters:
        - name: printerLanguage
          in: query
          schema:
            type: string
            enum: [zpl, escpos]
        - name: visitorCategory
          in: query
          schema:
            type: string
            enum: [default, walk_in, pre_registered, vip, contractor, group]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived]
            default: active
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        "200":
          description: Paginated list of badge templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BadgeTemplate"
                  meta:
                    $ref: "#/components/schemas/Pagination"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/visitor/badges/templates/{templateId}:
    get:
      operationId: getBadgeTemplate
      tags: [Visitor]
      summary: Get badge template details
      description: Returns the full badge template record including body content and version chain.
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Badge template details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BadgeTemplate"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Template not found
      security:
        - bearerAuth: []
    patch:
      operationId: updateBadgeTemplate
      tags: [Visitor]
      summary: Update a badge template (creates new version)
      description: |
        Updates an existing badge template by creating a new version.
        Only provided fields are modified. The previous version is retained
        for rollback support. All fields are optional.
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                templateBody:
                  type: string
                  minLength: 1
                badgeWidthMm:
                  type: integer
                  minimum: 1
                badgeHeightMm:
                  type: integer
                  minimum: 1
                visitorCategory:
                  type: string
                  enum: [default, walk_in, pre_registered, vip, contractor, group]
      responses:
        "202":
          description: Template update accepted for async processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/visitor/badges/templates/{templateId}/archive:
    post:
      operationId: archiveBadgeTemplate
      tags: [Visitor]
      summary: Archive a badge template
      description: Marks a badge template as archived so it is no longer used for new print jobs.
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Archive accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/visitor/badges/templates/{templateId}/rollback:
    post:
      operationId: rollbackBadgeTemplate
      tags: [Visitor]
      summary: Rollback to previous template version
      description: |
        Re-activates the previous version of the badge template.
        Returns 422 if no previous version exists.
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Rollback accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Template not found
        "422":
          description: No previous version available for rollback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/visitor/badges/jobs/poll:
    get:
      operationId: pollBadgePrintJob
      tags: [Visitor]
      summary: Printer polls for next print job
      description: |
        Device-authenticated endpoint for printers to poll for their next
        queued print job. Returns the highest-priority job (ZPOPMIN from Redis
        sorted set). Returns 204 if no jobs are pending.
      responses:
        "200":
          description: Next print job available
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PrintJob"
        "204":
          description: No jobs pending
        "401":
          description: Missing or invalid device token
        "403":
          description: Device inactive or suspended
      security:
        - bearerAuth: []

  /v1/visitor/badges/jobs/{jobId}/acknowledge:
    post:
      operationId: acknowledgePrintJob
      tags: [Visitor]
      summary: Printer acknowledges successful print
      description: |
        Device-authenticated endpoint for printers to confirm a job was
        printed successfully. Transitions the job to completed state.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Acknowledgment accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "401":
          description: Missing or invalid device token
        "403":
          description: Device inactive or suspended
      security:
        - bearerAuth: []

  /v1/visitor/badges/jobs/{jobId}/fail:
    post:
      operationId: failPrintJob
      tags: [Visitor]
      summary: Printer reports print failure
      description: |
        Device-authenticated endpoint for printers to report a print failure.
        Triggers retry logic (exponential backoff, max 3 retries) or marks
        the job as failed after exhausting retries.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Optional error message describing the failure
      responses:
        "202":
          description: Failure report accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "401":
          description: Missing or invalid device token
        "403":
          description: Device inactive or suspended
      security:
        - bearerAuth: []

  /v1/visitor/badges/jobs:
    get:
      operationId: listPrintJobs
      tags: [Visitor]
      summary: List print jobs
      description: |
        Returns a paginated list of print jobs for the current tenant.
        Supports filtering by device and status.
      parameters:
        - name: deviceId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, in_progress, completed, failed]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        "200":
          description: Paginated list of print jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PrintJob"
                  meta:
                    $ref: "#/components/schemas/Pagination"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/visitor/badges/jobs/{jobId}/requeue:
    post:
      operationId: requeuePrintJob
      tags: [Visitor]
      summary: Manually re-queue a failed print job
      description: |
        Admin endpoint to re-queue a print job that has reached the failed
        terminal state. Creates a new queue entry for the same job.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Requeue accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/visitor/badges/jobs/priority:
    post:
      operationId: createPriorityPrintJob
      tags: [Visitor]
      summary: Create a priority print job
      description: |
        Admin endpoint to create a high-priority print job for a visitor pass.
        High-priority jobs are served before standard jobs in the printer queue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passId]
              properties:
                passId:
                  type: string
                  format: uuid
                  description: The visitor digital pass to print a badge for
                deviceId:
                  type: string
                  format: uuid
                  description: Target printer device (optional, consumer resolves if omitted)
                priority:
                  type: string
                  enum: [standard, high]
                  default: high
                  description: Print priority level
      responses:
        "202":
          description: Priority job creation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Meeting Service (meeting-core module)
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/meetings:
    post:
      operationId: createMeeting
      tags: [Meeting]
      summary: Create a meeting
      description: |
        Creates a meeting in `draft` state (Req 1.2). CQRS async — returns 202 with
        the minted meeting id. The consumer assigns a sequential meeting number and
        emits `meeting.created`.
        Roles: meeting_admin, committee_secretary, tenant_admin, super_admin, admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMeetingRequest"
      responses:
        "202":
          description: Meeting creation accepted for async processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingAcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []
    get:
      operationId: listMeetings
      tags: [Meeting]
      summary: List meetings
      description: |
        Returns a paginated, filterable list of meetings for the current tenant (Req 1.1).
        Read-only — all meeting roles within the tenant.
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/MeetingState"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/MeetingType"
        - name: committeeId
          in: query
          schema:
            type: string
            format: uuid
        - name: seriesId
          in: query
          schema:
            type: string
            format: uuid
        - name: chairpersonId
          in: query
          schema:
            type: string
            format: uuid
        - name: confidentialityLevel
          in: query
          schema:
            $ref: "#/components/schemas/ConfidentialityLevel"
        - name: from
          in: query
          description: Lower bound (inclusive) on scheduledAt (ISO 8601 with offset)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Upper bound (inclusive) on scheduledAt (ISO 8601 with offset)
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Paginated meeting list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingListResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/meetings/types:
    get:
      operationId: listMeetingTypes
      tags: [Meeting]
      summary: List meeting-type templates
      description: Returns meeting-type templates (tenant config). Read-only — all meeting roles.
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
        - name: isStatutory
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Paginated meeting-type list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingListResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []
    post:
      operationId: createMeetingType
      tags: [Meeting]
      summary: Create a meeting-type template
      description: |
        Creates a meeting-type template (tenant configuration).
        Admin-only: meeting_admin, tenant_admin, super_admin, admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMeetingTypeRequest"
      responses:
        "202":
          description: Meeting-type creation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingAcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires meeting_admin/tenant_admin
      security:
        - bearerAuth: []

  /v1/meetings/series:
    get:
      operationId: listMeetingSeries
      tags: [Meeting]
      summary: List recurring meeting series
      description: Returns recurring meeting series, filterable by committee/active. Read-only.
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
        - name: committeeId
          in: query
          schema:
            type: string
            format: uuid
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Paginated meeting-series list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingListResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []
    post:
      operationId: createMeetingSeries
      tags: [Meeting]
      summary: Constitute a recurring meeting series
      description: |
        Creates a recurring meeting series (Req 14.5).
        Roles: meeting_admin, committee_secretary, tenant_admin, super_admin, admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMeetingSeriesRequest"
      responses:
        "202":
          description: Series creation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingAcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/meetings/series/{seriesId}:
    patch:
      operationId: updateMeetingSeries
      tags: [Meeting]
      summary: Amend a recurring meeting series
      description: |
        Updates a recurring series (optimistic-locked on `version`).
        Roles: meeting_admin, committee_secretary, tenant_admin, super_admin, admin.
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeetingSeriesRequest"
      responses:
        "202":
          description: Series update accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingAcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Meeting series not found (MEETING_NOT_FOUND)
        "409":
          description: Optimistic-lock version conflict (MEETING_VERSION_CONFLICT)
      security:
        - bearerAuth: []

  /v1/meetings/series/{seriesId}/generate:
    post:
      operationId: generateMeetingSeriesInstances
      tags: [Meeting]
      summary: Generate meeting instances from a series
      description: |
        Materializes concrete `draft` meeting instances from the series pattern up to
        `upToDate`, carrying committee membership forward (Req 14.5).
        Roles: meeting_admin, committee_secretary, tenant_admin, super_admin, admin.
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateMeetingSeriesRequest"
      responses:
        "202":
          description: Generation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingAcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Meeting series not found (MEETING_NOT_FOUND)
      security:
        - bearerAuth: []

  /v1/meetings/dashboard/leadership:
    get:
      operationId: getMeetingLeadershipDashboard
      tags: [Meeting]
      summary: Leadership (chairperson) dashboard
      description: |
        Returns the calling user's leadership dashboard. Admins may inspect another
        user's dashboard via `?userId=`; non-admins requesting another user get 403.
      parameters:
        - name: userId
          in: query
          description: Target user (admin-only when different from caller)
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Leadership dashboard projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingDashboardResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role (non-admin requesting another user's dashboard)
      security:
        - bearerAuth: []

  /v1/meetings/dashboard/secretariat:
    get:
      operationId: getMeetingSecretariatDashboard
      tags: [Meeting]
      summary: Secretariat (secretary) dashboard
      description: |
        Returns the calling user's secretariat dashboard. Admins may inspect another
        user's dashboard via `?userId=`; non-admins requesting another user get 403.
      parameters:
        - name: userId
          in: query
          description: Target user (admin-only when different from caller)
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Secretariat dashboard projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingDashboardResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/meetings/dashboard/participant:
    get:
      operationId: getMeetingParticipantDashboard
      tags: [Meeting]
      summary: Participant dashboard
      description: |
        Returns the calling user's participant dashboard. Admins may inspect another
        user's dashboard via `?userId=`; non-admins requesting another user get 403.
      parameters:
        - name: userId
          in: query
          description: Target user (admin-only when different from caller)
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Participant dashboard projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingDashboardResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/meetings/{meetingId}:
    get:
      operationId: getMeeting
      tags: [Meeting]
      summary: Get meeting details
      description: Returns a single meeting (Req 1.1). Read-only — all meeting roles.
      parameters:
        - name: meetingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Meeting details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Meeting not found (MEETING_NOT_FOUND)
      security:
        - bearerAuth: []
    patch:
      operationId: updateMeeting
      tags: [Meeting]
      summary: Update a meeting
      description: |
        Updates an editable meeting field set (optimistic-locked on `version`). `status`
        is excluded — status changes flow through the transition endpoint.
        Roles: meeting_admin, committee_secretary, tenant_admin, super_admin, admin.
      parameters:
        - name: meetingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeetingRequest"
      responses:
        "202":
          description: Meeting update accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingAcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Meeting not found (MEETING_NOT_FOUND)
        "409":
          description: Optimistic-lock version conflict (MEETING_VERSION_CONFLICT)
      security:
        - bearerAuth: []
    delete:
      operationId: cancelMeeting
      tags: [Meeting]
      summary: Cancel (soft) a meeting
      description: |
        Soft-cancels a meeting by publishing `meeting.cancel`, moving it to the terminal
        `cancelled` state (Req 1.6). Never a hard delete. `reason` is required and recorded
        in the transition audit log.
        Roles: meeting_admin, committee_chairperson, tenant_admin, super_admin, admin.
      parameters:
        - name: meetingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelMeetingRequest"
      responses:
        "202":
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingAcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Meeting not found (MEETING_NOT_FOUND)
        "409":
          description: Optimistic-lock version conflict (MEETING_VERSION_CONFLICT)
      security:
        - bearerAuth: []

  /v1/meetings/{meetingId}/transition:
    post:
      operationId: transitionMeeting
      tags: [Meeting]
      summary: Drive a meeting state-machine transition
      description: |
        Transitions a meeting to a target state (Req 1.3–1.6). The consumer validates the
        transition against the tenant-configurable state machine and prerequisites (e.g.
        draft→scheduled needs a chairperson, ≥1 agenda item and a future date).
        Roles: meeting_admin, committee_chairperson, tenant_admin, super_admin, admin.
      parameters:
        - name: meetingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionMeetingRequest"
      responses:
        "202":
          description: Transition accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingAcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Meeting not found (MEETING_NOT_FOUND)
        "409":
          description: Optimistic-lock version conflict (MEETING_VERSION_CONFLICT)
        "422":
          description: |
            Business-rule violation — invalid transition (MEETING_INVALID_TRANSITION)
            or quorum not established (MEETING_QUORUM_NOT_MET)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/meetings/{meetingId}/transitions:
    get:
      operationId: getMeetingTransitions
      tags: [Meeting]
      summary: Get the meeting transition audit log
      description: Returns the state-transition audit log for a meeting (Req 1.7). Read-only.
      parameters:
        - name: meetingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Transition audit log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingTransitionLogResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Meeting not found (MEETING_NOT_FOUND)
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Inspection Service — Mobile Sync (SVC-102)
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/inspection/sync/upload/chunked:
    post:
      operationId: chunkedSyncUpload
      tags: [Inspection]
      summary: Chunked upload for large evidence files
      description: |
        Accepts a single chunk of a large evidence file captured offline.
        Each chunk is processed asynchronously via the sync consumer pipeline.
        The client tracks chunk progress via the returned `progressToken`.
        Part of mobile-specific endpoints (SVC-102).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChunkedUploadRequest"
      responses:
        "202":
          description: Chunk accepted for async processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChunkedUploadResponse"
        "400":
          description: Validation error (invalid UUID, missing fields, non-positive integers)
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role (requires inspector, inspection_admin, tenant_admin, or super_admin)
      security:
        - bearerAuth: []

  /v1/inspection/sync/responses/partial:
    post:
      operationId: savePartialResponses
      tags: [Inspection]
      summary: Save partial checklist responses
      description: |
        Persists in-progress checklist responses from the mobile app before
        final submission. Enables resume-from-where-you-left-off offline UX.
        Processed asynchronously via the sync upload consumer.
        Part of mobile-specific endpoints (SVC-102).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartialResponseRequest"
      responses:
        "202":
          description: Partial responses accepted for async processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartialResponseResponse"
        "400":
          description: Validation error (invalid UUID, missing fields, invalid percentage)
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role (requires inspector, inspection_admin, tenant_admin, or super_admin)
      security:
        - bearerAuth: []

  /v1/inspection/sync/packages/{id}/manifest:
    get:
      operationId: getSyncPackageManifest
      tags: [Inspection]
      summary: Get lightweight sync package manifest
      description: |
        Returns package metadata (size, generation timestamp, item list) without
        downloading the full package. Allows mobile clients to assess whether a
        full download is needed and to display progress indicators.
        Part of mobile-specific endpoints (SVC-102).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Sync package identifier
      responses:
        "200":
          description: Package manifest returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPackageManifestResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role (requires inspector, inspection_admin, tenant_admin, or super_admin)
        "404":
          description: Sync package not found (NOT_FOUND)
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Catalogue Service
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/catalogue/products:
    get:
      operationId: listCatalogueProducts
      tags: [Catalogue]
      summary: List products
      description: |
        Returns a paginated list of products for the current tenant, optionally
        filtered by lifecycle status, product line, or a free-text search on the
        product name. Requires catalogue_user, catalogue_admin, or super_admin role.
      parameters:
        - $ref: "#/components/parameters/CatalogueLimitParam"
        - $ref: "#/components/parameters/CatalogueOffsetParam"
        - name: lifecycleStatus
          in: query
          required: false
          schema:
            type: string
            enum: [draft, active, suspended, withdrawn, closed_to_new_business]
          description: Filter by lifecycle status
        - name: lineId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by product line (level-1 grouping)
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Free-text match on the product name
      responses:
        "200":
          description: Paginated list of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogueProduct"
                  meta:
                    $ref: "#/components/schemas/CatalogueListMeta"
        "400":
          description: Validation error (invalid UUID, limit out of range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires catalogue_user, catalogue_admin, or super_admin
      security:
        - bearerAuth: []
    post:
      operationId: createCatalogueProduct
      tags: [Catalogue]
      summary: Create a product
      description: |
        Creates a product in the 4-level catalogue hierarchy
        (line → family → product → variant). New products default to `draft`
        lifecycle status. Emits `catalogue.product.created` via the transactional
        outbox. Requires catalogue_admin or super_admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatalogueProductRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
        "400":
          description: Validation error (missing name, invalid UUID, invalid lifecycleStatus)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires catalogue_admin or super_admin
      security:
        - bearerAuth: []

  /v1/catalogue/products/tree:
    get:
      operationId: getCatalogueProductTree
      tags: [Catalogue]
      summary: Get the full product hierarchy tree
      description: |
        Returns the tenant's products as a nested tree built from `parentId`
        links. Depth determines the reported level: root = `line`, then
        `family`, `product`, `variant`. Requires catalogue_user,
        catalogue_admin, or super_admin role.
      responses:
        "200":
          description: Product hierarchy tree (roots with nested children)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogueProductTreeNode"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires catalogue_user, catalogue_admin, or super_admin
      security:
        - bearerAuth: []

  /v1/catalogue/products/{id}:
    get:
      operationId: getCatalogueProduct
      tags: [Catalogue]
      summary: Get a single product
      description: |
        Returns one product by id, scoped to the caller's tenant. Requires
        catalogue_user, catalogue_admin, or super_admin role.
      parameters:
        - $ref: "#/components/parameters/CatalogueProductIdPath"
      responses:
        "200":
          description: The product
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CatalogueProduct"
        "400":
          description: Validation error (invalid UUID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires catalogue_user, catalogue_admin, or super_admin
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
    patch:
      operationId: updateCatalogueProduct
      tags: [Catalogue]
      summary: Update a product (with lifecycle transition validation)
      description: |
        Partially updates a product. Two business rules are enforced before the
        write:

        - **Lifecycle transitions** — a change to `lifecycleStatus` must be a
          legal transition (422 `INVALID_TRANSITION` otherwise).
        - **Editability** — metadata fields (`name`, `description`, `lineId`,
          `familyId`, `parentId`, `regulatoryMetadata`) may only be changed while
          the product is in an editable status (422 `NOT_EDITABLE` otherwise).
          A lifecycle-only change is always allowed if the transition is legal.

        Writes are optimistic-locked: supply `version` to guard against
        concurrent edits, otherwise the row's current version is used. Emits
        `catalogue.product.updated`. Requires catalogue_admin or super_admin role.
      parameters:
        - $ref: "#/components/parameters/CatalogueProductIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCatalogueProductRequest"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      version:
                        type: integer
                        description: The new version after the update
        "400":
          description: Validation error (invalid UUID, invalid lifecycleStatus)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires catalogue_admin or super_admin
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            `VERSION_CONFLICT` — the product was modified concurrently; re-read
            and retry with the current version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            Business rule violation. Possible `code` values:
            - `INVALID_TRANSITION` — the requested lifecycle transition is not allowed.
            - `NOT_EDITABLE` — metadata cannot be modified in the product's current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
    delete:
      operationId: deleteCatalogueProduct
      tags: [Catalogue]
      summary: Soft-delete (withdraw) a product
      description: |
        Soft-deletes a product by moving it to `withdrawn`. The row is never
        hard-deleted. Optimistic-locked on the product's current version; emits
        `catalogue.product.deleted`. Requires catalogue_admin or super_admin role.
      parameters:
        - $ref: "#/components/parameters/CatalogueProductIdPath"
      responses:
        "200":
          description: Product withdrawn
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      lifecycleStatus:
                        type: string
                        enum: [withdrawn]
        "400":
          description: Validation error (invalid UUID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires catalogue_admin or super_admin
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            `VERSION_CONFLICT` — the product was modified concurrently; re-read
            and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/catalogue/products/{id}/availability:
    post:
      operationId: setCatalogueProductAvailability
      tags: [Catalogue]
      summary: Set product availability for a circle / region / office
      description: |
        Records a geographic availability entry for a product. Any combination
        of `circleId`, `regionId`, and `officeId` may be supplied — all are
        optional, and omitting all three records tenant-wide availability.
        `available` defaults to `true`.

        Availability is part of the product's published shape, so this also emits
        `catalogue.product.updated` (with the new `availabilityId`) via the
        transactional outbox. Requires catalogue_admin or super_admin role.
      parameters:
        - $ref: "#/components/parameters/CatalogueProductIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetProductAvailabilityRequest"
      responses:
        "201":
          description: Availability entry created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: ID of the created availability entry
                      productId:
                        type: string
                        format: uuid
        "400":
          description: Validation error (invalid UUID, non-boolean `available`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires catalogue_admin or super_admin
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/catalogue/rates:
    get:
      operationId: listCatalogueRates
      tags: [Catalogue]
      summary: List product rates
      description: |
        Returns a paginated list of rates for a given product, optionally
        filtered by effective date. Requires catalogue_user, catalogue_admin,
        or super_admin role.
      parameters:
        - name: productId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: The product to retrieve rates for
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter rates effective on this date (YYYY-MM-DD)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Number of results to return (max 200)
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Offset for pagination
      responses:
        "200":
          description: Paginated list of rates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogueRate"
                  meta:
                    $ref: "#/components/schemas/CatalogueListMeta"
        "400":
          description: Validation error (missing productId, invalid UUID, invalid date)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires catalogue_user, catalogue_admin, or super_admin
      security:
        - bearerAuth: []
    post:
      operationId: createCatalogueRate
      tags: [Catalogue]
      summary: Create a rate entry for a product
      description: |
        Records a new effective-dated rate for a product. `rateValueMinor` is a
        **bigint in minor units** (paise/cents) and is accepted as a decimal
        string so values above 2^53 survive JSON round-tripping. Emits
        `catalogue.rate.created` via the transactional outbox (the event payload
        carries `rateValueMinor` as a string for the same reason). Requires
        catalogue_admin or super_admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatalogueRateRequest"
      responses:
        "201":
          description: Rate created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
        "400":
          description: |
            Validation error (missing `productId`/`effectiveFrom`/`rateValueMinor`/`source`,
            invalid UUID, malformed date, non-integer rate value)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires catalogue_admin or super_admin
      security:
        - bearerAuth: []

  /v1/catalogue/rates/current:
    get:
      operationId: getCurrentCatalogueRate
      tags: [Catalogue]
      summary: Get the currently effective rate for a product
      description: |
        Returns the most recent rate whose `effectiveDate` is on or before today
        for the given product. Requires catalogue_user, catalogue_admin, or
        super_admin role.
      parameters:
        - name: productId
          in: query
          required: true
          description: The product to resolve the current rate for
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The currently effective rate
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CatalogueRate"
        "400":
          description: Validation error (missing or malformed `productId`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires catalogue_user, catalogue_admin, or super_admin
        "404":
          description: |
            `NOT_FOUND` — no rate is currently effective for this product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/catalogue/rates/{id}:
    patch:
      operationId: updateCatalogueRate
      tags: [Catalogue]
      summary: Update a rate entry
      description: |
        Partially updates a rate. `effectiveTo` accepts `null` to re-open the
        period. `rateValueMinor` is a bigint in minor units supplied as a
        decimal string. The write is optimistic-locked: supply `version` to
        guard against concurrent edits, otherwise the row's current version is
        used. Emits `catalogue.rate.updated` — the event payload carries only
        the fields that actually changed. Requires catalogue_admin or
        super_admin role.
      parameters:
        - $ref: "#/components/parameters/CatalogueRateIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCatalogueRateRequest"
      responses:
        "200":
          description: Rate updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      version:
                        type: integer
                        description: The new version after the update
        "400":
          description: Validation error (invalid UUID, malformed date, non-integer rate value)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires catalogue_admin or super_admin
        "404":
          description: Rate not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            `VERSION_CONFLICT` — the rate was modified concurrently; re-read and
            retry with the current version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/catalogue/bundles:
    get:
      operationId: listCatalogueBundles
      tags: [Catalogue]
      summary: List product bundles
      description: |
        Returns a paginated list of bundles for the current tenant. Requires
        catalogue_user, catalogue_admin, or super_admin role.
      parameters:
        - $ref: "#/components/parameters/CatalogueLimitParam"
        - $ref: "#/components/parameters/CatalogueOffsetParam"
      responses:
        "200":
          description: Paginated list of bundles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogueBundle"
                  meta:
                    $ref: "#/components/schemas/CatalogueListMeta"
        "400":
          description: Validation error (limit/offset out of range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires catalogue_user, catalogue_admin, or super_admin
      security:
        - bearerAuth: []
    post:
      operationId: createCatalogueBundle
      tags: [Catalogue]
      summary: Create a product bundle
      description: |
        Creates a bundle from one or more component products. Every component
        must exist and be in `active` lifecycle status, otherwise the request is
        rejected with 422 `INVALID_COMPONENTS` (the message lists each offending
        product and the reason). New bundles start with `status: active` and
        `version: 1`. Emits `catalogue.bundle.created` via the transactional
        outbox. Requires catalogue_admin or super_admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatalogueBundleRequest"
      responses:
        "201":
          description: Bundle created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
        "400":
          description: |
            Validation error (missing `name`, empty `componentProductIds`,
            invalid UUID, name longer than 200 characters)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires catalogue_admin or super_admin
        "422":
          description: |
            `INVALID_COMPONENTS` — one or more component products are missing or
            not in `active` lifecycle status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/catalogue/bundles/{id}:
    get:
      operationId: getCatalogueBundle
      tags: [Catalogue]
      summary: Get a bundle with its component product details
      description: |
        Returns one bundle by id together with a `components` array holding the
        resolved component products (not just their ids). Requires
        catalogue_user, catalogue_admin, or super_admin role.
      parameters:
        - $ref: "#/components/parameters/CatalogueBundleIdPath"
      responses:
        "200":
          description: The bundle with resolved components
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CatalogueBundleDetail"
        "400":
          description: Validation error (invalid UUID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires catalogue_user, catalogue_admin, or super_admin
        "404":
          description: Bundle not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
    patch:
      operationId: updateCatalogueBundle
      tags: [Catalogue]
      summary: Update a bundle
      description: |
        Partially updates a bundle. When `componentProductIds` is supplied the
        new component set is re-validated (422 `INVALID_COMPONENTS` if any
        component is missing or not `active`). The write is optimistic-locked:
        supply `version` to guard against concurrent edits, otherwise the row's
        current version is used. Emits `catalogue.bundle.updated`. Requires
        catalogue_admin or super_admin role.
      parameters:
        - $ref: "#/components/parameters/CatalogueBundleIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCatalogueBundleRequest"
      responses:
        "200":
          description: Bundle updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      version:
                        type: integer
                        description: The new version after the update
        "400":
          description: Validation error (invalid UUID, empty `componentProductIds`, invalid `status`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires catalogue_admin or super_admin
        "404":
          description: Bundle not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            `VERSION_CONFLICT` — the bundle was modified concurrently; re-read
            and retry with the current version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            `INVALID_COMPONENTS` — one or more of the new component products are
            missing or not in `active` lifecycle status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
    delete:
      operationId: deleteCatalogueBundle
      tags: [Catalogue]
      summary: Soft-delete a bundle
      description: |
        Soft-deletes a bundle by moving `status` to `deleted`; the row is never
        hard-deleted. Optimistic-locked on the bundle's current version. Emits
        `catalogue.bundle.deleted`. Requires catalogue_admin or super_admin role.
      parameters:
        - $ref: "#/components/parameters/CatalogueBundleIdPath"
      responses:
        "200":
          description: Bundle soft-deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [deleted]
        "400":
          description: Validation error (invalid UUID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires catalogue_admin or super_admin
        "404":
          description: Bundle not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            `VERSION_CONFLICT` — the bundle was modified concurrently; re-read
            and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/catalogue/eligibility/rules:
    post:
      operationId: createEligibilityRule
      tags: [Catalogue]
      summary: Create an eligibility rule
      description: |
        Creates a new eligibility rule for a product. Rules define the criteria
        a customer must meet to be eligible for the product. Requires
        catalogue_admin or super_admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, ruleType, criteria]
              properties:
                productId:
                  type: string
                  format: uuid
                  description: The product this rule applies to
                ruleType:
                  type: string
                  enum: [age_range, residency, segment, min_income, custom]
                  description: Category of eligibility rule
                criteria:
                  type: object
                  additionalProperties: true
                  description: |
                    Rule-specific criteria object. Shape depends on ruleType:
                    - age_range: `{ minAge: number, maxAge: number }`
                    - residency: `{ allowedStates: string[] }`
                    - segment: `{ segments: string[] }`
                    - min_income: `{ minAnnualIncome: number }`
                    - custom: arbitrary key-value criteria
      responses:
        "201":
          description: Eligibility rule created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: ID of the created rule
        "400":
          description: Validation error (invalid UUID, missing fields, invalid ruleType)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires catalogue_admin or super_admin
      security:
        - bearerAuth: []
    get:
      operationId: listEligibilityRules
      tags: [Catalogue]
      summary: List eligibility rules for a product
      description: |
        Returns all active eligibility rules for a given product. Requires
        catalogue_user, catalogue_admin, or super_admin role.
      parameters:
        - name: productId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: The product to retrieve eligibility rules for
      responses:
        "200":
          description: List of eligibility rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        productId:
                          type: string
                          format: uuid
                        ruleType:
                          type: string
                          enum: [age_range, residency, segment, min_income, custom]
                        criteria:
                          type: object
                          additionalProperties: true
                        status:
                          type: string
                          enum: [active, deleted]
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
        "400":
          description: Validation error (missing or invalid productId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires catalogue_user, catalogue_admin, or super_admin
      security:
        - bearerAuth: []

  /v1/catalogue/eligibility/rules/{id}:
    delete:
      operationId: deleteEligibilityRule
      tags: [Catalogue]
      summary: Soft-delete an eligibility rule
      description: |
        Marks an eligibility rule as deleted (soft-delete). The rule will no
        longer be evaluated during eligibility checks. Requires catalogue_admin
        or super_admin role.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the eligibility rule to delete
      responses:
        "200":
          description: Rule soft-deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [deleted]
        "400":
          description: Validation error (invalid UUID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires catalogue_admin or super_admin
        "404":
          description: Eligibility rule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/catalogue/eligibility/check:
    post:
      operationId: checkEligibility
      tags: [Catalogue]
      summary: Check product eligibility for a customer
      description: |
        Evaluates customer attributes against eligibility rules for the
        specified products. Returns which products the customer is eligible for
        and evaluation details per product. Products with no rules defined are
        considered eligible by default. Requires catalogue_user, catalogue_admin,
        or super_admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerAttributes, productIds]
              properties:
                customerAttributes:
                  type: object
                  additionalProperties: true
                  description: |
                    Customer profile attributes to evaluate against rules.
                    Keys should match the criteria fields defined in rules
                    (e.g., age, state, segment, annualIncome).
                productIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                  description: Product IDs to check eligibility for (at least one required)
      responses:
        "200":
          description: Eligibility evaluation results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      eligibleProductIds:
                        type: array
                        items:
                          type: string
                          format: uuid
                        description: Products the customer is eligible for
                      evaluatedRules:
                        type: integer
                        description: Total number of rules evaluated across all products
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            productId:
                              type: string
                              format: uuid
                            eligible:
                              type: boolean
                            reasons:
                              type: array
                              items:
                                type: string
                              description: Human-readable explanation of eligibility decision
        "400":
          description: Validation error (missing fields, invalid UUIDs, empty productIds array)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires catalogue_user, catalogue_admin, or super_admin
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # CDP Service (Customer Data Platform)
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/cdp/profiles:
    get:
      operationId: listCdpProfiles
      tags: [CDP]
      summary: List golden profiles
      description: |
        Returns a paginated list of golden profiles for the current tenant.
        Profiles that were absorbed by a merge (`profileType: merged`) are
        excluded from reads. Roles: cdp_user, cdp_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/CdpLimitParam"
        - $ref: "#/components/parameters/CdpOffsetParam"
        - name: search
          in: query
          description: Free-text match against profile attributes
          schema:
            type: string
        - name: profileType
          in: query
          schema:
            type: string
            example: individual
        - name: segmentId
          in: query
          description: Restrict to members of a segment
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paginated profile list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CdpProfile"
                  meta:
                    $ref: "#/components/schemas/CdpListMeta"
        "400":
          description: Validation error (limit/offset out of range, segmentId not a UUID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []
    post:
      operationId: createCdpProfile
      tags: [CDP]
      summary: Create a golden profile
      description: |
        Creates a golden profile with free-form attributes and an initial
        source-lineage trail. Roles: cdp_user, cdp_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCdpProfileRequest"
      responses:
        "201":
          description: Profile created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CdpProfile"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/cdp/profiles/{id}:
    parameters:
      - $ref: "#/components/parameters/CdpProfileIdPath"
    get:
      operationId: getCdpProfile
      tags: [CDP]
      summary: Get a golden profile with source lineage
      description: |
        Read-through cached (`cdp:{tenant}:profile:{id}`). Merged profiles are
        reported as 404. Roles: cdp_user, cdp_admin, super_admin.
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CdpProfile"
        "400":
          description: Validation error (id is not a UUID)
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Profile not found or merged (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
    patch:
      operationId: updateCdpProfile
      tags: [CDP]
      summary: Update profile attributes (optimistic locking)
      description: |
        Attributes are shallow-merged over the stored attributes and
        `sourceLineage` entries are appended, so lineage is never lost.
        `version` is mandatory — a stale version returns 409.
        Roles: cdp_user, cdp_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCdpProfileRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      updated:
                        type: boolean
                      version:
                        type: integer
                        description: The new version after the update
        "400":
          description: Validation error (missing version)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Profile not found or merged (NOT_FOUND)
        "409":
          description: Concurrent modification (VERSION_CONFLICT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/cdp/profiles/merge:
    post:
      operationId: mergeCdpProfiles
      tags: [CDP]
      summary: Merge two profiles (winner survives)
      description: |
        Folds the loser profile into the winner: attributes are merged,
        source lineage is combined, and the loser is marked
        `profileType: merged` so it disappears from reads.
        Elevated roles only: cdp_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [winnerId, loserId]
              properties:
                winnerId:
                  type: string
                  format: uuid
                loserId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Profiles merged
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      winnerId:
                        type: string
                        format: uuid
                      loserId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [merged]
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires cdp_admin or super_admin
        "404":
          description: Winner or loser profile not found (NOT_FOUND)
        "422":
          description: |
            Merge rejected (`MERGE_INVALID`) — e.g. self-merge, or a profile
            that is already merged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/cdp/profiles/{id}/timeline:
    parameters:
      - $ref: "#/components/parameters/CdpProfileIdPath"
    get:
      operationId: getCdpProfileTimeline
      tags: [CDP]
      summary: Consolidated interaction timeline for a profile
      description: |
        Chronological view of every ingested interaction for the profile.
        Roles: cdp_user, cdp_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/CdpLimitParam"
        - $ref: "#/components/parameters/CdpOffsetParam"
      responses:
        "200":
          description: Paginated timeline
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CdpEvent"
                  meta:
                    $ref: "#/components/schemas/CdpListMeta"
        "400":
          description: Validation error
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Profile not found or merged (NOT_FOUND)
      security:
        - bearerAuth: []

  /v1/cdp/profiles/{id}/events:
    parameters:
      - $ref: "#/components/parameters/CdpProfileIdPath"
    get:
      operationId: listCdpProfileEvents
      tags: [CDP]
      summary: Event history for a profile
      description: |
        Paginated raw event history, optionally filtered by `eventType`.
        Roles: cdp_user, cdp_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/CdpLimitParam"
        - $ref: "#/components/parameters/CdpOffsetParam"
        - name: eventType
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated event list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CdpEvent"
                  meta:
                    $ref: "#/components/schemas/CdpListMeta"
        "400":
          description: Validation error
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Profile not found or merged (NOT_FOUND)
      security:
        - bearerAuth: []

  /v1/cdp/events:
    post:
      operationId: ingestCdpEvent
      tags: [CDP]
      summary: Ingest a single interaction event
      description: |
        Records one event against a profile. The profile's `attributes.consent`
        flags are checked before the write — an event type the data subject has
        not consented to is rejected with 422 `CONSENT_DENIED` (DPDP Act 2023).
        Roles: cdp_user, cdp_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestCdpEventRequest"
      responses:
        "201":
          description: Event ingested
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      profileId:
                        type: string
                        format: uuid
                      eventType:
                        type: string
                      status:
                        type: string
                        enum: [ingested]
        "400":
          description: Validation error (occurredAt must be ISO-8601)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Profile not found or merged (NOT_FOUND)
        "422":
          description: Consent not granted for this event type (CONSENT_DENIED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/cdp/events/batch:
    post:
      operationId: ingestCdpEventBatch
      tags: [CDP]
      summary: Ingest a batch of events (max 100)
      description: |
        Partial-success batch ingest. Each entry is validated independently
        (profile existence + consent) and reported in `results`; accepted
        entries are written in a single transaction. Returns 201 when at
        least one event was ingested, 422 when every entry was rejected.
        Roles: cdp_user, cdp_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: "#/components/schemas/IngestCdpEventRequest"
      responses:
        "201":
          description: At least one event ingested
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CdpBatchIngestResult"
        "400":
          description: Validation error (empty array, or more than 100 events)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "422":
          description: Every event in the batch was rejected (see `results`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CdpBatchIngestResult"
      security:
        - bearerAuth: []

  /v1/cdp/resolve:
    post:
      operationId: resolveCdpIdentity
      tags: [CDP]
      summary: Resolve identifiers to a golden profile
      description: |
        Deterministic identity resolution. Identifier values are never stored
        in the clear — only a salted hash per (type, value) is persisted.

        Outcomes (`data.status`):
        - `matched` (200) — exactly one profile matched.
        - `ambiguous` (200) — several profiles matched; confidence is capped
          below the auto-match threshold and a merge candidate is queued for
          a data steward. Never auto-merges.
        - `created` (201) — no match and `createIfMissing` was true; a new
          golden profile is created and all identifiers linked to it.
        - `not_found` (200) — no match and `createIfMissing` was false.

        Roles: cdp_user, cdp_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifiers]
              properties:
                identifiers:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    required: [type, value]
                    properties:
                      type:
                        type: string
                        maxLength: 64
                        example: email
                      value:
                        type: string
                        maxLength: 256
                        description: Hashed before storage; never persisted in the clear
                attributes:
                  type: object
                  additionalProperties: true
                  description: Seed attributes applied when a profile is created
                createIfMissing:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Resolution outcome (matched / ambiguous / not_found)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CdpResolveResult"
        "201":
          description: No match — a new golden profile was created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CdpResolveResult"
        "400":
          description: Validation error (no identifiers, or more than 10)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/cdp/identity/{id}:
    get:
      operationId: listCdpIdentityLinks
      tags: [CDP]
      summary: List identifier links for a profile
      description: |
        Returns the identity-graph edges for a profile (identifier type,
        hash, and match confidence). Raw identifier values are not returned.

        Note: on this route `{id}` is a **profile** id (the handler binds it as
        `profileId`), whereas on `DELETE` it is an **identity link** id.
        Roles: cdp_user, cdp_admin, super_admin.
      parameters:
        - name: id
          in: path
          required: true
          description: Golden profile id
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Identity links
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CdpIdentityLink"
        "400":
          description: Validation error (id is not a UUID)
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []
    delete:
      operationId: unlinkCdpIdentity
      tags: [CDP]
      summary: Unlink an identifier from its profile
      description: |
        Removes one identity-graph edge and emits an `audit.event.record`
        event. Elevated roles only: cdp_admin, super_admin.
      parameters:
        - name: id
          in: path
          required: true
          description: Identity link id (not the profile id)
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Identity link removed
        "400":
          description: Validation error (id is not a UUID)
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires cdp_admin or super_admin
        "404":
          description: Identity link not found (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/cdp/segments:
    get:
      operationId: listCdpSegments
      tags: [CDP]
      summary: List segments
      description: Roles — cdp_user, cdp_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/CdpLimitParam"
        - $ref: "#/components/parameters/CdpOffsetParam"
      responses:
        "200":
          description: Paginated segment list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CdpSegment"
                  meta:
                    $ref: "#/components/schemas/CdpListMeta"
        "400":
          description: Validation error
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []
    post:
      operationId: createCdpSegment
      tags: [CDP]
      summary: Create a segment definition
      description: |
        `dynamic` segments carry a criteria tree (`{ logic, conditions[] }`)
        that is evaluated on read; `static` segments hold a fixed membership.
        Malformed criteria are rejected with 400 `INVALID_CRITERIA`.
        Elevated roles only: cdp_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  maxLength: 1000
                segmentType:
                  type: string
                  enum: [dynamic, static]
                  default: dynamic
                criteria:
                  $ref: "#/components/schemas/CdpSegmentCriteria"
      responses:
        "201":
          description: Segment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CdpSegment"
        "400":
          description: |
            Validation error, or malformed criteria tree (`INVALID_CRITERIA`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires cdp_admin or super_admin
      security:
        - bearerAuth: []

  /v1/cdp/segments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCdpSegment
      tags: [CDP]
      summary: Get a segment with its current member count
      description: |
        For `dynamic` segments the member count is recomputed from the criteria
        at read time. Roles: cdp_user, cdp_admin, super_admin.
      responses:
        "200":
          description: Segment
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CdpSegment"
        "400":
          description: Validation error
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Segment not found (NOT_FOUND)
      security:
        - bearerAuth: []
    patch:
      operationId: updateCdpSegment
      tags: [CDP]
      summary: Update a segment (optimistic locking)
      description: |
        `version` is mandatory; a stale version returns 409.
        Elevated roles only: cdp_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  maxLength: 1000
                criteria:
                  $ref: "#/components/schemas/CdpSegmentCriteria"
                status:
                  type: string
                  enum: [active, paused, archived]
                version:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Segment updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      updated:
                        type: boolean
                      version:
                        type: integer
        "400":
          description: Validation error, or malformed criteria (`INVALID_CRITERIA`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires cdp_admin or super_admin
        "404":
          description: Segment not found (NOT_FOUND)
        "409":
          description: Concurrent modification (VERSION_CONFLICT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
    delete:
      operationId: deleteCdpSegment
      tags: [CDP]
      summary: Soft-delete a segment
      description: |
        Soft delete (archival) under the current version guard.
        Elevated roles only: cdp_admin, super_admin.
      responses:
        "204":
          description: Segment deleted
        "400":
          description: Validation error
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires cdp_admin or super_admin
        "404":
          description: Segment not found (NOT_FOUND)
        "409":
          description: Concurrent modification (VERSION_CONFLICT)
      security:
        - bearerAuth: []

  /v1/cdp/segments/{id}/members:
    get:
      operationId: listCdpSegmentMembers
      tags: [CDP]
      summary: List profiles that belong to a segment
      description: |
        Evaluates the segment criteria and returns the matching profiles.
        A segment with no criteria tree returns an empty page rather than an
        error. Roles: cdp_user, cdp_admin, super_admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CdpLimitParam"
        - $ref: "#/components/parameters/CdpOffsetParam"
      responses:
        "200":
          description: Paginated member profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CdpProfile"
                  meta:
                    $ref: "#/components/schemas/CdpListMeta"
        "400":
          description: Validation error
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Segment not found (NOT_FOUND)
      security:
        - bearerAuth: []

  /v1/cdp/steward/queue:
    get:
      operationId: listCdpStewardQueue
      tags: [CDP]
      summary: List merge candidates awaiting stewardship
      description: |
        Ambiguous identity-resolution outcomes land here instead of being
        auto-merged. Roles: cdp_steward, cdp_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/CdpLimitParam"
        - $ref: "#/components/parameters/CdpOffsetParam"
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: Paginated merge-candidate queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CdpMergeCandidate"
                  meta:
                    $ref: "#/components/schemas/CdpListMeta"
        "400":
          description: Validation error (unknown status value)
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/cdp/steward/decide:
    post:
      operationId: decideCdpMergeCandidate
      tags: [CDP]
      summary: Approve or reject a queued merge candidate
      description: |
        On `approve` the two profiles are merged and the loser's identity
        links are reassigned to the winner, all in one transaction. Only a
        `pending` request can be decided — a second decision returns 409
        `ALREADY_DECIDED`. Roles: cdp_steward, cdp_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mergeRequestId, decision]
              properties:
                mergeRequestId:
                  type: string
                  format: uuid
                decision:
                  type: string
                  enum: [approve, reject]
                reason:
                  type: string
                  maxLength: 1000
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      mergeRequestId:
                        type: string
                        format: uuid
                      decision:
                        type: string
                        enum: [approved, rejected]
                      status:
                        type: string
                        enum: [approved, rejected]
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Merge request not found (NOT_FOUND)
        "409":
          description: Already decided, or decided concurrently (ALREADY_DECIDED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Loyalty Service — Member Enrolments
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/loyalty/enrol:
    post:
      operationId: enrolLoyaltyMember
      tags: [Loyalty]
      summary: Enrol a profile in a loyalty program
      description: |
        Enrols a CDP golden profile in a loyalty program. The program must exist
        and be `active`; a profile may hold only one non-cancelled enrolment per
        program. New enrolments start with a zero points balance.
        Roles: loyalty_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolLoyaltyMemberRequest"
      responses:
        "201":
          description: Enrolment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/LoyaltyEnrolment"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Program not found (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            Business rule violation (`ENROLMENT_INVALID`) — the program is not
            active, or the profile already has a live enrolment in it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/loyalty/enrolments:
    get:
      operationId: listLoyaltyEnrolments
      tags: [Loyalty]
      summary: List enrolments for the tenant
      description: |
        Returns enrolments for the current tenant, newest enrolment first.
        When `programId` is supplied the result is restricted to that program;
        when it is omitted **all** enrolments for the tenant are returned
        (previously this returned an empty list, so members could not be
        enumerated without knowing a program id).
        Roles: loyalty_user, loyalty_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/LoyaltyLimitParam"
        - $ref: "#/components/parameters/LoyaltyOffsetParam"
        - name: programId
          in: query
          required: false
          description: Restrict the result to a single loyalty program
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paginated enrolments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LoyaltyEnrolment"
                  meta:
                    $ref: "#/components/schemas/LoyaltyListMeta"
        "400":
          description: Validation error (limit/offset out of range, malformed programId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/loyalty/enrolments/{id}:
    get:
      operationId: getLoyaltyEnrolment
      tags: [Loyalty]
      summary: Get a single enrolment
      description: |
        Returns one enrolment by id, scoped to the caller's tenant.
        Roles: loyalty_user, loyalty_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/LoyaltyEnrolmentIdPath"
      responses:
        "200":
          description: The enrolment
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/LoyaltyEnrolment"
        "400":
          description: Validation error (id is not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Enrolment not found (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/loyalty/enrolments/{id}/status:
    patch:
      operationId: updateLoyaltyEnrolmentStatus
      tags: [Loyalty]
      summary: Suspend, reinstate, or cancel an enrolment
      description: |
        Moves an enrolment through its lifecycle under an optimistic-lock guard.
        Allowed transitions: `active` ⇄ `suspended`, and either state →
        `cancelled` (terminal). Roles: loyalty_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/LoyaltyEnrolmentIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLoyaltyEnrolmentStatusRequest"
      responses:
        "200":
          description: Status updated (returns the incremented version)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        $ref: "#/components/schemas/LoyaltyEnrolmentStatus"
                      version:
                        type: integer
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Enrolment not found (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            Optimistic-lock failure (`VERSION_CONFLICT`) — the enrolment was
            modified concurrently; re-read and retry with the current version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Illegal state transition (`INVALID_TRANSITION`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/loyalty/members/{profileId}:
    get:
      operationId: listLoyaltyEnrolmentsForProfile
      tags: [Loyalty]
      summary: List a profile's enrolments across programs
      description: |
        Returns every enrolment held by one CDP golden profile within the
        tenant, newest first. Roles: loyalty_user, loyalty_admin, super_admin.
      parameters:
        - name: profileId
          in: path
          required: true
          description: CDP golden profile id
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/LoyaltyLimitParam"
        - $ref: "#/components/parameters/LoyaltyOffsetParam"
      responses:
        "200":
          description: Paginated enrolments for the profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LoyaltyEnrolment"
                  meta:
                    $ref: "#/components/schemas/LoyaltyListMeta"
        "400":
          description: Validation error (profileId is not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Loyalty Service — Programs
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/loyalty/programs:
    get:
      operationId: listLoyaltyPrograms
      tags: [Loyalty]
      summary: List loyalty programs
      description: |
        Returns a paginated list of loyalty programs for the current tenant.
        `earnRatio` is a `bigint` serialized as a decimal **string**.
        Roles: loyalty_user, loyalty_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/LoyaltyLimitParam"
        - $ref: "#/components/parameters/LoyaltyOffsetParam"
      responses:
        "200":
          description: Paginated programs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LoyaltyProgram"
                  meta:
                    $ref: "#/components/schemas/LoyaltyListMeta"
        "400":
          description: Validation error (limit/offset out of range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []
    post:
      operationId: createLoyaltyProgram
      tags: [Loyalty]
      summary: Create a loyalty program
      description: |
        Creates a program in `draft` status. `earnRatio` is points earned per ₹1
        (per 100 paise) and is stored as a `bigint`; it is echoed back as a
        decimal **string**. Emits `loyalty.program.created` via the
        transactional outbox. Roles: loyalty_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLoyaltyProgramRequest"
      responses:
        "201":
          description: Program created (starts as `draft`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/LoyaltyProgram"
        "400":
          description: |
            Validation error. Either a zod schema failure (missing `name`,
            non-positive `earnRatio`/`expiryDays`) or a domain
            `VALIDATION_ERROR` from the program validator (blank name, name
            longer than 200 characters, non-positive `earnRatio`,
            `expiryDays` below 1).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires loyalty_admin or super_admin
      security:
        - bearerAuth: []

  /v1/loyalty/programs/{id}:
    get:
      operationId: getLoyaltyProgram
      tags: [Loyalty]
      summary: Get a single loyalty program
      description: |
        Returns one program by id, scoped to the caller's tenant.
        Roles: loyalty_user, loyalty_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/LoyaltyProgramIdPath"
      responses:
        "200":
          description: The program
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/LoyaltyProgram"
        "400":
          description: Validation error (id is not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Program not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
    patch:
      operationId: updateLoyaltyProgram
      tags: [Loyalty]
      summary: Update a loyalty program
      description: |
        Partially updates a program. Only `draft` and `active` programs are
        editable — a suspended or archived program is rejected with 422
        `NOT_EDITABLE`. `version` is **required** and guards the write.
        `expiryDays` accepts `null` to clear the expiry policy.
        Roles: loyalty_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/LoyaltyProgramIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLoyaltyProgramRequest"
      responses:
        "200":
          description: Program updated (returns the incremented version)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      updated:
                        type: boolean
                      version:
                        type: integer
        "400":
          description: Validation error (missing `version`, non-positive `earnRatio`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires loyalty_admin or super_admin
        "404":
          description: Program not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            Optimistic-lock failure (`VERSION_CONFLICT`) — the program was
            modified concurrently; re-read and retry with the current version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            `NOT_EDITABLE` — the program is not in `draft` or `active` status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
    delete:
      operationId: archiveLoyaltyProgram
      tags: [Loyalty]
      summary: Archive (soft-delete) a loyalty program
      description: |
        Soft-deletes a program by transitioning it to `archived`. The transition
        must be legal from the program's current status (`archived` is terminal,
        so archiving twice is rejected with 422 `INVALID_TRANSITION`).
        Optimistic-locked on the program's current version.
        Roles: loyalty_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/LoyaltyProgramIdPath"
      responses:
        "200":
          description: Program archived
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [archived]
        "400":
          description: Validation error (id is not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires loyalty_admin or super_admin
        "404":
          description: Program not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Optimistic-lock failure (`VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            `INVALID_TRANSITION` — the program cannot be archived from its
            current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/loyalty/programs/{id}/activate:
    post:
      operationId: transitionLoyaltyProgram
      tags: [Loyalty]
      summary: Transition a program to active, suspended, or archived
      description: |
        Drives the program lifecycle state machine:
        `draft → active | archived`, `active → suspended | archived`,
        `suspended → active | archived`; `archived` is terminal. Despite the
        path name the target state is taken from the request body, so the same
        route also suspends and archives. `version` is required.
        Roles: loyalty_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/LoyaltyProgramIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionLoyaltyProgramRequest"
      responses:
        "200":
          description: Program transitioned (returns the incremented version)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        $ref: "#/components/schemas/LoyaltyProgramStatus"
                      version:
                        type: integer
        "400":
          description: Validation error (missing `status`/`version`, unknown status value)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires loyalty_admin or super_admin
        "404":
          description: Program not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Optimistic-lock failure (`VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            `INVALID_TRANSITION` — the requested transition is not allowed from
            the program's current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Loyalty Service — Points Accrual
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/loyalty/accrue:
    post:
      operationId: accrueLoyaltyPoints
      tags: [Loyalty]
      summary: Accrue points to an enrolment
      description: |
        Credits points to an enrolment and adjusts both `pointsBalance` and
        `lifetimePoints` in the same transaction. The enrolment must be `active`
        (422 `ENROLMENT_NOT_ACTIVE` otherwise). Points are `bigint` minor units
        and are returned as a decimal **string**. Emits
        `loyalty.points.accrued`. This is an internal / service-to-service
        write: roles loyalty_admin, super_admin, service_account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccrueLoyaltyPointsRequest"
      responses:
        "201":
          description: Accrual recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/LoyaltyAccrual"
        "400":
          description: |
            Validation error. Either a zod schema failure (missing
            `enrolmentId`/`source`, non-positive `points`, unknown `txType`) or a
            domain `VALIDATION_ERROR` from the accrual validator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires loyalty_admin, super_admin, or service_account
        "404":
          description: Enrolment not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            `ENROLMENT_NOT_ACTIVE` — points cannot be accrued to a suspended or
            cancelled enrolment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/loyalty/enrolments/{id}/accruals:
    get:
      operationId: listLoyaltyAccruals
      tags: [Loyalty]
      summary: List the accrual history for an enrolment
      description: |
        Returns the paginated points-accrual ledger for one enrolment.
        `points` is a `bigint` serialized as a decimal **string**.
        Roles: loyalty_user, loyalty_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/LoyaltyEnrolmentIdPath"
        - $ref: "#/components/parameters/LoyaltyLimitParam"
        - $ref: "#/components/parameters/LoyaltyOffsetParam"
      responses:
        "200":
          description: Paginated accrual history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LoyaltyAccrual"
                  meta:
                    $ref: "#/components/schemas/LoyaltyListMeta"
        "400":
          description: Validation error (id is not a uuid, limit/offset out of range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Enrolment not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/loyalty/enrolments/{id}/balance:
    get:
      operationId: getLoyaltyBalance
      tags: [Loyalty]
      summary: Get the points balance summary for an enrolment
      description: |
        Returns the spendable balance, lifetime total, and the aggregate
        accrued / still-active point totals for one enrolment. Every figure is a
        `bigint` serialized as a decimal **string**.
        Roles: loyalty_user, loyalty_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/LoyaltyEnrolmentIdPath"
      responses:
        "200":
          description: Balance summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/LoyaltyBalanceSummary"
        "400":
          description: Validation error (id is not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Enrolment not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Loyalty Service — Redemptions
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/loyalty/redeem:
    post:
      operationId: redeemLoyaltyPoints
      tags: [Loyalty]
      summary: Redeem points from an enrolment
      description: |
        Debits points from an enrolment and records a `fulfilled` redemption in
        the same transaction. The enrolment must be `active` and hold at least
        the requested number of points, otherwise the request is rejected with
        422 `REDEMPTION_INVALID`. Points are `bigint` minor units returned as a
        decimal **string**. Emits `loyalty.points.redeemed`.
        Roles: loyalty_user, loyalty_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemLoyaltyPointsRequest"
      responses:
        "201":
          description: Redemption recorded as `fulfilled`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      enrolmentId:
                        type: string
                        format: uuid
                      points:
                        type: string
                        description: Points redeemed (bigint as string)
                        examples: ["250"]
                      rewardType:
                        type: string
                      status:
                        type: string
                        enum: [fulfilled]
        "400":
          description: Validation error (missing `enrolmentId`/`rewardType`, non-positive `points`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Enrolment not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            `REDEMPTION_INVALID` — the enrolment is not active, the requested
            points are not positive, or the balance is insufficient.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/loyalty/redemptions:
    get:
      operationId: listLoyaltyRedemptions
      tags: [Loyalty]
      summary: List redemptions
      description: |
        Returns a paginated list of redemptions for the tenant, optionally
        narrowed to a single enrolment.
        Roles: loyalty_user, loyalty_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/LoyaltyLimitParam"
        - $ref: "#/components/parameters/LoyaltyOffsetParam"
        - name: enrolmentId
          in: query
          required: false
          description: Restrict the result to a single enrolment
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paginated redemptions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LoyaltyRedemption"
                  meta:
                    $ref: "#/components/schemas/LoyaltyListMeta"
        "400":
          description: Validation error (limit/offset out of range, malformed enrolmentId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/loyalty/redemptions/{id}:
    get:
      operationId: getLoyaltyRedemption
      tags: [Loyalty]
      summary: Get a single redemption
      description: |
        Returns one redemption by id, scoped to the caller's tenant.
        Roles: loyalty_user, loyalty_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/LoyaltyRedemptionIdPath"
      responses:
        "200":
          description: The redemption
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/LoyaltyRedemption"
        "400":
          description: Validation error (id is not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Redemption not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/loyalty/redemptions/{id}/void:
    post:
      operationId: voidLoyaltyRedemption
      tags: [Loyalty]
      summary: Void a redemption and return the points
      description: |
        Reverses a redemption and credits the points back to the enrolment's
        spendable balance (lifetime points are unaffected). Only `pending` and
        `fulfilled` redemptions can be voided (422 `VOID_INVALID` otherwise). A
        reason is mandatory and is retained on the row for audit.
        Roles: loyalty_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/LoyaltyRedemptionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidLoyaltyRedemptionRequest"
      responses:
        "200":
          description: Redemption voided (returns the incremented version)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [voided]
                      version:
                        type: integer
        "400":
          description: Validation error (missing `reason` or `version`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires loyalty_admin or super_admin
        "404":
          description: Redemption not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Optimistic-lock failure (`VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            `VOID_INVALID` — only `pending` and `fulfilled` redemptions may be
            voided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Loyalty Service — Tiers
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/loyalty/tiers/{enrolmentId}:
    get:
      operationId: getLoyaltyTier
      tags: [Loyalty]
      summary: Get the current tier for an enrolment
      description: |
        Returns the enrolment's current tier name together with the backing tier
        assignment row. When no assignment has been made yet `assignment` is
        `null` and only the denormalised `tier` name on the enrolment is
        returned. Roles: loyalty_user, loyalty_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/LoyaltyTierEnrolmentIdPath"
      responses:
        "200":
          description: Current tier (assignment may be null)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      enrolmentId:
                        type: string
                        format: uuid
                      tier:
                        type: string
                        description: Current tier name held on the enrolment
                      assignment:
                        oneOf:
                          - $ref: "#/components/schemas/LoyaltyTierAssignment"
                          - type: "null"
        "400":
          description: Validation error (enrolmentId is not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Enrolment not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/loyalty/tiers/{enrolmentId}/history:
    get:
      operationId: listLoyaltyTierHistory
      tags: [Loyalty]
      summary: List the tier assignment history for an enrolment
      description: |
        Returns the paginated append-only history of tier assignments for one
        enrolment. Roles: loyalty_user, loyalty_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/LoyaltyTierEnrolmentIdPath"
        - $ref: "#/components/parameters/LoyaltyLimitParam"
        - $ref: "#/components/parameters/LoyaltyOffsetParam"
      responses:
        "200":
          description: Paginated tier assignment history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LoyaltyTierAssignment"
                  meta:
                    $ref: "#/components/schemas/LoyaltyListMeta"
        "400":
          description: Validation error (enrolmentId is not a uuid, limit/offset out of range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Enrolment not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/loyalty/tiers/evaluate:
    post:
      operationId: evaluateLoyaltyTier
      tags: [Loyalty]
      summary: Re-evaluate the tier for an enrolment
      description: |
        Compares the enrolment's `lifetimePoints` against the program's tier
        definitions and, when the resulting tier differs from the current
        assignment, writes a new assignment, updates the enrolment's `tier`, and
        emits `loyalty.tier.changed`. The call is idempotent when nothing
        changes: `changed` is `false` and no write occurs. Returns 200 in both
        cases. Roles: loyalty_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateLoyaltyTierRequest"
      responses:
        "200":
          description: Evaluation result (whether or not the tier changed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/LoyaltyTierEvaluationResult"
        "400":
          description: Validation error (missing or malformed `enrolmentId`/`programId`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires loyalty_admin or super_admin
        "404":
          description: Enrolment not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            Optimistic-lock failure (`VERSION_CONFLICT`) — raised only when the
            evaluation results in a tier change and the enrolment was modified
            concurrently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Journey Service — Journeys
  #
  # Every journey-service route requires one of: journey_admin, marketing_admin,
  # super_admin. There is no read-only role split in this service.
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/journeys:
    get:
      operationId: listJourneys
      tags: [Journey]
      summary: List journeys
      description: |
        Returns a paginated list of journeys for the current tenant, optionally
        filtered by status.
        Roles: journey_admin, marketing_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/JourneyLimitParam"
        - $ref: "#/components/parameters/JourneyOffsetParam"
        - name: status
          in: query
          required: false
          description: |
            Filter by journey status. Accepted as a free-form string at the route
            boundary — an unknown value simply matches nothing.
          schema:
            type: string
      responses:
        "200":
          description: Paginated journeys
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Journey"
                  meta:
                    $ref: "#/components/schemas/JourneyListMeta"
        "400":
          description: Validation error (limit/offset out of range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []
    post:
      operationId: createJourney
      tags: [Journey]
      summary: Create a journey
      description: |
        Creates a journey in `draft` status. `steps` defaults to an empty array,
        so a journey can be created first and populated later — but a journey
        with no steps cannot be activated. Emits `journey.journey.created` via
        the transactional outbox.
        Roles: journey_admin, marketing_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJourneyRequest"
      responses:
        "201":
          description: Journey created (starts as `draft`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Journey"
        "400":
          description: Validation error (missing `name`, name longer than 200 characters)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/journeys/{id}:
    get:
      operationId: getJourney
      tags: [Journey]
      summary: Get a single journey
      description: |
        Returns one journey by id, scoped to the caller's tenant. Served through
        the read-through Redis cache.
        Roles: journey_admin, marketing_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/JourneyIdPath"
      responses:
        "200":
          description: The journey
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Journey"
        "400":
          description: Validation error (id is not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Journey not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
    patch:
      operationId: updateJourney
      tags: [Journey]
      summary: Update a draft journey
      description: |
        Partially updates a journey. Only `draft` journeys are editable — an
        active, paused, completed, or archived journey is rejected with 422
        `NOT_EDITABLE`. `version` is **required** and guards the write.
        Roles: journey_admin, marketing_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/JourneyIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJourneyRequest"
      responses:
        "200":
          description: Journey updated (returns the incremented version)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      updated:
                        type: boolean
                      version:
                        type: integer
        "400":
          description: Validation error (missing `version`, invalid uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Journey not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            Optimistic-lock failure (`VERSION_CONFLICT`) — the journey was
            modified concurrently; re-read and retry with the current version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`NOT_EDITABLE` — only `draft` journeys may be edited."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
    delete:
      operationId: archiveJourney
      tags: [Journey]
      summary: Archive (soft-delete) a journey
      description: |
        Soft-deletes a journey by transitioning it to `archived`. `archived` is
        terminal, so archiving twice is rejected with 422 `INVALID_TRANSITION`.
        Optimistic-locked on the journey's current version.
        Roles: journey_admin, marketing_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/JourneyIdPath"
      responses:
        "200":
          description: Journey archived
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [archived]
        "400":
          description: Validation error (id is not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Journey not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Optimistic-lock failure (`VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            `INVALID_TRANSITION` — the journey cannot be archived from its
            current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/journeys/{id}/activate:
    post:
      operationId: activateJourney
      tags: [Journey]
      summary: Activate a draft or paused journey
      description: |
        Transitions a journey to `active`. Two checks run before the write: the
        transition must be legal (`draft → active` or `paused → active`,
        otherwise 422 `INVALID_TRANSITION`) and the journey must define at least
        one step (otherwise 422 `ACTIVATION_INVALID`). Emits
        `journey.journey.started`. Takes no request body — the journey's current
        version is used as the optimistic-lock guard.
        Roles: journey_admin, marketing_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/JourneyIdPath"
      responses:
        "200":
          description: Journey activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [active]
        "400":
          description: Validation error (id is not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Journey not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Optimistic-lock failure (`VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            Business rule violation. Possible `code` values:
            - `INVALID_TRANSITION` — the journey cannot move to `active` from its current status.
            - `ACTIVATION_INVALID` — the journey has no steps defined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/journeys/{id}/pause:
    post:
      operationId: pauseJourney
      tags: [Journey]
      summary: Pause an active journey
      description: |
        Transitions an `active` journey to `paused`; any other source status is
        rejected with 422 `INVALID_TRANSITION`. Takes no request body — the
        journey's current version is used as the optimistic-lock guard.
        Roles: journey_admin, marketing_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/JourneyIdPath"
      responses:
        "200":
          description: Journey paused
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [paused]
        "400":
          description: Validation error (id is not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Journey not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Optimistic-lock failure (`VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`INVALID_TRANSITION` — only an `active` journey may be paused."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/journeys/{id}/steps:
    get:
      operationId: listJourneyStepExecutions
      tags: [Journey]
      summary: List step executions for a journey
      description: |
        Returns the paginated step-execution log for one journey. The journey
        must exist (404 otherwise).
        Roles: journey_admin, marketing_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/JourneyIdPath"
        - $ref: "#/components/parameters/JourneyLimitParam"
        - $ref: "#/components/parameters/JourneyOffsetParam"
      responses:
        "200":
          description: Paginated step executions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/JourneyStepExecution"
                  meta:
                    $ref: "#/components/schemas/JourneyListMeta"
        "400":
          description: Validation error (id is not a uuid, limit/offset out of range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Journey not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/journeys/steps/execute:
    post:
      operationId: executeJourneyStep
      tags: [Journey]
      summary: Execute a journey step for a profile
      description: |
        Records a step execution for one profile and emits
        `journey.step.completed`. Both the step type and the step index are
        validated as **400** errors (not 422) because they are treated as
        malformed input rather than business-rule violations:

        - `INVALID_STEP_TYPE` — `stepType` is not one of `send_notification`,
          `wait`, `condition_check`, `api_call`.
        - `INVALID_STEP_INDEX` — `stepIndex` is outside the journey's step array.

        Roles: journey_admin, marketing_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteJourneyStepRequest"
      responses:
        "201":
          description: Step execution recorded (status `executing`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      journeyId:
                        type: string
                        format: uuid
                      profileId:
                        type: string
                        format: uuid
                      stepIndex:
                        type: integer
                      status:
                        type: string
                        enum: [executing]
        "400":
          description: |
            Validation error. Possible `code` values:
            - `VALIDATION_FAILED` — zod schema failure (missing fields, invalid uuid, negative `stepIndex`).
            - `INVALID_STEP_TYPE` — unsupported `stepType`.
            - `INVALID_STEP_INDEX` — `stepIndex` is out of bounds for the journey.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Journey not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Journey Service — Executions (profile enrollments)
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/journeys/executions:
    get:
      operationId: listJourneyExecutions
      tags: [Journey]
      summary: List journey executions
      description: |
        Returns a paginated list of per-profile journey executions, optionally
        filtered by journey, profile, or status.
        Roles: journey_admin, marketing_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/JourneyLimitParam"
        - $ref: "#/components/parameters/JourneyOffsetParam"
        - name: journeyId
          in: query
          required: false
          description: Restrict the result to one journey
          schema:
            type: string
            format: uuid
        - name: profileId
          in: query
          required: false
          description: Restrict the result to one CDP golden profile
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: Filter by execution status (free-form string at the route boundary)
          schema:
            type: string
      responses:
        "200":
          description: Paginated executions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/JourneyExecution"
                  meta:
                    $ref: "#/components/schemas/JourneyListMeta"
        "400":
          description: Validation error (limit/offset out of range, malformed uuid filter)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/journeys/executions/{id}:
    get:
      operationId: getJourneyExecution
      tags: [Journey]
      summary: Get a single journey execution
      description: |
        Returns one execution by id, scoped to the caller's tenant.
        Roles: journey_admin, marketing_admin, super_admin.
      parameters:
        - name: id
          in: path
          required: true
          description: Journey execution id
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The execution
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/JourneyExecution"
        "400":
          description: Validation error (id is not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Execution not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/journeys/executions/enroll:
    post:
      operationId: enrollJourneyProfile
      tags: [Journey]
      summary: Enroll a profile in a journey
      description: |
        Enrolls a CDP golden profile in a journey. The journey must exist and be
        `active` — enrolling into a draft, paused, completed, or archived journey
        is rejected with 422 `ENROLLMENT_INVALID`. New executions start at
        `status: enrolled`, `currentStepIndex: 0`, and emit
        `journey.execution.enrolled`.
        Roles: journey_admin, marketing_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollJourneyProfileRequest"
      responses:
        "201":
          description: Profile enrolled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      journeyId:
                        type: string
                        format: uuid
                      profileId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [enrolled]
                      currentStepIndex:
                        type: integer
                        examples: [0]
        "400":
          description: Validation error (missing or malformed `journeyId`/`profileId`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Journey not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            A partial unique index allows at most one in-flight enrollment
            (`enrolled` or `in_progress`) per profile per journey, so a duplicate
            enrollment attempt surfaces as a conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            `ENROLLMENT_INVALID` — the journey is not `active`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Journey Service — Triggers
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/journeys/triggers:
    get:
      operationId: listJourneyTriggers
      tags: [Journey]
      summary: List journey triggers
      description: |
        Returns a paginated list of triggers for the current tenant, optionally
        narrowed to one journey.
        Roles: journey_admin, marketing_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/JourneyLimitParam"
        - $ref: "#/components/parameters/JourneyOffsetParam"
        - name: journeyId
          in: query
          required: false
          description: Restrict the result to one journey
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paginated triggers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/JourneyTrigger"
                  meta:
                    $ref: "#/components/schemas/JourneyListMeta"
        "400":
          description: Validation error (limit/offset out of range, malformed journeyId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []
    post:
      operationId: createJourneyTrigger
      tags: [Journey]
      summary: Create a journey trigger
      description: |
        Creates an `active` trigger for a journey. The `config` shape is
        validated against `triggerType` and a mismatch is reported as **400**
        `INVALID_CONFIG` (not 422):

        - `event_based` requires `config.eventName` (string)
        - `time_based` requires `config.schedule` (cron expression string)
        - `segment_entry` requires `config.segmentId` (string)

        Emits `journey.trigger.created`.
        Roles: journey_admin, marketing_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJourneyTriggerRequest"
      responses:
        "201":
          description: Trigger created (starts `active`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/JourneyTrigger"
        "400":
          description: |
            Validation error. Possible `code` values:
            - `VALIDATION_FAILED` — zod schema failure (missing `journeyId`, unknown `triggerType`).
            - `INVALID_CONFIG` — `config` does not carry the field required by `triggerType`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/journeys/triggers/{id}:
    get:
      operationId: getJourneyTrigger
      tags: [Journey]
      summary: Get a single journey trigger
      description: |
        Returns one trigger by id, scoped to the caller's tenant.
        Roles: journey_admin, marketing_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/JourneyTriggerIdPath"
      responses:
        "200":
          description: The trigger
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/JourneyTrigger"
        "400":
          description: Validation error (id is not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Trigger not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
    patch:
      operationId: updateJourneyTrigger
      tags: [Journey]
      summary: Update a journey trigger
      description: |
        Partially updates a trigger. The merged (`triggerType`, `config`) pair is
        re-validated, so changing only one of the two can still fail with **400**
        `INVALID_CONFIG`. `version` is **required** and guards the write.
        Roles: journey_admin, marketing_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/JourneyTriggerIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJourneyTriggerRequest"
      responses:
        "200":
          description: Trigger updated (returns the incremented version)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      updated:
                        type: boolean
                      version:
                        type: integer
        "400":
          description: |
            Validation error. Possible `code` values:
            - `VALIDATION_FAILED` — zod schema failure (missing `version`, unknown `triggerType`/`status`).
            - `INVALID_CONFIG` — the merged `triggerType` + `config` pair is inconsistent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Trigger not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Optimistic-lock failure (`VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
    delete:
      operationId: deleteJourneyTrigger
      tags: [Journey]
      summary: Soft-delete a journey trigger
      description: |
        Soft-deletes a trigger by moving its status to `inactive`; the row is
        never hard-deleted. Optimistic-locked on the trigger's current version.
        Roles: journey_admin, marketing_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/JourneyTriggerIdPath"
      responses:
        "200":
          description: Trigger deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [inactive]
        "400":
          description: Validation error (id is not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Trigger not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Optimistic-lock failure (`VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Field Service — Tasks
  #
  # Read roles: field_admin, field_agent, super_admin.
  # Admin-only writes (create / update / assign / cancel / delete):
  # field_admin, super_admin.
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/field/tasks:
    get:
      operationId: listFieldTasks
      tags: [Field]
      summary: List field tasks
      description: |
        Returns a paginated list of tasks for the current tenant, optionally
        filtered by status, assignee, and due-date window.
        Roles: field_admin, field_agent, super_admin.
      parameters:
        - $ref: "#/components/parameters/FieldLimitParam"
        - $ref: "#/components/parameters/FieldOffsetParam"
        - name: status
          in: query
          required: false
          description: Filter by task status (free-form string at the route boundary)
          schema:
            type: string
        - name: assigneeId
          in: query
          required: false
          description: Filter by assigned agent
          schema:
            type: string
            format: uuid
        - name: dueBefore
          in: query
          required: false
          description: Only tasks due on or before this timestamp
          schema:
            type: string
        - name: dueAfter
          in: query
          required: false
          description: Only tasks due on or after this timestamp
          schema:
            type: string
      responses:
        "200":
          description: Paginated tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FieldTask"
                  meta:
                    $ref: "#/components/schemas/FieldListMeta"
        "400":
          description: Validation error (limit/offset out of range, malformed assigneeId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []
    post:
      operationId: createFieldTask
      tags: [Field]
      summary: Create a field task
      description: |
        Creates a task. The initial status is derived from the payload: supplying
        `assigneeId` starts the task as `assigned`, omitting it starts it as
        `unassigned`. `priority` defaults to 3 (1 = highest, 5 = lowest). Emits
        `field.task.created` via the transactional outbox.
        Roles: field_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFieldTaskRequest"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      tenantId:
                        type: string
                        format: uuid
                      status:
                        $ref: "#/components/schemas/FieldTaskStatus"
                      taskType:
                        type: string
                      title:
                        type: string
                      version:
                        type: integer
                        examples: [1]
        "400":
          description: |
            Validation error (missing `taskType`/`title`, `priority` outside 1–5,
            latitude/longitude out of range, `dueDate` not an ISO date-time)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires field_admin or super_admin
      security:
        - bearerAuth: []

  /v1/field/tasks/my:
    get:
      operationId: listMyFieldTasks
      tags: [Field]
      summary: List tasks assigned to the calling agent
      description: |
        Same shape as `GET /v1/field/tasks` but the assignee filter is forced to
        the caller's own actor id, so an agent cannot read another agent's queue
        through this route. Only the `status` filter is honoured here.
        Roles: field_admin, field_agent, super_admin.
      parameters:
        - $ref: "#/components/parameters/FieldLimitParam"
        - $ref: "#/components/parameters/FieldOffsetParam"
        - name: status
          in: query
          required: false
          description: Filter by task status
          schema:
            type: string
      responses:
        "200":
          description: Paginated tasks assigned to the caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FieldTask"
                  meta:
                    $ref: "#/components/schemas/FieldListMeta"
        "400":
          description: Validation error (limit/offset out of range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/field/tasks/{id}:
    get:
      operationId: getFieldTask
      tags: [Field]
      summary: Get a single field task
      description: |
        Returns one task by id, scoped to the caller's tenant. Served through the
        read-through Redis cache.
        Roles: field_admin, field_agent, super_admin.
      parameters:
        - $ref: "#/components/parameters/FieldTaskIdPath"
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/FieldTask"
        "400":
          description: Validation error (id is not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Task not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
    patch:
      operationId: updateFieldTask
      tags: [Field]
      summary: Update field task details
      description: |
        Partially updates the descriptive fields of a task (status is changed
        through the dedicated transition routes, not here). `version` is
        **required** and guards the write.
        Roles: field_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/FieldTaskIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFieldTaskRequest"
      responses:
        "200":
          description: Task updated (returns the incremented version)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      updated:
                        type: boolean
                      version:
                        type: integer
        "400":
          description: |
            Validation error (missing `version`, `priority` outside 1–5,
            latitude/longitude out of range, `dueDate` not an ISO date-time)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires field_admin or super_admin
        "404":
          description: Task not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            Optimistic-lock failure (`VERSION_CONFLICT`) — the task was modified
            concurrently; re-read and retry with the current version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
    delete:
      operationId: deleteFieldTask
      tags: [Field]
      summary: Soft-cancel a field task
      description: |
        Soft-deletes a task by moving it to `cancelled` and stamping
        `cancelledAt` — behaviourally the same as `POST /{id}/cancel`, but the
        task's current version is used as the optimistic-lock guard instead of a
        body-supplied one. Rows are never hard-deleted.
        Roles: field_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/FieldTaskIdPath"
      responses:
        "200":
          description: Task cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [cancelled]
        "400":
          description: Validation error (id is not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires field_admin or super_admin
        "404":
          description: Task not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Optimistic-lock failure (`VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            `TRANSITION_INVALID` — the task is already in a terminal state
            (`completed` or `cancelled`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/field/tasks/{id}/assign:
    post:
      operationId: assignFieldTask
      tags: [Field]
      summary: Assign a task to an agent
      description: |
        Assigns (or re-assigns) a task and moves it to `assigned`. Assignment is
        rejected with 422 `ASSIGNMENT_INVALID` when the task is in a state that
        cannot accept an assignment or the target agent is already the assignee.
        Emits `field.task.created` with `action: assigned`.
        Roles: field_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/FieldTaskIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignFieldTaskRequest"
      responses:
        "200":
          description: Task assigned (returns the incremented version)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      assigneeId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [assigned]
                      version:
                        type: integer
        "400":
          description: Validation error (missing `assigneeId` or `version`, invalid uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires field_admin or super_admin
        "404":
          description: Task not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Optimistic-lock failure (`VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`ASSIGNMENT_INVALID` — the task cannot be assigned to that agent in its current state."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/field/tasks/{id}/start:
    post:
      operationId: startFieldTask
      tags: [Field]
      summary: Start a task
      description: |
        Moves an `assigned` task to `in_progress`. Any other source state is
        rejected with 422 `TRANSITION_INVALID`. `version` is required.
        Roles: field_admin, field_agent, super_admin.
      parameters:
        - $ref: "#/components/parameters/FieldTaskIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldTaskTransitionRequest"
      responses:
        "200":
          description: Task started (returns the incremented version)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [in_progress]
                      version:
                        type: integer
        "400":
          description: Validation error (missing `version`, invalid uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Task not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Optimistic-lock failure (`VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`TRANSITION_INVALID` — the task cannot move to `in_progress` from its current state."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/field/tasks/{id}/complete:
    post:
      operationId: completeFieldTask
      tags: [Field]
      summary: Complete a task
      description: |
        Moves an `in_progress` task to `completed`, stamps `completedAt`, and
        emits `field.task.completed`. Any other source state is rejected with
        422 `TRANSITION_INVALID`. `version` is required.
        Roles: field_admin, field_agent, super_admin.
      parameters:
        - $ref: "#/components/parameters/FieldTaskIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldTaskTransitionRequest"
      responses:
        "200":
          description: Task completed (returns the incremented version)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [completed]
                      version:
                        type: integer
        "400":
          description: Validation error (missing `version`, invalid uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Task not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Optimistic-lock failure (`VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`TRANSITION_INVALID` — only an `in_progress` task may be completed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/field/tasks/{id}/cancel:
    post:
      operationId: cancelFieldTask
      tags: [Field]
      summary: Cancel a task
      description: |
        Moves a task to `cancelled` and stamps `cancelledAt`. A task already in a
        terminal state is rejected with 422 `TRANSITION_INVALID`. `version` is
        required. Roles: field_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/FieldTaskIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldTaskTransitionRequest"
      responses:
        "200":
          description: Task cancelled (returns the incremented version)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [cancelled]
                      version:
                        type: integer
        "400":
          description: Validation error (missing `version`, invalid uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires field_admin or super_admin
        "404":
          description: Task not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Optimistic-lock failure (`VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`TRANSITION_INVALID` — the task is already terminal."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Field Service — Visits (GPS check-in / check-out)
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/field/visits/check-in:
    post:
      operationId: fieldVisitCheckIn
      tags: [Field]
      summary: Check in at a task location
      description: |
        Records a GPS check-in against a task. The agent is taken from the
        bearer token, not the body. Coordinates are validated twice — by zod
        (latitude −90..90, longitude −180..180 → 400) and by the geo-fencing
        domain rule (422 `INVALID_LOCATION`). Emits `field.visit.checked_in`.
        Roles: field_admin, field_agent, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldVisitCheckInRequest"
      responses:
        "201":
          description: Check-in recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      taskId:
                        type: string
                        format: uuid
                      agentId:
                        type: string
                        format: uuid
                        description: Taken from the bearer token
                      checkInAt:
                        type: string
                        format: date-time
        "400":
          description: Validation error (missing `taskId`, coordinates out of range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Task not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`INVALID_LOCATION` — the supplied coordinates failed the geo-fencing check."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/field/visits/{id}/check-out:
    post:
      operationId: fieldVisitCheckOut
      tags: [Field]
      summary: Check out of a visit
      description: |
        Closes a visit: stamps `checkOutAt`, computes `durationMinutes` from the
        check-in timestamp, and classifies the `outcome` from that duration
        (`no_show`, `short_visit`, `completed`, `extended_visit`). Rejected with
        422 `INVALID_CHECKOUT` when the visit has no check-in or the check-out
        would precede it. Optimistic-locked on the visit's current version. Emits
        `field.visit.checked_out`.
        Roles: field_admin, field_agent, super_admin.
      parameters:
        - $ref: "#/components/parameters/FieldVisitIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldVisitCheckOutRequest"
      responses:
        "200":
          description: Check-out recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      checkOutAt:
                        type: string
                        format: date-time
                      durationMinutes:
                        type: integer
                      outcome:
                        $ref: "#/components/schemas/FieldVisitOutcome"
        "400":
          description: Validation error (coordinates out of range, more than 10 photos)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Visit not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Optimistic-lock failure (`VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            `INVALID_CHECKOUT` — the visit has no check-in, or the check-out
            timestamp is not after it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/field/visits/{id}:
    get:
      operationId: getFieldVisit
      tags: [Field]
      summary: Get a single visit
      description: |
        Returns one visit by id, scoped to the caller's tenant.
        Roles: field_admin, field_agent, super_admin.
      parameters:
        - $ref: "#/components/parameters/FieldVisitIdPath"
      responses:
        "200":
          description: The visit
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/FieldVisit"
        "400":
          description: Validation error (id is not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Visit not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/field/visits/by-task/{taskId}:
    get:
      operationId: listFieldVisitsByTask
      tags: [Field]
      summary: List the visit history for a task
      description: |
        Returns the paginated visit history for one task.
        Roles: field_admin, field_agent, super_admin.
      parameters:
        - name: taskId
          in: path
          required: true
          description: Field task id
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/FieldLimitParam"
        - $ref: "#/components/parameters/FieldOffsetParam"
      responses:
        "200":
          description: Paginated visits for the task
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FieldVisit"
                  meta:
                    $ref: "#/components/schemas/FieldListMeta"
        "400":
          description: Validation error (taskId is not a uuid, limit/offset out of range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/field/visits/by-agent/{agentId}:
    get:
      operationId: listFieldVisitsByAgent
      tags: [Field]
      summary: List the visit history for an agent
      description: |
        Returns the paginated visit history for one agent.
        Roles: field_admin, field_agent, super_admin.
      parameters:
        - name: agentId
          in: path
          required: true
          description: Field agent (actor) id
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/FieldLimitParam"
        - $ref: "#/components/parameters/FieldOffsetParam"
      responses:
        "200":
          description: Paginated visits for the agent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FieldVisit"
                  meta:
                    $ref: "#/components/schemas/FieldListMeta"
        "400":
          description: Validation error (agentId is not a uuid, limit/offset out of range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Field Service — Route plans
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/field/routes:
    get:
      operationId: listFieldRoutes
      tags: [Field]
      summary: List route plans
      description: |
        Returns a paginated list of route plans for the current tenant.
        Roles: field_admin, field_agent, super_admin.
      parameters:
        - $ref: "#/components/parameters/FieldLimitParam"
        - $ref: "#/components/parameters/FieldOffsetParam"
      responses:
        "200":
          description: Paginated route plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FieldRoutePlan"
                  meta:
                    $ref: "#/components/schemas/FieldListMeta"
        "400":
          description: Validation error (limit/offset out of range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []
    post:
      operationId: generateFieldRoute
      tags: [Field]
      summary: Generate an optimized route plan
      description: |
        Builds an optimized visit order for an agent on a given date from 2–50
        waypoints, scores the resulting route (total distance and estimated
        duration), and persists it with `status: optimized`. Emits
        `field.route.optimized`.
        Roles: field_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateFieldRouteRequest"
      responses:
        "201":
          description: Route plan generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      assigneeId:
                        type: string
                        format: uuid
                      routeDate:
                        type: string
                        description: Route date (YYYY-MM-DD)
                      status:
                        type: string
                        enum: [optimized]
                      optimizedOrder:
                        type: array
                        description: Waypoint indices in optimized visit order
                        items:
                          type: integer
                      totalDistanceKm:
                        type: number
                        description: |
                          Returned as a JSON number on create; the persisted
                          column is `numeric(8,2)` and later reads surface it as
                          a string.
                      estimatedDurationMinutes:
                        type: integer
                      version:
                        type: integer
                        examples: [1]
        "400":
          description: |
            Validation error (missing `assigneeId`/`date`, fewer than 2 or more
            than 50 waypoints, coordinates out of range, `priority` outside 1–5)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires field_admin or super_admin
      security:
        - bearerAuth: []

  /v1/field/routes/by-agent:
    get:
      operationId: getFieldRouteByAgent
      tags: [Field]
      summary: Get an agent's route plan for a date
      description: |
        Returns the route plan for a specific agent and date.
        Roles: field_admin, field_agent, super_admin.
      parameters:
        - name: assigneeId
          in: query
          required: true
          description: Field agent id
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: true
          description: Route date (YYYY-MM-DD)
          schema:
            type: string
      responses:
        "200":
          description: The route plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/FieldRoutePlan"
        "400":
          description: Validation error (missing `assigneeId`/`date`, malformed uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: "`NOT_FOUND` — no route exists for that agent and date."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/field/routes/today:
    get:
      operationId: getMyFieldRouteToday
      tags: [Field]
      summary: Get today's route plan for the calling agent
      description: |
        Returns today's route plan for the caller (agent id and date are derived
        server-side). When no route exists this route answers **200 with
        `data: null`** rather than 404, so a mobile client can render an empty
        day without treating it as an error.
        Roles: field_admin, field_agent, super_admin.
      responses:
        "200":
          description: |
            Today's route plan, or `data: null` plus the resolved `assigneeId`
            and `date` when none exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/FieldRoutePlan"
                      - type: "null"
                  assigneeId:
                    type: string
                    format: uuid
                    description: Present only in the no-route response
                  date:
                    type: string
                    description: Present only in the no-route response (YYYY-MM-DD)
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/field/routes/{id}:
    get:
      operationId: getFieldRoute
      tags: [Field]
      summary: Get a single route plan
      description: |
        Returns one route plan by id, scoped to the caller's tenant.
        Roles: field_admin, field_agent, super_admin.
      parameters:
        - $ref: "#/components/parameters/FieldRouteIdPath"
      responses:
        "200":
          description: The route plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/FieldRoutePlan"
        "400":
          description: Validation error (id is not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Route not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/field/routes/{id}/reorder:
    patch:
      operationId: reorderFieldRoute
      tags: [Field]
      summary: Manually reorder route waypoints
      description: |
        Replaces the optimized waypoint order with a manual one. The supplied
        order must be a permutation of `0..n-1` for the route's waypoints —
        wrong length, duplicates, or out-of-range indices are rejected with 422
        `INVALID_ORDER`. `version` is required.
        Roles: field_admin, field_agent, super_admin.
      parameters:
        - $ref: "#/components/parameters/FieldRouteIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderFieldRouteRequest"
      responses:
        "200":
          description: Waypoints reordered (returns the incremented version)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      optimizedOrder:
                        type: array
                        items:
                          type: integer
                      version:
                        type: integer
        "400":
          description: Validation error (missing `version`, negative index, invalid uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Route not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Optimistic-lock failure (`VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            `INVALID_ORDER` — the order is not a permutation of `0..n-1` for this
            route's waypoints.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Field Service — Offline sync
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/field/sync/push:
    post:
      operationId: fieldSyncPush
      tags: [Field]
      summary: Push a batch of offline operations
      description: |
        Uploads 1–500 operations captured while the device was offline. The
        batch is persisted to the sync queue with `status: pending` and drained
        asynchronously, so this returns **202 Accepted** — the response reports
        how many operations were queued, not how many were applied. Conflict
        resolution happens during the drain by comparing `clientVersion` against
        the server row's version (create → client wins, delete → server wins,
        update → field-level merge). Emits `field.sync.completed`.
        Roles: field_admin, field_agent, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldSyncPushRequest"
      responses:
        "202":
          description: Batch accepted for asynchronous processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      processed:
                        type: integer
                        description: Number of operations queued
                      syncedAt:
                        type: string
                        format: date-time
        "400":
          description: |
            Validation error (empty batch, more than 500 operations, unknown
            `operation`, `clientTimestamp` not an ISO date-time, invalid uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "422":
          description: |
            `INVALID_BATCH` — the batch failed the domain-level check (for
            example an entity type outside the syncable allow-list of
            task / visit / route).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/field/sync/pull:
    get:
      operationId: fieldSyncPull
      tags: [Field]
      summary: Pull server-side changes since a watermark
      description: |
        Returns the caller's sync-queue rows processed since the `since`
        watermark. Note the response `meta` is **not** the standard
        page/pageSize/total envelope — it echoes the watermark and limit
        instead, because the client drives paging by advancing `since`.
        Roles: field_admin, field_agent, super_admin.
      parameters:
        - name: since
          in: query
          required: true
          description: Watermark timestamp; only changes after this point are returned
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of changes to return
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Changes since the watermark
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FieldSyncOperation"
                  meta:
                    type: object
                    description: Watermark echo — not the standard pagination envelope
                    properties:
                      total:
                        type: integer
                      since:
                        type: string
                      limit:
                        type: integer
        "400":
          description: Validation error (missing `since`, limit out of range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Recommendation Service — Next Best Action
  #
  # Read roles: recommendation_admin, crm_user, sales_user, super_admin.
  # Admin-only writes: recommendation_admin, super_admin.
  #
  # Route ordering note: the NBA list route is `/v1/recommendations/{profileId}`,
  # so the single-recommendation read is namespaced under
  # `/v1/recommendations/detail/{id}` to avoid colliding with it.
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/recommendations:
    post:
      operationId: createRecommendation
      tags: [Recommendation]
      summary: Record a recommendation as served
      description: |
        Records a recommendation with `status: served`. The relevance score is
        either supplied explicitly (`score`, 0–1) or computed from the `signals`
        block (matrix priority 50%, account health 20%, product affinity 30%) and
        rounded to 4 decimal places to match the `numeric(5,4)` column. Emits
        `recommendation.nba.served`.
        Roles: recommendation_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecommendationRequest"
      responses:
        "201":
          description: Recommendation recorded as served
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Recommendation"
        "400":
          description: |
            Validation error (missing `profileId`/`recommendationType`, `score`
            outside 0–1, signals out of range, invalid uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires recommendation_admin or super_admin
      security:
        - bearerAuth: []

  /v1/recommendations/{profileId}:
    get:
      operationId: listRecommendationsForProfile
      tags: [Recommendation]
      summary: Get the top-N actionable recommendations for a profile
      description: |
        Returns the ranked, still-actionable recommendations for one CDP golden
        profile. Terminal rows (`accepted`, `rejected`, `expired`) and rows older
        than the 72-hour TTL are excluded, then the remainder is ranked and
        truncated to `limit`. Note the tighter paging bounds on this route:
        `limit` defaults to **5** and is capped at **50**.
        Roles: recommendation_admin, crm_user, sales_user, super_admin.
      parameters:
        - name: profileId
          in: path
          required: true
          description: CDP golden profile id
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Number of recommendations to return (top-N)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: channel
          in: query
          required: false
          description: Restrict to one delivery channel (web, mobile, call-centre, …)
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: Ranked recommendations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Recommendation"
                  meta:
                    $ref: "#/components/schemas/RecommendationListMeta"
        "400":
          description: Validation error (profileId is not a uuid, limit above 50)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/recommendations/detail/{id}:
    get:
      operationId: getRecommendation
      tags: [Recommendation]
      summary: Get a single recommendation
      description: |
        Returns one recommendation by id, scoped to the caller's tenant. Served
        through the read-through Redis cache.
        Roles: recommendation_admin, crm_user, sales_user, super_admin.
      parameters:
        - $ref: "#/components/parameters/RecommendationIdPath"
      responses:
        "200":
          description: The recommendation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Recommendation"
        "400":
          description: Validation error (id is not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Recommendation not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/recommendations/{id}/accept:
    post:
      operationId: acceptRecommendation
      tags: [Recommendation]
      summary: Accept a recommendation
      description: |
        Moves a `served` recommendation to `accepted` and emits
        `recommendation.nba.accepted`. Two business rules apply: the transition
        must be legal (422 `INVALID_TRANSITION` — terminal states cannot be
        re-decided) and the recommendation must be inside its 72-hour TTL (422
        `RECOMMENDATION_EXPIRED`). The body is optional; supply `version` for a
        read-modify-write guard, otherwise the row's current version is used.
        Roles: recommendation_admin, crm_user, sales_user, super_admin.
      parameters:
        - $ref: "#/components/parameters/RecommendationIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationDecisionRequest"
      responses:
        "200":
          description: Recommendation accepted (returns the incremented version)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [accepted]
                      version:
                        type: integer
        "400":
          description: Validation error (id is not a uuid, non-positive `version`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Recommendation not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Optimistic-lock failure (`VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            Business rule violation. Possible `code` values:
            - `INVALID_TRANSITION` — the recommendation is already in a terminal state.
            - `RECOMMENDATION_EXPIRED` — the 72-hour actionable window has closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/recommendations/{id}/reject:
    post:
      operationId: rejectRecommendation
      tags: [Recommendation]
      summary: Reject a recommendation
      description: |
        Moves a `served` recommendation to `rejected` and emits
        `recommendation.nba.rejected`. A `reason` is **mandatory** — rejection
        reasons are the only negative training signal available to the model.
        Unlike accept, there is no TTL check here: an expired recommendation may
        still be rejected. Supply `version` for a read-modify-write guard,
        otherwise the row's current version is used.
        Roles: recommendation_admin, crm_user, sales_user, super_admin.
      parameters:
        - $ref: "#/components/parameters/RecommendationIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRecommendationRequest"
      responses:
        "200":
          description: Recommendation rejected (returns the incremented version)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [rejected]
                      version:
                        type: integer
        "400":
          description: Validation error (missing `reason`, reason longer than 500 characters)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Recommendation not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Optimistic-lock failure (`VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`INVALID_TRANSITION` — the recommendation is already in a terminal state."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Recommendation Service — Feedback
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/recommendations/feedback:
    get:
      operationId: listRecommendationFeedback
      tags: [Recommendation]
      summary: List the feedback history for a recommendation
      description: |
        Returns the paginated feedback history for one recommendation.
        `recommendationId` is a **required** query parameter.
        Roles: recommendation_admin, crm_user, sales_user, super_admin.
      parameters:
        - name: recommendationId
          in: query
          required: true
          description: The recommendation to list feedback for
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/RecommendationLimitParam"
        - $ref: "#/components/parameters/RecommendationOffsetParam"
      responses:
        "200":
          description: Paginated feedback history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecommendationFeedback"
                  meta:
                    $ref: "#/components/schemas/RecommendationListMeta"
        "400":
          description: Validation error (missing or malformed `recommendationId`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []
    post:
      operationId: recordRecommendationFeedback
      tags: [Recommendation]
      summary: Record acceptance or rejection feedback
      description: |
        Records a feedback row and moves the underlying recommendation to the
        matching terminal status in the same transaction. A `rejected` action
        **must** carry a reason: the rule is enforced in the domain layer so the
        caller gets 422 `FEEDBACK_INVALID` (a business-rule error) rather than a
        schema error. Emits `recommendation.feedback.recorded`.
        Roles: recommendation_admin, crm_user, sales_user, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordRecommendationFeedbackRequest"
      responses:
        "201":
          description: Feedback recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/RecommendationFeedback"
        "400":
          description: |
            Validation error (missing `recommendationId`, unknown `action`,
            reason longer than 500 characters)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Recommendation not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            Optimistic-lock failure (`VERSION_CONFLICT`) — the recommendation was
            decided concurrently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            Business rule violation. Possible `code` values:
            - `FEEDBACK_INVALID` — a `rejected` action was submitted without a reason.
            - `INVALID_TRANSITION` — the recommendation is already in a terminal state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Recommendation Service — Cross-sell matrix
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/recommendations/matrix:
    get:
      operationId: listRecommendationMatrix
      tags: [Recommendation]
      summary: List cross-sell matrix rules
      description: |
        Returns a paginated list of product-to-product recommendation rules,
        optionally narrowed by trigger product, segment, or channel.
        Roles: recommendation_admin, crm_user, sales_user, super_admin.
      parameters:
        - $ref: "#/components/parameters/RecommendationLimitParam"
        - $ref: "#/components/parameters/RecommendationOffsetParam"
        - name: triggerProductId
          in: query
          required: false
          description: Restrict to rules triggered by this product
          schema:
            type: string
            format: uuid
        - name: segment
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: channel
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: Paginated matrix rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CrossSellMatrixEntry"
                  meta:
                    $ref: "#/components/schemas/RecommendationListMeta"
        "400":
          description: Validation error (limit/offset out of range, malformed uuid filter)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []
    post:
      operationId: createRecommendationMatrixEntry
      tags: [Recommendation]
      summary: Create a cross-sell matrix rule
      description: |
        Creates a rule mapping a trigger product to a recommended product,
        optionally scoped to a segment and/or channel. Scope uniqueness is
        enforced: a rule with the same (trigger, recommended, segment, channel)
        scope is rejected with **409** `MATRIX_DUPLICATE`. Emits
        `recommendation.matrix.created`.
        Roles: recommendation_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCrossSellMatrixEntryRequest"
      responses:
        "201":
          description: Matrix rule created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CrossSellMatrixEntry"
        "400":
          description: |
            Validation error (missing `triggerProductId`/`recommendedProductId`,
            negative `priority`, invalid uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires recommendation_admin or super_admin
        "409":
          description: |
            `MATRIX_DUPLICATE` — a rule with the same scope already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            `MATRIX_INVALID` — the rule failed domain validation (for example the
            trigger and recommended product are the same).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/recommendations/matrix/{id}:
    get:
      operationId: getRecommendationMatrixEntry
      tags: [Recommendation]
      summary: Get a single cross-sell matrix rule
      description: |
        Returns one matrix rule by id, scoped to the caller's tenant. Served
        through the read-through Redis cache.
        Roles: recommendation_admin, crm_user, sales_user, super_admin.
      parameters:
        - $ref: "#/components/parameters/RecommendationMatrixIdPath"
      responses:
        "200":
          description: The matrix rule
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CrossSellMatrixEntry"
        "400":
          description: Validation error (id is not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Matrix entry not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
    patch:
      operationId: updateRecommendationMatrixEntry
      tags: [Recommendation]
      summary: Update a matrix rule's scope or priority
      description: |
        Partially updates the segment, channel, or priority of a rule. The merged
        rule is re-validated (422 `MATRIX_INVALID`). `version` is **required** and
        guards the write. Emits `recommendation.matrix.updated`.
        Roles: recommendation_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/RecommendationMatrixIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCrossSellMatrixEntryRequest"
      responses:
        "200":
          description: Matrix rule updated (returns the incremented version)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      updated:
                        type: boolean
                      version:
                        type: integer
        "400":
          description: Validation error (missing `version`, negative `priority`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires recommendation_admin or super_admin
        "404":
          description: Matrix entry not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Optimistic-lock failure (`VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`MATRIX_INVALID` — the merged rule failed domain validation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
    delete:
      operationId: deleteRecommendationMatrixEntry
      tags: [Recommendation]
      summary: Delete a cross-sell matrix rule
      description: |
        Removes a matrix rule. Unlike most delete routes in the suite this is a
        **hard delete** — the cross-sell matrix is configuration, not user data,
        so no `deleted_at` tombstone is kept. Emits
        `recommendation.matrix.deleted`.
        Roles: recommendation_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/RecommendationMatrixIdPath"
      responses:
        "200":
          description: Matrix rule deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      deleted:
                        type: boolean
                        examples: [true]
        "400":
          description: Validation error (id is not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires recommendation_admin or super_admin
        "404":
          description: |
            Matrix entry not found (`NOT_FOUND`) — also returned when a
            concurrent delete removed the row first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Recommendation Service — Account health
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/recommendations/health/{accountId}:
    get:
      operationId: getAccountHealthScore
      tags: [Recommendation]
      summary: Get the latest account health score
      description: |
        Returns the most recently computed health score for an account, enriched
        with its band (`critical` < 40 ≤ `at_risk` < 60 ≤ `healthy` < 80 ≤
        `excellent`). Served through the read-through Redis cache.
        Roles: recommendation_admin, crm_user, sales_user, super_admin.
      parameters:
        - $ref: "#/components/parameters/RecommendationAccountIdPath"
      responses:
        "200":
          description: The latest health score
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AccountHealthScore"
        "400":
          description: Validation error (accountId is not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: "`NOT_FOUND` — no health score has been computed for this account."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/recommendations/health/{accountId}/history:
    get:
      operationId: listAccountHealthHistory
      tags: [Recommendation]
      summary: List the health score history for an account
      description: |
        Returns the paginated, append-only history of computed health scores for
        one account, newest first, each with its band.
        Roles: recommendation_admin, crm_user, sales_user, super_admin.
      parameters:
        - $ref: "#/components/parameters/RecommendationAccountIdPath"
        - $ref: "#/components/parameters/RecommendationLimitParam"
        - $ref: "#/components/parameters/RecommendationOffsetParam"
      responses:
        "200":
          description: Paginated health score history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccountHealthScore"
                  meta:
                    $ref: "#/components/schemas/RecommendationListMeta"
        "400":
          description: Validation error (accountId is not a uuid, limit/offset out of range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/recommendations/health/{accountId}/recompute:
    post:
      operationId: recomputeAccountHealthScore
      tags: [Recommendation]
      summary: Recompute and persist an account health score
      description: |
        Computes a fresh composite health score from caller-supplied factors
        (each already normalised to 0–100) and appends it to the account's
        history. Weights: recency 25%, frequency 20%, monetary 25%, support load
        15%, engagement 15%. The `factors` object is `strict` — an unknown key is
        a 400, while a semantically invalid factor set is 422 `FACTORS_INVALID`.
        Emits `recommendation.health.updated`.
        Roles: recommendation_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/RecommendationAccountIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecomputeAccountHealthRequest"
      responses:
        "201":
          description: Health score computed and persisted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AccountHealthScore"
        "400":
          description: |
            Validation error (missing `factors`, unknown factor key, factor
            outside 0–100, accountId not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires recommendation_admin or super_admin
        "422":
          description: "`FACTORS_INVALID` — the factor set failed domain validation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # AI Agent Service — Agent definitions
  #
  # Read roles: ai_user, ai_admin, super_admin.
  # Admin-only writes: ai_admin, super_admin.
  # Governance reads additionally allow audit_officer.
  #
  # Every write is recorded in the AI audit log. Free text is stored **redacted**
  # (guardrail-sanitised) to satisfy the DPDP Act 2023.
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/ai/agents:
    get:
      operationId: listAiAgents
      tags: [AI Agent]
      summary: List agent definitions
      description: |
        Returns a paginated list of agent definitions for the current tenant,
        optionally filtered by status or a name search.
        Roles: ai_user, ai_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/AiLimitParam"
        - $ref: "#/components/parameters/AiOffsetParam"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AiAgentStatus"
        - name: search
          in: query
          required: false
          description: Free-text match on the agent name
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Paginated agent definitions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AiAgent"
                  meta:
                    $ref: "#/components/schemas/AiListMeta"
        "400":
          description: Validation error (limit/offset out of range, unknown status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []
    post:
      operationId: createAiAgent
      tags: [AI Agent]
      summary: Create an agent definition
      description: |
        Creates an `active` agent definition. `skills` and `tools` are free-form
        JSON object arrays and default to empty. The definition is validated in
        the domain layer, so a structurally legal but semantically invalid
        definition returns 422 `AGENT_DEFINITION_INVALID`.
        Roles: ai_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAiAgentRequest"
      responses:
        "201":
          description: Agent created (starts `active`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AiAgent"
        "400":
          description: Validation error (missing `name`, name longer than 200 characters)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires ai_admin or super_admin
        "422":
          description: "`AGENT_DEFINITION_INVALID` — the skills/tools definition failed domain validation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/ai/agents/{id}:
    get:
      operationId: getAiAgent
      tags: [AI Agent]
      summary: Get a single agent definition
      description: |
        Returns one agent by id, scoped to the caller's tenant.
        Roles: ai_user, ai_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/AiAgentIdPath"
      responses:
        "200":
          description: The agent definition
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AiAgent"
        "400":
          description: Validation error (id is not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Agent not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
    patch:
      operationId: updateAiAgent
      tags: [AI Agent]
      summary: Update an agent definition or status
      description: |
        Partially updates an agent. When any of `name`/`skills`/`tools` changes
        the merged definition is re-validated (422
        `AGENT_DEFINITION_INVALID`); when `status` changes the transition is
        validated (422 `INVALID_TRANSITION`). `version` is **required** and
        guards the write.
        Roles: ai_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/AiAgentIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAiAgentRequest"
      responses:
        "200":
          description: Agent updated (returns the incremented version)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      updated:
                        type: boolean
                      version:
                        type: integer
        "400":
          description: Validation error (missing `version`, unknown `status`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires ai_admin or super_admin
        "404":
          description: Agent not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Optimistic-lock failure (`VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            Business rule violation. Possible `code` values:
            - `AGENT_DEFINITION_INVALID` — the merged definition failed validation.
            - `INVALID_TRANSITION` — the requested status change is not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
    delete:
      operationId: archiveAiAgent
      tags: [AI Agent]
      summary: Archive (soft-delete) an agent definition
      description: |
        Soft-deletes an agent by moving it to `archived`. `archived` is terminal,
        so archiving twice is rejected with 422 `INVALID_TRANSITION`.
        Optimistic-locked on the agent's current version. Returns **204 No
        Content** on success.
        Roles: ai_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/AiAgentIdPath"
      responses:
        "204":
          description: Agent archived (no response body)
        "400":
          description: Validation error (id is not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires ai_admin or super_admin
        "404":
          description: Agent not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Optimistic-lock failure (`VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`INVALID_TRANSITION` — the agent is already archived."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/ai/agents/{id}/pause:
    post:
      operationId: pauseAiAgent
      tags: [AI Agent]
      summary: Pause an active agent
      description: |
        Transitions an `active` agent to `paused` and emits
        `ai.agent.paused`. The body is optional; supply `version` for a
        read-modify-write guard, otherwise the agent's current version is used.
        Roles: ai_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/AiAgentIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiVersionGuardRequest"
      responses:
        "200":
          description: Agent paused (returns the incremented version)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      agentId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [paused]
                      version:
                        type: integer
        "400":
          description: Validation error (id is not a uuid, non-positive `version`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires ai_admin or super_admin
        "404":
          description: Agent not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Optimistic-lock failure (`VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`INVALID_TRANSITION` — only an `active` agent may be paused."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/ai/agents/{id}/resume:
    post:
      operationId: resumeAiAgent
      tags: [AI Agent]
      summary: Resume a paused agent
      description: |
        Transitions a `paused` agent back to `active`. The body is optional;
        supply `version` for a read-modify-write guard, otherwise the agent's
        current version is used.
        Roles: ai_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/AiAgentIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiVersionGuardRequest"
      responses:
        "200":
          description: Agent resumed (returns the incremented version)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      agentId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [active]
                      version:
                        type: integer
        "400":
          description: Validation error (id is not a uuid, non-positive `version`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires ai_admin or super_admin
        "404":
          description: Agent not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Optimistic-lock failure (`VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`INVALID_TRANSITION` — only a `paused` agent may be resumed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/ai/agents/{id}/invoke:
    post:
      operationId: invokeAiAgent
      tags: [AI Agent]
      summary: Dispatch work to an agent
      description: |
        Queues an invocation for an `active` agent and returns **202 Accepted**
        with an `invocationId` — the work itself is processed asynchronously.
        The body is optional. When `input` is supplied it is evaluated against
        the tenant's active guardrail rules **before** anything is queued; a
        block returns 422 with a `GUARDRAIL_BLOCKED` envelope carrying the
        matched violations, and only the redacted text is written to the audit
        log. A non-active agent is rejected with 422 `AGENT_NOT_INVOCABLE`.
        Roles: ai_user, ai_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/AiAgentIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvokeAiAgentRequest"
      responses:
        "202":
          description: Invocation queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      agentId:
                        type: string
                        format: uuid
                      invocationId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [invoked]
        "400":
          description: Validation error (id is not a uuid, `input` longer than 16000 characters)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Agent not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            Business rule violation. Possible `code` values:
            - `AGENT_NOT_INVOCABLE` — the agent is paused or archived.
            - `GUARDRAIL_BLOCKED` — the input violated a guardrail rule; the
              response carries `details.violations`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/GuardrailBlockedError"
      security:
        - bearerAuth: []

  /v1/ai/agents/handoff:
    post:
      operationId: handoffAiAgent
      tags: [AI Agent]
      summary: Hand work off to the best-matching agent
      description: |
        Selects the active agent that best matches a required skill (excluding the
        source agent) and queues the handoff, returning **202 Accepted** with the
        chosen target. When no active agent carries the skill the request is
        rejected with 422 `NO_HANDOFF_TARGET`. Emits `ai.handoff.triggered`.
        Roles: ai_user, ai_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAgentHandoffRequest"
      responses:
        "202":
          description: Handoff queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      fromAgentId:
                        type: string
                        format: uuid
                      toAgentId:
                        type: string
                        format: uuid
                      toAgentName:
                        type: string
                      status:
                        type: string
                        enum: [handed_off]
        "400":
          description: Validation error (missing `fromAgentId`/`requiredSkill`, invalid uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Source agent not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`NO_HANDOFF_TARGET` — no other active agent carries the required skill."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # AI Agent Service — Chat
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/ai/chat:
    get:
      operationId: listAiConversations
      tags: [AI Agent]
      summary: List chat conversations
      description: |
        Returns a paginated list of conversations for the current tenant,
        optionally filtered by status, profile, or channel.
        Roles: ai_user, ai_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/AiLimitParam"
        - $ref: "#/components/parameters/AiOffsetParam"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AiConversationStatus"
        - name: profileId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: channelId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paginated conversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AiConversation"
                  meta:
                    $ref: "#/components/schemas/AiListMeta"
        "400":
          description: Validation error (limit/offset out of range, unknown status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []
    post:
      operationId: sendAiChatMessage
      tags: [AI Agent]
      summary: Send a chat message (creates the conversation on the first turn)
      description: |
        Appends a user message to a conversation, creating the conversation when
        `conversationId` is omitted. The status code distinguishes the two cases:
        **201** when a new conversation was started, **202** when the message was
        accepted into an existing one.

        Guardrails run **before** anything is persisted. A block returns 422 with
        a `GUARDRAIL_BLOCKED` envelope and only the redacted text reaches the
        audit log (DPDP Act 2023). Messages are stored sanitised, not raw.
        Roles: ai_user, ai_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendAiChatMessageRequest"
      responses:
        "201":
          description: New conversation started and first message recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatMessageResponse"
        "202":
          description: Message accepted into an existing conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatMessageResponse"
        "400":
          description: |
            Validation error (missing `channelId`/`message`, message longer than
            4000 characters, invalid uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: |
            Conversation not found (`NOT_FOUND`) — only when `conversationId` was
            supplied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            Business rule violation. Possible `code` values:
            - `CONVERSATION_ENDED` — the conversation is no longer active.
            - `GUARDRAIL_BLOCKED` — the message violated a guardrail rule; the
              response carries `details.violations`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/GuardrailBlockedError"
      security:
        - bearerAuth: []

  /v1/ai/chat/{conversationId}/history:
    get:
      operationId: getAiChatHistory
      tags: [AI Agent]
      summary: Get a conversation transcript
      description: |
        Returns the paginated message transcript for a conversation. In addition
        to the standard `data` / `meta` envelope the response carries a
        `summary` block with per-turn statistics for the returned page.
        Roles: ai_user, ai_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/AiConversationIdPath"
        - $ref: "#/components/parameters/AiLimitParam"
        - $ref: "#/components/parameters/AiOffsetParam"
      responses:
        "200":
          description: Paginated transcript with a turn summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AiChatMessage"
                  meta:
                    $ref: "#/components/schemas/AiListMeta"
                  summary:
                    type: object
                    description: |
                      Turn statistics for the returned page (message counts by
                      role and aggregate token usage).
                    additionalProperties: true
        "400":
          description: Validation error (conversationId is not a uuid, limit/offset out of range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Conversation not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/ai/chat/{conversationId}/end:
    post:
      operationId: endAiConversation
      tags: [AI Agent]
      summary: End a conversation
      description: |
        Closes an `active` conversation and stamps `endedAt`. Ending an already
        ended conversation is rejected with 422 `INVALID_TRANSITION`. The body is
        optional; `version` acts as an optimistic-lock guard and `reason` is
        retained on the audit entry.
        Roles: ai_user, ai_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/AiConversationIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndAiConversationRequest"
      responses:
        "200":
          description: Conversation ended (returns the incremented version)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      conversationId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [ended]
                      version:
                        type: integer
        "400":
          description: Validation error (conversationId is not a uuid, non-positive `version`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Conversation not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Optimistic-lock failure (`VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`INVALID_TRANSITION` — the conversation is already ended."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # AI Agent Service — Copilot
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/ai/copilot/ask:
    post:
      operationId: askAiCopilot
      tags: [AI Agent]
      summary: Ask the copilot a question
      description: |
        Records a copilot turn with the caller's prompt and its resolved source
        citations, and returns **201** with the turn id. The model response is
        produced asynchronously, so `response` is null on the persisted turn at
        this point.

        The zod upper bound on `prompt` (32000) is deliberately looser than the
        domain limit, so an over-long prompt surfaces as 422 `PROMPT_INVALID`
        rather than a schema error. Guardrails run before persistence; a block
        returns 422 `GUARDRAIL_BLOCKED` and only the redacted prompt is audited.
        Roles: ai_user, ai_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskAiCopilotRequest"
      responses:
        "201":
          description: Copilot turn recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [accepted]
                      citations:
                        type: array
                        items:
                          $ref: "#/components/schemas/AiCopilotCitation"
                      latencyMs:
                        type: integer
                      latencyBucket:
                        type: string
                        description: Coarse latency band derived from `latencyMs`
                      sanitizedInput:
                        type: string
                        description: Guardrail-redacted prompt (never the raw text)
                      guardrail:
                        $ref: "#/components/schemas/AiGuardrailOutcome"
        "400":
          description: |
            Validation error (missing `prompt`, prompt longer than 32000
            characters, more than 100 sources)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "422":
          description: |
            Business rule violation. Possible `code` values:
            - `PROMPT_INVALID` — the prompt exceeded the domain length limit or was otherwise unusable.
            - `GUARDRAIL_BLOCKED` — the prompt violated a guardrail rule; the
              response carries `details.violations`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/GuardrailBlockedError"
      security:
        - bearerAuth: []

  /v1/ai/copilot/summarize:
    post:
      operationId: summarizeAiCopilot
      tags: [AI Agent]
      summary: Request a summarisation
      description: |
        Records a summarisation turn for the supplied content and returns
        **201**. Guardrails run before persistence; a block returns 422
        `GUARDRAIL_BLOCKED` and only the redacted content is audited.
        Roles: ai_user, ai_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SummarizeAiCopilotRequest"
      responses:
        "201":
          description: Summarisation turn recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [accepted]
                      maxLength:
                        oneOf:
                          - type: integer
                          - type: "null"
                        description: Echo of the requested summary length cap
                      latencyBucket:
                        type: string
        "400":
          description: |
            Validation error (missing `content`, content longer than 32000
            characters, `maxLength` outside 50–2000)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "422":
          description: |
            `GUARDRAIL_BLOCKED` — the content violated a guardrail rule; the
            response carries `details.violations`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardrailBlockedError"
      security:
        - bearerAuth: []

  /v1/ai/copilot/turns:
