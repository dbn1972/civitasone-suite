          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires workflow_user, workflow_admin, super_admin, or tenant_admin
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Workflow Service — Messages & Signals
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/workflow/messages/deliver:
    post:
      operationId: deliverWorkflowMessage
      tags: [Workflow]
      summary: Deliver a correlated message to a waiting instance
      description: |
        Delivers a named message to a workflow instance that holds an active
        message subscription matching the (messageName, correlationKey) pair.
        The matched subscription's waiting task is auto-completed and the
        instance advances along the message catch node's outgoing edge.

        Returns 404 if no active subscription matches (the instance hasn't
        reached the message catch event yet, or it was already delivered).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageName, correlationKey]
              properties:
                messageName:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: "^[a-zA-Z][a-zA-Z0-9._-]*$"
                  description: The message name the subscription is waiting for
                  examples: ["payment.confirmed", "vendor.approved"]
                correlationKey:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: Correlation key to match the specific subscription
                  examples: ["PO-2026-001", "INV-42"]
                payload:
                  type: object
                  additionalProperties: true
                  description: Optional data payload delivered to the instance context
                  default: {}
      responses:
        "202":
          description: Message delivery accepted for async processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error (invalid messageName pattern, missing fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires workflow_user, workflow_admin, super_admin, estab_officer, or estab_admin
        "404":
          description: No active subscription matches the provided message name and correlation key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/workflow/signals/broadcast:
    post:
      operationId: broadcastWorkflowSignal
      tags: [Workflow]
      summary: Broadcast a signal to all active signal subscribers
      description: |
        Broadcasts a named signal to all workflow instances in the tenant that
        hold an active signal subscription for the given signal name. Unlike
        messages (1:1), signals fan out to every matching listener.

        Returns the count of matched subscriptions. A count of 0 is valid
        (no instance is currently waiting for this signal).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signalName]
              properties:
                signalName:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: "^[a-zA-Z][a-zA-Z0-9._-]*$"
                  description: The signal name to broadcast
                  examples: ["fiscal_year.closed", "budget.released"]
                payload:
                  type: object
                  additionalProperties: true
                  description: Optional data payload delivered to each matched instance
                  default: {}
      responses:
        "202":
          description: Signal broadcast accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  matched:
                    type: integer
                    description: Number of subscriptions that matched
                    examples: [3]
                  status:
                    type: string
                    examples: ["accepted"]
                  correlationId:
                    type: string
                    format: uuid
        "400":
          description: Validation error (invalid signalName pattern, missing fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires workflow_admin or super_admin
      security:
        - bearerAuth: []

  /v1/workflow/instances/{instanceId}/subscriptions:
    get:
      operationId: listInstanceSubscriptions
      tags: [Workflow]
      summary: List message and signal subscriptions for an instance
      description: |
        Returns all message and signal subscriptions (both active and matched)
        for a given workflow instance. Used by the UI to show what an instance
        is currently waiting for.
      parameters:
        - name: instanceId
          in: path
          required: true
          description: Workflow instance UUID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Subscriptions for the instance
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      messages:
                        type: array
                        items:
                          $ref: "#/components/schemas/MessageSubscription"
                      signals:
                        type: array
                        items:
                          $ref: "#/components/schemas/SignalSubscription"
        "400":
          description: Invalid instanceId (not a UUID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires workflow_user, workflow_admin, super_admin, estab_officer, or estab_admin
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Payroll Service — F&F (Full & Final Settlement)
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/payroll/fnf/compute:
    post:
      operationId: computeFnfSettlement
      tags: [Payroll]
      summary: Compute F&F settlement
      description: |
        Publishes a Full & Final settlement computation command for async processing.
        Computes gratuity, leave encashment, retrenchment/VRS compensation exemptions
        per Income Tax Act sections 10(10), 10(10AA), 10(10B), 10(10C), and calculates
        TDS on the separation package using old/new regime slab rates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComputeFnfRequest"
      responses:
        "202":
          description: F&F computation queued for async processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: fnf compute queued
                      employeeId:
                        type: string
                        format: uuid
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires payroll_admin, hr_admin, super_admin, or finance_officer
      security:
        - bearerAuth: []

  /v1/payroll/fnf/settlements/{id}:
    get:
      operationId: getFnfSettlement
      tags: [Payroll]
      summary: Get a single F&F settlement
      description: |
        Returns the full computation result for a specific F&F settlement,
        including all exemption breakdowns and TDS computation detail.
        Tenant-scoped — only returns settlements belonging to the caller's tenant.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Settlement detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/FnfSettlement"
        "400":
          description: Invalid UUID parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires payroll_admin, hr_admin, super_admin, or finance_officer
        "404":
          description: Settlement not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/payroll/fnf/settlements:
    get:
      operationId: listFnfSettlements
      tags: [Payroll]
      summary: List F&F settlements
      description: |
        Returns a paginated list of F&F settlements for the current tenant.
        Supports filtering by employeeId.
      parameters:
        - name: employeeId
          in: query
          description: Filter by employee UUID
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Maximum number of items to return (default 50, max 200)
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          description: Number of items to skip for pagination
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated list of settlements
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FnfSettlement"
                  meta:
                    type: object
                    properties:
                      limit:
                        type: integer
                      offset:
                        type: integer
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires payroll_admin, hr_admin, super_admin, or finance_officer
      security:
        - bearerAuth: []

  /v1/payroll/internal/fnf-tax-breakdown:
    get:
      operationId: getFnfTaxBreakdown
      tags: [Payroll]
      summary: Internal — compute F&F tax breakdown on-the-fly
      description: |
        Internal endpoint used by hrms-service to compute a full F&F tax breakdown
        without persisting. Loads exemption ceilings from DB for the given FY and
        returns the complete tax computation result. Not intended for end-user UI.
      parameters:
        - name: employeeId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: separationDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: separationType
          in: query
          required: true
          schema:
            type: string
            enum: [retirement, superannuation, resignation, retrenchment, vrs, death]
        - name: employeeCategory
          in: query
          required: true
          schema:
            type: string
            enum: [govt, non_govt_covered, non_govt_uncovered]
        - name: taxRegime
          in: query
          required: true
          schema:
            type: string
            enum: [old, new]
        - name: lastDrawnWagesMinor
          in: query
          required: true
          schema:
            type: string
            description: Bigint as string (paise)
        - name: completedYears
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
        - name: avgSalaryLast10MonthsMinor
          in: query
          required: true
          schema:
            type: string
            description: Bigint as string (paise)
        - name: leaveBalanceDays
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
        - name: salaryYtdMinor
          in: query
          required: true
          schema:
            type: string
            description: Bigint as string (paise)
        - name: tdsYtdMinor
          in: query
          required: true
          schema:
            type: string
            description: Bigint as string (paise)
        - name: fyStartYear
          in: query
          required: true
          schema:
            type: integer
        - name: noticeBuyoutMinor
          in: query
          schema:
            type: string
            default: "0"
        - name: leaveEncashmentGrossMinor
          in: query
          schema:
            type: string
            default: "0"
        - name: gratuityGrossMinor
          in: query
          schema:
            type: string
            default: "0"
        - name: retrenchmentCompMinor
          in: query
          schema:
            type: string
            default: "0"
        - name: vrsCompMinor
          in: query
          schema:
            type: string
            default: "0"
        - name: arrearsMinor
          in: query
          schema:
            type: string
            default: "0"
        - name: priorLeaveEncashExemptionMinor
          in: query
          schema:
            type: string
            default: "0"
        - name: remainingMonthsToRetirement
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: deductions80cMinor
          in: query
          schema:
            type: string
            default: "0"
        - name: deductions80dMinor
          in: query
          schema:
            type: string
            default: "0"
        - name: otherDeductionsMinor
          in: query
          schema:
            type: string
            default: "0"
      responses:
        "200":
          description: F&F tax breakdown computed on-the-fly
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/FnfTaxBreakdown"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires payroll_admin, hr_admin, super_admin, or finance_officer
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Analytics Service — Query Engine
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/analytics/query:
    post:
      operationId: runAnalyticsQuery
      tags: [Analytics]
      summary: Run an analytics query with joins and calculated fields
      description: |
        Executes an analytics query against whitelisted metrics and dimensions.
        Supports cross-table joins (max 3), calculated fields via a structured
        expression language (max 10 per query), and filter conditions on
        whitelisted fields. All queries are tenant-scoped. No raw SQL is accepted.
        Join queries are capped at 1000 rows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsQueryRequest"
      responses:
        "200":
          description: Query result with aggregated rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsQueryResult"
        "400":
          description: Validation error (unknown metric/dimension, expression too deep, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires analytics_viewer or analytics_admin
      security:
        - bearerAuth: []

  /v1/analytics/drill-through/{reportId}/{cellId}:
    get:
      operationId: drillThroughAnalytics
      tags: [Analytics]
      summary: Drill through an aggregated cell to detail rows
      description: |
        Given a report ID and cell ID from a previously executed analytics query,
        returns the underlying detail rows that compose the aggregated value.
        Capped at 200 rows per request. Tenant-scoped.
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the stored analytics report/query run
        - name: cellId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
          description: Identifier of the aggregated cell to drill into
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
          description: Maximum rows to return (capped at 200)
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Offset for pagination
      responses:
        "200":
          description: Detail rows for the specified cell
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrillThroughResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires analytics_viewer or analytics_admin
        "404":
          description: Report or cell not found
      security:
        - bearerAuth: []

# ═══════════════════════════════════════════════════════════════════════════════
# Components
# ═══════════════════════════════════════════════════════════════════════════════

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Keycloak OIDC access token (RS256). Obtain via
        POST /realms/civitasone/protocol/openid-connect/token
        with client_credentials or authorization_code grant.
    scimBearerToken:
      type: http
      scheme: bearer
      description: |
        Static bearer token for SCIM 2.0 provisioning endpoints.
        Set via SCIM_BEARER_TOKEN environment variable on the identity-service.
        Separate from Keycloak user JWTs — used only by external IdPs
        (Azure AD, Okta, Google Workspace, MeriPehchaan).

  parameters:
    LimitParam:
      name: limit
      in: query
      description: Maximum number of items to return (default 20, max 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    OffsetParam:
      name: offset
      in: query
      description: Number of items to skip for pagination
      schema:
        type: integer
        minimum: 0
        default: 0

  schemas:
    # ─── Common ────────────────────────────────────────────────────────────────

    AcceptedResponse:
      type: object
      required: [id, status, correlationId]
      properties:
        id:
          type: string
          format: uuid
          description: ID of the created/queued resource
        status:
          type: string
          enum: [accepted, queued]
        correlationId:
          type: string
          description: Request correlation ID for tracing

    Pagination:
      type: object
      properties:
        hasMore:
          type: boolean
        pageSize:
          type: integer
        total:
          type: integer

    ValidationError:
      type: object
      required: [code, message, correlationId, retryable]
      properties:
        code:
          type: string
          examples: ["VALIDATION_FAILED"]
        message:
          type: string
        correlationId:
          type: string
        retryable:
          type: boolean
          const: false
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    ErrorResponse:
      type: object
      required: [code, message, correlationId, retryable]
      properties:
        code:
          type: string
        message:
          type: string
        correlationId:
          type: string
        retryable:
          type: boolean

    # ─── Finance ───────────────────────────────────────────────────────────────

    Bill:
      type: object
      required: [id, tenantId, vendorId, amountPaise, currency, status]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        billNumber:
          type: string
          description: Human-readable bill reference number
        vendorId:
          type: string
          format: uuid
        vendorName:
          type: string
        sanctionId:
          type: string
          format: uuid
        amountPaise:
          type: integer
          format: int64
          description: Bill amount in paise (minor units)
        currency:
          type: string
          default: INR
          description: ISO 4217 currency code
        status:
          type: string
          enum: [draft, pending, sanctioned, paid, cancelled]
        description:
          type: string
        budgetHeadId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        version:
          type: integer

    CreateBillRequest:
      type: object
      required: [vendorId, amountPaise, budgetHeadId, description]
      properties:
        vendorId:
          type: string
          format: uuid
        sanctionId:
          type: string
          format: uuid
        amountPaise:
          type: integer
          format: int64
          minimum: 1
          description: Amount in paise
        currency:
          type: string
          default: INR
        budgetHeadId:
          type: string
          format: uuid
        description:
          type: string
          maxLength: 500
        attachments:
          type: array
          items:
            type: string
            format: uri

    Sanction:
      type: object
      required: [id, tenantId, budgetHeadId, amountPaise, status]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        sanctionNumber:
          type: string
        budgetHeadId:
          type: string
          format: uuid
        amountPaise:
          type: integer
          format: int64
          description: Sanctioned amount in paise
        availablePaise:
          type: integer
          format: int64
          description: Remaining available balance in paise
        currency:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, exhausted, cancelled]
        purpose:
          type: string
        financialYear:
          type: string
          examples: ["2025-26"]
        createdAt:
          type: string
          format: date-time
        approvedBy:
          type: string
          format: uuid
        version:
          type: integer

    CreateSanctionRequest:
      type: object
      required: [budgetHeadId, amountPaise, purpose, financialYear]
      properties:
        budgetHeadId:
          type: string
          format: uuid
        amountPaise:
          type: integer
          format: int64
          minimum: 1
        purpose:
          type: string
          maxLength: 1000
        financialYear:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
          examples: ["2025-26"]

    Payment:
      type: object
      required: [id, tenantId, billId, amountPaise, status, mode]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        billId:
          type: string
          format: uuid
        amountPaise:
          type: integer
          format: int64
        currency:
          type: string
        status:
          type: string
          enum: [initiated, processing, completed, failed, reversed]
        mode:
          type: string
          enum: [pfms, neft, rtgs, cheque, cash]
        utrNumber:
          type: string
          description: Unique Transaction Reference (bank reference)
        paidAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    CreatePaymentRequest:
      type: object
      required: [billId, amountMinor, mode, ddoCode]
      properties:
        billId:
          type: string
          format: uuid
        ddoCode:
          type: string
          pattern: '^[A-Za-z0-9]{6,12}$'
          description: DDO code in PFMS format (6–12 alphanumeric characters)
        mode:
          type: string
          enum: [NEFT, RTGS, IMPS, DBT, PFMS, cheque]
        amountMinor:
          oneOf:
            - type: integer
              format: int64
              minimum: 1
            - type: string
              pattern: '^\d+$'
          description: |
            Payment amount in paise (minor units). Accepts either an integer or a
            string-encoded integer for bigint safety (avoids 2^53 precision loss).
            Must equal the bill's netMinor (conservation invariant).
        currency:
          type: string
          minLength: 3
          maxLength: 3
          default: INR
          description: ISO 4217 currency code
        eftRef:
          type: string
          description: External EFT reference (optional tracking ID)
        bankAccountId:
          type: string
          format: uuid
          description: Target bank account for the payment (optional)

    GlEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        accountName:
          type: string
        debitPaise:
          type: integer
          format: int64
        creditPaise:
          type: integer
          format: int64
        voucherRef:
          type: string
        narration:
          type: string
        postingDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time

    CreateBudgetRequest:
      type: object
      required: [headId, financialYear, allocationPaise]
      properties:
        headId:
          type: string
          format: uuid
          description: Budget Head / Head of Account ID
        financialYear:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
          examples: ["2025-26"]
        allocationPaise:
          type: integer
          format: int64
          minimum: 0
          description: Budget allocation in paise
        description:
          type: string

    # ─── HRMS ──────────────────────────────────────────────────────────────────

    Employee:
      type: object
      required: [id, tenantId, name, employeeCode, status]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        employeeCode:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        designation:
          type: string
        departmentId:
          type: string
          format: uuid
        departmentName:
          type: string
        employeeType:
          type: string
          enum: [permanent, temporary, contract, deputation]
        status:
          type: string
          enum: [active, probation, suspended, retired, terminated]
        dateOfJoining:
          type: string
          format: date
        photoUrl:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
        version:
          type: integer

    LeaveRequest:
      type: object
      required: [id, employeeId, leaveTypeId, fromDate, toDate, daysApplied, status]
      properties:
        id:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        leaveTypeId:
          type: string
          format: uuid
        leaveTypeName:
          type: string
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        daysApplied:
          type: number
        reason:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, cancelled]
        appliedAt:
          type: string
          format: date-time
        approvedBy:
          type: string
          format: uuid

    ApplyLeaveRequest:
      type: object
      required: [leaveTypeId, employeeId, allocId, fromDate, toDate, daysApplied]
      properties:
        leaveTypeId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        allocId:
          type: string
          format: uuid
          description: Leave allocation ID to debit from
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        daysApplied:
          type: number
          minimum: 0.5
          description: Supports half-day (0.5) leave
        reason:
          type: string
          maxLength: 500

    CheckInRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        accuracy:
          type: number
          description: GPS accuracy in meters
        withinGeofence:
          type: boolean
        deviceFingerprint:
          type: string
        timestamp:
          type: string
          format: date-time

    GeoCheckInRequest:
      type: object
      required: [latitude, longitude, accuracy, deviceFingerprint]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        accuracy:
          type: number
          description: GPS accuracy in meters
        deviceFingerprint:
          type: string
        photoUrl:
          type: string
          format: uri
          description: Optional selfie for verification

    IdCard:
      type: object
      properties:
        employeeId:
          type: string
          format: uuid
        employeeCode:
          type: string
        name:
          type: string
        designation:
          type: string
        department:
          type: string
        office:
          type: string
        photoUrl:
          type: string
          format: uri
        qrData:
          type: string
          description: QR code payload for verification
        validUntil:
          type: string
          format: date
        bloodGroup:
          type: string

    # ─── Procurement ───────────────────────────────────────────────────────────

    PurchaseOrder:
      type: object
      required: [id, tenantId, vendorId, status, totalPaise]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        poNumber:
          type: string
        vendorId:
          type: string
          format: uuid
        vendorName:
          type: string
        indentId:
          type: string
          format: uuid
        sanctionId:
          type: string
          format: uuid
        totalPaise:
          type: integer
          format: int64
        currency:
          type: string
        status:
          type: string
          enum: [draft, approved, issued, partially_received, completed, cancelled]
        lineItems:
          type: array
          items:
            type: object
            properties:
              itemId:
                type: string
                format: uuid
              description:
                type: string
              quantity:
                type: integer
              unitPricePaise:
                type: integer
                format: int64
              receivedQty:
                type: integer
        deliveryDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        version:
          type: integer

    CreatePurchaseOrderRequest:
      type: object
      required: [vendorId, indentId, lineItems]
      properties:
        vendorId:
          type: string
          format: uuid
        indentId:
          type: string
          format: uuid
        sanctionId:
          type: string
          format: uuid
        deliveryDate:
          type: string
          format: date
        lineItems:
          type: array
          minItems: 1
          items:
            type: object
            required: [itemId, quantity, unitPricePaise]
            properties:
              itemId:
                type: string
                format: uuid
              description:
                type: string
              quantity:
                type: integer
                minimum: 1
              unitPricePaise:
                type: integer
                format: int64
                minimum: 1

    Vendor:
      type: object
      required: [id, tenantId, name, gstin]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        gstin:
          type: string
          pattern: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}$"
        pan:
          type: string
        category:
          type: string
        rating:
          type: number
          minimum: 0
          maximum: 5
        address:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        bankAccount:
          type: object
          properties:
            accountNumber:
              type: string
            ifsc:
              type: string
            bankName:
              type: string
        status:
          type: string
          enum: [active, blacklisted, suspended]
        createdAt:
          type: string
          format: date-time

    GRN:
      type: object
      required: [id, purchaseOrderId, items]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        purchaseOrderId:
          type: string
          format: uuid
        grnNumber:
          type: string
        receivedDate:
          type: string
          format: date
        items:
          type: array
          items:
            type: object
            properties:
              itemId:
                type: string
                format: uuid
              orderedQty:
                type: integer
              receivedQty:
                type: integer
              acceptedQty:
                type: integer
              rejectedQty:
                type: integer
              rejectionReason:
                type: string
        status:
          type: string
          enum: [pending_inspection, accepted, partially_accepted, rejected]
        inspectedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    CreateGrnRequest:
      type: object
      required: [purchaseOrderId, items]
      properties:
        purchaseOrderId:
          type: string
          format: uuid
        challanNumber:
          type: string
        receivedDate:
          type: string
          format: date
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [itemId, receivedQty]
            properties:
              itemId:
                type: string
                format: uuid
              receivedQty:
                type: integer
                minimum: 1
              acceptedQty:
                type: integer
              rejectedQty:
                type: integer
              rejectionReason:
                type: string

    CreateIndentRequest:
      type: object
      required: [departmentId, items, purpose]
      properties:
        departmentId:
          type: string
          format: uuid
        budgetHeadId:
          type: string
          format: uuid
        purpose:
          type: string
          maxLength: 1000
        priority:
          type: string
          enum: [normal, urgent]
          default: normal
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [description, quantity, unit]
            properties:
              description:
                type: string
              quantity:
                type: integer
                minimum: 1
              unit:
                type: string
                examples: ["nos", "kg", "litre", "metre", "ream"]
              estimatedUnitPricePaise:
                type: integer
                format: int64

    # ─── Admin ─────────────────────────────────────────────────────────────────

    FeatureFlag:
      type: object
      required: [id, key, enabled]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: Unique flag key (dot-notation)
          examples: ["finance.gst_auto_calc", "hrms.geo_checkin"]
        enabled:
          type: boolean
        rolloutPercentage:
          type: integer
          minimum: 0
          maximum: 100
        targetRoles:
          type: array
          items:
            type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateFeatureFlagRequest:
      type: object
      required: [key, description]
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9_.]+$"
        description:
          type: string
          maxLength: 500
        enabled:
          type: boolean
          default: false
        rolloutPercentage:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
        targetRoles:
          type: array
          items:
            type: string

    Webhook:
      type: object
      required: [id, url, events, active]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
          description: Event types to deliver
          examples: [["bill.created", "payment.completed", "leave.approved"]]
        active:
          type: boolean
        secret:
          type: string
          description: HMAC secret (write-only, masked on read)
        lastDeliveredAt:
          type: string
          format: date-time
        failureCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    CreateWebhookRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          minItems: 1
          items:
            type: string
        secret:
          type: string
          description: HMAC signing secret for payload verification

    ScheduledJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        cronExpression:
          type: string
          examples: ["0 2 * * *"]
        enabled:
          type: boolean
        lastRunAt:
          type: string
          format: date-time
        nextRunAt:
          type: string
          format: date-time
        lastStatus:
          type: string
          enum: [success, failed, running, skipped]
        lastDurationMs:
          type: integer

    # ─── Citizen ───────────────────────────────────────────────────────────────

    CitizenRequest:
      type: object
      required: [id, type, subject, status]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        type:
          type: string
          enum: [grievance, rti, general, suggestion]
        subject:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [pending, in_progress, resolved, rejected, escalated]
        departmentId:
          type: string
          format: uuid
        assignedTo:
          type: string
          format: uuid
        acknowledgementNumber:
          type: string
          description: Public tracking number given to citizen
        filedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
        slaDeadline:
          type: string
          format: date-time

    CreateCitizenRequestBody:
      type: object
      required: [type, subject, description, departmentId]
      properties:
        type:
          type: string
          enum: [grievance, rti, general, suggestion]
        subject:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        departmentId:
          type: string
          format: uuid
        attachments:
          type: array
          items:
            type: string
            format: uri
          maxItems: 10

    # ─── Stock ─────────────────────────────────────────────────────────────────

    StockItem:
      type: object
      required: [id, name, barcode]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        barcode:
          type: string
        sku:
          type: string
        category:
          type: string
        unit:
          type: string
          examples: ["nos", "kg", "litre"]
        currentStock:
          type: integer
        reorderLevel:
          type: integer
        warehouseId:
          type: string
          format: uuid
        warehouseName:
          type: string
        valuationPaise:
          type: integer
          format: int64
          description: Current stock valuation in paise
        lastReceivedAt:
          type: string
          format: date-time

    # ─── Identity / SCIM 2.0 ──────────────────────────────────────────────────

    ScimServiceProviderConfig:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
          examples: [["urn:ietf:params:scim:schemas:core:2.0:ServiceProviderConfig"]]
        patch:
          type: object
          properties:
            supported:
              type: boolean
        bulk:
          type: object
          properties:
            supported:
              type: boolean
            maxOperations:
              type: integer
            maxPayloadSize:
              type: integer
        filter:
          type: object
          properties:
            supported:
              type: boolean
            maxResults:
              type: integer
        changePassword:
          type: object
          properties:
            supported:
              type: boolean
        sort:
          type: object
          properties:
            supported:
              type: boolean
        etag:
          type: object
          properties:
            supported:
              type: boolean
        authenticationSchemes:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              name:
                type: string
              description:
                type: string

    ScimUser:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
          examples: [["urn:ietf:params:scim:schemas:core:2.0:User"]]
        id:
          type: string
          format: uuid
        userName:
          type: string
          description: Email address (primary identifier)
        name:
          type: object
          properties:
            formatted:
              type: string
            givenName:
              type: string
            familyName:
              type: string
        emails:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
                format: email
              type:
                type: string
                examples: ["work"]
              primary:
                type: boolean
        active:
          type: boolean
          description: Whether the user can authenticate
        meta:
          type: object
          properties:
            resourceType:
              type: string
              examples: ["User"]
            created:
              type: string
              format: date-time
            lastModified:
              type: string
              format: date-time
            location:
              type: string
              description: Canonical URI of the resource

    ScimListResponse:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
          examples: [["urn:ietf:params:scim:api:messages:2.0:ListResponse"]]
        totalResults:
          type: integer
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
        Resources:
          type: array
          items:
            $ref: "#/components/schemas/ScimUser"

    ScimCreateUserRequest:
      type: object
      required: [userName]
      properties:
        schemas:
          type: array
          items:
            type: string
        userName:
          type: string
          description: Email address — primary login identifier
        name:
          type: object
          properties:
            formatted:
              type: string
            givenName:
              type: string
            familyName:
              type: string
        emails:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
                format: email
              type:
                type: string
              primary:
                type: boolean

    ScimReplaceUserRequest:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
        userName:
          type: string
          description: Email address
        name:
          type: object
          properties:
            formatted:
              type: string
            givenName:
              type: string
            familyName:
              type: string
        emails:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
                format: email
              type:
                type: string
              primary:
                type: boolean
        active:
          type: boolean
          description: Set false to disable/deprovision the user

    ScimPatchRequest:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
          examples: [["urn:ietf:params:scim:api:messages:2.0:PatchOp"]]
        Operations:
          type: array
          items:
            type: object
            required: [op]
            properties:
              op:
                type: string
                enum: [add, remove, replace]
              path:
                type: string
                description: "Target attribute (e.g. `active`, `userName`, `name.formatted`)"
              value:
                description: New value for the attribute

    # ─── Workflow — Decision Tables ─────────────────────────────────────────────

    DecisionTableInput:
      type: object
      required: [key, label, type]
      properties:
        key:
          type: string
          description: Unique key for the input (used in rule conditions)
          maxLength: 64
        label:
          type: string
          description: Human-readable label
          maxLength: 200
        type:
          type: string
          enum: [string, number, boolean]

    DecisionTableOutput:
      type: object
      required: [key, label, type]
      properties:
        key:
          type: string
          description: Unique key for the output
          maxLength: 64
        label:
          type: string
          description: Human-readable label
          maxLength: 200
        type:
          type: string
          enum: [string, number, boolean]
        defaultValue:
          description: Default value when no rule matches

    DecisionTableRule:
      type: object
      required: [inputs, outputs]
      properties:
        inputs:
          type: object
          additionalProperties:
            type: string
          description: Input conditions as key → expression string
        outputs:
          type: object
          additionalProperties: true
          description: Output values when this rule matches
        priority:
          type: integer
          description: Rule priority (lower = evaluated first within hit policy)

    DecisionTable:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        code:
          type: string
          description: Unique code within the tenant
          maxLength: 64
        name:
          type: string
          maxLength: 200
        hitPolicy:
          type: string
          enum: [first, collect, unique]
          description: |
            first — return the first matching rule's output.
            collect — return outputs from all matching rules.
            unique — exactly one rule must match (error if 0 or >1).
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/DecisionTableInput"
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/DecisionTableOutput"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/DecisionTableRule"
        status:
          type: string
          enum: [draft, active]
        version:
          type: integer
        createdBy:
          type: string
          format: uuid
        updatedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateDecisionTableRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          description: Unique code within the tenant
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 200
        hitPolicy:
          type: string
          enum: [first, collect, unique]
          default: first
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/DecisionTableInput"
          default: []
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/DecisionTableOutput"
          default: []
        rules:
          type: array
          items:
            $ref: "#/components/schemas/DecisionTableRule"
          default: []

    UpdateDecisionTableRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        hitPolicy:
          type: string
          enum: [first, collect, unique]
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/DecisionTableInput"
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/DecisionTableOutput"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/DecisionTableRule"

    ScimError:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
          examples: [["urn:ietf:params:scim:api:messages:2.0:Error"]]
        detail:
          type: string
          description: Human-readable error description
        status:
          type: string
          description: HTTP status code as string

    # ─── Workflow Analytics ─────────────────────────────────────────────────────

    WorkflowAnalyticsSummary:
      type: object
      properties:
        instancesByStatus:
          type: object
          additionalProperties:
            type: integer
          description: Count of instances grouped by status (active, completed, cancelled)
        totalInstances:
          type: integer
          description: Total workflow instances for the tenant
        avgCycleTimeSeconds:
          type: number
          nullable: true
          description: Average time (seconds) from instance creation to completion
        completedCount:
          type: integer
          description: Number of completed instances
        slaBreachRate:
          type: number
          description: Fraction of SLA-tracked tasks that breached (0.0 to 1.0)
        slaBreachedTasks:
          type: integer
          description: Number of tasks completed after their SLA due date
        slaTrackedTasks:
          type: integer
          description: Number of completed tasks that had an SLA due date
        escalations:
          type: integer
          description: Total escalation events across all tasks

    WorkflowBottlenecksReport:
      type: object
      properties:
        nodes:
          type: array
          items:
            type: object
            properties:
              nodeKey:
                type: string
                nullable: true
              avgDwellSeconds:
                type: number
                nullable: true
                description: Average time a task spent at this node before completion
              completedTasks:
                type: integer
              pendingTasks:
                type: integer
        pendingByRole:
          type: array
          items:
            type: object
            properties:
              roleRef:
                type: string
                nullable: true
              pendingTasks:
                type: integer

    WorkflowCycleTimeMetric:
      type: object
      properties:
        definitionCode:
          type: string
          nullable: true
          description: Workflow definition code
        definitionName:
          type: string
          nullable: true
          description: Workflow definition display name
        avgCycleTimeSeconds:
          type: number
          nullable: true
          description: Average cycle time in seconds
        minCycleTimeSeconds:
          type: number
          nullable: true
          description: Minimum cycle time in seconds
        maxCycleTimeSeconds:
          type: number
          nullable: true
          description: Maximum cycle time in seconds
        completedCount:
          type: integer
          description: Number of completed instances for this definition

    WorkflowAutomationRate:
      type: object
      properties:
        totalCompleted:
          type: integer
          description: Total completed tasks
        humanCompleted:
          type: integer
          description: Tasks completed by human actors
        autoCompleted:
          type: integer
          description: Tasks completed automatically (timers, call activities, SoD overrides)
        automationRatePct:
          type: number
          description: Percentage of tasks completed automatically (0.00 to 100.00)

    WorkflowSlaComplianceMetric:
      type: object
      properties:
        nodeKey:
          type: string
          nullable: true
          description: Workflow node key
        roleName:
          type: string
          nullable: true
          description: Role reference assigned to the tasks
        totalTracked:
          type: integer
          description: Number of completed tasks with an SLA due date
        withinSla:
          type: integer
          description: Tasks completed within SLA
        breached:
          type: integer
          description: Tasks completed after SLA
        compliancePct:
          type: number
          description: Percentage of tasks within SLA (0.00 to 100.00)

    WorkflowVersionComparison:
      type: object
      properties:
        version:
          type: integer
          description: Definition version number
        definitionId:
          type: string
          format: uuid
          description: Definition ID for this version
        avgCycleTimeSeconds:
          type: number
          nullable: true
          description: Average cycle time in seconds for this version
        completedCount:
          type: integer
          description: Number of completed instances for this version
        rejectionRate:
          type: number
          description: Percentage of instances that were cancelled/rejected (0.00 to 100.00)
        avgTasksPerInstance:
          type: number
          nullable: true
          description: Average number of tasks spawned per instance

    MessageSubscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        instanceId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        messageName:
          type: string
          description: The message name this subscription is waiting for
        correlationKey:
          type: string
          description: Correlation key used to match incoming messages
        nodeKey:
          type: string
          description: Workflow node that created this subscription
        status:
          type: string
          enum: [active, matched, timeout]
          description: Current subscription status
        timeoutAt:
          type: string
          format: date-time
          nullable: true
          description: When this subscription will expire if not matched
        matchedAt:
          type: string
          format: date-time
          nullable: true
          description: When the message was delivered (null if still waiting)
        createdAt:
          type: string
          format: date-time

    SignalSubscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        instanceId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        signalName:
          type: string
          description: The signal name this subscription is listening for
        nodeKey:
          type: string
          description: Workflow node that created this subscription
        status:
          type: string
          enum: [active, matched]
          description: Current subscription status
        matchedAt:
          type: string
          format: date-time
          nullable: true
          description: When the signal was received (null if still waiting)
        createdAt:
          type: string
          format: date-time

    # ─── Payroll F&F ───────────────────────────────────────────────────────────

    ComputeFnfRequest:
      type: object
      required:
        - employeeId
        - separationDate
        - separationType
        - employeeCategory
        - lastDrawnWagesMinor
        - completedYears
        - avgSalaryLast10MonthsMinor
        - leaveBalanceDays
        - taxRegime
        - salaryYtdMinor
        - tdsYtdMinor
        - fyStartYear
      properties:
        employeeId:
          type: string
          format: uuid
        separationDate:
          type: string
          format: date
          description: "YYYY-MM-DD"
        separationType:
          type: string
          enum: [retirement, superannuation, resignation, retrenchment, vrs, death]
        employeeCategory:
          type: string
          enum: [govt, non_govt_covered, non_govt_uncovered]
          description: |
            govt = Central/State government employee (gratuity fully exempt).
            non_govt_covered = Private sector covered by Payment of Gratuity Act.
            non_govt_uncovered = Private sector not covered by Gratuity Act.
        noticeBuyoutMinor:
          type: string
          default: "0"
          description: Notice period buyout amount in paise (fully taxable)
        leaveEncashmentGrossMinor:
          type: string
          default: "0"
          description: Leave encashment gross amount in paise (exempt under s.10(10AA))
        gratuityGrossMinor:
          type: string
          default: "0"
          description: Gratuity gross amount in paise (exempt under s.10(10))
        retrenchmentCompMinor:
          type: string
          default: "0"
          description: Retrenchment compensation in paise (exempt under s.10(10B))
        vrsCompMinor:
          type: string
          default: "0"
          description: VRS compensation in paise (exempt under s.10(10C))
        arrearsMinor:
          type: string
          default: "0"
          description: Salary arrears in paise (fully taxable)
        lastDrawnWagesMinor:
          type: string
          description: Last drawn monthly wages (basic + DA) in paise
        completedYears:
          type: integer
          minimum: 0
          description: Completed years of service
        avgSalaryLast10MonthsMinor:
          type: string
          description: Average monthly salary for last 10 months in paise
        leaveBalanceDays:
          type: integer
          minimum: 0
          description: Unused leave balance in days
        priorLeaveEncashExemptionMinor:
          type: string
          default: "0"
          description: Prior leave encashment exemption already claimed (in paise)
        remainingMonthsToRetirement:
          type: integer
          minimum: 0
          default: 0
          description: Months remaining until superannuation (for leave encashment ceiling)
        taxRegime:
          type: string
          enum: [old, new]
          description: Income tax regime (old regime with deductions or new simplified regime)
        salaryYtdMinor:
          type: string
          description: Year-to-date salary income in paise (for total income computation)
        tdsYtdMinor:
          type: string
          description: TDS already deducted year-to-date in paise
        deductions80cMinor:
          type: string
          default: "0"
          description: Section 80C deductions in paise (old regime only)
        deductions80dMinor:
          type: string
          default: "0"
          description: Section 80D deductions in paise (old regime only)
        otherDeductionsMinor:
          type: string
          default: "0"
          description: Other Chapter VI-A deductions in paise (old regime only)
        fyStartYear:
          type: integer
          description: Financial year start year (e.g. 2024 for FY 2024-25)

    FnfSettlement:
      type: object
      description: Persisted F&F settlement computation result
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
          nullable: true
        separationType:
          type: string
          enum: [retirement, superannuation, resignation, retrenchment, vrs, death]
        separationDate:
          type: string
          format: date
        employeeCategory:
          type: string
          enum: [govt, non_govt_covered, non_govt_uncovered]
        noticeBuyoutMinor:
          type: string
          description: Paise
        leaveEncashmentGrossMinor:
          type: string
        gratuityGrossMinor:
          type: string
        retrenchmentCompMinor:
          type: string
        vrsCompMinor:
          type: string
        arrearsMinor:
          type: string
        gratuityExemptMinor:
          type: string
          description: Exempt portion of gratuity (s.10(10))
        leaveEncashExemptMinor:
          type: string
          description: Exempt portion of leave encashment (s.10(10AA))
        retrenchmentExemptMinor:
          type: string
          description: Exempt portion of retrenchment comp (s.10(10B))
        vrsExemptMinor:
          type: string
          description: Exempt portion of VRS comp (s.10(10C))
        totalTaxableMinor:
          type: string
          description: Total taxable amount on separation in paise
        tdsOnSeparationMinor:
          type: string
          description: TDS computed on the separation package in paise
        netPayableMinor:
          type: string
          description: Net amount payable to employee in paise
        computationDetail:
          type: object
          additionalProperties: true
          description: Full breakdown JSON (slab computation, exemption details)
        status:
          type: string
          enum: [draft, approved, paid]
        currency:
          type: string
          default: INR
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        updatedBy:
          type: string
          format: uuid
        version:
          type: integer

    FnfTaxBreakdown:
      type: object
      description: On-the-fly F&F tax computation result (not persisted)
      properties:
        totalGrossMinor:
          type: string
          description: Total gross separation package in paise
        totalExemptMinor:
          type: string
          description: Total exempt amount in paise
        totalTaxableOnSeparationMinor:
          type: string
          description: Taxable portion of separation components in paise
        annualTaxableMinor:
          type: string
          description: Annual taxable income (salary YTD + separation taxable) in paise
        annualTaxMinor:
          type: string
          description: Annual tax computed on total income in paise
        tdsAlreadyDeductedMinor:
          type: string
          description: TDS already deducted year-to-date in paise
        tdsOnSeparationMinor:
          type: string
          description: Incremental TDS to deduct on separation in paise
        netPayableMinor:
          type: string
          description: Net payable (gross - TDS on separation) in paise
        gratuityExemption:
          type: object
          properties:
            exemptMinor:
              type: string
            taxableMinor:
              type: string
        leaveEncashExemption:
          type: object
          properties:
            exemptMinor:
              type: string
            taxableMinor:
              type: string
        retrenchmentExemption:
          type: object
          nullable: true
          properties:
            exemptMinor:
              type: string
            taxableMinor:
              type: string
        vrsExemption:
          type: object
          nullable: true
          properties:
            exemptMinor:
              type: string
            taxableMinor:
              type: string

    # ─── Analytics Query Schemas ──────────────────────────────────────────────

    AnalyticsQueryRequest:
      type: object
      required: [metrics]
      properties:
        metrics:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            enum: [event_count, amount_sum, amount_avg, amount_max, amount_min]
          description: Metrics to aggregate (whitelisted keys only)
        dimensions:
          type: array
          maxItems: 4
          items:
            type: string
            enum: [source, event_type, category, status]
          default: []
          description: Dimensions to group by (whitelisted keys only)
        filters:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/AnalyticsFilter"
          default: []
          description: Filter conditions on whitelisted fields
        dateFrom:
          type: string
          format: date-time
          description: ISO 8601 lower date bound (inclusive)
        dateTo:
          type: string
          format: date-time
          description: ISO 8601 upper date bound (inclusive)
        joins:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/AnalyticsJoinCondition"
          default: []
          description: Cross-table join conditions (max 3 per query)
        calculatedFields:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/AnalyticsCalculatedField"
          default: []
          description: Calculated fields via structured expression language (max 10)
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
          description: Row limit (capped at 1000 for join queries)

    AnalyticsFilter:
      type: object
      required: [field, op, value]
      properties:
        field:
          type: string
          enum: [source, event_type, category, status, amount, occurred_at]
          description: Whitelisted filter field key
        op:
          type: string
          enum: [eq, neq, gt, gte, lt, lte, in]
          description: Comparison operator
        value:
          oneOf:
            - type: string
              maxLength: 256
            - type: number
            - type: boolean
            - type: array
              maxItems: 100
              items:
                oneOf:
                  - type: string
                    maxLength: 256
                  - type: number
          description: Filter value (scalar or array for 'in' operator)

    AnalyticsJoinCondition:
      type: object
      required: [leftKey, rightKey]
      properties:
        leftKey:
          type: string
          minLength: 1
          maxLength: 64
          description: Left-side column key (must be whitelisted)
        rightKey:
          type: string
          minLength: 1
          maxLength: 64
          description: Right-side column key (must be whitelisted)
        type:
          type: string
          enum: [inner, left]
          default: inner
          description: Join type

    AnalyticsCalculatedField:
      type: object
      required: [alias, expression]
      properties:
        alias:
          type: string
          minLength: 1
          maxLength: 64
          description: Output column name for this calculated field
        expression:
          $ref: "#/components/schemas/CalcExpression"
          description: Structured expression (serialized JSON max 500 chars)

    CalcExpression:
      type: object
      required: [op, left, right]
      description: |
        Arithmetic expression node. Only whitelisted operators (add, subtract,
        multiply, divide) and column keys are allowed. Max depth 5.
      properties:
        op:
          type: string
          enum: [add, subtract, multiply, divide]
          description: Arithmetic operator
        left:
          $ref: "#/components/schemas/CalcOperand"
        right:
          $ref: "#/components/schemas/CalcOperand"

    CalcOperand:
      description: An operand in a calculated field expression
      oneOf:
        - type: object
          required: [type, key]
          properties:
            type:
              type: string
              enum: [column]
            key:
              type: string
              minLength: 1
              maxLength: 64
              description: Whitelisted column key
        - type: object
          required: [type, value]
          properties:
            type:
              type: string
              enum: [literal]
            value:
              type: number
              description: Finite numeric literal
        - type: object
          required: [type, expr]
          properties:
            type:
              type: string
              enum: [expression]
            expr:
              $ref: "#/components/schemas/CalcExpression"

    AnalyticsQueryResult:
      type: object
      properties:
        data:
          type: object
          properties:
            rows:
              type: array
              items:
                type: object
                additionalProperties:
                  oneOf:
                    - type: string
                    - type: number
                    - type: "null"
              description: Result rows (key-value maps of metric/dimension/calc values)
            rowCount:
              type: integer
              description: Number of rows returned
            metrics:
              type: array
              items:
                type: string
              description: Metric keys included in the result
            dimensions:
              type: array
              items:
                type: string
              description: Dimension keys used for grouping
            calculatedFields:
              type: array
              items:
                type: string
              description: Calculated field aliases in the result

    DrillThroughResult:
      type: object
      properties:
        data:
          type: object
          properties:
            rows:
              type: array
              items:
                type: object
                additionalProperties:
                  oneOf:
                    - type: string
                    - type: number
                    - type: "null"
              description: Detail rows underlying the aggregated cell
            rowCount:
              type: integer
              description: Number of detail rows returned
            reportId:
              type: string
              format: uuid
              description: The report/query run ID
            cellId:
              type: string
              description: The cell identifier that was drilled into
