  # ═══════════════════════════════════════════════════════════════════════════
  # AI Agent Service — Guardrails
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/ai/guardrails/check:
    post:
      operationId: checkAiGuardrails
      tags: [AI Agent]
      summary: Evaluate text against the tenant's guardrail rules
      description: |
        Evaluates the supplied text against the tenant's active guardrail rules
        (or a specific subset when `rules` is given) and returns the outcome
        **without** blocking the request — this is the inspection endpoint, so a
        failing evaluation is still a 200 with `passed: false`. Only the redacted
        text is written to the audit log (DPDP Act 2023).
        Roles: ai_user, ai_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckAiGuardrailsRequest"
      responses:
        "200":
          description: Evaluation outcome (200 even when `passed` is false)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      passed:
                        type: boolean
                      violations:
                        type: array
                        items:
                          $ref: "#/components/schemas/AiGuardrailViolation"
                      sanitizedInput:
                        type: string
                        description: Redacted form of the input
                      rulesEvaluated:
                        type: integer
        "400":
          description: |
            Validation error (missing `input`, input longer than 16000
            characters, invalid uuid in `rules`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/ai/guardrails/rules:
    get:
      operationId: listAiGuardrailRules
      tags: [AI Agent]
      summary: List guardrail rules
      description: |
        Returns a paginated list of guardrail rules for the current tenant,
        optionally filtered by status, rule type, or severity.
        Roles: ai_user, ai_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/AiLimitParam"
        - $ref: "#/components/parameters/AiOffsetParam"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AiGuardrailRuleStatus"
        - name: ruleType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AiGuardrailRuleType"
        - name: severity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AiGuardrailSeverity"
      responses:
        "200":
          description: Paginated guardrail rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AiGuardrailRule"
                  meta:
                    $ref: "#/components/schemas/AiListMeta"
        "400":
          description: Validation error (limit/offset out of range, unknown enum value)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []
    post:
      operationId: createAiGuardrailRule
      tags: [AI Agent]
      summary: Create a guardrail rule
      description: |
        Creates an `active` guardrail rule. `severity` defaults to `medium` and
        `config` to `{}`. The rule is checked for internal consistency against its
        type (for example a `topic_block` rule needs a usable pattern or config),
        so an inconsistent rule is rejected with 422 `RULE_INVALID`.
        Roles: ai_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAiGuardrailRuleRequest"
      responses:
        "201":
          description: Guardrail rule created (starts `active`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AiGuardrailRule"
        "400":
          description: Validation error (missing `name`/`ruleType`, unknown enum value)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires ai_admin or super_admin
        "422":
          description: "`RULE_INVALID` — the rule is inconsistent with its `ruleType`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/ai/guardrails/rules/{id}:
    get:
      operationId: getAiGuardrailRule
      tags: [AI Agent]
      summary: Get a single guardrail rule
      description: |
        Returns one guardrail rule by id, scoped to the caller's tenant.
        Roles: ai_user, ai_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/AiGuardrailRuleIdPath"
      responses:
        "200":
          description: The guardrail rule
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AiGuardrailRule"
        "400":
          description: Validation error (id is not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Guardrail rule not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
    patch:
      operationId: updateAiGuardrailRule
      tags: [AI Agent]
      summary: Update a guardrail rule
      description: |
        Partially updates a guardrail rule. `ruleType` is **immutable** — it is
        not accepted here, and the merged rule is re-validated against the
        existing type (422 `RULE_INVALID`). `version` is **required** and guards
        the write. Roles: ai_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/AiGuardrailRuleIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAiGuardrailRuleRequest"
      responses:
        "200":
          description: Guardrail rule updated (returns the incremented version)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      updated:
                        type: boolean
                      version:
                        type: integer
        "400":
          description: Validation error (missing `version`, unknown `severity`/`status`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires ai_admin or super_admin
        "404":
          description: Guardrail rule not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Optimistic-lock failure (`VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`RULE_INVALID` — the merged rule is inconsistent with its `ruleType`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
    delete:
      operationId: deleteAiGuardrailRule
      tags: [AI Agent]
      summary: Soft-delete (disable) a guardrail rule
      description: |
        Soft-deletes a guardrail rule by disabling it; the row is never
        hard-deleted, so historical audit entries stay explainable.
        Optimistic-locked on the rule's current version. Returns **204 No
        Content** on success. Roles: ai_admin, super_admin.
      parameters:
        - $ref: "#/components/parameters/AiGuardrailRuleIdPath"
      responses:
        "204":
          description: Guardrail rule disabled (no response body)
        "400":
          description: Validation error (id is not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires ai_admin or super_admin
        "404":
          description: Guardrail rule not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Optimistic-lock failure (`VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # AI Agent Service — Governance
  #
  # Governance reads allow auditors as well: ai_user, ai_admin, audit_officer,
  # super_admin.
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/ai/governance/audit:
    get:
      operationId: listAiAuditTrail
      tags: [AI Agent]
      summary: List the AI audit trail
      description: |
        Returns the paginated AI audit trail for the current tenant, optionally
        filtered by agent, blocked flag, or action. Free-text `input`/`output`
        columns were redacted at write time, so this endpoint never exposes raw
        prompts (DPDP Act 2023). In addition to `data` / `meta` the response
        carries a `summary` block with the block-rate for the returned page.
        Roles: ai_user, ai_admin, audit_officer, super_admin.
      parameters:
        - $ref: "#/components/parameters/AiLimitParam"
        - $ref: "#/components/parameters/AiOffsetParam"
        - name: agentId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: blocked
          in: query
          required: false
          description: Filter by blocked flag — supplied as the string `true` or `false`
          schema:
            type: string
            enum: ["true", "false"]
        - name: action
          in: query
          required: false
          description: Filter by audited action (e.g. `chat.send`, `agent.invoke`)
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Paginated audit entries with a block-rate summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AiAuditEntry"
                  meta:
                    $ref: "#/components/schemas/AiListMeta"
                  summary:
                    $ref: "#/components/schemas/AiBlockRateSummary"
        "400":
          description: Validation error (limit/offset out of range, `blocked` not `true`/`false`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/ai/governance/audit/{id}:
    get:
      operationId: getAiAuditEntry
      tags: [AI Agent]
      summary: Get a single audit entry
      description: |
        Returns one AI audit entry by id, scoped to the caller's tenant.
        Roles: ai_user, ai_admin, audit_officer, super_admin.
      parameters:
        - name: id
          in: path
          required: true
          description: AI audit entry id
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The audit entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AiAuditEntry"
        "400":
          description: Validation error (id is not a uuid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Audit entry not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/ai/governance/summary:
    get:
      operationId: getAiGovernanceSummary
      tags: [AI Agent]
      summary: Get block-rate statistics
      description: |
        Returns total invocations, blocked count, and block rate (percent, 2
        decimal places) for the tenant, optionally narrowed to one agent. An
        empty audit trail yields a block rate of 0 rather than a divide-by-zero.
        Roles: ai_user, ai_admin, audit_officer, super_admin.
      parameters:
        - name: agentId
          in: query
          required: false
          description: Restrict the statistics to one agent
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Block-rate statistics
          content:
