        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Notification Service — email deliverability (CR-MKT-04)
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/notification/email/sending-domains:
    post:
      operationId: registerSendingDomain
      tags: [Notification]
      summary: Register a sending domain
      description: |
        Registers a DNS domain the tenant intends to send mail from, together with
        the DKIM selector, DKIM public-key material, SPF include mechanism and
        DMARC policy that its DNS is expected to publish. The registration is a
        CQRS write: it is validated, queued and answered 202. No DNS lookup is
        performed by the request — a scheduled checker resolves the records and
        posts the observed values back via the auth-checks endpoint.

        A newly registered domain starts at `health: unknown` until the first
        check lands.

        Roles: notification_admin, tenant_admin, platform_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterSendingDomainRequest"
      responses:
        "202":
          description: Registration accepted for async processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: |
            Validation error — `domain` is not a valid multi-label DNS name,
            `dkimSelector` contains characters outside `[a-z0-9._-]`,
            `dkimValue` is shorter than 8 characters, or `dmarcPolicy` is not one
            of none/quarantine/reject.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "422":
          description: |
            `INVALID_SPF_INCLUDE` — `spfInclude` must be an `include:` mechanism
            (e.g. `include:spf.example.net`), not a bare hostname. A bare host
            would make every later SPF evaluation fail silently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
      security:
        - bearerAuth: []
    get:
      operationId: listSendingDomains
      tags: [Notification]
      summary: List sending domains
      description: |
        Returns the tenant's registered sending domains with their current
        authentication health. `limit` is mandatory (max 200) — there is no
        unbounded listing.

        Roles: notification_admin, tenant_admin, platform_admin, super_admin,
        audit_officer.
      parameters:
        - name: limit
          in: query
          required: true
          description: Page size. Required — max 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated list of sending domains
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SendingDomain"
                  meta:
                    $ref: "#/components/schemas/NotificationListMeta"
        "400":
          description: Validation error — `limit` missing, below 1, or above 200
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/notification/email/sending-domains/{id}/auth-checks:
    post:
      operationId: recordSendingDomainAuthCheck
      tags: [Notification]
      summary: Record a DKIM/SPF/DMARC check result
      description: |
        Records the raw TXT strings observed in DNS for a domain's DKIM, SPF and
        DMARC records. The service evaluates each mechanism against the expected
        values captured at registration and rolls the three results into one
        health status; it does NOT resolve DNS itself, which keeps request
        handling free of network I/O.

        An empty array for a mechanism means the record is absent (`missing`).
        Omitting the body entirely is legal and records all three as missing,
        which is how "the domain publishes nothing" is reported.

        Health roll-up: DKIM or SPF not passing ⇒ `failing` (mail is at real risk
        of rejection). DMARC alone not passing ⇒ `degraded` (mail delivers but
        the domain is unprotected against spoofing). All three missing ⇒
        `unknown`.

        Roles: notification_admin, tenant_admin, platform_admin, super_admin.
      parameters:
        - name: id
          in: path
          required: true
          description: Sending domain id
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordDomainAuthCheckRequest"
      responses:
        "202":
          description: Check result accepted for async processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: |
            Validation error — `id` is not a uuid, a TXT array holds more than 20
            strings or a string longer than 4096 characters, `source` is not
            scheduled/manual, or `checkedAt` is not an ISO-8601 date-time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: "`NOT_FOUND` — no sending domain with that id in this tenant"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
      security:
        - bearerAuth: []

  /v1/notification/email/sending-domains/{id}/health:
    get:
      operationId: getSendingDomainHealth
      tags: [Notification]
      summary: Get current authentication health and check history
      description: |
        Returns the domain's current health, whether it may still be used as an
        envelope-from (`sendingAllowed` is true for `healthy` and `degraded`), the
        expected records registered for it, and the most recent check results
        newest-first.

        Roles: notification_admin, tenant_admin, platform_admin, super_admin,
        audit_officer.
      parameters:
        - name: id
          in: path
          required: true
          description: Sending domain id
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: How many historical checks to return
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        "200":
          description: Current health plus check history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SendingDomainHealth"
        "400":
          description: Validation error — `id` is not a uuid, or `limit` out of range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: "`NOT_FOUND` — no sending domain with that id in this tenant"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
      security:
        - bearerAuth: []

  /v1/notification/email/dmarc-policies:
    get:
      operationId: listDmarcPolicies
      tags: [Notification]
      summary: List accepted DMARC policies
      description: |
        Returns the DMARC policy values the registration validator accepts, so an
        operator console does not have to hardcode them. Takes no parameters.

        Roles: notification_admin, tenant_admin, platform_admin, super_admin,
        audit_officer.
      responses:
        "200":
          description: Accepted DMARC policy values
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string
                      enum: [none, quarantine, reject]
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # CRM Service — Contacts / leads (LM-001 configurable field rules)
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/crm/contacts:
    post:
      operationId: createCrmContact
      tags: [CRM]
      summary: Create a contact (lead) via manual capture
      description: |
        Validates the payload, then checks it against the tenant's configured
        mandatory lead fields (`/v1/crm/lead-field-rules`) before publishing the
        create command. Two distinct failure modes:

        - 400 `VALIDATION_FAILED` — the payload is malformed (bad email, missing
          `name`, unknown `leadStatus`).
        - 422 `MANDATORY_FIELDS_MISSING` — the payload is well formed but omits a
          field this tenant has declared required. Only enabled rules are enforced,
          so a tenant can suspend enforcement during a data-cleanup window.

        Enforcement is deliberately limited to this route. Bulk import
        (`POST /v1/crm/contacts/bulk/import`) and `PATCH /v1/crm/contacts/{id}`
        must stay able to land partial records.

        Roles: crm_user, crm_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCrmContactRequest"
      responses:
        "202":
          description: Create command queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Schema validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "422":
          description: |
            `MANDATORY_FIELDS_MISSING` — one or more tenant-mandatory fields were
            absent. The message lists the field names, comma separated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/crm/leads/inbound:
    post:
      operationId: captureInboundLead
      tags: [CRM]
      summary: Capture a lead from an automated channel
      description: |
        Machine/integration entry point (LM-005). Queues a lead captured by email,
        telephony, chatbot, whatsapp, a partner API, or a campaign channel and answers
        202 with the `contactId` the consumer will write.

        This path applies NO mandatory-field enforcement — an automated channel cannot
        be asked to fill in fields the caller never sent. That is why it is restricted
        to machine and administrator roles: a human creating a lead by hand must use
        `POST /v1/crm/contacts`, where the tenant's `/v1/crm/lead-field-rules`
        configuration is enforced with 422. `crm_user` is deliberately excluded, since
        allowing it here let the role governed by LM-001 bypass LM-001.

        Roles: integration_bot, crm_admin, tenant_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, source, attributes]
              properties:
                channel:
                  type: string
                  enum: [email, telephony, chatbot, whatsapp, partner_api, campaign]
                source:
                  type: string
                  minLength: 1
                  description: Campaign, queue or partner identifier the lead came from
                attributes:
                  type: object
                  description: Captured lead fields; unknown keys are passed through
                  properties:
                    name: { type: string }
                    email: { type: string, format: email }
                    phone: { type: string }
                    company: { type: string }
                    designation: { type: string }
                    city: { type: string }
                    leadSource: { type: string }
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        "202":
          description: Capture command queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
                  correlationId: { type: string }
                  contactId:
                    type: string
                    format: uuid
                    description: Id the captured lead will be written under
        "400":
          description: Validation error — unknown channel, empty source, bad email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: |
            Insufficient role. Includes `crm_user`: manual lead capture must go through
            `POST /v1/crm/contacts` so tenant mandatory fields are enforced.
      security:
        - bearerAuth: []

  /v1/crm/lead-field-rules:
    get:
      operationId: listLeadFieldRules
      tags: [CRM]
      summary: List the tenant's lead field rules
      description: |
        Returns every configured rule for the caller's tenant. Readable by any CRM
        user because the guided lead form needs to know which fields to mark
        mandatory. A tenant with no configuration gets an empty list, and the
        platform-wide defaults apply.

        Roles: crm_user, crm_admin, super_admin.
      responses:
        "200":
          description: Configured rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeadFieldRule"
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []
    put:
      operationId: upsertLeadFieldRule
      tags: [CRM]
      summary: Declare a lead field mandatory and/or weighted
      description: |
        Upserts the rule identified by (tenant, `fieldName`) — PUT rather than POST
        because re-declaring a field is an update of the same resource, not a
        second rule. `weight` sets relative importance in the completeness score;
        `enabled: false` suspends the rule entirely — it neither blocks a save nor
        counts towards the score — while keeping the configured weight for later.

        `fieldName` is constrained to the governable set, matching the CHECK
        constraint in migration `0037_lead_field_rules.sql`.

        Roles: crm_admin, tenant_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertLeadFieldRuleRequest"
      responses:
        "202":
          description: Upsert command queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: |
            Validation error — unknown `fieldName`, non-boolean `required`, or
            `weight` outside 0–100.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/crm/lead-field-rules/{fieldName}:
    delete:
      operationId: deleteLeadFieldRule
      tags: [CRM]
      summary: Revert a lead field to built-in behaviour
      description: |
        Removes the tenant's rule for one field. The field then falls back to the
        platform default — no longer mandatory, and scored with the default weight
        map.

        Roles: crm_admin, tenant_admin, super_admin.
      parameters:
        - name: fieldName
          in: path
          required: true
          description: The governed field whose rule should be removed
          schema:
            type: string
            enum: [name, email, phone, company, designation, city, leadSource]
      responses:
        "202":
          description: Delete command queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: "`VALIDATION_FAILED` — `fieldName` is outside the governable set"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: "`NOT_FOUND` — no rule for that field in this tenant"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/crm/leads/{id}/completeness:
    get:
      operationId: getLeadCompleteness
      tags: [CRM]
      summary: Per-record data quality completeness score
      description: |
        Scores one active lead 0–100 against the tenant's configured field weights.
        Every enabled rule is scored — weights only set relative importance, and a
        tenant that configures none gets its enabled fields weighted equally. The
        built-in default map applies only when nothing is governed (no rules, or all
        of them disabled). The score is normalised, so weights need not sum to 100.

        Roles: crm_user, crm_admin, tenant_admin, super_admin.
      parameters:
        - name: id
          in: path
          required: true
          description: Lead (contact) id
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Completeness breakdown
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/LeadCompleteness"
        "400":
          description: "`VALIDATION_FAILED` — `id` is not a UUID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: "`NOT_FOUND` — no active lead with that id in this tenant"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/crm/lead-capture-forms:
    get:
      operationId: listLeadCaptureForms
      tags: [CRM]
      summary: List the tenant's public lead-capture forms
      description: |
        Returns every capture form for the caller's tenant, INCLUDING each `formKey` —
        an admin cannot embed a form without it.

        Admin-only, unlike `/v1/crm/lead-field-rules` which any CRM user may read. Every
        row here is a live credential for an unauthenticated write endpoint plus the
        policy governing it, so a reader could hand the key to anyone.

        Roles: crm_admin, tenant_admin, super_admin.
      responses:
        "200":
          description: The tenant's capture forms
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeadCaptureForm"
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []
    post:
      operationId: createLeadCaptureForm
      tags: [CRM]
      summary: Register a public lead-capture form (LM-002)
      description: |
        Queues creation of a capture form and returns the server-generated `formKey`
        once, alongside the standard Accepted envelope. The public submission URL is
        `POST /v1/crm/public/leads/{formKey}`.

        `formKey` is NOT accepted in the request body — a client-chosen key would be
        guessable, and the key is the only credential the public endpoint has, so a
        guessable key means anyone can post leads into any tenant. Sending one is a 400.

        Defaults are the safe ones: `enabled: true`, `requireConsent: true` (DPDP Act
        2023), `allowedOrigins: []`, `maxPerMinute: 10`.

        Roles: crm_admin, tenant_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadCaptureFormRequest"
      responses:
        "202":
          description: Create command queued; the minted form key is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadCaptureFormAccepted"
        "400":
          description: |
            Validation error — missing `name`, an unknown field (including a supplied
            `formKey` or `tenantId`), a bare-hostname or wildcard origin, `maxPerMinute`
            outside 1–600, or a non-uuid `campaignId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/crm/lead-capture-forms/{id}:
    patch:
      operationId: updateLeadCaptureForm
      tags: [CRM]
      summary: Amend a public lead-capture form
      description: |
        Partial update — only the fields supplied are changed. An empty body is a 400,
        not a no-op 202.

        `formKey` is not amendable. Rotating a key is a create + delete, so the old URL
        stops working deliberately rather than a live form silently changing address.

        Roles: crm_admin, tenant_admin, super_admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeadCaptureFormRequest"
      responses:
        "202":
          description: Update command queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error — empty patch, unknown field, or non-uuid `id`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: |
            `NOT_FOUND` — no such form in THIS tenant. Another tenant's form id is a 404,
            never a 202.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
    delete:
      operationId: deleteLeadCaptureForm
      tags: [CRM]
      summary: Remove a public lead-capture form
      description: |
        Hard delete, which is the one place this service diverges from
        "DELETE = soft-delete". A capture form is not user data; it is a live credential
        on a public endpoint. A `deleted_at` row would keep the URL resolvable unless
        every read remembered to filter it, and the failure mode of forgetting is an
        endpoint an admin believes is closed but which still accepts leads. Leads already
        captured through the form are untouched.

        Roles: crm_admin, tenant_admin, super_admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Delete command queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: "`VALIDATION_FAILED` — `id` is not a UUID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: "`NOT_FOUND` — no such form in this tenant"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/crm/public/leads/{formKey}:
    post:
      operationId: submitPublicLead
      tags: [CRM]
      summary: Submit a lead from a public web form (LM-002, UNAUTHENTICATED)
      description: |
        The only unauthenticated write in crm-service. A prospect's browser (or a
        tenant's server-side form handler) posts here; the lead is created or updated
        asynchronously and its attribution recorded.

        **No bearer token.** The 64-hex `formKey` in the path is the only credential, and
        it is also what resolves the tenant — so there is no header or body field that can
        redirect the write. The body is strict: any unknown field (including `tenantId`,
        `ownerId`, `leadStatus` or `consentDate`) is a 400.

        **Create-or-update, but only over leads this endpoint itself created.** A
        submission carrying an email that already belongs to a lead captured through a
        public form updates that lead and refreshes its attribution instead of creating a
        duplicate. Identity fields are only overwritten when supplied, `leadStatus` is
        never downgraded, and consent is never revoked by a later submission.

        A submission whose email belongs to a contact created by the authenticated UI, by
        bulk import or by deal conversion — or to a soft-deleted lead — still answers 202
        but writes **nothing**. The form key is embedded in a public web page, so allowing
        an anonymous caller to update an arbitrary contact would let a stranger rewrite
        that person's record and assert DPDP marketing consent on their behalf. Merging a
        genuine prospect into an existing CRM contact is an authenticated action.

        **Consent.** When the form sets `requireConsent`, a submission without
        `consent: true` is refused 422 `CONSENT_REQUIRED` and nothing is written.
        `consent_date` is stamped server-side; there is no client-supplied consent date.

        **Enumeration.** Unknown, malformed, disabled and deleted form keys all answer
        one identical 404 `NOT_FOUND` / "form not found", so the endpoint cannot be used
        to discover which keys — or which tenants — exist.

        **Rate limiting.** Two fixed 60s windows: per (form, client IP), bounded by the
        form's `maxPerMinute`, and a per-tenant ceiling a distributed flood cannot dodge
        by rotating IPs. Exceeding either is 429 `RATE_LIMITED`. The limiter FAILS CLOSED:
        if it cannot answer, the submission is refused rather than admitted.

        **Response.** `{ status, correlationId }` and nothing else — no contact id, no
        tenant id, no echo of the submitted values, so the endpoint cannot be used as an
        oracle for whether an address is already a lead.
      parameters:
        - name: formKey
          in: path
          required: true
          description: |
            Server-generated form key, 64 lowercase hex characters. Never client-chosen.
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
        - name: Origin
          in: header
          required: false
          description: |
            Sent by browsers on cross-origin posts. When the form configures
            `allowedOrigins`, an exact match is required and a request with no Origin is
            refused. An empty allowlist accepts any origin, because a server-side post
            carries no Origin header at all.
          schema:
            type: string
      requestBody:
        required: true
        description: Max 16 KiB; larger payloads are rejected 413 before being buffered.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicLeadSubmission"
      responses:
        "202":
          description: |
            Submission accepted. Also returned for a submission caught by the honeypot,
            which is silently discarded — a distinct rejection would teach a bot to omit
            the field.
          content:
            application/json:
              schema:
                type: object
                required: [status, correlationId]
                properties:
                  status:
                    type: string
                    enum: [accepted]
                  correlationId:
                    type: string
        "400":
          description: |
            `VALIDATION_FAILED` — a malformed or over-long value, or any unknown field.
            String bounds: `name` 1–200, `email` ≤320, `phone` 4–32, `company` ≤200,
            `city` ≤100, `designation` ≤120, `source` ≤64, each `utm.*` ≤128.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "403":
          description: |
            `ORIGIN_NOT_ALLOWED` — the `Origin` header is absent from, or not present in,
            the form's `allowedOrigins`. Distinct from the 404 on purpose: it is only
            reachable by a caller who already holds a valid key, so it leaks nothing,
            and a 404 would send a tenant's own web developer hunting for a missing form
            instead of a misconfigured origin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: |
            `NOT_FOUND` / "form not found" — one neutral response for an unknown key, a
            malformed key, a disabled form and a deleted form. Deliberately
            indistinguishable; see the description.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Request body exceeded the 16 KiB cap
        "422":
          description: |
            `CONSENT_REQUIRED` — the form requires explicit marketing consent (DPDP Act
            2023) and the submission did not carry `consent: true`. 422 rather than 400
            because the payload is well formed; it is the lawful basis for processing
            that is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: |
            `RATE_LIMITED` — the per-(form, IP) budget or the per-tenant ceiling for this
            60s window is spent, OR the rate limiter itself is unavailable and the
            endpoint failed closed. The message distinguishes the two for an operator
            without telling a caller which budget it hit.
          headers:
            Retry-After:
              description: |
                Seconds to wait before retrying. Always `60`: the limiter uses a fixed
                60s window with the minute bucket baked into its counter key, so one
                window is always sufficient.
              schema:
                type: integer
                example: 60
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Knowledge Service
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/knowledge/articles:
    get:
      operationId: listKnowledgeArticles
      tags: [Knowledge]
      summary: List knowledge articles
      description: |
        Returns a paginated list of knowledge articles for the current tenant.
        Articles are sourced from the documents store and returned with standard
        pagination metadata. Supports offset-based pagination via limit/offset
        query parameters.
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: Paginated list of knowledge articles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/KnowledgeArticle"
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires knowledge_user, knowledge_admin, or super_admin
      security:
        - bearerAuth: []

# ═══════════════════════════════════════════════════════════════════════════════
# Components
# ═══════════════════════════════════════════════════════════════════════════════

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Keycloak OIDC access token (RS256). Obtain via
        POST /realms/civitasone/protocol/openid-connect/token
        with client_credentials or authorization_code grant.
    scimBearerToken:
      type: http
      scheme: bearer
      description: |
        Static bearer token for SCIM 2.0 provisioning endpoints.
        Set via SCIM_BEARER_TOKEN environment variable on the identity-service.
        Separate from Keycloak user JWTs — used only by external IdPs
        (Azure AD, Okta, Google Workspace, MeriPehchaan).

  parameters:
    LimitParam:
      name: limit
      in: query
      description: Maximum number of items to return (default 20, max 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    OffsetParam:
      name: offset
      in: query
      description: Number of items to skip for pagination
      schema:
        type: integer
        minimum: 0
        default: 0
    CdpLimitParam:
      name: limit
      in: query
      description: Maximum number of items to return (cdp-service default 50, max 200)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    CdpOffsetParam:
      name: offset
      in: query
      description: Number of items to skip for pagination
      schema:
        type: integer
        minimum: 0
        default: 0
    CdpProfileIdPath:
      name: id
      in: path
      required: true
      description: Golden profile id
      schema:
        type: string
        format: uuid
    CatalogueLimitParam:
      name: limit
      in: query
      description: Maximum number of items to return (catalogue-service default 50, max 200)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    CatalogueOffsetParam:
      name: offset
      in: query
      description: Number of items to skip for pagination
      schema:
        type: integer
        minimum: 0
        default: 0
    CatalogueProductIdPath:
      name: id
      in: path
      required: true
      description: Product id
      schema:
        type: string
        format: uuid
    LoyaltyLimitParam:
      name: limit
      in: query
      description: Maximum number of items to return (loyalty-service default 50, max 200)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    LoyaltyOffsetParam:
      name: offset
      in: query
      description: Number of items to skip for pagination
      schema:
        type: integer
        minimum: 0
        default: 0
    LoyaltyEnrolmentIdPath:
      name: id
      in: path
      required: true
      description: Enrolment id
      schema:
        type: string
        format: uuid
    CatalogueRateIdPath:
      name: id
      in: path
      required: true
      description: Rate id
      schema:
        type: string
        format: uuid
    CatalogueBundleIdPath:
      name: id
      in: path
      required: true
      description: Bundle id
      schema:
        type: string
        format: uuid
    LoyaltyProgramIdPath:
      name: id
      in: path
      required: true
      description: Loyalty program id
      schema:
        type: string
        format: uuid
    LoyaltyRedemptionIdPath:
      name: id
      in: path
      required: true
      description: Redemption id
      schema:
        type: string
        format: uuid
    LoyaltyTierEnrolmentIdPath:
      name: enrolmentId
      in: path
      required: true
      description: Enrolment id whose tier is being read
      schema:
        type: string
        format: uuid
    JourneyLimitParam:
      name: limit
      in: query
      description: Maximum number of items to return (journey-service default 20, max 200)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    JourneyOffsetParam:
      name: offset
      in: query
      description: Number of items to skip for pagination
      schema:
        type: integer
        minimum: 0
        default: 0
    JourneyIdPath:
      name: id
      in: path
      required: true
      description: Journey id
      schema:
        type: string
        format: uuid
    JourneyTriggerIdPath:
      name: id
      in: path
      required: true
      description: Journey trigger id
      schema:
        type: string
        format: uuid
    FieldLimitParam:
      name: limit
      in: query
      description: Maximum number of items to return (field-service default 20, max 200)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    FieldOffsetParam:
      name: offset
      in: query
      description: Number of items to skip for pagination
      schema:
        type: integer
        minimum: 0
        default: 0
    FieldTaskIdPath:
      name: id
      in: path
      required: true
      description: Field task id
      schema:
        type: string
        format: uuid
    FieldVisitIdPath:
      name: id
      in: path
      required: true
      description: Field visit id
      schema:
        type: string
        format: uuid
    FieldRouteIdPath:
      name: id
      in: path
      required: true
      description: Route plan id
      schema:
        type: string
        format: uuid
    RecommendationLimitParam:
      name: limit
      in: query
      description: |
        Maximum number of items to return (recommendation-service default 20,
        max 200). The NBA top-N route `/v1/recommendations/{profileId}` is
        tighter: default 5, max 50.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    RecommendationOffsetParam:
      name: offset
      in: query
      description: Number of items to skip for pagination
      schema:
        type: integer
        minimum: 0
        default: 0
    RecommendationIdPath:
      name: id
      in: path
      required: true
      description: Recommendation id
      schema:
        type: string
        format: uuid
    RecommendationMatrixIdPath:
      name: id
      in: path
      required: true
      description: Cross-sell matrix entry id
      schema:
        type: string
        format: uuid
    RecommendationAccountIdPath:
      name: accountId
      in: path
      required: true
      description: Account id whose health is being scored
      schema:
        type: string
        format: uuid
    AiLimitParam:
      name: limit
      in: query
      description: Maximum number of items to return (ai-agent-service default 50, max 200)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    AiOffsetParam:
      name: offset
      in: query
      description: Number of items to skip for pagination
      schema:
        type: integer
        minimum: 0
        default: 0
    AiAgentIdPath:
      name: id
      in: path
      required: true
      description: Agent definition id
      schema:
        type: string
        format: uuid
    AiConversationIdPath:
      name: conversationId
      in: path
      required: true
      description: Chat conversation id
      schema:
        type: string
        format: uuid
    AiGuardrailRuleIdPath:
      name: id
      in: path
      required: true
      description: Guardrail rule id
      schema:
        type: string
        format: uuid

  schemas:
    # ─── Common ────────────────────────────────────────────────────────────────

    AcceptedResponse:
      type: object
      required: [id, status, correlationId]
      properties:
        id:
          type: string
          format: uuid
          description: ID of the created/queued resource
        status:
          type: string
          enum: [accepted, queued]
        correlationId:
          type: string
          description: Request correlation ID for tracing

    Pagination:
      type: object
      properties:
        hasMore:
          type: boolean
        pageSize:
          type: integer
        total:
          type: integer

    ValidationError:
      type: object
      required: [code, message, correlationId, retryable]
      properties:
        code:
          type: string
          examples: ["VALIDATION_FAILED"]
        message:
          type: string
        correlationId:
          type: string
        retryable:
          type: boolean
          const: false
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    ErrorResponse:
      type: object
      required: [code, message, correlationId, retryable]
      properties:
        code:
          type: string
        message:
          type: string
        correlationId:
          type: string
        retryable:
          type: boolean

    # ─── Finance ───────────────────────────────────────────────────────────────

    # ─── Audit ─────────────────────────────────────────────────────────────────

    CreateAuditPlanRequest:
      type: object
      required: [planNo, title, area, periodFrom, periodTo]
      properties:
        planNo:
          type: string
          minLength: 1
          maxLength: 64
        title:
          type: string
          minLength: 1
          maxLength: 256
        area:
          type: string
          minLength: 1
          maxLength: 128
        periodFrom:
          type: string
          format: date
        periodTo:
          type: string
          format: date
        riskLevel:
          type: string
          enum: [low, medium, high]
          default: medium

    CreateAuditPlanItemRequest:
      type: object
      required: [deptRef, scheduledFrom, scheduledTo]
      properties:
        deptRef:
          type: string
          minLength: 1
          maxLength: 128
        unitRef:
          type: string
          maxLength: 128
        scheduledFrom:
          type: string
          format: date
        scheduledTo:
          type: string
          format: date

    AuditPlan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        planNo:
          type: string
        title:
          type: string
        area:
          type: string
        periodFrom:
          type: string
          format: date
        periodTo:
          type: string
          format: date
        riskLevel:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [draft, active, completed, cancelled]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        updatedBy:
          type: string
          format: uuid
        version:
          type: integer

    AuditPlanItem:
      type: object
      properties:
        id:
          type: string
        auditUnit:
          type: string
        department:
          type: string
        type:
          type: string
          enum: [routine]
        plannedFrom:
          type: string
          format: date
        plannedTo:
          type: string
          format: date
        status:
          type: string
          enum: [planned, in_progress, completed, deferred]

    AuditPlanItemList:
      type: array
      items:
        $ref: "#/components/schemas/AuditPlanItem"

    # ─── Visitor / Badge Print ─────────────────────────────────────────────────

    BadgeTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        printerLanguage:
          type: string
          enum: [zpl, escpos]
        templateBody:
          type: string
        badgeWidthMm:
          type: integer
        badgeHeightMm:
          type: integer
        status:
          type: string
          enum: [active, archived]
        visitorCategory:
          type: string
          enum: [default, walk_in, pre_registered, vip, contractor, group]
        templateVersion:
          type: integer
        previousVersionId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PrintJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        passId:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, in_progress, completed, failed]
        priority:
          type: string
          enum: [standard, high]
        renderedPayload:
          type: string
          nullable: true
        retryCount:
          type: integer
        nextRetryAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ─── Finance (continued) ──────────────────────────────────────────────────

    Bill:
      type: object
      required: [id, tenantId, vendorId, amountPaise, currency, status]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        billNumber:
          type: string
          description: Human-readable bill reference number
        vendorId:
          type: string
          format: uuid
        vendorName:
          type: string
        sanctionId:
          type: string
          format: uuid
        amountPaise:
          type: integer
          format: int64
          description: Bill amount in paise (minor units)
        currency:
          type: string
          default: INR
          description: ISO 4217 currency code
        status:
          type: string
          enum: [draft, pending, sanctioned, paid, cancelled]
        description:
          type: string
        budgetHeadId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        version:
          type: integer

    CreateBillRequest:
      type: object
      required: [vendorId, amountPaise, budgetHeadId, description]
      properties:
        vendorId:
          type: string
          format: uuid
        sanctionId:
          type: string
          format: uuid
        amountPaise:
          type: integer
          format: int64
          minimum: 1
          description: Amount in paise
        currency:
          type: string
          default: INR
        budgetHeadId:
          type: string
          format: uuid
        description:
          type: string
          maxLength: 500
        attachments:
          type: array
          items:
            type: string
            format: uri

    Sanction:
      type: object
      required: [id, tenantId, budgetHeadId, amountPaise, status]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        sanctionNumber:
          type: string
        budgetHeadId:
          type: string
          format: uuid
        amountPaise:
          type: integer
          format: int64
          description: Sanctioned amount in paise
        availablePaise:
          type: integer
          format: int64
          description: Remaining available balance in paise
        currency:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, exhausted, cancelled]
        purpose:
          type: string
        financialYear:
          type: string
          examples: ["2025-26"]
        createdAt:
          type: string
          format: date-time
        approvedBy:
          type: string
          format: uuid
        version:
          type: integer

    CreateSanctionRequest:
      type: object
      required: [budgetHeadId, amountPaise, purpose, financialYear]
      properties:
        budgetHeadId:
          type: string
          format: uuid
        amountPaise:
          type: integer
          format: int64
          minimum: 1
        purpose:
          type: string
          maxLength: 1000
        financialYear:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
          examples: ["2025-26"]

    Payment:
      type: object
      required: [id, tenantId, billId, amountPaise, status, mode]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        billId:
          type: string
          format: uuid
        amountPaise:
          type: integer
          format: int64
        currency:
          type: string
        status:
          type: string
          enum: [initiated, processing, completed, failed, reversed]
        mode:
          type: string
          enum: [pfms, neft, rtgs, cheque, cash]
        utrNumber:
          type: string
          description: Unique Transaction Reference (bank reference)
        paidAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    CreatePaymentRequest:
      type: object
      required: [billId, amountMinor, mode, ddoCode]
      properties:
        billId:
          type: string
          format: uuid
        ddoCode:
          type: string
          pattern: '^[A-Za-z0-9]{6,12}$'
          description: DDO code in PFMS format (6–12 alphanumeric characters)
        mode:
          type: string
          enum: [NEFT, RTGS, IMPS, DBT, PFMS, cheque]
        amountMinor:
          oneOf:
            - type: integer
              format: int64
              minimum: 1
            - type: string
              pattern: '^\d+$'
          description: |
            Payment amount in paise (minor units). Accepts either an integer or a
            string-encoded integer for bigint safety (avoids 2^53 precision loss).
            Must equal the bill's netMinor (conservation invariant).
        currency:
          type: string
          minLength: 3
          maxLength: 3
          default: INR
          description: ISO 4217 currency code
        eftRef:
          type: string
          description: External EFT reference (optional tracking ID)
        bankAccountId:
          type: string
          format: uuid
          description: Target bank account for the payment (optional)

    GlEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        accountName:
          type: string
        debitPaise:
          type: integer
          format: int64
        creditPaise:
          type: integer
          format: int64
        voucherRef:
          type: string
        narration:
          type: string
        postingDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time

    CreateBudgetRequest:
      type: object
      required: [headId, financialYear, allocationPaise]
      properties:
        headId:
          type: string
          format: uuid
          description: Budget Head / Head of Account ID
        financialYear:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
          examples: ["2025-26"]
        allocationPaise:
          type: integer
          format: int64
          minimum: 0
          description: Budget allocation in paise
        description:
          type: string

    # ─── HRMS ──────────────────────────────────────────────────────────────────

    Employee:
      type: object
      required: [id, tenantId, name, employeeCode, status]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        employeeCode:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        designation:
          type: string
        departmentId:
          type: string
          format: uuid
        departmentName:
          type: string
        employeeType:
          type: string
          enum: [permanent, temporary, contract, deputation]
        status:
          type: string
          enum: [active, probation, suspended, retired, terminated]
        dateOfJoining:
          type: string
          format: date
        photoUrl:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
        version:
          type: integer

    LeaveRequest:
      type: object
      required: [id, employeeId, leaveTypeId, fromDate, toDate, daysApplied, status]
      properties:
        id:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        leaveTypeId:
          type: string
          format: uuid
        leaveTypeName:
          type: string
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        daysApplied:
          type: number
        reason:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, cancelled]
        appliedAt:
          type: string
          format: date-time
        approvedBy:
          type: string
          format: uuid

    ApplyLeaveRequest:
      type: object
      required: [leaveTypeId, employeeId, allocId, fromDate, toDate, daysApplied]
      properties:
        leaveTypeId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        allocId:
          type: string
          format: uuid
          description: Leave allocation ID to debit from
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        daysApplied:
          type: integer
          minimum: 1
          description: Number of leave days applied (positive integer)
        reason:
          type: string
          maxLength: 1000

    PeriodLockRequest:
      type: object
      required: [period]
      properties:
        period:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
          description: Attendance month to lock/unlock (YYYY-MM)
          example: "2026-06"
        reason:
          type: string
          maxLength: 500
          description: Optional justification recorded on the lock for audit

    AttendanceLock:
      type: object
      properties:
        id:
          type: string
          format: uuid
        period:
          type: string
          description: Attendance month (YYYY-MM)
          example: "2026-06"
        status:
          type: string
          enum: [locked, open]
        reason:
          type: string
          nullable: true
        lockedBy:
          type: string
          format: uuid
          nullable: true
        lockedAt:
          type: string
          format: date-time
          nullable: true

    CheckInRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        accuracy:
          type: number
          description: GPS accuracy in meters
        withinGeofence:
          type: boolean
        deviceFingerprint:
          type: string
        timestamp:
          type: string
          format: date-time

    GeoCheckInRequest:
      type: object
      required: [employeeId, latitude, longitude]
      properties:
        employeeId:
          type: string
          format: uuid
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        accuracyMeters:
          type: number
          minimum: 0
          description: GPS accuracy in meters
        selfieFileKey:
          type: string
          description: S3/MinIO object key for the selfie image
        deviceId:
          type: string
          description: Device identifier for fraud detection
        officeLocationId:
          type: string
          format: uuid
          description: Target office location (auto-detected if omitted)

    IdCard:
      type: object
      properties:
        employeeId:
          type: string
          format: uuid
        employeeCode:
          type: string
        name:
          type: string
        designation:
          type: string
        department:
          type: string
        office:
          type: string
        photoUrl:
          type: string
          format: uri
        qrData:
          type: string
          description: QR code payload for verification
        validUntil:
          type: string
          format: date
        bloodGroup:
          type: string

    # ─── Procurement ───────────────────────────────────────────────────────────

    PurchaseOrder:
      type: object
      required: [id, tenantId, vendorId, status, totalPaise]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        poNumber:
          type: string
        vendorId:
          type: string
          format: uuid
        vendorName:
          type: string
        indentId:
          type: string
          format: uuid
        sanctionId:
          type: string
          format: uuid
        totalPaise:
          type: integer
          format: int64
        currency:
          type: string
        status:
          type: string
          enum: [draft, approved, issued, partially_received, completed, cancelled]
        lineItems:
          type: array
          items:
            type: object
            properties:
              itemId:
                type: string
                format: uuid
              description:
                type: string
              quantity:
                type: integer
              unitPricePaise:
                type: integer
                format: int64
              receivedQty:
                type: integer
        deliveryDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        version:
          type: integer

    CreatePurchaseOrderRequest:
      type: object
      required: [vendorId, indentId, lineItems]
      properties:
        vendorId:
          type: string
          format: uuid
        indentId:
          type: string
          format: uuid
        sanctionId:
          type: string
          format: uuid
        deliveryDate:
          type: string
          format: date
        lineItems:
          type: array
          minItems: 1
          items:
            type: object
            required: [itemId, quantity, unitPricePaise]
            properties:
              itemId:
                type: string
                format: uuid
              description:
                type: string
              quantity:
                type: integer
                minimum: 1
              unitPricePaise:
                type: integer
                format: int64
                minimum: 1

    Vendor:
      type: object
      required: [id, tenantId, name, gstin]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        gstin:
          type: string
          pattern: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}$"
        pan:
          type: string
        category:
          type: string
        rating:
          type: number
          minimum: 0
          maximum: 5
        address:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        bankAccount:
          type: object
          properties:
            accountNumber:
              type: string
            ifsc:
              type: string
            bankName:
              type: string
        status:
          type: string
          enum: [active, blacklisted, suspended]
        createdAt:
          type: string
          format: date-time

    GRN:
      type: object
      required: [id, purchaseOrderId, items]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        purchaseOrderId:
          type: string
          format: uuid
        grnNumber:
          type: string
        receivedDate:
          type: string
          format: date
        items:
          type: array
          items:
            type: object
            properties:
              itemId:
                type: string
                format: uuid
              orderedQty:
                type: integer
              receivedQty:
                type: integer
              acceptedQty:
                type: integer
              rejectedQty:
                type: integer
              rejectionReason:
                type: string
        status:
          type: string
          enum: [pending_inspection, accepted, partially_accepted, rejected]
        inspectedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    CreateGrnRequest:
      type: object
      required: [purchaseOrderId, items]
      properties:
        purchaseOrderId:
          type: string
          format: uuid
        challanNumber:
          type: string
        receivedDate:
          type: string
          format: date
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [itemId, receivedQty]
            properties:
              itemId:
                type: string
                format: uuid
              receivedQty:
                type: integer
                minimum: 1
              acceptedQty:
                type: integer
              rejectedQty:
                type: integer
              rejectionReason:
                type: string

    CreateIndentRequest:
      type: object
      required: [departmentId, items, purpose]
      properties:
        departmentId:
          type: string
          format: uuid
        budgetHeadId:
          type: string
          format: uuid
        purpose:
          type: string
          maxLength: 1000
        priority:
          type: string
          enum: [normal, urgent]
          default: normal
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [description, quantity, unit]
            properties:
              description:
                type: string
              quantity:
                type: integer
                minimum: 1
              unit:
                type: string
                examples: ["nos", "kg", "litre", "metre", "ream"]
              estimatedUnitPricePaise:
                type: integer
                format: int64

    # ─── Admin ─────────────────────────────────────────────────────────────────

    FeatureFlag:
      type: object
      required: [id, key, enabled]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: Unique flag key (dot-notation)
          examples: ["finance.gst_auto_calc", "hrms.geo_checkin"]
        enabled:
          type: boolean
        rolloutPercentage:
          type: integer
          minimum: 0
          maximum: 100
        targetRoles:
          type: array
          items:
            type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateFeatureFlagRequest:
      type: object
      required: [key, description]
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9_.]+$"
        description:
          type: string
          maxLength: 500
        enabled:
          type: boolean
          default: false
        rolloutPercentage:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
        targetRoles:
          type: array
          items:
            type: string

    Webhook:
      type: object
      required: [id, url, events, active]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
          description: Event types to deliver
          examples: [["bill.created", "payment.completed", "leave.approved"]]
        active:
          type: boolean
        secret:
          type: string
          description: HMAC secret (write-only, masked on read)
        lastDeliveredAt:
          type: string
          format: date-time
        failureCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    CreateWebhookRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          minItems: 1
          items:
            type: string
        secret:
          type: string
          description: HMAC signing secret for payload verification

    ScheduledJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        cronExpression:
          type: string
          examples: ["0 2 * * *"]
        enabled:
          type: boolean
        lastRunAt:
          type: string
          format: date-time
        nextRunAt:
          type: string
          format: date-time
        lastStatus:
          type: string
          enum: [success, failed, running, skipped]
        lastDurationMs:
          type: integer

    # ─── Citizen ───────────────────────────────────────────────────────────────

    CitizenRequest:
      type: object
      required: [id, type, subject, status]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        type:
          type: string
          enum: [grievance, rti, general, suggestion]
        subject:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [pending, in_progress, resolved, rejected, escalated]
        departmentId:
          type: string
          format: uuid
        assignedTo:
          type: string
          format: uuid
        acknowledgementNumber:
          type: string
          description: Public tracking number given to citizen
        filedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
        slaDeadline:
          type: string
          format: date-time

    CreateCitizenRequestBody:
      type: object
      required: [type, subject, description, departmentId]
      properties:
        type:
          type: string
          enum: [grievance, rti, general, suggestion]
        subject:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        departmentId:
          type: string
          format: uuid
        attachments:
          type: array
          items:
            type: string
            format: uri
          maxItems: 10

    # ─── Stock ─────────────────────────────────────────────────────────────────

    StockItem:
      type: object
      required: [id, name, barcode]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        barcode:
          type: string
        sku:
          type: string
        category:
          type: string
        unit:
          type: string
          examples: ["nos", "kg", "litre"]
        currentStock:
          type: integer
        reorderLevel:
          type: integer
        warehouseId:
          type: string
          format: uuid
        warehouseName:
          type: string
        valuationPaise:
          type: integer
          format: int64
          description: Current stock valuation in paise
        lastReceivedAt:
          type: string
          format: date-time

    # ─── Identity / SCIM 2.0 ──────────────────────────────────────────────────

    ScimServiceProviderConfig:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
          examples: [["urn:ietf:params:scim:schemas:core:2.0:ServiceProviderConfig"]]
        patch:
          type: object
          properties:
            supported:
              type: boolean
        bulk:
          type: object
          properties:
            supported:
              type: boolean
            maxOperations:
              type: integer
            maxPayloadSize:
              type: integer
        filter:
          type: object
          properties:
            supported:
              type: boolean
            maxResults:
              type: integer
        changePassword:
          type: object
          properties:
            supported:
              type: boolean
        sort:
          type: object
          properties:
            supported:
              type: boolean
        etag:
          type: object
          properties:
            supported:
              type: boolean
        authenticationSchemes:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              name:
                type: string
              description:
                type: string

    ScimUser:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
          examples: [["urn:ietf:params:scim:schemas:core:2.0:User"]]
        id:
          type: string
          format: uuid
        userName:
          type: string
          description: Email address (primary identifier)
        name:
          type: object
          properties:
            formatted:
              type: string
            givenName:
              type: string
            familyName:
              type: string
        emails:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
                format: email
              type:
                type: string
                examples: ["work"]
              primary:
                type: boolean
        active:
          type: boolean
          description: Whether the user can authenticate
        meta:
          type: object
          properties:
            resourceType:
              type: string
              examples: ["User"]
            created:
              type: string
              format: date-time
            lastModified:
              type: string
              format: date-time
            location:
              type: string
              description: Canonical URI of the resource

    ScimListResponse:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
          examples: [["urn:ietf:params:scim:api:messages:2.0:ListResponse"]]
        totalResults:
          type: integer
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
        Resources:
          type: array
          items:
            $ref: "#/components/schemas/ScimUser"

    ScimCreateUserRequest:
      type: object
      required: [userName]
      properties:
        schemas:
          type: array
          items:
            type: string
        userName:
          type: string
          description: Email address — primary login identifier
        name:
          type: object
          properties:
            formatted:
              type: string
            givenName:
              type: string
            familyName:
              type: string
        emails:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
                format: email
              type:
                type: string
              primary:
                type: boolean

    ScimReplaceUserRequest:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
        userName:
          type: string
          description: Email address
        name:
          type: object
          properties:
            formatted:
              type: string
            givenName:
              type: string
            familyName:
              type: string
        emails:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
                format: email
              type:
                type: string
              primary:
                type: boolean
        active:
          type: boolean
          description: Set false to disable/deprovision the user

    ScimPatchRequest:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
          examples: [["urn:ietf:params:scim:api:messages:2.0:PatchOp"]]
        Operations:
          type: array
          items:
            type: object
            required: [op]
            properties:
              op:
                type: string
                enum: [add, remove, replace]
              path:
                type: string
                description: "Target attribute (e.g. `active`, `userName`, `name.formatted`)"
              value:
                description: New value for the attribute

    # ─── Workflow — Decision Tables ─────────────────────────────────────────────

    DecisionTableInput:
      type: object
      required: [key, label, type]
      properties:
        key:
          type: string
          description: Unique key for the input (used in rule conditions)
          maxLength: 64
        label:
          type: string
          description: Human-readable label
          maxLength: 200
        type:
          type: string
          enum: [string, number, boolean]

    DecisionTableOutput:
      type: object
      required: [key, label, type]
      properties:
        key:
          type: string
          description: Unique key for the output
          maxLength: 64
        label:
          type: string
          description: Human-readable label
          maxLength: 200
        type:
          type: string
          enum: [string, number, boolean]
        defaultValue:
          description: Default value when no rule matches

    DecisionTableRule:
      type: object
      required: [inputs, outputs]
      properties:
        inputs:
          type: object
          additionalProperties:
            type: string
          description: Input conditions as key → expression string
        outputs:
          type: object
          additionalProperties: true
          description: Output values when this rule matches
        priority:
          type: integer
          description: Rule priority (lower = evaluated first within hit policy)

    DecisionTable:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        code:
          type: string
          description: Unique code within the tenant
          maxLength: 64
        name:
          type: string
          maxLength: 200
        hitPolicy:
          type: string
          enum: [first, collect, unique]
          description: |
            first — return the first matching rule's output.
            collect — return outputs from all matching rules.
            unique — exactly one rule must match (error if 0 or >1).
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/DecisionTableInput"
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/DecisionTableOutput"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/DecisionTableRule"
        status:
          type: string
          enum: [draft, active]
        version:
          type: integer
        createdBy:
          type: string
          format: uuid
        updatedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateDecisionTableRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          description: Unique code within the tenant
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 200
        hitPolicy:
          type: string
          enum: [first, collect, unique]
          default: first
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/DecisionTableInput"
          default: []
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/DecisionTableOutput"
          default: []
        rules:
          type: array
          items:
            $ref: "#/components/schemas/DecisionTableRule"
          default: []

    UpdateDecisionTableRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        hitPolicy:
          type: string
          enum: [first, collect, unique]
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/DecisionTableInput"
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/DecisionTableOutput"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/DecisionTableRule"

    ScimError:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
          examples: [["urn:ietf:params:scim:api:messages:2.0:Error"]]
        detail:
          type: string
          description: Human-readable error description
        status:
          type: string
          description: HTTP status code as string

    # ─── Workflow Analytics ─────────────────────────────────────────────────────

    WorkflowAnalyticsSummary:
      type: object
      properties:
        instancesByStatus:
          type: object
          additionalProperties:
            type: integer
          description: Count of instances grouped by status (active, completed, cancelled)
        totalInstances:
          type: integer
          description: Total workflow instances for the tenant
        avgCycleTimeSeconds:
          type: number
          nullable: true
          description: Average time (seconds) from instance creation to completion
        completedCount:
          type: integer
          description: Number of completed instances
        slaBreachRate:
          type: number
          description: Fraction of SLA-tracked tasks that breached (0.0 to 1.0)
        slaBreachedTasks:
          type: integer
          description: Number of tasks completed after their SLA due date
        slaTrackedTasks:
          type: integer
          description: Number of completed tasks that had an SLA due date
        escalations:
          type: integer
          description: Total escalation events across all tasks

    WorkflowBottlenecksReport:
      type: object
      properties:
        nodes:
          type: array
          items:
            type: object
            properties:
              nodeKey:
                type: string
                nullable: true
              avgDwellSeconds:
                type: number
                nullable: true
                description: Average time a task spent at this node before completion
              completedTasks:
                type: integer
              pendingTasks:
                type: integer
        pendingByRole:
          type: array
          items:
            type: object
            properties:
              roleRef:
                type: string
                nullable: true
              pendingTasks:
                type: integer

    WorkflowCycleTimeMetric:
      type: object
      properties:
        definitionCode:
          type: string
          nullable: true
          description: Workflow definition code
        definitionName:
          type: string
          nullable: true
          description: Workflow definition display name
        avgCycleTimeSeconds:
          type: number
          nullable: true
          description: Average cycle time in seconds
        minCycleTimeSeconds:
          type: number
          nullable: true
          description: Minimum cycle time in seconds
        maxCycleTimeSeconds:
          type: number
          nullable: true
          description: Maximum cycle time in seconds
        completedCount:
          type: integer
          description: Number of completed instances for this definition

    WorkflowAutomationRate:
      type: object
      properties:
        totalCompleted:
          type: integer
          description: Total completed tasks
        humanCompleted:
          type: integer
          description: Tasks completed by human actors
        autoCompleted:
          type: integer
          description: Tasks completed automatically (timers, call activities, SoD overrides)
        automationRatePct:
          type: number
          description: Percentage of tasks completed automatically (0.00 to 100.00)

    WorkflowSlaComplianceMetric:
      type: object
      properties:
        nodeKey:
          type: string
          nullable: true
          description: Workflow node key
        roleName:
          type: string
          nullable: true
          description: Role reference assigned to the tasks
        totalTracked:
          type: integer
          description: Number of completed tasks with an SLA due date
        withinSla:
          type: integer
          description: Tasks completed within SLA
        breached:
          type: integer
          description: Tasks completed after SLA
        compliancePct:
          type: number
          description: Percentage of tasks within SLA (0.00 to 100.00)

    WorkflowVersionComparison:
      type: object
      properties:
        version:
          type: integer
          description: Definition version number
        definitionId:
          type: string
          format: uuid
          description: Definition ID for this version
        avgCycleTimeSeconds:
          type: number
          nullable: true
          description: Average cycle time in seconds for this version
        completedCount:
          type: integer
          description: Number of completed instances for this version
        rejectionRate:
          type: number
          description: Percentage of instances that were cancelled/rejected (0.00 to 100.00)
        avgTasksPerInstance:
          type: number
          nullable: true
          description: Average number of tasks spawned per instance

    MessageSubscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        instanceId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        messageName:
          type: string
          description: The message name this subscription is waiting for
        correlationKey:
          type: string
          description: Correlation key used to match incoming messages
        nodeKey:
          type: string
          description: Workflow node that created this subscription
        status:
          type: string
          enum: [active, matched, timeout]
          description: Current subscription status
        timeoutAt:
          type: string
          format: date-time
          nullable: true
          description: When this subscription will expire if not matched
        matchedAt:
          type: string
          format: date-time
          nullable: true
          description: When the message was delivered (null if still waiting)
        createdAt:
          type: string
          format: date-time

    SignalSubscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        instanceId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        signalName:
          type: string
          description: The signal name this subscription is listening for
        nodeKey:
          type: string
          description: Workflow node that created this subscription
        status:
          type: string
          enum: [active, matched]
          description: Current subscription status
        matchedAt:
          type: string
          format: date-time
          nullable: true
          description: When the signal was received (null if still waiting)
        createdAt:
          type: string
          format: date-time

    # ─── Payroll F&F ───────────────────────────────────────────────────────────

    ComputeFnfRequest:
      type: object
      required:
        - employeeId
        - separationDate
        - separationType
        - employeeCategory
        - lastDrawnWagesMinor
        - completedYears
        - avgSalaryLast10MonthsMinor
        - leaveBalanceDays
        - taxRegime
        - salaryYtdMinor
        - tdsYtdMinor
        - fyStartYear
      properties:
        employeeId:
          type: string
          format: uuid
        separationDate:
          type: string
          format: date
          description: "YYYY-MM-DD"
        separationType:
          type: string
          enum: [retirement, superannuation, resignation, retrenchment, vrs, death]
        employeeCategory:
          type: string
          enum: [govt, non_govt_covered, non_govt_uncovered]
          description: |
            govt = Central/State government employee (gratuity fully exempt).
            non_govt_covered = Private sector covered by Payment of Gratuity Act.
            non_govt_uncovered = Private sector not covered by Gratuity Act.
        noticeBuyoutMinor:
          type: string
          default: "0"
          description: Notice period buyout amount in paise (fully taxable)
        leaveEncashmentGrossMinor:
          type: string
          default: "0"
          description: Leave encashment gross amount in paise (exempt under s.10(10AA))
        gratuityGrossMinor:
          type: string
          default: "0"
          description: Gratuity gross amount in paise (exempt under s.10(10))
        retrenchmentCompMinor:
          type: string
          default: "0"
          description: Retrenchment compensation in paise (exempt under s.10(10B))
        vrsCompMinor:
          type: string
          default: "0"
          description: VRS compensation in paise (exempt under s.10(10C))
        arrearsMinor:
          type: string
          default: "0"
          description: Salary arrears in paise (fully taxable)
        lastDrawnWagesMinor:
          type: string
          description: Last drawn monthly wages (basic + DA) in paise
        completedYears:
          type: integer
          minimum: 0
          description: Completed years of service
        avgSalaryLast10MonthsMinor:
          type: string
          description: Average monthly salary for last 10 months in paise
        leaveBalanceDays:
          type: integer
          minimum: 0
          description: Unused leave balance in days
        priorLeaveEncashExemptionMinor:
          type: string
          default: "0"
          description: Prior leave encashment exemption already claimed (in paise)
        remainingMonthsToRetirement:
          type: integer
          minimum: 0
          default: 0
          description: Months remaining until superannuation (for leave encashment ceiling)
        taxRegime:
          type: string
          enum: [old, new]
          description: Income tax regime (old regime with deductions or new simplified regime)
        salaryYtdMinor:
          type: string
          description: Year-to-date salary income in paise (for total income computation)
        tdsYtdMinor:
          type: string
          description: TDS already deducted year-to-date in paise
        deductions80cMinor:
          type: string
          default: "0"
          description: Section 80C deductions in paise (old regime only)
        deductions80dMinor:
          type: string
          default: "0"
          description: Section 80D deductions in paise (old regime only)
        otherDeductionsMinor:
          type: string
          default: "0"
          description: Other Chapter VI-A deductions in paise (old regime only)
        fyStartYear:
          type: integer
          description: Financial year start year (e.g. 2024 for FY 2024-25)

    FnfSettlement:
      type: object
      description: Persisted F&F settlement computation result
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
          nullable: true
        separationType:
          type: string
          enum: [retirement, superannuation, resignation, retrenchment, vrs, death]
        separationDate:
          type: string
          format: date
        employeeCategory:
          type: string
          enum: [govt, non_govt_covered, non_govt_uncovered]
        noticeBuyoutMinor:
          type: string
          description: Paise
        leaveEncashmentGrossMinor:
          type: string
        gratuityGrossMinor:
          type: string
        retrenchmentCompMinor:
          type: string
        vrsCompMinor:
          type: string
        arrearsMinor:
          type: string
        gratuityExemptMinor:
          type: string
          description: Exempt portion of gratuity (s.10(10))
        leaveEncashExemptMinor:
          type: string
          description: Exempt portion of leave encashment (s.10(10AA))
        retrenchmentExemptMinor:
          type: string
          description: Exempt portion of retrenchment comp (s.10(10B))
        vrsExemptMinor:
          type: string
          description: Exempt portion of VRS comp (s.10(10C))
        totalTaxableMinor:
          type: string
          description: Total taxable amount on separation in paise
        tdsOnSeparationMinor:
          type: string
          description: TDS computed on the separation package in paise
        netPayableMinor:
          type: string
          description: Net amount payable to employee in paise
        computationDetail:
          type: object
          additionalProperties: true
          description: Full breakdown JSON (slab computation, exemption details)
        status:
          type: string
          enum: [draft, approved, paid]
        currency:
          type: string
          default: INR
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        updatedBy:
          type: string
          format: uuid
        version:
          type: integer

    FnfTaxBreakdown:
      type: object
      description: On-the-fly F&F tax computation result (not persisted)
      properties:
        totalGrossMinor:
          type: string
          description: Total gross separation package in paise
        totalExemptMinor:
          type: string
          description: Total exempt amount in paise
        totalTaxableOnSeparationMinor:
          type: string
          description: Taxable portion of separation components in paise
        annualTaxableMinor:
          type: string
          description: Annual taxable income (salary YTD + separation taxable) in paise
        annualTaxMinor:
          type: string
          description: Annual tax computed on total income in paise
        tdsAlreadyDeductedMinor:
          type: string
          description: TDS already deducted year-to-date in paise
        tdsOnSeparationMinor:
          type: string
          description: Incremental TDS to deduct on separation in paise
        netPayableMinor:
          type: string
          description: Net payable (gross - TDS on separation) in paise
        gratuityExemption:
          type: object
          properties:
            exemptMinor:
              type: string
            taxableMinor:
              type: string
        leaveEncashExemption:
          type: object
          properties:
            exemptMinor:
              type: string
            taxableMinor:
              type: string
        retrenchmentExemption:
          type: object
          nullable: true
          properties:
            exemptMinor:
              type: string
            taxableMinor:
              type: string
        vrsExemption:
          type: object
          nullable: true
          properties:
            exemptMinor:
              type: string
            taxableMinor:
              type: string

    # ─── Analytics Query Schemas ──────────────────────────────────────────────

    AnalyticsQueryRequest:
      type: object
      required: [metrics]
      properties:
        metrics:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            enum: [event_count, amount_sum, amount_avg, amount_max, amount_min]
          description: Metrics to aggregate (whitelisted keys only)
        dimensions:
          type: array
          maxItems: 4
          items:
            type: string
            enum: [source, event_type, category, status]
          default: []
          description: Dimensions to group by (whitelisted keys only)
        filters:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/AnalyticsFilter"
          default: []
          description: Filter conditions on whitelisted fields
        dateFrom:
          type: string
          format: date-time
          description: ISO 8601 lower date bound (inclusive)
        dateTo:
          type: string
          format: date-time
          description: ISO 8601 upper date bound (inclusive)
        joins:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/AnalyticsJoinCondition"
          default: []
          description: Cross-table join conditions (max 3 per query)
        calculatedFields:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/AnalyticsCalculatedField"
          default: []
          description: Calculated fields via structured expression language (max 10)
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
          description: Row limit (capped at 1000 for join queries)

    AnalyticsFilter:
      type: object
      required: [field, op, value]
      properties:
        field:
          type: string
          enum: [source, event_type, category, status, amount, occurred_at]
          description: Whitelisted filter field key
        op:
          type: string
          enum: [eq, neq, gt, gte, lt, lte, in]
          description: Comparison operator
        value:
          oneOf:
            - type: string
              maxLength: 256
            - type: number
            - type: boolean
            - type: array
              maxItems: 100
              items:
                oneOf:
                  - type: string
                    maxLength: 256
                  - type: number
          description: Filter value (scalar or array for 'in' operator)

    AnalyticsJoinCondition:
      type: object
      required: [leftKey, rightKey]
      properties:
        leftKey:
          type: string
          minLength: 1
          maxLength: 64
          description: Left-side column key (must be whitelisted)
        rightKey:
          type: string
          minLength: 1
          maxLength: 64
          description: Right-side column key (must be whitelisted)
        type:
          type: string
          enum: [inner, left]
          default: inner
          description: Join type

    AnalyticsCalculatedField:
      type: object
      required: [alias, expression]
      properties:
        alias:
          type: string
          minLength: 1
          maxLength: 64
          description: Output column name for this calculated field
        expression:
          $ref: "#/components/schemas/CalcExpression"
          description: Structured expression (serialized JSON max 500 chars)

    CalcExpression:
      type: object
      required: [op, left, right]
      description: |
        Arithmetic expression node. Only whitelisted operators (add, subtract,
        multiply, divide) and column keys are allowed. Max depth 5.
      properties:
        op:
          type: string
          enum: [add, subtract, multiply, divide]
          description: Arithmetic operator
        left:
          $ref: "#/components/schemas/CalcOperand"
        right:
          $ref: "#/components/schemas/CalcOperand"

    CalcOperand:
      description: An operand in a calculated field expression
      oneOf:
        - type: object
          required: [type, key]
          properties:
            type:
              type: string
              enum: [column]
            key:
              type: string
              minLength: 1
              maxLength: 64
              description: Whitelisted column key
        - type: object
          required: [type, value]
          properties:
            type:
              type: string
              enum: [literal]
            value:
              type: number
              description: Finite numeric literal
        - type: object
          required: [type, expr]
          properties:
            type:
              type: string
              enum: [expression]
            expr:
              $ref: "#/components/schemas/CalcExpression"

    AnalyticsQueryResult:
      type: object
      properties:
        data:
          type: object
          properties:
            rows:
              type: array
              items:
                type: object
                additionalProperties:
                  oneOf:
                    - type: string
                    - type: number
                    - type: "null"
              description: Result rows (key-value maps of metric/dimension/calc values)
            rowCount:
              type: integer
              description: Number of rows returned
            metrics:
              type: array
              items:
                type: string
              description: Metric keys included in the result
            dimensions:
              type: array
              items:
                type: string
              description: Dimension keys used for grouping
            calculatedFields:
              type: array
              items:
                type: string
              description: Calculated field aliases in the result

    DrillThroughResult:
      type: object
      properties:
        data:
          type: object
          properties:
            rows:
              type: array
              items:
                type: object
                additionalProperties:
                  oneOf:
                    - type: string
                    - type: number
                    - type: "null"
              description: Detail rows underlying the aggregated cell
            rowCount:
              type: integer
              description: Number of detail rows returned
            reportId:
              type: string
              format: uuid
              description: The report/query run ID
            cellId:
              type: string
              description: The cell identifier that was drilled into

    # ─── Meeting Service ───────────────────────────────────────────────────────

    MeetingState:
      type: string
      description: Meeting lifecycle state (Req 1.1)
      enum:
        - draft
        - scheduled
        - agenda_locked
        - in_progress
        - adjourned
        - minutes_pending
        - minutes_approved
        - closed
        - archived
        - cancelled

    MeetingType:
      type: string
      description: Meeting classification (Req 1.2)
      enum: [committee, board, departmental, ad_hoc, statutory]

    ConfidentialityLevel:
      type: string
      description: 5-level confidentiality model
      enum: [public, internal, confidential, secret, top_secret]

    SeriesPattern:
      type: string
      description: Recurring meeting-series pattern
      enum: [weekly, fortnightly, monthly, quarterly, half_yearly, annual]

    MeetingTypeFrequency:
      type: string
      description: Statutory meeting-frequency obligation
      enum: [weekly, fortnightly, monthly, quarterly, half_yearly, annual, ad_hoc]

    MeetingAcceptedResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, status, correlationId]
          properties:
            id:
              type: string
              format: uuid
              description: The meeting / series / meeting-type id the client can poll
            status:
              type: string
              enum: [accepted]
            correlationId:
              type: string
              description: Request correlation ID for tracing

    CreateMeetingRequest:
      type: object
      required: [title, type, scheduledAt, durationMinutes, chairpersonId, secretaryId]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        type:
          $ref: "#/components/schemas/MeetingType"
        description:
          type: string
          maxLength: 20000
        scheduledAt:
          type: string
          format: date-time
          description: ISO 8601 with timezone offset
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        committeeId:
          type: string
          format: uuid
        chairpersonId:
          type: string
          format: uuid
        secretaryId:
          type: string
          format: uuid
        convenerId:
          type: string
          format: uuid
        venue:
          type: string
          maxLength: 1000
        vcEnabled:
          type: boolean
        confidentialityLevel:
          $ref: "#/components/schemas/ConfidentialityLevel"
        fileReference:
          type: string
          maxLength: 200

    MeetingPatch:
      type: object
      minProperties: 1
      description: |
        Editable meeting fields. `status` is intentionally excluded — status changes flow
        through the transition endpoint. Nullable fields may be cleared by sending `null`.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
          maxLength: 20000
          nullable: true
        type:
          $ref: "#/components/schemas/MeetingType"
        committeeId:
          type: string
          format: uuid
          nullable: true
        chairpersonId:
          type: string
          format: uuid
        secretaryId:
          type: string
          format: uuid
        convenerId:
          type: string
          format: uuid
          nullable: true
        scheduledAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        venue:
          type: string
          maxLength: 1000
          nullable: true
        vcEnabled:
          type: boolean
        vcLink:
          type: string
          format: uri
          maxLength: 2000
          nullable: true
        confidentialityLevel:
          $ref: "#/components/schemas/ConfidentialityLevel"
        fileReference:
          type: string
          maxLength: 200
          nullable: true

    UpdateMeetingRequest:
      type: object
      required: [version, patch]
      properties:
        version:
          type: integer
          minimum: 0
          description: Optimistic-lock version (must match current)
        patch:
          $ref: "#/components/schemas/MeetingPatch"

    TransitionMeetingRequest:
      type: object
      required: [version, to]
      properties:
        version:
          type: integer
          minimum: 0
        to:
          $ref: "#/components/schemas/MeetingState"
        reason:
          type: string
          maxLength: 2000
          description: Required for adjournment/cancellation-style transitions (audit log)
        nextMeetingDate:
          type: string
          format: date-time
          description: Optionally accompanies an adjournment (Req 1.5)

    CancelMeetingRequest:
      type: object
      required: [version, reason]
      properties:
        version:
          type: integer
          minimum: 0
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: Cancellation reason, recorded in the transition audit log

    CreateMeetingTypeRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Tenant-unique short key
        name:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
          maxLength: 20000
        templateConfig:
          type: object
          additionalProperties: true
          description: Minutes/agenda template shape (opaque JSON)
        isStatutory:
          type: boolean
        frequency:
          $ref: "#/components/schemas/MeetingTypeFrequency"

    CreateMeetingSeriesRequest:
      type: object
      required: [committeeId, pattern, startDate]
      properties:
        committeeId:
          type: string
          format: uuid
        pattern:
          $ref: "#/components/schemas/SeriesPattern"
        startDate:
          type: string
          format: date
          description: ISO calendar date (YYYY-MM-DD)
        endDate:
          type: string
          format: date
          description: On or after startDate
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: 0=Sun … 6=Sat (weekly/fortnightly patterns)
        dayOfMonth:
          type: integer
          minimum: 1
          maximum: 31
          description: Day of month (monthly+ patterns)
        timeOfDay:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Wall-clock start HH:MM (24h)
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 1440

    UpdateMeetingSeriesRequest:
      type: object
      minProperties: 1
      description: |
        Series patch — all fields optional; at least one must be supplied. The optional
        top-level `version` is used for optimistic locking (falls back to the current version).
      properties:
        version:
          type: integer
          minimum: 0
        pattern:
          $ref: "#/components/schemas/SeriesPattern"
        endDate:
          type: string
          format: date
          nullable: true
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          nullable: true
        dayOfMonth:
          type: integer
          minimum: 1
          maximum: 31
          nullable: true
        timeOfDay:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          nullable: true
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        isActive:
          type: boolean

    GenerateMeetingSeriesRequest:
      type: object
      required: [upToDate]
      properties:
        upToDate:
          type: string
          format: date
          description: Materialize concrete instances up to this date (inclusive)

    Meeting:
      type: object
      description: A meeting entity (meeting-core). Fields mirror the meetings table.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/MeetingType"
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/MeetingState"
        committeeId:
          type: string
          format: uuid
          nullable: true
        chairpersonId:
          type: string
          format: uuid
          nullable: true
        secretaryId:
          type: string
          format: uuid
          nullable: true
        convenerId:
          type: string
          format: uuid
          nullable: true
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        actualStartAt:
          type: string
          format: date-time
          nullable: true
        actualEndAt:
          type: string
          format: date-time
          nullable: true
        durationMinutes:
          type: integer
        venue:
          type: string
          nullable: true
        vcEnabled:
          type: boolean
        vcLink:
          type: string
          nullable: true
        confidentialityLevel:
          $ref: "#/components/schemas/ConfidentialityLevel"
        seriesId:
          type: string
          format: uuid
          nullable: true
        quorumEstablished:
          type: boolean
        meetingNumber:
          type: string
          nullable: true
        financialYear:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        updatedBy:
          type: string
          format: uuid
        version:
          type: integer

    MeetingResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Meeting"

    MeetingListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        meta:
          type: object
          properties:
            page:
              type: integer
            pageSize:
              type: integer
            total:
              type: integer

    MeetingTransition:
      type: object
      description: A single state-transition audit-log entry
      properties:
        id:
          type: string
          format: uuid
        meetingId:
          type: string
          format: uuid
        fromState:
          $ref: "#/components/schemas/MeetingState"
        toState:
          $ref: "#/components/schemas/MeetingState"
        reason:
          type: string
          nullable: true
        actorId:
          type: string
          format: uuid
        transitionedAt:
          type: string
          format: date-time

    MeetingTransitionLogResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MeetingTransition"

    MeetingDashboardResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: true
          description: Role-scoped dashboard projection (shape depends on repo query)

    # ─── Inspection Service — Mobile Sync (SVC-102) ─────────────────────────

    ChunkedUploadRequest:
      type: object
      required: [evidenceId, inspectionId, deviceId, totalSizeBytes, sha256, mimeType, chunkIndex, totalChunks, capturedAt]
      properties:
        evidenceId:
          type: string
          format: uuid
          description: Evidence artifact identifier
        inspectionId:
          type: string
          format: uuid
          description: Parent inspection identifier
        deviceId:
          type: string
          minLength: 1
          description: Unique device identifier
        totalSizeBytes:
          type: integer
          minimum: 1
          description: Total file size in bytes
        sha256:
          type: string
          minLength: 1
          description: SHA-256 hash of the complete file
        mimeType:
          type: string
          minLength: 1
          description: MIME type of the evidence file (JPEG, PNG, PDF, MP4, HEIC)
        chunkIndex:
          type: integer
          minimum: 0
          description: Zero-based index of this chunk
        totalChunks:
          type: integer
          minimum: 1
          description: Total number of chunks for the file
        capturedAt:
          type: string
          description: ISO 8601 timestamp of when the evidence was captured
        gpsLatitude:
          type: number
          nullable: true
          description: Capture latitude (optional)
        gpsLongitude:
          type: number
          nullable: true
          description: Capture longitude (optional)

    ChunkedUploadResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [progressToken, chunksReceived, totalChunks, complete]
          properties:
            progressToken:
              type: string
              description: Token to track upload progress (message ID)
            chunksReceived:
              type: integer
              description: Number of chunks received so far
            totalChunks:
              type: integer
              description: Total chunks expected
            complete:
              type: boolean
              description: Whether all chunks have been received

    PartialResponseRequest:
      type: object
      required: [instanceId, inspectorId, deviceId, responses, savedAt, completionPercent]
      properties:
        instanceId:
          type: string
          format: uuid
          description: Checklist instance identifier
        inspectorId:
          type: string
          format: uuid
          description: Inspector user identifier
        deviceId:
          type: string
          minLength: 1
          description: Unique device identifier
        responses:
          type: object
          additionalProperties:
            type: object
            required: [value, answeredAt, deviceTimestamp]
            properties:
              value:
                description: The response value (type depends on question field type)
              answeredAt:
                type: string
                description: ISO 8601 timestamp of when the response was given
              deviceTimestamp:
                type: number
                description: Unix epoch milliseconds from device clock
              gpsLatitude:
                type: number
                nullable: true
                description: GPS latitude at time of response (optional)
              gpsLongitude:
                type: number
                nullable: true
                description: GPS longitude at time of response (optional)
          description: Map of questionId to response data
        savedAt:
          type: string
          description: ISO 8601 timestamp of when the partial save was triggered
        completionPercent:
          type: number
          minimum: 0
          maximum: 100
          description: Percentage of checklist completed (0-100)

    PartialResponseResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accepted, instanceId, savedAt, completionPercent, messageId]
          properties:
            accepted:
              type: boolean
              description: Whether the partial save was accepted
            instanceId:
              type: string
              format: uuid
              description: Checklist instance identifier
            savedAt:
              type: string
              description: Echoed savedAt timestamp from the request
            completionPercent:
              type: number
              description: Echoed completion percentage
            messageId:
              type: string
              description: Queue message ID for tracking

    SyncPackageManifestResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [packageId, generatedAt, totalSizeBytes, items]
          properties:
            packageId:
              type: string
              format: uuid
              description: Sync package identifier
            generatedAt:
              type: string
              format: date-time
              description: When the package was generated
            totalSizeBytes:
              type: integer
              description: Total size of the package in bytes
            items:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    description: Item type (inspection, checklist, entity, map_tile)
                  id:
                    type: string
                    format: uuid
                  sizeBytes:
                    type: integer
              description: List of items included in the package

    # ─── CDP (Customer Data Platform) ────────────────────────────────────────

    CdpListMeta:
      type: object
      description: Offset-based pagination envelope used by all cdp-service list routes.
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
          description: 1-based page number derived from offset/limit
        pageSize:
          type: integer
        total:
          type: integer

    CdpProfile:
      type: object
      description: |
        A golden (unified) profile. `attributes` is free-form per tenant;
        `attributes.consent` holds the DPDP consent flags consulted during
        event ingestion. A profile absorbed by a merge carries
        `profileType: merged` and is excluded from all read routes.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        profileType:
          type: string
          example: individual
        attributes:
          type: object
          additionalProperties: true
        sourceLineage:
          type: array
          description: Append-only provenance trail — never rewritten on update
          items:
            $ref: "#/components/schemas/CdpSourceLineageEntry"
        mergedFromIds:
          type: array
          items:
            type: string
            format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer

    CdpSourceLineageEntry:
      type: object
      required: [source, sourceId, timestamp]
      properties:
        source:
          type: string
          description: Originating system
          example: crm
        sourceId:
          type: string
          description: Record id in the originating system
        timestamp:
          type: string
          format: date-time

    CreateCdpProfileRequest:
      type: object
      properties:
        profileType:
          type: string
          minLength: 1
          maxLength: 32
          default: individual
        attributes:
          type: object
          additionalProperties: true
          default: {}
        sourceLineage:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/CdpSourceLineageEntry"

    UpdateCdpProfileRequest:
      type: object
      required: [version]
      properties:
        attributes:
          type: object
          additionalProperties: true
          description: Shallow-merged over the stored attributes
        profileType:
          type: string
          minLength: 1
          maxLength: 32
        sourceLineage:
          type: array
          description: Appended to the existing lineage
          items:
            $ref: "#/components/schemas/CdpSourceLineageEntry"
        version:
          type: integer
          minimum: 1
          description: Current version — mismatch returns 409 VERSION_CONFLICT

    CdpEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        profileId:
          type: string
          format: uuid
        eventType:
          type: string
        payload:
          type: object
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time
          description: When the interaction happened (client-supplied)
        ingestedAt:
          type: string
          format: date-time
          description: When cdp-service persisted it

    IngestCdpEventRequest:
      type: object
      required: [profileId, eventType, occurredAt]
      properties:
        profileId:
          type: string
          format: uuid
        eventType:
          type: string
          minLength: 1
          maxLength: 128
        payload:
          type: object
          additionalProperties: true
          default: {}
        occurredAt:
          type: string
          format: date-time

    CdpBatchIngestResult:
      type: object
      properties:
        ingested:
          type: integer
        rejected:
          type: integer
        results:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                description: Position in the submitted `events` array
              id:
                type: string
                description: Event id when ingested, empty string when rejected
              status:
                type: string
                enum: [ingested, rejected]
              reason:
                type: string
                description: Present on rejection (profile not found / consent denied)

    CdpResolveResult:
      type: object
      properties:
        profileId:
          type: string
          format: uuid
          nullable: true
          description: Null when ambiguous or not found
        confidence:
          type: number
          format: float
          description: 0–1. Capped below the auto-match threshold when ambiguous
        matched:
          type: boolean
        status:
          type: string
          enum: [matched, ambiguous, created, not_found]
        candidates:
          type: array
          description: Present only when status is `ambiguous`
          items:
            type: object
            properties:
              profileId:
                type: string
                format: uuid
              confidence:
                type: number
                format: float

    CdpIdentityLink:
      type: object
      description: One identity-graph edge. Raw identifier values are never returned.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        profileId:
          type: string
          format: uuid
        identifierType:
          type: string
          example: email
        identifierHash:
          type: string
          description: Salted hash of (type, value)
        confidence:
          type: string
          description: Numeric confidence serialized as a string
        createdAt:
          type: string
          format: date-time

    CdpSegmentCriteria:
      type: object
      description: |
        Criteria tree for a dynamic segment. `field` addresses either a
        top-level profile column (`profileType`) or a JSONB attribute path
        (`attributes.city`).
      properties:
        logic:
          type: string
          enum: [and, or]
        conditions:
          type: array
          items:
            type: object
            required: [field, operator, value]
            properties:
              field:
                type: string
                example: attributes.city
              operator:
                type: string
                enum: [eq, neq, gt, gte, lt, lte, contains, in]
              value:
                description: Scalar, or an array when operator is `in`

    CdpSegment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        segmentType:
          type: string
          enum: [dynamic, static]
        criteria:
          $ref: "#/components/schemas/CdpSegmentCriteria"
        status:
          type: string
          enum: [active, paused, archived]
        memberCount:
          type: integer
          description: Recomputed from criteria at read time for dynamic segments
        isArchived:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer

    CdpMergeCandidate:
      type: object
      description: |
        A queued merge candidate raised by an ambiguous identity resolution.
        Resolution is manual — cdp-service never auto-merges an ambiguous match.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        sourceProfileId:
          type: string
          format: uuid
          description: Proposed winner
        targetProfileId:
          type: string
          format: uuid
          description: Proposed loser
        confidence:
          type: string
          description: Numeric confidence serialized as a string
        matchReason:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        decidedBy:
          type: string
          format: uuid
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
        decisionReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    # ─── Catalogue (Product Catalogue) ────────────────────────────────────────

    CatalogueListMeta:
      type: object
      description: Offset-based pagination metadata returned by catalogue list endpoints.
      properties:
        page:
          type: integer
          description: 1-based page number derived from offset / limit
        pageSize:
          type: integer
        total:
          type: integer

    CatalogueLifecycleStatus:
      type: string
      description: |
        Product lifecycle state. Transitions are validated server-side; an
        illegal transition is rejected with 422 `INVALID_TRANSITION`.
      enum: [draft, active, suspended, withdrawn, closed_to_new_business]

    CatalogueProduct:
      type: object
      description: |
        A catalogue product. The 4-level hierarchy is expressed by `lineId`
        (level 1), `familyId` (level 2), and `parentId` (direct parent for
        sub-products and variants).
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
          nullable: true
        lineId:
          type: string
          format: uuid
          nullable: true
          description: Level-1 grouping — product line (e.g. Savings, Loans, Insurance)
        familyId:
          type: string
          format: uuid
          nullable: true
          description: Level-2 grouping — product family within a line
        parentId:
          type: string
          format: uuid
          nullable: true
          description: Direct parent for sub-products / variants
        lifecycleStatus:
          $ref: "#/components/schemas/CatalogueLifecycleStatus"
        effectiveFrom:
          type: string
          format: date
          nullable: true
        effectiveTo:
          type: string
          format: date
          nullable: true
        regulatoryMetadata:
          type: object
          additionalProperties: true
          description: Free-form regulatory attributes (circular refs, IRDAI/RBI product codes, etc.)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        updatedBy:
          type: string
          format: uuid
        version:
          type: integer
          description: Optimistic-lock version

    CatalogueProductTreeNode:
      type: object
      description: |
        One node of the product hierarchy tree. `level` is derived from the
        node's depth, not stored on the row.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        lifecycleStatus:
          $ref: "#/components/schemas/CatalogueLifecycleStatus"
        level:
          type: string
          enum: [line, family, product, variant]
        children:
          type: array
          items:
            $ref: "#/components/schemas/CatalogueProductTreeNode"

    CreateCatalogueProductRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        lineId:
          type: string
          format: uuid
        familyId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
        lifecycleStatus:
          allOf:
            - $ref: "#/components/schemas/CatalogueLifecycleStatus"
          default: draft
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
        regulatoryMetadata:
          type: object
          additionalProperties: true
          default: {}

    UpdateCatalogueProductRequest:
      type: object
      description: |
        Partial update. Nullable fields accept `null` to clear the value.
        Metadata changes are rejected with 422 `NOT_EDITABLE` when the product
        is not in an editable lifecycle status.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        lineId:
          type: string
          format: uuid
          nullable: true
        familyId:
          type: string
          format: uuid
          nullable: true
        parentId:
          type: string
          format: uuid
          nullable: true
        lifecycleStatus:
          $ref: "#/components/schemas/CatalogueLifecycleStatus"
        effectiveFrom:
          type: string
          format: date
          nullable: true
        effectiveTo:
          type: string
          format: date
          nullable: true
        regulatoryMetadata:
          type: object
          additionalProperties: true
        version:
          type: integer
          minimum: 1
          description: |
            Optional optimistic-lock guard. When omitted the row's current
            version is used, so a concurrent write can still be lost — supply it
            for read-modify-write flows.

    SetProductAvailabilityRequest:
      type: object
      description: |
        Geographic availability entry. All scope fields are optional; omitting
        all three records tenant-wide availability for the product.
      properties:
        circleId:
          type: string
          format: uuid
        regionId:
          type: string
          format: uuid
        officeId:
          type: string
          format: uuid
        available:
          type: boolean
          default: true

    # ─── Loyalty (Programs, Enrolments, Points) ───────────────────────────────

    LoyaltyListMeta:
      type: object
      description: Offset-based pagination metadata returned by loyalty list endpoints.
      properties:
        page:
          type: integer
          description: 1-based page number derived from offset / limit
        pageSize:
          type: integer
        total:
          type: integer

    LoyaltyEnrolmentStatus:
      type: string
      description: |
        Enrolment lifecycle state. `active` ⇄ `suspended` are reversible;
        `cancelled` is terminal. Illegal transitions are rejected with 422
        `INVALID_TRANSITION`.
      enum: [active, suspended, cancelled]

    LoyaltyEnrolment:
      type: object
      description: |
        A profile's membership of one loyalty program. Point columns are
        `bigint` in the database and are serialized as decimal **strings** so
        values above 2^53 survive JSON round-tripping.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        programId:
          type: string
          format: uuid
        profileId:
          type: string
          format: uuid
          description: CDP golden profile id (cross-service reference, no FK)
        status:
          $ref: "#/components/schemas/LoyaltyEnrolmentStatus"
        tier:
          type: string
          maxLength: 50
          description: Current tier name (maintained by the tier evaluation engine)
        pointsBalance:
          type: string
          description: Spendable points balance (bigint as string)
          examples: ["500"]
        lifetimePoints:
          type: string
          description: Cumulative points ever accrued, drives tier evaluation (bigint as string)
          examples: ["1000"]
        enrolledAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          description: Optimistic-lock version

    EnrolLoyaltyMemberRequest:
      type: object
      required: [programId, profileId]
      properties:
        programId:
          type: string
          format: uuid
          description: Target program — must exist and be `active`
        profileId:
          type: string
          format: uuid
          description: CDP golden profile to enrol
        tier:
          type: string
          maxLength: 50
          default: base
          description: Starting tier; defaults to the entry tier

    UpdateLoyaltyEnrolmentStatusRequest:
      type: object
      required: [status, version]
      properties:
        status:
          $ref: "#/components/schemas/LoyaltyEnrolmentStatus"
        version:
          type: integer
          minimum: 1
          description: |
            Current version of the enrolment. A mismatch returns 409
            `VERSION_CONFLICT` rather than silently overwriting.

    # ─── Catalogue (Rates & Bundles) ──────────────────────────────────────────

    CatalogueRate:
      type: object
      description: |
        An effective-dated rate for a product. `rateValue` is a `bigint` in
        **minor units** (paise/cents) and is serialized as a decimal **string**
        so values above 2^53 survive JSON round-tripping — never parse it as a
        float.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        effectiveDate:
          type: string
          format: date
          description: Start of the effective period (inclusive)
        effectiveTo:
          type: string
          format: date
          nullable: true
          description: End of the effective period (inclusive); `null` = open-ended
        rateValue:
          type: string
          description: Rate in minor units (bigint as string)
          examples: ["5000"]
        source:
          type: string
          maxLength: 128
          description: Provenance of the rate (e.g. an RBI circular reference)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        updatedBy:
          type: string
          format: uuid
        version:
          type: integer
          description: Optimistic-lock version

    CreateCatalogueRateRequest:
      type: object
      required: [productId, effectiveFrom, rateValueMinor, source]
      properties:
        productId:
          type: string
          format: uuid
        effectiveFrom:
          type: string
          format: date
          description: Start of the effective period (inclusive), YYYY-MM-DD
        effectiveTo:
          type: string
          format: date
          description: End of the effective period (inclusive); omit for open-ended
        rateValueMinor:
          type: string
          description: |
            Rate in minor units (paise/cents) as a decimal string. A JSON number
            is also coerced, but a string is required to stay precise above 2^53.
          examples: ["5000"]
        source:
          type: string
          minLength: 1
          maxLength: 128

    UpdateCatalogueRateRequest:
      type: object
      description: |
        Partial update. `effectiveTo` accepts `null` to re-open the period.
      properties:
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
          nullable: true
        rateValueMinor:
          type: string
          description: Rate in minor units (bigint as string)
          examples: ["9999"]
        source:
          type: string
          minLength: 1
          maxLength: 128
        version:
          type: integer
          minimum: 1
          description: |
            Optional optimistic-lock guard. When omitted the row's current
            version is used, so a concurrent write can still be lost — supply it
            for read-modify-write flows.

    CatalogueBundleStatus:
      type: string
      description: |
        Bundle status. `deleted` is set by the soft-delete route; rows are never
        hard-deleted.
      enum: [active, inactive, deleted]

    CatalogueBundle:
      type: object
      description: A bundle of catalogue products offered together.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
          nullable: true
        componentProductIds:
          type: array
          description: Ids of the component products, in the order supplied
          items:
            type: string
            format: uuid
        pricingApprovalRequired:
          type: boolean
          description: Whether bundle pricing needs a separate approval step
        status:
          $ref: "#/components/schemas/CatalogueBundleStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        updatedBy:
          type: string
          format: uuid
        version:
          type: integer
          description: Optimistic-lock version

    CatalogueBundleDetail:
      allOf:
        - $ref: "#/components/schemas/CatalogueBundle"
        - type: object
          description: |
            Single-bundle read shape — the component product rows resolved from
            `componentProductIds`, so a client does not need a second call.
          properties:
            components:
              type: array
              items:
                $ref: "#/components/schemas/CatalogueProduct"

    CreateCatalogueBundleRequest:
      type: object
      required: [name, componentProductIds]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        componentProductIds:
          type: array
          minItems: 1
          description: At least one component product; every one must be `active`
          items:
            type: string
            format: uuid
        pricingApprovalRequired:
          type: boolean
          default: false

    UpdateCatalogueBundleRequest:
      type: object
      description: |
        Partial update. Supplying `componentProductIds` replaces the whole set and
        re-runs component validation.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        componentProductIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        pricingApprovalRequired:
          type: boolean
        status:
          type: string
          enum: [active, inactive]
          description: |
            Only `active` / `inactive` may be set here — `deleted` is reached
            through the DELETE route.
        version:
          type: integer
          minimum: 1
          description: |
            Optional optimistic-lock guard. When omitted the row's current
            version is used.

    # ─── Loyalty (Programs, Points, Tiers) ────────────────────────────────────

    LoyaltyProgramStatus:
      type: string
      description: |
        Program lifecycle state. Allowed transitions:
        `draft → active | archived`, `active → suspended | archived`,
        `suspended → active | archived`; `archived` is terminal. Only `draft` and
        `active` programs are editable.
      enum: [draft, active, suspended, archived]

    LoyaltyProgram:
      type: object
      description: |
        A loyalty program. `earnRatio` is a `bigint` (points per ₹1) serialized
        as a decimal **string**.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        status:
          $ref: "#/components/schemas/LoyaltyProgramStatus"
        earnRatio:
          type: string
          description: Points earned per ₹1 / 100 paise (bigint as string)
          examples: ["100"]
        expiryDays:
          type: integer
          nullable: true
          description: Days until accrued points expire; `null` = never expire
        tierConfig:
          type: object
          additionalProperties: true
          description: Free-form tier configuration for the program
        version:
          type: integer
          description: Optimistic-lock version
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateLoyaltyProgramRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        earnRatio:
          type: integer
          minimum: 1
          default: 100
          description: Points earned per ₹1 / 100 paise; stored as a bigint
        expiryDays:
          type: integer
          minimum: 1
          description: Days until accrued points expire; omit for no expiry
        tierConfig:
          type: object
          additionalProperties: true

    UpdateLoyaltyProgramRequest:
      type: object
      required: [version]
      description: |
        Partial update. Rejected with 422 `NOT_EDITABLE` unless the program is in
        `draft` or `active` status.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        earnRatio:
          type: integer
          minimum: 1
        expiryDays:
          type: integer
          minimum: 1
          nullable: true
          description: Pass `null` to clear the expiry policy
        tierConfig:
          type: object
          additionalProperties: true
        version:
          type: integer
          minimum: 1
          description: |
            Current version of the program. A mismatch returns 409
            `VERSION_CONFLICT` rather than silently overwriting.

    TransitionLoyaltyProgramRequest:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [active, suspended, archived]
          description: Target status; `draft` cannot be re-entered
        version:
          type: integer
          minimum: 1

    LoyaltyTxType:
      type: string
      description: Classification of a points accrual.
      enum: [purchase, bonus, referral, promotion, adjustment]

    LoyaltyAccrual:
      type: object
      description: |
        One credit of points to an enrolment. `points` is a `bigint` serialized as
        a decimal **string**.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        enrolmentId:
          type: string
          format: uuid
        points:
          type: string
          description: Points credited (bigint as string)
          examples: ["500"]
        source:
          type: string
          maxLength: 100
          description: Originating system or campaign
        sourceRef:
          type: string
          maxLength: 200
          nullable: true
          description: Reference in the originating system (order id, campaign code, …)
        txType:
          $ref: "#/components/schemas/LoyaltyTxType"
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: When these points expire; `null` = never
        accrualDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    AccrueLoyaltyPointsRequest:
      type: object
      required: [enrolmentId, points, source]
      properties:
        enrolmentId:
          type: string
          format: uuid
          description: Target enrolment — must be `active`
        points:
          type: integer
          minimum: 1
          description: |
            Points to credit. Stored as a `bigint`; also accepted as a decimal
            string for values above 2^53.
        source:
          type: string
          minLength: 1
          maxLength: 100
        sourceRef:
          type: string
          maxLength: 200
        txType:
          allOf:
            - $ref: "#/components/schemas/LoyaltyTxType"
          default: purchase

    LoyaltyBalanceSummary:
      type: object
      description: |
        Points position for one enrolment. Every figure is a `bigint` serialized
        as a decimal **string**.
      properties:
        enrolmentId:
          type: string
          format: uuid
        pointsBalance:
          type: string
          description: Spendable balance (bigint as string)
          examples: ["500"]
        lifetimePoints:
          type: string
          description: Cumulative points ever accrued; drives tier evaluation
          examples: ["1000"]
        totalAccrued:
          type: string
          description: Sum of every accrual ever recorded
          examples: ["1000"]
        activePoints:
          type: string
          description: Accrued points that have not yet expired
          examples: ["750"]

    LoyaltyRedemptionStatus:
      type: string
      description: |
        Redemption state. Only `pending` and `fulfilled` redemptions may be
        voided; `voided` and `cancelled` are terminal.
      enum: [pending, fulfilled, cancelled, voided, expired]

    LoyaltyRedemption:
      type: object
      description: |
        One debit of points against an enrolment. `points` is a `bigint`
        serialized as a decimal **string**.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        enrolmentId:
          type: string
          format: uuid
          nullable: true
        points:
          type: string
          description: Points redeemed (bigint as string)
          examples: ["250"]
        rewardType:
          type: string
          maxLength: 50
        status:
          $ref: "#/components/schemas/LoyaltyRedemptionStatus"
        redeemedAt:
          type: string
          format: date-time
        voidedAt:
          type: string
          format: date-time
          nullable: true
        voidReason:
          type: string
          maxLength: 500
          nullable: true
        version:
          type: integer
          description: Optimistic-lock version
        createdAt:
          type: string
          format: date-time

    RedeemLoyaltyPointsRequest:
      type: object
      required: [enrolmentId, points, rewardType]
      properties:
        enrolmentId:
          type: string
          format: uuid
          description: Source enrolment — must be `active` with sufficient balance
        points:
          type: integer
          minimum: 1
          description: Points to debit; stored as a `bigint`
        rewardType:
          type: string
          minLength: 1
          maxLength: 50

    VoidLoyaltyRedemptionRequest:
      type: object
      required: [reason, version]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Mandatory audit reason, retained on the redemption row
        version:
          type: integer
          minimum: 1

    LoyaltyTierAssignment:
      type: object
      description: One tier assignment in an enrolment's append-only tier history.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        enrolmentId:
          type: string
          format: uuid
        tierDefinitionId:
          type: string
          format: uuid
        assignedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EvaluateLoyaltyTierRequest:
      type: object
      required: [enrolmentId, programId]
      properties:
        enrolmentId:
          type: string
          format: uuid
        programId:
          type: string
          format: uuid
          description: Program whose tier definitions are evaluated against

    LoyaltyTierEvaluationResult:
      type: object
      description: |
        Outcome of a tier re-evaluation. When `changed` is `false` nothing was
        written.
      properties:
        enrolmentId:
          type: string
          format: uuid
        programId:
          type: string
          format: uuid
        newTier:
          type: string
          nullable: true
          description: Resolved tier name, or `null` when no definition matched
        newLevel:
          type: integer
          nullable: true
          description: Resolved tier level (higher = better)
        changed:
          type: boolean
          description: Whether a new assignment was written
        direction:
          type: string
          nullable: true
          description: Direction of the change (upgrade / downgrade) when `changed`

    # ─── Journey (Campaign Orchestration) ─────────────────────────────────────

    JourneyListMeta:
      type: object
      description: Offset-based pagination metadata returned by journey list endpoints.
      properties:
        page:
          type: integer
          description: 1-based page number derived from offset / limit
        pageSize:
          type: integer
        total:
          type: integer

    JourneyStatus:
      type: string
      description: |
        Journey lifecycle state. Allowed transitions:
        `draft → active | archived`, `active → paused | completed | archived`,
        `paused → active | completed | archived`, `completed → archived`;
        `archived` is terminal. Only `draft` journeys are editable.
      enum: [draft, active, paused, completed, archived]

    Journey:
      type: object
      description: A multi-step campaign orchestration blueprint.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        status:
          $ref: "#/components/schemas/JourneyStatus"
        triggerConfig:
          type: object
          additionalProperties: true
          nullable: true
          description: Inline trigger definition (separate from the triggers module)
        steps:
          type: array
          description: |
            Ordered step definitions. A journey with an empty `steps` array cannot
            be activated (422 `ACTIVATION_INVALID`).
          items:
            type: object
            additionalProperties: true
        version:
          type: integer
          description: Optimistic-lock version
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        updatedBy:
          type: string
          format: uuid

    CreateJourneyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        triggerConfig:
          type: object
          additionalProperties: true
        steps:
          type: array
          default: []
          items:
            type: object
            additionalProperties: true

    UpdateJourneyRequest:
      type: object
      required: [version]
      description: |
        Partial update. Rejected with 422 `NOT_EDITABLE` unless the journey is in
        `draft` status.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        triggerConfig:
          type: object
          additionalProperties: true
        steps:
          type: array
          items:
            type: object
            additionalProperties: true
        version:
          type: integer
          minimum: 1
          description: |
            Current version of the journey. A mismatch returns 409
            `VERSION_CONFLICT`.

    JourneyExecutionStatus:
      type: string
      description: |
        Per-profile execution state. Allowed transitions:
        `enrolled → in_progress | exited`, `in_progress → completed | exited`;
        `completed` and `exited` are terminal.
      enum: [enrolled, in_progress, completed, exited]

    JourneyExecution:
      type: object
      description: One profile's enrollment in, and progress through, a journey.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        journeyId:
          type: string
          format: uuid
        profileId:
          type: string
          format: uuid
          description: CDP golden profile id (cross-service reference, no FK)
        status:
          $ref: "#/components/schemas/JourneyExecutionStatus"
        currentStepIndex:
          type: integer
          minimum: 0
        enrolledAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when the execution reaches `completed` or `exited`
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EnrollJourneyProfileRequest:
      type: object
      required: [journeyId, profileId]
      properties:
        journeyId:
          type: string
          format: uuid
          description: Target journey — must be `active`
        profileId:
          type: string
          format: uuid
          description: CDP golden profile to enroll

    JourneyStepType:
      type: string
      description: |
        Supported step types. An unsupported value is rejected with **400**
        `INVALID_STEP_TYPE`.
      enum: [send_notification, wait, condition_check, api_call]

    JourneyStepStatus:
      type: string
      description: |
        Step execution state. Allowed transitions:
        `pending → executing`, `executing → completed | failed | skipped`.
      enum: [pending, executing, completed, failed, skipped]

    JourneyStepExecution:
      type: object
      description: One recorded execution of a journey step for a profile.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        journeyId:
          type: string
          format: uuid
        profileId:
          type: string
          format: uuid
        stepIndex:
          type: integer
          minimum: 0
        status:
          $ref: "#/components/schemas/JourneyStepStatus"
        executedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer

    ExecuteJourneyStepRequest:
      type: object
      required: [journeyId, profileId, stepIndex, stepType]
      properties:
        journeyId:
          type: string
          format: uuid
        profileId:
          type: string
          format: uuid
        stepIndex:
          type: integer
          minimum: 0
          description: |
            Must be within the journey's `steps` array, otherwise **400**
            `INVALID_STEP_INDEX`.
        stepType:
          allOf:
            - $ref: "#/components/schemas/JourneyStepType"
          description: |
            Validated in the domain layer — an unsupported value is **400**
            `INVALID_STEP_TYPE`.

    JourneyTriggerType:
      type: string
      description: |
        Trigger type. Each type requires a specific `config` field:
        `event_based` → `eventName`, `time_based` → `schedule` (cron),
        `segment_entry` → `segmentId`.
      enum: [event_based, time_based, segment_entry]

    JourneyTriggerStatus:
      type: string
      description: |
        Trigger state. The soft-delete route sets `inactive`; only `active`
        triggers match incoming events.
      enum: [active, paused, inactive]

    JourneyTrigger:
      type: object
      description: An event, schedule, or segment-entry trigger bound to a journey.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        journeyId:
          type: string
          format: uuid
        triggerType:
          $ref: "#/components/schemas/JourneyTriggerType"
        config:
          type: object
          additionalProperties: true
          description: |
            Type-specific configuration. Validated against `triggerType`; a
            mismatch is **400** `INVALID_CONFIG`.
        status:
          $ref: "#/components/schemas/JourneyTriggerStatus"
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        updatedBy:
          type: string
          format: uuid

    CreateJourneyTriggerRequest:
      type: object
      required: [journeyId, triggerType]
      properties:
        journeyId:
          type: string
          format: uuid
        triggerType:
          $ref: "#/components/schemas/JourneyTriggerType"
        config:
          type: object
          additionalProperties: true
          default: {}
          description: |
            Must carry the field required by `triggerType`
            (`eventName` / `schedule` / `segmentId`).

    UpdateJourneyTriggerRequest:
      type: object
      required: [version]
      description: |
        Partial update. The merged (`triggerType`, `config`) pair is re-validated,
        so changing one without the other can fail with **400** `INVALID_CONFIG`.
      properties:
        triggerType:
          $ref: "#/components/schemas/JourneyTriggerType"
        config:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [active, paused]
          description: |
            Only `active` / `paused` may be set here — `inactive` is reached
            through the DELETE route.
        version:
          type: integer
          minimum: 1

    # ─── Field (Tasks, Visits, Routes, Sync) ──────────────────────────────────

    FieldListMeta:
      type: object
      description: Offset-based pagination metadata returned by field list endpoints.
      properties:
        page:
          type: integer
          description: 1-based page number derived from offset / limit
        pageSize:
          type: integer
        total:
          type: integer

    FieldTaskStatus:
      type: string
      description: |
        Field task lifecycle state. A task created with an assignee starts as
        `assigned`, otherwise `unassigned`. `completed` and `cancelled` are
        terminal — an illegal move is rejected with 422 `TRANSITION_INVALID`.
      enum: [unassigned, assigned, in_progress, completed, cancelled]

    FieldTask:
      type: object
      description: |
        A field task. `latitude` / `longitude` are `numeric(10,7)` columns and are
        returned as **strings** by the driver, not numbers — the request side
        accepts them as numbers.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        assigneeId:
          type: string
          format: uuid
          nullable: true
        taskType:
          type: string
          maxLength: 64
        title:
          type: string
          maxLength: 256
        description:
          type: string
          maxLength: 4000
          nullable: true
        status:
          $ref: "#/components/schemas/FieldTaskStatus"
        priority:
          type: integer
          minimum: 1
          maximum: 5
          description: 1 = highest, 5 = lowest
        latitude:
          type: string
          nullable: true
          description: Target latitude, numeric(10,7) serialized as a string
        longitude:
          type: string
          nullable: true
          description: Target longitude, numeric(10,7) serialized as a string
        address:
          type: string
          maxLength: 500
          nullable: true
        dueDate:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer

    CreateFieldTaskRequest:
      type: object
      required: [taskType, title]
      properties:
        assigneeId:
          type: string
          format: uuid
          description: Supplying an assignee starts the task as `assigned`
        taskType:
          type: string
          minLength: 1
          maxLength: 64
        title:
          type: string
          minLength: 1
          maxLength: 256
        description:
          type: string
          maxLength: 4000
        priority:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        address:
          type: string
          maxLength: 500
        dueDate:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true

    UpdateFieldTaskRequest:
      type: object
      required: [version]
      description: |
        Partial update of descriptive fields only — status changes go through the
        dedicated transition routes.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
        description:
          type: string
          maxLength: 4000
        priority:
          type: integer
          minimum: 1
          maximum: 5
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        address:
          type: string
          maxLength: 500
        dueDate:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
        version:
          type: integer
          minimum: 1

    AssignFieldTaskRequest:
      type: object
      required: [assigneeId, version]
      properties:
        assigneeId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1

    FieldTaskTransitionRequest:
      type: object
      required: [version]
      description: Body shared by the start / complete / cancel transition routes.
      properties:
        version:
          type: integer
          minimum: 1
          description: |
            Current version of the task. A mismatch returns 409
            `VERSION_CONFLICT`.

    FieldVisitOutcome:
      type: string
      description: |
        Visit outcome, classified server-side from the check-in → check-out
        duration; it is never supplied by the client.
      enum: [completed, short_visit, extended_visit, no_show]

    FieldVisit:
      type: object
      description: |
        A GPS-verified visit against a task. Coordinate columns are
        `numeric(10,7)` and are returned as **strings**.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        checkInLatitude:
          type: string
          nullable: true
        checkInLongitude:
          type: string
          nullable: true
        checkOutLatitude:
          type: string
          nullable: true
        checkOutLongitude:
          type: string
          nullable: true
        checkInAt:
          type: string
          format: date-time
          nullable: true
        checkOutAt:
          type: string
          format: date-time
          nullable: true
        durationMinutes:
          type: integer
          nullable: true
          description: Computed on check-out
        outcome:
          oneOf:
            - $ref: "#/components/schemas/FieldVisitOutcome"
            - type: "null"
        notes:
          type: string
          maxLength: 2000
          nullable: true
        photos:
          type: array
          description: Object-store keys for visit photos
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer

    FieldVisitCheckInRequest:
      type: object
      required: [taskId, latitude, longitude]
      description: |
        The agent is taken from the bearer token, so there is no `agentId` field.
      properties:
        taskId:
          type: string
          format: uuid
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180

    FieldVisitCheckOutRequest:
      type: object
      description: |
        Every field is optional — a check-out with an empty body is valid, and the
        outcome is derived from the elapsed duration.
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        notes:
          type: string
          maxLength: 2000
        photos:
          type: array
          maxItems: 10
          default: []
          description: Object-store keys, at most 10 per visit
          items:
            type: string

    FieldRouteStatus:
      type: string
      description: Route plan state.
      enum: [draft, optimized, in_progress, active, completed, cancelled]

    FieldRouteWaypoint:
      type: object
      description: One stop on a route plan.
      properties:
        taskId:
          type: string
          format: uuid
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        priority:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        windowStart:
          type: string
          description: Optional start of the service time window
        windowEnd:
          type: string
          description: Optional end of the service time window

    FieldRoutePlan:
      type: object
      description: |
        An optimized visit plan for one agent on one date. `totalDistanceKm` is a
        `numeric(8,2)` column and is returned as a **string** on reads.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        assigneeId:
          type: string
          format: uuid
        routeDate:
          type: string
          description: Route date (YYYY-MM-DD)
        status:
          $ref: "#/components/schemas/FieldRouteStatus"
        waypoints:
          type: array
          items:
            $ref: "#/components/schemas/FieldRouteWaypoint"
        optimizedOrder:
          type: array
          description: Waypoint indices in visit order — a permutation of `0..n-1`
          items:
            type: integer
        totalDistanceKm:
          type: string
          nullable: true
          description: Total route distance in km, numeric(8,2) as a string
        estimatedDurationMinutes:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer

    GenerateFieldRouteRequest:
      type: object
      required: [assigneeId, date, waypoints]
      properties:
        assigneeId:
          type: string
          format: uuid
        date:
          type: string
          description: Route date (YYYY-MM-DD)
        waypoints:
          type: array
          minItems: 2
          maxItems: 50
          description: Between 2 and 50 stops to sequence
          items:
            $ref: "#/components/schemas/FieldRouteWaypoint"

    ReorderFieldRouteRequest:
      type: object
      required: [optimizedOrder, version]
      properties:
        optimizedOrder:
          type: array
          description: |
            Must be a permutation of `0..n-1` for the route's waypoints — wrong
            length, duplicates, or out-of-range indices give 422 `INVALID_ORDER`.
          items:
            type: integer
            minimum: 0
        version:
          type: integer
          minimum: 1

    FieldSyncOperationType:
      type: string
      description: |
        Offline operation kind. Conflict strategy during the server-side drain:
        create → client wins, delete → server wins, update → field-level merge.
      enum: [create, update, delete]

    FieldSyncStatus:
      type: string
      description: Processing state of a queued offline operation.
      enum: [pending, processed, failed]

    FieldSyncOperation:
      type: object
      description: One offline operation captured on-device and replayed server-side.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        entityType:
          type: string
          maxLength: 32
          description: |
            Syncable entity (task / visit / route). The allow-list is enforced in
            the domain layer, so a new entity needs no migration.
        entityId:
          type: string
          format: uuid
        operation:
          $ref: "#/components/schemas/FieldSyncOperationType"
        payload:
          type: object
          additionalProperties: true
        clientTimestamp:
          type: string
          format: date-time
          description: Device clock at capture time
        clientVersion:
          type: integer
          minimum: 0
          description: Base version the device held, used for conflict detection
        status:
          $ref: "#/components/schemas/FieldSyncStatus"
        attempts:
          type: integer
        lastError:
          type: string
          nullable: true
        processedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FieldSyncPushRequest:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [entityType, entityId, operation, payload, clientTimestamp]
            properties:
              id:
                type: string
                format: uuid
                description: |
                  Client-supplied operation id used for deduplication. Defaults
                  to a server-generated uuid when omitted.
              entityType:
                type: string
                minLength: 1
                maxLength: 32
              entityId:
                type: string
                format: uuid
              operation:
                $ref: "#/components/schemas/FieldSyncOperationType"
              payload:
                type: object
                additionalProperties: true
              clientTimestamp:
                type: string
                format: date-time
              clientVersion:
                type: integer
                minimum: 0
                default: 1

    # ─── Recommendation (NBA, Matrix, Health, Feedback) ───────────────────────

    RecommendationListMeta:
      type: object
      description: Offset-based pagination metadata returned by recommendation list endpoints.
      properties:
        page:
          type: integer
          description: 1-based page number derived from offset / limit
        pageSize:
          type: integer
        total:
          type: integer

    RecommendationStatus:
      type: string
      description: |
        Recommendation lifecycle state. Allowed transitions:
        `served → accepted | rejected | expired`; the other three are terminal, so
        re-deciding is rejected with 422 `INVALID_TRANSITION`.
      enum: [served, accepted, rejected, expired]

    Recommendation:
      type: object
      description: |
        A recommendation served to a profile. `score` is stored as
        `numeric(5,4)` but is exposed as a JSON **number** in the 0–1 range
        (rounded to 4 decimal places).
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        profileId:
          type: string
          format: uuid
          description: CDP golden profile id (cross-service reference, no FK)
        recommendationType:
          type: string
          maxLength: 64
        productId:
          type: string
          format: uuid
          nullable: true
        channel:
          type: string
          maxLength: 64
          nullable: true
          description: Delivery channel (web, mobile, call-centre, …)
        score:
          type: number
          minimum: 0
          maximum: 1
          description: Relevance score, 4 decimal places
        status:
          $ref: "#/components/schemas/RecommendationStatus"
        servedAt:
          type: string
          format: date-time
          description: |
            Start of the 72-hour actionable TTL. A recommendation older than that
            is excluded from the top-N list and cannot be accepted.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer

    CreateRecommendationRequest:
      type: object
      required: [profileId, recommendationType]
      description: |
        Either supply `score` directly or let it be computed from `signals`.
        An explicit `score` always wins.
      properties:
        profileId:
          type: string
          format: uuid
        recommendationType:
          type: string
          minLength: 1
          maxLength: 64
        productId:
          type: string
          format: uuid
        channel:
          type: string
          minLength: 1
          maxLength: 64
        score:
          type: number
          minimum: 0
          maximum: 1
          description: Explicit relevance score; overrides `signals`
        signals:
          type: object
          description: |
            Inputs to the scoring function. Weights: matrix priority 50%,
            account health 20%, product affinity 30%.
          properties:
            matrixPriority:
              type: number
              minimum: 0
              default: 0
              description: Cross-sell matrix priority; capped at 10
            healthScore:
              type: number
              minimum: 0
              maximum: 100
              default: 0
            affinity:
              type: number
              minimum: 0
              maximum: 1
              default: 0

    RecommendationDecisionRequest:
      type: object
      description: |
        Optional body for the accept route. When `version` is omitted the row's
        current version is used, so a concurrent write can still be lost — supply
        it for read-modify-write flows.
      properties:
        version:
          type: integer
          minimum: 1

    RejectRecommendationRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: |
            Mandatory — rejection reasons are the only negative training signal
            available to the model.
        version:
          type: integer
          minimum: 1
          description: Optional optimistic-lock guard

    RecommendationFeedbackAction:
      type: string
      enum: [accepted, rejected]

    RecommendationFeedback:
      type: object
      description: |
        Acceptance / rejection signal recorded when a user acts on a served
        recommendation.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        recommendationId:
          type: string
          format: uuid
        action:
          $ref: "#/components/schemas/RecommendationFeedbackAction"
        reason:
          type: string
          maxLength: 500
          nullable: true
          description: Always present for `rejected`; may be null for `accepted`
        recordedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer

    RecordRecommendationFeedbackRequest:
      type: object
      required: [recommendationId, action]
      description: |
        A `rejected` action without a `reason` is rejected with 422
        `FEEDBACK_INVALID` — the rule lives in the domain layer so callers get a
        business-rule error rather than a schema error.
      properties:
        recommendationId:
          type: string
          format: uuid
        action:
          $ref: "#/components/schemas/RecommendationFeedbackAction"
        reason:
          type: string
          maxLength: 500
          description: Mandatory when `action` is `rejected`

    CrossSellMatrixEntry:
      type: object
      description: |
        A product-to-product recommendation rule, optionally narrowed by segment
        and/or channel. The (trigger, recommended, segment, channel) scope must be
        unique per tenant.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        triggerProductId:
          type: string
          format: uuid
        recommendedProductId:
          type: string
          format: uuid
        segment:
          type: string
          maxLength: 64
          nullable: true
        channel:
          type: string
          maxLength: 64
          nullable: true
        priority:
          type: integer
          minimum: 0
          description: Higher wins during ranking; capped at 10 when scoring
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer

    CreateCrossSellMatrixEntryRequest:
      type: object
      required: [triggerProductId, recommendedProductId]
      properties:
        triggerProductId:
          type: string
          format: uuid
        recommendedProductId:
          type: string
          format: uuid
        segment:
          type: string
          minLength: 1
          maxLength: 64
        channel:
          type: string
          minLength: 1
          maxLength: 64
        priority:
          type: integer
          minimum: 0
          default: 0

    UpdateCrossSellMatrixEntryRequest:
      type: object
      required: [version]
      description: |
        Partial update — the product pair is immutable, only scope and priority
        can change.
      properties:
        segment:
          type: string
          minLength: 1
          maxLength: 64
        channel:
          type: string
          minLength: 1
          maxLength: 64
        priority:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1

    AccountHealthClassification:
      type: string
      description: |
        Health band derived from the score: `critical` < 40 ≤ `at_risk` < 60 ≤
        `healthy` < 80 ≤ `excellent`.
      enum: [critical, at_risk, healthy, excellent]

    AccountHealthFactors:
      type: object
      description: |
        RFM-style factors, each already normalised to 0–100 by the caller. The
        object is validated `strict`, so an unknown key is a 400.
      additionalProperties: false
      properties:
        recency:
          type: number
          minimum: 0
          maximum: 100
          description: How recently the account transacted (100 = today)
        frequency:
          type: number
          minimum: 0
          maximum: 100
          description: How often the account transacts
        monetary:
          type: number
          minimum: 0
          maximum: 100
          description: Relative revenue contribution
        supportTickets:
          type: number
          minimum: 0
          maximum: 100
          description: Support-load health (100 = no open/escalated tickets)
        engagement:
          type: number
          minimum: 0
          maximum: 100
          description: Product / portal engagement

    AccountHealthScore:
      type: object
      description: |
        One computed account health score. Reads are enriched with the derived
        `classification` band.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Composite score. Weights: recency 25%, frequency 20%, monetary 25%,
            support load 15%, engagement 15%.
        classification:
          $ref: "#/components/schemas/AccountHealthClassification"
        factors:
          $ref: "#/components/schemas/AccountHealthFactors"
        computedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer

    RecomputeAccountHealthRequest:
      type: object
      required: [factors]
      properties:
        factors:
          $ref: "#/components/schemas/AccountHealthFactors"

    # ─── AI Agent (Agents, Chat, Copilot, Guardrails, Governance) ─────────────

    AiListMeta:
      type: object
      description: Offset-based pagination metadata returned by ai-agent list endpoints.
      properties:
        page:
          type: integer
          description: 1-based page number derived from offset / limit
        pageSize:
          type: integer
        total:
          type: integer

    GuardrailBlockedError:
      type: object
      description: |
        Guardrail rejection envelope. Returned with **422** by the chat, copilot,
        and agent-invoke routes when the input violates a guardrail rule. Note it
        carries the matched violations under `details` — the plain
        `ErrorResponse` shape does not.
      required: [code, message, correlationId, retryable]
      properties:
        code:
          type: string
          const: GUARDRAIL_BLOCKED
        message:
          type: string
        correlationId:
          type: string
        retryable:
          type: boolean
          const: false
        details:
          type: object
          properties:
            violations:
              type: array
              items:
                $ref: "#/components/schemas/AiGuardrailViolation"

    AiGuardrailViolation:
      type: object
      description: One guardrail rule match against an evaluated input.
      properties:
        ruleId:
          type: string
          format: uuid
        ruleType:
          $ref: "#/components/schemas/AiGuardrailRuleType"
        severity:
          $ref: "#/components/schemas/AiGuardrailSeverity"
        message:
          type: string
          description: Human-readable description of what matched

    AiGuardrailOutcome:
      type: object
      description: |
        Guardrail result attached to a successful response. `violations` may be
        non-empty even when `passed` is true — low-severity matches are recorded
        as warnings rather than blocks.
      properties:
        passed:
          type: boolean
        violations:
          type: array
          items:
            $ref: "#/components/schemas/AiGuardrailViolation"

    AiAgentStatus:
      type: string
      description: |
        Agent lifecycle state. `archived` is terminal; only `active` agents accept
        invocations.
      enum: [active, paused, archived]

    AiAgent:
      type: object
      description: An agent definition — its skills and the tools it may call.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        skills:
          type: array
          description: Free-form skill descriptors used for handoff matching
          items:
            type: object
            additionalProperties: true
        tools:
          type: array
          description: Free-form tool descriptors the agent may invoke
          items:
            type: object
            additionalProperties: true
        status:
          $ref: "#/components/schemas/AiAgentStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer

    CreateAiAgentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        skills:
          type: array
          items:
            type: object
            additionalProperties: true
        tools:
          type: array
          items:
            type: object
            additionalProperties: true

    UpdateAiAgentRequest:
      type: object
      required: [version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        skills:
          type: array
          items:
            type: object
            additionalProperties: true
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
        status:
          $ref: "#/components/schemas/AiAgentStatus"
        version:
          type: integer
          minimum: 1

    AiVersionGuardRequest:
      type: object
      description: |
        Optional body for the pause / resume routes. When `version` is omitted the
        agent's current version is used.
      properties:
        version:
          type: integer
          minimum: 1

    InvokeAiAgentRequest:
      type: object
      description: |
        Optional body. When `input` is present it is evaluated against the
        tenant's active guardrail rules before the invocation is queued.
      properties:
        input:
          type: string
          minLength: 1
          maxLength: 16000
          description: Free text for the agent; guardrail-evaluated then redacted
        payload:
          type: object
          additionalProperties: true
          description: Structured invocation parameters
        conversationId:
          type: string
          format: uuid
          description: Optional chat conversation to attribute the invocation to

    AiAgentHandoffRequest:
      type: object
      required: [fromAgentId, requiredSkill]
      properties:
        fromAgentId:
          type: string
          format: uuid
          description: Source agent; excluded from target selection
        requiredSkill:
          type: string
          minLength: 1
          maxLength: 200
        conversationId:
          type: string
          format: uuid

    AiConversationStatus:
      type: string
      description: Chat conversation state; `ended` is terminal.
      enum: [active, ended]

    AiConversation:
      type: object
      description: A chat conversation with an AI agent.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        profileId:
          type: string
          format: uuid
          description: |
            CDP golden profile the conversation belongs to; defaults to the
            calling actor when not supplied on the first turn.
        status:
          $ref: "#/components/schemas/AiConversationStatus"
        language:
          type: string
          maxLength: 8
          description: BCP-47-ish language tag; defaults to `en`
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer

    AiChatMessage:
      type: object
      description: |
        One message in a conversation transcript. `content` is the
        guardrail-**sanitised** text — raw input is never persisted (DPDP Act
        2023).
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        role:
          type: string
          description: Message author role (e.g. `user`, `assistant`)
        content:
          type: string
          description: Sanitised message text
        tokens:
          type: integer
          nullable: true
          description: Estimated token count for the message
        createdAt:
          type: string
          format: date-time
        version:
          type: integer

    SendAiChatMessageRequest:
      type: object
      required: [channelId, message]
      properties:
        conversationId:
          type: string
          format: uuid
          description: |
            Omit to start a new conversation (response is 201); supply to append
            to an existing active one (response is 202).
        channelId:
          type: string
          format: uuid
        profileId:
          type: string
          format: uuid
          description: Defaults to the calling actor when omitted
        message:
          type: string
          minLength: 1
          maxLength: 4000
        language:
          type: string
          maxLength: 8
          description: Defaults to `en`

    AiChatMessageResponse:
      type: object
      description: |
        Shared response shape for `POST /v1/ai/chat`. `status` is `started` on the
        201 path and `accepted` on the 202 path.
      properties:
        data:
          type: object
          properties:
            conversationId:
              type: string
              format: uuid
            messageId:
              type: string
              format: uuid
            status:
              type: string
              enum: [started, accepted]
            tokens:
              type: integer
            sanitizedInput:
              type: string
              description: Guardrail-redacted message (never the raw text)
            guardrail:
              $ref: "#/components/schemas/AiGuardrailOutcome"

    EndAiConversationRequest:
      type: object
      description: |
        Optional body. `version` guards the write; `reason` is retained on the
        audit entry only.
      properties:
        version:
          type: integer
          minimum: 1
        reason:
          type: string
          maxLength: 500

    AiCopilotCitation:
      type: object
      description: One resolved source citation attached to a copilot turn.
      properties:
        id:
          type: string
        title:
          type: string
        url:
          type: string
        score:
          type: number

    AiCopilotTurn:
      type: object
      description: |
        One copilot interaction. `prompt` is stored guardrail-**redacted**;
        `response` is null until the asynchronous model call completes.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        prompt:
          type: string
          description: Sanitised prompt text
        response:
          type: string
          nullable: true
        sourceCitations:
          type: array
          items:
            $ref: "#/components/schemas/AiCopilotCitation"
        model:
          type: string
          maxLength: 64
          nullable: true
        tokens:
          type: integer
          nullable: true
        latencyMs:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer

    AskAiCopilotRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 32000
          description: |
            The schema bound is deliberately looser than the domain limit, so an
            over-long prompt surfaces as 422 `PROMPT_INVALID` rather than a 400.
        context:
          type: object
          additionalProperties: true
        model:
          type: string
          maxLength: 64
        sources:
          type: array
          maxItems: 100
          description: Candidate sources to cite
          items:
            type: object
            required: [id]
            properties:
              id:
                type: string
              title:
                type: string
              url:
                type: string
              score:
                type: number

    SummarizeAiCopilotRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 32000
        maxLength:
          type: integer
          minimum: 50
          maximum: 2000
          description: Requested summary length cap
        model:
          type: string
          maxLength: 64

    AiGuardrailRuleType:
      type: string
      description: |
        Guardrail rule kind. Immutable once created — the update route does not
        accept `ruleType`.
      enum: [pii, profanity, prompt_injection, topic_block, max_length]

    AiGuardrailSeverity:
      type: string
      enum: [low, medium, high, critical]

    AiGuardrailRuleStatus:
      type: string
      description: |
        Rule state. The soft-delete route sets `disabled`; only `active` rules are
        evaluated.
      enum: [active, disabled]

    AiGuardrailRule:
      type: object
      description: One guardrail rule evaluated against AI inputs.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        ruleType:
          $ref: "#/components/schemas/AiGuardrailRuleType"
        pattern:
          type: string
          maxLength: 500
          nullable: true
          description: Match pattern, where the rule type uses one
        config:
          type: object
          additionalProperties: true
          description: Type-specific configuration
        severity:
          $ref: "#/components/schemas/AiGuardrailSeverity"
        status:
          $ref: "#/components/schemas/AiGuardrailRuleStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer

    CheckAiGuardrailsRequest:
      type: object
      required: [input]
      properties:
        input:
          type: string
          minLength: 1
          maxLength: 16000
        agentId:
          type: string
          format: uuid
          description: Attribute the check to an agent in the audit trail
        rules:
          type: array
          description: |
            Evaluate only these rule ids. Omit to evaluate every active rule for
            the tenant.
          items:
            type: string
            format: uuid

    CreateAiGuardrailRuleRequest:
      type: object
      required: [name, ruleType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        ruleType:
          $ref: "#/components/schemas/AiGuardrailRuleType"
        pattern:
          type: string
          maxLength: 500
        config:
          type: object
          additionalProperties: true
          default: {}
        severity:
          allOf:
            - $ref: "#/components/schemas/AiGuardrailSeverity"
          default: medium

    UpdateAiGuardrailRuleRequest:
      type: object
      required: [version]
      description: |
        Partial update. `ruleType` is immutable and is not accepted here; the
        merged rule is re-validated against the existing type.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        pattern:
          type: string
          maxLength: 500
        config:
          type: object
          additionalProperties: true
        severity:
          $ref: "#/components/schemas/AiGuardrailSeverity"
        status:
          $ref: "#/components/schemas/AiGuardrailRuleStatus"
        version:
          type: integer
          minimum: 1

    AiAuditEntry:
      type: object
      description: |
        One entry in the AI audit trail. `input` and `output` were redacted at
        write time, so this shape never carries raw prompts or model output
        (DPDP Act 2023).
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
          maxLength: 100
          description: Audited action (e.g. `chat.send`, `agent.invoke`, `guardrails.check`)
        input:
          type: string
          nullable: true
          description: Redacted input text
        output:
          type: string
          nullable: true
          description: Redacted output text
        blocked:
          type: boolean
          description: Whether guardrails blocked the interaction
        reason:
          type: string
          maxLength: 500
          nullable: true
          description: Why it was blocked, when it was
        createdAt:
          type: string
          format: date-time
        version:
          type: integer

    AiBlockRateSummary:
      type: object
      description: |
        Guardrail block-rate statistics. An empty audit trail yields
        `blockRatePct: 0` rather than a divide-by-zero.
      properties:
        total:
          type: integer
          description: Total audited invocations
        blocked:
          type: integer
          description: How many were blocked
        blockRatePct:
          type: number
          description: Blocked share as a percentage, 2 decimal places

    # ─── Notification Service — email deliverability (CR-MKT-04) ─────────────

    NotificationListMeta:
      type: object
      description: Offset-based pagination envelope used by notification-service list routes.
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
          description: 1-based page number derived from offset/limit
        pageSize:
          type: integer
        total:
          type: integer

    DomainHealth:
      type: string
      description: |
        Roll-up of the three authentication mechanisms.
        `healthy` — DKIM, SPF and DMARC all pass.
        `degraded` — DKIM and SPF pass but DMARC does not; mail delivers, the
        domain is unprotected against spoofing.
        `failing` — DKIM or SPF is not passing; mail is at real risk of rejection.
        `unknown` — no record was observed for any mechanism, so there is no signal.
      enum: [healthy, degraded, failing, unknown]

    MechanismStatus:
      type: string
      description: |
        Per-mechanism verdict. `missing` means no TXT record was observed at all,
        which is distinct from `fail` (a record exists but does not match).
      enum: [pass, fail, missing]

    RegisterSendingDomainRequest:
      type: object
      required: [domain, dkimSelector, dkimValue, spfInclude, dmarcPolicy]
      properties:
        domain:
          type: string
          minLength: 4
          maxLength: 253
          description: |
            DNS domain to send from. RFC 1035 label syntax, at least two labels —
            a bare hostname is rejected.
          examples: ["mail.example.gov.in"]
        dkimSelector:
          type: string
          minLength: 1
          maxLength: 63
          pattern: "^[a-zA-Z0-9._-]+$"
          description: DKIM selector; the TXT record is expected at `<selector>._domainkey.<domain>`
          examples: ["s1"]
        dkimValue:
          type: string
          minLength: 8
          maxLength: 4096
          description: |
            Expected DKIM public-key material, or a distinctive fragment of it.
            Compared with all whitespace removed, because DNS providers wrap long
            `p=` values differently.
        spfInclude:
          type: string
          minLength: 3
          maxLength: 253
          description: |
            Expected SPF include mechanism. MUST start with `include:` — a bare
            host is refused with 422 `INVALID_SPF_INCLUDE`.
          examples: ["include:spf.example.net"]
        dmarcPolicy:
          type: string
          enum: [none, quarantine, reject]
          description: Expected `p=` value in the domain's DMARC record

    RecordDomainAuthCheckRequest:
      type: object
      description: |
        Observed DNS TXT strings for one check. Every field is optional; an omitted
        or empty array means the record is absent and evaluates to `missing`.
      properties:
        dkimTxt:
          type: array
          default: []
          maxItems: 20
          items:
            type: string
            maxLength: 4096
          description: TXT chunks observed at the DKIM selector; concatenated before evaluation
        spfTxt:
          type: array
          default: []
          maxItems: 20
          items:
            type: string
            maxLength: 4096
        dmarcTxt:
          type: array
          default: []
          maxItems: 20
          items:
            type: string
            maxLength: 4096
        source:
          type: string
          enum: [scheduled, manual]
          default: scheduled
          description: Whether the scheduled sweeper or an operator produced this check
        checkedAt:
          type: string
          format: date-time
          description: When the DNS lookup happened. Defaults to server time when omitted.

    SendingDomain:
      type: object
      description: A registered sending domain as returned by the list route.
      properties:
        id:
          type: string
          format: uuid
        domain:
          type: string
        dkimSelector:
          type: string
        spfInclude:
          type: string
        dmarcPolicy:
          type: string
          enum: [none, quarantine, reject]
        health:
          $ref: "#/components/schemas/DomainHealth"
        enabled:
          type: boolean
          description: Whether the tenant has the domain switched on for sending
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
          description: Null until the first authentication check has landed

    DomainAuthCheck:
      type: object
      description: One historical DKIM/SPF/DMARC evaluation.
      properties:
        id:
          type: string
          format: uuid
        dkimStatus:
          $ref: "#/components/schemas/MechanismStatus"
        spfStatus:
          $ref: "#/components/schemas/MechanismStatus"
        dmarcStatus:
          $ref: "#/components/schemas/MechanismStatus"
        health:
          $ref: "#/components/schemas/DomainHealth"
        source:
          type: string
          enum: [scheduled, manual]
        checkedAt:
          type: string
          format: date-time

    SendingDomainHealth:
      type: object
      description: Current authentication health for one sending domain, plus recent checks.
      properties:
        sendingDomainId:
          type: string
          format: uuid
        domain:
          type: string
        health:
          $ref: "#/components/schemas/DomainHealth"
        sendingAllowed:
          type: boolean
          description: |
            True when the domain may be used as an envelope-from — that is, when
            health is `healthy` or `degraded`. `failing` and `unknown` are refused.
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
        expected:
          type: object
          description: The records registered for this domain, for side-by-side comparison
          properties:
            dkimSelector:
              type: string
            spfInclude:
              type: string
            dmarcPolicy:
              type: string
              enum: [none, quarantine, reject]
        history:
          type: array
          description: Most recent checks, newest first
          items:
            $ref: "#/components/schemas/DomainAuthCheck"

    # ─── CRM ───────────────────────────────────────────────────────────────────

    CreateCrmContactRequest:
      type: object
      description: |
        Mirrors `createContactBody` in
        `services/crm-service/src/modules/contacts/validators.ts`. Only `name` is
        required platform-wide; a tenant may make any of the other governable
        fields mandatory via `/v1/crm/lead-field-rules`, which is enforced with 422
        rather than 400.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 320
        phone:
          type: string
          minLength: 3
          maxLength: 32
        company:
          type: string
          minLength: 1
          maxLength: 200
        designation:
          type: string
          maxLength: 120
        city:
          type: string
          maxLength: 100
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code
          minLength: 2
          maxLength: 2
        leadStatus:
          type: string
          enum: [new, contacted, qualified, unqualified, customer]
          default: new
        leadSource:
          type: string
          maxLength: 64
        ownerId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        tags:
          type: array
          maxItems: 20
          items:
            type: string
        marketingConsent:
          type: boolean

    UpsertLeadFieldRuleRequest:
      type: object
      required: [fieldName, required]
      properties:
        fieldName:
          type: string
          description: |
            The governable field this rule applies to. `country` and `ownerId` are
            excluded on purpose: the server defaults them on create
            (`country: "IN"`, `ownerId`: the caller) and the guided lead form does not
            collect them, so a rule on either would reject every UI lead with 422.
          enum: [name, email, phone, company, designation, city, leadSource]
        required:
          type: boolean
          description: |
            When true (and `enabled`), manual contact creation is rejected with 422
            `MANDATORY_FIELDS_MISSING` if the field is absent or blank.
        weight:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Relative contribution to the completeness score. Weights decide importance
            within the governed set, not membership of it: if a tenant leaves every
            weight at 0, its enabled rules are scored equally, so a field declared
            mandatory is always visible to the data-quality score.
        enabled:
          type: boolean
          description: |
            Defaults to true. Set false to suspend enforcement while keeping the
            configured weight — used during data-cleanup windows.

    LeadFieldRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        fieldName:
          type: string
        required:
          type: boolean
        weight:
          type: integer
        enabled:
          type: boolean
        version:
          type: integer
          description: Optimistic-lock version
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateLeadCaptureFormRequest:
      type: object
      required: [name]
      additionalProperties: false
      description: |
        Note the absence of `formKey` and `tenantId`. Both are server-derived; supplying
        either is a 400, not a silently ignored field.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Admin-facing label, e.g. "Contact us — homepage"
        enabled:
          type: boolean
          description: Defaults true. When false the public URL answers the neutral 404.
        requireConsent:
          type: boolean
          description: |
            Defaults TRUE (DPDP Act 2023) so a form created without a view on consent is
            the safe one. When true, a submission without `consent: true` is refused 422.
        allowedOrigins:
          type: array
          maxItems: 50
          description: |
            Exact scheme+host origins, as a browser sends them. Empty means "any origin",
            because a server-side form post carries no Origin header at all. A bare
            hostname or `*` is rejected.
          items:
            type: string
            maxLength: 255
            pattern: "^https?://[^/\\s]+$"
        defaultLeadSource:
          type: string
          minLength: 1
          maxLength: 64
          description: Fallback `leadSource` when a submission does not declare one
        campaignId:
          type: string
          format: uuid
          description: |
            Campaign this form is permanently tied to. A submission's own `campaignId`
            takes precedence, so one form can serve several campaigns via its URL.
        maxPerMinute:
          type: integer
          minimum: 1
          maximum: 600
          description: |
            Per (form, client IP) budget in a 60s fixed window. Defaults to 10. Bounds
            mirror the DB CHECK: a form cannot be configured into an unlimited open
            relay, nor to zero (which would 429 every genuine prospect while looking
            like a working form).

    UpdateLeadCaptureFormRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Every field optional, at least one required. Same fields as
        `CreateLeadCaptureFormRequest`; `formKey` remains unamendable.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        enabled:
          type: boolean
        requireConsent:
          type: boolean
        allowedOrigins:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 255
        defaultLeadSource:
          type: string
          maxLength: 64
        campaignId:
          type: string
          format: uuid
        maxPerMinute:
          type: integer
          minimum: 1
          maximum: 600

    LeadCaptureForm:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        formKey:
          type: string
          description: |
            The public submission credential, 64 lowercase hex characters. Returned to
            admins because they need it to embed the form; deliberately NOT carried on
            any emitted domain event, and never logged.
        name:
          type: string
        enabled:
          type: boolean
        requireConsent:
          type: boolean
        allowedOrigins:
          type: array
          items:
            type: string
        defaultLeadSource:
          type: string
          nullable: true
        campaignId:
          type: string
          format: uuid
          nullable: true
        maxPerMinute:
          type: integer
        version:
          type: integer
          description: Optimistic-lock version
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LeadCaptureFormAccepted:
      allOf:
        - $ref: "#/components/schemas/AcceptedResponse"
        - type: object
          required: [formKey]
          properties:
            formKey:
              type: string
              pattern: "^[0-9a-f]{64}$"
              description: |
                Returned ONCE, here. The public URL is
                `/v1/crm/public/leads/{formKey}`.

    PublicLeadSubmission:
      type: object
      required: [name]
      additionalProperties: false
      description: |
        Body of an UNAUTHENTICATED submission. `additionalProperties: false` is
        load-bearing, not tidiness: it is what makes `{"tenantId": "..."}` a 400 rather
        than a silently ignored — or honoured — override. There is no `consentDate`
        field, because the server stamps it.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 320
          description: |
            Stored AES-256-GCM encrypted with a keyed blind index, which is also the
            tenant's dedupe key for create-or-update.
        phone:
          type: string
          minLength: 4
          maxLength: 32
          description: Stored AES-256-GCM encrypted. Matched on digits only.
        company:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        designation:
          type: string
          maxLength: 120
        consent:
          type: boolean
          description: |
            Explicit marketing consent (DPDP Act 2023). Never defaulted to true. Optional
            in the schema only so a form that requires it can answer 422
            `CONSENT_REQUIRED` rather than a generic 400.
        source:
          type: string
          maxLength: 64
          description: |
            Channel label. Precedence: this value, then the form's `defaultLeadSource`,
            then `public_form` — so every captured lead can be attributed to a channel.
        campaignId:
          type: string
          format: uuid
          description: |
            Honoured ONLY when the form is not already tied to a campaign. The form's own
            `campaignId` always wins: this value arrives from an anonymous caller and can
            only be validated as "a uuid", never checked against the tenant's campaigns,
            so letting it override a server-side setting would let anyone attach junk
            leads to a real campaign and corrupt its ROI reporting.
        utm:
          type: object
          additionalProperties: false
          description: |
            Standard UTM parameters, stored verbatim as varchar(128). Opaque ad-platform
            identifiers, so they are not parsed or normalised; the length cap is what
            stops an anonymous caller using them as free storage. Bound as query
            parameters, never concatenated into SQL.
          properties:
            source:
              type: string
              maxLength: 128
            medium:
              type: string
              maxLength: 128
            campaign:
              type: string
              maxLength: 128
            term:
              type: string
              maxLength: 128
            content:
              type: string
              maxLength: 128
        _hp:
          type: string
          maxLength: 200
          description: |
            Honeypot. A field no human sees and no real form fills in. Filling it yields
            the normal 202 and the submission is discarded.

    LeadCompleteness:
      type: object
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: Normalised percentage of configured weight that is populated
        missingFields:
          type: array
          items:
            type: string
        filledFields:
          type: array
          items:
            type: string
        totalFields:
          type: integer
          description: Number of scored fields (configured, or the default map)

    # ─── Knowledge Service ─────────────────────────────────────────────────────

    KnowledgeArticle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        category:
          type: string
          maxLength: 64
          nullable: true
        status:
          type: string
          enum: [draft, under_review, approved, archived]
        tags:
          type: array
          items:
            type: string
        accessLevel:
          type: string
          enum: [public, internal, restricted, confidential]
        fileType:
          type: string
          maxLength: 64
          nullable: true
        fileSize:
          type: integer
          nullable: true
          description: File size in bytes
        author:
          type: string
          maxLength: 200
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
      required:
        - id
        - tenantId
        - title
        - status
        - tags
        - accessLevel
        - createdAt
        - updatedAt
        - version

    # ─── HRMS Self-Service ─────────────────────────────────────────────────────

    EmployeeProfile:
      type: object
      description: |
        Employee record returned by the self-service profile endpoint. Contains
        the employee's basic details as stored in hrms_employees. PII fields
        (email, phone, aadhaar, pan) are encrypted at rest and decrypted for
        the owning user only.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        employeeNo:
          type: string
          description: Organisation-level employee number
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        departmentId:
          type: string
          format: uuid
          nullable: true
        designationId:
          type: string
          format: uuid
          nullable: true
        dateOfJoining:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum: [active, on_leave, suspended, resigned, retired, terminated]
        engagementType:
          type: string
          enum: [regular, contractual, deputation, consultant, third_party, apprenticeship]
          nullable: true
        userRef:
          type: string
          format: uuid
          nullable: true
          description: Linked identity user ID (auto-populated on email fallback match)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
      required:
        - id
        - tenantId
        - firstName
        - lastName
        - status
