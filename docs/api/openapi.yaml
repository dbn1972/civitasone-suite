  /v1/hrms/recruitment/esign:
    post:
      operationId: eSignDocument
      tags: [HRMS - Recruitment]
      summary: Digital signature / eSign (external seam)
      responses:
        "200": { description: Signed (or stub) }
        "501": { description: eSign not enabled }
      security: [{ bearerAuth: [] }]

  /v1/hrms/attendance/geo-check-in:
    post:
      operationId: geoCheckIn
      tags: [HRMS]
      summary: GPS-based attendance check-in
      description: |
        Records employee attendance using GPS coordinates. Validates that the
        check-in location is within the configured geofence radius for the
        employee's assigned office. Rejects check-ins on gazetted holidays.
        Returns geofence status (within/outside) and distance from office.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoCheckInRequest"
      responses:
        "201":
          description: Check-in recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [within_geofence, outside_geofence]
                  distanceMeters:
                    type: integer
                    nullable: true
                  officeName:
                    type: string
                    nullable: true
                  radiusMeters:
                    type: integer
                    nullable: true
                  isHoliday:
                    type: boolean
                  holidayName:
                    type: string
                    nullable: true
                  message:
                    type: string
        "400":
          description: Validation error or gazetted holiday
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/hrms/attendance/geo-check-out:
    post:
      operationId: geoCheckOut
      tags: [HRMS]
      summary: GPS-based attendance check-out
      description: |
        Records employee check-out using GPS coordinates. Validates location
        against the configured office geofence. Paired with geo-check-in to
        calculate total hours worked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoCheckInRequest"
      responses:
        "201":
          description: Check-out recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [check_out_recorded]
                  withinGeofence:
                    type: boolean
                  distanceMeters:
                    type: integer
                    nullable: true
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/hrms/attendance/geo-history:
    get:
      operationId: getGeoAttendanceHistory
      tags: [HRMS]
      summary: Get geo-attendance history
      description: |
        Returns the geo-attendance check-in/check-out history for an employee.
        Defaults to the authenticated user's records. HR admins can query any
        employee by passing employeeId.
      parameters:
        - name: employeeId
          in: query
          description: Employee UUID (defaults to authenticated user)
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Attendance history records (max 60)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        date:
                          type: string
                          format: date
                        checkType:
                          type: string
                          enum: [check_in, check_out]
                        withinGeofence:
                          type: boolean
                        distanceMeters:
                          type: integer
                          nullable: true
                        markedAt:
                          type: string
                          format: date-time
                        selfieFileKey:
                          type: string
                          nullable: true
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/hrms/attendance/reportees:
    get:
      operationId: getReporteesAttendance
      tags: [HRMS]
      summary: Get reportees' geo-attendance
      description: |
        Returns geo-attendance records for the authenticated officer's direct
        reports. HR admins see all employees in the tenant. Used by reporting
        officers to monitor team attendance and geofence compliance.
      responses:
        "200":
          description: Reportees attendance records (max 100)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        employeeId:
                          type: string
                          format: uuid
                        date:
                          type: string
                          format: date
                        checkType:
                          type: string
                          enum: [check_in, check_out]
                        withinGeofence:
                          type: boolean
                        distanceMeters:
                          type: integer
                          nullable: true
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/hrms/office-locations:
    get:
      operationId: listOfficeLocations
      tags: [HRMS]
      summary: List office locations
      description: |
        Returns all configured office locations for the current tenant.
        Office locations define geofence boundaries for GPS-based attendance
        validation. Each location has coordinates and a radius in meters.
      responses:
        "200":
          description: List of office locations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        address:
                          type: string
                          nullable: true
                        latitude:
                          type: number
                          format: double
                        longitude:
                          type: number
                          format: double
                        radiusMeters:
                          type: integer
                        isActive:
                          type: boolean
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []
    post:
      operationId: createOfficeLocation
      tags: [HRMS]
      summary: Create an office location
      description: |
        Registers a new office location with GPS coordinates and geofence radius.
        Used to define the valid perimeter for geo-attendance check-ins. Radius
        must be between 50 and 5000 meters (default 200m).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, latitude, longitude]
              properties:
                name:
                  type: string
                  minLength: 1
                address:
                  type: string
                latitude:
                  type: number
                  format: double
                  minimum: -90
                  maximum: 90
                longitude:
                  type: number
                  format: double
                  minimum: -180
                  maximum: 180
                radiusMeters:
                  type: integer
                  minimum: 50
                  maximum: 5000
                  default: 200
      responses:
        "201":
          description: Office location created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  radiusMeters:
                    type: integer
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires hr_admin or super_admin
      security:
        - bearerAuth: []

  /v1/hrms/employees:
    get:
      operationId: listEmployees
      tags: [HRMS]
      summary: List employees
      description: |
        Returns a paginated list of employees for the current tenant.
        Supports filtering by department, designation, and status.
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
        - name: departmentId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [active, probation, suspended, retired, terminated]
        - name: search
          in: query
          description: Full-text search on name or employee code
          schema:
            type: string
      responses:
        "200":
          description: Paginated employee list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Employee"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/hrms/id-cards/me:
    get:
      operationId: getMyIdCard
      tags: [HRMS]
      summary: Get my digital ID card
      description: |
        Returns the authenticated employee's digital identity card including
        photo URL, QR code data, designation, and office details. Used by
        the mobile app to display the virtual ID card.
      responses:
        "200":
          description: Employee ID card data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdCard"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: ID card not yet generated
      security:
        - bearerAuth: []

  /v1/hrms/id-cards/verify:
    post:
      operationId: verifyIdCardQr
      tags: [HRMS]
      summary: Verify an ID card QR code
      description: |
        Verifies a scanned QR code from a digital employee ID card.
        Returns employee identity and current employment status.
        Used by security checkpoints and reception desks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qrPayload]
              properties:
                qrPayload:
                  type: string
                  description: Base64-encoded QR payload from the ID card
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  employee:
                    $ref: "#/components/schemas/Employee"
                  status:
                    type: string
                    enum: [active, expired, revoked]
        "400":
          description: Invalid QR payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
      security:
        - bearerAuth: []

  # ─── HRMS Gap Features: Compensation Planning ───────────────────────────

  /v1/hrms/compensation/plans:
    post:
      operationId: createCompensationPlan
      tags: [HRMS]
      summary: Create a compensation plan
      description: |
        Creates a compensation planning cycle for a financial year with a
        total budget envelope and guidelines. Used by HR to plan increments,
        bonuses, and pay revisions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, fy, budgetMinor]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                fy:
                  type: string
                  pattern: '^\d{4}-\d{2}$'
                  description: Financial year (e.g. "2025-26")
                budgetMinor:
                  type: integer
                  minimum: 0
                  description: Total budget in paise
                guidelines:
                  type: object
                  additionalProperties: true
                  description: Guidelines key-value map
      responses:
        "201":
          description: Plan created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      fy:
                        type: string
                      budgetMinor:
                        type: integer
                      status:
                        type: string
                        enum: [draft]
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires hr_admin, super_admin, or hr_officer
      security:
        - bearerAuth: []
    get:
      operationId: listCompensationPlans
      tags: [HRMS]
      summary: List compensation plans
      description: |
        Returns compensation plans for the current tenant, ordered by creation
        date descending. Limited to 50 results.
      responses:
        "200":
          description: List of compensation plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        fy:
                          type: string
                        budget_minor:
                          type: integer
                        status:
                          type: string
                        created_at:
                          type: string
                          format: date-time
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires hr_admin, super_admin, hr_officer, manager, or employee
      security:
        - bearerAuth: []

  /v1/hrms/compensation/plans/{id}/model:
    post:
      operationId: modelCompensationPlan
      tags: [HRMS]
      summary: Generate compensation model recommendations
      description: |
        Runs a simplified compensation modelling scenario for the specified plan.
        Returns increment recommendations based on plan budget.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Model recommendations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      planId:
                        type: string
                        format: uuid
                      model:
                        type: string
                      recommendations:
                        type: array
                        items:
                          type: object
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires hr_admin, super_admin, or hr_officer
        "404":
          description: Plan not found
      security:
        - bearerAuth: []

  # ─── HRMS Gap Features: Learning Management System ─────────────────────

  /v1/hrms/lms/courses:
    post:
      operationId: createLmsCourse
      tags: [HRMS]
      summary: Create an LMS course
      description: |
        Creates a training course in the Learning Management System. Courses
        can be marked as mandatory for specific roles (compliance training).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 32
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  maxLength: 2000
                durationHours:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  default: 1
                skillsGained:
                  type: array
                  items:
                    type: string
                  default: []
                mandatoryForRoles:
                  type: array
                  items:
                    type: string
                  default: []
      responses:
        "201":
          description: Course created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      code:
                        type: string
                      name:
                        type: string
                      durationHours:
                        type: integer
                      skillsGained:
                        type: array
                        items:
                          type: string
                      mandatoryForRoles:
                        type: array
                        items:
                          type: string
                      status:
                        type: string
                        enum: [active]
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires hr_admin, super_admin, or hr_officer
      security:
        - bearerAuth: []
    get:
      operationId: listLmsCourses
      tags: [HRMS]
      summary: List active LMS courses
      description: |
        Returns all active courses available for enrollment. Limited to 100 results.
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        code:
                          type: string
                        name:
                          type: string
                        duration_hours:
                          type: integer
                        skills_gained:
                          type: array
                          items:
                            type: string
                        mandatory_for_roles:
                          type: array
                          items:
                            type: string
                        status:
                          type: string
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires hr_admin, super_admin, hr_officer, manager, or employee
      security:
        - bearerAuth: []

  /v1/hrms/lms/courses/{id}/enroll:
    post:
      operationId: enrollInCourse
      tags: [HRMS]
      summary: Enroll an employee in a course
      description: |
        Enrolls an employee into the specified LMS course. Idempotent — enrolling
        an already-enrolled employee is a no-op.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeId]
              properties:
                employeeId:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Enrollment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      courseId:
                        type: string
                        format: uuid
                      employeeId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [enrolled]
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires hr_admin, super_admin, hr_officer, manager, or employee
      security:
        - bearerAuth: []

  /v1/hrms/lms/enrollments/{id}/complete:
    post:
      operationId: completeEnrollment
      tags: [HRMS]
      summary: Mark an enrollment as completed
      description: |
        Marks a course enrollment as completed, optionally recording a score.
        Used by HR admins to confirm course completion.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                score:
                  type: number
                  minimum: 0
                  maximum: 100
      responses:
        "200":
          description: Enrollment marked as completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [completed]
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires hr_admin, super_admin, or hr_officer
      security:
        - bearerAuth: []

  /v1/hrms/lms/my-learning:
    get:
      operationId: getMyLearning
      tags: [HRMS]
      summary: Get my learning history
      description: |
        Returns the authenticated employee's course enrollments including
        status, completion date, and scores.
      responses:
        "200":
          description: Employee's learning records
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        code:
                          type: string
                        status:
                          type: string
                          enum: [enrolled, in_progress, completed]
                        enrolled_at:
                          type: string
                          format: date-time
                        completed_at:
                          type: string
                          format: date-time
                          nullable: true
                        score:
                          type: number
                          nullable: true
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires hr_admin, super_admin, hr_officer, manager, or employee
      security:
        - bearerAuth: []

  /v1/hrms/lms/compliance:
    get:
      operationId: getLmsCompliance
      tags: [HRMS]
      summary: Get LMS compliance report
      description: |
        Returns compliance status for mandatory training courses including
        completed and total enrolled counts per course.
      responses:
        "200":
          description: Compliance report
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        code:
                          type: string
                        name:
                          type: string
                        mandatory_for_roles:
                          type: array
                          items:
                            type: string
                        completed_count:
                          type: integer
                        total_enrolled:
                          type: integer
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires hr_admin, super_admin, or hr_officer
      security:
        - bearerAuth: []

  # ─── HRMS Gap Features: Skills Matrix ──────────────────────────────────

  /v1/hrms/skills/competencies:
    post:
      operationId: createCompetency
      tags: [HRMS]
      summary: Create a competency definition
      description: |
        Defines a competency/skill in the skills matrix with configurable
        proficiency levels.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                category:
                  type: string
                  maxLength: 64
                  default: technical
                proficiencyLevels:
                  type: array
                  items:
                    type: string
                  default: ["beginner", "intermediate", "advanced", "expert"]
      responses:
        "201":
          description: Competency created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      category:
                        type: string
                      proficiencyLevels:
                        type: array
                        items:
                          type: string
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires hr_admin, super_admin, or hr_officer
      security:
        - bearerAuth: []

  /v1/hrms/skills/role-matrix:
    post:
      operationId: upsertRoleCompetencyMapping
      tags: [HRMS]
      summary: Map a competency to a role
      description: |
        Creates or updates the required proficiency level for a competency
        within a role. Used to build the skills matrix (what skills each role
        needs at what level).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleRef, competencyId, requiredLevel]
              properties:
                roleRef:
                  type: string
                  maxLength: 128
                  description: Role identifier (designation code or role name)
                competencyId:
                  type: string
                  format: uuid
                requiredLevel:
                  type: string
                  maxLength: 32
                  description: Required proficiency level for this role
      responses:
        "201":
          description: Mapping created/updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      roleRef:
                        type: string
                      competencyId:
                        type: string
                        format: uuid
                      requiredLevel:
                        type: string
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires hr_admin, super_admin, or hr_officer
      security:
        - bearerAuth: []

  /v1/hrms/skills/assessments:
    post:
      operationId: createSkillAssessment
      tags: [HRMS]
      summary: Assess an employee's skill level
      description: |
        Records a skill/competency assessment for an employee. The assessed
        level is compared against the role-matrix to identify gaps.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeId, competencyId, assessedLevel]
              properties:
                employeeId:
                  type: string
                  format: uuid
                competencyId:
                  type: string
                  format: uuid
                assessedLevel:
                  type: string
                  maxLength: 32
                notes:
                  type: string
                  maxLength: 512
      responses:
        "201":
          description: Assessment recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      employeeId:
                        type: string
                        format: uuid
                      competencyId:
                        type: string
                        format: uuid
                      assessedLevel:
                        type: string
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires hr_admin, super_admin, or hr_officer
      security:
        - bearerAuth: []

  /v1/hrms/skills/gap-analysis:
    get:
      operationId: getSkillGapAnalysis
      tags: [HRMS]
      summary: Get skill gap analysis for an employee
      description: |
        Compares an employee's assessed skill levels against the required
        levels defined in the role-competency matrix. Returns each competency
        with required vs actual level.
      parameters:
        - name: employeeId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Gap analysis results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        competency:
                          type: string
                        required_level:
                          type: string
                        actual_level:
                          type: string
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires hr_admin, super_admin, hr_officer, manager, or employee
      security:
        - bearerAuth: []

  /v1/hrms/skills/team-heatmap:
    get:
      operationId: getSkillTeamHeatmap
      tags: [HRMS]
      summary: Get team skills heatmap
      description: |
        Returns aggregated skill assessment counts grouped by competency and
        proficiency level. Used to visualize team capabilities as a heatmap.
      parameters:
        - name: departmentId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Heatmap data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        competency:
                          type: string
                        assessed_level:
                          type: string
                        count:
                          type: integer
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires hr_admin, super_admin, or hr_officer
      security:
        - bearerAuth: []

  # ─── HRMS Gap Features: Succession Planning ────────────────────────────

  /v1/hrms/succession/critical-roles:
    post:
      operationId: createSuccessionPlan
      tags: [HRMS]
      summary: Mark a role as critical for succession
      description: |
        Registers a role as critical and creates a succession plan entry.
        Critical roles without ready nominees surface in the risk report.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleRef]
              properties:
                roleRef:
                  type: string
                  maxLength: 128
                  description: Role identifier (designation code)
                departmentId:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Succession plan created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      roleRef:
                        type: string
                      isCritical:
                        type: boolean
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires hr_admin, super_admin, or hr_officer
      security:
        - bearerAuth: []

  /v1/hrms/succession/nominees:
    post:
      operationId: addSuccessionNominee
      tags: [HRMS]
      summary: Add a succession nominee
      description: |
        Adds an employee as a potential successor for a critical role.
        Includes readiness assessment and optional development plan.
        Upserts on (tenant, plan, employee).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId, employeeId]
              properties:
                planId:
                  type: string
                  format: uuid
                employeeId:
                  type: string
                  format: uuid
                readiness:
                  type: string
                  enum: [now, 1yr, 2yr, 3yr]
                  default: 1yr
                developmentPlan:
                  type: string
                  maxLength: 2000
      responses:
        "201":
          description: Nominee added/updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      planId:
                        type: string
                        format: uuid
                      employeeId:
                        type: string
                        format: uuid
                      readiness:
                        type: string
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires hr_admin, super_admin, or hr_officer
      security:
        - bearerAuth: []

  /v1/hrms/succession/pipeline:
    get:
      operationId: getSuccessionPipeline
      tags: [HRMS]
      summary: Get succession pipeline overview
      description: |
        Returns all critical roles with nominee counts and ready-now counts.
        Provides a high-level view of succession bench strength.
      responses:
        "200":
          description: Pipeline data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        role_ref:
                          type: string
                        department_id:
                          type: string
                          format: uuid
                          nullable: true
                        nominee_count:
                          type: integer
                        ready_now:
                          type: integer
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires hr_admin, super_admin, or hr_officer
      security:
        - bearerAuth: []

  /v1/hrms/succession/risk:
    get:
      operationId: getSuccessionRisk
      tags: [HRMS]
      summary: Get succession risk report
      description: |
        Returns critical roles that have ZERO ready-now nominees, indicating
        a succession risk. These roles need immediate attention.
      responses:
        "200":
          description: At-risk roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        role_ref:
                          type: string
                        department_id:
                          type: string
                          format: uuid
                          nullable: true
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires hr_admin, super_admin, or hr_officer
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Procurement Service
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/procurement/indents:
    post:
      operationId: createIndent
      tags: [Procurement]
      summary: Create a purchase indent
      description: |
        Creates a purchase indent (material requisition) from a department.
        The indent enters the approval workflow and, once approved, can be
        converted to a purchase order. Links to budget head for fund availability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIndentRequest"
      responses:
        "202":
          description: Indent creation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires procurement_officer
      security:
        - bearerAuth: []

  /v1/procurement/purchase-orders:
    post:
      operationId: createPurchaseOrder
      tags: [Procurement]
      summary: Create a purchase order
      description: |
        Creates a purchase order against an approved indent and selected vendor.
        Includes line items with quantities, rates, and delivery schedule.
        Links to the sanction for fund commitment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePurchaseOrderRequest"
      responses:
        "202":
          description: PO creation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires procurement_officer or procurement_admin
      security:
        - bearerAuth: []

  /v1/procurement/grn:
    post:
      operationId: createGrn
      tags: [Procurement]
      summary: Record goods received
      description: |
        Records a Goods Received Note (GRN) against a purchase order.
        Triggers stock entry creation and enables bill processing for the
        received quantity. Supports partial receipts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGrnRequest"
      responses:
        "202":
          description: GRN accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires store_keeper or procurement_officer
      security:
        - bearerAuth: []

  /v1/procurement/vendors:
    get:
      operationId: listVendors
      tags: [Procurement]
      summary: List registered vendors
      description: |
        Returns a paginated list of registered vendors/suppliers for the tenant.
        Includes vendor rating, categories, and compliance status (GST, PAN).
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          description: Search by vendor name or GSTIN
          schema:
            type: string
      responses:
        "200":
          description: Paginated vendor list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Vendor"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Tenant Service
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/settings:
    get:
      operationId: getTenantSettings
      tags: [Tenant]
      summary: Get tenant settings
      description: |
        Returns all configuration settings for the current tenant including
        locale, timezone, fiscal year start, enabled modules, and branding.
      responses:
        "200":
          description: Tenant settings object
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
                    description: Key-value settings map
        "401":
          description: Missing or invalid bearer token
      security:
        - bearerAuth: []
    put:
      operationId: upsertTenantSetting
      tags: [Tenant]
      summary: Create or update a setting
      description: |
        Creates or updates a single tenant configuration setting.
        Only tenant_admin and super_admin roles can modify settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key:
                  type: string
                  description: Setting key (dot-notation, e.g. "locale.timezone")
                  examples: ["locale.timezone", "finance.fiscal_year_start", "branding.logo_url"]
                value:
                  description: Setting value (string, number, boolean, or object)
      responses:
        "202":
          description: Setting update accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires tenant_admin or super_admin
      security:
        - bearerAuth: []

  /v1/tenant/plans:
    get:
      operationId: listTenantPlans
      tags: [Tenant]
      summary: List available plans
      description: |
        Returns the list of subscription plans available for upgrade/downgrade.
        Includes feature entitlements, user limits, and pricing for each plan.
      responses:
        "200":
          description: Available plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                          examples: ["Small Office", "PSU", "Govt Department"]
                        maxUsers:
                          type: integer
                        modules:
                          type: array
                          items:
                            type: string
                        priceMonthlyPaise:
                          type: integer
                          description: Monthly price in paise
        "401":
          description: Missing or invalid bearer token
      security:
        - bearerAuth: []

  /v1/tenant/usage:
    get:
      operationId: getTenantUsage
      tags: [Tenant]
      summary: Get usage dashboard
      description: |
        Returns current resource usage for the tenant including active users,
        storage consumption, API call counts, and queue message volume.
        Used by the admin dashboard to show quota utilization.
      responses:
        "200":
          description: Usage metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  activeUsers:
                    type: integer
                  maxUsers:
                    type: integer
                  storageUsedBytes:
                    type: integer
                    format: int64
                  storageMaxBytes:
                    type: integer
                    format: int64
                  apiCallsThisMonth:
                    type: integer
                  plan:
                    type: string
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires tenant_admin
      security:
        - bearerAuth: []

  /v1/tenant/subscription/upgrade:
    post:
      operationId: upgradePlan
      tags: [Tenant]
      summary: Upgrade subscription plan
      description: |
        Initiates a plan upgrade for the tenant. Prorates charges for the
        remaining billing period. Takes effect immediately for feature access;
        billing adjustment appears on the next invoice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId:
                  type: string
                  format: uuid
                  description: Target plan ID to upgrade to
      responses:
        "202":
          description: Upgrade request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error (e.g. downgrade not allowed via this endpoint)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires tenant_admin or super_admin
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Admin Service
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/admin/feature-flags/manage:
    get:
      operationId: listFeatureFlags
      tags: [Admin]
      summary: List feature flags
      description: |
        Returns all feature flags for the tenant including their current state,
        rollout percentage, and targeting rules.
      parameters:
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Feature flags list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FeatureFlag"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires super_admin
      security:
        - bearerAuth: []
    post:
      operationId: createFeatureFlag
      tags: [Admin]
      summary: Create a feature flag
      description: |
        Creates a new feature flag. Flags start disabled by default.
        Supports percentage rollouts and user/role targeting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeatureFlagRequest"
      responses:
        "202":
          description: Flag creation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires super_admin
      security:
        - bearerAuth: []

  /v1/admin/feature-flags/manage/{id}/kill:
    post:
      operationId: killFeatureFlag
      tags: [Admin]
      summary: Kill switch — disable flag immediately
      description: |
        Emergency kill switch that immediately disables a feature flag for all
        users. Use during incidents to disable problematic features without
        a full deployment.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Kill switch activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires super_admin
        "404":
          description: Feature flag not found
      security:
        - bearerAuth: []

  /v1/admin/webhooks:
    get:
      operationId: listWebhooks
      tags: [Admin]
      summary: List webhooks
      description: |
        Returns configured webhook endpoints for the tenant. Webhooks deliver
        real-time event notifications for configured event types.
      parameters:
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Webhook list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Webhook"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires tenant_admin
      security:
        - bearerAuth: []
    post:
      operationId: createWebhook
      tags: [Admin]
      summary: Create a webhook
      description: |
        Registers a new webhook endpoint. The URL will receive POST requests
        with event payloads. Supports HMAC signature verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookRequest"
      responses:
        "202":
          description: Webhook creation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires tenant_admin
      security:
        - bearerAuth: []

  /v1/admin/data-export:
    post:
      operationId: requestDataExport
      tags: [Admin]
      summary: Request a data export
      description: |
        Initiates an asynchronous full or partial data export for the tenant.
        Generates a downloadable archive (ZIP) containing CSV/JSON files.
        Notifies via webhook and email when ready.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              properties:
                format:
                  type: string
                  enum: [csv, json]
                modules:
                  type: array
                  items:
                    type: string
                  description: Modules to export (empty = all)
                fromDate:
                  type: string
                  format: date
                toDate:
                  type: string
                  format: date
      responses:
        "202":
          description: Export job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires tenant_admin or super_admin
      security:
        - bearerAuth: []

  /v1/admin/scheduled-jobs:
    get:
      operationId: listScheduledJobs
      tags: [Admin]
      summary: List scheduled jobs
      description: |
        Returns all configured scheduled/cron jobs for the tenant.
        Includes last run time, next scheduled run, and status.
      parameters:
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Scheduled jobs list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScheduledJob"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires super_admin
      security:
        - bearerAuth: []

  /v1/admin/platform-config:
    get:
      operationId: getPlatformConfig
      tags: [Admin]
      summary: Get platform configuration
      description: |
        Returns the full platform configuration including controllable settings
        (cache TTL, rate limits, log level, notifications) and read-only
        infrastructure parameters (database, Redis, queue, auth, encryption).
      responses:
        "200":
          description: Platform configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  controllable:
                    type: object
                    properties:
                      cacheTtl:
                        type: object
                        additionalProperties:
                          type: integer
                        description: Per-service cache TTL in seconds
                      rateLimits:
                        type: object
                        properties:
                          perMinute:
                            type: integer
                          burstMax:
                            type: integer
                      logLevel:
                        type: string
                        enum: [debug, info, warn, error]
                      debugModeUntil:
                        type: string
                        format: date-time
                        nullable: true
                      notifications:
                        type: object
                        properties:
                          emailProvider:
                            type: string
                          smsProvider:
                            type: string
                          emailFrom:
                            type: string
                            format: email
                          smsFrom:
                            type: string
                  infrastructure:
                    type: object
                    properties:
                      database:
                        type: object
                        properties:
                          host:
                            type: string
                          port:
                            type: integer
                          databases:
                            type: integer
                          poolMode:
                            type: string
                          maxConnections:
                            type: integer
                          rlsEnabled:
                            type: boolean
                      redis:
                        type: object
                        properties:
                          url:
                            type: string
                          status:
                            type: string
                      queue:
                        type: object
                        properties:
                          driver:
                            type: string
                          endpoint:
                            type: string
                          region:
                            type: string
                      auth:
                        type: object
                        properties:
                          provider:
                            type: string
                          algorithm:
                            type: string
                          realm:
                            type: string
                          audienceConfigured:
                            type: boolean
                      pgbouncer:
                        type: object
                        properties:
                          configured:
                            type: boolean
                          port:
                            type: integer
                          poolMode:
                            type: string
                          maxClientConn:
                            type: integer
                          defaultPoolSize:
                            type: integer
                      encryption:
                        type: object
                        properties:
                          piiAtRest:
                            type: boolean
                          mfaAtRest:
                            type: boolean
                          algorithm:
                            type: string
                      storage:
                        type: object
                        properties:
                          driver:
                            type: string
                          bucket:
                            type: string
                          endpoint:
                            type: string
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires platform_admin or super_admin
      security:
        - bearerAuth: []
    patch:
      operationId: patchPlatformConfig
      tags: [Admin]
      summary: Update controllable platform settings
      description: |
        Partially updates the controllable platform configuration. Only provided
        fields are updated; omitted fields remain unchanged. Supports cache TTL
        overrides, rate limit tuning, log level changes, and notification settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                cacheTtl:
                  type: object
                  additionalProperties:
                    type: integer
                    minimum: 5
                    maximum: 3600
                  description: Per-service cache TTL overrides (seconds)
                rateLimits:
                  type: object
                  properties:
                    perMinute:
                      type: integer
                      minimum: 10
                    burstMax:
                      type: integer
                      minimum: 5
                logLevel:
                  type: string
                  enum: [debug, info, warn, error]
                debugModeUntil:
                  type: string
                  format: date-time
                  nullable: true
                  description: ISO timestamp for auto-reverting debug mode (null = off)
                notifications:
                  type: object
                  properties:
                    emailProvider:
                      type: string
                    smsProvider:
                      type: string
                    emailFrom:
                      type: string
                      format: email
                    smsFrom:
                      type: string
      responses:
        "200":
          description: Updated controllable config
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    examples: ["updated"]
                  controllable:
                    type: object
                    description: Full controllable config after patch
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires platform_admin or super_admin
      security:
        - bearerAuth: []

  /v1/admin/platform-config/debug-mode:
    post:
      operationId: enableDebugMode
      tags: [Admin]
      summary: Enable time-limited debug mode
      description: |
        Enables debug-level logging for a specified duration. Automatically
        reverts to the previous log level when the duration expires. Useful
        for live-debugging production issues without a redeployment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                durationMinutes:
                  type: integer
                  minimum: 5
                  maximum: 60
                  default: 15
                  description: Duration in minutes before auto-revert
      responses:
        "200":
          description: Debug mode enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    examples: ["debug_enabled"]
                  until:
                    type: string
                    format: date-time
                    description: ISO timestamp when debug mode expires
                  durationMinutes:
                    type: integer
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires platform_admin or super_admin
      security:
        - bearerAuth: []

  /v1/admin/platform-config/gateway:
    get:
      operationId: getGatewayConfig
      tags: [Admin]
      summary: Get gateway service configuration
      description: |
        Returns the current runtime configuration of the API gateway service
        including JWT edge verification mode, upstream timeouts, circuit breaker
        settings, rate limits, and body size limits. Proxied via internal API
        to the gateway service.
      responses:
        "200":
          description: Gateway configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Current gateway runtime config
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires platform_admin or super_admin
        "502":
          description: Gateway service unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
    patch:
      operationId: patchGatewayConfig
      tags: [Admin]
      summary: Update gateway configuration
      description: |
        Partially updates the gateway service runtime configuration. Changes
        take effect immediately without restart. Proxied to the gateway's
        internal config endpoint. Only provided fields are updated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                jwtEdgeVerify:
                  type: string
                  enum: ["true", "audit", "off"]
                  description: |
                    JWT verification mode at edge: "true" = reject invalid tokens,
                    "audit" = log but allow, "off" = skip verification
                upstreamTimeoutMs:
                  type: integer
                  minimum: 1000
                  maximum: 120000
                  description: Upstream service timeout in milliseconds
                cbFailureThreshold:
                  type: integer
                  minimum: 1
                  maximum: 50
                  description: Circuit breaker failure count before opening
                cbRecoveryMs:
                  type: integer
                  minimum: 1000
                  maximum: 300000
                  description: Circuit breaker recovery period in milliseconds
                rateLimitMax:
                  type: integer
                  minimum: 10
                  maximum: 100000
                  description: Global rate limit (requests per window)
                rateLimitTenantMax:
                  type: integer
                  minimum: 10
                  maximum: 10000
                  description: Per-tenant rate limit (requests per window)
                authRateLimitMax:
                  type: integer
                  minimum: 3
                  maximum: 1000
                  description: Auth endpoint rate limit (login/token requests per window)
                bodyLimitBytes:
                  type: integer
                  minimum: 1024
                  maximum: 52428800
                  description: Maximum request body size in bytes (1KB–50MB)
      responses:
        "200":
          description: Gateway config updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    examples: ["updated"]
                  data:
                    type: object
                    description: Updated gateway config
        "400":
          description: Validation error (invalid values or unknown fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires platform_admin or super_admin
        "502":
          description: Gateway service unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Identity Service — SCIM 2.0 (RFC 7643/7644)
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/identity/scim/ServiceProviderConfig:
    get:
      operationId: scimServiceProviderConfig
      tags: [Identity]
      summary: SCIM Service Provider Configuration
      description: |
        Returns the SCIM 2.0 service provider configuration describing
        supported capabilities (patch, filter, bulk, etc.). Public endpoint
        — no authentication required.
      security: []
      responses:
        "200":
          description: SCIM ServiceProviderConfig resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimServiceProviderConfig"

  /v1/identity/scim/Users:
    get:
      operationId: scimListUsers
      tags: [Identity]
      summary: List SCIM users
      description: |
        Returns a paginated list of users in SCIM 2.0 format. Supports basic
        SCIM filter syntax (e.g. `userName eq "user@example.com"`).
        Used by external IdPs (Azure AD, Okta) for provisioning sync.
      parameters:
        - name: filter
          in: query
          description: "SCIM filter expression (e.g. `userName eq \"user@example.com\"`)"
          schema:
            type: string
        - name: startIndex
          in: query
          description: 1-based index of the first result (default 1)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: count
          in: query
          description: Maximum number of results (default 50, max 200)
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: SCIM ListResponse containing user resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
        "401":
          description: Missing or invalid SCIM bearer token
        "503":
          description: SCIM is not configured (SCIM_BEARER_TOKEN not set)
      security:
        - scimBearerToken: []
    post:
      operationId: scimCreateUser
      tags: [Identity]
      summary: Create (provision) a SCIM user
      description: |
        Creates a new user from an external IdP provisioning request.
        Maps SCIM User attributes to the internal user model. The user
        is created with status "active" and can authenticate immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScimCreateUserRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
          description: Missing required field (userName/email)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "401":
          description: Missing or invalid SCIM bearer token
        "503":
          description: SCIM is not configured
      security:
        - scimBearerToken: []

  /v1/identity/scim/Users/{id}:
    get:
      operationId: scimGetUser
      tags: [Identity]
      summary: Get a SCIM user by ID
      description: |
        Returns a single user resource in SCIM 2.0 format.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: SCIM User resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
          description: Invalid UUID format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "401":
          description: Missing or invalid SCIM bearer token
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "503":
          description: SCIM is not configured
      security:
        - scimBearerToken: []
    put:
      operationId: scimReplaceUser
      tags: [Identity]
      summary: Replace (full update) a SCIM user
      description: |
        Replaces all mutable attributes of a user. Maps SCIM User fields to
        internal attributes (email, name, active status).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScimReplaceUserRequest"
      responses:
        "200":
          description: User replaced successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
          description: Invalid UUID format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "401":
          description: Missing or invalid SCIM bearer token
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "503":
          description: SCIM is not configured
      security:
        - scimBearerToken: []
    patch:
      operationId: scimPatchUser
      tags: [Identity]
      summary: Patch (partial update) a SCIM user
      description: |
        Applies partial updates using SCIM PatchOp semantics. Commonly used
        by IdPs to deactivate users (`active: false`) during deprovisioning.
        Supports `replace` operations on `active`, `userName`, and `name.formatted`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScimPatchRequest"
      responses:
        "200":
          description: User patched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
          description: Invalid UUID format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "401":
          description: Missing or invalid SCIM bearer token
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "503":
          description: SCIM is not configured
      security:
        - scimBearerToken: []
    delete:
      operationId: scimDeleteUser
      tags: [Identity]
      summary: Delete (deprovision) a SCIM user
      description: |
        Soft-deletes a user by setting status to "disabled". The user can no
        longer authenticate but the record is retained for audit purposes.
        SCIM DELETE maps to deactivation, not hard-delete.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: User deactivated successfully (no content)
        "400":
          description: Invalid UUID format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "401":
          description: Missing or invalid SCIM bearer token
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "503":
          description: SCIM is not configured
      security:
        - scimBearerToken: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Audit Service — Audit Plans
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/audit/plans:
    post:
      operationId: createAuditPlan
      tags: [Audit]
      summary: Create an audit plan
      description: |
        Creates a top-level audit plan (annual/periodic audit coverage for an
        area). The plan starts in `draft` status. Write goes through CQRS:
        the route validates and publishes a command; a consumer persists the
        row and emits an audit event. Returns 202 Accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuditPlanRequest"
      responses:
        "202":
          description: Audit plan creation accepted for async processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires audit_officer, audit_admin, or super_admin
      security:
        - bearerAuth: []
    get:
      operationId: listAuditPlans
      tags: [Audit]
      summary: List audit plans
      description: |
        Returns audit plans (the `plan.audit_plans` top-level entities, not
        the per-department plan-items sub-resource — see GET /v1/audit/plan
        for that) for the caller's tenant, read-through Redis cache.
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: List of audit plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditPlan"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires audit_officer, audit_admin, finance_admin, or super_admin
      security:
        - bearerAuth: []

  /v1/audit/plans/{id}/items:
    post:
      operationId: createAuditPlanItem
      tags: [Audit]
      summary: Add a plan item (department/unit schedule) to an audit plan
      description: |
        Schedules an audited department/unit against a parent audit plan.
        Write goes through CQRS (command → consumer → DB + audit event).
        Returns 202 Accepted.
      parameters:
        - name: id
          in: path
          required: true
          description: Audit plan ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuditPlanItemRequest"
      responses:
        "202":
          description: Plan item creation accepted for async processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires audit_officer, audit_admin, or super_admin
      security:
        - bearerAuth: []

  /v1/audit/plans/{id}/start:
    patch:
      operationId: startAuditPlan
      tags: [Audit]
      summary: Start an audit plan
      description: |
        Transitions an audit plan out of `draft` into an active state.
        Invalidates the cached plan entry. Write goes through CQRS (command →
        consumer). Returns 202 Accepted.
      parameters:
        - name: id
          in: path
          required: true
          description: Audit plan ID
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Plan start accepted for async processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires audit_officer, audit_admin, or super_admin
      security:
        - bearerAuth: []

  /v1/audit/plans/{id}:
    get:
      operationId: getAuditPlan
      tags: [Audit]
      summary: Get an audit plan by ID
      description: |
        Returns a single audit plan by ID, scoped to the caller's tenant,
        read-through Redis cache.
      parameters:
        - name: id
          in: path
          required: true
          description: Audit plan ID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Audit plan found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPlan"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires audit_officer, audit_admin, finance_admin, or super_admin
        "404":
          description: Plan not found (or not visible to this tenant)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/audit/plan:
    get:
      operationId: listAuditPlanItems
      tags: [Audit]
      summary: List audit plan items (per-department schedule)
      description: |
        Returns the flattened list of audit plan ITEMS (per-department/unit
        scheduled audits) across the caller's tenant — distinct from
        GET /v1/audit/plans, which lists the parent plan entities themselves.
        Read-through Redis cache.
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: List of audit plan items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPlanItemList"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires audit_officer, audit_admin, finance_admin, or super_admin
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Citizen Service
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/citizen/requests:
    post:
      operationId: fileCitizenRequest
      tags: [Citizen]
      summary: File a citizen request
      description: |
        Submits a new citizen service request (grievance, RTI, general request).
        The request enters the department workflow for assignment and resolution.
        Citizens receive an acknowledgement number for tracking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCitizenRequestBody"
      responses:
        "202":
          description: Request filed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
      security:
        - bearerAuth: []
    get:
      operationId: listMyCitizenRequests
      tags: [Citizen]
      summary: List my requests
      description: |
        Returns the authenticated citizen's filed requests with current status.
        Includes request type, department, assigned officer, and last update.
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_progress, resolved, rejected, escalated]
        - name: type
          in: query
          schema:
            type: string
            enum: [grievance, rti, general, suggestion]
      responses:
        "200":
          description: Paginated citizen requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CitizenRequest"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          description: Missing or invalid bearer token
      security:
        - bearerAuth: []

  /v1/citizen/requests/{id}/timeline:
    get:
      operationId: getCitizenRequestTimeline
      tags: [Citizen]
      summary: Get request status timeline
      description: |
        Returns the full timeline of status changes and actions for a citizen
        request. Shows when the request was filed, assigned, responded to,
        escalated, or resolved — with timestamps and actor names.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Request timeline
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                    format: uuid
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp:
                          type: string
                          format: date-time
                        action:
                          type: string
                          enum: [filed, assigned, responded, escalated, resolved, rejected, reopened]
                        actor:
                          type: string
                        note:
                          type: string
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Request not found or does not belong to current user
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Stock Service
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/stock/items/barcode/{code}:
    get:
      operationId: lookupItemByBarcode
      tags: [Stock]
      summary: Lookup item by barcode
      description: |
        Retrieves stock item details by scanning a barcode (EAN-13, Code-128, QR).
        Used by mobile app barcode scanner for quick item identification
        in stores and warehouses.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: Barcode value (EAN-13, Code-128, or QR content)
      responses:
        "200":
          description: Stock item details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockItem"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: No item found for this barcode
      security:
        - bearerAuth: []

  /v1/stock/entries:
    post:
      operationId: createStockEntry
      tags: [Stock]
      summary: Record a goods receipt
      description: |
        Records stock entry (goods receipt into store/warehouse). Links to
        GRN or purchase order. Updates item quantity and valuation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, warehouseId, type]
              properties:
                type:
                  type: string
                  enum: [receipt, return, transfer_in]
                warehouseId:
                  type: string
                  format: uuid
                grnId:
                  type: string
                  format: uuid
                items:
                  type: array
                  items:
                    type: object
                    required: [itemId, quantity]
                    properties:
                      itemId:
                        type: string
                        format: uuid
                      quantity:
                        type: integer
                        minimum: 1
                      batchNo:
                        type: string
                      expiryDate:
                        type: string
                        format: date
      responses:
        "202":
          description: Stock entry accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires store_keeper
      security:
        - bearerAuth: []

  /v1/stock/physical:
    post:
      operationId: createStockAdjustment
      tags: [Stock]
      summary: Physical stock adjustment
      description: |
        Records a physical stock count adjustment (increase or decrease).
        Used during periodic physical verification to reconcile system
        quantities with actual counts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouseId, items, reason]
              properties:
                warehouseId:
                  type: string
                  format: uuid
                reason:
                  type: string
                  enum: [physical_count, damage, expired, theft, correction]
                notes:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required: [itemId, systemQty, physicalQty]
                    properties:
                      itemId:
                        type: string
                        format: uuid
                      systemQty:
                        type: integer
                      physicalQty:
                        type: integer
      responses:
        "202":
          description: Adjustment accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires store_keeper or inventory_admin
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Inventory Service — Batch Quarantine & Recall (SVC-055)
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/inventory/batches/{id}/quarantine:
    patch:
      operationId: quarantineBatch
      tags: [Inventory]
      summary: Quarantine a batch
      description: |
        Places a batch into quarantine status, preventing it from being issued
        or consumed until further review. Used when quality concerns are raised.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Reason for quarantining the batch
      responses:
        "202":
          description: Quarantine command accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires inventory_manager, inventory_admin, or qc_inspector
        "404":
          description: Batch not found
      security:
        - bearerAuth: []

  /v1/inventory/batches/{id}/recall:
    post:
      operationId: recallBatch
      tags: [Inventory]
      summary: Recall a batch
      description: |
        Initiates a product recall for a batch. Records the severity level
        and triggers downstream notifications for affected parties.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, severity]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Reason for the recall
                severity:
                  type: string
                  enum: [low, medium, high, critical]
                  description: Severity level of the recall
      responses:
        "202":
          description: Recall command accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires inventory_manager or inventory_admin
        "404":
          description: Batch not found
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Helpdesk Service
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/helpdesk/tickets:
    post:
      operationId: createTicket
      tags: [Helpdesk]
      summary: Create a support ticket
      description: |
        Creates a new internal helpdesk ticket for IT support, facilities,
        or administrative requests. Tickets are auto-assigned based on category
        and SLA timers start immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, category, description]
              properties:
                subject:
                  type: string
                  maxLength: 200
                category:
                  type: string
                  enum: [it_hardware, it_software, network, facilities, admin, other]
                priority:
                  type: string
                  enum: [low, medium, high, critical]
                  default: medium
                description:
                  type: string
                  maxLength: 5000
                attachments:
                  type: array
                  items:
                    type: string
                    format: uri
                  maxItems: 5
      responses:
        "202":
          description: Ticket creation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
      security:
        - bearerAuth: []
    get:
      operationId: listTickets
      tags: [Helpdesk]
      summary: List helpdesk tickets
      description: |
        Returns helpdesk tickets visible to the authenticated user.
        Regular users see their own tickets; helpdesk agents see assigned tickets;
        admins see all tickets.
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
        - name: status
          in: query
          schema:
            type: string
            enum: [open, in_progress, waiting_on_user, resolved, closed]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated ticket list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        subject:
                          type: string
                        status:
                          type: string
                        priority:
                          type: string
                        category:
                          type: string
                        assignedTo:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        slaBreached:
                          type: boolean
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          description: Missing or invalid bearer token
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Workflow Service — BPMN Import/Export
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/workflow/definitions/import:
    post:
      operationId: importBpmnDefinition
      tags: [Workflow]
      summary: Import a BPMN 2.0 XML file as a workflow definition
      description: |
        Parses a BPMN 2.0 XML document and creates a new workflow definition
        in draft status. Extracts process nodes (tasks, gateways, events) and
        sequence flows, mapping them to the internal definition schema (nodes +
        edges). The imported definition can then be reviewed, edited, and
        deployed through the standard definition lifecycle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [xml]
              properties:
                xml:
                  type: string
                  minLength: 50
                  maxLength: 1000000
                  description: BPMN 2.0 XML content
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Optional name override (defaults to process name from XML)
      responses:
        "201":
          description: Definition created from BPMN import
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      code:
                        type: string
                      name:
                        type: string
                      version:
                        type: integer
                      status:
                        type: string
                        enum: [draft]
                      nodeCount:
                        type: integer
                      edgeCount:
                        type: integer
        "400":
          description: Invalid BPMN XML (no process elements found or malformed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires workflow_admin, super_admin, or tenant_admin
      security:
        - bearerAuth: []

  /v1/workflow/definitions/{id}/bpmn:
    get:
      operationId: exportBpmnDefinition
      tags: [Workflow]
      summary: Export a workflow definition as BPMN 2.0 XML
      description: |
        Converts an internal workflow definition (nodes + edges) into a valid
        BPMN 2.0 XML document. The response is served as application/xml with
        a Content-Disposition header for download.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Workflow definition ID
      responses:
        "200":
          description: BPMN 2.0 XML document
          content:
            application/xml:
              schema:
                type: string
                description: Valid BPMN 2.0 XML
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Attachment filename for download
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires workflow_admin, super_admin, or tenant_admin
        "404":
          description: Workflow definition not found
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Workflow Service — Decision Tables
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/workflow/decision-tables:
    post:
      operationId: createDecisionTable
      tags: [Workflow]
      summary: Create a decision table
      description: |
        Creates a new decision table in draft status. Decision tables encode
        business rules as structured input → output mappings with configurable
        hit policies (first match, collect all, unique). Used by the workflow
        engine to evaluate conditions at runtime without hardcoded logic.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDecisionTableRequest"
      responses:
        "201":
          description: Decision table created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DecisionTable"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires workflow_admin, super_admin, or tenant_admin
      security:
        - bearerAuth: []
    get:
      operationId: listDecisionTables
      tags: [Workflow]
      summary: List decision tables
      description: |
        Returns a paginated list of decision tables for the current tenant.
        Includes both draft and active tables.
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: Paginated list of decision tables
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DecisionTable"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires workflow_user, workflow_admin, super_admin, or tenant_admin
      security:
        - bearerAuth: []

  /v1/workflow/decision-tables/{id}:
    get:
      operationId: getDecisionTable
      tags: [Workflow]
      summary: Get a decision table by ID
      description: |
        Returns the full decision table definition including inputs, outputs,
        rules, and current status (draft or active).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Decision table details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DecisionTable"
        "400":
          description: Invalid UUID format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: Decision table not found
      security:
        - bearerAuth: []
    put:
      operationId: updateDecisionTable
      tags: [Workflow]
      summary: Update a draft decision table
      description: |
        Updates a decision table that is still in draft status. Once deployed
        (active), the table becomes immutable — create a new version instead.
        Supports partial updates (only supplied fields are changed).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDecisionTableRequest"
      responses:
        "200":
          description: Decision table updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DecisionTable"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires workflow_admin, super_admin, or tenant_admin
        "404":
          description: Decision table not found
        "409":
          description: Decision table is not in draft status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/workflow/decision-tables/{id}/deploy:
    post:
      operationId: deployDecisionTable
      tags: [Workflow]
      summary: Deploy (activate) a decision table
      description: |
        Deploys a decision table, changing its status from draft to active.
        Once active, the table is available for evaluation by the workflow
        engine. An already-active table returns 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Decision table deployed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DecisionTable"
                  message:
                    type: string
                    examples: ["decision table deployed"]
        "400":
          description: Invalid UUID format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires workflow_admin, super_admin, or tenant_admin
        "404":
          description: Decision table not found
        "409":
          description: Decision table already active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/workflow/decision-tables/{id}/evaluate:
    post:
      operationId: evaluateDecisionTable
      tags: [Workflow]
      summary: Evaluate a decision table against a context
      description: |
        Test-evaluates a decision table by running the rules engine against the
        provided context object. Returns the matching output(s) based on the
        table's hit policy. Useful for testing rules before deploying or for
        ad-hoc runtime evaluation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [context]
              properties:
                context:
                  type: object
                  additionalProperties: true
                  description: Key-value pairs matching the table's input definitions
      responses:
        "200":
          description: Evaluation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    description: Matched output(s) — single object for "first"/"unique" hit policy, array for "collect"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires workflow_user, workflow_admin, super_admin, or tenant_admin
        "404":
          description: Decision table not found
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Workflow Service — Analytics
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/workflow/analytics/summary:
    get:
      operationId: getWorkflowAnalyticsSummary
      tags: [Workflow]
      summary: Get workflow analytics summary
      description: |
        Returns aggregate workflow metrics for the current tenant including
        instance counts by status, average cycle time, SLA breach rate, and
        escalation count. Read-only reporting endpoint.
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: Analytics summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/WorkflowAnalyticsSummary"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires workflow_user, workflow_admin, super_admin, or tenant_admin
      security:
        - bearerAuth: []

  /v1/workflow/analytics/bottlenecks:
    get:
      operationId: getWorkflowBottlenecks
      tags: [Workflow]
      summary: Get workflow bottleneck report
      description: |
        Identifies bottleneck nodes by average dwell time and pending task
        counts. Groups by workflow node and role to highlight where work
        is accumulating. Useful for process optimization.
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: Bottleneck report
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/WorkflowBottlenecksReport"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
