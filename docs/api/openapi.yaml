openapi: "3.1.0"
info:
  title: CivitasOne Suite API
  version: "0.2.0"
  description: |
    Unified API for CivitasOne government ERP suite.
    All endpoints require Bearer token authentication (Keycloak OIDC).
    Write operations return 202 Accepted (CQRS async processing).
  contact:
    name: CivitasOne Platform Team
    url: https://civitasone.app/docs/api
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: https://api.civitasone.app
    description: Production
  - url: http://localhost:8080
    description: Local Development
security:
  - bearerAuth: []
tags:
  - name: Finance
    description: Budget, bills, payments, GL, sanctions
  - name: HRMS
    description: Employees, leave, attendance, payroll
  - name: Procurement
    description: Indents, vendors, purchase orders, GRN
  - name: Tenant
    description: Settings, plans, subscriptions, quotas
  - name: Admin
    description: Feature flags, webhooks, scheduled jobs, data export
  - name: Identity
    description: Authentication, sessions, devices
  - name: Citizen
    description: Requests, RTI, grievances
  - name: Stock
    description: Items, barcode lookup, goods receipt
  - name: Inventory
    description: Batch management, quarantine, recall
  - name: Helpdesk
    description: Tickets, SLA, escalation
  - name: Audit
    description: Events, compliance, observations
  - name: Payroll
    description: Pay runs, F&F settlements, tax computation
  - name: Workflow
    description: Decision tables, workflow instances, tasks
  - name: Analytics
    description: Query engine, joins, calculated fields, drill-through
  - name: Visitor
    description: Visitor management, badge printing, document scanning, turnstile control
  - name: Meeting
    description: Meeting lifecycle, committees, agenda, minutes, decisions, action items, voting
  - name: Inspection
    description: Inspection lifecycle, universe, risk scoring, sync, evidence, findings
  - name: Catalogue
    description: Products, rates, eligibility rules, bundles
  - name: CDP
    description: Golden profiles, identity resolution, event ingestion, segments, data stewardship
  - name: Loyalty
    description: Loyalty programs, member enrolments, points accrual/redemption, tiers
  - name: Journey
    description: Multi-step campaign journeys, triggers, step executions, profile enrollments
  - name: Field
    description: Field tasks, GPS-verified visits, route optimization, offline sync
  - name: Recommendation
    description: Next-best-action recommendations, cross-sell matrix, account health, feedback
  - name: AI Agent
    description: Agent definitions, chat conversations, copilot turns, guardrails, AI governance
  - name: Notification
    description: Email deliverability — sending domains, DKIM/SPF/DMARC authentication health
  - name: CRM
    description: Contacts and leads, configurable lead field rules, lead completeness scoring
  - name: Knowledge
    description: Documents, articles, records, full-text search

paths:
  # ═══════════════════════════════════════════════════════════════════════════
  # Finance Service
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/finance/bills:
    post:
      operationId: createBill
      tags: [Finance]
      summary: Create a new bill
      description: |
        Creates a bill (expenditure voucher) for a vendor or contractor payment.
        The bill enters the approval workflow and, once sanctioned, becomes eligible
        for payment processing. Amount is in paise (minor units).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBillRequest"
      responses:
        "202":
          description: Bill creation accepted for async processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires finance_officer or finance_admin
      security:
        - bearerAuth: []
    get:
      operationId: listBills
      tags: [Finance]
      summary: List bills
      description: |
        Returns a paginated list of bills for the current tenant.
        Supports filtering by status, vendor, and date range.
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, pending, sanctioned, paid, cancelled]
        - name: vendorId
          in: query
          schema:
            type: string
            format: uuid
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Paginated list of bills
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bill"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/finance/sanctions:
    post:
      operationId: createSanction
      tags: [Finance]
      summary: Create a budget sanction
      description: |
        Creates an expenditure sanction against a budget head. The sanction
        reserves funds and must be approved by a checker (maker-checker pattern)
        before bills can be drawn against it. Amount in paise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSanctionRequest"
      responses:
        "202":
          description: Sanction creation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires finance_officer or finance_admin
      security:
        - bearerAuth: []

  /v1/finance/payments:
    post:
      operationId: initiatePayment
      tags: [Finance]
      summary: Initiate a payment
      description: |
        Initiates payment processing for a sanctioned bill. Supports PFMS
        integration for government treasury payments and NEFT/RTGS for direct
        bank transfers. Amount in paise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "202":
          description: Payment initiation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires finance_admin
      security:
        - bearerAuth: []

  /v1/finance/gl/entries:
    get:
      operationId: listGlEntries
      tags: [Finance]
      summary: List General Ledger entries
      description: |
        Returns double-entry GL journal entries for the current tenant.
        Each transaction produces balanced debit/credit entries. Supports
        filtering by account, date range, and voucher reference.
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
        - name: accountId
          in: query
          schema:
            type: string
            format: uuid
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          schema:
            type: string
            format: date
        - name: voucherRef
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated GL entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/GlEntry"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/finance/budgets:
    post:
      operationId: createBudget
      tags: [Finance]
      summary: Create a budget allocation
      description: |
        Creates a budget allocation for a financial year against a Head of Account.
        Allocations define the spending ceiling for a budget head. Amount in paise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBudgetRequest"
      responses:
        "202":
          description: Budget creation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role — requires finance_officer or finance_admin
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # HRMS Service
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/hrms/leave-applications:
    post:
      operationId: applyLeave
      tags: [HRMS]
      summary: Apply for leave
      description: |
        Submits a leave application for an employee (CQRS write — returns 202,
        the command is processed asynchronously). Roles: hr_admin, hr_officer,
        super_admin, manager, or employee (self-service).

        Synchronous validation before acceptance (`enforceCcsLeaveRules`):
        - Engagement eligibility gate — engagement types not entitled to the
          salaried leave scheme (e.g. consultant, third_party) are rejected
          (422 `LEAVE_NOT_ELIGIBLE`).
        - Overlap guard — dates that overlap an existing pending/approved
          application for the same employee are rejected (422 `LEAVE_OVERLAP`).
        - CCS(Leave) Rules — balance checks, minimum service requirements, and
          leave-type-specific policies (CL/EL/HPL/ML etc) (422
          `LEAVE_RULE_VIOLATION`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyLeaveRequest"
      responses:
        "202":
          description: Leave application accepted (queued for processing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: |
            Referenced entity not found — `ALLOC_NOT_FOUND` (leave allocation),
            `LEAVE_TYPE_NOT_FOUND`, or `EMP_NOT_FOUND` (employee).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            Business rule violation. Possible `code` values:
            - `LEAVE_NOT_ELIGIBLE` — engagement type does not accrue leave.
            - `LEAVE_OVERLAP` — the requested dates overlap an existing
              pending/approved leave application for the same employee.
            - `LEAVE_RULE_VIOLATION` — CCS(Leave) Rules violation (balance,
              minimum service, leave-type policy).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/hrms/leave-requests:
    post:
      operationId: applyLeaveRequest
      tags: [HRMS]
      summary: Apply for leave (alias of /v1/hrms/leave-applications)
      description: |
        Alias route for `POST /v1/hrms/leave-applications`. Identical behaviour,
        request body, validation, and responses — provided for clients that use
        the `leave-requests` naming. See `/v1/hrms/leave-applications` for full
        validation semantics (engagement eligibility, overlap guard, CCS Rules).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyLeaveRequest"
      responses:
        "202":
          description: Leave application accepted (queued for processing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
        "404":
          description: |
            Referenced entity not found — `ALLOC_NOT_FOUND` (leave allocation),
            `LEAVE_TYPE_NOT_FOUND`, or `EMP_NOT_FOUND` (employee).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            Business rule violation. Possible `code` values:
            - `LEAVE_NOT_ELIGIBLE` — engagement type does not accrue leave.
            - `LEAVE_OVERLAP` — the requested dates overlap an existing
              pending/approved leave application for the same employee.
            - `LEAVE_RULE_VIOLATION` — CCS(Leave) Rules violation (balance,
              minimum service, leave-type policy).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/hrms/attendance/locks:
    get:
      operationId: listAttendanceLocks
      tags: [HRMS]
      summary: List attendance period locks
      description: |
        Returns the attendance period locks for the tenant (DEF-AT-001,
        T&A-ATM-0247). Each entry records whether an attendance month
        (`period`, YYYY-MM) is `locked` (payroll cut-off) or `open`, along with
        who locked it and when. Roles: hr_admin, hr_officer, super_admin, manager.
      responses:
        "200":
          description: Current attendance period locks
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AttendanceLock"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []
    post:
      operationId: lockAttendancePeriod
      tags: [HRMS]
      summary: Lock an attendance period (payroll cut-off)
      description: |
        Locks an attendance month so that attendance marking and regularisation
        for any date in that month are rejected (422 `ATTENDANCE_LOCKED`) until
        the period is re-opened (DEF-AT-001, T&A-ATM-0247). CQRS write — returns
        202, processed asynchronously. Elevated roles only: hr_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeriodLockRequest"
      responses:
        "202":
          description: Lock command accepted (queued for processing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error (period must be YYYY-MM)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []

  /v1/hrms/attendance/locks/unlock:
    post:
      operationId: unlockAttendancePeriod
      tags: [HRMS]
      summary: Re-open a locked attendance period
      description: |
        Re-opens a previously locked attendance month, allowing attendance
        marking and regularisation for that month again (DEF-AT-001,
        T&A-ATM-0247). CQRS write — returns 202, processed asynchronously.
        Elevated roles only: hr_admin, super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeriodLockRequest"
      responses:
        "202":
          description: Unlock command accepted (queued for processing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Validation error (period must be YYYY-MM)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Insufficient role
      security:
        - bearerAuth: []


  # ═══════════════════════════════════════════════════════════════════════════
  # HRMS Self-Service (Employee Portal)
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/hrms/me/profile:
    get:
      operationId: getMyProfile
      tags: [HRMS]
      summary: Get current employee's profile (self-service)
      description: |
        Returns the employee record linked to the authenticated user. Resolution
        strategy:
        1. Primary lookup by `userRef` matching the JWT `sub` claim (actorId).
        2. Fallback: if no `userRef` match, attempts to match by email from JWT
           claims. On success, auto-links the `userRef` for future fast lookups
           (solves the bootstrap problem where employees are seeded without
           `user_ref` populated).

        Any authenticated user can call this endpoint — no specific role required
        beyond a valid JWT. Returns the employee's own record only (tenant-scoped).
      responses:
        "200":
          description: Employee profile found and returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeProfile"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: |
            No employee record linked to the authenticated user (`NOT_FOUND`).
            Neither `userRef` nor email matched any employee in the tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/hrms/me/leave-balance:
    get:
      operationId: getMyLeaveBalance
      tags: [HRMS]
      summary: Get current employee's leave balance
      description: |
        Returns leave allocations for the authenticated employee, showing total,
        used, and remaining balance per leave type and financial year.
      responses:
        "200":
          description: Leave balance breakdown
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        leaveTypeId:
                          type: string
                          format: uuid
                        fy:
                          type: string
                          description: Financial year (e.g. "2025-26")
                        total:
                          type: integer
                          description: Total days allocated
                        balance:
                          type: integer
                          description: Remaining days
                        used:
                          type: integer
                          description: Days consumed
        "401":
          description: Missing or invalid bearer token
        "404":
          description: No employee record linked to user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/hrms/me/attendance:
    get:
      operationId: getMyAttendance
      tags: [HRMS]
      summary: Get current employee's attendance records
      description: |
        Returns attendance records for the authenticated employee. Supports
        pagination via `limit` and `offset` query parameters (defaults: limit=31,
        offset=0).
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 31
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Attendance records
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        status:
                          type: string
                          enum: [present, absent, half_day, leave, holiday, weekly_off]
                        inTime:
                          type: string
                          format: time
                          nullable: true
                        outTime:
                          type: string
                          format: time
                          nullable: true
        "401":
          description: Missing or invalid bearer token
        "404":
          description: No employee record linked to user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  /v1/hrms/me/leave-applications:
    get:
      operationId: getMyLeaveApplications
      tags: [HRMS]
      summary: Get current employee's leave applications
      description: |
        Returns all leave applications submitted by the authenticated employee,
        including pending, approved, and rejected applications.
      responses:
        "200":
          description: Leave applications list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        leaveTypeId:
                          type: string
                          format: uuid
                        fromDate:
                          type: string
                          format: date
                        toDate:
                          type: string
                          format: date
                        days:
                          type: integer
                          description: Number of days applied
                        status:
                          type: string
                          enum: [pending, approved, rejected, cancelled]
        "401":
          description: Missing or invalid bearer token
        "404":
          description: No employee record linked to user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Recruitment — New Endpoints (PRs #263–#286)
  # ═══════════════════════════════════════════════════════════════════════════

  /v1/hrms/candidates/{id}/resumes:
    post:
      operationId: uploadResumeVersion
      tags: [HRMS - Recruitment]
      summary: Upload a new resume version (R-RA-0087)
      responses:
        "201": { description: Resume version created }
        "422": { description: Invalid resume (MIME/size/IDOR) }
      security: [{ bearerAuth: [] }]
    get:
      operationId: listResumeVersions
      tags: [HRMS - Recruitment]
      summary: List resume versions for a candidate
      responses:
        "200": { description: Resume versions (newest first) }
      security: [{ bearerAuth: [] }]

  /v1/hrms/candidates/{id}/resumes/{resumeId}/activate:
    post:
      operationId: activateResumeVersion
      tags: [HRMS - Recruitment]
      summary: Make a resume version active
      responses:
        "200": { description: Resume activated }
        "404": { description: Resume version not found }
      security: [{ bearerAuth: [] }]

  /v1/hrms/applications/{id}/screening-overrides:
    post:
      operationId: requestScreeningOverride
      tags: [HRMS - Recruitment]
      summary: Request a maker-checker screening override (R-RA-0111)
      responses:
        "201": { description: Override request created (pending) }
        "409": { description: Override already pending or shortlist frozen }
        "422": { description: Invalid override (same decision / pending app) }
      security: [{ bearerAuth: [] }]
    get:
      operationId: listScreeningOverrides
      tags: [HRMS - Recruitment]
      summary: List screening override requests for an application
      responses:
        "200": { description: Override request list }
      security: [{ bearerAuth: [] }]

  /v1/hrms/screening-overrides/{reqId}/approve:
    post:
      operationId: approveScreeningOverride
      tags: [HRMS - Recruitment]
      summary: Approve + apply a screening override (checker)
      responses:
        "200": { description: Override approved, decision changed }
        "403": { description: SoD violation (requester/original screener) }
        "409": { description: Stale / not pending / version conflict }
      security: [{ bearerAuth: [] }]

  /v1/hrms/screening-overrides/{reqId}/reject:
    post:
      operationId: rejectScreeningOverride
      tags: [HRMS - Recruitment]
      summary: Reject a screening override (checker)
      responses:
        "200": { description: Override rejected }
        "403": { description: SoD violation }
      security: [{ bearerAuth: [] }]

  /v1/hrms/screening-overrides/{reqId}/cancel:
    post:
      operationId: cancelScreeningOverride
      tags: [HRMS - Recruitment]
      summary: Cancel a pending override (requester only)
      responses:
        "200": { description: Override cancelled }
      security: [{ bearerAuth: [] }]

  /v1/hrms/applications/{id}/rejection-notice:
    get:
      operationId: getRejectionNotice
      tags: [HRMS - Recruitment]
      summary: Candidate-safe rejection notice (R-RA-0118, no internal scores)
      responses:
        "200": { description: Allow-list projected notice }
      security: [{ bearerAuth: [] }]

  /v1/hrms/job-openings/{id}/rejection-policy:
    patch:
      operationId: setRejectionPolicy
      tags: [HRMS - Recruitment]
      summary: Set the per-vacancy disclosure policy for rejection reason
      responses:
        "200": { description: Policy updated }
      security: [{ bearerAuth: [] }]

  /v1/hrms/interviews/{id}/comms:
    post:
      operationId: sendInterviewComm
      tags: [HRMS - Recruitment]
      summary: Interview comm (invite/reminder/reschedule/cancel) (R-RA-0142)
      responses:
        "201": { description: Comm recorded (queued or stubbed) }
        "409": { description: Interview not commable / version conflict }
        "422": { description: Reschedule requires newDate+newTime }
      security: [{ bearerAuth: [] }]
    get:
      operationId: listInterviewComms
      tags: [HRMS - Recruitment]
      summary: List interview communications log
      responses:
        "200": { description: Comms list }
      security: [{ bearerAuth: [] }]

