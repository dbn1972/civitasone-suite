# ─────────────────────────────────────────────────────────────────────────────
# CivitasOne Suite — production docker-compose (generated, additive).
# Brings up infra (postgres, redis, keycloak, localstack) + all 31 HTTP
# services + their CQRS workers + queue + gateway + web.
#
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env up -d
#
# Secrets come from the env file ONLY — every required value uses ${VAR:?}
# so compose refuses to start if it is unset. No secret literals live here.
# Images are built from the repo-root Dockerfile (one per service via build
# args) and apps/web/Dockerfile. Set IMAGE_REGISTRY/IMAGE_TAG to use a registry.
# ─────────────────────────────────────────────────────────────────────────────

x-image-prefix: &image-prefix ${IMAGE_REGISTRY:-civitasone}

x-svc-defaults: &svc-defaults
  restart: unless-stopped
  networks: [civitasone]
  depends_on:
    postgres: { condition: service_healthy }
    pgbouncer: { condition: service_healthy }
    redis: { condition: service_healthy }
    localstack: { condition: service_healthy }

x-svc-env: &svc-env
  NODE_ENV: production
  BIND_HOST: 0.0.0.0
  REDIS_URL: redis://redis:6379
  QUEUE_DRIVER: sqs
  DB_VIA_PGBOUNCER: "true"
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
  AWS_S3_BUCKET: ${AWS_S3_BUCKET:-civitasone}
  JWT_ALGORITHM: RS256
  KEYCLOAK_URL: http://keycloak:8080
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:-civitasone}
  INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?}
  DEVICE_TRUST_SECRET: ${DEVICE_TRUST_SECRET:?}

services:

  postgres:
    image: postgres:16.4-bookworm
    restart: unless-stopped
    networks: [civitasone]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-civitasone}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/bootstrap/bootstrap.generated.sql:/docker-entrypoint-initdb.d/01-bootstrap.sql:ro
      - ./db/bootstrap/keycloak_bootstrap.sql:/docker-entrypoint-initdb.d/02-keycloak.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-civitasone}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-bookworm
    restart: unless-stopped
    networks: [civitasone]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.7
    restart: unless-stopped
    networks: [civitasone]
    environment:
      SERVICES: sqs,s3
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}
    volumes:
      - ./localstack-init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  pgbouncer:
    image: edoburu/pgbouncer:1.21.0
    restart: unless-stopped
    networks: [civitasone]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:?}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      DB_NAME: "*"
      AUTH_TYPE: md5
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "500"      # matches docs/architecture/CONNECTION-BUDGET.md
      DEFAULT_POOL_SIZE: "20"     # matches docs/architecture/CONNECTION-BUDGET.md
      LISTEN_PORT: "6432"
    ports:
      - "6432:6432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    networks: [civitasone]
    command: ["start", "--optimized", "--hostname-strict=false", "--http-enabled=true", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:?}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/civitasone-realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo done >&3 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  identity-service:
    <<: *svc-defaults
    image: ${IMAGE_REGISTRY:-civitasone}/identity-service:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: identity-service
        ENTRY: dist/index.js
        PORT: "3001"
    environment:
      <<: *svc-env
      PORT: "3001"
      DATABASE_URL: ${DATABASE_URL_IDENTITY:?per-service least-privilege DSN required (set DATABASE_URL for civitas_identity; do NOT use the cluster superuser)}
      MFA_ENC_KEY: ${MFA_ENC_KEY:?}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health >/dev/null 2>&1 || exit 1"]
