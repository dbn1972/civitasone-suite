# CivitasOne — unified dev environment.
# One command starts everything: LocalStack + Postgres 16 + Redis 7 + Keycloak 24.
# LocalStack init auto-creates all SQS queues on startup.
# Keycloak auto-imports the civitasone realm on first boot.
# All containers share civitasone-net; services address each other by container name.
#
# Start:    docker compose -p civitasone --env-file infra/.env -f infra/docker-compose.yml up -d
# Stop:     docker compose -p civitasone -f infra/docker-compose.yml down
# Logs:     docker compose -p civitasone -f infra/docker-compose.yml logs -f
#
# Endpoints (from host):
#   LocalStack (SQS/S3/SecretsManager)  http://localhost:4566
#   Postgres 16                          localhost:5435
#   PgBouncer (transaction pool)         localhost:6432
#   Redis 7                              localhost:6381
#   Keycloak 24 admin UI                 http://localhost:8180  (admin / civitas_kc_dev_pw)
#   Keycloak OIDC issuer                 http://localhost:8180/realms/civitasone
#   JWKS endpoint                        http://localhost:8180/realms/civitasone/protocol/openid-connect/certs
#
# Endpoints (container-to-container on civitasone-net):
#   LocalStack   civitasone-localstack:4566
#   Postgres     civitasone-postgres:5432
#   PgBouncer    civitasone-pgbouncer:6432
#   Redis        civitasone-redis:6379
#   Keycloak     civitasone-keycloak:8080

name: civitasone

services:

  localstack:
    image: localstack/localstack:3
    container_name: civitasone-localstack
    restart: unless-stopped
    environment:
      SERVICES: sqs,s3,secretsmanager
      DEBUG: 0
      PERSISTENCE: 1
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}
    ports:
      - "${LOCALSTACK_HOST_PORT:-4566}:4566"
    volumes:
      - localstackdata:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ./localstack-init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [civitasone]

  postgres:
    image: postgres:16-alpine
    container_name: civitasone-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "effective_cache_size=768MB", "-c", "work_mem=8MB", "-c", "max_connections=200", "-c", "log_min_duration_statement=200"]
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-civitas_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD must be set}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-civitas_admin} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [civitasone]

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    container_name: civitasone-pgbouncer
    restart: unless-stopped
    environment:
      # PERF-001: DB_HOST/DB_PORT (not DATABASE_URL) so the edoburu entrypoint
      # leaves DB_NAME unset and its auto-generated config gets a WILDCARD
      # `[databases] * = host=... port=...` entry (mirrors infra/pgbouncer/
      # pgbouncer.ini) — every one of the fleet's 65 civitas_* databases
      # resolves through it, forwarding each client's own role straight to
      # Postgres (no `user=` override, so RLS/tenant roles are preserved).
      #
      # The PREVIOUS `DATABASE_URL: .../postgres` form is what this container
      # ran with for the fix's entire "gap window": the entrypoint extracts
      # the URL's path segment ("postgres") as an EXPLICIT, non-wildcard
      # `[databases] postgres = ...` entry, so any client requesting a real
      # service database (civitas_finance, civitas_hrms, ...) would have been
      # rejected by PgBouncer with "database not configured" the moment
      # anything actually tried to route through it — i.e. PgBouncer being
      # "already running" (docker ps) never meant it was usable by the fleet.
      # Confirmed via `docker inspect` + reading the container's generated
      # /etc/pgbouncer/pgbouncer.ini before this fix; see
      # docs/architecture/CONNECTION-BUDGET.md.
      DB_HOST: civitasone-postgres
      DB_PORT: "5432"
      POOL_MODE: transaction
      # Budget: 132 PM2 processes (130 DB-backed) + up to 19 second "scanner"
      # (BYPASSRLS) pools (11 wired today), each capped at DB_POOL_MAX=5
      # client connections (ecosystem.config.js) => (130+19)×5 = 745 worst
      # case. 1000 leaves ~25% headroom. Exact figures come from
      # scripts/ops/lib/fleet-topology.mjs, not hand-counted — see
      # docs/architecture/CONNECTION-BUDGET.md.
      MAX_CLIENT_CONN: "1000"
      # Budget: 65 main (user,db) pools (svc+worker share one) + up to 19
      # scanner-role pools ≈ 84 distinct PgBouncer pools once every scanner
      # DSN is wired (11/19 today, => 76 pools today). 84 × default_pool_size=2
      # = 168 real backend connections to Postgres, vs. max_connections=200 —
      # ~32 headroom for admin/psql/direct migration scripts + Postgres's own
      # superuser_reserved_connections. See docs/architecture/
      # CONNECTION-BUDGET.md for why this is deliberately flat/conservative
      # rather than per-database-tuned (no production pg_stat_activity
      # telemetry exists yet to tune against).
      DEFAULT_POOL_SIZE: "2"
      MIN_POOL_SIZE: "1"
      RESERVE_POOL_SIZE: "1"
      # PERF-001: this container's PREVIOUS `AUTH_TYPE: trust` never actually
      # worked for any real service connection, independent of the wildcard
      # bug above — civitasone-postgres's pg_hba.conf has
      # `host all all all scram-sha-256` (every non-local connection needs a
      # real password), but trust-mode PgBouncer has no client password to
      # relay upstream, so every server-side login (regardless of which role)
      # failed auth. "PgBouncer is running" (docker ps) never meant a real
      # connection could get through it.
      #
      # Fix: auth_type=scram-sha-256 + auth_user/auth_query. PgBouncer keeps
      # ONE bootstrap credential (civitas_admin, below) to run auth_query
      # on demand against pg_authid for WHATEVER role is actually connecting
      # (finance_svc, hrms_svc, ...), fetches that role's real SCRAM secret,
      # and uses it for both the client handshake and the server-side login
      # AS THAT ROLE — verified end-to-end against an isolated PgBouncer
      # instance for finance_svc/hrms_svc/identity_svc (each landed on its
      # own database as its own role, not as civitas_admin) before this was
      # wired in here. This scales to all 65+ roles without a per-role
      # userlist.txt entry, and without re-provisioning PgBouncer when a new
      # service/role is added.
      DB_USER: ${POSTGRES_ADMIN_USER:-civitas_admin}
      DB_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD must be set}
      AUTH_TYPE: scram-sha-256
      AUTH_USER: ${POSTGRES_ADMIN_USER:-civitas_admin}
      AUTH_QUERY: "SELECT rolname, rolpassword FROM pg_authid WHERE rolname=$1"
      # PERF-001 fix-up: this container previously set neither
      # SERVER_RESET_QUERY nor SERVER_RESET_QUERY_ALWAYS — meaning DISCARD ALL
      # never ran between pooled-connection handoffs under POOL_MODE=transaction
      # (PgBouncer only runs server_reset_query unconditionally in session mode
      # by default), so any raw session-level SET/temp table/prepared statement
      # from a client would silently leak onto whichever client the pool handed
      # that backend connection to next. See infra/pgbouncer/pgbouncer.ini for
      # the live repro that found this.
      SERVER_RESET_QUERY: "DISCARD ALL"
      SERVER_RESET_QUERY_ALWAYS: "1"
    ports:
      - "${PGBOUNCER_HOST_PORT:-6432}:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [civitasone]

  redis:
    image: redis:7-alpine
    container_name: civitasone-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6381}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [civitasone]

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: civitasone-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://civitasone-postgres:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USER:-keycloak_svc}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD must be set}
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?KC_ADMIN_PASSWORD must be set}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: civitasone.65-2-205-201.nip.io
      KC_HOSTNAME_PATH: /auth
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: "true"
      KC_HTTP_ENABLED: true
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: true
      KC_LOG_LEVEL: warn
    ports:
      - "${KEYCLOAK_HOST_PORT:-8180}:8080"
    volumes:
      - ./keycloak/civitasone-realm.json:/opt/keycloak/data/import/civitasone-realm.json:ro
      - ./keycloak/themes/civitasone:/opt/keycloak/themes/civitasone:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /auth/health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && timeout 3 cat <&3 | grep -q 'UP' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks: [civitasone]

volumes:
  localstackdata:
  pgdata:
  redisdata:

networks:
  civitasone:
    name: civitasone-net
