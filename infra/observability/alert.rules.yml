groups:
  - name: civitasone.sqs.dlq
    rules:
      # Fires when a DLQ has been non-empty for 5+ minutes.
      # Severity: warning — first signal that a consumer has failed.
      - alert: DlqAnyMessage
        expr: aws_sqs_approximate_number_of_messages_visible{queue_name=~".*-dlq"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DLQ has messages: {{ $labels.queue_name }}"
          description: "{{ $value }} message(s) stuck in {{ $labels.queue_name }} for 5+ minutes."

      # Fires when a DLQ depth exceeds 10 for 10+ minutes.
      # Severity: warning — sustained consumer failure; needs investigation.
      - alert: DlqDepthHigh
        expr: aws_sqs_approximate_number_of_messages_visible{queue_name=~".*-dlq"} > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "DLQ depth high: {{ $labels.queue_name }}"
          description: "{{ $value }} messages in {{ $labels.queue_name }} for 10+ minutes — consumer may be degraded."

      # Fires when a DLQ exceeds 50 messages for 2+ minutes.
      # Severity: critical — possible runaway consumer failure or poison-pill storm.
      - alert: DlqDepthCritical
        expr: aws_sqs_approximate_number_of_messages_visible{queue_name=~".*-dlq"} > 50
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "DLQ depth critical: {{ $labels.queue_name }}"
          description: "{{ $value }} messages in {{ $labels.queue_name }} — possible runaway consumer failure."
