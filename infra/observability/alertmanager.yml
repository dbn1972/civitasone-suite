# Alertmanager configuration for CivitasOne.
# SMTP credentials and webhook URLs are injected via environment variables at
# deploy time — never hardcode secrets here.
#
# Required env vars (set in the host environment or docker-compose .env):
#   ALERTMANAGER_SMTP_HOST     e.g. smtp.example.gov.in:587
#   ALERTMANAGER_SMTP_FROM     e.g. alerts@civitasone.gov.in
#   ALERTMANAGER_SMTP_USERNAME e.g. alerts@civitasone.gov.in
#   ALERTMANAGER_SMTP_PASSWORD (injected from secret manager)
#   ALERTMANAGER_EMAIL_TO      e.g. ops-team@civitasone.gov.in
#   ALERTMANAGER_SLACK_WEBHOOK (optional) e.g. https://hooks.slack.com/...
#   PAGERDUTY_ROUTING_KEY      (injected from secret manager)

global:
  smtp_smarthost: ''
  smtp_from: ''
  smtp_auth_username: ''
  smtp_auth_password: ''
  smtp_require_tls: true
  resolve_timeout: 5m

# ── Routing tree ──────────────────────────────────────────────────────────────
route:
  receiver: ops-email
  group_by: ['alertname', 'service', 'tier']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Critical alerts page PagerDuty immediately
    - match:
        severity: critical
      receiver: pagerduty-critical
      group_wait: 10s
      repeat_interval: 30m

    # Warning-level alerts (high error rate) use default batching
    - match:
        severity: warning
      receiver: ops-email

# ── Receivers ────────────────────────────────────────────────────────────────
receivers:
  - name: ops-email
    email_configs:
      - to: ''
        send_resolved: true
        headers:
          Subject: '[CivitasOne] {{ .GroupLabels.alertname }} — {{ .Status | toUpper }}'
        html: |
          <h3>CivitasOne Alert: {{ .GroupLabels.alertname }}</h3>
          {{ range .Alerts }}
          <p><b>Status:</b> {{ .Status }}<br>
          <b>Service:</b> {{ .Labels.service }}{{ .Labels.job }}<br>
          <b>Tier:</b> {{ .Labels.tier }}<br>
          <b>Summary:</b> {{ .Annotations.summary }}<br>
          <b>Description:</b> {{ .Annotations.description }}<br>
          <b>Starts at:</b> {{ .StartsAt }}</p>
          {{ end }}

  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key: "${PAGERDUTY_ROUTING_KEY}"
        severity: critical
        description: '{{ .CommonAnnotations.summary }}'
        details:
          firing: '{{ .Alerts.Firing | len }}'
          description: '{{ .CommonAnnotations.description }}'

# ── Inhibition rules ─────────────────────────────────────────────────────────
# Suppress downstream alerts when the upstream service is already down.
inhibit_rules:
  - source_match:
      alertname: ServiceDown
    target_match_re:
      alertname: HighHttpErrorRate|ConsumerErrorRateHigh|DlqDepthHigh
    equal: ['job', 'instance']
