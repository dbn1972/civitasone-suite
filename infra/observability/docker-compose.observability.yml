# Observability stack — Loki + Promtail for PM2 log aggregation
# Usage: docker compose -f infra/observability/docker-compose.observability.yml up -d

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: civitasone-prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.4
    container_name: civitasone-loki
    ports:
      - "3100:3100"
    # 09-T5: use our config (built-in defaults + ruler enabled) and mount the
    # LogQL alert rules under the ruler's rule dir for the default ("fake")
    # tenant. The ruler evaluates loki-rules.yml and can forward to Alertmanager.
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./loki-rules.yml:/etc/loki/rules/fake/loki-rules.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.4
    container_name: civitasone-promtail
    volumes:
      - /var/log/civitasone:/var/log/civitasone:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.3.1
    container_name: civitasone-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PW:-civitas_grafana_dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
