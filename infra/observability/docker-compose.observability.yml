# Observability stack -- Prometheus + Alertmanager + Loki + Promtail + Grafana
# Usage: docker compose -f infra/observability/docker-compose.observability.yml up -d
#
# Required env vars (set in a .env file next to this file or injected at deploy time):
#   GRAFANA_ADMIN_PW           -- Grafana admin password
#   ALERTMANAGER_SMTP_HOST     -- SMTP server host:port (e.g. smtp.example.gov.in:587)
#   ALERTMANAGER_SMTP_FROM     -- From address for alert emails
#   ALERTMANAGER_SMTP_USERNAME -- SMTP auth username
#   ALERTMANAGER_SMTP_PASSWORD -- SMTP auth password (from secret manager)
#   ALERTMANAGER_EMAIL_TO      -- Recipient address for alert emails

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: civitasone-prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: civitasone-alertmanager
    ports:
      - "9093:9093"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost:9093
    environment:
      ALERTMANAGER_SMTP_HOST: "${ALERTMANAGER_SMTP_HOST}"
      ALERTMANAGER_SMTP_FROM: "${ALERTMANAGER_SMTP_FROM}"
      ALERTMANAGER_SMTP_USERNAME: "${ALERTMANAGER_SMTP_USERNAME}"
      ALERTMANAGER_SMTP_PASSWORD: "${ALERTMANAGER_SMTP_PASSWORD}"
      ALERTMANAGER_EMAIL_TO: "${ALERTMANAGER_EMAIL_TO}"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.4
    container_name: civitasone-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./loki-rules.yml:/etc/loki/rules/fake/loki-rules.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.4
    container_name: civitasone-promtail
    volumes:
      - /var/log/civitasone:/var/log/civitasone:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.3.1
    container_name: civitasone-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PW}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  grafana-data:
