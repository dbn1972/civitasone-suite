# OPS-1 (09-T1): Prometheus scrape + alerting for CivitasOne.
# Scrapes the per-service /metrics endpoints (service_up, http_requests_total,
# consumer_errors_total, outbox_relay_failures_total, dlq_messages_total).
#
# /metrics is guarded by METRICS_TOKEN or internal-IP allowlist. As of 09-T2 the
# guard is centralized in packages/observability (registerOpsRoutes) so EVERY
# service enforces it, not just the gateway. Prometheus on the internal network
# is allowed by source IP (the targets below are internal); to scrape over an
# untrusted path, set METRICS_TOKEN on the services and add an x-metrics-token
# bearer/authorization header to these scrape jobs instead.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []   # wire an Alertmanager target here in prod

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels: { service: gateway }

  # Domain services bind 127.0.0.1 on their own ports; list them so consumer
  # error / DLQ / relay-failure metrics are scraped per service.
  - job_name: civitasone-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:3001"  # identity
          - "host.docker.internal:3007"  # finance
          - "host.docker.internal:3030"  # queue
        labels: { tier: backend }
