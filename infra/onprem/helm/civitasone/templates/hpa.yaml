{{- $root := . -}}
{{- range $name, $cfg := .Values.services }}
{{- $auto := default $root.Values.autoscaling $cfg.autoscaling }}
{{- if and $auto.enabled (ne $cfg.http false) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $root.Release.Name }}-{{ $name }}
  labels:
    {{- include "civitasone.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $root.Release.Name }}-{{ $name }}
  minReplicas: {{ $auto.minReplicas }}
  maxReplicas: {{ $auto.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $auto.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
{{- if $root.Values.gateway.enabled }}
{{- $gwAuto := default $root.Values.autoscaling $root.Values.gateway.autoscaling }}
{{- if $gwAuto.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $root.Release.Name }}-gateway
  labels:
    {{- include "civitasone.labels" $root | nindent 4 }}
    app.kubernetes.io/name: gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $root.Release.Name }}-gateway
  minReplicas: {{ $gwAuto.minReplicas }}
  maxReplicas: {{ $gwAuto.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $gwAuto.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
