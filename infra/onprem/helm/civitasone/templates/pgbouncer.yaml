{{- if .Values.pgbouncer.enabled }}
{{/*
Connection_Proxy (PgBouncer) — multiplexes per-service database connections
in transaction-pooling mode at port 6432. Every DB_Backed_Service points its
DATABASE_HOST/DATABASE_PORT (see values.yaml's top-level `config`) at this
Service instead of connecting directly to Postgres port 5432.

Upstream target resolution (Req 5.6): when `pgbouncer.databaseHost` is left
empty (the default), this pgbouncer instance targets the bundled `postgresql`
sub-chart's generated service name (`{{ .Release.Name }}-postgresql`)
automatically via Helm release-name templating — no manual reconfiguration
needed when that sub-chart is enabled. Set `pgbouncer.databaseHost` explicitly
to point at an external/unbundled Postgres instance instead.
*/}}
{{- $upstreamHost := .Values.pgbouncer.databaseHost | default (printf "%s-postgresql" .Release.Name) }}
{{- $upstreamPort := .Values.pgbouncer.databasePort | default "5432" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-pgbouncer
  labels:
    {{- include "civitasone.labels" . | nindent 4 }}
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: connection-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pgbouncer
      app.kubernetes.io/component: connection-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgbouncer
        app.kubernetes.io/component: connection-proxy
    spec:
      serviceAccountName: {{ include "civitasone.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pgbouncer
          image: "edoburu/pgbouncer:1.21.0"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: pgbouncer
              containerPort: 6432
          env:
            - name: DATABASE_HOST
              value: {{ $upstreamHost | quote }}
            - name: DATABASE_PORT
              value: {{ $upstreamPort | quote }}
            - name: DATABASE_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-civitasone-config
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DATABASE_PASSWORD
            - name: POOL_MODE
              value: {{ .Values.pgbouncer.poolMode | quote }}
            - name: MAX_CLIENT_CONN
              value: {{ .Values.pgbouncer.maxClientConn | quote }}
            - name: DEFAULT_POOL_SIZE
              value: {{ .Values.pgbouncer.defaultPoolSize | quote }}
            - name: AUTH_TYPE
              value: "md5"
          readinessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-pgbouncer
  labels:
    {{- include "civitasone.labels" . | nindent 4 }}
    app.kubernetes.io/name: pgbouncer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: connection-proxy
  ports:
    - name: pgbouncer
      port: 6432
      targetPort: pgbouncer
      protocol: TCP
{{- end }}
