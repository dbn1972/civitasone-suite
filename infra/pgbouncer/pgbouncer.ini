# PERF-001: canonical reference config for a standalone/bare-metal PgBouncer
# deployment (listens directly on 6432 — contrast with infra/docker-compose.yml's
# containerized `pgbouncer` service, which is driven by env vars via the
# edoburu/pgbouncer image's entrypoint and is published to host port 6432
# from the container's internal 5432). Keep both, plus infra/onprem/helm/
# civitasone/values.yaml's `pgbouncer:` block, numerically in sync — see
# docs/architecture/CONNECTION-BUDGET.md for the math these values satisfy.
#
# auth_type=trust does NOT work against this fleet's Postgres: pg_hba.conf
# requires scram-sha-256 for every non-local connection, so trust-mode
# PgBouncer has no password to present upstream and every server-side login
# fails, regardless of the `[databases]` wildcard above being correct.
# auth_user/auth_query let PgBouncer fetch each connecting role's real SCRAM
# secret from pg_authid on demand — verified end-to-end (finance_svc,
# hrms_svc, identity_svc each authenticated as themselves, reached their own
# database) — instead of needing a userlist.txt entry per service role
# (there are 65+; a static per-role file would be exactly the kind of
# hand-maintained list that let PERF-001 regress once already). auth_file
# still needs exactly ONE bootstrap credential: auth_user's own. Provision
# userlist.txt (NOT checked into git) alongside this file as:
#   "civitas_admin" "<the real civitas_admin password for this environment>"
[databases]
* = host=civitasone-postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_user = civitas_admin
auth_query = SELECT rolname, rolpassword FROM pg_authid WHERE rolname=$1
auth_file = userlist.txt
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 2
min_pool_size = 1
reserve_pool_size = 1
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits
