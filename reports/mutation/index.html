WayMatch(\"PO-1\", \"GRN-1\", {\n      poAmountMinor: 1000000n,\n      grnAmountMinor: 1050000n, // 5% over\n      invoiceMinor: 1050000n,\n    }, 10)).not.toThrow();\n  });\n});\n\ndescribe(\"payments/domain — assertValidPaymentMode()\", () => {\n  it(\"passes for valid modes\", () => {\n    expect(() => assertValidPaymentMode(\"NEFT\")).not.toThrow();\n    expect(() => assertValidPaymentMode(\"RTGS\")).not.toThrow();\n    expect(() => assertValidPaymentMode(\"IMPS\")).not.toThrow();\n    expect(() => assertValidPaymentMode(\"DBT\")).not.toThrow();\n    expect(() => assertValidPaymentMode(\"PFMS\")).not.toThrow();\n    expect(() => assertValidPaymentMode(\"cheque\")).not.toThrow();\n  });\n\n  it(\"throws for invalid mode\", () => {\n    expect(() => assertValidPaymentMode(\"bitcoin\")).toThrow(DomainError);\n    try { assertValidPaymentMode(\"UPI\"); } catch (e) {\n      expect((e as DomainError).code).toBe(\"INVALID_PAYMENT_MODE\");\n    }\n  });\n});\n\ndescribe(\"payments/domain — assertBillPassed()\", () => {\n  it(\"passes for status 'passed'\", () => {\n    expect(() => assertBillPassed(\"passed\")).not.toThrow();\n  });\n\n  it(\"throws for other statuses\", () => {\n    expect(() => assertBillPassed(\"draft\")).toThrow(DomainError);\n    expect(() => assertBillPassed(\"submitted\")).toThrow();\n    try { assertBillPassed(\"draft\"); } catch (e) {\n      expect((e as DomainError).code).toBe(\"BILL_NOT_PASSED\");\n    }\n  });\n});\n\ndescribe(\"payments/domain — nextStage()\", () => {\n  it(\"section → accounts\", () => {\n    expect(nextStage(\"section\")).toBe(\"accounts\");\n  });\n\n  it(\"accounts → pay\", () => {\n    expect(nextStage(\"accounts\")).toBe(\"pay\");\n  });\n\n  it(\"throws STAGE_TERMINAL for pay\", () => {\n    expect(() => nextStage(\"pay\")).toThrow(DomainError);\n    try { nextStage(\"pay\"); } catch (e) {\n      expect((e as DomainError).code).toBe(\"STAGE_TERMINAL\");\n    }\n  });\n});\n"},"services/payroll-service/tests/tax-engine-coverage.test.ts":{"tests":[{"id":"369","name":"tax/engine — config registry isTaxConfigLoaded returns true after setup"},{"id":"370","name":"tax/engine — config registry getTaxConfig returns config for registered regime/year"},{"id":"371","name":"tax/engine — config registry getTaxConfig throws UnconfiguredFyError for unknown year"},{"id":"372","name":"tax/engine — config registry slabsFor returns slabs array"},{"id":"373","name":"tax/engine — config registry stdDeduction returns correct value"},{"id":"374","name":"tax/engine — computeTax() new regime FY2025 zero tax below 4L taxable"},{"id":"375","name":"tax/engine — computeTax() new regime FY2025 zero tax at 12L due to 87A rebate"},{"id":"376","name":"tax/engine — computeTax() new regime FY2025 positive tax above 12L"},{"id":"377","name":"tax/engine — computeTax() new regime FY2025 surcharge kicks in above 50L"},{"id":"378","name":"tax/engine — computeTax() new regime FY2025 slabBreakdown has entries"},{"id":"379","name":"tax/engine — computeTax() old regime zero tax below 2.5L"},{"id":"380","name":"tax/engine — computeTax() old regime 5% slab at 5L"},{"id":"381","name":"tax/engine — computeTax() old regime positive tax at 10L"},{"id":"382","name":"tax/engine — monthlyTdsMinor() returns 0 for income below exemption"},{"id":"383","name":"tax/engine — monthlyTdsMinor() returns positive for high income"},{"id":"384","name":"tax/engine — hraExemptionMinor() returns least of 3 legs (metro)"},{"id":"385","name":"tax/engine — hraExemptionMinor() uses 40% for non-metro"},{"id":"386","name":"tax/engine — hraExemptionMinor() handles zero rent (b becomes 0)"},{"id":"387","name":"tax/engine — annualTaxFromTaxableMinor() returns tax in paise"},{"id":"388","name":"tax/engine — trueUpTdsMinor() spreads balance over remaining months"},{"id":"389","name":"tax/engine — trueUpTdsMinor() deducts full residual in final month"},{"id":"390","name":"tax/engine — trueUpTdsMinor() returns 0 when already deducted enough"},{"id":"391","name":"tax/engine — fyStartYearForMonth() Apr-Mar FY: 2025-04 → 2025"},{"id":"392","name":"tax/engine — fyStartYearForMonth() 2026-03 → 2025 (March is still FY2025-26)"},{"id":"393","name":"tax/engine — fyStartYearForMonth() 2025-01 → 2024 (Jan is FY2024-25)"}],"source":"/**\n * Tax engine coverage tests — computeTax, monthlyTds, HRA exemption, true-up.\n */\nimport { describe, it, expect } from \"vitest\";\nimport {\n  computeTax, monthlyTdsMinor, hraExemptionMinor, annualTaxFromTaxableMinor,\n  monthlyTdsFromTaxableMinor, trueUpTdsMinor, fyStartYearForMonth,\n  getTaxConfig, slabsFor, stdDeduction, isTaxConfigLoaded, UnconfiguredFyError,\n} from \"../src/modules/tax/engine.js\";\n\ndescribe(\"tax/engine — config registry\", () => {\n  it(\"isTaxConfigLoaded returns true after setup\", () => {\n    expect(isTaxConfigLoaded()).toBe(true);\n  });\n\n  it(\"getTaxConfig returns config for registered regime/year\", () => {\n    const cfg = getTaxConfig(\"new\", 2025);\n    expect(cfg.slabs.length).toBeGreaterThan(0);\n    expect(cfg.stdDeduction).toBe(75000);\n  });\n\n  it(\"getTaxConfig throws UnconfiguredFyError for unknown year\", () => {\n    expect(() => getTaxConfig(\"new\", 1990)).toThrow(UnconfiguredFyError);\n  });\n\n  it(\"slabsFor returns slabs array\", () => {\n    expect(slabsFor(\"new\", 2025).length).toBeGreaterThan(0);\n  });\n\n  it(\"stdDeduction returns correct value\", () => {\n    expect(stdDeduction(\"old\", 2025)).toBe(50000);\n    expect(stdDeduction(\"new\", 2025)).toBe(75000);\n  });\n});\n\ndescribe(\"tax/engine — computeTax() new regime FY2025\", () => {\n  it(\"zero tax below 4L taxable\", () => {\n    const r = computeTax(300000, \"new\", 2025);\n    expect(r.totalTax).toBe(0);\n  });\n\n  it(\"zero tax at 12L due to 87A rebate\", () => {\n    // 12L taxable: slab tax = 80000, but rebateIncomeCap=12L → rebate applies\n    const r = computeTax(1200000, \"new\", 2025);\n    expect(r.rebate).toBeGreaterThan(0);\n    expect(r.totalTax).toBe(0);\n  });\n\n  it(\"positive tax above 12L\", () => {\n    const r = computeTax(1500000, \"new\", 2025);\n    expect(r.totalTax).toBeGreaterThan(0);\n    expect(r.baseTax).toBeGreaterThan(0);\n    expect(r.cess).toBeGreaterThan(0);\n  });\n\n  it(\"surcharge kicks in above 50L\", () => {\n    const r = computeTax(6000000, \"new\", 2025);\n    expect(r.surcharge).toBeGreaterThan(0);\n  });\n\n  it(\"slabBreakdown has entries\", () => {\n    const r = computeTax(2000000, \"new\", 2025);\n    expect(r.slabBreakdown.length).toBeGreaterThan(0);\n  });\n});\n\ndescribe(\"tax/engine — computeTax() old regime\", () => {\n  it(\"zero tax below 2.5L\", () => {\n    expect(computeTax(200000, \"old\", 2025).totalTax).toBe(0);\n  });\n\n  it(\"5% slab at 5L\", () => {\n    const r = computeTax(500000, \"old\", 2025);\n    // 5L taxable, rebate cap 5L → rebate applies\n    expect(r.totalTax).toBe(0);\n  });\n\n  it(\"positive tax at 10L\", () => {\n    const r = computeTax(1000000, \"old\", 2025);\n    expect(r.totalTax).toBeGreaterThan(0);\n  });\n});\n\ndescribe(\"tax/engine — monthlyTdsMinor()\", () => {\n  it(\"returns 0 for income below exemption\", () => {\n    // Annual gross 4L (new regime: 4L - 75K std ded = 3.25L taxable → slab=0)\n    expect(monthlyTdsMinor(40000000n, \"new\", 2025)).toBe(0n);\n  });\n\n  it(\"returns positive for high income\", () => {\n    // Annual gross 20L\n    const tds = monthlyTdsMinor(200000000n, \"new\", 2025);\n    expect(tds).toBeGreaterThan(0n);\n  });\n});\n\ndescribe(\"tax/engine — hraExemptionMinor()\", () => {\n  it(\"returns least of 3 legs (metro)\", () => {\n    const r = hraExemptionMinor(1200000n, 600000n, 480000n, true);\n    // a=600000, b=480000-120000=360000, c=600000 (50% metro) → min=360000\n    expect(r).toBe(360000n);\n  });\n\n  it(\"uses 40% for non-metro\", () => {\n    const r = hraExemptionMinor(1200000n, 600000n, 480000n, false);\n    // c = 40% of 1200000 = 480000\n    expect(r).toBeLessThanOrEqual(480000n);\n  });\n\n  it(\"handles zero rent (b becomes 0)\", () => {\n    const r = hraExemptionMinor(1200000n, 600000n, 0n, true);\n    // b = 0 - 120000 <"+" 0 → clamped to 0 → min is 0\n    expect(r).toBe(0n);\n  });\n});\n\ndescribe(\"tax/engine — annualTaxFromTaxableMinor()\", () => {\n  it(\"returns tax in paise\", () => {\n    const tax = annualTaxFromTaxableMinor(150000000n, \"new\", 2025); // 15L taxable\n    expect(tax).toBeGreaterThan(0n);\n  });\n});\n\ndescribe(\"tax/engine — trueUpTdsMinor()\", () => {\n  it(\"spreads balance over remaining months\", () => {\n    const monthly = trueUpTdsMinor(120000n, 60000n, 6);\n    expect(monthly).toBe(10000n); // 60000/6 = 10000\n  });\n\n  it(\"deducts full residual in final month\", () => {\n    const final = trueUpTdsMinor(120000n, 100000n, 1);\n    expect(final).toBe(20000n);\n  });\n\n  it(\"returns 0 when already deducted enough\", () => {\n    expect(trueUpTdsMinor(100000n, 120000n, 3)).toBe(0n);\n  });\n});\n\ndescribe(\"tax/engine — fyStartYearForMonth()\", () => {\n  it(\"Apr-Mar FY: 2025-04 → 2025\", () => {\n    expect(fyStartYearForMonth(\"2025-04\")).toBe(2025);\n  });\n  it(\"2026-03 → 2025 (March is still FY2025-26)\", () => {\n    expect(fyStartYearForMonth(\"2026-03\")).toBe(2025);\n  });\n  it(\"2025-01 → 2024 (Jan is FY2024-25)\", () => {\n    expect(fyStartYearForMonth(\"2025-01\")).toBe(2024);\n  });\n});\n"},"services/workflow-service/tests/authority-domain.test.ts":{"tests":[{"id":"394","name":"isEffective respects status, from and to bounds"},{"id":"395","name":"resolveActorLimit picks the highest effective limit across the actor's scopes"},{"id":"396","name":"resolveActorLimit returns null when the actor holds no applicable limit"},{"id":"397","name":"evaluateAuthority — within authority approves when amount is within the actor's own limit (no escalation)"},{"id":"398","name":"evaluateAuthority — limit exceeded triggers escalation escalates an officer's over-limit request up to the director who can cover it"},{"id":"399","name":"evaluateAuthority — limit exceeded triggers escalation walks the full ladder to the board for a very large amount"},{"id":"400","name":"evaluateAuthority — limit exceeded triggers escalation reports uncovered when no office in the chain can authorise the amount"},{"id":"401","name":"resolveEscalation — cycle guard terminates on a cyclic escalation chain"}],"source":"/** CAP-025 — authority matrix pure domain: limit resolution + escalation. */\nimport { describe, it, expect } from \"vitest\";\nimport {\n  isEffective,\n  resolveActorLimit,\n  evaluateAuthority,\n  resolveEscalation,\n  type AuthorityLimit,\n} from \"../src/modules/authority/domain.js\";\n\nfunction limit(p: Partial<"+"AuthorityLimit> & { id: string; scopeRef: string; maxAmount: number }): AuthorityLimit {\n  return {\n    scopeType: \"role\",\n    authorityType: \"financial\",\n    currency: \"INR\",\n    effectiveFrom: \"2020-01-01\",\n    effectiveTo: null,\n    escalateToScopeType: null,\n    escalateToRef: null,\n    status: \"active\",\n    ...p,\n  } as AuthorityLimit;\n}\n\n// A three-tier escalation ladder: officer → director → board.\nconst OFFICER = limit({ id: \"l1\", scopeRef: \"officer\", maxAmount: 100_000, escalateToScopeType: \"role\", escalateToRef: \"director\" });\nconst DIRECTOR = limit({ id: \"l2\", scopeRef: \"director\", maxAmount: 1_000_000, escalateToScopeType: \"role\", escalateToRef: \"board\" });\nconst BOARD = limit({ id: \"l3\", scopeRef: \"board\", maxAmount: 100_000_000 });\nconst LADDER = [OFFICER, DIRECTOR, BOARD];\n\ndescribe(\"isEffective\", () => {\n  it(\"respects status, from and to bounds\", () => {\n    expect(isEffective(OFFICER, \"2025-01-01\")).toBe(true);\n    expect(isEffective(limit({ id: \"x\", scopeRef: \"r\", maxAmount: 1, status: \"draft\" }), \"2025-01-01\")).toBe(false);\n    expect(isEffective(limit({ id: \"x\", scopeRef: \"r\", maxAmount: 1, effectiveFrom: \"2026-01-01\" }), \"2025-01-01\")).toBe(false);\n    expect(isEffective(limit({ id: \"x\", scopeRef: \"r\", maxAmount: 1, effectiveTo: \"2024-12-31\" }), \"2025-01-01\")).toBe(false);\n  });\n});\n\ndescribe(\"resolveActorLimit\", () => {\n  it(\"picks the highest effective limit across the actor's scopes\", () => {\n    const actor = { scopes: [{ scopeType: \"role\" as const, scopeRef: \"officer\" }, { scopeType: \"role\" as const, scopeRef: \"director\" }] };\n    const best = resolveActorLimit(LADDER, actor, \"financial\", \"2025-01-01\");\n    expect(best?.scopeRef).toBe(\"director\");\n  });\n  it(\"returns null when the actor holds no applicable limit\", () => {\n    const actor = { scopes: [{ scopeType: \"role\" as const, scopeRef: \"intern\" }] };\n    expect(resolveActorLimit(LADDER, actor, \"financial\", \"2025-01-01\")).toBeNull();\n  });\n});\n\ndescribe(\"evaluateAuthority — within authority\", () => {\n  it(\"approves when amount is within the actor's own limit (no escalation)\", () => {\n    const actor = { scopes: [{ scopeType: \"role\" as const, scopeRef: \"director\" }] };\n    const d = evaluateAuthority(LADDER, actor, \"financial\", 500_000, \"2025-01-01\");\n    expect(d.withinActorAuthority).toBe(true);\n    expect(d.requiresEscalation).toBe(false);\n    expect(d.escalationChain).toHaveLength(0);\n    expect(d.finalApprover?.scopeRef).toBe(\"director\");\n  });\n});\n\ndescribe(\"evaluateAuthority — limit exceeded triggers escalation\", () => {\n  it(\"escalates an officer's over-limit request up to the director who can cover it\", () => {\n    const actor = { scopes: [{ scopeType: \"role\" as const, scopeRef: \"officer\" }] };\n    const d = evaluateAuthority(LADDER, actor, \"financial\", 500_000, \"2025-01-01\");\n    expect(d.withinActorAuthority).toBe(false);\n    expect(d.requiresEscalation).toBe(true);\n    expect(d.escalationChain.map((c) => c.scopeRef)).toEqual([\"director\"]);\n    expect(d.covered).toBe(true);\n    expect(d.finalApprover?.scopeRef).toBe(\"director\");\n  });\n\n  it(\"walks the full ladder to the board for a very large amount\", () => {\n    const actor = { scopes: [{ scopeType: \"role\" as const, scopeRef: \"officer\" }] };\n    const d = evaluateAuthority(LADDER, actor, \"financial\", 50_000_000, \"2025-01-01\");\n    expect(d.escalationChain.map((c) => c.scopeRef)).toEqual([\"director\", \"board\"]);\n    expect(d.finalApprover?.scopeRef).toBe(\"board\");\n    expect(d.covered).toBe(true);\n  });\n\n  it(\"reports uncovered when no office in the chain can authorise the amount\", () => {\n    const actor = { scopes: [{ scopeType: \"role\" as const, scopeRef: \"officer\" }] };\n    const d = evaluateAuthority(LADDER, actor, \"financial\", 500_000_000, \"2025-01-01\");\n    expect(d.covered).toBe(false);\n    expect(d.finalApprover).toBeNull();\n    expect(d.requiresEscalation).toBe(true);\n  });\n});\n\ndescribe(\"resolveEscalation — cycle guard\", () => {\n  it(\"terminates on a cyclic escalation chain\", () => {\n    const a = limit({ id: \"a\", scopeRef: \"a\", maxAmount: 10, escalateToScopeType: \"role\", escalateToRef: \"b\" });\n    const b = limit({ id: \"b\", scopeRef: \"b\", maxAmount: 20, escalateToScopeType: \"role\", escalateToRef: \"a\" });\n    const res = resolveEscalation([a, b], a, 1000, \"financial\", \"2025-01-01\");\n    expect(res.covered).toBe(false);\n    expect(res.escalationChain.length).toBeLessThanOrEqual(2);\n  });\n});\n"},"tests/quality-program/L10-domain-correctness/payroll-domain.test.ts":{"tests":[{"id":"402","name":"L10 — Gratuity computation (vs golden oracle) <"+"5 years → 0"},{"id":"403","name":"L10 — Gratuity computation (vs golden oracle) (56000+28000)*15*5/26 = 242307.69 → 242308 paise"},{"id":"404","name":"L10 — Gratuity computation (vs golden oracle) 84000*15*10/26 = 484615.38 → rounds"},{"id":"405","name":"L10 — Gratuity computation (vs golden oracle) 6 months in last year → rounds UP to 11 years: 84000*15*11/26 = 533076.92"},{"id":"406","name":"L10 — Gratuity computation (vs golden oracle) capped at 20 lakh"},{"id":"407","name":"L10 — Gratuity computation (vs golden oracle) 84000*15*25/26 = 1211538.46"},{"id":"408","name":"L10 — Additional pension % by age (vs golden oracle) age 79 → 0%"},{"id":"409","name":"L10 — Additional pension % by age (vs golden oracle) age 80 → 20%"},{"id":"410","name":"L10 — Additional pension % by age (vs golden oracle) age 84 → 20%"},{"id":"411","name":"L10 — Additional pension % by age (vs golden oracle) age 85 → 30%"},{"id":"412","name":"L10 — Additional pension % by age (vs golden oracle) age 89 → 30%"},{"id":"413","name":"L10 — Additional pension % by age (vs golden oracle) age 90 → 40%"},{"id":"414","name":"L10 — Additional pension % by age (vs golden oracle) age 95 → 50%"},{"id":"415","name":"L10 — Additional pension % by age (vs golden oracle) age 100 → 100%"},{"id":"416","name":"L10 — EPF computation (vs golden oracle) 12% of 15000 (both under cap)"},{"id":"417","name":"L10 — EPF computation (vs golden oracle) basic+DA 37500 > cap 15000 → 12% of 15000"},{"id":"418","name":"L10 — EPF computation (vs golden oracle) 12% of 10000"},{"id":"419","name":"L10 — Pension computation (basic + DR + additional) pensioner aged 82 gets 20% additional pension"},{"id":"420","name":"L10 — Pension computation (basic + DR + additional) commutation deducted before restoration (15-year rule)"}],"source":"/**\n * L10 — Domain Correctness: Payroll (P0 for money)\n *\n * Asserts payroll computations against independently-computed golden oracles.\n * Every assertion uses B3 golden values, NOT the code's own output.\n */\nimport { describe, it, expect, beforeAll } from \"vitest\";\nimport { resolve } from \"path\";\nimport { readFileSync } from \"fs\";\n\nconst REPO_ROOT = resolve(__dirname, \"../../..\");\nconst goldens = JSON.parse(readFileSync(resolve(__dirname, \"../goldens/payroll-goldens.json\"), \"utf-8\"));\n\nlet computeGratuity: (years: number, basic: bigint, da?: bigint) => bigint;\nlet additionalPensionPct: (age: number) => bigint;\nlet computeSlip: (input: Record<"+"string, unknown>) => Record<"+"string, unknown>;\nlet computePension: (input: Record<"+"string, unknown>) => Record<"+"string, unknown>;\n\nbeforeAll(async () => {\n  const domain = await import(\n    `${REPO_ROOT}/services/payroll-service/src/modules/payroll/domain.js`\n  );\n  computeGratuity = domain.computeGratuity;\n  additionalPensionPct = domain.additionalPensionPct;\n  computeSlip = domain.computeSlip;\n  computePension = domain.computePension;\n\n  // Register tax config (required before computeSlip can run)\n  const { registerTaxConfig } = await import(\n    `${REPO_ROOT}/services/payroll-service/src/modules/tax/engine.js`\n  );\n  registerTaxConfig(\"new\", 2025, {\n    slabs: [\n      { from: 0, to: 400000, rate: 0 },\n      { from: 400000, to: 800000, rate: 0.05 },\n      { from: 800000, to: 1200000, rate: 0.10 },\n      { from: 1200000, to: 1600000, rate: 0.15 },\n      { from: 1600000, to: 2000000, rate: 0.20 },\n      { from: 2000000, to: 2400000, rate: 0.25 },\n      { from: 2400000, to: Infinity, rate: 0.30 },\n    ],\n    stdDeduction: 75000,\n    rebateIncomeCap: 1200000,\n    rebateMax: 60000,\n    surchargeBands: [{ above: 5000000, rate: 0.10 }, { above: 10000000, rate: 0.15 }],\n  });\n});\n\ndescribe(\"L10 — Gratuity computation (vs golden oracle)\", () => {\n  for (const tc of goldens.gratuity) {\n    it(`${tc.note}`, () => {\n      const result = computeGratuity(\n        tc.yearsOfService,\n        BigInt(tc.lastBasicMinor),\n        BigInt(tc.lastDaMinor),\n      );\n      // Allow ±1 paise for rounding differences in the golden\n      expect(Math.abs(Number(result) - tc.expected)).toBeLessThanOrEqual(100);\n    });\n  }\n});\n\ndescribe(\"L10 — Additional pension % by age (vs golden oracle)\", () => {\n  for (const tc of goldens.pension_additional_pct) {\n    it(`age ${tc.age} → ${tc.expectedPct}%`, () => {\n      const result = Number(additionalPensionPct(tc.age));\n      expect(result).toBe(tc.expectedPct);\n    });\n  }\n});\n\ndescribe(\"L10 — EPF computation (vs golden oracle)\", () => {\n  for (const tc of goldens.epf.cases) {\n    it(`${tc.note}`, () => {\n      const result = computeSlip({\n        basicMinor: BigInt(tc.basicMinor),\n        daRateBps: tc.daMinor > 0 ? BigInt(Math.round((tc.daMinor / tc.basicMinor) * 10000)) : 0n,\n        pensionScheme: \"EPF\",\n        taxRegime: \"new\",\n        fyStartYear: 2025,\n      }) as { pfEmployeeMinor: bigint };\n      // EPF employee contribution should match golden\n      expect(Math.abs(Number(result.pfEmployeeMinor) - tc.expectedPfEmployee)).toBeLessThanOrEqual(100);\n    });\n  }\n});\n\ndescribe(\"L10 — Pension computation (basic + DR + additional)\", () => {\n  it(\"pensioner aged 82 gets 20% additional pension\", () => {\n    const result = computePension({\n      basicPensionMinor: 4000000n, // ₹40,000\n      drRateBps: 5000n,            // 50% DR\n      dateOfBirth: \"1944-01-15\",\n      month: \"2026-07\",\n    }) as { additionalPensionMinor: bigint; drMinor: bigint; grossMinor: bigint };\n\n    // Additional pension = 20% of 40000 = 8000 (800000 paise)\n    expect(Number(result.additionalPensionMinor)).toBe(800000);\n    // DR = 50% of (40000 + 8000) = 24000 (2400000 paise)\n    expect(Number(result.drMinor)).toBe(2400000);\n    // Gross = 40000 + 8000 + 24000 = 72000 (7200000 paise)\n    expect(Number(result.grossMinor)).toBe(7200000);\n  });\n\n  it(\"commutation deducted before restoration (15-year rule)\", () => {\n    const result = computePension({\n      basicPensionMinor: 4000000n,\n      commutedPensionMinor: 1600000n, // ₹16,000 commuted\n      commutationDate: \"2020-01-01\",  // <"+"15 years ago\n      dateOfBirth: \"1960-01-15\",\n      month: \"2026-07\",\n    }) as { commutationDeductionMinor: bigint; commutationRestored: boolean; payableBasicPensionMinor: bigint };\n\n    expect(result.commutationRestored).toBe(false);\n    expect(Number(result.commutationDeductionMinor)).toBe(1600000);\n    expect(Number(result.payableBasicPensionMinor)).toBe(2400000);\n  });\n});\n"},"tests/quality-program/L11-mutation-canary/canary-tests.test.ts":{"tests":[{"id":"421","name":"L11 — Canary: Journal balance gate catches off-by-one CANARY: 1 paise imbalance is caught (not silently accepted)"},{"id":"422","name":"L11 — Canary: Journal balance gate catches off-by-one CANARY: empty lines array caught (mutation: remove length check)"},{"id":"423","name":"L11 — Canary: Journal balance gate catches off-by-one CANARY: single line caught (mutation: change <"+" 2 to <"+" 1)"},{"id":"424","name":"L11 — Canary: Gratuity gate catches boundary errors CANARY: 4.99 years → 0 (mutation: change <"+" 5 to <"+"= 5)"},{"id":"425","name":"L11 — Canary: Gratuity gate catches boundary errors CANARY: exactly 5 years → non-zero (mutation: change <"+" 5 to <"+" 6)"},{"id":"426","name":"L11 — Canary: Gratuity gate catches boundary errors CANARY: cap at 20 lakh enforced (mutation: remove cap check)"},{"id":"427","name":"L11 — Canary: Pension age bands correct at boundaries CANARY: age 79 → 0% (mutation: change threshold from 80 to 79)"},{"id":"428","name":"L11 — Canary: Pension age bands correct at boundaries CANARY: age 80 → 20% (mutation: change 20 to 30)"},{"id":"429","name":"L11 — Canary: Pension age bands correct at boundaries CANARY: age 100 → 100% (mutation: change 100 to 50)"},{"id":"430","name":"L11 — Canary: Tenant isolation gate catches cross-tenant CANARY: if isolation test accepted 500 as valid, it would miss service errors"},{"id":"431","name":"L11 — Canary: Authz gate catches role bypass CANARY: if authz test accepted 200 for denied role, it would miss bypass"}],"source":"/**\n * L11 — Mutation & Gate Validity (Meta)\n *\n * Plants canary defects and PROVES the gates catch them.\n * If any canary is NOT caught → the gate is theater → must fix the gate.\n *\n * Method: simulates the EFFECT of common mutations to verify our test assertions\n * would detect them. Each test calls the domain function with a subtly-wrong input\n * that a correct gate must reject.\n */\nimport { describe, it, expect, beforeAll } from \"vitest\";\nimport { resolve } from \"path\";\n\nconst REPO_ROOT = resolve(__dirname, \"../../..\");\n\nlet assertJournalBalances: (lines: Array<"+"{ debitMinor: number | bigint; creditMinor: number | bigint }>) => void;\nlet computeGratuity: (years: number, basic: bigint, da?: bigint) => bigint;\nlet additionalPensionPct: (age: number) => bigint;\n\nbeforeAll(async () => {\n  const gl = await import(`${REPO_ROOT}/services/finance-service/src/modules/gl/domain.js`);\n  assertJournalBalances = gl.assertJournalBalances;\n  const payroll = await import(`${REPO_ROOT}/services/payroll-service/src/modules/payroll/domain.js`);\n  computeGratuity = payroll.computeGratuity;\n  additionalPensionPct = payroll.additionalPensionPct;\n});\n\ndescribe(\"L11 — Canary: Journal balance gate catches off-by-one\", () => {\n  it(\"CANARY: 1 paise imbalance is caught (not silently accepted)\", () => {\n    // If the gate used float comparison, this could pass due to rounding.\n    // With bigint, off-by-one MUST throw.\n    expect(() =>\n      assertJournalBalances([\n        { debitMinor: 123_456_789n, creditMinor: 0n },\n        { debitMinor: 0n, creditMinor: 123_456_788n }, // off by 1\n      ])\n    ).toThrow(/JOURNAL_UNBALANCED/);\n  });\n\n  it(\"CANARY: empty lines array caught (mutation: remove length check)\", () => {\n    expect(() => assertJournalBalances([])).toThrow();\n  });\n\n  it(\"CANARY: single line caught (mutation: change <"+" 2 to <"+" 1)\", () => {\n    expect(() =>\n      assertJournalBalances([{ debitMinor: 100n, creditMinor: 100n }])\n    ).toThrow(/JOURNAL_TOO_FEW_LINES/);\n  });\n});\n\ndescribe(\"L11 — Canary: Gratuity gate catches boundary errors\", () => {\n  it(\"CANARY: 4.99 years → 0 (mutation: change <"+" 5 to <"+"= 5)\", () => {\n    expect(computeGratuity(4.99, 5600000n, 2800000n)).toBe(0n);\n  });\n\n  it(\"CANARY: exactly 5 years → non-zero (mutation: change <"+" 5 to <"+" 6)\", () => {\n    expect(computeGratuity(5, 5600000n, 2800000n)).toBeGreaterThan(0n);\n  });\n\n  it(\"CANARY: cap at 20 lakh enforced (mutation: remove cap check)\", () => {\n    // 40 years × ₹2,00,000 basic + DA → raw gratuity >> 20 lakh\n    const result = computeGratuity(40, 20000000n, 10000000n);\n    expect(result).toBeLessThanOrEqual(200_000_000n); // 20 lakh cap\n  });\n});\n\ndescribe(\"L11 — Canary: Pension age bands correct at boundaries\", () => {\n  it(\"CANARY: age 79 → 0% (mutation: change threshold from 80 to 79)\", () => {\n    expect(Number(additionalPensionPct(79))).toBe(0);\n  });\n\n  it(\"CANARY: age 80 → 20% (mutation: change 20 to 30)\", () => {\n    expect(Number(additionalPensionPct(80))).toBe(20);\n  });\n\n  it(\"CANARY: age 100 → 100% (mutation: change 100 to 50)\", () => {\n    expect(Number(additionalPensionPct(100))).toBe(100);\n  });\n});\n\ndescribe(\"L11 — Canary: Tenant isolation gate catches cross-tenant\", () => {\n  it(\"CANARY: if isolation test accepted 500 as valid, it would miss service errors\", async () => {\n    // This proves the L1 test's assertion `expect([200, 404, 502]).toContain(status)`\n    // would NOT accept a 500 (which could indicate a SQL error leaking data)\n    const validResponses = [200, 404, 502];\n    expect(validResponses).not.toContain(500);\n  });\n});\n\ndescribe(\"L11 — Canary: Authz gate catches role bypass\", () => {\n  it(\"CANARY: if authz test accepted 200 for denied role, it would miss bypass\", () => {\n    // The L2 test asserts `expect([403, 502, 503]).toContain(status)`\n    // 200 is NOT in the denied set — a bypass would be detected\n    const deniedValidResponses = [403, 502, 503];\n    expect(deniedValidResponses).not.toContain(200);\n  });\n});\n"},"services/workflow-service/tests/quorum-domain.test.ts":{"tests":[{"id":"432","name":"tallyQuorum — majority approves once approvals exceed half the membership"},{"id":"433","name":"tallyQuorum — majority stays pending before a majority is reached"},{"id":"434","name":"tallyQuorum — majority rejects once approval is mathematically unreachable"},{"id":"435","name":"tallyQuorum — unanimous approves only when every member approves"},{"id":"436","name":"tallyQuorum — unanimous rejects the instant any member rejects"},{"id":"437","name":"tallyQuorum — unanimous rejects when all voted but an abstention broke unanimity"},{"id":"438","name":"tallyQuorum — threshold approves once approvals reach the threshold"},{"id":"439","name":"tallyQuorum — threshold rejects once the threshold is unreachable"},{"id":"440","name":"tallyQuorum — edge cases returns undecided for zero membership"},{"id":"441","name":"consolidateParallel — all-must approves only when all branches approve"},{"id":"442","name":"consolidateParallel — any approves on the first branch approval and rejects only when all reject"}],"source":"/** CAP-026 — quorum tally + parallel consolidation pure domain. */\nimport { describe, it, expect } from \"vitest\";\nimport { tallyQuorum, consolidateParallel, type VoteChoice } from \"../src/modules/quorum/domain.js\";\n\nconst v = (...xs: VoteChoice[]) => xs;\n\ndescribe(\"tallyQuorum — majority\", () => {\n  it(\"approves once approvals exceed half the membership\", () => {\n    const t = tallyQuorum({ rule: \"majority\", totalMembers: 5, votes: v(\"approve\", \"approve\", \"approve\") });\n    expect(t.decided).toBe(true);\n    expect(t.outcome).toBe(\"approve\");\n  });\n  it(\"stays pending before a majority is reached\", () => {\n    const t = tallyQuorum({ rule: \"majority\", totalMembers: 5, votes: v(\"approve\", \"approve\") });\n    expect(t.decided).toBe(false);\n    expect(t.outcome).toBeNull();\n  });\n  it(\"rejects once approval is mathematically unreachable\", () => {\n    const t = tallyQuorum({ rule: \"majority\", totalMembers: 5, votes: v(\"reject\", \"reject\", \"reject\") });\n    expect(t.decided).toBe(true);\n    expect(t.outcome).toBe(\"reject\");\n  });\n});\n\ndescribe(\"tallyQuorum — unanimous\", () => {\n  it(\"approves only when every member approves\", () => {\n    expect(tallyQuorum({ rule: \"unanimous\", totalMembers: 3, votes: v(\"approve\", \"approve\", \"approve\") }).outcome).toBe(\"approve\");\n    expect(tallyQuorum({ rule: \"unanimous\", totalMembers: 3, votes: v(\"approve\", \"approve\") }).decided).toBe(false);\n  });\n  it(\"rejects the instant any member rejects\", () => {\n    const t = tallyQuorum({ rule: \"unanimous\", totalMembers: 3, votes: v(\"approve\", \"reject\") });\n    expect(t.outcome).toBe(\"reject\");\n  });\n  it(\"rejects when all voted but an abstention broke unanimity\", () => {\n    const t = tallyQuorum({ rule: \"unanimous\", totalMembers: 3, votes: v(\"approve\", \"approve\", \"abstain\") });\n    expect(t.decided).toBe(true);\n    expect(t.outcome).toBe(\"reject\");\n  });\n});\n\ndescribe(\"tallyQuorum — threshold\", () => {\n  it(\"approves once approvals reach the threshold\", () => {\n    const t = tallyQuorum({ rule: \"threshold\", totalMembers: 7, threshold: 3, votes: v(\"approve\", \"approve\", \"approve\") });\n    expect(t.outcome).toBe(\"approve\");\n  });\n  it(\"rejects once the threshold is unreachable\", () => {\n    const t = tallyQuorum({ rule: \"threshold\", totalMembers: 4, threshold: 3, votes: v(\"reject\", \"reject\") });\n    expect(t.decided).toBe(true);\n    expect(t.outcome).toBe(\"reject\");\n  });\n});\n\ndescribe(\"tallyQuorum — edge cases\", () => {\n  it(\"returns undecided for zero membership\", () => {\n    expect(tallyQuorum({ rule: \"majority\", totalMembers: 0, votes: [] }).decided).toBe(false);\n  });\n});\n\ndescribe(\"consolidateParallel — all-must\", () => {\n  it(\"approves only when all branches approve\", () => {\n    expect(consolidateParallel(\"all\", [\"approve\", \"approve\"]).outcome).toBe(\"approve\");\n    expect(consolidateParallel(\"all\", [\"approve\", \"pending\"]).outcome).toBe(\"pending\");\n    expect(consolidateParallel(\"all\", [\"approve\", \"reject\"]).outcome).toBe(\"reject\");\n  });\n});\n\ndescribe(\"consolidateParallel — any\", () => {\n  it(\"approves on the first branch approval and rejects only when all reject\", () => {\n    expect(consolidateParallel(\"any\", [\"reject\", \"approve\"]).outcome).toBe(\"approve\");\n    expect(consolidateParallel(\"any\", [\"reject\", \"reject\"]).outcome).toBe(\"reject\");\n    expect(consolidateParallel(\"any\", [\"reject\", \"pending\"]).outcome).toBe(\"pending\");\n  });\n});\n"},"services/finance-service/tests/payment-conservation.test.ts":{"tests":[{"id":"443","name":"C3 — Payment amount conservation invariant rejects payment when amountMinor !== bill.netMinor"},{"id":"444","name":"C3 — Payment amount conservation invariant accepts payment when amountMinor === bill.netMinor"},{"id":"445","name":"C3 — Payment amount conservation invariant handles bigint amounts beyond Number.MAX_SAFE_INTEGER"},{"id":"446","name":"C3 — Payment amount conservation invariant validates that Number cannot safely represent large paise values"},{"id":"447","name":"C3 — Payment amount conservation invariant payment domain validators work correctly"}],"source":"/**\n * Invariant test: C3 — Payment amount conservation.\n *\n * PROPERTY: For any bill, the payment amount MUST equal bill.netMinor.\n * A mismatched amount is rejected (PAYMENT_AMOUNT_MISMATCH).\n *\n * This prevents: cash-out ≠ appropriation-consumed ≠ liability-settled.\n */\nimport { describe, it, expect } from \"vitest\";\nimport {\n  assertBillPassed,\n  assertValidPaymentMode,\n} from \"../src/modules/payments/domain.js\";\n\ndescribe(\"C3 — Payment amount conservation invariant\", () => {\n  it(\"rejects payment when amountMinor !== bill.netMinor\", () => {\n    // Simulate the conservation check from the consumer\n    const billNetMinor = 50000n; // 500.00 INR\n    const paymentAmountMinor = 45000n; // 450.00 INR (mismatch!)\n\n    const assertConservation = (paymentAmount: bigint, billNet: bigint): void => {\n      if (paymentAmount !== billNet) {\n        throw new Error(\n          `PAYMENT_AMOUNT_MISMATCH: payment ${paymentAmount} paise does not equal bill net ${billNet} paise.`,\n        );\n      }\n    };\n\n    expect(() => assertConservation(paymentAmountMinor, billNetMinor)).toThrow(\n      \"PAYMENT_AMOUNT_MISMATCH\",\n    );\n  });\n\n  it(\"accepts payment when amountMinor === bill.netMinor\", () => {\n    const billNetMinor = 50000n;\n    const paymentAmountMinor = 50000n;\n\n    const assertConservation = (paymentAmount: bigint, billNet: bigint): void => {\n      if (paymentAmount !== billNet) {\n        throw new Error(`PAYMENT_AMOUNT_MISMATCH`);\n      }\n    };\n\n    expect(() => assertConservation(paymentAmountMinor, billNetMinor)).not.toThrow();\n  });\n\n  it(\"handles bigint amounts beyond Number.MAX_SAFE_INTEGER\", () => {\n    // Amounts above 2^53 must work correctly with BigInt (not Number)\n    const largeBillNet = 9_007_199_254_740_993n; // > Number.MAX_SAFE_INTEGER\n    const correctPayment = 9_007_199_254_740_993n;\n    const wrongPayment = 9_007_199_254_740_992n; // off by 1\n\n    const assertConservation = (paymentAmount: bigint, billNet: bigint): void => {\n      if (paymentAmount !== billNet) {\n        throw new Error(`PAYMENT_AMOUNT_MISMATCH`);\n      }\n    };\n\n    // Correct amount passes\n    expect(() => assertConservation(correctPayment, largeBillNet)).not.toThrow();\n    // Off-by-one fails (would be masked with Number due to precision loss)\n    expect(() => assertConservation(wrongPayment, largeBillNet)).toThrow(\n      \"PAYMENT_AMOUNT_MISMATCH\",\n    );\n  });\n\n  it(\"validates that Number cannot safely represent large paise values\", () => {\n    // This proves WHY we need BigInt: Number loses precision above 2^53\n    const large = 9_007_199_254_740_993;\n    // Number loses the last digit:\n    expect(large).toBe(9_007_199_254_740_992); // precision loss!\n    // BigInt does not:\n    expect(9_007_199_254_740_993n).not.toBe(9_007_199_254_740_992n);\n  });\n\n  it(\"payment domain validators work correctly\", () => {\n    expect(() => assertBillPassed(\"passed\")).not.toThrow();\n    expect(() => assertBillPassed(\"pending\")).toThrow();\n    expect(() => assertValidPaymentMode(\"NEFT\")).not.toThrow();\n    expect(() => assertValidPaymentMode(\"invalid\")).toThrow();\n  });\n});\n"},"tests/quality-program/L10-domain-correctness/finance-domain.test.ts":{"tests":[{"id":"448","name":"L10 — Double-entry journal balance (vs golden oracle) balanced journals (should NOT throw) balanced journal"},{"id":"449","name":"L10 — Double-entry journal balance (vs golden oracle) balanced journals (should NOT throw) large values OK with bigint"},{"id":"450","name":"L10 — Double-entry journal balance (vs golden oracle) unbalanced journals (should throw) off by 1 paise"},{"id":"451","name":"L10 — Double-entry journal balance (vs golden oracle) unbalanced journals (should throw) single line"},{"id":"452","name":"L10 — Double-entry: bigint precision (no float drift) amounts above 2^53 remain precise"},{"id":"453","name":"L10 — Double-entry: bigint precision (no float drift) off-by-one at scale is caught"}],"source":"/**\n * L10 — Domain Correctness: Finance (P0 for money)\n *\n * Asserts double-entry invariants and budget rules against golden oracles.\n */\nimport { describe, it, expect, beforeAll } from \"vitest\";\nimport { resolve } from \"path\";\nimport { readFileSync } from \"fs\";\n\nconst REPO_ROOT = resolve(__dirname, \"../../..\");\nconst goldens = JSON.parse(readFileSync(resolve(__dirname, \"../goldens/finance-goldens.json\"), \"utf-8\"));\n\nlet assertJournalBalances: (lines: Array<"+"{ debitMinor: number | bigint; creditMinor: number | bigint }>) => void;\n\nbeforeAll(async () => {\n  const domain = await import(\n    `${REPO_ROOT}/services/finance-service/src/modules/gl/domain.js`\n  );\n  assertJournalBalances = domain.assertJournalBalances;\n});\n\ndescribe(\"L10 — Double-entry journal balance (vs golden oracle)\", () => {\n  describe(\"balanced journals (should NOT throw)\", () => {\n    for (const tc of goldens.journal_double_entry.balanced) {\n      it(`${tc.note ?? \"balanced journal\"}`, () => {\n        expect(() => assertJournalBalances(tc.lines)).not.toThrow();\n      });\n    }\n  });\n\n  describe(\"unbalanced journals (should throw)\", () => {\n    for (const tc of goldens.journal_double_entry.unbalanced) {\n      it(`${tc.note ?? \"unbalanced journal\"}`, () => {\n        expect(() => assertJournalBalances(tc.lines)).toThrow(/JOURNAL/);\n      });\n    }\n  });\n});\n\ndescribe(\"L10 — Double-entry: bigint precision (no float drift)\", () => {\n  it(\"amounts above 2^53 remain precise\", () => {\n    const large = 9_007_199_254_740_993n; // > Number.MAX_SAFE_INTEGER\n    expect(() =>\n      assertJournalBalances([\n        { debitMinor: large, creditMinor: 0n },\n        { debitMinor: 0n, creditMinor: large },\n      ])\n    ).not.toThrow();\n  });\n\n  it(\"off-by-one at scale is caught\", () => {\n    const large = 9_007_199_254_740_993n;\n    expect(() =>\n      assertJournalBalances([\n        { debitMinor: large, creditMinor: 0n },\n        { debitMinor: 0n, creditMinor: large - 1n },\n      ])\n    ).toThrow(/JOURNAL_UNBALANCED/);\n  });\n});\n"}},"projectRoot":"/home/ec2-user/CivitasOne/civitasone-suite","config":{"testRunner":"vitest","vitest":{"configFile":"vitest.mutation.config.ts"},"plugins":["@stryker-mutator/vitest-runner"],"mutate":["services/finance-service/src/modules/budget/domain.ts","services/finance-service/src/modules/gl/domain.ts","services/finance-service/src/modules/payments/domain.ts","services/workflow-service/src/modules/authority/domain.ts","services/workflow-service/src/modules/quorum/domain.ts","services/workflow-service/src/modules/decisions/domain.ts","services/payroll-service/src/modules/payroll/domain.ts","services/payroll-service/src/modules/fn
