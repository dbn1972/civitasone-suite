as const,\n    pensionScheme: \"EPF\" as const,\n    taxRegime: \"old\" as const,\n    fyStartYear: FY,\n  };\n\n  it(\"old regime applies a Rs 50,000 standard deduction, new regime Rs 75,000\", () => {\n    const oldR = computeSlip({ ...base });\n    const newR = computeSlip({ ...base, taxRegime: \"new\" });\n    // Same gross; the taxable difference is the std-deduction gap (25,000 rupees\n    // = 2_500_000 paise) plus the old regime's PT and HRA-exemption terms, which\n    // are zero here (ptMinor 0, no rent declared -> hraExempt 0 because rent 0).\n    expect(newR.annualTaxableMinor).toBeLessThan(oldR.annualTaxableMinor);\n    expect(oldR.annualTaxableMinor - newR.annualTaxableMinor).toBe(2_500_000n);\n  });\n\n  it(\"80C reduces taxable income and is capped at Rs 1,50,000\", () => {\n    const none = computeSlip({ ...base });\n    const partial = computeSlip({ ...base, declaration: { ded80cMinor: 10_000_000n } });\n    const atCap = computeSlip({ ...base, declaration: { ded80cMinor: 15_000_000n } });\n    const overCap = computeSlip({ ...base, declaration: { ded80cMinor: 90_000_000n } });\n\n    expect(partial.annualTaxableMinor).toBe(none.annualTaxableMinor - 10_000_000n);\n    expect(atCap.annualTaxableMinor).toBe(none.annualTaxableMinor - 15_000_000n);\n    // Beyond the cap the extra claim is ignored — same result as at the cap.\n    expect(overCap.annualTaxableMinor).toBe(atCap.annualTaxableMinor);\n  });\n\n  it(\"80D reduces taxable income and is capped at Rs 75,000\", () => {\n    const none = computeSlip({ ...base });\n    const atCap = computeSlip({ ...base, declaration: { ded80dMinor: 7_500_000n } });\n    const overCap = computeSlip({ ...base, declaration: { ded80dMinor: 50_000_000n } });\n    expect(atCap.annualTaxableMinor).toBe(none.annualTaxableMinor - 7_500_000n);\n    expect(overCap.annualTaxableMinor).toBe(atCap.annualTaxableMinor);\n  });\n\n  it(\"PT is deductible in the old regime (12 months' worth)\", () => {\n    const noPt = computeSlip({ ...base, ptMinor: 0n });\n    const withPt = computeSlip({ ...base, ptMinor: 20_000n });\n    // Old regime subtracts pt * 12. PT also reduces net pay, but annualTaxable\n    // must drop by exactly 12 * 20_000 = 240_000.\n    expect(withPt.annualTaxableMinor).toBe(noPt.annualTaxableMinor - 240_000n);\n  });\n\n  it(\"Sec 10(13A) HRA exemption is the least of the three statutory limits\", () => {\n    // basic 50,000/mo, X (metro), DA 0 => HRA received 24% = 12,000/mo\n    // annual salary (basic+DA) = 600_000 rupees = 60_000_000 paise\n    // annual HRA received = 144_000 rupees = 14_400_000 paise\n    // rent 300_000 rupees/yr = 30_000_000 paise\n    //   a) HRA received                    = 14_400_000\n    //   b) rent - 10% salary = 30_000_000 - 6_000_000 = 24_000_000\n    //   c) 50% salary (metro)              = 30_000_000\n    //   least = 14_400_000\n    const noRent = computeSlip({ ...base });\n    const withRent = computeSlip({ ...base, declaration: { rentPaidAnnualMinor: 30_000_000n } });\n    expect(noRent.annualTaxableMinor - withRent.annualTaxableMinor).toBe(14_400_000n);\n  });\n\n  it(\"a low rent yields a smaller exemption (limit b binds)\", () => {\n    // rent 80_000 rupees = 8_000_000 paise; b = 8_000_000 - 6_000_000 = 2_000_000\n    // which is now the least of {14_400_000, 2_000_000, 30_000_000}\n    const noRent = computeSlip({ ...base });\n    const lowRent = computeSlip({ ...base, declaration: { rentPaidAnnualMinor: 8_000_000n } });\n    expect(noRent.annualTaxableMinor - lowRent.annualTaxableMinor).toBe(2_000_000n);\n  });\n\n  it(\"rent below 10% of salary yields no exemption (b clamps at 0)\", () => {\n    const noRent = computeSlip({ ...base });\n    const tinyRent = computeSlip({ ...base, declaration: { rentPaidAnnualMinor: 1_000_000n } });\n    expect(tinyRent.annualTaxableMinor).toBe(noRent.annualTaxableMinor);\n  });\n});\n\n// ── Recovery floor: net pay protection (L~250-280) ───────────────────────────\n\ndescribe(\"L10 payroll — protected net floor caps recovery and carries the rest\", () => {\n  const base = {\n    basicMinor: 5_000_000n,\n    daRateBps: 0n,\n    cityClass: \"Z\" as const,\n    pensionScheme: \"EPF\" as const,\n    taxRegime: \"new\" as const,\n    fyStartYear: FY,\n  };\n\n  it(\"recovery within headroom is applied in full with no carry-forward\", () => {\n    const r = computeSlip({\n      ...base,\n      components: [{ code: \"LOAN_EMI\", name: \"Loan EMI\", type: \"deduction\", amountMinor: 100_000n }],\n      protectedNetFloorMinor: 0n,\n    });\n    expect(r.recoveryCarryForwardMinor).toBe(0n);\n    expect(amountOf(r.deductions, \"LOAN_EMI\")).toBe(100_000n);\n  });\n\n  it(\"recovery exceeding headroom is trimmed and the remainder carried forward\", () => {\n    const unfloored = computeSlip({ ...base, protectedNetFloorMinor: 0n });\n    // Demand a recovery larger than the entire net pay.\n    const demand = unfloored.netPayMinor + 1_000_000n;\n    const r = computeSlip({\n      ...base,\n      components: [{ code: \"LOAN_EMI\", name: \"Loan EMI\", type: \"deduction\", amountMinor: demand }],\n      protectedNetFloorMinor: 0n,\n    });\n    expect(r.recoveryCarryForwardMinor).toBeGreaterThan(0n);\n    // Conservation: applied + carried == demanded.\n    const applied = amountOf(r.deductions, \"LOAN_EMI\") ?? 0n;\n    expect(applied + r.recoveryCarryForwardMinor).toBe(demand);\n  });\n\n  it(\"net pay never falls below the protected floor\", () => {\n    const floor = 2_000_000n;\n    const r = computeSlip({\n      ...base,\n      components: [{ code: \"LOAN_EMI\", name: \"Loan EMI\", type: \"deduction\", amountMinor: 10_000_000n }],\n      protectedNetFloorMinor: floor,\n    });\n    expect(r.netPayMinor).toBeGreaterThanOrEqual(floor);\n    expect(r.recoveryCarryForwardMinor).toBeGreaterThan(0n);\n  });\n\n  it(\"a fully-trimmed recovery line is dropped from the slip\", () => {\n    const r = computeSlip({\n      ...base,\n      components: [{ code: \"LOAN_EMI\", name: \"Loan EMI\", type: \"deduction\", amountMinor: 50_000_000n }],\n      // Floor above gross leaves zero headroom, so the whole line is trimmed.\n      protectedNetFloorMinor: 100_000_000n,\n    });\n    expect(codes(r.deductions)).not.toContain(\"LOAN_EMI\");\n    expect(r.recoveryCarryForwardMinor).toBe(50_000_000n);\n  });\n\n  it(\"statutory deductions are NOT subject to the floor\", () => {\n    // With a floor above gross, PF/ESI/TDS still apply, so net can sit below it.\n    const r = computeSlip({ ...base, protectedNetFloorMinor: 100_000_000n });\n    expect(r.pfEmployeeMinor).toBeGreaterThan(0n);\n    expect(r.netPayMinor).toBeLessThan(100_000_000n);\n  });\n});\n\n// ── Slip arithmetic conservation ─────────────────────────────────────────────\n\ndescribe(\"L10 payroll — gross/deduction/net conservation\", () => {\n  it(\"gross equals the sum of earning lines\", () => {\n    const r = computeSlip({\n      basicMinor: 5_000_000n,\n      daRateBps: 5300n,\n      cityClass: \"X\",\n      pensionScheme: \"EPF\",\n      taxRegime: \"new\",\n      fyStartYear: FY,\n      rawComponents: [{ code: \"CONV\", name: \"Conveyance\", type: \"earning\", fixedMinor: 160_000n }],\n    });\n    const sum = r.earnings.reduce((a, e) => a + e.amountMinor, 0n);\n    expect(r.grossMinor).toBe(sum);\n  });\n\n  it(\"net equals gross minus total deductions\", () => {\n    const r = computeSlip({\n      basicMinor: 5_000_000n,\n      daRateBps: 5300n,\n      cityClass: \"X\",\n      ptMinor: 20_000n,\n      pensionScheme: \"EPF\",\n      taxRegime: \"new\",\n      fyStartYear: FY,\n    });\n    expect(r.netPayMinor).toBe(r.grossMinor - r.totalDeductionsMinor);\n    expect(r.negativeNet).toBe(false);\n  });\n\n  it(\"raw components route to earnings or deductions by type\", () => {\n    const r = computeSlip({\n      basicMinor: 5_000_000n,\n      daRateBps: 0n,\n      cityClass: \"Z\",\n      taxRegime: \"new\",\n      fyStartYear: FY,\n      rawComponents: [\n        { code: \"BONUS\", name: \"Bonus\", type: \"earning\", fixedMinor: 500_000n },\n        { code: \"SOCIETY\", name: \"Society Dues\", type: \"deduction\", fixedMinor: 100_000n },\n      ],\n    });\n    expect(codes(r.earnings)).toContain(\"BONUS\");\n    expect(codes(r.deductions)).toContain(\"SOCIETY\");\n    expect(codes(r.earnings)).not.toContain(\"SOCIETY\");\n  });\n\n  it(\"pctOfBasic takes precedence over fixedMinor when both are present\", () => {\n    const r = computeSlip({\n      basicMinor: 5_000_000n,\n      daRateBps: 0n,\n      cityClass: \"Z\",\n      taxRegime: \"new\",\n      fyStartYear: FY,\n      rawComponents: [\n        { code: \"SPL\", name: \"Special\", type: \"earning\", pctOfBasic: 10, fixedMinor: 999_999n },\n      ],\n    });\n    // 10% of 5_000_000 = 500_000, NOT the fixed 999_999.\n    expect(amountOf(r.earnings, \"SPL\")).toBe(500_000n);\n  });\n\n  it(\"fixedMinor is used when pctOfBasic is absent or zero\", () => {\n    const r = computeSlip({\n      basicMinor: 5_000_000n,\n      daRateBps: 0n,\n      cityClass: \"Z\",\n      taxRegime: \"new\",\n      fyStartYear: FY,\n      rawComponents: [\n        { code: \"A\", name: \"A\", type: \"earning\", pctOfBasic: 0, fixedMinor: 111_100n },\n        { code: \"B\", name: \"B\", type: \"earning\", fixedMinor: 222_200n },\n      ],\n    });\n    expect(amountOf(r.earnings, \"A\")).toBe(111_100n);\n    expect(amountOf(r.earnings, \"B\")).toBe(222_200n);\n  });\n\n  it(\"BASIC/DA/HRA raw components are ignored (handled ahead of the loop)\", () => {\n    const r = computeSlip({\n      basicMinor: 5_000_000n,\n      daRateBps: 0n,\n      cityClass: \"Z\",\n      taxRegime: \"new\",\n      fyStartYear: FY,\n      rawComponents: [\n        { code: \"BASIC\", name: \"Dup Basic\", type: \"earning\", fixedMinor: 9_000_000n },\n        { code: \"DA\", name: \"Dup DA\", type: \"earning\", fixedMinor: 9_000_000n },\n        { code: \"HRA\", name: \"Dup HRA\", type: \"earning\", fixedMinor: 9_000_000n },\n      ],\n    });\n    // Exactly one BASIC line, and no duplicate inflation of gross.\n    expect(codes(r.earnings).filter((c) => c === \"BASIC\")).toHaveLength(1);\n    expect(amountOf(r.earnings, \"BASIC\")).toBe(5_000_000n);\n  });\n});\n\n// ── roundRupee half-up behaviour ─────────────────────────────────────────────\n\ndescribe(\"L10 payroll — roundRupee is round-half-up and sign-symmetric\", () => {\n  const cases: Array<"+"[bigint, bigint]> = [\n    [0n, 0n],\n    [49n, 0n],\n    [50n, 100n],\n    [51n, 100n],\n    [149n, 100n],\n    [150n, 200n],\n    [100n, 100n],\n  ];\n  for (const [input, expected] of cases) {\n    it(`roundRupee(${input}) = ${expected}`, () => {\n      expect(roundRupee(input)).toBe(expected);\n    });\n  }\n\n  it(\"negative amounts round symmetrically\", () => {\n    expect(roundRupee(-50n)).toBe(-100n);\n    expect(roundRupee(-49n)).toBe(0n);\n  });\n});\n"},"tests/quality-program/L10-domain-correctness/fnf-settlement-mutants.test.ts":{"tests":[{"id":"56","name":"L10 F&F — separation income adds to FY salary income taxable separation income raises annual taxable income"},{"id":"57","name":"L10 F&F — separation income adds to FY salary income notice buyout is fully taxable and adds to taxable income"},{"id":"58","name":"L10 F&F — separation income adds to FY salary income YTD salary already paid raises taxable income one-for-one"},{"id":"59","name":"L10 F&F — standard deduction is converted rupees to paise new regime deducts Rs 75,000 = 7,500,000 paise"},{"id":"60","name":"L10 F&F — standard deduction is converted rupees to paise old regime deducts Rs 50,000 = 5,000,000 paise"},{"id":"61","name":"L10 F&F — standard deduction is converted rupees to paise the regimes differ by exactly the Rs 25,000 std-deduction gap"},{"id":"62","name":"L10 F&F — Chapter VI-A deductions apply only in the old regime 80C reduces taxable income in the OLD regime"},{"id":"63","name":"L10 F&F — Chapter VI-A deductions apply only in the old regime 80C is IGNORED in the NEW regime"},{"id":"64","name":"L10 F&F — Chapter VI-A deductions apply only in the old regime 80C, 80D and other deductions accumulate ADDITIVELY (old regime)"},{"id":"65","name":"L10 F&F — Chapter VI-A deductions apply only in the old regime each Chapter VI-A component contributes on its own"},{"id":"66","name":"L10 F&F — negative results are clamped to zero, never emitted annual taxable income clamps at 0 when deductions exceed income"},{"id":"67","name":"L10 F&F — negative results are clamped to zero, never emitted no tax is due when taxable income clamps to zero"},{"id":"68","name":"L10 F&F — negative results are clamped to zero, never emitted TDS on separation clamps at 0 when YTD TDS already exceeds annual tax"},{"id":"69","name":"L10 F&F — negative results are clamped to zero, never emitted TDS on separation is annual tax minus YTD TDS when positive"},{"id":"70","name":"L10 F&F — annual tax conversion and Sec 288A rounding annual tax is a whole number of rupees expressed in paise"},{"id":"71","name":"L10 F&F — annual tax conversion and Sec 288A rounding Sec 87A rebate zeroes the tax below the rebate cap"},{"id":"72","name":"L10 F&F — annual tax conversion and Sec 288A rounding annual tax above the rebate cap is computed from the slabs by hand"},{"id":"73","name":"L10 F&F — annual tax conversion and Sec 288A rounding a higher taxable income yields a higher tax (monotonic)"},{"id":"74","name":"L10 F&F — annual tax conversion and Sec 288A rounding zero income yields zero tax"},{"id":"75","name":"L10 F&F — net payable equals gross less TDS net = gross - TDS on separation"},{"id":"76","name":"L10 F&F — net payable equals gross less TDS gross is the sum of all settlement legs"},{"id":"77","name":"L10 F&F — net payable equals gross less TDS every leg contributes to gross individually"}],"source":"/**\n * L10 — Domain Correctness: full & final settlement (mutation burn-down)\n *\n * WHY THIS FILE EXISTS\n * --------------------\n * `fnf/domain.ts` sat at 59.6% with 21 surviving/uncovered mutants, concentrated\n * in the tax computation an employee's final payout depends on (L153-L169):\n *\n *   L153  `salaryYtd + taxableOnSeparation` — a MINUS survived, i.e. separation\n *         income could have been subtracted from FY salary income.\n *   L154  `stdDeduction(...) * 100n` rupee→paise conversion — `/ 100n` survived,\n *         so the standard deduction could have been 10,000x too small.\n *   L155  the old-vs-new regime branch for Chapter VI-A.\n *   L156  `80c + 80d + other` — both a minus and a dropped term survived, so\n *         declared deductions could have reduced relief instead of increasing it.\n *   L159  `totalSalaryIncome - stdDed - chapterViA` — sign mutants survived.\n *   L160  the `annualTaxable <"+" 0n` clamp.\n *   L163  Sec 288A rounding (`/10 * 10`) and `Math.max(0, ...)`.\n *   L165  `totalTax * 100n` rupee→paise.\n *   L169  the `tdsOnSeparation <"+" 0n` clamp — without it a refund would be\n *         emitted as a negative deduction.\n *\n * Expected values are derived from the documented rule, not read back from the\n * implementation. The tax engine is registered with explicit slabs below, so the\n * arithmetic is checkable by hand.\n */\nimport { describe, it, expect, beforeAll } from \"vitest\";\nimport { resolve } from \"node:path\";\n\nconst REPO_ROOT = resolve(__dirname, \"../../..\");\n\ntype Fnf = Record<"+"string, unknown>;\ntype FnfResult = {\n  totalGrossMinor: bigint;\n  totalExemptMinor: bigint;\n  totalTaxableOnSeparationMinor: bigint;\n  annualTaxableMinor: bigint;\n  annualTaxMinor: bigint;\n  tdsOnSeparationMinor: bigint;\n  netPayableMinor: bigint;\n};\n\nlet computeFnfSettlement: (input: Fnf) => FnfResult;\nconst FY = 2025;\n\n/** Old-regime slabs used below — chosen so hand-computation is easy. */\nconst OLD_SLABS = [\n  { from: 0, to: 250000, rate: 0 },\n  { from: 250000, to: 500000, rate: 0.05 },\n  { from: 500000, to: 1000000, rate: 0.20 },\n  { from: 1000000, to: Infinity, rate: 0.30 },\n];\n\nbeforeAll(async () => {\n  const d = await import(`${REPO_ROOT}/services/payroll-service/src/modules/fnf/domain.js`);\n  computeFnfSettlement = d.computeFnfSettlement;\n\n  const { registerTaxConfig } = await import(\n    `${REPO_ROOT}/services/payroll-service/src/modules/tax/engine.js`\n  );\n  registerTaxConfig(\"old\", FY, {\n    slabs: OLD_SLABS,\n    stdDeduction: 50000,\n    rebateIncomeCap: 500000,\n    rebateMax: 12500,\n    surchargeBands: [{ above: 5000000, rate: 0.10 }, { above: 10000000, rate: 0.15 }],\n  });\n  registerTaxConfig(\"new\", FY, {\n    slabs: [\n      { from: 0, to: 400000, rate: 0 },\n      { from: 400000, to: 800000, rate: 0.05 },\n      { from: 800000, to: 1200000, rate: 0.10 },\n      { from: 1200000, to: 1600000, rate: 0.15 },\n      { from: 1600000, to: 2000000, rate: 0.20 },\n      { from: 2000000, to: 2400000, rate: 0.25 },\n      { from: 2400000, to: Infinity, rate: 0.30 },\n    ],\n    stdDeduction: 75000,\n    rebateIncomeCap: 1200000,\n    rebateMax: 60000,\n    surchargeBands: [{ above: 5000000, rate: 0.10 }, { above: 10000000, rate: 0.15 }],\n  });\n});\n\n/**\n * A settlement with every exemption-bearing component zeroed, so only the\n * fully-taxable legs (notice buyout + arrears) and the tax context are in play.\n * That isolates the Step 5-8 arithmetic these tests target.\n */\nfunction baseInput(over: Fnf = {}): Fnf {\n  return {\n    employeeId: \"11111111-1111-4000-8000-000000000001\",\n    tenantId: \"00000000-0000-0000-0000-000000000001\",\n    separationType: \"resignation\",\n    separationDate: \"2026-01-31\",\n    employeeCategory: \"private\",\n    noticeBuyoutMinor: 0n,\n    leaveEncashmentGrossMinor: 0n,\n    gratuityGrossMinor: 0n,\n    retrenchmentCompMinor: 0n,\n    vrsCompMinor: 0n,\n    arrearsMinor: 0n,\n    lastDrawnWagesMinor: 5_000_000n,\n    completedYears: 3,\n    avgSalaryLast10MonthsMinor: 5_000_000n,\n    leaveBalanceDays: 0,\n    priorLeaveEncashExemptionMinor: 0n,\n    remainingMonthsToRetirement: 240,\n    taxRegime: \"new\",\n    salaryYtdMinor: 0n,\n    tdsYtdMinor: 0n,\n    deductions80cMinor: 0n,\n    deductions80dMinor: 0n,\n    otherDeductionsMinor: 0n,\n    fyStartYear: FY,\n    ...over,\n  };\n}\n\n// ── Step 5: separation income ADDS to FY salary income (L153) ────────────────\n\ndescribe(\"L10 F&F — separation income adds to FY salary income\", () => {\n  it(\"taxable separation income raises annual taxable income\", () => {\n    // arrears are fully taxable u/s 17(1)\n    const without = computeFnfSettlement(baseInput({ salaryYtdMinor: 60_000_000n }));\n    const withArrears = computeFnfSettlement(\n      baseInput({ salaryYtdMinor: 60_000_000n, arrearsMinor: 10_000_000n }),\n    );\n    // A surviving MINUS at L153 would make this DECREASE.\n    expect(withArrears.annualTaxableMinor).toBe(without.annualTaxableMinor + 10_000_000n);\n  });\n\n  it(\"notice buyout is fully taxable and adds to taxable income\", () => {\n    const without = computeFnfSettlement(baseInput({ salaryYtdMinor: 60_000_000n }));\n    const withBuyout = computeFnfSettlement(\n      baseInput({ salaryYtdMinor: 60_000_000n, noticeBuyoutMinor: 5_000_000n }),\n    );\n    expect(withBuyout.annualTaxableMinor).toBe(without.annualTaxableMinor + 5_000_000n);\n    expect(withBuyout.totalTaxableOnSeparationMinor).toBe(5_000_000n);\n  });\n\n  it(\"YTD salary already paid raises taxable income one-for-one\", () => {\n    const low = computeFnfSettlement(baseInput({ salaryYtdMinor: 60_000_000n }));\n    const high = computeFnfSettlement(baseInput({ salaryYtdMinor: 80_000_000n }));\n    expect(high.annualTaxableMinor).toBe(low.annualTaxableMinor + 20_000_000n);\n  });\n});\n\n// ── Standard deduction: rupees -> paise (L154) ───────────────────────────────\n\ndescribe(\"L10 F&F — standard deduction is converted rupees to paise\", () => {\n  it(\"new regime deducts Rs 75,000 = 7,500,000 paise\", () => {\n    // salaryYtd 60,00,000 paise (Rs 60,000)... use a large salary so the clamp\n    // at zero does not mask the deduction.\n    const r = computeFnfSettlement(baseInput({ taxRegime: \"new\", salaryYtdMinor: 100_000_000n }));\n    // annualTaxable = 100_000_000 - 7_500_000 - 0 = 92_500_000\n    expect(r.annualTaxableMinor).toBe(92_500_000n);\n  });\n\n  it(\"old regime deducts Rs 50,000 = 5,000,000 paise\", () => {\n    const r = computeFnfSettlement(baseInput({ taxRegime: \"old\", salaryYtdMinor: 100_000_000n }));\n    // annualTaxable = 100_000_000 - 5_000_000 - 0 = 95_000_000\n    expect(r.annualTaxableMinor).toBe(95_000_000n);\n  });\n\n  it(\"the regimes differ by exactly the Rs 25,000 std-deduction gap\", () => {\n    const nu = computeFnfSettlement(baseInput({ taxRegime: \"new\", salaryYtdMinor: 100_000_000n }));\n    const old = computeFnfSettlement(baseInput({ taxRegime: \"old\", salaryYtdMinor: 100_000_000n }));\n    // A `/ 100n` mutant on the conversion would collapse this difference.\n    expect(old.annualTaxableMinor - nu.annualTaxableMinor).toBe(2_500_000n);\n  });\n});\n\n// ── Chapter VI-A: old regime only, additive (L155, L156) ────────────────────\n\ndescribe(\"L10 F&F — Chapter VI-A deductions apply only in the old regime\", () => {\n  const salary = 100_000_000n;\n\n  it(\"80C reduces taxable income in the OLD regime\", () => {\n    const none = computeFnfSettlement(baseInput({ taxRegime: \"old\", salaryYtdMinor: salary }));\n    const with80c = computeFnfSettlement(\n      baseInput({ taxRegime: \"old\", salaryYtdMinor: salary, deductions80cMinor: 15_000_000n }),\n    );\n    expect(with80c.annualTaxableMinor).toBe(none.annualTaxableMinor - 15_000_000n);\n  });\n\n  it(\"80C is IGNORED in the NEW regime\", () => {\n    const none = computeFnfSettlement(baseInput({ taxRegime: \"new\", salaryYtdMinor: salary }));\n    const with80c = computeFnfSettlement(\n      baseInput({ taxRegime: \"new\", salaryYtdMinor: salary, deductions80cMinor: 15_000_000n }),\n    );\n    // Kills the regime-branch inversion at L155.\n    expect(with80c.annualTaxableMinor).toBe(none.annualTaxableMinor);\n  });\n\n  it(\"80C, 80D and other deductions accumulate ADDITIVELY (old regime)\", () => {\n    const none = computeFnfSettlement(baseInput({ taxRegime: \"old\", salaryYtdMinor: salary }));\n    const all = computeFnfSettlement(\n      baseInput({\n        taxRegime: \"old\",\n        salaryYtdMinor: salary,\n        deductions80cMinor: 10_000_000n,\n        deductions80dMinor: 2_500_000n,\n        otherDeductionsMinor: 1_500_000n,\n      }),\n    );\n    // Kills both the MINUS and the dropped-term mutants at L156.\n    expect(all.annualTaxableMinor).toBe(none.annualTaxableMinor - 14_000_000n);\n  });\n\n  it(\"each Chapter VI-A component contributes on its own\", () => {\n    const none = computeFnfSettlement(baseInput({ taxRegime: \"old\", salaryYtdMinor: salary }));\n    for (const key of [\"deductions80cMinor\", \"deductions80dMinor\", \"otherDeductionsMinor\"]) {\n      const one = computeFnfSettlement(\n        baseInput({ taxRegime: \"old\", salaryYtdMinor: salary, [key]: 1_000_000n }),\n      );\n      expect(one.annualTaxableMinor, `${key} had no effect`).toBe(\n        none.annualTaxableMinor - 1_000_000n,\n      );\n    }\n  });\n});\n\n// ── Clamps: taxable and TDS never go negative (L160, L169) ──────────────────\n\ndescribe(\"L10 F&F — negative results are clamped to zero, never emitted\", () => {\n  it(\"annual taxable income clamps at 0 when deductions exceed income\", () => {\n    const r = computeFnfSettlement(\n      baseInput({ taxRegime: \"old\", salaryYtdMinor: 1_000_000n, deductions80cMinor: 90_000_000n }),\n    );\n    // 1_000_000 - 5_000_000 - 90_000_000 is deeply negative -> clamp to 0.\n    expect(r.annualTaxableMinor).toBe(0n);\n    expect(r.annualTaxableMinor).toBeGreaterThanOrEqual(0n);\n  });\n\n  it(\"no tax is due when taxable income clamps to zero\", () => {\n    const r = computeFnfSettlement(\n      baseInput({ taxRegime: \"old\", salaryYtdMinor: 1_000_000n, deductions80cMinor: 90_000_000n }),\n    );\n    expect(r.annualTaxMinor).toBe(0n);\n  });\n\n  it(\"TDS on separation clamps at 0 when YTD TDS already exceeds annual tax\", () => {\n    const r = computeFnfSettlement(\n      baseInput({ salaryYtdMinor: 100_000_000n, tdsYtdMinor: 999_000_000n }),\n    );\n    // Over-deducted YTD: a refund is NOT emitted as a negative deduction.\n    expect(r.tdsOnSeparationMinor).toBe(0n);\n  });\n\n  it(\"TDS on separation is annual tax minus YTD TDS when positive\", () => {\n    // Income must clear the Sec 87A rebate cap (Rs 12,00,000 in the new regime)\n    // or the tax is legitimately zero and there is no TDS to apportion.\n    const noYtd = computeFnfSettlement(baseInput({ salaryYtdMinor: 200_000_000n, tdsYtdMinor: 0n }));\n    const someYtd = computeFnfSettlement(\n      baseInput({ salaryYtdMinor: 200_000_000n, tdsYtdMinor: 100_000n }),\n    );\n    expect(noYtd.tdsOnSeparationMinor).toBeGreaterThan(0n);\n    expect(someYtd.tdsOnSeparationMinor).toBe(noYtd.tdsOnSeparationMinor - 100_000n);\n  });\n});\n\n// ── Annual tax: rupee/paise conversion and Sec 288A rounding (L163, L165) ───\n\ndescribe(\"L10 F&F — annual tax conversion and Sec 288A rounding\", () => {\n  it(\"annual tax is a whole number of rupees expressed in paise\", () => {\n    const r = computeFnfSettlement(baseInput({ salaryYtdMinor: 100_000_000n }));\n    // A `/ 100n` mutant at L165 would leave a non-rupee-aligned figure.\n    expect(r.annualTaxMinor % 100n).toBe(0n);\n  });\n\n  it(\"Sec 87A rebate zeroes the tax below the rebate cap\", () => {\n    // salaryYtd Rs 10,00,000; new-regime std ded Rs 75,000 -> taxable Rs 9,25,000.\n    // Slab tax = 0 (0-4L) + 20,000 (4L-8L @5%) + 12,500 (8L-9.25L @10%) = 32,500.\n    // Taxable Rs 9,25,000 <"+"= the Rs 12,00,000 rebate cap, so 87A rebates\n    // min(32,500, 60,000) = 32,500 and the tax is legitimately ZERO.\n    const r = computeFnfSettlement(baseInput({ taxRegime: \"new\", salaryYtdMinor: 100_000_000n }));\n    expect(r.annualTaxableMinor).toBe(92_500_000n);\n    expect(r.annualTaxMinor).toBe(0n);\n  });\n\n  it(\"annual tax above the rebate cap is computed from the slabs by hand\", () => {\n    // salaryYtd Rs 20,00,000; std ded Rs 75,000 -> taxable Rs 19,25,000\n    // (Sec 288A rounds to the nearest 10 -> unchanged).\n    // Above the Rs 12,00,000 cap, so NO 87A rebate:\n    //        0-4L    @0                        =       0\n    //        4L-8L   @5%  on 4,00,000          =  20,000\n    //        8L-12L  @10% on 4,00,000          =  40,000\n    //        12L-16L @15% on 4,00,000          =  60,000\n    //        16L-19.25L @20% on 3,25,000       =  65,000\n    //        base tax                          = 185,000\n    //        surcharge: none (below Rs 50L)\n    //        cess 4% of 185,000                =   7,400\n    //        total 192,400, rounded to 10      = 192,400\n    const r = computeFnfSettlement(baseInput({ taxRegime: \"new\", salaryYtdMinor: 200_000_000n }));\n    expect(r.annualTaxableMinor).toBe(192_500_000n);\n    expect(r.annualTaxMinor).toBe(19_240_000n); // Rs 1,92,400 in paise\n  });\n\n  it(\"a higher taxable income yields a higher tax (monotonic)\", () => {\n    const lo = computeFnfSettlement(baseInput({ salaryYtdMinor: 100_000_000n }));\n    const hi = computeFnfSettlement(baseInput({ salaryYtdMinor: 200_000_000n }));\n    // Kills Math.max -> Math.min and the `* 100` / `/ 100` swaps at L163.\n    expect(hi.annualTaxMinor).toBeGreaterThan(lo.annualTaxMinor);\n  });\n\n  it(\"zero income yields zero tax\", () => {\n    const r = computeFnfSettlement(baseInput({ salaryYtdMinor: 0n }));\n    expect(r.annualTaxableMinor).toBe(0n);\n    expect(r.annualTaxMinor).toBe(0n);\n  });\n});\n\n// ── Step 8: net payable conservation ────────────────────────────────────────\n\ndescribe(\"L10 F&F — net payable equals gross less TDS\", () => {\n  it(\"net = gross - TDS on separation\", () => {\n    const r = computeFnfSettlement(\n      baseInput({\n        salaryYtdMinor: 100_000_000n,\n        noticeBuyoutMinor: 5_000_000n,\n        arrearsMinor: 2_000_000n,\n      }),\n    );\n    expect(r.netPayableMinor).toBe(r.totalGrossMinor - r.tdsOnSeparationMinor);\n  });\n\n  it(\"gross is the sum of all settlement legs\", () => {\n    const r = computeFnfSettlement(\n      baseInput({\n        noticeBuyoutMinor: 1_000_000n,\n        leaveEncashmentGrossMinor: 2_000_000n,\n        gratuityGrossMinor: 3_000_000n,\n        retrenchmentCompMinor: 4_000_000n,\n        vrsCompMinor: 5_000_000n,\n        arrearsMinor: 6_000_000n,\n      }),\n    );\n    expect(r.totalGrossMinor).toBe(21_000_000n);\n  });\n\n  it(\"every leg contributes to gross individually\", () => {\n    const legs = [\n      \"noticeBuyoutMinor\",\n      \"leaveEncashmentGrossMinor\",\n      \"gratuityGrossMinor\",\n      \"retrenchmentCompMinor\",\n      \"vrsCompMinor\",\n      \"arrearsMinor\",\n    ];\n    for (const leg of legs) {\n      const r = computeFnfSettlement(baseInput({ [leg]: 1_000_000n }));\n      expect(r.totalGrossMinor, `${leg} missing from gross`).toBe(1_000_000n);\n    }\n  });\n});\n"},"services/payroll-service/tests/fnf-domain.test.ts":{"tests":[{"id":"78","name":"computeFnfSettlement — Govt employee retiring after 30 years gratuity + leave encashment fully exempt, TDS only on notice buyout"},{"id":"79","name":"computeFnfSettlement — Private employee resigning after 3 years gratuity = 0 (ineligible), leave encashment fully taxable (resignation)"},{"id":"80","name":"computeFnfSettlement — Private employee retiring after 20 years partial exemptions on gratuity and leave, TDS true-up is correct"},{"id":"81","name":"computeFnfSettlement — Conservation: exempt + taxable = gross totalExempt + totalTaxableOnSeparation = totalGross for all components"},{"id":"82","name":"computeFnfSettlement — Conservation: exempt + taxable = gross conservation holds with retrenchment separation"},{"id":"83","name":"computeFnfSettlement — Conservation: exempt + taxable = gross conservation holds with VRS separation"}],"source":"import { describe, it, expect } from \"vitest\";\nimport { computeFnfSettlement, type FnfInput } from \"../src/modules/fnf/domain.js\";\n\n/**\n * Unit tests for the F&F Settlement domain function `computeFnfSettlement`.\n * All amounts in paise (bigint). Tax config for FY 2024 new regime is loaded\n * via the vitest setupFiles (setup-tax-config.ts).\n */\n\n// ── Helpers ──────────────────────────────────────────────────────────────────\n\n/** Builds a base FnfInput with sensible defaults; override fields as needed. */\nfunction baseFnfInput(overrides: Partial<"+"FnfInput> = {}): FnfInput {\n  return {\n    employeeId: \"emp-001\",\n    tenantId: \"tenant-001\",\n    separationType: \"retirement\",\n    separationDate: \"2025-01-31\",\n    employeeCategory: \"non_govt_covered\",\n    noticeBuyoutMinor: 0n,\n    leaveEncashmentGrossMinor: 0n,\n    gratuityGrossMinor: 0n,\n    retrenchmentCompMinor: 0n,\n    vrsCompMinor: 0n,\n    arrearsMinor: 0n,\n    lastDrawnWagesMinor: 0n,\n    completedYears: 0,\n    avgSalaryLast10MonthsMinor: 0n,\n    leaveBalanceDays: 0,\n    priorLeaveEncashExemptionMinor: 0n,\n    remainingMonthsToRetirement: 0,\n    taxRegime: \"new\",\n    salaryYtdMinor: 0n,\n    tdsYtdMinor: 0n,\n    deductions80cMinor: 0n,\n    deductions80dMinor: 0n,\n    otherDeductionsMinor: 0n,\n    fyStartYear: 2024,\n    gratuityCeilingMinor: 2000000000n, // ₹20L\n    leaveEncashCeilingMinor: 2500000000n, // ₹25L\n    retrenchmentCeilingMinor: 500000000n, // ₹5L\n    vrsCeilingMinor: 500000000n, // ₹5L\n    ...overrides,\n  };\n}\n\n// ══════════════════════════════════════════════════════════════════════════════\n// Test 1: Govt employee retiring after 30 years → TDS only on notice buyout\n// ══════════════════════════════════════════════════════════════════════════════\ndescribe(\"computeFnfSettlement — Govt employee retiring after 30 years\", () => {\n  it(\"gratuity + leave encashment fully exempt, TDS only on notice buyout\", () => {\n    const input = baseFnfInput({\n      employeeCategory: \"govt\",\n      separationType: \"retirement\",\n      completedYears: 30,\n      // Gratuity: ₹20L\n      gratuityGrossMinor: 2000000000n,\n      lastDrawnWagesMinor: 15000000n, // ₹1.5L monthly basic+DA\n      // Leave encashment: ₹10L\n      leaveEncashmentGrossMinor: 1000000000n,\n      avgSalaryLast10MonthsMinor: 12000000n, // ₹1.2L\n      leaveBalanceDays: 300,\n      // Notice buyout: ₹3L (always fully taxable)\n      noticeBuyoutMinor: 300000000n,\n      // Salary YTD ₹15L (April-Jan = 10 months × ₹1.5L)\n      salaryYtdMinor: 1500000000n,\n      tdsYtdMinor: 50000000n, // ₹50K TDS already paid\n      taxRegime: \"new\",\n      fyStartYear: 2024,\n    });\n\n    const result = computeFnfSettlement(input);\n\n    // Govt: gratuity fully exempt\n    expect(result.gratuityExemption.exemptMinor).toBe(2000000000n);\n    expect(result.gratuityExemption.taxableMinor).toBe(0n);\n\n    // Govt: leave encashment fully exempt\n    expect(result.leaveEncashExemption.exemptMinor).toBe(1000000000n);\n    expect(result.leaveEncashExemption.taxableMinor).toBe(0n);\n\n    // Total exempt = gratuity + leave encashment\n    expect(result.totalExemptMinor).toBe(3000000000n);\n\n    // Taxable on separation = notice buyout only (₹3L)\n    expect(result.totalTaxableOnSeparationMinor).toBe(300000000n);\n\n    // TDS on separation should be >= 0 (computed via tax engine)\n    expect(result.tdsOnSeparationMinor).toBeGreaterThanOrEqual(0n);\n\n    // Net payable = totalGross - tdsOnSeparation\n    expect(result.netPayableMinor).toBe(result.totalGrossMinor - result.tdsOnSeparationMinor);\n  });\n});\n\n// ══════════════════════════════════════════════════════════════════════════════\n// Test 2: Private employee resigning after 3 years → no gratuity, leave taxable\n// ══════════════════════════════════════════════════════════════════════════════\ndescribe(\"computeFnfSettlement — Private employee resigning after 3 years\", () => {\n  it(\"gratuity = 0 (ineligible), leave encashment fully taxable (resignation)\", () => {\n    const input = baseFnfInput({\n      employeeCategory: \"non_govt_covered\",\n      separationType: \"resignation\",\n      completedYears: 3,\n      // No gratuity paid (ineligible under PG Act <"+" 5 years)\n      gratuityGrossMinor: 0n,\n      lastDrawnWagesMinor: 8000000n, // ₹80K monthly\n      // Leave encashment: ₹2L\n      leaveEncashmentGrossMinor: 200000000n,\n      avgSalaryLast10MonthsMinor: 8000000n,\n      leaveBalanceDays: 45,\n      // Arrears: ₹50K\n      arrearsMinor: 5000000n,\n      // Salary YTD ₹4.8L (6 months × ₹80K)\n      salaryYtdMinor: 480000000n,\n      tdsYtdMinor: 0n, // No TDS deducted yet (below tax threshold)\n      taxRegime: \"new\",\n      fyStartYear: 2024,\n    });\n\n    const result = computeFnfSettlement(input);\n\n    // Gratuity: 0 gross → 0 exempt, 0 taxable\n    expect(result.gratuityExemption.exemptMinor).toBe(0n);\n    expect(result.gratuityExemption.taxableMinor).toBe(0n);\n\n    // Leave encashment: resignation → NO exemption, fully taxable\n    expect(result.leaveEncashExemption.exemptMinor).toBe(0n);\n    expect(result.leaveEncashExemption.taxableMinor).toBe(200000000n);\n\n    // Total exempt = 0\n    expect(result.totalExemptMinor).toBe(0n);\n\n    // Taxable on separation = leave encashment + arrears\n    expect(result.totalTaxableOnSeparationMinor).toBe(200000000n + 5000000n);\n\n    // Net payable check\n    expect(result.netPayableMinor).toBe(result.totalGrossMinor - result.tdsOnSeparationMinor);\n  });\n});\n\n// ══════════════════════════════════════════════════════════════════════════════\n// Test 3: Private employee retiring after 20 years → partial exemptions, TDS true-up\n// ══════════════════════════════════════════════════════════════════════════════\ndescribe(\"computeFnfSettlement — Private employee retiring after 20 years\", () => {\n  it(\"partial exemptions on gratuity and leave, TDS true-up is correct\", () => {\n    const lastDrawnWages = 12000000n; // ₹1.2L monthly basic+DA\n    const avgSalary10Mo = 11000000n;  // ₹1.1L average last 10 months\n\n    const input = baseFnfInput({\n      employeeCategory: \"non_govt_covered\",\n      separationType: \"retirement\",\n      completedYears: 20,\n      // Gratuity: ₹15L\n      gratuityGrossMinor: 1500000000n,\n      lastDrawnWagesMinor: lastDrawnWages,\n      // Leave encashment: ₹8L\n      leaveEncashmentGrossMinor: 800000000n,\n      avgSalaryLast10MonthsMinor: avgSalary10Mo,\n      leaveBalanceDays: 240,\n      priorLeaveEncashExemptionMinor: 0n,\n      // Salary YTD ₹12L (10 months × ₹1.2L)\n      salaryYtdMinor: 1200000000n,\n      tdsYtdMinor: 80000000n, // ₹80K TDS already deducted\n      taxRegime: \"new\",\n      fyStartYear: 2024,\n    });\n\n    const result = computeFnfSettlement(input);\n\n    // Gratuity exemption: formula = (12000000 * 15 * 20) / 26 = 138461538n (~₹13.85L)\n    // LEAST(actual ₹15L, ceiling ₹20L, formula ~₹13.85L) = formula\n    const expectedGratuityFormula = (lastDrawnWages * 15n * 20n) / 26n;\n    expect(result.gratuityExemption.exemptMinor).toBe(expectedGratuityFormula);\n    expect(result.gratuityExemption.taxableMinor).toBe(1500000000n - expectedGratuityFormula);\n\n    // Leave encashment: retirement → exemption applies\n    // 10-month avg = 11000000 × 10 = 110000000 (₹1.1L × 10 = ₹11L)\n    // cashEquiv = (11000000/30) × min(240, 20×30=600) → (366666) × 240 = 87999840\n    // ceiling−prior = 2500000000 - 0 = 2500000000\n    // actual = 800000000\n    // LEAST = cashEquiv (87999840) since it's smallest\n    const dailySalary = avgSalary10Mo / 30n;\n    const maxDays = Math.min(240, 20 * 30);\n    const cashEquiv = dailySalary * BigInt(maxDays);\n    const tenMonthAvg = avgSalary10Mo * 10n;\n    // LEAST of (actual, ceiling, tenMonthAvg, cashEquiv)\n    const expectedLeaveExempt = [800000000n, 2500000000n, tenMonthAvg, cashEquiv]\n      .reduce((min, v) => v <"+" min ? v : min);\n    expect(result.leaveEncashExemption.exemptMinor).toBe(expectedLeaveExempt);\n    expect(result.leaveEncashExemption.taxableMinor).toBe(800000000n - expectedLeaveExempt);\n\n    // TDS true-up: tdsOnSeparation = annualTax - tdsYtd (clamped to 0)\n    expect(result.tdsOnSeparationMinor).toBe(\n      result.annualTaxMinor > 80000000n\n        ? result.annualTaxMinor - 80000000n\n        : 0n\n    );\n\n    // Net payable\n    expect(result.netPayableMinor).toBe(result.totalGrossMinor - result.tdsOnSeparationMinor);\n  });\n});\n\n// ══════════════════════════════════════════════════════════════════════════════\n// Test 4: Conservation property — exempt + taxable = gross for each component\n// ══════════════════════════════════════════════════════════════════════════════\ndescribe(\"computeFnfSettlement — Conservation: exempt + taxable = gross\", () => {\n  it(\"totalExempt + totalTaxableOnSeparation = totalGross for all components\", () => {\n    const input = baseFnfInput({\n      employeeCategory: \"non_govt_covered\",\n      separationType: \"retirement\",\n      completedYears: 15,\n      gratuityGrossMinor: 1000000000n,  // ₹10L\n      lastDrawnWagesMinor: 10000000n,   // ₹1L\n      leaveEncashmentGrossMinor: 500000000n, // ₹5L\n      avgSalaryLast10MonthsMinor: 9000000n,\n      leaveBalanceDays: 180,\n      noticeBuyoutMinor: 200000000n,    // ₹2L\n      arrearsMinor: 100000000n,         // ₹1L\n      salaryYtdMinor: 1000000000n,\n      tdsYtdMinor: 50000000n,\n      taxRegime: \"new\",\n      fyStartYear: 2024,\n    });\n\n    const result = computeFnfSettlement(input);\n\n    // Gratuity: exempt + taxable = gross\n    expect(result.gratuityExemption.exemptMinor + result.gratuityExemption.taxableMinor)\n      .toBe(input.gratuityGrossMinor);\n\n    // Leave encashment: exempt + taxable = gross\n    expect(result.leaveEncashExemption.exemptMinor + result.leaveEncashExemption.taxableMinor)\n      .toBe(input.leaveEncashmentGrossMinor);\n\n    // Retrenchment: null for retirement (non-retrenchment separation)\n    expect(result.retrenchmentExemption).toBeNull();\n\n    // VRS: null for retirement (non-VRS separation)\n    expect(result.vrsExemption).toBeNull();\n\n    // Overall conservation: totalExempt + totalTaxableOnSeparation = totalGross\n    // totalTaxableOnSeparation includes noticeBuyout + arrears + taxable portions of each component\n    // totalExempt includes exempt portions of each component\n    // So: totalExempt + totalTaxable = totalGross\n    expect(result.totalExemptMinor + result.totalTaxableOnSeparationMinor)\n      .toBe(result.totalGrossMinor);\n  });\n\n  it(\"conservation holds with retrenchment separation\", () => {\n    const input = baseFnfInput({\n      employeeCategory: \"non_govt_covered\",\n      separationType: \"retrenchment\",\n      completedYears: 10,\n      gratuityGrossMinor: 500000000n,    // ₹5L\n      lastDrawnWagesMinor: 8000000n,     // ₹80K\n      leaveEncashmentGrossMinor: 300000000n, // ₹3L\n      avgSalaryLast10MonthsMinor: 8000000n,\n      leaveBalanceDays: 120,\n      retrenchmentCompMinor: 400000000n, // ₹4L\n      noticeBuyoutMinor: 0n,\n      arrearsMinor: 0n,\n      salaryYtdMinor: 600000000n,\n      tdsYtdMinor: 20000000n,\n      taxRegime: \"new\",\n      fyStartYear: 2024,\n    });\n\n    const result = computeFnfSettlement(input);\n\n    // Gratuity: exempt + taxable = gross\n    expect(result.gratuityExemption.exemptMinor + result.gratuityExemption.taxableMinor)\n      .toBe(input.gratuityGrossMinor);\n\n    // Leave encashment: retrenchment is NOT in the exempt-qualifying set\n    // So fully taxable\n    expect(result.leaveEncashExemption.exemptMinor + result.leaveEncashExemption.taxableMinor)\n      .toBe(input.leaveEncashmentGrossMinor);\n\n    // Retrenchment compensation: exempt + taxable = gross\n    expect(result.retrenchmentExemption).not.toBeNull();\n    expect(result.retrenchmentExemption!.exemptMinor + result.retrenchmentExemption!.taxableMinor)\n      .toBe(input.retrenchmentCompMinor);\n\n    // Overall conservation: totalExempt + totalTaxable = totalGross\n    expect(result.totalExemptMinor + result.totalTaxableOnSeparationMinor)\n      .toBe(result.totalGrossMinor);\n  });\n\n  it(\"conservation holds with VRS separation\", () => {\n    const input = baseFnfInput({\n      employeeCategory: \"non_govt_covered\",\n      separationType: \"vrs\",\n      completedYears: 12,\n      gratuityGrossMinor: 600000000n,  // ₹6L\n      lastDrawnWagesMinor: 9000000n,   // ₹90K\n      leaveEncashmentGrossMinor: 200000000n, // ₹2L\n      avgSalaryLast10MonthsMinor: 9000000n,\n      leaveBalanceDays: 90,\n      vrsCompMinor: 800000000n,        // ₹8L\n      remainingMonthsToRetirement: 48,\n      noticeBuyoutMinor: 0n,\n      arrearsMinor: 50000000n,         // ₹50K\n      salaryYtdMinor: 900000000n,\n      tdsYtdMinor: 30000000n,\n      taxRegime: \"new\",\n      fyStartYear: 2024,\n    });\n\n    const result = computeFnfSettlement(input);\n\n    // Gratuity: exempt + taxable = gross\n    expect(result.gratuityExemption.exemptMinor + result.gratuityExemption.taxableMinor)\n      .toBe(input.gratuityGrossMinor);\n\n    // Leave encashment: VRS is NOT in the qualifying separation set\n    expect(result.leaveEncashExemption.exemptMinor + result.leaveEncashExemption.taxableMinor)\n      .toBe(input.leaveEncashmentGrossMinor);\n\n    // VRS: exempt + taxable = gross\n    expect(result.vrsExemption).not.toBeNull();\n    expect(result.vrsExemption!.exemptMinor + result.vrsExemption!.taxableMinor)\n      .toBe(input.vrsCompMinor);\n\n    // Overall conservation\n    expect(result.totalExemptMinor + result.totalTaxableOnSeparationMinor)\n      .toBe(result.totalGrossMinor);\n  });\n});\n"},"services/payroll-service/tests/domain.test.ts":{"tests":[{"id":"84","name":"domain — computeSettlementDate Friday + 1 offset = Monday (skips Saturday and Sunday)"},{"id":"85","name":"domain — computeSettlementDate Monday + 1 offset = Tuesday"},{"id":"86","name":"domain — computeSettlementDate skips holidays"},{"id":"87","name":"domain — computeSettlementDate skips multiple consecutive holidays and weekends"},{"id":"88","name":"domain — computeSettlementDate offset 0 on a weekday returns the same day"},{"id":"89","name":"domain — computeSettlementDate offset 0 on a Saturday returns next Monday"},{"id":"90","name":"domain — computeSettlementDate offset 0 on a Sunday returns next Monday"},{"id":"91","name":"domain — computeSettlementDate offset 0 on a holiday (weekday) returns next business day"},{"id":"92","name":"domain — validateNachBeneficiaries valid beneficiary passes"},{"id":"93","name":"domain — validateNachBeneficiaries catches invalid IFSC (lowercase)"},{"id":"94","name":"domain — validateNachBeneficiaries catches invalid IFSC (wrong format — missing 0 at position 5)"},{"id":"95","name":"domain — validateNachBeneficiaries catches empty account number"},{"id":"96","name":"domain — validateNachBeneficiaries catches whitespace-only account number"},{"id":"97","name":"domain — validateNachBeneficiaries catches zero amount"},{"id":"98","name":"domain — validateNachBeneficiaries catches negative amount"},{"id":"99","name":"domain — validateNachBeneficiaries reports multiple errors for one beneficiary"},{"id":"100","name":"domain — validateNachBeneficiaries reports errors across multiple beneficiaries"},{"id":"101","name":"domain — splitIntoBatches respects max record count"},{"id":"102","name":"domain — splitIntoBatches respects max amount limit"},{"id":"103","name":"domain — splitIntoBatches single item per batch when each exceeds amount limit"},{"id":"104","name":"domain — splitIntoBatches preserves all beneficiaries (no loss, no duplication)"},{"id":"105","name":"domain — splitIntoBatches returns empty array for empty input"},{"id":"106","name":"domain — splitIntoBatches both limits trigger at the same boundary"},{"id":"107","name":"domain — computeBatchHash is deterministic (same input → same output)"},{"id":"108","name":"domain — computeBatchHash computes correctly for known values"},{"id":"109","name":"domain — computeBatchHash handles short account numbers (<"+" 8 chars) by left-padding with zeros"},{"id":"110","name":"domain — computeBatchHash applies mod 10^13 for large sums"},{"id":"111","name":"domain — computeBatchHash returns 0 for empty beneficiary list"},{"id":"112","name":"domain — sanitizeAscii strips Unicode characters (non-ASCII)"},{"id":"113","name":"domain — sanitizeAscii truncates strings longer than maxLen"},{"id":"114","name":"domain — sanitizeAscii pads short strings with spaces to exactly maxLen"},{"id":"115","name":"domain — sanitizeAscii returns all spaces for empty input"},{"id":"116","name":"domain — sanitizeAscii preserves ASCII characters as-is"},{"id":"117","name":"domain — sanitizeAscii handles string that is exactly maxLen"},{"id":"118","name":"domain — sanitizeAscii strips all chars if entire input is non-ASCII"},{"id":"119","name":"domain — sanitizeAscii handles mixed ASCII and high-code chars then truncates"}],"source":"/**\n * Unit tests for NACH domain logic — settlement date, validation,\n * batch splitting, batch hash, and ASCII sanitization.\n */\nimport { describe, it, expect } from \"vitest\";\nimport {\n  computeSettlementDate,\n  validateNachBeneficiaries,\n  splitIntoBatches,\n  computeBatchHash,\n  sanitizeAscii,\n  type NachBeneficiary,\n} from \"../src/modules/bank-transfer/domain.js\";\n\n// ─── Helper: create a NachBeneficiary with defaults ─────────────────────\nfunction makeBeneficiary(overrides?: Partial<"+"NachBeneficiary>): NachBeneficiary {\n  return {\n    ifsc: \"SBIN0001234\",\n    accountNo: \"12345678901\",\n    amountMinor: 5000000n, // ₹50,000\n    name: \"John Doe\",\n    reference: \"EMP001\",\n    narration: \"Salary Jun 2026\",\n    ...overrides,\n  };\n}\n\n// ═══════════════════════════════════════════════════════════════════════════\n// computeSettlementDate\n// ═══════════════════════════════════════════════════════════════════════════\ndescribe(\"domain — computeSettlementDate\", () => {\n  it(\"Friday + 1 offset = Monday (skips Saturday and Sunday)\", () => {\n    // 2026-07-03 is a Friday\n    const friday = new Date(2026, 6, 3); // July 3, 2026\n    const result = computeSettlementDate(1, [], friday);\n    // Next business day is Monday July 6\n    expect(result).toBe(\"06072026\");\n  });\n\n  it(\"Monday + 1 offset = Tuesday\", () => {\n    // 2026-07-06 is a Monday\n    const monday = new Date(2026, 6, 6);\n    const result = computeSettlementDate(1, [], monday);\n    expect(result).toBe(\"07072026\");\n  });\n\n  it(\"skips holidays\", () => {\n    // 2026-07-06 is Monday, July 7 is Tuesday (holiday), so +1 = Wednesday July 8\n    const monday = new Date(2026, 6, 6);\n    const result = computeSettlementDate(1, [\"07072026\"], monday);\n    expect(result).toBe(\"08072026\");\n  });\n\n  it(\"skips multiple consecutive holidays and weekends\", () => {\n    // 2026-07-02 is Thursday. offset=2.\n    // Day 1: Friday July 3 (business day, count=1)\n    // Day 2: Saturday July 4 (skip), Sunday July 5 (skip), Monday July 6 (business day, count=2)\n    const thursday = new Date(2026, 6, 2);\n    const result = computeSettlementDate(2, [], thursday);\n    expect(result).toBe(\"06072026\");\n  });\n\n  it(\"offset 0 on a weekday returns the same day\", () => {\n    // 2026-07-06 is a Monday — already a business day\n    const monday = new Date(2026, 6, 6);\n    const result = computeSettlementDate(0, [], monday);\n    expect(result).toBe(\"06072026\");\n  });\n\n  it(\"offset 0 on a Saturday returns next Monday\", () => {\n    // 2026-07-04 is a Saturday\n    const saturday = new Date(2026, 6, 4);\n    const result = computeSettlementDate(0, [], saturday);\n    expect(result).toBe(\"06072026\");\n  });\n\n  it(\"offset 0 on a Sunday returns next Monday\", () => {\n    // 2026-07-05 is a Sunday\n    const sunday = new Date(2026, 6, 5);\n    const result = computeSettlementDate(0, [], sunday);\n    expect(result).toBe(\"06072026\");\n  });\n\n  it(\"offset 0 on a holiday (weekday) returns next business day\", () => {\n    // 2026-07-06 is Monday (holiday), Tuesday July 7 is next business day\n    const monday = new Date(2026, 6, 6);\n    const result = computeSettlementDate(0, [\"06072026\"], monday);\n    expect(result).toBe(\"07072026\");\n  });\n});\n\n// ═══════════════════════════════════════════════════════════════════════════\n// validateNachBeneficiaries\n// ═══════════════════════════════════════════════════════════════════════════\ndescribe(\"domain — validateNachBeneficiaries\", () => {\n  it(\"valid beneficiary passes\", () => {\n    const result = validateNachBeneficiaries([makeBeneficiary()]);\n    expect(result.valid).toBe(true);\n    expect(result.errors).toHaveLength(0);\n  });\n\n  it(\"catches invalid IFSC (lowercase)\", () => {\n    const result = validateNachBeneficiaries([\n      makeBeneficiary({ ifsc: \"sbin0001234\", reference: \"EMP002\" }),\n    ]);\n    expect(result.valid).toBe(false);\n    expect(result.errors).toHaveLength(1);\n    expect(result.errors[0]!.field).toBe(\"ifsc\");\n    expect(result.errors[0]!.reference).toBe(\"EMP002\");\n  });\n\n  it(\"catches invalid IFSC (wrong format — missing 0 at position 5)\", () => {\n    const result = validateNachBeneficiaries([\n      makeBeneficiary({ ifsc: \"SBIN1001234\", reference: \"EMP003\" }),\n    ]);\n    expect(result.valid).toBe(false);\n    expect(result.errors[0]!.field).toBe(\"ifsc\");\n  });\n\n  it(\"catches empty account number\", () => {\n    const result = validateNachBeneficiaries([\n      makeBeneficiary({ accountNo: \"\", reference: \"EMP004\" }),\n    ]);\n    expect(result.valid).toBe(false);\n    expect(result.errors[0]!.field).toBe(\"accountNo\");\n  });\n\n  it(\"catches whitespace-only account number\", () => {\n    const result = validateNachBeneficiaries([\n      makeBeneficiary({ accountNo: \"   \", reference: \"EMP005\" }),\n    ]);\n    expect(result.valid).toBe(false);\n    expect(result.errors[0]!.field).toBe(\"accountNo\");\n  });\n\n  it(\"catches zero amount\", () => {\n    const result = validateNachBeneficiaries([\n      makeBeneficiary({ amountMinor: 0n, reference: \"EMP006\" }),\n    ]);\n    expect(result.valid).toBe(false);\n    expect(result.errors[0]!.field).toBe(\"amountMinor\");\n  });\n\n  it(\"catches negative amount\", () => {\n    const result = validateNachBeneficiaries([\n      makeBeneficiary({ amountMinor: -100n, reference: \"EMP007\" }),\n    ]);\n    expect(result.valid).toBe(false);\n    expect(result.errors[0]!.field).toBe(\"amountMinor\");\n  });\n\n  it(\"reports multiple errors for one beneficiary\", () => {\n    const result = validateNachBeneficiaries([\n      makeBeneficiary({ ifsc: \"INVALID\", accountNo: \"\", amountMinor: 0n, reference: \"EMP008\" }),\n    ]);\n    expect(result.valid).toBe(false);\n    expect(result.errors.length).toBe(3);\n  });\n\n  it(\"reports errors across multiple beneficiaries\", () => {\n    const result = validateNachBeneficiaries([\n      makeBeneficiary({ ifsc: \"BAD\", reference: \"EMP009\" }),\n      makeBeneficiary({ accountNo: \"\", reference: \"EMP010\" }),\n    ]);\n    expect(result.valid).toBe(false);\n    expect(result.errors.length).toBe(2);\n    expect(result.errors[0]!.reference).toBe(\"EMP009\");\n    expect(result.errors[1]!.reference).toBe(\"EMP010\");\n  });\n});\n\n// ═══════════════════════════════════════════════════════════════════════════\n// splitIntoBatches\n// ═══════════════════════════════════════════════════════════════════════════\ndescribe(\"domain — splitIntoBatches\", () => {\n  it(\"respects max record count\", () => {\n    const beneficiaries = Array.from({ length: 5 }, (_, i) =>\n      makeBeneficiary({ reference: `EMP${i}`, amountMinor: 1000n }),\n    );\n    const batches = splitIntoBatches(beneficiaries, 2, 999_999_999n);\n    expect(batches).toHaveLength(3); // [2, 2, 1]\n    expect(batches[0]).toHaveLength(2);\n    expect(batches[1]).toHaveLength(2);\n    expect(batches[2]).toHaveLength(1);\n  });\n\n  it(\"respects max amount limit\", () => {\n    const beneficiaries = [\n      makeBeneficiary({ amountMinor: 6000n, reference: \"A\" }),\n      makeBeneficiary({ amountMinor: 5000n, reference: \"B\" }),\n      makeBeneficiary({ amountMinor: 4000n, reference: \"C\" }),\n    ];\n    // Max 10000n per batch: A(6000) + B(5000) = 11000 > 10000, so B starts new batch\n    const batches = splitIntoBatches(beneficiaries, 100, 10000n);\n    expect(batches).toHaveLength(2);\n    expect(batches[0]).toHaveLength(1); // [A]\n    expect(batches[1]).toHaveLength(2); // [B, C] (5000+4000=9000 ≤ 10000)\n  });\n\n  it(\"single item per batch when each exceeds amount limit\", () => {\n    const beneficiaries = [\n      makeBeneficiary({ amountMinor: 8000n, reference: \"X\" }),\n      makeBeneficiary({ amountMinor: 9000n, reference: \"Y\" }),\n      makeBeneficiary({ amountMinor: 7000n, reference: \"Z\" }),\n    ];\n    // Max 5000n per batch, but each item exceeds — one per batch\n    const batches = splitIntoBatches(beneficiaries, 100, 5000n);\n    expect(batches).toHaveLength(3);\n    expect(batches[0]).toHaveLength(1);\n    expect(batches[1]).toHaveLength(1);\n    expect(batches[2]).toHaveLength(1);\n  });\n\n  it(\"preserves all beneficiaries (no loss, no duplication)\", () => {\n    const beneficiaries = Array.from({ length: 7 }, (_, i) =>\n      makeBeneficiary({ reference: `EMP${i}`, amountMinor: 3000n }),\n    );\n    const batches = splitIntoBatches(beneficiaries, 3, 10000n);\n    const flattened = batches.flat();\n    expect(flattened).toHaveLength(7);\n    // Check all references preserved\n    const refs = flattened.map((b) => b.reference);\n    expect(refs).toEqual(beneficiaries.map((b) => b.reference));\n  });\n\n  it(\"returns empty array for empty input\", () => {\n    const batches = splitIntoBatches([], 10, 10000n);\n    expect(batches).toHaveLength(0);\n  });\n\n  it(\"both limits trigger at the same boundary\", () => {\n    const beneficiaries = [\n      makeBeneficiary({ amountMinor: 5000n, reference: \"A\" }),\n      makeBeneficiary({ amountMinor: 5000n, reference: \"B\" }),\n      makeBeneficiary({ amountMinor: 5000n, reference: \"C\" }),\n    ];\n    // maxRecords=2, maxAmount=10000n: [A,B] is 2 records and 10000n exactly (fits), C starts new\n    const batches = splitIntoBatches(beneficiaries, 2, 10000n);\n    expect(batches).toHaveLength(2);\n    expect(batches[0]).toHaveLength(2);\n    expect(batches[1]).toHaveLength(1);\n  });\n});\n\n// ═══════════════════════════════════════════════════════════════════════════\n// computeBatchHash\n// ═══════════════════════════════════════════════════════════════════════════\ndescribe(\"domain — computeBatchHash\", () => {\n  it(\"is deterministic (same input → same output)\", () => {\n    const beneficiaries = [\n      makeBeneficiary({ accountNo: \"12345678901\" }),\n      makeBeneficiary({ accountNo: \"98765432100\" }),\n    ];\n    const hash1 = computeBatchHash(beneficiaries);\n    const hash2 = computeBatchHash(beneficiaries);\n    expect(hash1).toBe(hash2);\n  });\n\n  it(\"computes correctly for known values\", () => {\n    // Account \"12345678901\" → first 8 = \"12345678\" → 12345678n\n    // Account \"00000001\" → padStart(8,\"0\") = \"00000001\" → first 8 = \"00000001\" → 1n\n    const beneficiaries = [\n      makeBeneficiary({ accountNo: \"12345678901\" }),\n      makeBeneficiary({ accountNo: \"00000001\" }),\n    ];\n    const expected = (12345678n + 1n) % 10_000_000_000_000n;\n    expect(computeBatchHash(beneficiaries)).toBe(expected);\n  });\n\n  it(\"handles short account numbers (<"+" 8 chars) by left-padding with zeros\", () => {\n    // Account \"123\" → padStart(8,\"0\") = \"00000123\" → 123n\n    const beneficiaries = [makeBeneficiary({ accountNo: \"123\" })];\n    expect(computeBatchHash(beneficiaries)).toBe(123n);\n  });\n\n  it(\"applies mod 10^13 for large sums\", () => {\n    // Use account numbers that produce a large first-8-digit sum\n    const beneficiaries = Array.from({ length: 200 }, () =>\n      makeBeneficiary({ accountNo: \"99999999000\" }),\n    );\n    // Each contributes 99999999n. Sum = 200 * 99999999 = 19999999800\n    const expectedSum = 200n * 99999999n;\n    const expectedHash = expectedSum % 10_000_000_000_000n;\n    expect(computeBatchHash(beneficiaries)).toBe(expectedHash);\n  });\n\n  it(\"returns 0 for empty beneficiary list\", () => {\n    expect(computeBatchHash([])).toBe(0n);\n  });\n});\n\n// ═══════════════════════════════════════════════════════════════════════════\n// sanitizeAscii\n// ═══════════════════════════════════════════════════════════════════════════\ndescribe(\"domain — sanitizeAscii\", () => {\n  it(\"strips Unicode characters (non-ASCII)\", () => {\n    const result = sanitizeAscii(\"Hello₹World™\", 20);\n    // \"Hello₹World™\" → strip non-ASCII → \"HelloWorld\" (10 chars), pad to 20\n    expect(result).toBe(\"HelloWorld          \");\n    expect(result.length).toBe(20);\n  });\n\n  it(\"truncates strings longer than maxLen\", () => {\n    const result = sanitizeAscii(\"ABCDEFGHIJ\", 5);\n    expect(result).toBe(\"ABCDE\");\n    expect(result.length).toBe(5);\n  });\n\n  it(\"pads short strings with spaces to exactly maxLen\", () => {\n    const result = sanitizeAscii(\"Hi\", 10);\n    expect(result).toBe(\"Hi        \");\n    expect(result.length).toBe(10);\n  });\n\n  it(\"returns all spaces for empty input\", () => {\n    const result = sanitizeAscii(\"\", 5);\n    expect(result).toBe(\"     \");\n    expect(result.length).toBe(5);\n  });\n\n  it(\"preserves ASCII characters as-is\", () => {\n    const result = sanitizeAscii(\"Rajesh Kumar\", 40);\n    expect(result.startsWith(\"Rajesh Kumar\")).toBe(true);\n    expect(result.length).toBe(40);\n  });\n\n  it(\"handles string that is exactly maxLen\", () => {\n    const result = sanitizeAscii(\"EXACT\", 5);\n    expect(result).toBe(\"EXACT\");\n    expect(result.length).toBe(5);\n  });\n\n  it(\"strips all chars if entire input is non-ASCII\", () => {\n    const result = sanitizeAscii(\"₹™©®\", 10);\n    expect(result).toBe(\"          \");\n    expect(result.length).toBe(10);\n  });\n\n  it(\"handles mixed ASCII and high-code chars then truncates\", () => {\n    // \"A₹B₹C\" → after stripping non-ASCII → \"ABC\", then pad to 5\n    const result = sanitizeAscii(\"A₹B₹C\", 5);\n    expect(result).toBe(\"ABC  \");\n  });\n});\n"},"services/workflow-service/tests/decision-domain.test.ts":{"tests":[{"id":"120","name":"evaluateDecisionTable — FIRST hit policy returns the first matching rule when multiple match"},{"id":"121","name":"evaluateDecisionTable — FIRST hit policy returns the correct rule based on order (first wins)"},{"id":"122","name":"evaluateDecisionTable — FIRST hit policy returns defaults when no rules match"},{"id":"123","name":"evaluateDecisionTable — FIRST hit policy returns empty outputs when no rules match and no defaults"},{"id":"124","name":"evaluateDecisionTable — FIRST hit policy handles empty condition (skip that input check)"},{"id":"125","name":"evaluateDecisionTable — FIRST hit policy handles rule with multiple input conditions (all must match)"},{"id":"126","name":"evaluateDecisionTable — COLLECT hit policy returns all matching rules merged together"},{"id":"127","name":"evaluateDecisionTable — COLLECT hit policy returns defaults when no rules match"},{"id":"128","name":"evaluateDecisionTable — COLLECT hit policy handles a single matching rule"},{"id":"129","name":"evaluateDecisionTable — UNIQUE hit policy returns the single matching rule when exactly one matches"},{"id":"130","name":"evaluateDecisionTable — UNIQUE hit policy returns error when multiple rules match"},{"id":"131","name":"evaluateDecisionTable — UNIQUE hit policy returns error when no rules match"},{"id":"132","name":"evaluateDecisionTable — edge cases handles an empty rule set (no rules)"},{"id":"133","name":"evaluateDecisionTable — edge cases handles rules with in-operator conditions"},{"id":"134","name":"evaluateDecisionTable — edge cases handles equality conditions with strings"},{"id":"135","name":"evaluateDecisionTable — edge cases handles boolean output values"},{"id":"136","name":"evaluateDecisionTable — edge cases handles context with nested paths"},{"id":"137","name":"evaluateDecisionTable — edge cases handles multiple outputs per rule"},{"id":"138","name":"evaluateDecisionTable — edge cases handles less-than (<"+") condition"},{"id":"139","name":"evaluateDecisionTable — edge cases handles not-equal (!=) condition"},{"id":"140","name":"evaluateDecisionTable — edge cases rule with all blank conditions always matches"},{"id":"141","name":"evaluateDecisionTable — edge cases empty rules array returns no match for COLLECT policy"},{"id":"142","name":"evaluateDecisionTable — edge cases empty rules array returns error for UNIQUE policy"}],"source":"/**\n * Unit tests for evaluateDecisionTable (src/modules/decisions/domain.ts).\n * Pure logic, no DB. Covers all hit policies: FIRST, COLLECT, UNIQUE.\n */\nimport { describe, it, expect } from \"vitest\";\nimport { evaluateDecisionTable, type DecisionTableDef, type EvalResult } from \"../src/modules/decisions/domain.js\";\n\n// ---------------------------------------------------------------------------\n// Helpers\n// ---------------------------------------------------------------------------\nfunction buildTable(overrides: Partial<"+"DecisionTableDef> = {}): DecisionTableDef {\n  return {\n    hitPolicy: \"first\",\n    inputs: [\n      { key: \"amount\", label: \"Amount\", type: \"number\" },\n      { key: \"category\", label: \"Category\", type: \"string\" },\n    ],\n    outputs: [\n      { key: \"approvalLevel\", label: \"Approval Level\", type: \"string\" },\n    ],\n    rules: [],\n    ...overrides,\n  };\n}\n\n// ---------------------------------------------------------------------------\n// FIRST hit policy\n// ---------------------------------------------------------------------------\ndescribe(\"evaluateDecisionTable — FIRST hit policy\", () => {\n  it(\"returns the first matching rule when multiple match\", () => {\n    const table = buildTable({\n      hitPolicy: \"first\",\n      rules: [\n        { inputs: { amount: \"> 100000\" }, outputs: { approvalLevel: \"CFO\" } },\n        { inputs: { amount: \"> 50000\" }, outputs: { approvalLevel: \"Director\" } },\n        { inputs: { amount: \"> 10000\" }, outputs: { approvalLevel: \"Manager\" } },\n      ],\n    });\n    // amount=75000 matches rules 1 (>50000) and 2 (>10000), first matching wins\n    const result = evaluateDecisionTable(table, { amount: 75000, category: \"goods\" });\n    expect(result.matched).toBe(true);\n    expect(result.outputs.approvalLevel).toBe(\"Director\");\n    expect(result.matchedRules).toEqual([1]);\n  });\n\n  it(\"returns the correct rule based on order (first wins)\", () => {\n    const table = buildTable({\n      hitPolicy: \"first\",\n      rules: [\n        { inputs: { amount: \"> 50000\" }, outputs: { approvalLevel: \"Director\" } },\n        { inputs: { amount: \"> 100000\" }, outputs: { approvalLevel: \"CFO\" } },\n      ],\n    });\n    // Both match for 200000, but first rule wins\n    const result = evaluateDecisionTable(table, { amount: 200000 });\n    expect(result.matched).toBe(true);\n    expect(result.outputs.approvalLevel).toBe(\"Director\");\n    expect(result.matchedRules).toEqual([0]);\n  });\n\n  it(\"returns defaults when no rules match\", () => {\n    const table = buildTable({\n      hitPolicy: \"first\",\n      outputs: [{ key: \"approvalLevel\", label: \"Approval Level\", type: \"string\", defaultValue: \"self\" }],\n      rules: [\n        { inputs: { amount: \"> 100000\" }, outputs: { approvalLevel: \"CFO\" } },\n      ],\n    });\n    const result = evaluateDecisionTable(table, { amount: 500 });\n    expect(result.matched).toBe(false);\n    expect(result.outputs.approvalLevel).toBe(\"self\");\n    expect(result.matchedRules).toEqual([]);\n  });\n\n  it(\"returns empty outputs when no rules match and no defaults\", () => {\n    const table = buildTable({\n      hitPolicy: \"first\",\n      rules: [\n        { inputs: { amount: \"> 100000\" }, outputs: { approvalLevel: \"CFO\" } },\n      ],\n    });\n    const result = evaluateDecisionTable(table, { amount: 500 });\n    expect(result.matched).toBe(false);\n    expect(result.outputs).toEqual({});\n    expect(result.matchedRules).toEqual([]);\n  });\n\n  it(\"handles empty condition (skip that input check)\", () => {\n    const table = buildTable({\n      hitPolicy: \"first\",\n      rules: [\n        { inputs: { amount: \"\", category: \"== goods\" }, outputs: { approvalLevel: \"Clerk\" } },\n      ],\n    });\n    const result = evaluateDecisionTable(table, { amount: 100, category: \"goods\" });\n    expect(result.matched).toBe(true);\n    expect(result.outputs.approvalLevel).toBe(\"Clerk\");\n  });\n\n  it(\"handles rule with multiple input conditions (all must match)\", () => {\n    const table = buildTable({\n      hitPolicy: \"first\",\n      rules: [\n        { inputs: { amount: \"> 50000\", category: \"== services\" }, outputs: { approvalLevel: \"VP\" } },\n        { inputs: { amount: \"> 50000\", category: \"== goods\" }, outputs: { approvalLevel: \"Director\" } },\n      ],\n    });\n    const result = evaluateDecisionTable(table, { amount: 60000, category: \"goods\" });\n    expect(result.matched).toBe(true);\n    expect(result.outputs.approvalLevel).toBe(\"Director\");\n    expect(result.matchedRules).toEqual([1]);\n  });\n});\n\n// ---------------------------------------------------------------------------\n// COLLECT hit policy\n// ---------------------------------------------------------------------------\ndescribe(\"evaluateDecisionTable — COLLECT hit policy\", () => {\n  it(\"returns all matching rules merged together\", () => {\n    const table = buildTable({\n      hitPolicy: \"collect\",\n      outputs: [\n        { key: \"approvalLevel\", label: \"Approval Level\", type: \"string\" },\n        { key: \"notifyGroup\", label: \"Notify Group\", type: \"string\" },\n      ],\n      rules: [\n        { inputs: { amount: \"> 50000\" }, outputs: { approvalLevel: \"Director\" } },\n        { inputs: { amount: \"> 10000\" }, outputs: { notifyGroup: \"finance-team\" } },\n        { inputs: { category: \"== services\" }, outputs: { notifyGroup: \"procurement\" } },\n      ],\n    });\n    const result = evaluateDecisionTable(table, { amount: 75000, category: \"services\" });\n    expect(result.matched).toBe(true);\n    expect(result.matchedRules).toEqual([0, 1, 2]);\n    // Last writer wins for overlapping keys (rule 2 overwrites rule 1's notifyGroup)\n    expect(result.outputs.approvalLevel).toBe(\"Director\");\n    expect(result.outputs.notifyGroup).toBe(\"procurement\");\n  });\n\n  it(\"returns defaults when no rules match\", () => {\n    const table = buildTable({\n      hitPolicy: \"collect\",\n      outputs: [{ key: \"approvalLevel\", label: \"Approval Level\", type: \"string\", defaultValue: \"auto\" }],\n      rules: [\n        { inputs: { amount: \"> 1000000\" }, outputs: { approvalLevel: \"CEO\" } },\n      ],\n    });\n    const result = evaluateDecisionTable(table, { amount: 100 });\n    expect(result.matched).toBe(false);\n    expect(result.outputs.approvalLevel).toBe(\"auto\");\n    expect(result.matchedRules).toEqual([]);\n  });\n\n  it(\"handles a single matching rule\", () => {\n    const table = buildTable({\n      hitPolicy: \"collect\",\n      rules: [\n        { inputs: { amount: \"> 1000\" }, outputs: { approvalLevel: \"Manager\" } },\n        { inputs: { amount: \"> 100000\" }, outputs: { approvalLevel: \"CFO\" } },\n      ],\n    });\n    const result = evaluateDecisionTable(table, { amount: 5000 });\n    expect(result.matched).toBe(true);\n    expect(result.matchedRules).toEqual([0]);\n    expect(result.outputs.approvalLevel).toBe(\"Manager\");\n  });\n});\n\n// ---------------------------------------------------------------------------\n// UNIQUE hit policy\n// ---------------------------------------------------------------------------\ndescribe(\"evaluateDecisionTable — UNIQUE hit policy\", () => {\n  it(\"returns the single matching rule when exactly one matches\", () => {\n    const table = buildTable({\n      hitPolicy: \"unique\",\n      rules: [\n        { inputs: { amount: \"> 100000\" }, outputs: { approvalLevel: \"CFO\" } },\n        { inputs: { amount: \"<"+"= 100000\" }, outputs: { approvalLevel: \"Manager\" } },\n      ],\n    });\n    const result = evaluateDecisionTable(table, { amount: 50000 });\n    expect(result.matched).toBe(true);\n    expect(result.outputs.approvalLevel).toBe(\"Manager\");\n    expect(result.matchedRules).toEqual([1]);\n  });\n\n  it(\"returns error when multiple rules match\", () => {\n    const table = buildTable({\n      hitPolicy: \"unique\",\n      rules: [\n        { inputs: { amount: \"> 10000\" }, outputs: { approvalLevel: \"Director\" } },\n        { inputs: { amount: \"> 50000\" }, outputs: { approvalLevel: \"CFO\" } },\n      ],\n    });\n    const result = evaluateDecisionTable(table, { amount: 75000 });\n    expect(result.matched).toBe(false);\n    expect(result.outputs).toEqual({});\n    expect(result.matchedRules).toEqual([0, 1]);\n    expect(result.error).toContain(\"2 rules matched\");\n    expect(result.error).toContain(\"expected exactly 1\");\n  });\n\n  it(\"returns error when no rules match\", () => {\n    const table = buildTable({\n      hitPolicy: \"unique\",\n      rules: [\n        { inputs: { amount: \"> 100000\" }, outputs: { approvalLevel: \"CFO\" } },\n      ],\n    });\n    const result = evaluateDecisionTable(table, { amount: 100 });\n    expect(result.matched).toBe(false);\n    expect(result.outputs).toEqual({});\n    expect(result.matchedRules).toEqual([]);\n    expect(result.error).toContain(\"no rules matched\");\n  });\n});\n\n// ---------------------------------------------------------------------------\n// Edge cases & special conditions\n// ---------------------------------------------------------------------------\ndescribe(\"evaluateDecisionTable — edge cases\", () => {\n  it(\"handles an empty rule set (no rules)\", () => {\n    const table = buildTable({ hitPolicy: \"first\", rules: [] });\n    const result = evaluateDecisionTable(table, { amount: 500 });\n    expect(result.matched).toBe(false);\n  });\n\n  it(\"handles rules with in-operator conditions\", () => {\n    const table = buildTable({\n      hitPolicy: \"first\",\n      rules: [\n        { inputs: { category: \"in ['goods', 'services']\" }, outputs: { approvalLevel: \"Standard\" } },\n        { inputs: { category: \"in ['capital']\" }, outputs: { approvalLevel: \"CFO\" } },\n      ],\n    });\n    expect(evaluateDecisionTable(table, { category: \"goods\" }).outputs.approvalLevel).toBe(\"Standard\");\n    expect(evaluateDecisionTable(table, { category: \"capital\" }).outputs.approvalLevel).toBe(\"CFO\");\n    expect(evaluateDecisionTable(table, { category: \"unknown\" }).matched).toBe(false);\n  });\n\n  it(\"handles equality conditions with strings\", () => {\n    const table = buildTable({\n      hitPolicy: \"first\",\n      rules: [\n        { inputs: { category: \"== 'high'\" }, outputs: { approvalLevel: \"Director\" } },\n      ],\n    });\n    const result = evaluateDecisionTable(table, { category: \"high\" });\n    expect(result.matched).toBe(true);\n    expect(result.outputs.approvalLevel).toBe(\"Director\");\n  });\n\n  it(\"handles boolean output values\", () => {\n    const table: DecisionTableDef = {\n      hitPolicy: \"first\",\n      inputs: [{ key: \"amount\", label: \"Amount\", type: \"number\" }],\n      outputs: [{ key: \"needsAudit\", label: \"Needs Audit\", type: \"boolean\" }],\n      rules: [\n        { inputs: { amount: \"> 500000\" }, outputs: { needsAudit: true } },\n        { inputs: { amount: \"<"+"= 500000\" }, outputs: { needsAudit: false } },\n      ],\n    };\n    expect(evaluateDecisionTable(table, { amount: 1000000 }).outputs.needsAudit).toBe(true);\n    expect(evaluateDecisionTable(table, { amount: 1000 }).outputs.needsAudit).toBe(false);\n  });\n\n  it(\"handles context with nested paths\", () => {\n    const table: DecisionTableDef = {\n      hitPolicy: \"first\",\n      inputs: [{ key: \"request.priority\", label: \"Priority\", type: \"string\" }],\n      outputs: [{ key: \"approvalLevel\", label: \"Approval Level\", type: \"string\" }],\n      rules: [\n        { inputs: { \"request.priority\": \"== urgent\" }, outputs: { approvalLevel: \"immediate\" } },\n      ],\n    };\n    const result = evaluateDecisionTable(table, { request: { priority: \"urgent\" } });\n    expect(result.matched).toBe(true);\n    expect(result.outputs.approvalLevel).toBe(\"immediate\");\n  });\n\n  it(\"handles multiple outputs per rule\", () => {\n    const table = buildTable({\n      hitPolicy: \"first\",\n      outputs: [\n        { key: \"approvalLevel\", label: \"Approval Level\", type: \"string\" },\n        { key: \"slaHours\", label: \"SLA Hours\", type: \"number\" },\n      ],\n      rules: [\n        { inputs: { amount: \"> 100000\" }, outputs: { approvalLevel: \"CFO\", slaHours: 48 } },\n      ],\n    });\n    const result = evaluateDecisionTable(table, { amount: 200000 });\n    expect(result.matched).toBe(true);\n    expect(result.outputs.approvalLevel).toBe(\"CFO\");\n    expect(result.outputs.slaHours).toBe(48);\n  });\n\n  it(\"handles less-than (<"+") condition\", () => {\n    const table = buildTable({\n      hitPolicy: \"first\",\n      rules: [\n        { inputs: { amount: \"<"+" 1000\" }, outputs: { approvalLevel: \"auto\" } },\n        { inputs: { amount: \">= 1000\" }, outputs: { approvalLevel: \"Manager\" } },\n      ],\n    });\n    expect(evaluateDecisionTable(table, { amount: 500 }).outputs.approvalLevel).toBe(\"auto\");\n    expect(evaluateDecisionTable(table, { amount: 5000 }).outputs.approvalLevel).toBe(\"Manager\");\n  });\n\n  it(\"handles not-equal (!=) condition\", () => {\n    const table = buildTable({\n      hitPolicy: \"first\",\n      rules: [\n        { inputs: { category: \"!= 'goods'\" }, outputs: { approvalLevel: \"Special\" } },\n      ],\n    });\n    expect(evaluateDecisionTable(table, { category: \"services\" }).matched).toBe(true);\n    expect(evaluateDecisionTable(table, { category: \"goods\" }).matched).toBe(false);\n  });\n\n  it(\"rule with all blank conditions always matches\", () => {\n    const table = buildTable({\n      hitPolicy: \"first\",\n      rules: [\n        { inputs: { amount: \"  \", category: \"\" }, outputs: { approvalLevel: \"fallback\" } },\n      ],\n    });\n    const result = evaluateDecisionTable(table, { amount: 1, category: \"anything\" });\n    expect(result.matched).toBe(true);\n    expect(result.outputs.approvalLevel).toBe(\"fallback\");\n  });\n\n  it(\"empty rules array returns no match for COLLECT policy\", () => {\n    const table = buildTable({\n      hitPolicy: \"collect\",\n      outputs: [{ key: \"approvalLevel\", label: \"Approval Level\", type: \"string\", defaultValue: \"none\" }],\n      rules: [],\n    });\n    const result = evaluateDecisionTable(table, { amount: 500 });\n    expect(result.matched).toBe(false);\n    expect(result.outputs.approvalLevel).toBe(\"none\");\n  });\n\n  it(\"empty rules array returns error for UNIQUE policy\", () => {\n    const table = buildTable({ hitPolicy: \"unique\", rules: [] });\n    const result = evaluateDecisionTable(table, { amount: 500 });\n    expect(result.matched).toBe(false);\n    expect(result.error).toContain(\"no rules matched\");\n  });\n});\n"},"tests/quality-program/L10-domain-correctness/payments-domain-mutants.test.ts":{"tests":[{"id":"143","name":"L10 payments — maker/checker segregation of duties rejects self-approval when maker and checker are the same actor"},{"id":"144","name":"L10 payments — maker/checker segregation of duties permits approval by a different actor"},{"id":"145","name":"L10 payments — maker/checker segregation of duties is case- and value-sensitive, not merely a length check"},{"id":"146","name":"L10 payments — maker/checker segregation of duties error carries the MAKER_CHECKER_VIOLATION code and a money-path message"},{"id":"147","name":"L10 payments — maker/checker segregation of duties does NOT fire when both ids are empty (guard requires both to be truthy)"},{"id":"148","name":"L10 payments — maker/checker segregation of duties does NOT fire when only one id is present"},{"id":"149","name":"L10 payments — three-way match requires both references accepts when both refs are present"},{"id":"150","name":"L10 payments — three-way match requires both references rejects when po null"},{"id":"151","name":"L10 payments — three-way match requires both references rejects when grn null"},{"id":"152","name":"L10 payments — three-way match requires both references rejects when po undefined"},{"id":"153","name":"L10 payments — three-way match requires both references rejects when grn undefined"},{"id":"154","name":"L10 payments — three-way match requires both references rejects when po empty string"},{"id":"155","name":"L10 payments — three-way match requires both references rejects when grn empty string"},{"id":"156","name":"L10 payments — three-way match requires both references rejects when both missing"},{"id":"157","name":"L10 payments — all three legs must be positive accepts three equal positive legs"},{"id":"158","name":"L10 payments — all three legs must be positive rejects when po is zero"},{"id":"159","name":"L10 payments — all three legs must be positive rejects when grn is zero"},{"id":"160","name":"L10 payments — all three legs must be positive rejects when invoi
