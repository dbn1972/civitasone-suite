ce is zero"},{"id":"161","name":"L10 payments — all three legs must be positive rejects when po is negative"},{"id":"162","name":"L10 payments — all three legs must be positive rejects when grn is negative"},{"id":"163","name":"L10 payments — all three legs must be positive rejects when invoice is negative"},{"id":"164","name":"L10 payments — all three legs must be positive one paise on every leg is enough to reconcile"},{"id":"165","name":"L10 payments — tolerance boundary is exclusive (exactly-at-limit is allowed) default tolerance is 2 percent"},{"id":"166","name":"L10 payments — tolerance boundary is exclusive (exactly-at-limit is allowed) GRN exactly 2% over PO is ALLOWED (boundary exclusive)"},{"id":"167","name":"L10 payments — tolerance boundary is exclusive (exactly-at-limit is allowed) GRN just above 2% over PO is REJECTED"},{"id":"168","name":"L10 payments — tolerance boundary is exclusive (exactly-at-limit is allowed) invoice exactly 2% over GRN is ALLOWED"},{"id":"169","name":"L10 payments — tolerance boundary is exclusive (exactly-at-limit is allowed) invoice just above 2% over GRN is REJECTED"},{"id":"170","name":"L10 payments — tolerance boundary is exclusive (exactly-at-limit is allowed) invoice over PO is rejected even when it is within tolerance of GRN"},{"id":"171","name":"L10 payments — tolerance boundary is exclusive (exactly-at-limit is allowed) a custom tolerance is honoured"},{"id":"172","name":"L10 payments — tolerance boundary is exclusive (exactly-at-limit is allowed) zero tolerance rejects any overage but still allows an exact match"},{"id":"173","name":"L10 payments — under-billing is permitted invoice far below GRN and PO reconciles"},{"id":"174","name":"L10 payments — under-billing is permitted GRN far below PO reconciles (partial delivery)"},{"id":"175","name":"L10 payments — payment mode allowlist accepts NEFT"},{"id":"176","name":"L10 payments — payment mode allowlist accepts RTGS"},{"id":"177","name":"L10 payments — payment mode allowlist accepts IMPS"},{"id":"178","name":"L10 payments — payment mode allowlist accepts DBT"},{"id":"179","name":"L10 payments — payment mode allowlist accepts PFMS"},{"id":"180","name":"L10 payments — payment mode allowlist accepts cheque"},{"id":"181","name":"L10 payments — payment mode allowlist rejects \"neft\""},{"id":"182","name":"L10 payments — payment mode allowlist rejects \"CHEQUE\""},{"id":"183","name":"L10 payments — payment mode allowlist rejects \"UPI\""},{"id":"184","name":"L10 payments — payment mode allowlist rejects \"cash\""},{"id":"185","name":"L10 payments — payment mode allowlist rejects \"\""},{"id":"186","name":"L10 payments — payment mode allowlist rejects \"NEFT \""},{"id":"187","name":"L10 payments — payment mode allowlist rejects \"wire\""},{"id":"188","name":"L10 payments — payment mode allowlist the rejection message lists the permitted modes"},{"id":"189","name":"L10 payments — payment requires bill.status = passed accepts 'passed'"},{"id":"190","name":"L10 payments — payment requires bill.status = passed rejects \"draft\""},{"id":"191","name":"L10 payments — payment requires bill.status = passed rejects \"submitted\""},{"id":"192","name":"L10 payments — payment requires bill.status = passed rejects \"approved\""},{"id":"193","name":"L10 payments — payment requires bill.status = passed rejects \"rejected\""},{"id":"194","name":"L10 payments — payment requires bill.status = passed rejects \"paid\""},{"id":"195","name":"L10 payments — payment requires bill.status = passed rejects \"\""},{"id":"196","name":"L10 payments — payment requires bill.status = passed rejects \"PASSED\""},{"id":"197","name":"L10 payments — payment requires bill.status = passed rejects \"passed \""},{"id":"198","name":"L10 payments — payment requires bill.status = passed the error reports the offending status"},{"id":"199","name":"L10 payments — bill stage progression section advances to accounts"},{"id":"200","name":"L10 payments — bill stage progression accounts advances to pay"},{"id":"201","name":"L10 payments — bill stage progression pay is terminal"},{"id":"202","name":"L10 payments — bill stage progression rejects unknown stage \"\""},{"id":"203","name":"L10 payments — bill stage progression rejects unknown stage \"unknown\""},{"id":"204","name":"L10 payments — bill stage progression rejects unknown stage \"Section\""},{"id":"205","name":"L10 payments — bill stage progression rejects unknown stage \"PAY\""},{"id":"206","name":"L10 payments — bill stage progression progression cannot skip a stage"}],"source":"/**\n * L10 — Domain Correctness: payments / three-way match (mutation burn-down)\n *\n * WHY THIS FILE EXISTS\n * --------------------\n * `payments/domain.ts` sat at 57.7% with 47 surviving/uncovered mutants. The most\n * serious was not a rounding gap:\n *\n *   L15  assertDistinctMakerChecker() — the SEGREGATION-OF-DUTIES guard on the\n *        money path — was entirely NoCoverage. Every mutant survived, including\n *        `creatorId !== approverId`, which INVERTS the check: self-approval of a\n *        disbursement would have been permitted and no test would have failed.\n *\n * Also targeted:\n *   L44-45  overagePct() cap/value boundaries.\n *   L68     three-way positivity guard (an unpriced PO/GRN must not match).\n *   L80/86  tolerance comparisons — `>` vs `>=` decides whether an invoice\n *           EXACTLY at the tolerance limit is passed for payment.\n *   L98+    payment-mode allowlist, bill-status gate, stage machine.\n *\n * Boundary values are computed from the documented rule:\n *   overagePct(value, cap) = (value - cap) / cap * 100, and 0 when value <"+"= cap.\n *   So po=100000, grn=102000 -> exactly 2.00% overage, i.e. exactly at the\n *   default tolerance. `>` admits it; `>=` would reject it. That distinction is\n *   money leaving the building, so it is asserted explicitly.\n */\nimport { describe, it, expect, beforeAll } from \"vitest\";\nimport { resolve } from \"node:path\";\n\nconst REPO_ROOT = resolve(__dirname, \"../../..\");\n\ntype Legs = { poAmountMinor: bigint; grnAmountMinor: bigint; invoiceMinor: bigint };\n\nlet assertDistinctMakerChecker: (creatorId: string, approverId: string) => void;\nlet assertThreeWayMatchPresent: (poRef: unknown, grnRef: unknown) => void;\nlet assertThreeWayMatch: (poRef: unknown, grnRef: unknown, legs: Legs, tol?: number) => void;\nlet assertValidPaymentMode: (mode: string) => void;\nlet assertBillPassed: (status: string) => void;\nlet nextStage: (current: string) => string;\nlet DEFAULT_TOL: number;\n\nbeforeAll(async () => {\n  const d = await import(`${REPO_ROOT}/services/finance-service/src/modules/payments/domain.js`);\n  assertDistinctMakerChecker = d.assertDistinctMakerChecker;\n  assertThreeWayMatchPresent = d.assertThreeWayMatchPresent;\n  assertThreeWayMatch = d.assertThreeWayMatch;\n  assertValidPaymentMode = d.assertValidPaymentMode;\n  assertBillPassed = d.assertBillPassed;\n  nextStage = d.nextStage;\n  DEFAULT_TOL = d.DEFAULT_THREE_WAY_TOLERANCE_PCT;\n});\n\nconst MAKER = \"11111111-1111-4000-8000-000000000001\";\nconst CHECKER = \"22222222-2222-4000-8000-000000000002\";\n\n// ── Segregation of duties (L15) — was entirely NoCoverage ────────────────────\n\ndescribe(\"L10 payments — maker/checker segregation of duties\", () => {\n  it(\"rejects self-approval when maker and checker are the same actor\", () => {\n    // Kills the `creatorId !== approverId` inversion: without this, self-approval\n    // of a disbursement is permitted.\n    expect(() => assertDistinctMakerChecker(MAKER, MAKER)).toThrow(/MAKER_CHECKER_VIOLATION/);\n  });\n\n  it(\"permits approval by a different actor\", () => {\n    // Kills the `ConditionalExpression -> true` mutant (always throw).\n    expect(() => assertDistinctMakerChecker(MAKER, CHECKER)).not.toThrow();\n  });\n\n  it(\"is case- and value-sensitive, not merely a length check\", () => {\n    expect(() => assertDistinctMakerChecker(\"abc\", \"abd\")).not.toThrow();\n    expect(() => assertDistinctMakerChecker(\"abc\", \"abc\")).toThrow(/MAKER_CHECKER_VIOLATION/);\n  });\n\n  it(\"error carries the MAKER_CHECKER_VIOLATION code and a money-path message\", () => {\n    try {\n      assertDistinctMakerChecker(MAKER, MAKER);\n      expect.fail(\"expected a throw\");\n    } catch (e) {\n      const err = e as Error & { code?: string };\n      expect(err.code).toBe(\"MAKER_CHECKER_VIOLATION\");\n      expect(err.message).toMatch(/self-approval/i);\n    }\n  });\n\n  /**\n   * DOCUMENTED WEAKNESS, asserted so it cannot change silently.\n   *\n   * The guard is `creatorId && approverId && creatorId === approverId`, so it\n   * only fires when BOTH ids are truthy. Two empty strings — which are equal —\n   * do NOT trip it. That is deliberate (an unknown actor is not evidence of\n   * self-approval) but it means an empty-string actor id bypasses SoD entirely.\n   * Callers must validate that both ids are present; this function does not.\n   */\n  it(\"does NOT fire when both ids are empty (guard requires both to be truthy)\", () => {\n    expect(() => assertDistinctMakerChecker(\"\", \"\")).not.toThrow();\n  });\n\n  it(\"does NOT fire when only one id is present\", () => {\n    expect(() => assertDistinctMakerChecker(\"\", CHECKER)).not.toThrow();\n    expect(() => assertDistinctMakerChecker(MAKER, \"\")).not.toThrow();\n  });\n});\n\n// ── Reference presence (L28) ─────────────────────────────────────────────────\n\ndescribe(\"L10 payments — three-way match requires both references\", () => {\n  it(\"accepts when both refs are present\", () => {\n    expect(() => assertThreeWayMatchPresent(\"PO-1\", \"GRN-1\")).not.toThrow();\n  });\n\n  const missing: Array<"+"[string, unknown, unknown]> = [\n    [\"po null\", null, \"GRN-1\"],\n    [\"grn null\", \"PO-1\", null],\n    [\"po undefined\", undefined, \"GRN-1\"],\n    [\"grn undefined\", \"PO-1\", undefined],\n    [\"po empty string\", \"\", \"GRN-1\"],\n    [\"grn empty string\", \"PO-1\", \"\"],\n    [\"both missing\", null, null],\n  ];\n\n  for (const [label, po, grn] of missing) {\n    it(`rejects when ${label}`, () => {\n      expect(() => assertThreeWayMatchPresent(po, grn)).toThrow(/THREE_WAY_MATCH_FAILED/);\n    });\n  }\n});\n\n// ── Positivity guard (L68) ───────────────────────────────────────────────────\n\ndescribe(\"L10 payments — all three legs must be positive\", () => {\n  const ok: Legs = { poAmountMinor: 100_000n, grnAmountMinor: 100_000n, invoiceMinor: 100_000n };\n\n  it(\"accepts three equal positive legs\", () => {\n    expect(() => assertThreeWayMatch(\"PO-1\", \"GRN-1\", ok)).not.toThrow();\n  });\n\n  const zeroCases: Array<"+"[string, Legs]> = [\n    [\"po is zero\", { ...ok, poAmountMinor: 0n }],\n    [\"grn is zero\", { ...ok, grnAmountMinor: 0n }],\n    [\"invoice is zero\", { ...ok, invoiceMinor: 0n }],\n    [\"po is negative\", { ...ok, poAmountMinor: -1n }],\n    [\"grn is negative\", { ...ok, grnAmountMinor: -1n }],\n    [\"invoice is negative\", { ...ok, invoiceMinor: -1n }],\n  ];\n\n  for (const [label, legs] of zeroCases) {\n    it(`rejects when ${label}`, () => {\n      // An unpriced PO or GRN must never reconcile — kills the individual\n      // `<"+"= 0n` -> `<"+" 0n` mutants and the `||` -> `&&` collapse.\n      expect(() => assertThreeWayMatch(\"PO-1\", \"GRN-1\", legs)).toThrow(/THREE_WAY_MATCH_FAILED/);\n    });\n  }\n\n  it(\"one paise on every leg is enough to reconcile\", () => {\n    expect(() =>\n      assertThreeWayMatch(\"PO-1\", \"GRN-1\", { poAmountMinor: 1n, grnAmountMinor: 1n, invoiceMinor: 1n }),\n    ).not.toThrow();\n  });\n});\n\n// ── Tolerance boundary: `>` vs `>=` decides whether money leaves ─────────────\n\ndescribe(\"L10 payments — tolerance boundary is exclusive (exactly-at-limit is allowed)\", () => {\n  it(\"default tolerance is 2 percent\", () => {\n    expect(DEFAULT_TOL).toBe(2);\n  });\n\n  it(\"GRN exactly 2% over PO is ALLOWED (boundary exclusive)\", () => {\n    // (102000 - 100000) / 100000 = 2.00% exactly.\n    expect(() =>\n      assertThreeWayMatch(\"PO-1\", \"GRN-1\", {\n        poAmountMinor: 100_000n,\n        grnAmountMinor: 102_000n,\n        invoiceMinor: 100_000n,\n      }),\n    ).not.toThrow();\n  });\n\n  it(\"GRN just above 2% over PO is REJECTED\", () => {\n    // (102001 - 100000) / 100000 = 2.001%\n    expect(() =>\n      assertThreeWayMatch(\"PO-1\", \"GRN-1\", {\n        poAmountMinor: 100_000n,\n        grnAmountMinor: 102_001n,\n        invoiceMinor: 100_000n,\n      }),\n    ).toThrow(/GRN_EXCEEDS_PO/);\n  });\n\n  it(\"invoice exactly 2% over GRN is ALLOWED\", () => {\n    expect(() =>\n      assertThreeWayMatch(\"PO-1\", \"GRN-1\", {\n        poAmountMinor: 200_000n,\n        grnAmountMinor: 100_000n,\n        invoiceMinor: 102_000n,\n      }),\n    ).not.toThrow();\n  });\n\n  it(\"invoice just above 2% over GRN is REJECTED\", () => {\n    expect(() =>\n      assertThreeWayMatch(\"PO-1\", \"GRN-1\", {\n        poAmountMinor: 200_000n,\n        grnAmountMinor: 100_000n,\n        invoiceMinor: 102_001n,\n      }),\n    ).toThrow(/INVOICE_EXCEEDS_GRN/);\n  });\n\n  it(\"invoice over PO is rejected even when it is within tolerance of GRN\", () => {\n    // grn == invoice so the GRN leg passes; the PO leg must still catch it.\n    // po=100000, invoice=110000 -> 10% over PO.\n    expect(() =>\n      assertThreeWayMatch(\"PO-1\", \"GRN-1\", {\n        poAmountMinor: 100_000n,\n        grnAmountMinor: 110_000n,\n        invoiceMinor: 110_000n,\n      }),\n      // GRN-over-PO fires first at 10%, which is itself the correct rejection.\n    ).toThrow(/GRN_EXCEEDS_PO|INVOICE_EXCEEDS_PO/);\n  });\n\n  it(\"a custom tolerance is honoured\", () => {\n    const legs: Legs = { poAmountMinor: 100_000n, grnAmountMinor: 105_000n, invoiceMinor: 100_000n };\n    // 5% overage: rejected at the 2% default, allowed at 5%.\n    expect(() => assertThreeWayMatch(\"PO-1\", \"GRN-1\", legs)).toThrow(/GRN_EXCEEDS_PO/);\n    expect(() => assertThreeWayMatch(\"PO-1\", \"GRN-1\", legs, 5)).not.toThrow();\n  });\n\n  it(\"zero tolerance rejects any overage but still allows an exact match\", () => {\n    expect(() =>\n      assertThreeWayMatch(\"PO-1\", \"GRN-1\",\n        { poAmountMinor: 100_000n, grnAmountMinor: 100_000n, invoiceMinor: 100_000n }, 0),\n    ).not.toThrow();\n    expect(() =>\n      assertThreeWayMatch(\"PO-1\", \"GRN-1\",\n        { poAmountMinor: 100_000n, grnAmountMinor: 100_001n, invoiceMinor: 100_000n }, 0),\n    ).toThrow(/GRN_EXCEEDS_PO/);\n  });\n});\n\n// ── Under-billing is always allowed ──────────────────────────────────────────\n\ndescribe(\"L10 payments — under-billing is permitted\", () => {\n  it(\"invoice far below GRN and PO reconciles\", () => {\n    expect(() =>\n      assertThreeWayMatch(\"PO-1\", \"GRN-1\", {\n        poAmountMinor: 1_000_000n,\n        grnAmountMinor: 900_000n,\n        invoiceMinor: 10_000n,\n      }),\n    ).not.toThrow();\n  });\n\n  it(\"GRN far below PO reconciles (partial delivery)\", () => {\n    expect(() =>\n      assertThreeWayMatch(\"PO-1\", \"GRN-1\", {\n        poAmountMinor: 1_000_000n,\n        grnAmountMinor: 100_000n,\n        invoiceMinor: 100_000n,\n      }),\n    ).not.toThrow();\n  });\n});\n\n// ── Payment mode allowlist (L98) ─────────────────────────────────────────────\n\ndescribe(\"L10 payments — payment mode allowlist\", () => {\n  for (const mode of [\"NEFT\", \"RTGS\", \"IMPS\", \"DBT\", \"PFMS\", \"cheque\"]) {\n    it(`accepts ${mode}`, () => {\n      expect(() => assertValidPaymentMode(mode)).not.toThrow();\n    });\n  }\n\n  for (const mode of [\"neft\", \"CHEQUE\", \"UPI\", \"cash\", \"\", \"NEFT \", \"wire\"]) {\n    it(`rejects ${JSON.stringify(mode)}`, () => {\n      // Case-sensitive by design: \"neft\" and \"CHEQUE\" must NOT pass.\n      expect(() => assertValidPaymentMode(mode)).toThrow(/INVALID_PAYMENT_MODE/);\n    });\n  }\n\n  it(\"the rejection message lists the permitted modes\", () => {\n    try {\n      assertValidPaymentMode(\"UPI\");\n      expect.fail(\"expected a throw\");\n    } catch (e) {\n      expect((e as Error).message).toMatch(/NEFT/);\n      expect((e as Error).message).toMatch(/cheque/);\n    }\n  });\n});\n\n// ── Bill status gate (L105) ──────────────────────────────────────────────────\n\ndescribe(\"L10 payments — payment requires bill.status = passed\", () => {\n  it(\"accepts 'passed'\", () => {\n    expect(() => assertBillPassed(\"passed\")).not.toThrow();\n  });\n\n  for (const status of [\"draft\", \"submitted\", \"approved\", \"rejected\", \"paid\", \"\", \"PASSED\", \"passed \"]) {\n    it(`rejects ${JSON.stringify(status)}`, () => {\n      // 'approved' and 'paid' matter most: neither may authorise a second payout.\n      expect(() => assertBillPassed(status)).toThrow(/BILL_NOT_PASSED/);\n    });\n  }\n\n  it(\"the error reports the offending status\", () => {\n    try {\n      assertBillPassed(\"draft\");\n      expect.fail(\"expected a throw\");\n    } catch (e) {\n      expect((e as Error).message).toMatch(/draft/);\n    }\n  });\n});\n\n// ── Stage machine (L116) ─────────────────────────────────────────────────────\n\ndescribe(\"L10 payments — bill stage progression\", () => {\n  it(\"section advances to accounts\", () => {\n    expect(nextStage(\"section\")).toBe(\"accounts\");\n  });\n\n  it(\"accounts advances to pay\", () => {\n    expect(nextStage(\"accounts\")).toBe(\"pay\");\n  });\n\n  it(\"pay is terminal\", () => {\n    expect(() => nextStage(\"pay\")).toThrow(/STAGE_TERMINAL/);\n  });\n\n  for (const bogus of [\"\", \"unknown\", \"Section\", \"PAY\"]) {\n    it(`rejects unknown stage ${JSON.stringify(bogus)}`, () => {\n      expect(() => nextStage(bogus)).toThrow(/STAGE_TERMINAL/);\n    });\n  }\n\n  it(\"progression cannot skip a stage\", () => {\n    // Guards against a table edit that wires section straight to pay.\n    expect(nextStage(\"section\")).not.toBe(\"pay\");\n  });\n});\n"},"services/finance-service/tests/auto-journal.test.ts":{"tests":[{"id":"207","name":"auto-journal — rupeesToPaise() converts whole rupees"},{"id":"208","name":"auto-journal — rupeesToPaise() converts decimal rupees"},{"id":"209","name":"auto-journal — rupeesToPaise() handles zero"},{"id":"210","name":"auto-journal — rupeesToPaise() handles large amounts"},{"id":"211","name":"auto-journal — paiseToRupees() converts paise to rupees"},{"id":"212","name":"auto-journal — generateSalesInvoiceJournal() generates balanced 3-line journal with GST"},{"id":"213","name":"auto-journal — generateSalesInvoiceJournal() generates 2-line journal without GST"},{"id":"214","name":"auto-journal — generateSalesInvoiceJournal() uses custom income code"},{"id":"215","name":"auto-journal — generatePaymentReceivedJournal() generates balanced 2-line journal"},{"id":"216","name":"auto-journal — generatePurchaseJournal() generates balanced journal with GST input credit"},{"id":"217","name":"auto-journal — generatePurchaseJournal() generates 2-line journal without GST"},{"id":"218","name":"auto-journal — generatePaymentMadeJournal() generates balanced 2-line journal"},{"id":"219","name":"auto-journal — generateExpenseJournal() generates balanced journal for expense with GST"},{"id":"220","name":"auto-journal — generateExpenseJournal() generates 2-line journal for expense without GST"},{"id":"221","name":"auto-journal — generateExpenseJournal() uses correct expense account code for known category"},{"id":"222","name":"auto-journal — generateSalaryJournal() generates balanced 2-line salary journal"},{"id":"223","name":"auto-journal — resolveExpenseCode() returns 5009 for unknown category"},{"id":"224","name":"gl/domain — assertJournalBalances() passes for balanced journal"},{"id":"225","name":"gl/domain — assertJournalBalances() throws JOURNAL_UNBALANCED for unbalanced lines"},{"id":"226","name":"gl/domain — assertJournalBalances() throws JOURNAL_TOO_FEW_LINES for <"+" 2 lines"},{"id":"227","name":"budget/allocation-domain — appropriationAvailable() returns allocated - (committed + actual)"},{"id":"228","name":"budget/allocation-domain — assertWithinAppropriation() passes when within limit"},{"id":"229","name":"budget/allocation-domain — assertWithinAppropriation() throws OVER_APPROPRIATION when exceeds"},{"id":"230","name":"budget/allocation-domain — assertWithinAppropriation() no-op when enforce is false"},{"id":"231","name":"budget/allocation-domain — assertReappropriable() passes when sufficient balance"},{"id":"232","name":"budget/allocation-domain — assertReappropriable() throws when exceeds balance"},{"id":"233","name":"budget/allocation-domain — assertReappropriable() throws for zero amount"}],"source":"/**\n * Coverage tests for simplified/auto-journal.ts + budget/allocation-domain.ts + gl/domain.ts.\n * Pure functions — no DB or I/O.\n */\nimport { describe, it, expect } from \"vitest\";\nimport {\n  rupeesToPaise,\n  paiseToRupees,\n  generateSalesInvoiceJournal,\n  generatePaymentReceivedJournal,\n  generatePurchaseJournal,\n  generatePaymentMadeJournal,\n  generateExpenseJournal,\n  generateSalaryJournal,\n  resolveExpenseCode,\n} from \"../src/modules/simplified/auto-journal.js\";\nimport { DomainError as GlDomainError, assertJournalBalances } from \"../src/modules/gl/domain.js\";\nimport { DomainError as BudgetDomainError } from \"../src/modules/budget/domain.js\";\nimport {\n  appropriationAvailable,\n  assertWithinAppropriation,\n  assertReappropriable,\n} from \"../src/modules/budget/allocation-domain.js\";\n\n// ═════════════════════════════════════════════════════════\n// CURRENCY CONVERSION\n// ═════════════════════════════════════════════════════════\n\ndescribe(\"auto-journal — rupeesToPaise()\", () => {\n  it(\"converts whole rupees\", () => {\n    expect(rupeesToPaise(100)).toBe(10000n);\n  });\n\n  it(\"converts decimal rupees\", () => {\n    expect(rupeesToPaise(99.99)).toBe(9999n);\n    expect(rupeesToPaise(0.01)).toBe(1n);\n  });\n\n  it(\"handles zero\", () => {\n    expect(rupeesToPaise(0)).toBe(0n);\n  });\n\n  it(\"handles large amounts\", () => {\n    expect(rupeesToPaise(1000000)).toBe(100000000n); // ₹10,00,000 = 10 crore paise\n  });\n});\n\ndescribe(\"auto-journal — paiseToRupees()\", () => {\n  it(\"converts paise to rupees\", () => {\n    expect(paiseToRupees(10000n)).toBe(100);\n    expect(paiseToRupees(9999n)).toBe(99.99);\n    expect(paiseToRupees(1n)).toBe(0.01);\n    expect(paiseToRupees(0n)).toBe(0);\n  });\n});\n\n// ═════════════════════════════════════════════════════════\n// SALES INVOICE JOURNAL\n// ═════════════════════════════════════════════════════════\n\ndescribe(\"auto-journal — generateSalesInvoiceJournal()\", () => {\n  it(\"generates balanced 3-line journal with GST\", () => {\n    const r = generateSalesInvoiceJournal({\n      amountMinor: 100000n,    // ₹1000\n      gstMinor: 18000n,        // 18% GST\n      totalMinor: 118000n,     // ₹1180\n      customerName: \"ACME\",\n      invoiceNo: \"INV-001\",\n    });\n    expect(r.lines.length).toBe(3);\n    expect(r.type).toBe(\"receipt\");\n    // Dr Receivable = total\n    expect(r.lines[0]!.debitMinor).toBe(118000n);\n    // Cr Sales = amount\n    expect(r.lines[1]!.creditMinor).toBe(100000n);\n    // Cr GST = gst\n    expect(r.lines[2]!.creditMinor).toBe(18000n);\n  });\n\n  it(\"generates 2-line journal without GST\", () => {\n    const r = generateSalesInvoiceJournal({\n      amountMinor: 50000n,\n      gstMinor: 0n,\n      totalMinor: 50000n,\n    });\n    expect(r.lines.length).toBe(2);\n    expect(r.lines[0]!.debitMinor).toBe(50000n);\n    expect(r.lines[1]!.creditMinor).toBe(50000n);\n  });\n\n  it(\"uses custom income code\", () => {\n    const r = generateSalesInvoiceJournal({\n      amountMinor: 10000n, gstMinor: 0n, totalMinor: 10000n,\n      incomeCode: \"4005\",\n    });\n    expect(r.lines[1]!.accountCode).toBe(\"4005\");\n  });\n});\n\n// ═════════════════════════════════════════════════════════\n// PAYMENT RECEIVED\n// ═════════════════════════════════════════════════════════\n\ndescribe(\"auto-journal — generatePaymentReceivedJournal()\", () => {\n  it(\"generates balanced 2-line journal\", () => {\n    const r = generatePaymentReceivedJournal({ amountMinor: 100000n, customerName: \"Client\" });\n    expect(r.lines.length).toBe(2);\n    expect(r.lines[0]!.accountCode).toBe(\"1001\"); // Cash/Bank\n    expect(r.lines[0]!.debitMinor).toBe(100000n);\n    expect(r.lines[1]!.accountCode).toBe(\"1002\"); // Receivable\n    expect(r.lines[1]!.creditMinor).toBe(100000n);\n  });\n});\n\n// ═════════════════════════════════════════════════════════\n// PURCHASE JOURNAL\n// ═════════════════════════════════════════════════════════\n\ndescribe(\"auto-journal — generatePurchaseJournal()\", () => {\n  it(\"generates balanced journal with GST input credit\", () => {\n    const r = generatePurchaseJournal({\n      amountMinor: 200000n, gstMinor: 36000n, totalMinor: 236000n,\n      vendorName: \"Supplier Co\",\n    });\n    expect(r.lines.length).toBe(3);\n    // Dr COGS\n    expect(r.lines[0]!.debitMinor).toBe(200000n);\n    // Dr GST input credit\n    expect(r.lines[1]!.debitMinor).toBe(36000n);\n    // Cr Payable = total\n    expect(r.lines[2]!.creditMinor).toBe(236000n);\n  });\n\n  it(\"generates 2-line journal without GST\", () => {\n    const r = generatePurchaseJournal({\n      amountMinor: 50000n, gstMinor: 0n, totalMinor: 50000n,\n    });\n    expect(r.lines.length).toBe(2);\n  });\n});\n\n// ═════════════════════════════════════════════════════════\n// PAYMENT MADE\n// ═════════════════════════════════════════════════════════\n\ndescribe(\"auto-journal — generatePaymentMadeJournal()\", () => {\n  it(\"generates balanced 2-line journal\", () => {\n    const r = generatePaymentMadeJournal({ amountMinor: 75000n, vendorName: \"Vendor\" });\n    expect(r.lines.length).toBe(2);\n    expect(r.lines[0]!.accountCode).toBe(\"2001\"); // Payable\n    expect(r.lines[0]!.debitMinor).toBe(75000n);\n    expect(r.lines[1]!.accountCode).toBe(\"1001\"); // Cash\n    expect(r.lines[1]!.creditMinor).toBe(75000n);\n  });\n});\n\n// ═════════════════════════════════════════════════════════\n// EXPENSE JOURNAL\n// ═════════════════════════════════════════════════════════\n\ndescribe(\"auto-journal — generateExpenseJournal()\", () => {\n  it(\"generates balanced journal for expense with GST\", () => {\n    const r = generateExpenseJournal({\n      amountMinor: 10000n, gstMinor: 1800n, totalMinor: 11800n,\n      category: \"office_supplies\",\n    });\n    expect(r.lines.length).toBe(3);\n    expect(r.type).toBe(\"payment\");\n  });\n\n  it(\"generates 2-line journal for expense without GST\", () => {\n    const r = generateExpenseJournal({\n      amountMinor: 5000n, gstMinor: 0n, totalMinor: 5000n,\n      category: \"travel\",\n    });\n    expect(r.lines.length).toBe(2);\n  });\n\n  it(\"uses correct expense account code for known category\", () => {\n    const r = generateExpenseJournal({\n      amountMinor: 1000n, gstMinor: 0n, totalMinor: 1000n,\n      category: \"rent\",\n    });\n    // Should use a specific code from EXPENSE_CATEGORY_MAP, or 5009 fallback\n    expect(r.lines[0]!.accountCode).toBeDefined();\n  });\n});\n\n// ═════════════════════════════════════════════════════════\n// SALARY JOURNAL\n// ═════════════════════════════════════════════════════════\n\ndescribe(\"auto-journal — generateSalaryJournal()\", () => {\n  it(\"generates balanced 2-line salary journal\", () => {\n    const r = generateSalaryJournal({ amountMinor: 5000000n }); // ₹50,000\n    expect(r.lines.length).toBe(2);\n    expect(r.lines[0]!.accountCode).toBe(\"5002\");\n    expect(r.lines[0]!.debitMinor).toBe(5000000n);\n    expect(r.lines[1]!.creditMinor).toBe(5000000n);\n    expect(r.type).toBe(\"payment\");\n  });\n});\n\n// ═════════════════════════════════════════════════════════\n// RESOLVE EXPENSE CODE\n// ═════════════════════════════════════════════════════════\n\ndescribe(\"auto-journal — resolveExpenseCode()\", () => {\n  it(\"returns 5009 for unknown category\", () => {\n    expect(resolveExpenseCode(\"interplanetary_travel\")).toBe(\"5009\");\n  });\n});\n\n// ═════════════════════════════════════════════════════════\n// GL DOMAIN — assertJournalBalances\n// ═════════════════════════════════════════════════════════\n\ndescribe(\"gl/domain — assertJournalBalances()\", () => {\n  it(\"passes for balanced journal\", () => {\n    expect(() => assertJournalBalances([\n      { accountCode: \"1001\", debitMinor: 10000n, creditMinor: 0n, narration: \"\" },\n      { accountCode: \"4001\", debitMinor: 0n, creditMinor: 10000n, narration: \"\" },\n    ])).not.toThrow();\n  });\n\n  it(\"throws JOURNAL_UNBALANCED for unbalanced lines\", () => {\n    expect(() => assertJournalBalances([\n      { accountCode: \"1001\", debitMinor: 10000n, creditMinor: 0n, narration: \"\" },\n      { accountCode: \"4001\", debitMinor: 0n, creditMinor: 5000n, narration: \"\" },\n    ])).toThrow(GlDomainError);\n  });\n\n  it(\"throws JOURNAL_TOO_FEW_LINES for <"+" 2 lines\", () => {\n    expect(() => assertJournalBalances([\n      { accountCode: \"1001\", debitMinor: 10000n, creditMinor: 0n, narration: \"\" },\n    ])).toThrow(GlDomainError);\n    expect(() => assertJournalBalances([])).toThrow(GlDomainError);\n  });\n});\n\n// ═════════════════════════════════════════════════════════\n// ALLOCATION DOMAIN\n// ═════════════════════════════════════════════════════════\n\ndescribe(\"budget/allocation-domain — appropriationAvailable()\", () => {\n  it(\"returns allocated - (committed + actual)\", () => {\n    expect(appropriationAvailable({ allocatedMinor: 1000000n, committedMinor: 300000n, actualMinor: 200000n })).toBe(500000n);\n  });\n});\n\ndescribe(\"budget/allocation-domain — assertWithinAppropriation()\", () => {\n  it(\"passes when within limit\", () => {\n    expect(() => assertWithinAppropriation(\n      { allocatedMinor: 1000000n, committedMinor: 200000n, actualMinor: 100000n, enforce: true },\n      500000n,\n    )).not.toThrow();\n  });\n\n  it(\"throws OVER_APPROPRIATION when exceeds\", () => {\n    expect(() => assertWithinAppropriation(\n      { allocatedMinor: 1000000n, committedMinor: 800000n, actualMinor: 100000n, enforce: true },\n      200000n,\n    )).toThrow(BudgetDomainError);\n  });\n\n  it(\"no-op when enforce is false\", () => {\n    expect(() => assertWithinAppropriation(\n      { allocatedMinor: 100n, committedMinor: 90n, actualMinor: 90n, enforce: false },\n      999n,\n    )).not.toThrow();\n  });\n});\n\ndescribe(\"budget/allocation-domain — assertReappropriable()\", () => {\n  it(\"passes when sufficient balance\", () => {\n    expect(() => assertReappropriable(\n      { allocatedMinor: 1000000n, committedMinor: 200000n, actualMinor: 100000n },\n      500000n,\n    )).not.toThrow();\n  });\n\n  it(\"throws when exceeds balance\", () => {\n    expect(() => assertReappropriable(\n      { allocatedMinor: 1000000n, committedMinor: 800000n, actualMinor: 100000n },\n      200000n,\n    )).toThrow(BudgetDomainError);\n  });\n\n  it(\"throws for zero amount\", () => {\n    expect(() => assertReappropriable(\n      { allocatedMinor: 1000000n, committedMinor: 0n, actualMinor: 0n },\n      0n,\n    )).toThrow(BudgetDomainError);\n  });\n});\n"},"services/finance-service/tests/bank-file-generator.test.ts":{"tests":[{"id":"234","name":"toDDMMYYYY converts YYYY-MM-DD to DDMMYYYY"},{"id":"235","name":"toDDMMYYYY throws on invalid format"},{"id":"236","name":"buildHeaderRecord starts with record type '0'"},{"id":"237","name":"buildHeaderRecord encodes originator code at positions 2–17 (right-padded to 16 chars)"},{"id":"238","name":"buildHeaderRecord encodes value date at positions 18–33 (DDMMYYYY, padded to 16)"},{"id":"239","name":"buildHeaderRecord encodes file sequence number at positions 42–49 (8 digits zero-padded)"},{"id":"240","name":"buildHeaderRecord encodes total record count at positions 50–56 (7 digits zero-padded)"},{"id":"241","name":"buildHeaderRecord truncates originator code > 16 chars"},{"id":"242","name":"buildDetailRecord starts with record type '1'"},{"id":"243","name":"buildDetailRecord encodes IFSC at positions 2–12 (11 chars)"},{"id":"244","name":"buildDetailRecord encodes account number at positions 13–30 (18 chars, right-padded)"},{"id":"245","name":"buildDetailRecord encodes amount in paise at positions 31–47 (17 digits, zero-padded)"},{"id":"246","name":"buildDetailRecord encodes account name at positions 48–82 (35 chars)"},{"id":"247","name":"buildDetailRecord encodes narration at positions 83–107 (25 chars)"},{"id":"248","name":"buildDetailRecord encodes payment date at positions 108–115 (DDMMYYYY, 8 chars)"},{"id":"249","name":"buildDetailRecord total record length is exactly 115 chars"},{"id":"250","name":"buildTrailerRecord starts with record type '9'"},{"id":"251","name":"buildTrailerRecord encodes detail count at positions 2–8 (7 digits)"},{"id":"252","name":"buildTrailerRecord encodes total amount in paise at positions 9–25 (17 digits)"},{"id":"253","name":"generateNACHFile returns a string containing CRLF-delimited lines"},{"id":"254","name":"generateNACHFile has exactly 3 lines for a single payment (header + 1 detail + trailer)"},{"id":"255","name":"generateNACHFile first line starts with '0' (header record type)"},{"id":"256","name":"generateNACHFile second line starts with '1' (detail record type)"},{"id":"257","name":"generateNACHFile last line starts with '9' (trailer record type)"},{"id":"258","name":"generateNACHFile trailer encodes the correct total amount (paise)"},{"id":"259","name":"generateNACHFile sums multiple rows correctly in trailer"},{"id":"260","name":"generateNACHFile throws for empty payment array"},{"id":"261","name":"generateNACHFile throws for non-positive amountMinor"},{"id":"262","name":"generateNACHFile uses SFTP_NACH_ORIGINATOR env var as originator code when not passed"},{"id":"263","name":"generateNACHFile header record has correct originator at positions 2–17 (56+ chars)"},{"id":"264","name":"buildRemotePath constructs <"+"baseDir>/<"+"YYYY-MM-DD>/<"+"filename>"},{"id":"265","name":"buildRemotePath strips trailing slash from baseDir"},{"id":"266","name":"readSftpConfig returns null when SFTP_HOST is not set"},{"id":"267","name":"readSftpConfig throws when SFTP_HOST set but companion vars missing"}],"source":"/**\n * Contract tests for the NACH/NEFT fixed-width bank file generator.\n *\n * Asserts exact field positions in header, detail, and trailer records so that\n * any regression in the file format is caught before files reach PFMS/NPCI.\n */\nimport { describe, it, expect, beforeEach } from \"vitest\";\nimport {\n  generateNACHFile,\n  type BankFileRow,\n  buildHeaderRecord,\n  buildDetailRecord,\n  buildTrailerRecord,\n  toDDMMYYYY,\n} from \"../src/modules/integrations/bank-file-generator.js\";\n\n// ── helpers ───────────────────────────────────────────────────────────────────\n\nconst FIXED_DATE = \"2024-07-01\"; // YYYY-MM-DD\n\nfunction makeRow(overrides: Partial<"+"BankFileRow> = {}): BankFileRow {\n  return {\n    ifsc: \"SBIN0001234\",\n    accountNo: \"12345678901234\",\n    accountName: \"Bharat Construction Pvt\",\n    amountMinor: 100050n, // ₹1000.50 in paise\n    narration: \"GRANT/PFMS-001\",\n    paymentDate: FIXED_DATE,\n    ...overrides,\n  };\n}\n\n// ── toDDMMYYYY ───────────────────────────────────────────────────────────────\n\ndescribe(\"toDDMMYYYY\", () => {\n  it(\"converts YYYY-MM-DD to DDMMYYYY\", () => {\n    expect(toDDMMYYYY(\"2024-07-01\")).toBe(\"01072024\");\n    expect(toDDMMYYYY(\"2024-12-31\")).toBe(\"31122024\");\n  });\n\n  it(\"throws on invalid format\", () => {\n    expect(() => toDDMMYYYY(\"20240701\")).toThrow();\n  });\n});\n\n// ── Header record ─────────────────────────────────────────────────────────────\n\ndescribe(\"buildHeaderRecord\", () => {\n  it(\"starts with record type '0'\", () => {\n    const header = buildHeaderRecord({\n      originatorCode: \"AG001\",\n      valueDate: FIXED_DATE,\n      fileSequenceNo: 1,\n      totalRecords: 3,\n    });\n    expect(header[0]).toBe(\"0\");\n  });\n\n  it(\"encodes originator code at positions 2–17 (right-padded to 16 chars)\", () => {\n    const header = buildHeaderRecord({\n      originatorCode: \"AG001\",\n      valueDate: FIXED_DATE,\n      fileSequenceNo: 1,\n      totalRecords: 1,\n    });\n    // Pos 2–17 (0-indexed: 1–16) = originator code, 16 chars\n    const originatorField = header.slice(1, 17);\n    expect(originatorField).toBe(\"AG001           \"); // padded to 16\n    expect(originatorField.length).toBe(16);\n  });\n\n  it(\"encodes value date at positions 18–33 (DDMMYYYY, padded to 16)\", () => {\n    const header = buildHeaderRecord({\n      originatorCode: \"AG001\",\n      valueDate: FIXED_DATE, // 2024-07-01 → 01072024\n      fileSequenceNo: 1,\n      totalRecords: 1,\n    });\n    const valueDateField = header.slice(17, 33);\n    expect(valueDateField.startsWith(\"01072024\")).toBe(true);\n    expect(valueDateField.length).toBe(16);\n  });\n\n  it(\"encodes file sequence number at positions 42–49 (8 digits zero-padded)\", () => {\n    const header = buildHeaderRecord({\n      originatorCode: \"AG001\",\n      valueDate: FIXED_DATE,\n      fileSequenceNo: 42,\n      totalRecords: 5,\n    });\n    const seqField = header.slice(41, 49);\n    expect(seqField).toBe(\"00000042\");\n  });\n\n  it(\"encodes total record count at positions 50–56 (7 digits zero-padded)\", () => {\n    const header = buildHeaderRecord({\n      originatorCode: \"AG001\",\n      valueDate: FIXED_DATE,\n      fileSequenceNo: 1,\n      totalRecords: 99,\n    });\n    const countField = header.slice(49, 56);\n    expect(countField).toBe(\"0000099\");\n  });\n\n  it(\"truncates originator code > 16 chars\", () => {\n    const header = buildHeaderRecord({\n      originatorCode: \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\", // 26 chars\n      valueDate: FIXED_DATE,\n      fileSequenceNo: 1,\n      totalRecords: 1,\n    });\n    expect(header.slice(1, 17).length).toBe(16);\n  });\n});\n\n// ── Detail record ─────────────────────────────────────────────────────────────\n\ndescribe(\"buildDetailRecord\", () => {\n  it(\"starts with record type '1'\", () => {\n    const detail = buildDetailRecord(makeRow());\n    expect(detail[0]).toBe(\"1\");\n  });\n\n  it(\"encodes IFSC at positions 2–12 (11 chars)\", () => {\n    const detail = buildDetailRecord(makeRow({ ifsc: \"HDFC0003210\" }));\n    const ifscField = detail.slice(1, 12);\n    expect(ifscField).toBe(\"HDFC0003210\");\n    expect(ifscField.length).toBe(11);\n  });\n\n  it(\"encodes account number at positions 13–30 (18 chars, right-padded)\", () => {\n    const detail = buildDetailRecord(makeRow({ accountNo: \"123456789\" }));\n    const acctField = detail.slice(12, 30);\n    expect(acctField).toBe(\"123456789         \"); // padded to 18\n    expect(acctField.length).toBe(18);\n  });\n\n  it(\"encodes amount in paise at positions 31–47 (17 digits, zero-padded)\", () => {\n    const detail = buildDetailRecord(makeRow({ amountMinor: 100050n }));\n    const amtField = detail.slice(30, 47);\n    expect(amtField).toBe(\"00000000000100050\");\n    expect(amtField.length).toBe(17);\n  });\n\n  it(\"encodes account name at positions 48–82 (35 chars)\", () => {\n    const detail = buildDetailRecord(makeRow({ accountName: \"Ram Prasad\" }));\n    const nameField = detail.slice(47, 82);\n    expect(nameField).toBe(\"Ram Prasad                         \"); // padded to 35\n    expect(nameField.length).toBe(35);\n  });\n\n  it(\"encodes narration at positions 83–107 (25 chars)\", () => {\n    const detail = buildDetailRecord(makeRow({ narration: \"GRANT/12345\" }));\n    const narField = detail.slice(82, 107);\n    expect(narField).toBe(\"GRANT/12345              \"); // padded to 25\n    expect(narField.length).toBe(25);\n  });\n\n  it(\"encodes payment date at positions 108–115 (DDMMYYYY, 8 chars)\", () => {\n    const detail = buildDetailRecord(makeRow({ paymentDate: \"2024-07-01\" }));\n    const dateField = detail.slice(107, 115);\n    expect(dateField).toBe(\"01072024\");\n    expect(dateField.length).toBe(8);\n  });\n\n  it(\"total record length is exactly 115 chars\", () => {\n    const detail = buildDetailRecord(makeRow());\n    expect(detail.length).toBe(115);\n  });\n});\n\n// ── Trailer record ────────────────────────────────────────────────────────────\n\ndescribe(\"buildTrailerRecord\", () => {\n  it(\"starts with record type '9'\", () => {\n    const trailer = buildTrailerRecord(5, 500000n);\n    expect(trailer[0]).toBe(\"9\");\n  });\n\n  it(\"encodes detail count at positions 2–8 (7 digits)\", () => {\n    const trailer = buildTrailerRecord(7, 0n);\n    expect(trailer.slice(1, 8)).toBe(\"0000007\");\n  });\n\n  it(\"encodes total amount in paise at positions 9–25 (17 digits)\", () => {\n    const trailer = buildTrailerRecord(1, 999999999999999n);\n    expect(trailer.slice(8, 25)).toBe(\"00999999999999999\");\n  });\n});\n\n// ── generateNACHFile ──────────────────────────────────────────────────────────\n\ndescribe(\"generateNACHFile\", () => {\n  const row = makeRow();\n\n  it(\"returns a string containing CRLF-delimited lines\", () => {\n    const file = generateNACHFile([row], { valueDate: FIXED_DATE, originatorCode: \"AG001\" });\n    expect(file).toContain(\"\\r\\n\");\n  });\n\n  it(\"has exactly 3 lines for a single payment (header + 1 detail + trailer)\", () => {\n    const file = generateNACHFile([row], { valueDate: FIXED_DATE });\n    const lines = file.split(\"\\r\\n\");\n    expect(lines.length).toBe(3);\n  });\n\n  it(\"first line starts with '0' (header record type)\", () => {\n    const file = generateNACHFile([row], { valueDate: FIXED_DATE });\n    const [header] = file.split(\"\\r\\n\");\n    expect(header![0]).toBe(\"0\");\n  });\n\n  it(\"second line starts with '1' (detail record type)\", () => {\n    const file = generateNACHFile([row], { valueDate: FIXED_DATE });\n    const lines = file.split(\"\\r\\n\");\n    expect(lines[1]![0]).toBe(\"1\");\n  });\n\n  it(\"last line starts with '9' (trailer record type)\", () => {\n    const file = generateNACHFile([row], { valueDate: FIXED_DATE });\n    const lines = file.split(\"\\r\\n\");\n    expect(lines[lines.length - 1]![0]).toBe(\"9\");\n  });\n\n  it(\"trailer encodes the correct total amount (paise)\", () => {\n    const file = generateNACHFile([row], { valueDate: FIXED_DATE }); // 100050n\n    const lines = file.split(\"\\r\\n\");\n    const trailer = lines[lines.length - 1]!;\n    // Positions 9–25 (0-indexed 8–24): total paise\n    expect(trailer.slice(8, 25)).toBe(\"00000000000100050\");\n  });\n\n  it(\"sums multiple rows correctly in trailer\", () => {\n    const row2 = makeRow({ amountMinor: 200000n });\n    const file = generateNACHFile([row, row2], { valueDate: FIXED_DATE }); // 300050n\n    const lines = file.split(\"\\r\\n\");\n    expect(lines.length).toBe(4); // header + 2 detail + trailer\n    const trailer = lines[lines.length - 1]!;\n    expect(trailer.slice(8, 25)).toBe(\"00000000000300050\");\n    // detail count\n    expect(trailer.slice(1, 8)).toBe(\"0000002\");\n  });\n\n  it(\"throws for empty payment array\", () => {\n    expect(() => generateNACHFile([])).toThrow(\"must not be empty\");\n  });\n\n  it(\"throws for non-positive amountMinor\", () => {\n    expect(() => generateNACHFile([makeRow({ amountMinor: 0n })])).toThrow(\"amountMinor must be > 0\");\n  });\n\n  it(\"uses SFTP_NACH_ORIGINATOR env var as originator code when not passed\", () => {\n    process.env[\"SFTP_NACH_ORIGINATOR\"] = \"ENVAGENCY\";\n    const file = generateNACHFile([row], { valueDate: FIXED_DATE });\n    const [header] = file.split(\"\\r\\n\");\n    expect(header!.slice(1, 17)).toBe(\"ENVAGENCY       \");\n    delete process.env[\"SFTP_NACH_ORIGINATOR\"];\n  });\n\n  it(\"header record has correct originator at positions 2–17 (56+ chars)\", () => {\n    const file = generateNACHFile([row], { originatorCode: \"PFMSAG01\", valueDate: FIXED_DATE });\n    const [header] = file.split(\"\\r\\n\");\n    expect(header!.slice(1, 17)).toBe(\"PFMSAG01        \");\n    expect(header!.length).toBeGreaterThanOrEqual(56);\n  });\n});\n\n// ── sftp-egress: buildRemotePath ──────────────────────────────────────────────\n\ndescribe(\"buildRemotePath\", () => {\n  it(\"constructs <"+"baseDir>/<"+"YYYY-MM-DD>/<"+"filename>\", async () => {\n    const { buildRemotePath } = await import(\n      \"../src/modules/integrations/sftp-egress.js\"\n    );\n    const date = new Date(\"2024-07-01T10:00:00Z\");\n    const result = buildRemotePath(\"/upload/agency/AG001\", \"NACH_batch_001.txt\", date);\n    expect(result).toBe(\"/upload/agency/AG001/2024-07-01/NACH_batch_001.txt\");\n  });\n\n  it(\"strips trailing slash from baseDir\", async () => {\n    const { buildRemotePath } = await import(\n      \"../src/modules/integrations/sftp-egress.js\"\n    );\n    const date = new Date(\"2024-12-31T00:00:00Z\");\n    const result = buildRemotePath(\"/upload/\", \"file.txt\", date);\n    expect(result).toBe(\"/upload/2024-12-31/file.txt\");\n  });\n});\n\n// ── sftp-egress: readSftpConfig ────────────────────────────────────────────────\n\ndescribe(\"readSftpConfig\", () => {\n  it(\"returns null when SFTP_HOST is not set\", async () => {\n    const saved = process.env[\"SFTP_HOST\"];\n    delete process.env[\"SFTP_HOST\"];\n    const { readSftpConfig } = await import(\"../src/modules/integrations/sftp-egress.js\");\n    expect(readSftpConfig()).toBeNull();\n    if (saved !== undefined) process.env[\"SFTP_HOST\"] = saved;\n  });\n\n  it(\"throws when SFTP_HOST set but companion vars missing\", async () => {\n    process.env[\"SFTP_HOST\"] = \"sftp.pfms.gov.in\";\n    delete process.env[\"SFTP_USER\"];\n    delete process.env[\"SFTP_KEY_PATH\"];\n    delete process.env[\"SFTP_REMOTE_DIR\"];\n    const { readSftpConfig } = await import(\"../src/modules/integrations/sftp-egress.js\");\n    expect(() => readSftpConfig()).toThrow(\"SFTP_USER\");\n    delete process.env[\"SFTP_HOST\"];\n  });\n});\n"},"services/finance-service/tests/budget-domain.test.ts":{"tests":[{"id":"268","name":"budget/domain — availableBalance() returns RE minus utilised"},{"id":"269","name":"budget/domain — availableBalance() returns zero when fully utilised"},{"id":"270","name":"budget/domain — availableBalance() returns negative when over-utilised"},{"id":"271","name":"budget/domain — assertBudgetNotExceeded() passes when within budget"},{"id":"272","name":"budget/domain — assertBudgetNotExceeded() passes when exactly at budget"},{"id":"273","name":"budget/domain — assertBudgetNotExceeded() throws BUDGET_EXCEEDED when over budget"},{"id":"274","name":"budget/domain — sanctions sanctionAvailable returns unspent"},{"id":"275","name":"budget/domain — sanctions assertSanctionNotExhausted passes within limit"},{"id":"276","name":"budget/domain — sanctions assertSanctionNotExhausted throws when exhausted"},{"id":"277","name":"budget/domain — assertValidFY() accepts valid FY format"},{"id":"278","name":"budget/domain — assertValidFY() rejects invalid FY format"},{"id":"279","name":"budget/domain — GFR Rules assertReleaseWithinSanction passes when RE <"+"= BE"},{"id":"280","name":"budget/domain — GFR Rules assertReleaseWithinSanction throws when RE > BE (Rule 11)"},{"id":"281","name":"budget/domain — GFR Rules assertReappropriationValid passes with sufficient savings"},{"id":"282","name":"budget/domain — GFR Rules assertReappropriationValid throws for zero/negative amount"},{"id":"283","name":"budget/domain — GFR Rules assertReappropriationValid throws when exceeds savings (Rule 10)"},{"id":"284","name":"budget/domain — assertSanctionApproverDistinct() passes for different actors"},{"id":"285","name":"budget/domain — assertSanctionApproverDistinct() throws MAKER_CHECKER_VIOLATION for same actor"},{"id":"286","name":"shared/hoa — parseHoA() parses a valid 18-digit code"},{"id":"287","name":"shared/hoa — parseHoA() throws HOA_EMPTY for null/undefined"},{"id":"288","name":"shared/hoa — parseHoA() throws HOA_BAD_LENGTH for wrong length"},{"id":"289","name":"shared/hoa — parseHoA() throws HOA_NON_NUMERIC for non-digits"},{"id":"290","name":"shared/hoa — validateHoA() returns true for valid code"},{"id":"291","name":"shared/hoa — validateHoA() returns false for invalid code"},{"id":"292","name":"shared/hoa — majorHeadOf() returns first 4 digits"},{"id":"293","name":"shared/pfms — assertValidPfmsHoA() passes for 18-digit code"},{"id":"294","name":"shared/pfms — assertValidPfmsHoA() throws for invalid code"},{"id":"295","name":"shared/pfms — assertValidDdoCode() passes for valid DDO code (6-12 alphanumeric)"},{"id":"296","name":"shared/pfms — assertValidDdoCode() throws for too short"},{"id":"297","name":"shared/pfms — assertValidDdoCode() throws for null"},{"id":"298","name":"shared/pfms — assertValidAgencyCode() passes for valid agency code"},{"id":"299","name":"shared/pfms — assertValidAgencyCode() throws for invalid"},{"id":"300","name":"shared/pfms — assertValidSchemeCode() passes for valid scheme code (4-20 alphanumeric)"},{"id":"301","name":"shared/pfms — assertValidSchemeCode() throws for too short"}],"source":"/**\n * Coverage tests for budget/domain.ts + shared/pfms.ts + shared/hoa.ts.\n * Pure domain logic — no DB or I/O.\n */\nimport { describe, it, expect } from \"vitest\";\nimport {\n  DomainError,\n  availableBalance,\n  assertBudgetNotExceeded,\n  sanctionAvailable,\n  assertSanctionNotExhausted,\n  assertValidFY,\n  assertReleaseWithinSanction,\n  assertReappropriationValid,\n  assertSanctionApproverDistinct,\n  assertValidPfmsHoA,\n  assertValidDdoCode,\n} from \"../src/modules/budget/domain.js\";\nimport { parseHoA, validateHoA, majorHeadOf, HoaError, HOA_TOTAL_WIDTH } from \"../src/shared/hoa.js\";\nimport { assertValidAgencyCode, assertValidSchemeCode, PfmsValidationError } from \"../src/shared/pfms.js\";\n\ndescribe(\"budget/domain — availableBalance()\", () => {\n  it(\"returns RE minus utilised\", () => {\n    expect(availableBalance({ reMinor: 1000000n, utilisedMinor: 400000n })).toBe(600000n);\n  });\n\n  it(\"returns zero when fully utilised\", () => {\n    expect(availableBalance({ reMinor: 1000000n, utilisedMinor: 1000000n })).toBe(0n);\n  });\n\n  it(\"returns negative when over-utilised\", () => {\n    expect(availableBalance({ reMinor: 1000000n, utilisedMinor: 1200000n })).toBe(-200000n);\n  });\n});\n\ndescribe(\"budget/domain — assertBudgetNotExceeded()\", () => {\n  it(\"passes when within budget\", () => {\n    expect(() => assertBudgetNotExceeded(500000n, 300000n)).not.toThrow();\n  });\n\n  it(\"passes when exactly at budget\", () => {\n    expect(() => assertBudgetNotExceeded(500000n, 500000n)).not.toThrow();\n  });\n\n  it(\"throws BUDGET_EXCEEDED when over budget\", () => {\n    expect(() => assertBudgetNotExceeded(500000n, 600000n)).toThrow(DomainError);\n    try { assertBudgetNotExceeded(500000n, 600000n); } catch (e) {\n      expect((e as DomainError).code).toBe(\"BUDGET_EXCEEDED\");\n    }\n  });\n});\n\ndescribe(\"budget/domain — sanctions\", () => {\n  it(\"sanctionAvailable returns unspent\", () => {\n    expect(sanctionAvailable({ amountMinor: 1000000n, utilisedMinor: 300000n })).toBe(700000n);\n  });\n\n  it(\"assertSanctionNotExhausted passes within limit\", () => {\n    expect(() => assertSanctionNotExhausted({ amountMinor: 1000000n, utilisedMinor: 300000n }, 500000n)).not.toThrow();\n  });\n\n  it(\"assertSanctionNotExhausted throws when exhausted\", () => {\n    expect(() => assertSanctionNotExhausted({ amountMinor: 1000000n, utilisedMinor: 800000n }, 300000n)).toThrow();\n    try { assertSanctionNotExhausted({ amountMinor: 1000000n, utilisedMinor: 800000n }, 300000n); } catch (e) {\n      expect((e as DomainError).code).toBe(\"SANCTION_EXHAUSTED\");\n    }\n  });\n});\n\ndescribe(\"budget/domain — assertValidFY()\", () => {\n  it(\"accepts valid FY format\", () => {\n    expect(() => assertValidFY(\"2024-25\")).not.toThrow();\n    expect(() => assertValidFY(\"2025-26\")).not.toThrow();\n  });\n\n  it(\"rejects invalid FY format\", () => {\n    expect(() => assertValidFY(\"2024\")).toThrow();\n    expect(() => assertValidFY(\"2024-2025\")).toThrow();\n    expect(() => assertValidFY(\"24-25\")).toThrow();\n    try { assertValidFY(\"bad\"); } catch (e) {\n      expect((e as DomainError).code).toBe(\"INVALID_FY\");\n    }\n  });\n});\n\ndescribe(\"budget/domain — GFR Rules\", () => {\n  it(\"assertReleaseWithinSanction passes when RE <"+"= BE\", () => {\n    expect(() => assertReleaseWithinSanction(1000000n, 800000n)).not.toThrow();\n    expect(() => assertReleaseWithinSanction(1000000n, 1000000n)).not.toThrow();\n  });\n\n  it(\"assertReleaseWithinSanction throws when RE > BE (Rule 11)\", () => {\n    expect(() => assertReleaseWithinSanction(1000000n, 1100000n)).toThrow();\n    try { assertReleaseWithinSanction(1000000n, 1100000n); } catch (e) {\n      expect((e as DomainError).code).toBe(\"GFR_RULE_11_VIOLATION\");\n    }\n  });\n\n  it(\"assertReappropriationValid passes with sufficient savings\", () => {\n    expect(() => assertReappropriationValid({ reMinor: 1000000n, utilisedMinor: 300000n }, 500000n)).not.toThrow();\n  });\n\n  it(\"assertReappropriationValid throws for zero/negative amount\", () => {\n    expect(() => assertReappropriationValid({ reMinor: 1000000n, utilisedMinor: 0n }, 0n)).toThrow();\n    try { assertReappropriationValid({ reMinor: 100n, utilisedMinor: 0n }, -1n); } catch (e) {\n      expect((e as DomainError).code).toBe(\"INVALID_AMOUNT\");\n    }\n  });\n\n  it(\"assertReappropriationValid throws when exceeds savings (Rule 10)\", () => {\n    expect(() => assertReappropriationValid({ reMinor: 1000000n, utilisedMinor: 800000n }, 300000n)).toThrow();\n    try { assertReappropriationValid({ reMinor: 1000000n, utilisedMinor: 800000n }, 300000n); } catch (e) {\n      expect((e as DomainError).code).toBe(\"INSUFFICIENT_SAVINGS\");\n    }\n  });\n});\n\ndescribe(\"budget/domain — assertSanctionApproverDistinct()\", () => {\n  it(\"passes for different actors\", () => {\n    expect(() => assertSanctionApproverDistinct(\"user-a\", \"user-b\")).not.toThrow();\n  });\n\n  it(\"throws MAKER_CHECKER_VIOLATION for same actor\", () => {\n    expect(() => assertSanctionApproverDistinct(\"user-a\", \"user-a\")).toThrow();\n    try { assertSanctionApproverDistinct(\"x\", \"x\"); } catch (e) {\n      expect((e as DomainError).code).toBe(\"MAKER_CHECKER_VIOLATION\");\n    }\n  });\n});\n\ndescribe(\"shared/hoa — parseHoA()\", () => {\n  const VALID_HOA = \"210100101010101000\"; // 18 digits\n\n  it(\"parses a valid 18-digit code\", () => {\n    const r = parseHoA(VALID_HOA);\n    expect(r.majorHead).toBe(\"2101\");\n    expect(r.subMajorHead).toBe(\"00\");\n    expect(r.minorHead).toBe(\"101\");\n    expect(r.subHead).toBe(\"01\");\n    expect(r.detailedHead).toBe(\"01\");\n    expect(r.objectHead).toBe(\"01\");\n    expect(r.reserved).toBe(\"000\");\n  });\n\n  it(\"throws HOA_EMPTY for null/undefined\", () => {\n    expect(() => parseHoA(null)).toThrow(HoaError);\n    expect(() => parseHoA(undefined)).toThrow(HoaError);\n  });\n\n  it(\"throws HOA_BAD_LENGTH for wrong length\", () => {\n    expect(() => parseHoA(\"12345\")).toThrow(HoaError);\n    try { parseHoA(\"12345\"); } catch (e) { expect((e as HoaError).code).toBe(\"HOA_BAD_LENGTH\"); }\n  });\n\n  it(\"throws HOA_NON_NUMERIC for non-digits\", () => {\n    expect(() => parseHoA(\"21010010101010100A\")).toThrow(HoaError);\n    try { parseHoA(\"21010010101010100A\"); } catch (e) { expect((e as HoaError).code).toBe(\"HOA_NON_NUMERIC\"); }\n  });\n});\n\ndescribe(\"shared/hoa — validateHoA()\", () => {\n  it(\"returns true for valid code\", () => {\n    expect(validateHoA(\"210100101010101000\")).toBe(true);\n  });\n\n  it(\"returns false for invalid code\", () => {\n    expect(validateHoA(\"123\")).toBe(false);\n    expect(validateHoA(null)).toBe(false);\n  });\n});\n\ndescribe(\"shared/hoa — majorHeadOf()\", () => {\n  it(\"returns first 4 digits\", () => {\n    expect(majorHeadOf(\"210100101010101000\")).toBe(\"2101\");\n  });\n});\n\ndescribe(\"shared/pfms — assertValidPfmsHoA()\", () => {\n  it(\"passes for 18-digit code\", () => {\n    expect(() => assertValidPfmsHoA(\"210100101010101000\")).not.toThrow();\n  });\n\n  it(\"throws for invalid code\", () => {\n    expect(() => assertValidPfmsHoA(\"12345\")).toThrow(PfmsValidationError);\n    expect(() => assertValidPfmsHoA(null)).toThrow();\n  });\n});\n\ndescribe(\"shared/pfms — assertValidDdoCode()\", () => {\n  it(\"passes for valid DDO code (6-12 alphanumeric)\", () => {\n    expect(() => assertValidDdoCode(\"DDO001\")).not.toThrow();\n    expect(() => assertValidDdoCode(\"ABCDEF123456\")).not.toThrow();\n  });\n\n  it(\"throws for too short\", () => {\n    expect(() => assertValidDdoCode(\"AB\")).toThrow();\n  });\n\n  it(\"throws for null\", () => {\n    expect(() => assertValidDdoCode(null)).toThrow();\n  });\n});\n\ndescribe(\"shared/pfms — assertValidAgencyCode()\", () => {\n  it(\"passes for valid agency code\", () => {\n    expect(() => assertValidAgencyCode(\"AGN001\")).not.toThrow();\n  });\n\n  it(\"throws for invalid\", () => {\n    expect(() => assertValidAgencyCode(\"AB\")).toThrow();\n    expect(() => assertValidAgencyCode(null)).toThrow();\n  });\n});\n\ndescribe(\"shared/pfms — assertValidSchemeCode()\", () => {\n  it(\"passes for valid scheme code (4-20 alphanumeric)\", () => {\n    expect(() => assertValidSchemeCode(\"SCHEME01\")).not.toThrow();\n  });\n\n  it(\"throws for too short\", () => {\n    expect(() => assertValidSchemeCode(\"AB\")).toThrow();\n  });\n});\n"},"services/finance-service/tests/three-way-match.test.ts":{"tests":[{"id":"302","name":"3-way match — presence check (legacy) throws when po_ref is missing"},{"id":"303","name":"3-way match — presence check (legacy) throws when grn_ref is missing"},{"id":"304","name":"3-way match — presence check (legacy) passes when both refs present"},{"id":"305","name":"3-way match — tri-leg reconciliation (R5) passes when invoice == GRN == PO"},{"id":"306","name":"3-way match — tri-leg reconciliation (R5) passes when invoice is below GRN (vendor billed less)"},{"id":"307","name":"3-way match — tri-leg reconciliation (R5) passes a small overage within the 2% default tolerance"},{"id":"308","name":"3-way match — tri-leg reconciliation (R5) rejects an invoice exceeding GRN beyond tolerance (over-billing)"},{"id":"309","name":"3-way match — tri-leg reconciliation (R5) rejects when received value (GRN) exceeds ordered value (PO) beyond tolerance"},{"id":"310","name":"3-way match — tri-leg reconciliation (R5) rejects when any leg is non-positive (unpriced PO/GRN cannot match)"},{"id":"311","name":"3-way match — tri-leg reconciliation (R5) still requires both refs even with valid amounts"},{"id":"312","name":"3-way match — tri-leg reconciliation (R5) honours a custom (tighter) tolerance"},{"id":"313","name":"3-way match — exact tolerance (no truncation) rejects a sub-quantum overage on a large PO at zero tolerance"},{"id":"314","name":"3-way match — exact tolerance (no truncation) rejects an overage one paise above the tolerance boundary"},{"id":"315","name":"3-way match — exact tolerance (no truncation) still allows an overage exactly at the tolerance boundary"},{"id":"316","name":"3-way match — exact tolerance (no truncation) keeps fractional tolerances exact"},{"id":"317","name":"3-way match — exact tolerance (no truncation) rejects a sub-quantum invoice overage above GRN"},{"id":"318","name":"deviationExceedsTolerance — shared exact comparator is exclusive at the boundary"},{"id":"319","name":"deviationExceedsTolerance — shared exact comparator detects sub-quantum deviation at zero tolerance"},{"id":"320","name":"deviationExceedsTolerance — shared exact comparator treats a non-positive cap as no authorised amount"},{"id":"321","name":"deviationExceedsTolerance — shared exact comparator ignores negative deviation (under-run is always within tolerance)"}],"source":"import { describe, it, expect } from \"vitest\";\nimport { assertThreeWayMatch, assertThreeWayMatchPresent, deviationExceedsTolerance, DomainError } from \"../src/modules/payments/domain.js\";\n\n/**\n * R5 — real tri-leg PO↔GRN↔invoice reconciliation (not just ref presence).\n * The invoice may not exceed the received (GRN) or ordered (PO) value beyond\n * tolerance; under-billing is allowed; unpriced legs cannot match.\n */\ndescribe(\"3-way match — presence check (legacy)\", () => {\n  it(\"throws when po_ref is missing\", () => {\n    expect(() => assertThreeWayMatchPresent(null, \"grn-1\")).toThrowError(/THREE_WAY_MATCH_FAILED/);\n  });\n  it(\"throws when grn_ref is missing\", () => {\n    expect(() => assertThreeWayMatchPresent(\"po-1\", undefined)).toThrowError(/THREE_WAY_MATCH_FAILED/);\n  });\n  it(\"passes when both refs present\", () => {\n    expect(() => assertThreeWayMatchPresent(\"po-1\", \"grn-1\")).not.toThrow();\n  });\n});\n\ndescribe(\"3-way match — tri-leg reconciliation (R5)\", () => {\n  const PO = \"procurement_po:po-1\";\n  const GRN = \"procurement_grn:grn-1\";\n\n  it(\"passes when invoice == GRN == PO\", () => {\n    expect(() => assertThreeWayMatch(PO, GRN, { poAmountMinor: 100000n, grnAmountMinor: 100000n, invoiceMinor: 100000n })).not.toThrow();\n  });\n\n  it(\"passes when invoice is below GRN (vendor billed less)\", () => {\n    expect(() => assertThreeWayMatch(PO, GRN, { poAmountMinor: 100000n, grnAmountMinor: 100000n, invoiceMinor: 80000n })).not.toThrow();\n  });\n\n  it(\"passes a small overage within the 2% default tolerance\", () => {\n    // invoice 101000 vs GRN 100000 = +1% (≤2%)\n    expect(() => assertThreeWayMatch(PO, GRN, { poAmountMinor: 100000n, grnAmountMinor: 100000n, invoiceMinor: 101000n })).not.toThrow();\n  });\n\n  it(\"rejects an invoice exceeding GRN beyond tolerance (over-billing)\", () => {\n    expect(() => assertThreeWayMatch(PO, GRN, { poAmountMinor: 100000n, grnAmountMinor: 100000n, invoiceMinor: 150000n }))\n      .toThrowError(/INVOICE_EXCEEDS_GRN/);\n  });\n\n  it(\"rejects when received value (GRN) exceeds ordered value (PO) beyond tolerance\", () => {\n    expect(() => assertThreeWayMatch(PO, GRN, { poAmountMinor: 100000n, grnAmountMinor: 130000n, invoiceMinor: 100000n }))\n      .toThrowError(/GRN_EXCEEDS_PO/);\n  });\n\n  it(\"rejects when any leg is non-positive (unpriced PO/GRN cannot match)\", () => {\n    expect(() => assertThreeWayMatch(PO, GRN, { poAmountMinor: 0n, grnAmountMinor: 100000n, invoiceMinor: 100000n }))\n      .toThrowError(DomainError);\n  });\n\n  it(\"still requires both refs even with valid amounts\", () => {\n    expect(() => assertThreeWayMatch(null, GRN, { poAmountMinor: 100000n, grnAmountMinor: 100000n, invoiceMinor: 100000n }))\n      .toThrowError(/THREE_WAY_MATCH_FAILED/);\n  });\n\n  it(\"honours a custom (tighter) tolerance\", () => {\n    // +1% overage fails under a 0.5% tolerance\n    expect(() => assertThreeWayMatch(PO, GRN, { poAmountMinor: 100000n, grnAmountMinor: 100000n, invoiceMinor: 101000n }, 0.5))\n      .toThrowError(/INVOICE_EXCEEDS_GRN/);\n  });\n});\n\n/**\n * Precision regression guards.\n *\n * The tolerance decision must not run through `overagePct()`, whose BigInt\n * division truncates toward zero and therefore quantises the measured overage\n * down to 0.01%-of-cap steps. Because the rounding always favours admitting\n * overage, the larger the PO the more unauthorised money passes. These cases all\n * sit inside one quantum, so they pass only with exact integer comparison.\n */\ndescribe(\"3-way match — exact tolerance (no truncation)\", () => {\n  const PO = \"po-1\";\n  const GRN = \"grn-1\";\n\n  it(\"rejects a sub-quantum overage on a large PO at zero tolerance\", () => {\n    // PO Rs 1 crore = 1_000_000_000 paise; quantum = cap/10000 = 100_000 paise.\n    // GRN is Rs 999.99 (99_999 paise) over — less than one quantum, so the\n    // truncating percentage reports 0.00% and would admit it.\n    expect(() =>\n      assertThreeWayMatch(PO, GRN, {\n        poAmountMinor: 1_000_000_000n,\n        grnAmountMinor: 1_000_099_999n,\n        invoiceMinor: 1_000_000_000n,\n      }, 0),\n    ).toThrowError(/GRN_EXCEEDS_PO/);\n  });\n\n  it(\"rejects an overage one paise above the tolerance boundary\", () => {\n    // PO Rs 1,000 = 100_000 paise. 2% = 2_000 paise. 2_001 paise is 2.001%,\n    // which the truncating percentage reports as exactly 2.00%.\n    expect(() =>\n      assertThreeWayMatch(PO, GRN, {\n        poAmountMinor: 100_000n,\n        grnAmountMinor: 102_001n,\n        invoiceMinor: 100_000n,\n      }),\n    ).toThrowError(/GRN_EXCEEDS_PO/);\n  });\n\n  it(\"still allows an overage exactly at the tolerance boundary\", () => {\n    // The boundary stays exclusive — exactly 2% is authorised.\n    expect(() =>\n      assertThreeWayMatch(PO, GRN, {\n        poAmountMinor: 100_000n,\n        grnAmountMinor: 102_000n,\n        invoiceMinor: 100_000n,\n      }),\n    ).not.toThrow();\n  });\n\n  it(\"keeps fractional tolerances exact\", () => {\n    // 2.5% of 100_000 = 2_500 paise: at is allowed, one paise past is not.\n    const at = { poAmountMinor: 100_000n, grnAmountMinor: 102_500n, invoiceMinor: 100_000n };\n    const past = { poAmountMinor: 100_000n, grnAmountMinor: 102_501n, invoiceMinor: 100_000n };\n    expect(() => assertThreeWayMatch(PO, GRN, at, 2.5)).not.toThrow();\n    expect(() => assertThreeWayMatch(PO, GRN, past, 2.5)).toThrowError(/GRN_EXCEEDS_PO/);\n  });\n\n  it(\"rejects a sub-quantum invoice overage above GRN\", () => {\n    expect(() =>\n      assertThreeWayMatch(PO, GRN, {\n        poAmountMinor: 2_000_000_000n,\n        grnAmountMinor: 1_000_000_000n,\n        invoiceMinor: 1_000_099_999n,\n      }, 0),\n    ).toThrowError(/INVOICE_EXCEEDS_GRN/);\n  });\n});\n\ndescribe(\"deviationExceedsTolerance — shared exact comparator\", () => {\n  it(\"is exclusive at the boundary\", () => {\n    expect(deviationExceedsTolerance(2_000n, 100_000n, 2)).toBe(false);\n    expect(deviationExceedsTolerance(2_001n, 100_000n, 2)).toBe(true);\n  });\n\n  it(\"detects sub-quantum deviation at zero tolerance\", () => {\n    expect(deviationExceedsTolerance(1n, 1_000_000_000n, 0)).toBe(true);\n    expect(deviationExceedsTolerance(0n, 1_000_000_000n, 0)).toBe(false);\n  });\n\n  it(\"treats a non-positive cap as no authorised amount\", () => {\n    expect(deviationExceedsTolerance(1n, 0n, 100)).toBe(true);\n    expect(deviationExceedsTolerance(0n, 0n, 0)).toBe(false);\n  });\n\n  it(\"ignores negative deviation (under-run is always within tolerance)\", () => {\n    expect(deviationExceedsTolerance(-5_000n, 100_000n, 0)).toBe(false);\n  });\n});\n"},"services/payroll-service/tests/payroll-domain-coverage.test.ts":{"tests":[{"id":"322","name":"payroll/domain — roundRupee() rounds 150 paise to 200"},{"id":"323","name":"payroll/domain — roundRupee() rounds 149 paise to 100"},{"id":"324","name":"payroll/domain — roundRupee() rounds 0 to 0"},{"id":"325","name":"payroll/domain — roundRupee() rounds negative"},{"id":"326","name":"payroll/domain — hraSlabPct() X city base (DA<"+"50%) = 24%"},{"id":"327","name":"payroll/domain — hraSlabPct() X city DA>=50% = 27%"},{"id":"328","name":"payroll/domain — hraSlabPct() X city DA>=100% = 30%"},{"id":"329","name":"payroll/domain — hraSlabPct() Y city base = 16%"},{"id":"330","name":"payroll/domain — hraSlabPct() Z city base = 8%"},{"id":"331","name":"payroll/domain — computeSlip() EPF produces earnings with BASIC, DA, HRA"},{"id":"332","name":"payroll/domain — computeSlip() EPF gross is sum of all earnings"},{"id":"333","name":"payroll/domain — computeSlip() EPF net = gross - total deductions"},{"id":"334","name":"payroll/domain — computeSlip() EPF EPF employee PF is capped at 12% of ₹15K"},{"id":"335","name":"payroll/domain — computeSlip() EPF ESI NOT deducted when gross > ₹21K"},{"id":"336","name":"payroll/domain — computeSlip() EPF ESI deducted when gross <"+"= ₹21K"},{"id":"337","name":"payroll/domain — computeSlip() GPF GPF = 10% of basic+DA"},{"id":"338","name":"payroll/domain — computeSlip() NPS NPS employee = 10%, employer = 14%"},{"id":"339","name":"payroll/domain — computeSlip() with rawComponents adds percentage-based earning"},{"id":"340","name":"payroll/domain — computeSlip() with rawComponents adds fixed deduction"},{"id":"341","name":"payroll/domain — assertRunStatusTransition() allows draft → processing"},{"id":"342","name":"payroll/domain — assertRunStatusTransition() allows processing → approved"},{"id":"343","name":"payroll/domain — assertRunStatusTransition() allows processing → failed"},{"id":"344","name":"payroll/domain — assertRunStatusTransition() allows approved → disbursed"},{"id":"345","name":"payroll/domain — assertRunStatusTransition() allows failed → draft"},{"id":"346","name":"payroll/domain — assertRunStatusTransition() blocks draft → approved"},{"id":"347","name":"payroll/domain — assertRunStatusTransition() blocks disbursed → draft"},{"id":"348","name":"payroll/domain — computeGratuity() computes for 20 years service"},{"id":"349","name":"payroll/domain — computeGratuity() caps at 20 lakh"},{"id":"350","name":"payroll/domain — computeGratuity() returns 0 for <"+" 5 years"}],"source":"/**\n * Payroll domain coverage tests — computeSlip, gratuity, status transitions.\n */\nimport { describe, it, expect } from \"vitest\";\nimport {\n  computeSlip, roundRupee, hraSlabPct, assertRunStatusTransition,\n  computeGratuity, DomainError,\n  type SlipInput,\n} from \"../src/modules/payroll/domain.js\";\n\ndescribe(\"payroll/domain — roundRupee()\", () => {\n  it(\"rounds 150 paise to 200\", () => { expect(roundRupee(150n)).toBe(200n); });\n  it(\"rounds 149 paise to 100\", () => { expect(roundRupee(149n)).toBe(100n); });\n  it(\"rounds 0 to 0\", () => { expect(roundRupee(0n)).toBe(0n); });\n  it(\"rounds negative\", () => { expect(roundRupee(-150n)).toBe(-200n); });\n});\n\ndescribe(\"payroll/domain — hraSlabPct()\", () => {\n  it(\"X city base (DA<"+"50%) = 24%\", () => { expect(hraSlabPct(\"X\", 4000n)).toBe(24n); });\n  it(\"X city DA>=50% = 27%\", () => { expect(hraSlabPct(\"X\", 5000n)).toBe(27n); });\n  it(\"X city DA>=100% = 30%\", () => { expect(hraSlabPct(\"X\", 10000n)).toBe(30n); });\n  it(\"Y city base = 16%\", () => { expect(hraSlabPct(\"Y\", 0n)).toBe(16n); });\n  it(\"Z city base = 8%\", () => { expect(hraSlabPct(\"Z\", 0n)).toBe(8n); });\n});\n\ndescribe(\"payroll/domain — computeSlip() EPF\", () => {\n  const base: SlipInput = {\n    basicMinor: 5600000n,\n    daRateBps: 5000n,\n    cityClass: \"X\",\n    pensionScheme: \"EPF\",\n    taxRegime: \"new\",\n    fyStartYear: 2025,\n  };\n\n  it(\"produces earnings with BASIC, DA, HRA\", () => {\n    const r = computeSlip(base);\n    expect(r.earnings.some(e => e.code === \"BASIC\")).toBe(true);\n    expect(r.earnings.some(e => e.code === \"DA\")).toBe(true);\n    expect(r.earnings.some(e => e.code === \"HRA\")).toBe(true);\n  });\n\n  it(\"gross is sum of all earnings\", () => {\n    const r = computeSlip(base);\n    const sum = r.earnings.reduce((s, e) => s + e.amountMinor, 0n);\n    expect(r.grossMinor).toBe(sum);\n  });\n\n  it(\"net = gross - total deductions\", () => {\n    const r = computeSlip(base);\n    expect(r.netPayMinor).toBe(r.grossMinor - r.totalDeductionsMinor);\n  });\n\n  it(\"EPF employee PF is capped at 12% of ₹15K\", () => {\n    const r = computeSlip(base);\n    expect(r.pfEmployeeMinor).toBe(180000n);\n  });\n\n  it(\"ESI NOT deducted when gross > ₹21K\", () => {\n    const r = computeSlip(base);\n    expect(r.esiMinor).toBe(0n);\n  });\n\n  it(\"ESI deducted when gross <"+"= ₹21K\", () => {\n    const r = computeSlip({ ...base, basicMinor: 1000000n, daRateBps: 0n });\n    expect(r.esiMinor).toBeGreaterThan(0n);\n  });\n});\n\ndescribe(\"payroll/domain — computeSlip() GPF\", () => {\n  it(\"GPF = 10% of basic+DA\", () => {\n    const r = computeSlip({ basicMinor: 5000000n, daRateBps: 5000n, pensionScheme: \"GPF\", taxRegime: \"new\", fyStartYear: 2025 });\n    expect(r.gpfMinor).toBe(750000n);\n  });\n});\n\ndescribe(\"payroll/domain — computeSlip() NPS\", () => {\n  it(\"NPS employee = 10%, employer = 14%\", () => {\n    const r = computeSlip({ basicMinor: 5000000n, daRateBps: 5000n, pensionScheme: \"NPS\", taxRegime: \"new\", fyStartYear: 2025 });\n    expect(r.npsEmployeeMinor).toBe(750000n);\n    expect(r.npsEmployerMinor).toBe(1050000n);\n  });\n});\n\ndescribe(\"payroll/domain — computeSlip() with rawComponents\", () => {\n  it(\"adds percentage-based earning\", () => {\n    const r = computeSlip({\n      basicMinor: 5000000n, pensionScheme: \"EPF\", taxRegime: \"new\", fyStartYear: 2025,\n      rawComponents: [{ code: \"TA\", name: \"Transport\", type: \"earning\", pctOfBasic: 10, fixedMinor: 0n }],\n    });\n    expect(r.earnings.some(e => e.code === \"TA\")).toBe(true);\n  });\n\n  it(\"adds fixed deduction\", () => {\n    const r = computeSlip({\n      basicMinor: 5000000n, pensionScheme: \"EPF\", taxRegime: \"new\", fyStartYear: 2025,\n      rawComponents: [{ code: \"CANTEEN\", name: \"Canteen\", type: \"deduction\", fixedMinor: 50000n }],\n    });\n    expect(r.deductions.some(d => d.code === \"CANTEEN\")).toBe(true);\n  });\n});\n\ndescribe(\"payroll/domain — assertRunStatusTransition()\", () => {\n  it(\"allows draft → processing\", () => { expect(() => assertRunStatusTransition(\"draft\", \"processing\")).not.toThrow(); });\n  it(\"allows processing → approved\", () => { expect(() => assertRunStatusTransition(\"processing\", \"approved\")).not.toThrow(); });\n  it(\"allows processing → failed\", () => { expect(() => assertRunStatusTransition(\"processing\", \"failed\")).not.toThrow(); });\n  it(\"allows approved → disbursed\", () => { expect(() => assertRunStatusTransition(\"approved\", \"disbursed\")).not.toThrow(); });\n  it(\"allows failed → draft\", () => { expect(() => assertRunStatusTransition(\"failed\", \"draft\")).not.toThrow(); });\n  it(\"blocks draft → approved\", () => { expect(() => assertRunStatusTransition(\"draft\", \"approved\")).toThrow(DomainError); });\n  it(\"blocks disbursed → draft\", () => { expect(() => assertRunStatusTransition(\"disbursed\", \"draft\")).toThrow(DomainError); });\n});\n\ndescribe(\"payroll/domain — computeGratuity()\", () => {\n  it(\"computes for 20 years service\", () => {\n    const g = computeGratuity(20, 5600000n, 2800000n);\n    expect(g).toBeGreaterThan(0n);\n  });\n\n  it(\"caps at 20 lakh\", () => {\n    const g = computeGratuity(40, 20000000n, 10000000n);\n    expect(g).toBeLessThanOrEqual(200000000n);\n  });\n\n  it(\"returns 0 for <"+" 5 years\", () => {\n    expect(computeGratuity(4, 5000000n)).toBe(0n);\n  });\n});\n"},"services/finance-service/tests/payments-domain.test.ts":{"tests":[{"id":"351","name":"payments/domain — assertThreeWayMatchPresent() passes when both PO and GRN refs present"},{"id":"352","name":"payments/domain — assertThreeWayMatchPresent() throws when PO ref missing"},{"id":"353","name":"payments/domain — assertThreeWayMatchPresent() throws when GRN ref missing"},{"id":"354","name":"payments/domain — assertThreeWayMatchPresent() throws when both missing"},{"id":"355","name":"payments/domain — assertThreeWayMatch() passes when all legs match within tolerance"},{"id":"356","name":"payments/domain — assertThreeWayMatch() passes when invoice is below GRN (under-billing)"},{"id":"357","name":"payments/domain — assertThreeWayMatch() throws when GRN exceeds PO beyond tolerance"},{"id":"358","name":"payments/domain — assertThreeWayMatch() throws when invoice exceeds GRN beyond tolerance"},{"id":"359","name":"payments/domain — assertThreeWayMatch() throws when invoice exceeds PO beyond tolerance"},{"id":"360","name":"payments/domain — assertThreeWayMatch() throws when amounts are zero"},{"id":"361","name":"payments/domain — assertThreeWayMatch() respects custom tolerance"},{"id":"362","name":"payments/domain — assertValidPaymentMode() passes for valid modes"},{"id":"363","name":"payments/domain — assertValidPaymentMode() throws for invalid mode"},{"id":"364","name":"payments/domain — assertBillPassed() passes for status 'passed'"},{"id":"365","name":"payments/domain — assertBillPassed() throws for other statuses"},{"id":"366","name":"payments/domain — nextStage() section → accounts"},{"id":"367","name":"payments/domain — nextStage() accounts → pay"},{"id":"368","name":"payments/domain — nextStage() throws STAGE_TERMINAL for pay"}],"source":"/**\n * Coverage tests for payments/domain.ts (0% → target: 100%).\n * Pure domain logic — no DB or I/O.\n */\nimport { describe, it, expect } from \"vitest\";\nimport {\n  DomainError,\n  assertThreeWayMatchPresent,\n  assertThreeWayMatch,\n  assertValidPaymentMode,\n  assertBillPassed,\n  nextStage,\n  DEFAULT_THREE_WAY_TOLERANCE_PCT,\n} from \"../src/modules/payments/domain.js\";\n\ndescribe(\"payments/domain — assertThreeWayMatchPresent()\", () => {\n  it(\"passes when both PO and GRN refs present\", () => {\n    expect(() => assertThreeWayMatchPresent(\"PO-001\", \"GRN-001\")).not.toThrow();\n  });\n\n  it(\"throws when PO ref missing\", () => {\n    expect(() => assertThreeWayMatchPresent(null, \"GRN-001\")).toThrow(DomainError);\n  });\n\n  it(\"throws when GRN ref missing\", () => {\n    expect(() => assertThreeWayMatchPresent(\"PO-001\", null)).toThrow(DomainError);\n  });\n\n  it(\"throws when both missing\", () => {\n    expect(() => assertThreeWayMatchPresent(null, null)).toThrow(DomainError);\n    try { assertThreeWayMatchPresent(null, null); } catch (e) {\n      expect((e as DomainError).code).toBe(\"THREE_WAY_MATCH_FAILED\");\n    }\n  });\n});\n\ndescribe(\"payments/domain — assertThreeWayMatch()\", () => {\n  it(\"passes when all legs match within tolerance\", () => {\n    expect(() => assertThreeWayMatch(\"PO-1\", \"GRN-1\", {\n      poAmountMinor: 1000000n,\n      grnAmountMinor: 1000000n,\n      invoiceMinor: 1000000n,\n    })).not.toThrow();\n  });\n\n  it(\"passes when invoice is below GRN (under-billing)\", () => {\n    expect(() => assertThreeWayMatch(\"PO-1\", \"GRN-1\", {\n      poAmountMinor: 1000000n,\n      grnAmountMinor: 1000000n,\n      invoiceMinor: 900000n, // 10% under — allowed\n    })).not.toThrow();\n  });\n\n  it(\"throws when GRN exceeds PO beyond tolerance\", () => {\n    expect(() => assertThreeWayMatch(\"PO-1\", \"GRN-1\", {\n      poAmountMinor: 1000000n,\n      grnAmountMinor: 1100000n, // 10% over, default tolerance is 2%\n      invoiceMinor: 1000000n,\n    })).toThrow(DomainError);\n    try {\n      assertThreeWayMatch(\"PO-1\", \"GRN-1\", {\n        poAmountMinor: 1000000n, grnAmountMinor: 1100000n, invoiceMinor: 1000000n,\n      });\n    } catch (e) { expect((e as DomainError).code).toBe(\"GRN_EXCEEDS_PO\"); }\n  });\n\n  it(\"throws when invoice exceeds GRN beyond tolerance\", () => {\n    expect(() => assertThreeWayMatch(\"PO-1\", \"GRN-1\", {\n      poAmountMinor: 1000000n,\n      grnAmountMinor: 1000000n,\n      invoiceMinor: 1050000n, // 5% over tolerance (default 2%)\n    })).toThrow(DomainError);\n  });\n\n  it(\"throws when invoice exceeds PO beyond tolerance\", () => {\n    try {\n      assertThreeWayMatch(\"PO-1\", \"GRN-1\", {\n        poAmountMinor: 1000000n, grnAmountMinor: 1020000n, invoiceMinor: 1050000n,\n      });\n    } catch (e) {\n      expect((e as DomainError).code).toMatch(/INVOICE_EXCEEDS/);\n    }\n  });\n\n  it(\"throws when amounts are zero\", () => {\n    expect(() => assertThreeWayMatch(\"PO-1\", \"GRN-1\", {\n      poAmountMinor: 0n, grnAmountMinor: 1000000n, invoiceMinor: 1000000n,\n    })).toThrow(DomainError);\n  });\n\n  it(\"respects custom tolerance\", () => {\n    // With 10% tolerance, 5% overage passes\n    expect(() => assertThree
