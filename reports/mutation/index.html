illedBy":["180"],"coveredBy":[],"location":{"end":{"column":85,"line":152},"start":{"column":77,"line":152}}},{"id":"197","mutatorName":"ArrayDeclaration","replacement":"[]","statusReason":"expected [Function] to not throw an error but 'DomainError: [INVALID_PAYMENT_MODE] m…' was thrown","status":"Killed","static":true,"testsCompleted":153,"killedBy":["175"],"coveredBy":[],"location":{"end":{"column":86,"line":152},"start":{"column":37,"line":152}}},{"id":"221","mutatorName":"ObjectLiteral","replacement":"{}","statusReason":"[STAGE_TERMINAL] bill is already at final stage 'section'","status":"Killed","static":true,"testsCompleted":57,"killedBy":["199"],"coveredBy":[],"location":{"end":{"column":2,"line":170},"start":{"column":51,"line":167}}},{"id":"222","mutatorName":"StringLiteral","replacement":"\"\"","statusReason":"[STAGE_TERMINAL] bill is already at final stage 'section'","status":"Killed","static":true,"testsCompleted":57,"killedBy":["199"],"coveredBy":[],"location":{"end":{"column":22,"line":168},"start":{"column":12,"line":168}}},{"id":"223","mutatorName":"StringLiteral","replacement":"\"\"","statusReason":"[STAGE_TERMINAL] bill is already at final stage 'accounts'","status":"Killed","static":true,"testsCompleted":58,"killedBy":["200"],"coveredBy":[],"location":{"end":{"column":18,"line":169},"start":{"column":13,"line":169}}},{"id":"200","mutatorName":"StringLiteral","replacement":"\"\"","statusReason":"expected [Function] to not throw an error but 'DomainError: [INVALID_PAYMENT_MODE] m…' was thrown","status":"Killed","static":true,"testsCompleted":284,"killedBy":["177"],"coveredBy":[],"location":{"end":{"column":60,"line":152},"start":{"column":54,"line":152}}}],"source":"/** Pure payments domain logic. */\n\nexport class DomainError extends Error {\n  constructor(public code: string, message: string) {\n    super(`[${code}] ${message}`);\n    this.name = \"DomainError\";\n  }\n}\n\n/**\n * C4 FIX: Segregation of duties — the approver/payer (checker) must differ\n * from the creator (maker). Enforced on bill approve and payment initiate.\n */\nexport function assertDistinctMakerChecker(creatorId: string, approverId: string): void {\n  if (creatorId && approverId && creatorId === approverId) {\n    throw new DomainError(\n      \"MAKER_CHECKER_VIOLATION\",\n      \"maker and checker must be different actors (self-approval rejected on money path)\",\n    );\n  }\n}\n\n/** Bill must reference a PO and a GRN for 3-way match. */\nexport function assertThreeWayMatchPresent(poRef: string | null | undefined, grnRef: string | null | undefined): void {\n  if (!poRef || !grnRef) {\n    throw new DomainError(\n      \"THREE_WAY_MATCH_FAILED\",\n      \"bill requires both po_ref and grn_ref for 3-way match\"\n    );\n  }\n}\n\n/** Default 3-way-match tolerance (percent). Overridable via env at the gate. */\nexport const DEFAULT_THREE_WAY_TOLERANCE_PCT = 2;\n\nexport interface ThreeWayLegs {\n  poAmountMinor: bigint;   // authoritative ordered value (from PO)\n  grnAmountMinor: bigint;  // authoritative accepted/received value (from GRN)\n  invoiceMinor: bigint;    // vendor invoice value being passed (bill gross)\n}\n\n/**\n * Overage of `value` above `cap` as a percentage (0 when within/under cap).\n *\n * REPORTING ONLY — do not use for the accept/reject decision. The BigInt\n * division truncates, so the result is quantised down to 0.01% steps and\n * systematically UNDER-reports. Use `exceedsTolerance()` to decide.\n */\nfunction overagePct(value: bigint, cap: bigint): number {\n  if (cap <"+"= 0n) return value > 0n ? Number.POSITIVE_INFINITY : 0;\n  if (value <"+"= cap) return 0;\n  return Number((value - cap) * 10000n / cap) / 100;\n}\n\n/**\n * Exact tolerance test on an absolute deviation: is `deviation` more than\n * `tolerancePct` of `cap`? Integer-only — no float, no truncating division.\n *\n *   exceed when deviation / cap > tolerancePct / 100\n *          <"+"=>  deviation * 10000 > cap * (tolerancePct * 100)\n *\n * `tolerancePct` is scaled to basis points so fractional tolerances (2.5%)\n * stay exact. Boundary is EXCLUSIVE: exactly at tolerance is within tolerance.\n *\n * Exported so every money-path tolerance gate shares one implementation rather\n * than re-deriving it through `overagePct()`, which truncates (see below).\n */\nexport function deviationExceedsTolerance(deviation: bigint, cap: bigint, tolerancePct: number): boolean {\n  if (cap <"+"= 0n) return deviation > 0n;\n  if (deviation <"+"= 0n) return false;\n  const toleranceBps = BigInt(Math.round(tolerancePct * 100)); // percent -> bps\n  return deviation * 10000n > cap * toleranceBps;\n}\n\n/**\n * Exact tolerance test: is `value` more than `tolerancePct` above `cap`?\n *\n * WHY THIS EXISTS (money-path precision defect, found by mutation testing)\n * ----------------------------------------------------------------------\n * The decision used to be `overagePct(value, cap) > tolerancePct`. That routes a\n * money comparison through a truncating BigInt division and then a float, so the\n * measured overage is quantised DOWN to 0.01%-of-cap steps. The rounding is\n * always toward zero, so the error always favours ADMITTING overage — i.e.\n * paying more than was authorised. Measured examples:\n *\n *   PO Rs 1,000    GRN +Rs 20.01   -> reported 2.00% (true 2.001%) -> admitted at 2%\n *   PO Rs 1 crore  GRN +Rs 999.99  -> reported 0.00% (true 0.010%) -> admitted\n *                                     even at ZERO tolerance\n *\n * The quantum is `cap / 10000` paise, so the larger the PO the more money slips\n * through: Rs 999.99 on a Rs 1 crore order.\n *\n * This compares in exact integer arithmetic instead — no float, no truncation:\n *   reject when (value - cap) / cap > tolerancePct / 100\n *          <"+"=>  (value - cap) * 10000 > cap * (tolerancePct * 100)\n *\n * `tolerancePct` is scaled to basis points so fractional tolerances (e.g. 2.5%)\n * remain exact. The boundary stays EXCLUSIVE: exactly at tolerance is allowed,\n * which is the pre-existing contract.\n */\nfunction exceedsTolerance(value: bigint, cap: bigint, tolerancePct: number): boolean {\n  if (cap <"+"= 0n) return value > 0n;\n  if (value <"+"= cap) return false;\n  return deviationExceedsTolerance(value - cap, cap, tolerancePct);\n}\n\n/**\n * R5 — real tri-leg PO↔GRN↔invoice reconciliation. Beyond merely requiring the\n * two reference strings, this enforces that the money reconciles:\n *   - all three legs must be positive (an unpriced PO/GRN cannot be matched),\n *   - the received value (GRN) may not exceed the ordered value (PO) beyond\n *     tolerance — you cannot accept more than was ordered,\n *   - the invoice may not exceed the accepted value (GRN) beyond tolerance —\n *     you pay for what was received, not what was billed,\n *   - the invoice may not exceed the ordered value (PO) beyond tolerance.\n * Under-billing (invoice <"+" GRN) is always allowed (vendor billed less).\n */\nexport function assertThreeWayMatch(\n  poRef: string | null | undefined,\n  grnRef: string | null | undefined,\n  legs: ThreeWayLegs,\n  tolerancePct: number = DEFAULT_THREE_WAY_TOLERANCE_PCT,\n): void {\n  assertThreeWayMatchPresent(poRef, grnRef);\n  const { poAmountMinor, grnAmountMinor, invoiceMinor } = legs;\n  if (poAmountMinor <"+"= 0n || grnAmountMinor <"+"= 0n || invoiceMinor <"+"= 0n) {\n    throw new DomainError(\n      \"THREE_WAY_MATCH_FAILED\",\n      `po/grn/invoice amounts must all be positive to reconcile (po=${poAmountMinor} grn=${grnAmountMinor} invoice=${invoiceMinor})`,\n    );\n  }\n  if (exceedsTolerance(grnAmountMinor, poAmountMinor, tolerancePct)) {\n    throw new DomainError(\n      \"GRN_EXCEEDS_PO\",\n      `received value ${grnAmountMinor} paise exceeds ordered value ${poAmountMinor} paise by ~${overagePct(grnAmountMinor, poAmountMinor)}%, beyond the ${tolerancePct}% tolerance`,\n    );\n  }\n  if (exceedsTolerance(invoiceMinor, grnAmountMinor, tolerancePct)) {\n    throw new Domai "location":{"end":{"column":69,"line":75},"start":{"column":52,"line":75}}}],"source":"import { hraExemptionMinor, annualTaxFromTaxableMinor, trueUpTdsMinor, type Regime } from \"../tax/engine.js\";\n\n/** Employee tax declaration inputs for old-regime exemptions (annual paise). */\nexport interface TaxDeclarationInput {\n  rentPaidAnnualMinor?: bigint;\n  ded80cMinor?: bigint;\n  ded80dMinor?: bigint;\n  otherDedMinor?: bigint;\n  /** Previous-employer taxable salary for this FY (Sec 192(2), both regimes). */\n  prevEmployerSalaryMinor?: bigint;\n  /** Income reported under \"income from other sources\" (both regimes). */\n  otherSourcesIncomeMinor?: bigint;\n  /** Perquisites value, Sec 17(2) — added to salary income (both regimes). */\n  perquisitesMinor?: bigint;\n}\n\nexport class DomainError extends Error {\n  constructor(public code: string, message: string) {\n    super(`[${code}] ${message}`);\n    this.name = \"DomainError\";\n  }\n}\n\nexport interface PayComponent {\n  code: string;\n  name: string;\n  type: \"earning\" | \"deduction\";\n  amountMinor: bigint;\n}\n\n/** Raw structure component as configured (fixed amount OR percentage of basic). */\nexport interface RawComponent {\n  code: string;\n  name: string;\n  type: \"earning\" | \"deduction\";\n  fixedMinor?: bigint | null;\n  pctOfBasic?: number | null; // e.g. 10 => 10% of basic\n}\n\nexport type PensionScheme = \"GPF\" | \"NPS\" | \"EPF\";\nexport type CityClass = \"X\" | \"Y\" | \"Z\";\n\nexport interface SlipInput {\n  basicMinor: bigint;\n  /** Dearness Allowance rate in basis points (e.g. 5000 = 50.00%). */\n  daRateBps?: bigint;\n  /** HRA city classification (X=metro 24/27/30, Y=16/18/20, Z=8/9/10). */\n  cityClass?: CityClass;\n  /** Monthly Professional Tax to deduct (already capped to FY 2500 limit upstream). */\n  ptMinor?: bigint;\n  /** Extra ad-hoc components (LOP, loan EMI, arrears, reimbursements). */\n  components?: PayComponent[];\n  /** Structure components evaluated for fixed/pct (DA & HRA handled specially). */\n  rawComponents?: RawComponent[];\n  pensionScheme?: PensionScheme;\n  /** Income-tax regime + FY start year for monthly TDS (defaults: new / 2025). */\n  taxRegime?: Regime;\n  fyStartYear?: number;\n  /** Old-regime declaration (HRA rent, 80C, 80D, other Chapter VI-A). */\n  declaration?: TaxDeclarationInput;\n  /** Sec 192 true-up: TDS already deducted YTD this FY + months left (incl. this one). */\n  tdsYtdMinor?: bigint;\n  monthsRemaining?: number;\n  /**\n   * P3: protected-net floor (paise). Recovery deductions (LOP, loan EMI, arrears\n   * recovery) are capped so net pay never drops below this floor; the uncapped\n   * remainder is reported as `recoveryCarryForwardMinor` to be recovered later.\n   */\n  protectedNetFloorMinor?: bigint;\n  /** Sec 10(5) LTC exemption total for this employee in the current FY (paise). */\n  ltcExemptTotalMinor?: bigint;\n}\n\n/** Deduction codes treated as \"recovery\" — subject to the protected-net floor. */\nconst RECOVERY_CODES = new Set([\"LOP\", \"LOAN_EMI\", \"ARREAR_RECOVERY\"]);\n\nexport interface SlipResult {\n  grossMinor: bigint;\n  totalDeductionsMinor: bigint;\n  netPayMinor: bigint;\n  daMinor: bigint;\n  hraMinor: bigint;\n  earnings: PayComponent[];\n  deductions: PayComponent[];\n  pfEmployeeMinor: bigint;\n  pfEmployerMinor: bigint;   // total employer 12%\n  epsMinor: bigint;          // employer EPS portion (8.33%, capped 1250)\n  epfEmployerMinor: bigint;  // employer EPF portion (12% total - EPS)\n  esiMinor: bigint;\n  esiEmployerMinor: bigint;\n  ptMinor: bigint;\n  tdsMinor: bigint;\n  gpfMinor: bigint;\n  npsEmployeeMinor: bigint;\n  npsEmployerMinor: bigint;\n  annualTaxableMinor: bigint;\n  negativeNet: boolean;\n  /** P3: recovery (LOP/EMI/arrears) deferred because it would breach the net floor. */\n  recoveryCarryForwardMinor: bigint;\n}\n\nconst PF_PCT      = 12n;\nconst PF_WAGE_CAP = 1_500_000n;  // EPF/EPS wage ceiling: 15000 INR\nconst EPS_CAP     = 125_000n;    // EPS max: 1250 INR (8.33% of 15000)\nconst ESI_CAP     = 2_100_000n;  // ESI gross ceiling: 21000 INR\nconst GPF_PCT     = 10n;\nconst NPS_EMP_PCT = 10n;\nconst NPS_ER_PCT  = 14n;\nconst GRATUITY_CAP = 200_000_000n; // 20 lakh INR\n\n/** Round a paise amount to the nearest whole rupee (round-half-up). */\nexport function roundRupee(x: bigint): bigint {\n  if (x <"+" 0n) return -roundRupee(-x);\n  return ((x + 50n) / 100n) * 100n;\n}\n\nfunction pct(base: bigint, percent: bigint): bigint {\n  return roundRupee((base * percent) / 100n);\n}\n\n/** 7th CPC HRA slab % by city class, escalating with DA threshold (50% / 100%). */\nexport function hraSlabPct(cityClass: CityClass, daRateBps: bigint): bigint {\n  const tier = daRateBps >= 10000n ? 2 : daRateBps >= 5000n ? 1 : 0; // DA>=100% / >=50%\n  const table: Record<"+"CityClass, [bigint, bigint, bigint]> = {\n    X: [24n, 27n, 30n],\n    Y: [16n, 18n, 20n],\n    Z: [8n, 9n, 10n],\n  };\n  return table[cityClass][tier];\n}\n\nexport function computeSlip(input: SlipInput): SlipResult {\n  const {\n    basicMinor,\n    daRateBps = 0n,\n    cityClass = \"X\",\n    ptMinor = 0n,\n    components = [],\n    rawComponents = [],\n    pensionScheme = \"EPF\",\n    taxRegime = \"new\",\n    fyStartYear = 2025,\n    declaration = {},\n    tdsYtdMinor,\n    monthsRemaining,\n    protectedNetFloorMinor = 0n,\n    ltcExemptTotalMinor = 0n,\n  } = input;\n\n  const earnings: PayComponent[] = [];\n  const deductions: PayComponent[] = [];\n\n  // Basic is the first earning.\n  earnings.push({ code: \"BASIC\", name: \"Basic Pay\", type: \"earning\", amountMinor: basicMinor });\n\n  // Dearness Allowance = DA% of basic.\n  const daMinor = roundRupee((basicMinor * daRateBps) / 10000n);\n  if (daMinor > 0n) earnings.push({ code: \"DA\", name: \"Dearness Allowance\", type: \"earning\", amountMinor: daMinor });\n\n  // HRA = city-class slab % of basic (escalates with DA threshold).\n  const hraMinor = pct(basicMinor, hraSlabPct(cityClass, daRateBps));\n  if (hraMinor > 0n) earnings.push({ code: \"HRA\", name: \"House Rent Allowance\", type: \"earning\", amountMinor: hraMinor });\n\n  // Evaluate remaining structure components (skip BASIC/DA/HRA — handled above).\n  for (const c of rawComponents) {\n    if ([\"BASIC\", \"DA\", \"HRA\"].includes(c.code)) continue;\n    const amt = c.pctOfBasic != null && c.pctOfBasic > 0\n      ? pct(basicMinor, BigInt(Math.round(c.pctOfBasic)))\n      : roundRupee(c.fixedMinor ?? 0n);\n    if (amt === 0n) continue;\n    (c.type === \"earning\" ? earnings : deductions).push({ code: c.code, name: c.name, type: c.type, amountMinor: amt });\n  }\n\n  // Ad-hoc components (LOP, EMI, arrears, reimbursements).\n  for (const c of components) {\n    (c.type === \"earning\" ? earnings : deductions).push({ ...c, amountMinor: roundRupee(c.amountMinor) });\n  }\n\n  const grossMinor = earnings.reduce((s, e) => s + e.amountMinor, 0n);\n\n  // Pension contributions are computed on Basic + DA.\n  const pensionBase = basicMinor + daMinor;\n\n  let pfEmployeeMinor = 0n, pfEmployerMinor = 0n, epsMinor = 0n, epfEmployerMinor = 0n;\n  let gpfMinor = 0n, npsEmployeeMinor = 0n, npsEmployerMinor = 0n;\n\n  if (pensionScheme === \"GPF\") {\n    gpfMinor = pct(pensionBase, GPF_PCT);\n  } else if (pensionScheme === \"NPS\") {\n    npsEmployeeMinor = pct(pensionBase, NPS_EMP_PCT);\n    npsEmployerMinor = pct(pensionBase, NPS_ER_PCT);\n  } else {\n    const pfWage    = pensionBase > PF_WAGE_CAP ? PF_WAGE_CAP : pensionBase;\n    pfEmployeeMinor = pct(pfWage, PF_PCT);\n    pfEmployerMinor = pct(pfWage, PF_PCT);\n    const epsWage   = pensionBase > PF_WAGE_CAP ? PF_WAGE_CAP : pensionBase;\n    epsMinor        = roundRupee((epsWage * 833n) / 10000n);\n    if (epsMinor > EPS_CAP) epsMinor = EPS_CAP;\n    epfEmployerMinor = pfEmployerMinor - epsMinor;\n  }\n\n  const esiMinor         = grossMinor <"+"= ESI_CAP ? roundRupee((grossMinor * 75n) / 10000n) : 0n;\n  const esiEmployerMinor = grossMinor <"+"= ESI_CAP ? roundRupee((grossMinor * 325n) / 10000n) : 0n;\n\n  const pt = roundRupee(ptMinor);\n  if (pt > 0n) deductions.push({ code: \"PT\", name: \"Professional Tax\", type: \"deduction\", amountMinor: pt });\n\n  // Monthly TDS (Sec 192) on real annual TAXABLE income: regime-aware, with\n  // Sec 16 std deduction + PT, Sec 10(13A) HRA exemption, and Chapter VI-A (old regime).\n  const annualGross = grossMinor * 12n;\n  // Additions taxed under BOTH regimes (added before slabs):\n  //  - perquisites Sec 17(2) (current employer, not part of cash gross),\n  //  - previous-employer taxable salary for the FY (Sec 192(2)),\n  //  - income from other sources.\n  const perqMinor       = declaration.perquisitesMinor ?? 0n;\n  const prevEmpSalMinor = declaration.prevEmployerSalaryMinor ?? 0n;\n  const otherSrcMinor   = declaration.otherSourcesIncomeMinor ?? 0n;\n  const extraIncome     = perqMinor + prevEmpSalMinor + otherSrcMinor;\n  let annualTaxableMinor: bigint;\n  if (taxRegime === \"old\") {\n    const salaryHraAnnual   = (basicMinor + daMinor) * 12n;\n    const hraReceivedAnnual = hraMinor * 12n;\n    const rentAnnual        = declaration.rentPaidAnnualMinor ?? 0n;\n    const hraExempt = hraExemptionMinor(salaryHraAnnual, hraReceivedAnnual, rentAnnual, cityClass === \"X\");\n    const d80c = declaration.ded80cMinor ?? 0n; const c80c = d80c > 15_000_000n ? 15_000_000n : d80c;\n    const d80d = declaration.ded80dMinor ?? 0n; const c80d = d80d > 7_500_000n ? 7_500_000n : d80d;\n    const other = declaration.otherDedMinor ?? 0n;\n    annualTaxableMinor = annualGross + extraIncome - 5_000_000n - hraExempt - c80c - c80d - other - pt * 12n - ltcExemptTotalMinor;\n  } else {\n    annualTaxableMinor = annualGross + extraIncome - 7_500_000n - ltcExemptTotalMinor; // new regime: standard deduction + LTC exempt\n  }\n  if (annualTaxableMinor <"+" 0n) annualTaxableMinor = 0n;\n  const annualTaxMinor = annualTaxFromTaxableMinor(annualTaxableMinor, taxRegime, fyStartYear);\n  const tdsMinor = monthsRemaining != null\n    ? trueUpTdsMinor(annualTaxMinor, tdsYtdMinor ?? 0n, monthsRemaining)         // Sec 192 true-up\n    : (annualTaxMinor / 100n / 12n) * 100n;                                       // flat /12 fallback\n\n  // Statutory pension/insurance/tax deductions are never floored.\n  const statutoryDeductions = pfEmployeeMinor + esiMinor + tdsMinor + gpfMinor + npsEmployeeMinor;\n\n  // Split ad-hoc deductions into recovery (floor-capped) and fixed (e.g. PT, and\n  // any structure-defined deduction). Fixed deductions are not subject to the floor.\n  const recoveryRequested = deductions\n    .filter((d) => RECOVERY_CODES.has(d.code))\n    .reduce((s, d) => s + d.amountMinor, 0n);\n  const fixedAdHoc = deductions\n    .filter((d) => !RECOVERY_CODES.has(d.code))\n    .reduce((s, d) => s + d.amountMinor, 0n);\n\n  // Headroom available for recovery after gross less all non-recovery deductions,\n  // keeping net at or above the protected floor.\n  const nonRecovery   = statutoryDeductions + fixedAdHoc;\n  const headroom      = grossMinor - nonRecovery - protectedNetFloorMinor;\n  const recoveryCap   = headroom <"+" 0n ? 0n : headroom;\n  const recoveryApplied = recoveryRequested > recoveryCap ? recoveryCap : recoveryRequested;\n  const recoveryCarryForwardMinor = recoveryRequested - recoveryApplied;\n\n  // If recovery was capped, scale down the recovery deduction line items so the\n  // persisted slip reflects what was actually withheld (carry the remainder).\n  if (recoveryCarryForwardMinor > 0n && recoveryRequested > 0n) {\n    let remainingToTrim = recoveryCarryForwardMinor;\n    // Trim from the largest recovery lines first (deterministic by amount desc).\n    const recoveryLines = deductions\n      .filter((d) => RECOVERY_CODES.has(d.code))\n      .sort((a, b) => (a.amountMinor <"+" b.amountMinor ? 1 : -1));\n    for (const line of recoveryLines) {\n      if (remainingToTrim <"+"= 0n) break;\n      const trim = line.amountMinor <"+" remainingToTrim ? line.amountMinor : remainingToTrim;\n      line.amountMinor -= trim;\n      remainingToTrim -= trim;\n    }\n    // Drop fully-trimmed recovery lines.\n    for (let i = deductions.length - 1; i >= 0; i--) {\n      const d = deductions[i]!;\n      if (RECOVERY_CODES.has(d.code) && d.amountMinor === 0n) deductions.splice(i, 1);\n    }\n  }\n\n  const totalDeductions = nonRecovery + recoveryApplied;\n  const netRaw          = grossMinor - totalDeductions;\n  // With the floor enforced, netRaw can still legitimately be 0 (no floor + full\n  // recovery). negativeNet now only ever true if floor is 0 and fixed/statutory\n  // alone exceed gross (an upstream data error worth flagging as an exception).\n  const negativeNet     = netRaw <"+" 0n;\n\n  return {\n    grossMinor,\n    totalDeductionsMinor: totalDeductions,\n    netPayMinor: negativeNet ? 0n : netRaw,\n    recoveryCarryForwardMinor,\n    daMinor, hraMinor, earnings, deductions,\n    pfEmployeeMinor, pfEmployerMinor, epsMinor, epfEmployerMinor,\n    esiMinor, esiEmployerMinor, ptMinor: pt, tdsMinor,\n    gpfMinor, npsEmployeeMinor, npsEmployerMinor, annualTaxableMinor, negativeNet,\n  };\n}\n\n// ============================ Pensioner payroll ============================\n\n/**\n * CCS (Pension) additional-pension (quantum of pension) age bands. From the age\n * the pensioner attains in the run month, an extra % of basic pension is paid:\n *   80–84: 20%, 85–89: 30%, 90–94: 40%, 95–99: 50%, 100+: 100%.\n */\nexport function additionalPensionPct(ageYears: number): bigint {\n  if (ageYears >= 100) return 100n;\n  if (ageYears >= 95)  return 50n;\n  if (ageYears >= 90)  return 40n;\n  if (ageYears >= 85)  return 30n;\n  if (ageYears >= 80)  return 20n;\n  return 0n;\n}\n\n/** Whole years attained on/before the last day of the run month (YYYY-MM). */\nexport function ageAtMonth(dobIso: string, month: string): number {\n  const dob = new Date(`${dobIso.slice(0, 10)}T00:00:00Z`);\n  const [y, m] = month.split(\"-\").map(Number) as [number, number];\n  // Reference = last day of run month.\n  const ref = new Date(Date.UTC(y, m, 0));\n  let age = ref.getUTCFullYear() - dob.getUTCFullYear();\n  const mo = ref.getUTCMonth() - dob.getUTCMonth();\n  if (mo <"+" 0 || (mo === 0 && ref.getUTCDate() <"+" dob.getUTCDate())) age -= 1;\n  return age <"+" 0 ? 0 : age;\n}\n\nexport interface PensionInput {\n  basicPensionMinor: bigint;\n  /** Dearness Relief rate in basis points (same series as DA, e.g. 5000 = 50%). */\n  drRateBps?: bigint;\n  /** Portion of basic pension that was commuted (deducted until restoration). */\n  commutedPensionMinor?: bigint;\n  /** Commutation date — commuted portion is restored 15 years after it. */\n  commutationDate?: string | null;\n  /** Fixed monthly medical allowance (paise). */\n  medicalAllowanceMinor?: bigint;\n  /** Pensioner date of birth (drives additional-pension age band). */\n  dateOfBirth: string;\n  /** Run month YYYY-MM. */\n  month: string;\n  /** Monthly TDS on pension (pension is taxable as salary). 0 if none. */\n  tdsMinor?: bigint;\n}\n\nexport interface PensionResult {\n  grossMinor: bigint;\n  totalDeductionsMinor: bigint;\n  netPayMinor: bigint;\n  basicPensionMinor: bigint;\n  /** Net basic pension actually disbursed (basic less un-restored commutation). */\n  payableBasicPensionMinor: bigint;\n  drMinor: bigint;\n  additionalPensionMinor: bigint;\n  additionalPensionPct: bigint;\n  medicalAllowanceMinor: bigint;\n  commutationDeductionMinor: bigint;\n  commutationRestored: boolean;\n  tdsMinor: bigint;\n  ageYears: number;\n  earnings: PayComponent[];\n  deductions: PayComponent[];\n}\n\n/**\n * Monthly pension computation (distinct from the salary slip):\n *   gross = basic pension + additional pension (age band % of basic)\n *           + DR on (basic + additional) + fixed medical allowance.\n * The commuted portion is withheld from basic until it is restored 15 years\n * after the commutation date (CCS rule), after which the full basic is paid.\n * DR (Dearness Relief) is computed on basic + additional pension.\n */\nexport function computePension(input: PensionInput): PensionResult {\n  const {\n    basicPensionMinor,\n    drRateBps = 0n,\n    commutedPensionMinor = 0n,\n    commutationDate = null,\n    medicalAllowanceMinor = 0n,\n    dateOfBirth,\n    month,\n    tdsMinor = 0n,\n  } = input;\n\n  const ageYears = ageAtMonth(dateOfBirth, month);\n  const addlPct = additionalPensionPct(ageYears);\n  const additionalPensionMinor = pct(basicPensionMinor, addlPct);\n\n  // Restoration: 15 years after commutation date the commuted portion is restored.\n  let commutationRestored = true;\n  if (commutedPensionMinor > 0n && commutationDate) {\n    const cd = new Date(`${commutationDate.slice(0, 10)}T00:00:00Z`);\n    const restoreOn = new Date(Date.UTC(cd.getUTCFullYear() + 15, cd.getUTCMonth(), cd.getUTCDate()));\n    const [y, m] = month.split(\"-\").map(Number) as [number, number];\n    const runEnd = new Date(Date.UTC(y, m, 0));\n    commutationRestored = runEnd >= restoreOn;\n  } else if (commutedPensionMinor > 0n) {\n    // Commuted but no date provided — treat as not yet restored.\n    commutationRestored = false;\n  }\n  const commutationDeductionMinor = commutationRestored ? 0n : commutedPensionMinor;\n  const payableBasicPensionMinor = basicPensionMinor - commutationDeductionMinor;\n\n  // DR is on basic + additional pension (full basic, not reduced by commutation).\n  const drBase = basicPensionMinor + additionalPensionMinor;\n  const drMinor = roundRupee((drBase * drRateBps) / 10000n);\n  const medical = roundRupee(medicalAllowanceMinor);\n\n  const earnings: PayComponent[] = [];\n  earnings.push({ code: \"BASIC_PENSION\", name: \"Basic Pension\", type: \"earning\", amountMinor: basicPensionMinor });\n  if (additionalPensionMinor > 0n)\n    earnings.push({ code: \"ADDL_PENSION\", name: `Additional Pension (${addlPct}%)`, type: \"earning\", amountMinor: additionalPensionMinor });\n  if (drMinor > 0n)\n    earnings.push({ code: \"DR\", name: \"Dearness Relief\", type: \"earning\", amountMinor: drMinor });\n  if (medical > 0n)\n    earnings.push({ code: \"FMA\", name: \"Medical Allowance\", type: \"earning\", amountMinor: medical });\n\n  // Gross is the full entitlement; commutation withholding and TDS are deductions.\n  const grossMinor = basicPensionMinor + additionalPensionMinor + drMinor + medical;\n\n  const deductions: PayComponent[] = [];\n  if (commutationDeductionMinor > 0n)\n    deductions.push({ code: \"COMMUTATION\", name: \"Commuted Pension\", type: \"deduction\", amountMinor: commutationDeductionMinor });\n  const tds = roundRupee(tdsMinor);\n  if (tds > 0n)\n    deductions.push({ code: \"TDS\", name: \"Income Tax (TDS)\", type: \"deduction\", amountMinor: tds });\n\n  const totalDeductionsMinor = commutationDeductionMinor + tds;\n  const netPayMinor = grossMinor - totalDeductionsMinor;\n\n  return {\n    grossMinor, totalDeductionsMinor, netPayMinor,\n    basicPensionMinor, payableBasicPensionMinor,\n    drMinor, additionalPensionMinor, additionalPensionPct: addlPct,\n    medicalAllowanceMinor: medical,\n    commutationDeductionMinor, commutationRestored,\n    tdsMinor: tds, ageYears, earnings, deductions,\n  };\n}\n\nexport function assertRunStatusTransition(current: string, next: string): void {\n  const allowed: Record<"+"string, string[]> = {\n    draft:      [\"processing\"],\n    processing: [\"approved\", \"failed\"],\n    approved:   [\"disbursed\"],\n    disbursed:  [],\n    failed:     [\"draft\"],\n  };\n  if (!(allowed[current] ?? []).includes(next)) {\n    throw new DomainError(\"INVALID_STATUS_TRANSITION\", `cannot move payroll run from '${current}' to '${next}'`);\n  }\n}\n\n/**\n * Payment of Gratuity Act / CCS: (15/26) * (last Basic+DA) * completed years,\n * where >=6 months in the final year rounds up; capped at 20 lakh.\n */\nexport function computeGratuity(yearsOfService: number, lastBasi ef: string;\n  authorityType: AuthorityType;\n  currency: string;\n  /** Inclusive maximum amount the scope may authorise. */\n  maxAmount: number;\n  /** YYYY-MM-DD (inclusive). */\n  effectiveFrom: string;\n  /** YYYY-MM-DD (inclusive) or null = open-ended. */\n  effectiveTo: string | null;\n  /** Where a request exceeding this limit escalates to (null = terminal). */\n  escalateToScopeType: AuthorityScope | null;\n  escalateToRef: string | null;\n  /** Only 'active' limits are considered by resolution. */\n  status: string;\n}\n\n/** An actor's identity for authority resolution: their roles/designations/self. */\nexport interface ActorScopes {\n  scopes: Array<"+"{ scopeType: AuthorityScope; scopeRef: string }>;\n}\n\nexport interface AuthorityDecision {\n  /** The best (highest) limit the actor personally holds, or null if none. */\n  actorLimit: AuthorityLimit | null;\n  /** The actor's ceiling (0 when the actor holds no applicable limit). */\n  actorMax: number;\n  /** True when `amount` is within the actor's own authority. */\n  withinActorAuthority: boolean;\n  /** True when the amount exceeds the actor and must route upward. */\n  requiresEscalation: boolean;\n  /** Ordered chain of offices the request escalates through (excludes actor). */\n  escalationChain: Array<"+"{ scopeType: AuthorityScope; scopeRef: string; maxAmount: number }>;\n  /** The final office whose limit covers the amount, or null if uncovered. */\n  finalApprover: { scopeType: AuthorityScope; scopeRef: string; maxAmount: number } | null;\n  /** True when SOME office in the chain covers the amount. */\n  covered: boolean;\n}\n\n/** A limit is effective on `onDate` when active and the date is within bounds. */\nexport function isEffective(limit: AuthorityLimit, onDate: string): boolean {\n  if (limit.status !== \"active\") return false;\n  if (limit.effectiveFrom > onDate) return false;\n  if (limit.effectiveTo !== null && limit.effectiveTo <"+" onDate) return false;\n  return true;\n}\n\n/** Effective limits matching an exact scope + authority type on a date. */\nexport function limitsForScope(\n  limits: AuthorityLimit[],\n  scopeType: AuthorityScope,\n  scopeRef: string,\n  authorityType: AuthorityType,\n  onDate: string,\n): AuthorityLimit[] {\n  return limits.filter(\n    (l) =>\n      l.scopeType === scopeType &&\n      l.scopeRef === scopeRef &&\n      l.authorityType === authorityType &&\n      isEffective(l, onDate),\n  );\n}\n\n/** Highest-authority effective limit for a single scope (or null). */\nexport function bestLimitForScope(\n  limits: AuthorityLimit[],\n  scopeType: AuthorityScope,\n  scopeRef: string,\n  authorityType: AuthorityType,\n  onDate: string,\n): AuthorityLimit | null {\n  const matches = limitsForScope(limits, scopeType, scopeRef, authorityType, onDate);\n  if (matches.length === 0) return null;\n  return matches.reduce((best, l) => (l.maxAmount > best.maxAmount ? l : best));\n}\n\n/**\n * The actor's own authority: across ALL their scopes (roles/designations/self),\n * the single effective limit with the greatest ceiling. Returns null when the\n * actor holds no applicable limit.\n */\nexport function resolveActorLimit(\n  limits: AuthorityLimit[],\n  actor: ActorScopes,\n  authorityType: AuthorityType,\n  onDate: string,\n): AuthorityLimit | null {\n  let best: AuthorityLimit | null = null;\n  for (const s of actor.scopes) {\n    const l = bestLimitForScope(limits, s.scopeType, s.scopeRef, authorityType, onDate);\n    if (l && (best === null || l.maxAmount > best.maxAmount)) best = l;\n  }\n  return best;\n}\n\n/**\n * Walk the escalation chain upward from `start` until an office's limit covers\n * `amount`, the chain terminates, or a cycle is detected. The returned chain\n * lists each office visited (in order); `finalApprover` is the covering office\n * (or null). Guarded against cycles by tracking visited limit ids.\n */\nexport function resolveEscalation(\n  limits: AuthorityLimit[],\n  start: AuthorityLimit,\n  amount: number,\n  authorityType: AuthorityType,\n  onDate: string,\n): Pick<"+"AuthorityDecision, \"escalationChain\" | \"finalApprover\" | \"covered\"> {\n  const chain: AuthorityDecision[\"escalationChain\"] = [];\n  const visited = new Set<"+"string>([start.id]);\n  let cursor: AuthorityLimit | null = start;\n\n  while (cursor && cursor.escalateToScopeType && cursor.escalateToRef) {\n    const next: AuthorityLimit | null = bestLimitForScope(\n      limits,\n      cursor.escalateToScopeType,\n      cursor.escalateToRef,\n      authorityType,\n      onDate,\n    );\n    if (!next || visited.has(next.id)) break; // dead end or cycle\n    visited.add(next.id);\n    const node = { scopeType: next.scopeType, scopeRef: next.scopeRef, maxAmount: next.maxAmount };\n    chain.push(node);\n    if (amount <"+"= next.maxAmount) {\n      return { escalationChain: chain, finalApprover: node, covered: true };\n    }\n    cursor = next;\n  }\n  return { escalationChain: chain, finalApprover: null, covered: false };\n}\n\n/**\n * Full authority evaluation for a request of `amount` by an actor on `onDate`.\n * If the actor's own limit covers the amount, no escalation is required; else\n * the escalation chain is resolved from the actor's best limit (or, when the\n * actor holds no limit at all, from the highest applicable limit of any scope\n * they hold — falling through to whatever escalation targets exist).\n */\nexport function evaluateAuthority(\n  limits: AuthorityLimit[],\n  actor: ActorScopes,\n  authorityType: AuthorityType,\n  amount: number,\n  onDate: string,\n): AuthorityDecision {\n  const actorLimit = resolveActorLimit(limits, actor, authorityType, onDate);\n  const actorMax = actorLimit?.maxAmount ?? 0;\n  const withinActorAuthority = actorLimit !== null && amount <"+"= actorMax;\n\n  if (withinActorAuthority) {\n    return {\n      actorLimit,\n      actorMax,\n      withinActorAuthority: true,\n      requiresEscalation: false,\n      escalationChain: [],\n      finalApprover: actorLimit\n        ? { scopeType: actorLimit.scopeType, scopeRef: actorLimit.scopeRef, maxAmount: actorLimit.maxAmount }\n        : null,\n      covered: true,\n    };\n  }\n\n  // Exceeds (or actor holds no limit): escalate from the actor's best limit.\n  const esc = actorLimit\n    ? resolveEscalation(limits, actorLimit, amount, authorityType, onDate)\n    : { escalationChain: [], finalApprover: null, covered: false };\n\n  return {\n    actorLimit,\n    actorMax,\n    withinActorAuthority: false,\n    requiresEscalation: true,\n    escalationChain: esc.escalationChain,\n    finalApprover: esc.finalApprover,\n    covered: esc.covered,\n  };\n}\n"},"services/workflow-service/src/modules/quorum/domain.ts":{"language":"typescript","mutants":[{"id":"950","mutatorName":"BlockStatement","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":8,"line":86},"start":{"column":40,"line":84}}},{"id":"951","mutatorName":"StringLiteral","replacement":"\"\"","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":31,"line":85},"start":{"column":23,"line":85}}},{"id":"952","mutatorName":"StringLiteral","replacement":"``","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":93,"line":85},"start":{"column":33,"line":85}}},{"id":"953","mutatorName":"ArithmeticOperator","replacement":"approvals - pending","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":81,"line":85},"start":{"column":62,"line":85}}},{"id":"995","mutatorName":"StringLiteral","replacement":"``","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":89,"line":101},"start":{"column":27,"line":101}}},{"id":"1019","mutatorName":"ObjectLiteral","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":80,"line":131},"start":{"column":23,"line":131}}},{"id":"1020","mutatorName":"StringLiteral","replacement":"\"\"","status": s of parallel workflow branches into\n *    a single result under an all-must or any policy.\n */\n\nexport type QuorumRule = \"majority\" | \"unanimous\" | \"threshold\";\nexport type VoteChoice = \"approve\" | \"reject\" | \"abstain\";\nexport type Outcome = \"approve\" | \"reject\";\n\nexport interface QuorumInput {\n  rule: QuorumRule;\n  /** Total eligible members of the committee. */\n  totalMembers: number;\n  /** Approvals required — only for rule='threshold'. */\n  threshold?: number | null;\n  votes: VoteChoice[];\n}\n\nexport interface QuorumTally {\n  approvals: number;\n  rejections: number;\n  abstentions: number;\n  /** Non-null votes cast (approve|reject|abstain). */\n  cast: number;\n  /** Members who have not yet voted. */\n  pending: number;\n  decided: boolean;\n  outcome: Outcome | null;\n  rationale: string;\n}\n\n/**\n * Tally a committee decision. A decision is returned as soon as it is settled:\n *  - majority: approve once approvals exceed half the membership; reject once\n *    approval is unreachable (approvals + still-pending can no longer exceed\n *    half) or rejections already exceed half.\n *  - unanimous: approve only when EVERY member voted approve; reject the instant\n *    any member rejects, or once all have voted and unanimity was not reached\n *    (an abstention breaks unanimity).\n *  - threshold(N): approve once approvals reach N; reject once N is unreachable.\n */\nexport function tallyQuorum(input: QuorumInput): QuorumTally {\n  const total = Math.max(0, Math.trunc(input.totalMembers));\n  let approvals = 0;\n  let rejections = 0;\n  let abstentions = 0;\n  for (const v of input.votes) {\n    if (v === \"approve\") approvals++;\n    else if (v === \"reject\") rejections++;\n    else abstentions++;\n  }\n  const cast = approvals + rejections + abstentions;\n  const pending = Math.max(0, total - cast);\n  const base: Omit<"+"QuorumTally, \"decided\" | \"outcome\" | \"rationale\"> = {\n    approvals,\n    rejections,\n    abstentions,\n    cast,\n    pending,\n  };\n\n  const settle = (outcome: Outcome | null, rationale: string): QuorumTally => ({\n    ...base,\n    decided: outcome !== null,\n    outcome,\n    rationale,\n  });\n\n  if (total <"+"= 0) return settle(null, \"no eligible members\");\n\n  switch (input.rule) {\n    case \"majority\": {\n      const half = total / 2;\n      if (approvals > half) return settle(\"approve\", `majority reached (${approvals}/${total})`);\n      if (rejections > half) return settle(\"reject\", `majority rejected (${rejections}/${total})`);\n      // approval unreachable even if every pending member approves\n      if (approvals + pending <"+"= half) {\n        return settle(\"reject\", `approval unreachable (max ${approvals + pending}/${total})`);\n      }\n      return settle(null, `pending (${approvals} approve / ${rejections} reject / ${pending} awaited)`);\n    }\n    case \"unanimous\": {\n      if (rejections > 0) return settle(\"reject\", \"unanimity broken by a rejection\");\n      if (approvals === total) return settle(\"approve\", `unanimous (${approvals}/${total})`);\n      if (pending === 0) return settle(\"reject\", \"all voted but not unanimous (abstention present)\");\n      return settle(null, `pending unanimity (${approvals}/${total}, ${pending} awaited)`);\n    }\n    case \"threshold\": {\n      const need = Math.max(1, Math.trunc(input.threshold ?? 0));\n      if (approvals >= need) return settle(\"approve\", `threshold met (${approvals}/${need})`);\n      if (approvals + pending <"+" need) {\n        return settle(\"reject\", `threshold unreachable (max ${approvals + pending}/${need})`);\n      }\n      return settle(null, `pending threshold (${approvals}/${need}, ${pending} awaited)`);\n    }\n  }\n}\n\nexport type BranchOutcome = \"approve\" | \"reject\" | \"pending\";\nexport type ParallelMode = \"all\" | \"any\";\n\nexport interface ParallelResult {\n  outcome: BranchOutcome;\n  approvals: number;\n  rejections: number;\n  pending: number;\n  rationale: string;\n}\n\n/**\n * Consolidate parallel branch outcomes.\n *  - all (all-must): approve only when every branch approved; reject the instant\n *    any branch rejected; otherwise pending.\n *  - any (any-one): approve the instant any branch approved; reject only when\n *    every branch rejected; otherwise pending.\n */\nexport function consolidateParallel(mode: ParallelMode, branches: BranchOutcome[]): ParallelResult {\n  const approvals = branches.filter((b) => b === \"approve\").length;\n  const rejections = branches.filter((b) => b === \"reject\").length;\n  const pending = branches.filter((b) => b === \"pending\").length;\n  const n = branches.length;\n  const base = { approvals, rejections, pending };\n\n  if (n === 0) return { ...base, outcome: \"pending\", rationale: \"no branches\" };\n\n  if (mode === \"all\") {\n    if (rejections > 0) return { ...base, outcome: \"reject\", rationale: \"a required branch rejected\" };\n    if (approvals === n) return { ...base, outcome: \"approve\", rationale: \"all branches approved\" };\n    return { ...base, outcome: \"pending\", rationale: `${approvals}/${n} branches approved` };\n  }\n  // any\n  if (approvals > 0) return { ...base, outcome: \"approve\", rationale: \"a branch approved\" };\n  if (rejections === n) return { ...base, outcome: \"reject\", rationale: \"all branches rejected\" };\n  return { ...base, outcome: \"pending\", rationale: `awaiting a branch approval (${rejections}/${n} rejected)` };\n}\n"},"services/finance-service/src/modules/budget/domain.ts":{"language":"typescript","mutants":[{"id":"3","mutatorName":"ArithmeticOperator","replacement":"b.reMinor + b.utilisedMinor","statusReason":"expected 1400000n to be 600000n // Object.is equality","status":"Killed","static":false,"testsCompleted":1,"killedBy":["268"],"coveredBy":["268","269","270"],"location":{"end":{"column":37,"line":19},"start":{"column":10,"line":19}}},{"id":"4","mutatorName":"BlockStatement","repl  string) {\n    super(`[${code}] ${message}`);\n    this.name = \"DomainError\";\n  }\n}\n\nexport type SanctionStatus = \"draft\" | \"approved\" | \"exhausted\" | \"cancelled\";\n\nexport interface BudgetAvailability {\n  reMinor: bigint;\n  utilisedMinor: bigint;\n}\n\n/** Returns available balance (re_minor - utilised_minor). */\nexport function availableBalance(b: BudgetAvailability): bigint {\n  return b.reMinor - b.utilisedMinor;\n}\n\n/** Throws if bill amount exceeds available budget. */\nexport function assertBudgetNotExceeded(available: bigint, requested: bigint): void {\n  if (requested > available) {\n    throw new DomainError(\n      \"BUDGET_EXCEEDED\",\n      `requested ${requested} paise exceeds available ${available} paise`\n    );\n  }\n}\n\nexport interface SanctionAvailability {\n  amountMinor: bigint;\n  utilisedMinor: bigint;\n}\n\n/** Remaining unspent balance on a sanction. */\nexport function sanctionAvailable(s: SanctionAvailability): bigint {\n  return s.amountMinor - s.utilisedMinor;\n}\n\nexport function assertSanctionNotExhausted(s: SanctionAvailability, requested: bigint): void {\n  const avail = sanctionAvailable(s);\n  if (requested > avail) {\n    throw new DomainError(\n      \"SANCTION_EXHAUSTED\",\n      `requested ${requested} paise exceeds sanction balance ${avail} paise`\n    );\n  }\n}\n\n/** FY must be in YYYY-YY format, e.g. 2024-25. */\nexport function assertValidFY(fy: string): void {\n  if (!/^\\d{4}-\\d{2}$/.test(fy)) {\n    throw new DomainError(\"INVALID_FY\", `fiscal year must be YYYY-YY, got '${fy}'`);\n  }\n}\n\n/**\n * GFR Rule 11: Revised Estimate (reMinor) cannot exceed Budget Estimate (beMinor).\n * Release orders must be backed by sanctioned budget — prevents over-release.\n */\nexport function assertReleaseWithinSanction(beMinor: bigint, newReMinor: bigint): void {\n  if (newReMinor > beMinor) {\n    throw new DomainError(\n      \"GFR_RULE_11_VIOLATION\",\n      `revised estimate ${newReMinor} paise exceeds budget estimate ${beMinor} paise (GFR Rule 11)`\n    );\n  }\n}\n\n/**\n * GFR Rule 10 — re-appropriation is a ZERO-SUM transfer: an amount withdrawn\n * from a source head's savings is added to a target head. It must be met from\n * the source head's *savings* (its unspent revised estimate), and total\n * appropriation is conserved. The receiving head's RE may legitimately exceed\n * its own BE — that is the entire purpose of re-appropriation — so the Rule-11\n * RE≤BE cap must NOT be applied to the target here.\n */\nexport interface ReappropriationSource {\n  reMinor: bigint;       // source head revised estimate\n  utilisedMinor: bigint; // already spent/committed on the source head\n}\nexport function assertReappropriationValid(source: ReappropriationSource, amountMinor: bigint): void {\n  if (amountMinor <"+"= 0n) {\n    throw new DomainError(\"INVALID_AMOUNT\", \"re-appropriation amount must be positive\");\n  }\n  const savings = source.reMinor - source.utilisedMinor;\n  if (amountMinor > savings) {\n    throw new DomainError(\n      \"INSUFFICIENT_SAVINGS\",\n      `re-appropriation ${amountMinor} paise exceeds source head savings ${savings} paise (GFR Rule 10: must be met from savings)`\n    );\n  }\n}\n\n/**\n * R11 — maker-checker separation of duties. A sanction must be approved by an\n * officer other than the one who raised it. Self-approval (single-officer\n * sanction) is rejected so a financial commitment always has two distinct\n * accountable parties (GFR maker-checker; DFPR delegation).\n */\nexport function assertSanctionApproverDistinct(createdBy: string, approverId: string): void {\n  if (createdBy === approverId) {\n    throw new DomainError(\n      \"MAKER_CHECKER_VIOLATION\",\n      \"sanction approver must differ from the officer who created it (maker-checker)\"\n    );\n  }\n}\n\nexport { assertValidPfmsHoA, assertValidDdoCode } from \"../../shared/pfms.js\";\n"},"services/finance-service/src/modules/gl/domain.ts":{"language":"typescript outMinor: bigint;\n  leaveEncashmentGrossMinor: bigint;\n  gratuityGrossMinor: bigint;\n  retrenchmentCompMinor: bigint;\n  vrsCompMinor: bigint;\n  arrearsMinor: bigint;\n  // Inputs for exemption computation\n  lastDrawnWagesMinor: bigint;      // monthly basic + DA\n  completedYears: number;            // 6-month rounding per PG Act\n  avgSalaryLast10MonthsMinor: bigint;\n  leaveBalanceDays: number;\n  priorLeaveEncashExemptionMinor: bigint;\n  // VRS-specific\n  remainingMonthsToRetirement: number;\n  // Tax context for the FY of separation\n  taxRegime: Regime;\n  salaryYtdMinor: bigint;          // total salary already paid this FY\n  tdsYtdMinor: bigint;             // total TDS already deducted this FY\n  deductions80cMinor: bigint;       // Ch VI-A deductions declared\n  deductions80dMinor: bigint;\n  otherDeductionsMinor: bigint;\n  fyStartYear: number;\n  // Exemption ceilings (loaded from DB)\n  gratuityCeilingMinor: bigint;\n  leaveEncashCeilingMinor: bigint;\n  retrenchmentCeilingMinor: bigint;\n  vrsCeilingMinor: bigint;\n}\n\nexport interface FnfResult {\n  gratuityExemption: GratuityExemptionResult;\n  leaveEncashExemption: LeaveEncashExemptionResult;\n  retrenchmentExemption: RetrenchmentExemptionResult | null;\n  vrsExemption: VrsExemptionResult | null;\n  // Aggregates\n  totalGrossMinor: bigint;\n  totalExemptMinor: bigint;\n  totalTaxableOnSeparationMinor: bigint;\n  // FY-level tax\n  annualTaxableMinor: bigint;\n  annualTaxMinor: bigint;\n  tdsAlreadyDeductedMinor: bigint;\n  tdsOnSeparationMinor: bigint;\n  netPayableMinor: bigint;\n}\n\n/**\n * Compute a full F&F settlement with tax exemptions and TDS true-up.\n *\n * Flow:\n * 1. Compute exemptions for each separation component.\n * 2. Notice buyout and arrears are ALWAYS fully taxable (salary income).\n * 3. Sum taxable portions of all components.\n * 4. Compute annual taxable: salary YTD + taxable separation − deductions.\n * 5. Compute annual tax via existing `computeTax()`.\n * 6. TDS on separation = annual tax − TDS already deducted this FY.\n * 7. Net payable = total gross − TDS on separation.\n */\nexport function computeFnfSettlement(input: FnfInput): FnfResult {\n  // Step 1: Exemptions\n  const gratuityExemption = computeGratuityExemption({\n    actualGratuityMinor: input.gratuityGrossMinor,\n    lastDrawnWagesMinor: input.lastDrawnWagesMinor,\n    completedYears: input.completedYears,\n    employeeCategory: input.employeeCategory,\n    ceilingMinor: input.gratuityCeilingMinor,\n  });\n\n  const leaveEncashExemption = computeLeaveEncashExemption({\n    actualEncashmentMinor: input.leaveEncashmentGrossMinor,\n    avgSalaryLast10MonthsMinor: input.avgSalaryLast10MonthsMinor,\n    leaveBalanceDays: input.leaveBalanceDays,\n    completedYears: input.completedYears,\n    employeeCategory: input.employeeCategory,\n    separationType: input.separationType,\n    ceilingMinor: input.leaveEncashCeilingMinor,\n    priorExemptionClaimedMinor: input.priorLeaveEncashExemptionMinor,\n  });\n\n  const retrenchmentExemption = computeRetrenchmentExemption({\n    actualCompMinor: input.retrenchmentCompMinor,\n    avgMonthlyPayMinor: input.lastDrawnWagesMinor,\n    completedYears: input.completedYears,\n    separationType: input.separationType,\n    ceilingMinor: input.retrenchmentCeilingMinor,\n  });\n\n  const vrsExemption = computeVrsExemption({\n    actualCompMinor: input.vrsCompMinor,\n    monthlySalaryMinor: input.lastDrawnWagesMinor,\n    completedYears: input.completedYears,\n    remainingMonthsToRetirement: input.remainingMonthsToRetirement,\n    separationType: input.separationType,\n    ceilingMinor: input.vrsCeilingMinor,\n  });\n\n  // Step 2: Total gross\n  const totalGrossMinor =\n    input.noticeBuyoutMinor +\n    input.leaveEncashmentGrossMinor +\n    input.gratuityGrossMinor +\n    input.retrenchmentCompMinor +\n    input.vrsCompMinor +\n    input.arrearsMinor;\n\n  // Step 3: Total exempt\n  const totalExemptMinor =\n    gratuityExemption.exemptMinor +\n    leaveEncashExemption.exemptMinor +\n    (retrenchmentExemption?.exemptMinor ?? 0n) +\n    (vrsExemption?.exemptMinor ?? 0n);\n\n  // Step 4: Total taxable on separation\n  // Notice buyout and arrears are fully taxable (salary income u/s 17(1))\n  const totalTaxableOnSeparationMinor =\n    input.noticeBuyoutMinor +\n    input.arrearsMinor +\n    gratuityExemption.taxableMinor +\n    leaveEncashExemption.taxableMinor +\n    (retrenchmentExemption?.taxableMinor ?? 0n) +\n    (vrsExemption?.taxableMinor ?? 0n);\n\n  // Step 5: Annual taxable income for the FY\n  const totalSalaryIncomeMinor = input.salaryYtdMinor + totalTaxableOnSeparationMinor;\n  const stdDed = BigInt(stdDeduction(input.taxRegime, input.fyStartYear)) * 100n; // convert rupees to paise\n  const chapterViA = input.taxRegime === \"old\"\n    ? input.deductions80cMinor + input.deductions80dMinor + input.otherDeductionsMinor\n    : 0n; // New regime: no Ch VI-A deductions\n\n  let annualTaxableMinor = totalSalaryIncomeMinor - stdDed - chapterViA;\n  if (annualTaxableMinor <"+" 0n) annualTaxableMinor = 0n;\n\n  // Step 6: Compute annual tax (convert paise to rupees for the engine, then back)\n  const taxableRupees = Math.round(Math.max(0, Number(annualTaxableMinor) / 100) / 10) * 10; // Sec 288A rounding\n  const taxResult = computeTax(taxableRupees, input.taxRegime, input.fyStartYear);\n  const annualTaxMinor = BigInt(taxResult.totalTax) * 100n;\n\n  // Step 7: TDS on separation = annual tax − YTD TDS\n  let tdsOnSeparationMinor = annualTaxMinor - input.tdsYtdMinor;\n  if (tdsOnSeparationMinor <"+" 0n) tdsOnSeparationMinor = 0n;\n\n  // Step 8: Net payable = total gross − TDS deducted on F&F\n  const netPayableMinor = totalGrossMinor - tdsOnSeparationMinor;\n\n  return {\n    gratuityExemption,\n    leaveEncashExemption,\n    retrenchmentExemption,\n    vrsExemption,\n    totalGrossMinor,\n    totalExemptMinor,\n    totalTaxableOnSeparationMinor,\n    annualTaxableMinor,\n    annualTaxMinor,\n    tdsAlreadyDeductedMinor: input.tdsYtdMinor,\n    tdsOnSeparationMinor,\n    netPayableMinor,\n  };\n}\n"},"services/workflow-service/src/modules/decisions/domain.ts":{"language":"typescript","mutants":[{"id":"818","mutatorName":"BlockStatement","replacement":"{}","statusReason":"Cannot read properties of undefined (reading 'matched')","status":"Killed","static":false,"testsCompleted":1,"killedBy":["120"],"coveredBy":["120","121","122","123","124","125","126","127","128","129","130","131","132","133","134","135","136","137","138","139","140","141","142"],"location":{"end":{"column":2,"line":71},"start":{"column":15,"line":53}}},{"id":"819","mutatorName":"ArrayDeclaration","replacement":"[\"Stryker was here\"]","statusReason":"Cannot read properties of undefined (reading 'outputs')","status":"Killed","static":false,"testsCompleted":1,"killedBy":["120"],"coveredBy":["120","121","122","123","124","125","126","127","128","129","130","131","132","133","134","135","136","137","138","139","140","141","142"],"location":{"end":{"column":38,"line":54},"start":{"column":36,"line":54}}},{"id":"820","mutatorName":"ConditionalExpression","replacement":"false","statusReason":"expected false to be true // Object.is equality","status":"Killed","static":false,"testsCompleted":1,"killedBy":["120"],"coveredBy":["120","121","122","123","124","125","126","127","128","129","130","131","132","133","134","135","136","137","138","139","140","141","142"],"location":{"end":{"column":41,"line":56},"start":{"column":19,"line":56}}},{"id":"822","mutatorName":"EqualityOperator","replacement":"i >= table.rules.length","statusReason":"expected false to be true // Object.is equality","status":"Killed","static":false,"testsCompleted":1,"killedBy":["120"],"coveredBy":["120","121","122","123","124","125","126","127","128","129","130","131","132","133","134","135","136","137","138","139","140","141","142"],"location":{"end":{"column":41,"line":56},"start":{"column":19,"line":56}}},{"id":"821","mu "string\" | \"number\" | \"boolean\";\n}\n\nexport interface DecisionOutput {\n  key: string;\n  label: string;\n  type: \"string\" | \"number\" | \"boolean\";\n  defaultValue?: unknown;\n}\n\nexport interface DecisionRule {\n  inputs: Record<"+"string, string>;\n  outputs: Record<"+"string, unknown>;\n  priority?: number;\n}\n\nexport interface DecisionTableDef {\n  hitPolicy: \"first\" | \"collect\" | \"unique\";\n  inputs: DecisionInput[];\n  outputs: DecisionOutput[];\n  rules: DecisionRule[];\n}\n\nexport interface EvalResult {\n  matched: boolean;\n  outputs: Record<"+"string, unknown>;\n  matchedRules: number[];\n  error?: string;\n}\n\n// ---------------------------------------------------------------------------\n// Evaluation\n// ---------------------------------------------------------------------------\n\n/**\n * Evaluate a decision table against a context object. Each rule's inputs are\n * condition expressions (e.g. `> 500000`, `== 'high'`, `in ['a','b']`) that\n * are evaluated by composing them as `{inputKey} {condition}` and running them\n * through the shared condition evaluator.\n */\nexport function evaluateDecisionTable(\n  table: DecisionTableDef,\n  context: Record<"+"string, unknown>,\n): EvalResult {\n  const matchedIndices: number[] = [];\n\n  for (let i = 0; i <"+" table.rules.length; i++) {\n    const rule = table.rules[i]!;\n    if (ruleMatches(rule, context)) {\n      matchedIndices.push(i);\n    }\n  }\n\n  switch (table.hitPolicy) {\n    case \"first\":\n      return resolveFirst(table, matchedIndices);\n    case \"collect\":\n      return resolveCollect(table, matchedIndices);\n    case \"unique\":\n      return resolveUnique(table, matchedIndices);\n  }\n}\n\n// ---------------------------------------------------------------------------\n// Helpers\n// ---------------------------------------------------------------------------\n\nfunction ruleMatches(rule: DecisionRule, context: Record<"+"string, unknown>): boolean {\n  for (const [inputKey, condition] of Object.entries(rule.inputs)) {\n    if (!condition || condition.trim() === \"\") continue;\n    // Compose as \"field condition\" so the condition evaluator can parse it\n    const expr = `${inputKey} ${condition}`;\n    if (!evaluateCondition(expr, context)) {\n      return false;\n    }\n  }\n  return true;\n}\n\nfunction buildDefaults(outputs: DecisionOutput[]): Record<"+"string, unknown> {\n  const defaults: Record<"+"string, unknown> = {};\n  for (const out of outputs) {\n    if (out.defaultValue !== undefined) {\n      defaults[out.key] = out.defaultValue;\n    }\n  }\n  return defaults;\n}\n\nfunction resolveFirst(table: DecisionTableDef, matchedIndices: number[]): EvalResult {\n  if (matchedIndices.length === 0) {\n    return {\n      matched: false,\n      outputs: buildDefaults(table.outputs),\n      matchedRules: [],\n    };\n  }\n  const firstIdx = matchedIndices[0]!;\n  return {\n    matched: true,\n    outputs: { ...table.rules[firstIdx]!.outputs },\n    matchedRules: [firstIdx],\n  };\n}\n\nfunction resolveCollect(table: DecisionTableDef, matchedIndices: number[]): EvalResult {\n  if (matchedIndices.length === 0) {\n    return {\n      matched: false,\n      outputs: buildDefaults(table.outputs),\n      matchedRules: [],\n    };\n  }\n  const merged: Record<"+"string, unknown> = {};\n  for (const idx of matchedIndices) {\n    Object.assign(merged, table.rules[idx]!.outputs);\n  }\n  return {\n    matched: true,\n    outputs: merged,\n    matchedRules: matchedIndices,\n  };\n}\n\nfunction resolveUnique(table: DecisionTableDef, matchedIndices: number[]): EvalResult {\n  if (matchedIndices.length === 1) {\n    const idx = matchedIndices[0]!;\n    return {\n      matched: true,\n      outputs: { ...table.rules[idx]!.outputs },\n      matchedRules: [idx],\n    };\n  }\n  if (matchedIndices.length === 0) {\n    return {\n      matched: false,\n      outputs: {},\n      matchedRules: [],\n      error: \"unique: no rules matched\",\n    };\n  }\n  return {\n    matched: false,\n    outputs: {},\n    matchedRules: matchedIndices,\n    error: `unique: ${matchedIndices.length} rules matched, expected exactly 1`,\n  };\n}\n"}},"schemaVersion":"1.0","thresholds":{"high":90,"low":70,"break":68},"testFiles":{"tests/quality-program/L10-domain-correctness/payroll-slip-mutants.test.ts":{"tests":[{"id":"0","name":"L10 payroll — zero-valued lines are omitted from the slip DA line is absent when the DA rate is 0"},{"id":"1","name":"L10 payroll — zero-valued lines are omitted from the slip DA line is present and exact when the rate is set"},{"id":"2","name":"L10 payroll — zero-valued lines are omitted from the slip HRA line is absent when the city slab yields 0 (basic 0)"},{"id":"3","name":"L10 payroll — zero-valued lines are omitted from the slip a raw component computing to 0 is skipped entirely"},{"id":"4","name":"L10 payroll — HRA slab by city class and DA tier (vs golden fixture) golden fixture is populated (guards against an empty case list)"},{"id":"5","name":"L10 payroll — HRA slab by city class and DA tier (vs golden fixture) X at DA 0% -> 24%"},{"id":"6","name":"L10 payroll — HRA slab by city class and DA tier (vs golden fixture) X at DA 49.99% -> 24%"},{"id":"7","name":"L10 payroll — HRA slab by city class and DA tier (vs golden fixture) X at DA 50% -> 27%"},{"id":"8","name":"L10 payroll — HRA slab by city class and DA tier (vs golden fixture) X at DA 100% -> 30%"},{"id":"9","name":"L10 payroll — HRA slab by city class and DA tier (vs golden fixture) Y at DA 0% -> 16%"},{"id":"10","name":"L10 payroll — HRA slab by city class and DA tier (vs golden fixture) Y at DA 50% -> 18%"},{"id":"11","name":"L10 payroll — HRA slab by city class and DA tier (vs golden fixture) Y at DA 100% -> 20%"},{"id":"12","name":"L10 payroll — HRA slab by city class and DA tier (vs golden fixture) Z at DA 0% -> 8%"},{"id":"13","name":"L10 payroll — HRA slab by city class and DA tier (vs golden fixture) Z at DA 50% -> 9%"},{"id":"14","name":"L10 payroll — HRA slab by city class and DA tier (vs golden fixture) Z at DA 100% -> 10%"},{"id":"15","name":"L10 payroll — HRA slab by city class and DA tier (vs golden fixture) HRA amount equals slab pct of basic"},{"id":"16","name":"L10 payroll — ESI applies only at or below the Rs 21,000 gross ceiling employee ESI is 0.75% of gross when gross <"+"= cap"},{"id":"17","name":"L10 payroll — ESI applies only at or below the Rs 21,000 gross ceiling employer ESI is 3.25% of gross when gross <"+"= cap"},{"id":"18","name":"L10 payroll — ESI applies only at or below the Rs 21,000 gross ceiling ESI is charged at exactly the cap (boundary is inclusive)"},{"id":"19","name":"L10 payroll — ESI applies only at or below the Rs 21,000 gross ceiling ESI is zero one paise above the cap"},{"id":"20","name":"L10 payroll — professional tax line PT line is omitted when ptMinor is 0"},{"id":"21","name":"L10 payroll — professional tax line PT line is present and rounded to the rupee when set"},{"id":"22","name":"L10 payroll — EPF 12% of (basic+DA) capped at the Rs 15,000 wage ceiling below the ceiling, PF is 12% of basic+DA"},{"id":"23","name":"L10 payroll — EPF 12% of (basic+DA) capped at the Rs 15,000 wage ceiling above the ceiling, PF is 12% of the ceiling, not of actual pay"},{"id":"24","name":"L10 payroll — EPF 12% of (basic+DA) capped at the Rs 15,000 wage ceiling at exactly the ceiling, PF is 12% of the ceiling"},{"id":"25","name":"L10 payroll — declared extra income raises annual taxable income perquisites add to taxable income"},{"id":"26","name":"L10 payroll — declared extra income raises annual taxable income previous-employer salary adds to taxable income (Sec 192(2))"},{"id":"27","name":"L10 payroll — declared extra income raises annual taxable income other-sources income adds to taxable income"},{"id":"28","name":"L10 payroll — declared extra income raises annual taxable income all three accumulate additively"},{"id":"29","name":"L10 payroll — declared extra income raises annual taxable income annual gross is 12x the monthly gross (not a division)"},{"id":"30","name":"L10 payroll — old regime deductions (previously uncovered) old regime applies a Rs 50,000 standard deduction, new regime Rs 75,000"},{"id":"31","name":"L10 payroll — old regime deductions (previously uncovered) 80C reduces taxable income and is capped at Rs 1,50,000"},{"id":"32","name":"L10 payroll — old regime deductions (previously uncovered) 80D reduces taxable income and is capped at Rs 75,000"},{"id":"33","name":"L10 payroll — old regime deductions (previously uncovered) PT is deductible in the old regime (12 months' worth)"},{"id":"34","name":"L10 payroll — old regime deductions (previously uncovered) Sec 10(13A) HRA exemption is the least of the three statutory limits"},{"id":"35","name":"L10 payroll — old regime deductions (previously uncovered) a low rent yields a smaller exemption (limit b binds)"},{"id":"36","name":"L10 payroll — old regime deductions (previously uncovered) rent below 10% of salary yields no exemption (b clamps at 0)"},{"id":"37","name":"L10 payroll — protected net floor caps recovery and carries the rest recovery within headroom is applied in full with no carry-forward"},{"id":"38","name":"L10 payroll — protected net floor caps recovery and carries the rest recovery exceeding headroom is trimmed and the remainder carried forward"},{"id":"39","name":"L10 payroll — protected net floor caps recovery and carries the rest net pay never falls below the protected floor"},{"id":"40","name":"L10 payroll — protected net floor caps recovery and carries the rest a fully-trimmed recovery line is dropped from the slip"},{"id":"41","name":"L10 payroll — protected net floor caps recovery and carries the rest statutory deductions are NOT subject to the floor"},{"id":"42","name":"L10 payroll — gross/deduction/net conservation gross equals the sum of earning lines"},{"id":"43","name":"L10 payroll — gross/deduction/net conservation net equals gross minus total deductions"},{"id":"44","name":"L10 payroll — gross/deduction/net conservation raw components route to earnings or deductions by type"},{"id":"45","name":"L10 payroll — gross/deduction/net conservation pctOfBasic takes precedence over fixedMinor when both are present"},{"id":"46","name":"L10 payroll — gross/deduction/net conservation fixedMinor is used when pctOfBasic is absent or zero"},{"id":"47","name":"L10 payroll — gross/deduction/net conservation BASIC/DA/HRA raw components are ignored (handled ahead of the loop)"},{"id":"48","name":"L10 payroll — roundRupee is round-half-up and sign-symmetric roundRupee(0) = 0"},{"id":"49","name":"L10 payroll — roundRupee is round-half-up and sign-symmetric roundRupee(49) = 0"},{"id":"50","name":"L10 payroll — roundRupee is round-half-up and sign-symmetric roundRupee(50) = 100"},{"id":"51","name":"L10 payroll — roundRupee is round-half-up and sign-symmetric roundRupee(51) = 100"},{"id":"52","name":"L10 payroll — roundRupee is round-half-up and sign-symmetric roundRupee(149) = 100"},{"id":"53","name":"L10 payroll — roundRupee is round-half-up and sign-symmetric roundRupee(150) = 200"},{"id":"54","name":"L10 payroll — roundRupee is round-half-up and sign-symmetric roundRupee(100) = 100"},{"id":"55","name":"L10 payroll — roundRupee is round-half-up and sign-symmetric negative amounts round symmetrically"}],"source":"/**\n * L10 — Domain Correctness: payroll slip assembly (mutation burn-down)\n *\n * WHY THIS FILE EXISTS\n * --------------------\n * After the mutation-runner scope was fixed, `payroll/domain.ts` scored 37.4%\n * with 176 surviving + 93 no-coverage mutants — 269 places the salary engine can\n * be altered with no test failing. `scripts/ci/mutation-survivors.mjs` grouped\n * them; these are the semantically dangerous ones, not label strings:\n *\n *   L202-203  ESI cap boundary (`gross <"+"= ESI_CAP`) and both ESI rates.\n *             `grossMinor * 75n * 10000n` and `/ 325n` both survived — the rate\n *             arithmetic was entirely unasserted.\n *   L206      `pt > 0n` guard — a zero PT line being emitted went unnoticed.\n *   L210      `grossMinor * 12n` annualisation; `/ 12n` survived.\n *   L218      `perq + prevEmpSal + otherSrc` — a MINUS survived, i.e. declared\n *             extra income could be subtracted from taxable pay and no test knew.\n *   L220-224  The whole OLD-REGIME branch was NoCoverage: HRA exemption, 80C/80D\n *             caps, PT deduction.\n *   L158-170  Zero-valued components must be OMITTED from the slip; the guards\n *             `daMinor > 0n`, `hraMinor > 0n`, `amt === 0n` were unasserted.\n *\n * Every expected value below is computed BY HAND from the statutory rule and the\n * documented constants, not read back from the implementation:\n *   roundRupee(x) = floor((x + 50) / 100) * 100      (round-half-up to rupee)\n *   pct(base, p)  = roundRupee(base * p / 100)\n *   PF 12% of (basic+DA) capped at wage ceiling 1_500_000 paise (Rs 15,000)\n *   ESI employee 0.75%, employer 3.25%, only while gross <"+"= 2_100_000 (Rs 21,000)\n *   HRA slab % of basic by city class and DA tier (DA>=100% / >=50% / below):\n *     X 30/27/24   Y 20/18/16   Z 10/9/8\n */\nimport { describe, it, expect, beforeAll } from \"vitest\";\nimport { resolve } from \"node:path\";\nimport { readFileSync } from \"node:fs\";\n\nconst REPO_ROOT = resolve(__dirname, \"../../..\");\n\ntype Component = { code: string; name: string; type: \"earning\" | \"deduction\"; amountMinor: bigint };\ntype SlipResult = {\n  grossMinor: bigint;\n  totalDeductionsMinor: bigint;\n  netPayMinor: bigint;\n  daMinor: bigint;\n  hraMinor: bigint;\n  earnings: Component[];\n  deductions: Component[];\n  pfEmployeeMinor: bigint;\n  esiMinor: bigint;\n  esiEmployerMinor: bigint;\n  ptMinor: bigint;\n  tdsMinor: bigint;\n  annualTaxableMinor: bigint;\n  recoveryCarryForwardMinor: bigint;\n  negativeNet: boolean;\n};\n\nlet computeSlip: (input: Record<"+"string, unknown>) => SlipResult;\nlet hraSlabPct: (cityClass: string, daRateBps: bigint) => bigint;\nlet roundRupee: (x: bigint) => bigint;\n\nconst FY = 2025;\n\nbeforeAll(async () => {\n  const domain = await import(`${REPO_ROOT}/services/payroll-service/src/modules/payroll/domain.js`);\n  computeSlip = domain.computeSlip;\n  hraSlabPct = domain.hraSlabPct;\n  roundRupee = domain.roundRupee;\n\n  // The tax engine throws UnconfiguredFyError unless slabs are registered.\n  // FY2025-26 new-regime slabs + the old-regime slabs used by the old-regime\n  // assertions below.\n  const { registerTaxConfig } = await import(\n    `${REPO_ROOT}/services/payroll-service/src/modules/tax/engine.js`\n  );\n  registerTaxConfig(\"new\", FY, {\n    slabs: [\n      { from: 0, to: 400000, rate: 0 },\n      { from: 400000, to: 800000, rate: 0.05 },\n      { from: 800000, to: 1200000, rate: 0.10 },\n      { from: 1200000, to: 1600000, rate: 0.15 },\n      { from: 1600000, to: 2000000, rate: 0.20 },\n      { from: 2000000, to: 2400000, rate: 0.25 },\n      { from: 2400000, to: Infinity, rate: 0.30 },\n    ],\n    stdDeduction: 75000,\n    rebateIncomeCap: 1200000,\n    rebateMax: 60000,\n    surchargeBands: [{ above: 5000000, rate: 0.10 }, { above: 10000000, rate: 0.15 }],\n  });\n  registerTaxConfig(\"old\", FY, {\n    slabs: [\n      { from: 0, to: 250000, rate: 0 },\n      { from: 250000, to: 500000, rate: 0.05 },\n      { from: 500000, to: 1000000, rate: 0.20 },\n      { from: 1000000, to: Infinity, rate: 0.30 },\n    ],\n    stdDeduction: 50000,\n    rebateIncomeCap: 500000,\n    rebateMax: 12500,\n    surchargeBands: [{ above: 5000000, rate: 0.10 }, { above: 10000000, rate: 0.15 }],\n  });\n});\n\nconst codes = (list: Component[]) => list.map((c) => c.code);\nconst amountOf = (list: Component[], code: string) =>\n  list.find((c) => c.code === code)?.amountMinor;\n\n// ── Zero-valued components must be OMITTED (L158, L162, L170) ────────────────\n\ndescribe(\"L10 payroll — zero-valued lines are omitted from the slip\", () => {\n  it(\"DA line is absent when the DA rate is 0\", () => {\n    const r = computeSlip({ basicMinor: 5_000_000n, daRateBps: 0n, cityClass: \"Z\", taxRegime: \"new\", fyStartYear: FY });\n    expect(r.daMinor).toBe(0n);\n    expect(codes(r.earnings)).not.toContain(\"DA\");\n  });\n\n  it(\"DA line is present and exact when the rate is set\", () => {\n    // basic 50,000.00 = 5_000_000 paise; DA 53% => 5_000_000 * 5300 / 10000\n    //   = 2_650_000 paise, already whole rupees => 2_650_000\n    const r = computeSlip({ basicMinor: 5_000_000n, daRateBps: 5300n, cityClass: \"Z\", taxRegime: \"new\", fyStartYear: FY });\n    expect(r.daMinor).toBe(2_650_000n);\n    expect(amountOf(r.earnings, \"DA\")).toBe(2_650_000n);\n  });\n\n  it(\"HRA line is absent when the city slab yields 0 (basic 0)\", () => {\n    const r = computeSlip({ basicMinor: 0n, daRateBps: 0n, cityClass: \"X\", taxRegime: \"new\", fyStartYear: FY });\n    expect(r.hraMinor).toBe(0n);\n    expect(codes(r.earnings)).not.toContain(\"HRA\");\n  });\n\n  it(\"a raw component computing to 0 is skipped entirely\", () => {\n    const r = computeSlip({\n      basicMinor: 5_000_000n,\n      daRateBps: 0n,\n      cityClass: \"Z\",\n      taxRegime: \"new\",\n      fyStartYear: FY,\n      rawComponents: [\n        { code: \"ZEROFIX\", name: \"Zero Fixed\", type: \"earning\", fixedMinor: 0n },\n        { code: \"REALFIX\", name: \"Real Fixed\", type: \"earning\", fixedMinor: 100_000n },\n      ],\n    });\n    expect(codes(r.earnings)).not.toContain(\"ZEROFIX\");\n    expect(amountOf(r.earnings, \"REALFIX\")).toBe(100_000n);\n  });\n});\n\n// ── HRA slab table (L162 + hraSlabPct tiers) ─────────────────────────────────\n\ndescribe(\"L10 payroll — HRA slab by city class and DA tier (vs golden fixture)\", () => {\n  // Driven from goldens/payroll-goldens.json so the fixture cannot silently\n  // contradict the implementation again. It previously recorded X=27% at DA<"+"25%\n  // with class names A/B/C — both wrong, and unasserted, so it went unnoticed.\n  const golden = JSON.parse(\n    readFileSync(resolve(__dirname, \"../goldens/payroll-goldens.json\"), \"utf8\"),\n  ) as { hra_slab: { cases: Array<"+"{ cityClass: string; daRateBps: number; expectedPct: number }> } };\n\n  it(\"golden fixture is populated (guards against an empty case list)\", () => {\n    expect(golden.hra_slab.cases.length).toBeGreaterThanOrEqual(9);\n  });\n\n  for (const c of golden.hra_slab.cases) {\n    it(`${c.cityClass} at DA ${c.daRateBps / 100}% -> ${c.expectedPct}%`, () => {\n      expect(hraSlabPct(c.cityClass, BigInt(c.daRateBps))).toBe(BigInt(c.expectedPct));\n    });\n  }\n\n  it(\"HRA amount equals slab pct of basic\", () => {\n    // basic 40,000.00; X class, DA 0 => 24% => 4_000_000 * 24 / 100 = 960_000\n    const r = computeSlip({ basicMinor: 4_000_000n, daRateBps: 0n, cityClass: \"X\", taxRegime: \"new\", fyStartYear: FY });\n    expect(r.hraMinor).toBe(960_000n);\n  });\n});\n\n// ── ESI cap boundary and both rates (L202, L203) ─────────────────────────────\n\ndescribe(\"L10 payroll — ESI applies only at or below the Rs 21,000 gross ceiling\", () => {\n  /** Build a slip whose gross is exactly `basic` by zeroing DA and HRA (Z class needs basic>0, so use rawComponents-free Z with pct 8% — instead use cityClass Z and subtract). */\n  function slipWithGross(basicMinor: bigint) {\n    // cityClass Z at DA 0 adds 8% HRA, so gross = basic * 1.08. Choose basic so\n    // the arithmetic stays exact and assert against the computed gross.\n    return computeSlip({\n      basicMinor,\n      daRateBps: 0n,\n      cityClass: \"Z\",\n      pensionScheme: \"EPF\",\n      taxRegime: \"new\",\n      fyStartYear: FY,\n    });\n  }\n\n  it(\"employee ESI is 0.75% of gross when gross <"+"= cap\", () => {\n    // basic 1,000,000 paise (Rs 10,000) + 8% HRA 80_000 => gross 1_080_000 <"+"= 2_100_000\n    const r = slipWithGross(1_000_000n);\n    expect(r.grossMinor).toBe(1_080_000n);\n    // 1_080_000 * 75 / 10000 = 8_100 -> roundRupee(8_100) = 8_100\n    expect(r.esiMinor).toBe(roundRupee((1_080_000n * 75n) / 10000n));\n    expect(r.esiMinor).toBe(8_100n);\n  });\n\n  it(\"employer ESI is 3.25% of gross when gross <"+"= cap\", () => {\n    const r = slipWithGross(1_000_000n);\n    // 1_080_000 * 325 / 10000 = 35_100\n    expect(r.esiEmployerMinor).toBe(35_100n);\n  });\n\n  it(\"ESI is charged at exactly the cap (boundary is inclusive)\", () => {\n    // Need gross == 2_100_000 exactly. basic * 1.08 = 2_100_000 is not integral,\n    // so drive gross with a fixed earning and no HRA (basic 0 => HRA 0).\n    const r = computeSlip({\n      basicMinor: 0n,\n      daRateBps: 0n,\n      cityClass: \"Z\",\n      taxRegime: \"new\",\n      fyStartYear: FY,\n      rawComponents: [{ code: \"SPECIAL\", name: \"Special\", type: \"earning\", fixedMinor: 2_100_000n }],\n    });\n    expect(r.grossMinor).toBe(2_100_000n);\n    // At the cap ESI still applies: 2_100_000 * 75 / 10000 = 15_750 -> round -> 15_800\n    expect(r.esiMinor).toBe(roundRupee((2_100_000n * 75n) / 10000n));\n    expect(r.esiMinor).toBeGreaterThan(0n);\n  });\n\n  it(\"ESI is zero one paise above the cap\", () => {\n    const r = computeSlip({\n      basicMinor: 0n,\n      daRateBps: 0n,\n      cityClass: \"Z\",\n      taxRegime: \"new\",\n      fyStartYear: FY,\n      rawComponents: [{ code: \"SPECIAL\", name: \"Special\", type: \"earning\", fixedMinor: 2_100_100n }],\n    });\n    expect(r.grossMinor).toBe(2_100_100n);\n    expect(r.esiMinor).toBe(0n);\n    expect(r.esiEmployerMinor).toBe(0n);\n  });\n});\n\n// ── Professional tax guard (L206) ────────────────────────────────────────────\n\ndescribe(\"L10 payroll — professional tax line\", () => {\n  it(\"PT line is omitted when ptMinor is 0\", () => {\n    const r = computeSlip({ basicMinor: 5_000_000n, ptMinor: 0n, cityClass: \"Z\", taxRegime: \"new\", fyStartYear: FY });\n    expect(r.ptMinor).toBe(0n);\n    expect(codes(r.deductions)).not.toContain(\"PT\");\n  });\n\n  it(\"PT line is present and rounded to the rupee when set\", () => {\n    const r = computeSlip({ basicMinor: 5_000_000n, ptMinor: 20_049n, cityClass: \"Z\", taxRegime: \"new\", fyStartYear: FY });\n    // roundRupee(20_049) = ((20_049 + 50) / 100) * 100 = 20_000\n    expect(r.ptMinor).toBe(20_000n);\n    expect(amountOf(r.deductions, \"PT\")).toBe(20_000n);\n  });\n});\n\n// ── EPF wage ceiling (L193-195) ──────────────────────────────────────────────\n\ndescribe(\"L10 payroll — EPF 12% of (basic+DA) capped at the Rs 15,000 wage ceiling\", () => {\n  it(\"below the ceiling, PF is 12% of basic+DA\", () => {\n    // basic 1_000_000 + DA 0 => pensionBase 1_000_000 <"+"= 1_500_000\n    // 12% => 120_000\n    const r = computeSlip({ basicMinor: 1_000_000n, daRateBps: 0n, cityClass: \"Z\", pensionScheme: \"EPF\", taxRegime: \"new\", fyStartYear: FY });\n    expect(r.pfEmployeeMinor).toBe(120_000n);\n  });\n\n  it(\"above the ceiling, PF is 12% of the ceiling, not of actual pay\", () => {\n    // basic 5_000_000 + DA 0 => pensionBase 5_000_000 > 1_500_000 => use cap\n    // 12% of 1_500_000 = 180_000\n    const r = computeSlip({ basicMinor: 5_000_000n, daRateBps: 0n, cityClass: \"Z\", pensionScheme: \"EPF\", taxRegime: \"new\", fyStartYear: FY });\n    expect(r.pfEmployeeMinor).toBe(180_000n);\n  });\n\n  it(\"at exactly the ceiling, PF is 12% of the ceiling\", () => {\n    const r = computeSlip({ basicMinor: 1_500_000n, daRateBps: 0n, cityClass: \"Z\", pensionScheme: \"EPF\", taxRegime: \"new\", fyStartYear: FY });\n    expect(r.pfEmployeeMinor).toBe(180_000n);\n  });\n});\n\n// ── Declared extra income must INCREASE taxable pay (L218) ───────────────────\n\ndescribe(\"L10 payroll — declared extra income raises annual taxable income\", () => {\n  const base = {\n    basicMinor: 5_000_000n,\n    daRateBps: 0n,\n    cityClass: \"Z\" as const,\n    pensionScheme: \"EPF\" as const,\n    taxRegime: \"new\" as const,\n    fyStartYear: FY,\n  };\n\n  it(\"perquisites add to taxable income\", () => {\n    const without = computeSlip({ ...base });\n    const withPerq = computeSlip({ ...base, declaration: { perquisitesMinor: 10_000_000n } });\n    // A surviving MINUS mutant here would make this DECREASE.\n    expect(withPerq.annualTaxableMinor).toBe(without.annualTaxableMinor + 10_000_000n);\n  });\n\n  it(\"previous-employer salary adds to taxable income (Sec 192(2))\", () => {\n    const without = computeSlip({ ...base });\n    const withPrev = computeSlip({ ...base, declaration: { prevEmployerSalaryMinor: 25_000_000n } });\n    expect(withPrev.annualTaxableMinor).toBe(without.annualTaxableMinor + 25_000_000n);\n  });\n\n  it(\"other-sources income adds to taxable income\", () => {\n    const without = computeSlip({ ...base });\n    const withOther = computeSlip({ ...base, declaration: { otherSourcesIncomeMinor: 5_000_000n } });\n    expect(withOther.annualTaxableMinor).toBe(without.annualTaxableMinor + 5_000_000n);\n  });\n\n  it(\"all three accumulate additively\", () => {\n    const without = computeSlip({ ...base });\n    const all = computeSlip({\n      ...base,\n      declaration: {\n        perquisitesMinor: 1_000_000n,\n        prevEmployerSalaryMinor: 2_000_000n,\n        otherSourcesIncomeMinor: 3_000_000n,\n      },\n    });\n    expect(all.annualTaxableMinor).toBe(without.annualTaxableMinor + 6_000_000n);\n  });\n\n  it(\"annual gross is 12x the monthly gross (not a division)\", () => {\n    // new regime: taxable = gross*12 + extras - stdDeduction(75_000 rupees) - LTC\n    const r = computeSlip({ ...base });\n    const expected = r.grossMinor * 12n - 7_500_000n;\n    expect(r.annualTaxableMinor).toBe(expected > 0n ? expected : 0n);\n  });\n});\n\n// ── Old regime branch — was entirely NoCoverage (L220-L228) ──────────────────\n\ndescribe(\"L10 payroll — old regime deductions (previously uncovered)\", () => {\n  const base = {\n    basicMinor: 5_000_000n,\n    daRateBps: 0n,\n    cityClass: \"X\"
