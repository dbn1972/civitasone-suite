  # ─────────────────────────── evidence ───────────────────────────
  /v1/court/cases/{id}/evidence:
    post:
      tags: [evidence]
      summary: Submit a piece of evidence/exhibit on a case
      x-roles: [registrar, court_admin, advocate, super_admin]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [caseId, title]
              properties:
                caseId: { type: string, format: uuid }
                filingId: { type: string, format: uuid }
                exhibitNumber: { type: string }
                title: { type: string }
                evidenceType: { type: string }
                storageRef: { type: string }
                contentHash: { type: string, pattern: "^[0-9a-fA-F]{64}$" }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Accepted' } } } }
    get:
      tags: [evidence]
      summary: List a case's evidence/exhibits
      x-roles: [registrar, court_admin, advocate, court_clerk, super_admin]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Evidence' } }
                  count: { type: integer }
                  source: { type: string, enum: [db] }
  /v1/court/evidence/{id}/rule:
    patch:
      tags: [evidence]
      summary: Rule on an exhibit (admit | reject | mark) — bench only
      x-roles: [judge, court_admin, super_admin]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ruling, expectedVersion]
              properties:
                ruling: { type: string, enum: [admitted, rejected, marked] }
                rulingRemarks: { type: string }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Accepted' } } } }
  # ─────────────────────────── certified-copy ───────────────────────────
  /v1/court/cases/{id}/certified-copies:
    post:
      tags: [certified-copy]
      summary: Apply for a certified copy on a case
      x-roles: [registrar, court_admin, court_clerk, super_admin]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [caseId]
              properties:
                caseId: { type: string, format: uuid }
                orderId: { type: string, format: uuid }
                documentRef: { type: string }
                applicantName: { type: string, description: "PII, AES-256-GCM at rest" }
                copiesCount: { type: integer, default: 1 }
                urgent: { type: boolean }
                feeMinorHint: { oneOf: [ { type: string }, { type: number } ] }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Accepted' } } } }
    get:
      tags: [certified-copy]
      summary: List a case's certified copies (applicantName masked per role)
      x-roles: [registrar, court_admin, court_clerk, super_admin, judge]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CertifiedCopy' } }
                  count: { type: integer }
                  source: { type: string, enum: [db] }
                  piiRevealed: { type: boolean }
  /v1/court/certified-copies/{id}:
    get:
      tags: [certified-copy]
      summary: Get a single certified copy (applicantName masked per role)
      x-roles: [registrar, court_admin, court_clerk, super_admin, judge]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: '#/components/schemas/CertifiedCopy' }
                  source: { type: string, enum: [db] }
                  piiRevealed: { type: boolean }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /v1/court/certified-copies/{id}/status:
    patch:
      tags: [certified-copy]
      summary: Transition a certified copy (advance / issue / reject)
      x-roles: [registrar, court_admin, super_admin]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target, expectedVersion]
              properties:
                target: { type: string, enum: [fee_paid, prepared, issued, rejected] }
                deliveryMode: { type: string }
                remarks: { type: string }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Accepted' } } } }
  # ─────────────────────────── case-parcel ───────────────────────────
  /v1/court/cases/{id}/parcels:
    post:
      tags: [case-parcel]
      summary: Attach a parcel to a case
      x-roles: [registrar, court_admin, super_admin]
