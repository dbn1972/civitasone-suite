      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [surveyNumber, village]
              properties:
                surveyNumber: { type: string }
                khasraNumber: { type: string }
                khataNumber: { type: string }
                village: { type: string }
                tehsil: { type: string }
                district: { type: string }
                areaSqm: { type: integer, minimum: 0 }
                subjectType: { type: string }
                ownershipRef: { type: string }
                remarks: { type: string }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Accepted' } } } }
    get:
      tags: [case-parcel]
      summary: List a case's parcels
      x-roles: [registrar, court_admin, super_admin, judge, court_clerk]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Parcel' } }
                  count: { type: integer }
                  source: { type: string, enum: [db] }
  /v1/court/parcels/{id}:
    patch:
      tags: [case-parcel]
      summary: Update / soft-detach a parcel
      x-roles: [registrar, court_admin, super_admin]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                areaSqm: { type: integer, minimum: 0 }
                ownershipRef: { type: string }
                remarks: { type: string }
                active: { type: boolean }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Accepted' } } } }
  /v1/court/parcels/search:
    get:
      tags: [case-parcel]
      summary: Cross-case reverse lookup by survey number
      x-roles: [registrar, court_admin, super_admin, judge, court_clerk]
      parameters:
        - { name: surveyNumber, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Parcel' } }
                  count: { type: integer }
                  source: { type: string, enum: [db] }
  # ─────────────────────────── config-registry ───────────────────────────
  /v1/court/config:
    post:
      tags: [config-registry]
      summary: Set (create or version-guarded update) a config entry
      x-roles: [court_admin, super_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [namespace, configKey, value]
              properties:
                namespace: { type: string }
                configKey: { type: string }
                value: {}
                label: { type: string }
                description: { type: string }
                sortOrder: { type: integer }
                effectiveFrom: { type: string }
                effectiveTo: { type: string }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Accepted' } } } }
  /v1/court/config/{namespace}:
    get:
      tags: [config-registry]
      summary: List a namespace's entries (?active=true filters)
