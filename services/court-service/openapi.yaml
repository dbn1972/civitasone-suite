      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: active, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ConfigEntry' } }
                  count: { type: integer }
                  source: { type: string, enum: [db] }
