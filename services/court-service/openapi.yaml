      parameters:
        - { name: namespace, in: query, required: true, schema: { type: string } }
        - { name: key, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: '#/components/schemas/ConfigEntry' }
                  source: { type: string, enum: [db] }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /v1/court/config/presets/{preset}:
    post:
      tags: [config-registry]
      summary: Apply a vertical preset (revenue | consumer | tribunal)
      x-roles: [court_admin, super_admin]
      parameters: [ { name: preset, in: path, required: true, schema: { type: string } } ]
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Accepted' } } } }
  /v1/court/config/{id}/deactivate:
    patch:
      tags: [config-registry]
      summary: Deactivate (soft-retire) a config entry by id
      x-roles: [court_admin, super_admin]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties: { expectedVersion: { type: integer, minimum: 1 } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Accepted' } } } }
