      responses:
        '200': { description: PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /v1/court/certified-copies/{id}/pdf:
    get:
      tags: [court-documents]
      summary: Render a certified copy of an order as application/pdf (no applicant PII printed)
      x-roles: [registrar, court_admin, super_admin, judge, court_clerk]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  # ─────────────────────────── public-lookup ───────────────────────────
  /v1/court/public-directory:
    post:
      tags: [public-lookup]
      summary: Publish a public-directory establishment (authenticated, admin)
      x-roles: [court_admin, super_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [establishmentCode, courtName, publicSlug]
              properties:
                establishmentCode: { type: string }
                cnrPrefix: { type: string }
                courtName: { type: string }
                publicSlug: { type: string, pattern: "^[a-z0-9-]{2,64}$" }
                accessMode: { type: string, enum: [otp, captcha, open] }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Accepted' } } } }
  /v1/court/public/establishments:
    get:
      tags: [public-lookup]
      summary: Public directory listing
      x-public: true
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Establishment' } }
                  count: { type: integer }
                  source: { type: string, enum: [public] }
  /v1/court/public/case-status/otp:
    post:
      tags: [public-lookup]
      summary: Request an OTP for a public case-status lookup
      x-public: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile]
              properties: { mobile: { type: string } }
      responses:
        '200':
          description: OK (devOtp present only when NODE_ENV=test)
          content:
            application/json:
              schema:
                type: object
                properties:
                  challengeId: { type: string, format: uuid }
                  expiresInSec: { type: integer }
                  devOtp: { type: string, description: "test-only" }
        '429': { $ref: '#/components/responses/ErrorResponse' }
  /v1/court/public/case-status:
    post:
      tags: [public-lookup]
      summary: Public case-status lookup (per-court configurable gate — otp|captcha|open)
      x-public: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cnr: { type: string }
                slug: { type: string }
                challengeId: { type: string, format: uuid }
                otp: { type: string, pattern: "^\\d{6}$" }
                captchaToken: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  case: { $ref: '#/components/schemas/PublicDocket' }
                  accessMode: { type: string, enum: [otp, captcha, open] }
                  source: { type: string, enum: [public] }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '429': { $ref: '#/components/responses/ErrorResponse' }
