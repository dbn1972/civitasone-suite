openapi: 3.0.3
info:
  title: CivitasOne court-service API
  version: "1.0.0"
  description: >-
    Machine-readable cross-layer contract for the CivitasOne court-management
    microservice. Extracted from src/modules/*/routes.ts + validators.ts and
    verified against the live service on http://127.0.0.1:3034, the
    court.* PostgreSQL schema, and the web consoles under web/*.html.
    73 endpoints across 19 modules. Write paths return 202 Accepted
    (command-bus) with an envelope { accepted, ... }; read paths return a
    tenant-scoped { items, count, source } or a single resource.
    x-public marks unauthenticated routes; x-roles lists the roles the
    route requires (requireRole = ANY-of).
servers:
  - url: http://127.0.0.1:3034
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorEnvelope:
      type: object
      description: Standard error shape. case-registry uses a flat variant
        (code,message,correlationId,retryable,fieldErrors); all other modules
        nest under `error`.
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
    Accepted:
      type: object
      description: 202 command-bus acknowledgement (fields vary per command,
        commonly id + accepted/status).
      additionalProperties: true
    Case:
      type: object
      description: court.cases row (Drizzle camelCase mapping).
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        cnrNumber: { type: string }
        caseType: { type: string }
        filingNumber: { type: [string, "null"] }
        filingDate: { type: string }
        title: { type: string }
        status: { type: string }
        stage: { type: string }
        courtId: { type: [string, "null"], format: uuid }
        benchId: { type: [string, "null"], format: uuid }
        disposalDate: { type: [string, "null"] }
        targetDisposalDate: { type: [string, "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
        createdBy: { type: [string, "null"] }
        updatedBy: { type: [string, "null"] }
        version: { type: integer }
    Court:
      type: object
      description: court.courts row.
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        name: { type: string }
        courtType: { type: string }
        jurisdiction: { type: [string, "null"] }
        establishmentCode: { type: [string, "null"] }
        parentCourtId: { type: [string, "null"], format: uuid }
        address: { type: [string, "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
        createdBy: { type: [string, "null"] }
        updatedBy: { type: [string, "null"] }
        version: { type: integer }
    Bench:
      type: object
      description: court.benches row.
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        courtId: { type: string, format: uuid }
        name: { type: string }
        presidingJudgeId: { type: [string, "null"], format: uuid }
        benchType: { type: [string, "null"] }
        version: { type: integer }
    Party:
      type: object
      description: >-
        court.case_parties row, PII masked per role. name_enc/address_enc/
        phone_enc/email_enc are AES-256-GCM columns that decrypt to cleartext
        on read; the route reveals name/address/phone/email in cleartext only
        to PII_PRIVILEGED_ROLES (judge, court_admin, super_admin), else
        name/address=null and phone/email masked. piiRevealed flags which.
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        partyRole: { type: string }
        name: { type: [string, "null"] }
        address: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"] }
        advocateName: { type: [string, "null"] }
        advocateBarId: { type: [string, "null"] }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    Hearing:
      type: object
      description: court.hearings row.
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        benchId: { type: [string, "null"], format: uuid }
        scheduledDate: { type: string }
        status: { type: string }
        nextDate: { type: [string, "null"] }
        purpose: { type: [string, "null"] }
        adjournmentReason: { type: [string, "null"] }
        version: { type: integer }
    Order:
      type: object
      description: court.orders row.
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        hearingId: { type: [string, "null"], format: uuid }
        orderType: { type: string }
        orderText: { type: [string, "null"] }
        signedBy: { type: [string, "null"] }
        dscSignature: { type: [string, "null"] }
        orderDate: { type: [string, "null"] }
        status: { type: string }
        approvedBy: { type: [string, "null"] }
        issuedAt: { type: [string, "null"] }
        recallReason: { type: [string, "null"] }
        version: { type: integer }
    Filing:
      type: object
      description: court.filings row (fee columns are integer minor units).
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        filingType: { type: string }
        filingFeeMinor: { type: integer }
        courtFeeMinor: { type: integer }
        status: { type: string }
        version: { type: integer }
    Evidence:
      type: object
      description: court.evidence row.
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        filingId: { type: [string, "null"], format: uuid }
        exhibitNumber: { type: [string, "null"] }
        title: { type: string }
        evidenceType: { type: [string, "null"] }
        storageRef: { type: [string, "null"] }
        contentHash: { type: [string, "null"] }
        status: { type: string }
        submittedBy: { type: [string, "null"] }
        rulingRemarks: { type: [string, "null"] }
        ruledBy: { type: [string, "null"] }
        ruledAt: { type: [string, "null"] }
        version: { type: integer }
    Notice:
      type: object
      description: >-
        court.notices row. NOTE: issuedTo and renderedBody are PLAINTEXT
        columns (no _enc) surfaced by a SELECT * repo; issuedTo can hold
        addressee PII and is returned UNMASKED to all NOTICE_READ_ROLES —
        inconsistent with the party/certified-copy encrypt+mask pattern.
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        noticeType: { type: string }
        issuedTo: { type: [string, "null"] }
        status: { type: string }
        issueDate: { type: string }
        renderedBody: { type: [string, "null"] }
        version: { type: integer }
    NoticeService:
      type: object
      description: >-
        court.notice_service row. recipient and proof are PLAINTEXT columns
        (SELECT *); recipient can hold PII and is returned UNMASKED.
      properties:
        id: { type: string, format: uuid }
        noticeId: { type: string, format: uuid }
        serviceMode: { type: string }
        recipient: { type: [string, "null"] }
        dispatchRef: { type: [string, "null"] }
        deliveryStatus: { type: string }
        servedAt: { type: [string, "null"] }
        proof: { type: [string, "null"] }
        version: { type: integer }
    Compliance:
      type: object
      description: court.compliance_directions row.
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        orderId: { type: [string, "null"], format: uuid }
        direction: { type: string }
        responsibleAuthority: { type: [string, "null"] }
        dueDate: { type: [string, "null"] }
        status: { type: string }
        progressNotes: { type: [string, "null"] }
        closedAt: { type: [string, "null"] }
        version: { type: integer }
    Appeal:
      type: object
      description: court.appeals row.
      properties:
        id: { type: string, format: uuid }
        originalCaseId: { type: string, format: uuid }
        appellateCaseId: { type: [string, "null"], format: uuid }
        appealType: { type: string }
        grounds: { type: string }
        status: { type: string }
        filedDate: { type: string }
        decidedDate: { type: [string, "null"] }
        decisionSummary: { type: [string, "null"] }
        version: { type: integer }
    Parcel:
      type: object
      description: court.case_parcels row. areaSqm is a bigint serialised to string.
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        surveyNumber: { type: string }
        khasraNumber: { type: [string, "null"] }
        khataNumber: { type: [string, "null"] }
        village: { type: string }
        tehsil: { type: [string, "null"] }
        district: { type: [string, "null"] }
        areaSqm: { type: [string, "null"], description: "bigint as string" }
        subjectType: { type: [string, "null"] }
        ownershipRef: { type: [string, "null"] }
        remarks: { type: [string, "null"] }
        active: { type: boolean }
        version: { type: integer }
    CertifiedCopy:
      type: object
      description: >-
        court.certified_copies row, hand-serialised. applicantName decrypts
        from applicant_name_enc and is revealed only to PII_PRIVILEGED_ROLES
        (else null). feeMinor is a bigint serialised to string.
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        orderId: { type: [string, "null"], format: uuid }
        documentRef: { type: [string, "null"] }
        applicantName: { type: [string, "null"] }
        copiesCount: { type: integer }
        urgent: { type: boolean }
        feeMinor: { type: string, description: "bigint as string" }
        feeSource: { type: [string, "null"] }
        status: { type: string }
        requestedBy: { type: [string, "null"] }
        issuedBy: { type: [string, "null"] }
        issuedAt: { type: [string, "null"] }
        deliveryMode: { type: [string, "null"] }
        remarks: { type: [string, "null"] }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    CauseListItem:
      type: object
      description: court.cause_list_items row.
      properties:
        id: { type: string, format: uuid }
        causeListId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        itemNumber: { type: integer }
        slot: { type: string }
        courtroom: { type: string }
        listDate: { type: [string, "null"] }
        version: { type: integer }
    Defect:
      type: object
      description: court.case_defect row.
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        scrutinyId: { type: [string, "null"], format: uuid }
        category: { type: string }
        description: { type: string }
        severity: { type: string }
        status: { type: string }
        rectificationDeadline: { type: [string, "null"] }
        version: { type: integer }
    ConfigEntry:
      type: object
      description: court.config_entries row.
      properties:
        id: { type: string, format: uuid }
        namespace: { type: string }
        configKey: { type: string }
        value: {}
        label: { type: [string, "null"] }
        description: { type: [string, "null"] }
        active: { type: boolean }
        sortOrder: { type: [integer, "null"] }
        effectiveFrom: { type: [string, "null"] }
        effectiveTo: { type: [string, "null"] }
        version: { type: integer }
    Establishment:
      type: object
      description: >-
        court.public_establishments row (public projection). publicUrl is a
        computed field (publicCaseUrl(publicSlug)). No PII, no tenantId leak in
        the public listing projection: courtName, publicSlug, establishmentCode.
      properties:
        courtName: { type: string }
        publicSlug: { type: string }
        establishmentCode: { type: string }
        publicUrl: { type: string, description: "computed" }
    PublicDocket:
      type: object
      description: >-
        toPublicDocket() projection over court.cases — PUBLIC record fields
        only. Deliberately omits id, tenantId, courtId, parties, and all PII.
      properties:
        cnrNumber: { type: string }
        caseType: { type: [string, "null"] }
        title: { type: [string, "null"] }
        status: { type: string }
        stage: { type: [string, "null"] }
        filingDate: { type: [string, "null"] }
        disposalDate: { type: [string, "null"] }
    Analytics:
      type: object
      description: >-
        Computed aggregate over court.cases. instituted/disposed/pending/
        avgPendencyDays/oldestPendingDays are computed, not columns.
        clearanceRatePct = round(disposed/instituted*100,1) or null.
      properties:
        period:
          type: object
          properties: { from: { type: string }, to: { type: string } }
        instituted: { type: integer }
        disposed: { type: integer }
        pending: { type: integer }
        avgPendencyDays: { type: integer }
        oldestPendingDays: { type: integer }
        clearanceRatePct: { type: [number, "null"], description: "computed" }
        source: { type: string, enum: [db] }
    Pendency:
      type: object
      description: Computed group-by-status counts. total is computed (sum).
      properties:
        summary:
          type: array
          items:
            type: object
            properties: { status: { type: string }, count: { type: integer } }
        total: { type: integer, description: "computed" }
        source: { type: string, enum: [db] }
  responses:
    ErrorResponse:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
security:
  - bearerAuth: []
paths:
  # ─────────────────────────── case-registry ───────────────────────────
  /v1/court/cases:
    post:
      tags: [case-registry]
      summary: Register a new case
      x-roles: [registrar, court_admin, super_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cnrNumber, caseType, filingDate, title, courtId, parties]
              properties:
                cnrNumber: { type: string, maxLength: 32 }
                caseType: { type: string, maxLength: 32 }
                filingNumber: { type: string, maxLength: 64 }
                filingDate: { type: string }
                title: { type: string, maxLength: 300 }
                courtId: { type: string, format: uuid }
                benchId: { type: string, format: uuid }
                parties:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [partyRole, name]
                    properties:
                      partyRole: { type: string }
                      name: { type: string }
                      address: { type: string }
                      phone: { type: string }
                      email: { type: string, format: email }
                      advocateName: { type: string }
                      advocateBarId: { type: string }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Accepted' } } } }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
    get:
      tags: [case-registry]
      summary: List cases (tenant-scoped, paginated)
      x-roles: [registrar, court_admin, super_admin, judge, court_clerk]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: courtId, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Case' } }
                  limit: { type: integer }
                  offset: { type: integer }
                  count: { type: integer }
                  source: { type: string, enum: [db] }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /v1/court/cases/overdue:
    get:
      tags: [case-registry]
      summary: Overdue cases (past SLA target, not disposed)
      x-roles: [registrar, court_admin, super_admin, judge, court_clerk]
      parameters:
        - { name: asOf, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Case' } }
                  count: { type: integer }
                  asOf: { type: string, description: "computed" }
                  source: { type: string, enum: [db] }
  /v1/court/cases/analytics:
    get:
      tags: [case-registry]
      summary: NCMS-style clearance-rate + pendency-age summary
      x-roles: [registrar, court_admin, super_admin, judge, court_clerk]
      parameters:
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Analytics' } } } }
  /v1/court/cases/pendency:
    get:
      tags: [case-registry]
      summary: Pending-case counts by status
      x-roles: [registrar, court_admin, super_admin, judge, court_clerk]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Pendency' } } } }
  /v1/court/cases/{id}:
    get:
      tags: [case-registry]
      summary: Fetch a single case with its parties
      x-roles: [registrar, court_admin, super_admin, judge, court_clerk]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Case' }
                  - type: object
                    properties:
                      parties: { type: array, items: { $ref: '#/components/schemas/Party' } }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  # ─────────────────────────── case-lifecycle ───────────────────────────
  /v1/court/cases/{id}/status:
    patch:
      tags: [case-lifecycle]
      summary: Transition a case to a new status
      x-roles: [registrar, court_admin, judge, super_admin]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toStatus, expectedVersion]
              properties:
                toStatus: { type: string }
                expectedVersion: { type: integer, minimum: 1 }
                reason: { type: string, maxLength: 1000 }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Accepted' } } } }
  # ─────────────────────────── court-registry ───────────────────────────
  /v1/court/courts:
    post:
      tags: [court-registry]
      summary: Create a court/authority
      x-roles: [court_admin, super_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, courtType]
              properties:
                name: { type: string, maxLength: 300 }
                courtType: { type: string, maxLength: 32 }
                jurisdiction: { type: string }
                establishmentCode: { type: string }
                parentCourtId: { type: string, format: uuid }
                address: { type: string }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Accepted' } } } }
    get:
      tags: [court-registry]
      summary: List courts
      x-roles: [court_admin, super_admin, registrar, judge, court_clerk]
      parameters:
        - { name: courtType, in: query, schema: { type: string } }
        - { name: parentCourtId, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Court' } }
                  limit: { type: integer }
                  offset: { type: integer }
                  count: { type: integer }
                  source: { type: string, enum: [db] }
  /v1/court/courts/{id}:
    get:
      tags: [court-registry]
      summary: Get one court + its benches
      x-roles: [court_admin, super_admin, registrar, judge, court_clerk]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  court: { $ref: '#/components/schemas/Court' }
                  benches: { type: array, items: { $ref: '#/components/schemas/Bench' } }
                  source: { type: string, enum: [db] }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /v1/court/courts/{id}/benches:
    post:
      tags: [court-registry]
      summary: Create a bench under a court
      x-roles: [court_admin, super_admin]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 300 }
                presidingJudgeId: { type: string, format: uuid }
                benchType: { type: string }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Accepted' } } } }
    get:
      tags: [court-registry]
      summary: List benches of a court
      x-roles: [court_admin, super_admin, registrar, judge, court_clerk]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Bench' } }
                  count: { type: integer }
                  source: { type: string, enum: [db] }
  # ─────────────────────────── hearing ───────────────────────────
  /v1/court/cases/{id}/hearings:
    post:
      tags: [hearing]
      summary: Schedule a hearing on a case
      x-roles: [registrar, court_admin, judge, super_admin]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduledAt]
              properties:
                benchId: { type: string, format: uuid }
                scheduledAt: { type: string, format: date-time }
                purpose: { type: string }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Accepted' } } } }
    get:
      tags: [hearing]
      summary: List a case's hearings
      x-roles: [registrar, court_admin, judge, court_clerk, super_admin]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Hearing' } }
                  count: { type: integer }
                  source: { type: string, enum: [db] }
  /v1/court/hearings/{id}/adjourn:
    patch:
      tags: [hearing]
      summary: Adjourn a hearing
      x-roles: [registrar, court_admin, judge, super_admin]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content:
