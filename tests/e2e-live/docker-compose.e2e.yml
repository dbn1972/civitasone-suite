version: "3.9"

services:
  # ─── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: civitasone
      POSTGRES_PASSWORD: civitasone
      POSTGRES_DB: civitasone
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civitasone"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs,s3
      DEFAULT_REGION: ap-south-1
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Application Services ────────────────────────────────────────────────────
  gateway:
    image: civitasone/gateway-service:latest
    build:
      context: ../../
      dockerfile: Dockerfile
      args:
        SERVICE: gateway-service
        PORT: "8080"
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: test
      PORT: "8080"
      JWT_SECRET: test_secret_for_civitasone_32chr
      DATABASE_URL: postgres://civitasone:civitasone@postgres:5432/civitasone
      REDIS_URL: redis://redis:6379
      QUEUE_DRIVER: sqs
      AWS_ENDPOINT: http://localstack:4566
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  identity:
    image: civitasone/identity-service:latest
    build:
      context: ../../
      dockerfile: Dockerfile
      args:
        SERVICE: identity-service
        PORT: "3001"
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: test
      PORT: "3001"
      JWT_SECRET: test_secret_for_civitasone_32chr
      DATABASE_URL: postgres://civitasone:civitasone@postgres:5432/civitasone
      REDIS_URL: redis://redis:6379
      QUEUE_DRIVER: sqs
      AWS_ENDPOINT: http://localstack:4566
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  finance:
    image: civitasone/finance-service:latest
    build:
      context: ../../
      dockerfile: Dockerfile
      args:
        SERVICE: finance-service
        PORT: "3007"
    ports:
      - "3007:3007"
    environment:
      NODE_ENV: test
      PORT: "3007"
      JWT_SECRET: test_secret_for_civitasone_32chr
      DATABASE_URL: postgres://civitasone:civitasone@postgres:5432/civitasone
      REDIS_URL: redis://redis:6379
      QUEUE_DRIVER: sqs
      AWS_ENDPOINT: http://localstack:4566
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  procurement:
    image: civitasone/procurement-service:latest
    build:
      context: ../../
      dockerfile: Dockerfile
      args:
        SERVICE: procurement-service
        PORT: "3008"
    ports:
      - "3008:3008"
    environment:
      NODE_ENV: test
      PORT: "3008"
      JWT_SECRET: test_secret_for_civitasone_32chr
      DATABASE_URL: postgres://civitasone:civitasone@postgres:5432/civitasone
      REDIS_URL: redis://redis:6379
      QUEUE_DRIVER: sqs
      AWS_ENDPOINT: http://localstack:4566
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  hrms:
    image: civitasone/hrms-service:latest
    build:
      context: ../../
      dockerfile: Dockerfile
      args:
        SERVICE: hrms-service
        PORT: "3012"
    ports:
      - "3012:3012"
    environment:
      NODE_ENV: test
      PORT: "3012"
      JWT_SECRET: test_secret_for_civitasone_32chr
      DATABASE_URL: postgres://civitasone:civitasone@postgres:5432/civitasone
      REDIS_URL: redis://redis:6379
      QUEUE_DRIVER: sqs
      AWS_ENDPOINT: http://localstack:4566
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: civitasone/web:latest
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: test
      PORT: "3000"
      NEXT_PUBLIC_GATEWAY_URL: http://gateway:8080
      GATEWAY_URL: http://gateway:8080
      JWT_SECRET: test_secret_for_civitasone_32chr
    depends_on:
      gateway:
        condition: service_healthy
